<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample video site</title>
<!-- A pretend video website for tv-ui-check.js: the pointer is pictured over it and clicks it (no real site is used). -->
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f6; color: #111; }
  header { height: 72px; display: flex; align-items: center; gap: 28px; padding: 0 48px; background: #fff; border-bottom: 1px solid #ddd; }
  header b { font-size: 26px; color: #c4302b; }
  header a { font-size: 18px; color: #333; text-decoration: none; }
  header input { margin-left: auto; width: 420px; height: 40px; border: 1px solid #bbb; border-radius: 20px; padding: 0 18px; font-size: 17px; }
  main { display: flex; gap: 32px; padding: 28px 48px; }
  .player { position: relative; width: 1100px; height: 619px; background: #000 url('/assets/tv/theme/backgrounds/hearth-peaks.jpg') center/cover; border-radius: 12px; overflow: hidden; }
  .player button.play { position: absolute; left: 50%; top: 50%; width: 120px; height: 84px; margin: -42px 0 0 -60px; border: 0; border-radius: 20px; background: #c4302b; color: #fff; font-size: 40px; cursor: pointer; }
  .player .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(transparent, rgba(0,0,0,.7)); display: flex; align-items: center; gap: 18px; padding: 0 20px; color: #fff; }
  .player .bar button { background: none; border: 0; color: #fff; font-size: 22px; }
  aside { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .card { display: flex; gap: 14px; background: #fff; border-radius: 10px; padding: 10px; font-size: 17px; }
  .card span { width: 168px; height: 94px; border-radius: 8px; background: #ccd; flex: none; }
  h1 { font-size: 26px; margin: 18px 0 6px; }
  #said { font-size: 20px; color: #0a7d2c; min-height: 26px; }
  #menu { position: fixed; display: none; flex-direction: column; min-width: 240px; background: #fff; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); padding: 6px 0; font-size: 18px; }
  #menu span { padding: 10px 18px; } #menu span:first-child { background: #eef; }
  .more { height: 1400px; padding: 0 48px; font-size: 18px; color: #555; }
</style>
</head>
<body>
<header><b>▶ SampleTube</b><a href="#">Home</a><a href="#">Shows</a><a href="#">Live</a><input id="q" placeholder="Search"></header>
<main>
  <div>
    <div class="player"><button class="play" id="play" aria-label="Play">▶</button>
      <div class="bar"><button>⏮</button><button>▶</button><span>0:00 / 9:56</span><span style="flex:1"></span><button id="fs">⛶</button></div></div>
    <h1>Big Buck Bunny</h1><div id="said">Nothing clicked yet</div>
  </div>
  <aside>
    <div class="card"><span></span>Rocket launch, full replay</div>
    <div class="card"><span></span>Zoo cams: the bear enclosure</div>
    <div class="card"><span></span>Space and astronomy</div>
    <div class="card"><span></span>Espresso at home</div>
  </aside>
</main>
<div id="menu"><span>Copy video link</span><span>Copy video link at this time</span><span>Loop</span><span>Stats for nerds</span></div>
<div class="more">More videos further down the page…</div>
<script>
  // tv-ui-check.js's stand-in for ViewerActivity clicks what's under the pointer; the page says what it got.
  document.getElementById('play').addEventListener('click', function () { document.getElementById('said').textContent = 'Play clicked'; document.title = 'Sample video site · played'; });
  // The player's own right-click menu (as video sites have).
  document.getElementById('play').addEventListener('contextmenu', function (e) {
    e.preventDefault(); document.getElementById('said').textContent = 'Menu of the player';
    var m = document.getElementById('menu'); m.style.left = e.clientX + 'px'; m.style.top = e.clientY + 'px'; m.style.display = 'flex';
  });
  document.addEventListener('click', function () { document.getElementById('menu').style.display = 'none'; });
</script>
</body>
</html>
