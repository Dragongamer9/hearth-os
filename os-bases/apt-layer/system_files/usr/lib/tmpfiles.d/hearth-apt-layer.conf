# Hearth's added-apps layer (hearth-apt-layer, docs/APT-LAYER.md): where it keeps its layers, list and .deb
# copies, and what apt and debconf need in /var (the image's /var is empty; apt's caches aren't in it).
d /var/lib/hearth 0755 root root -
d /var/lib/hearth/layer 0755 root root -
d /var/lib/hearth/layer/debs 0755 root root -
d /var/lib/hearth/layer/usr 0700 root root -
d /var/cache/apt 0755 root root -
d /var/cache/apt/archives 0755 root root -
d /var/lib/apt/lists 0755 root root -
d /var/cache/debconf 0755 root root -
d /var/log/apt 0755 root root -
