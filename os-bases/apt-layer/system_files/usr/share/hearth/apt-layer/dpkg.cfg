# Hearth's added-apps layer (hearth-apt-layer, docs/APT-LAYER.md): after every change dpkg makes, bring the
# list of packages you added up to date. Copied to /etc/dpkg/dpkg.cfg.d/hearth-apt-layer by
# os-bases/apt-layer/image-setup.sh. Never fails dpkg.
post-invoke=test ! -e /run/hearth/apt-layer/active.json || /usr/libexec/nimbus/hearth-apt-layer record || true
