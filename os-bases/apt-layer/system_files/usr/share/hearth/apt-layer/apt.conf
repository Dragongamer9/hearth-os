// Hearth's writable layer (hearth-apt-layer, docs/APT-LAYER.md): apt's guard rails. Copied to
// /etc/apt/apt.conf.d/80-hearth-apt-layer by os-bases/apt-layer/image-setup.sh. They only act while the layer
// is mounted (hearth-apt-layer.service). Everything else you install, remove or upgrade is allowed and kept.
//  - hearth-apt-layer-debs (the .deb files about to be unpacked): refuses kernel, initramfs and boot loader
//    packages; keeps a copy of .deb files installed from a file (to put them back after updates offline).
//  - hearth-apt-layer apt-hook (the whole plan): refuses removing the kernel, initramfs, boot loader and the
//    packages Hearth's own tools need (/usr/share/hearth/apt-layer/protected).
// The kernel and boot packages are also pinned at the image's versions (/etc/apt/preferences.d/zz-hearth-image),
// so `apt upgrade` and `apt full-upgrade` pass them over.
DPkg::Pre-Install-Pkgs { "/usr/libexec/nimbus/hearth-apt-layer-debs"; "/usr/libexec/nimbus/hearth-apt-layer apt-hook"; };
DPkg::Tools::Options::/usr/libexec/nimbus/hearth-apt-layer-debs::Version "1";
DPkg::Tools::Options::/usr/libexec/nimbus/hearth-apt-layer::Version "3";
