// Hearth's added-apps layer (hearth-apt-layer, docs/APT-LAYER.md): apt's guard rails. Copied to
// /etc/apt/apt.conf.d/80-hearth-apt-layer by os-bases/apt-layer/image-setup.sh. They only act while the layer
// is mounted (hearth-apt-layer.service).
//  - hearth-apt-layer-debs (the .deb files about to be unpacked): refuses replacing, reinstalling or
//    downgrading a system package, and kernel/initramfs/boot loader packages; keeps a copy of .deb files
//    installed from a file (to put them back after updates without the internet).
//  - hearth-apt-layer apt-hook (the whole plan): refuses removing a system package.
// System packages are also pinned at the image's versions (/etc/apt/preferences.d/zz-hearth-image), so
// `apt upgrade` and `apt full-upgrade` only upgrade what you added.
DPkg::Pre-Install-Pkgs { "/usr/libexec/nimbus/hearth-apt-layer-debs"; "/usr/libexec/nimbus/hearth-apt-layer apt-hook"; };
DPkg::Tools::Options::/usr/libexec/nimbus/hearth-apt-layer-debs::Version "1";
DPkg::Tools::Options::/usr/libexec/nimbus/hearth-apt-layer::Version "3";
