# DNS through systemd-resolved (NetworkManager feeds it). /etc/resolv.conf can't be linked during the image
# build (the container runtime mounts it), so it's linked at boot.
# L+ (not L): put the link back at every start even when something replaced it with a plain file (Tailscale's
# DNS fallback did on the owner's laptop, Nov 2026: NetworkManager then tried resolvconf, every lookup failed and
# restarts never fixed it).
L+! /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
