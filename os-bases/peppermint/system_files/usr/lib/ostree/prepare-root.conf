# The system is mounted read-only. Peppermint's own deployments don't use composefs: ostree is built with composefs
# support only so this device can stage an image that does (moving to Hearth OS on Anatase, whose own
# prepare-root.conf turns it on for its deployments); "no" keeps Peppermint booting exactly as before.
[composefs]
enabled = no
[sysroot]
readonly = true
