# Hearth on Peppermint/Debian: keep the system log across restarts.
#
# This image is built with an empty /var (build.sh, "the bootc layout"): it empties /var and rebuilds what the
# packages had put there as tmpfiles.d entries, but /var/log* is left out of that walk on purpose (rotated logs
# are the machine's). So the built system has no /var/log/journal at all - and journald's default, Storage=auto,
# stores the journal there only *when that directory exists*, keeping it in /run/log/journal (memory) otherwise.
# A crash, a black screen or a dropped Wi-Fi connection then left nothing on the device to read afterwards, which
# is the one log that is wanted. The main Hearth OS edition never empties /var (os/build.sh), so whatever its
# base ships there stays; this base does empty it, so it has to ask for the journal to be kept.
#
# persistent stores the journal under /var/log/journal, creating the directory if it is missing, and still falls
# back to /run during early boot or when /var is not writable - systemd-journal-flush.service moves those files
# on to disk afterwards (journald.conf(5), Storage=).
[Journal]
Storage=persistent
