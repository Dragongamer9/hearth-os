# Peppermint is writable (hearth-unlock): this runs from the image's own /usr, never from the layer of packages you
# added, so a broken package can't stop the boot menu, the automatic fallback, an update or Recovery from working.
# /run/hearth/usr-image is the image's /usr, kept by hearth-unlock.service before the layer goes over /usr; without it
# (hearth-unlock didn't run) this runs as it always did.
[Unit]
After=hearth-unlock.service

[Service]
BindReadOnlyPaths=-/run/hearth/usr-image:/usr
