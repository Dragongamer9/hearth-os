# Hearth's own login screen (1.14, a test): SDDM stays off only on a start where hearth-login-select chose Hearth's
# login screen (/run/hearth/login-greetd, which /run never keeps across starts). Without that file SDDM starts as
# always. hearth-login-fallback removes the file and starts SDDM when Hearth's doesn't work.
[Unit]
After=hearth-login-select.service
ConditionPathExists=!/run/hearth/login-greetd
