# Hearth OS: NetworkManager runs every network (NetworkManager-wait-online is what waits for it). systemd-networkd
# manages nothing here, so its wait timed out after 2 minutes at every start ("Timeout occurred while waiting for
# network connectivity"), holding up everything that waits for the network. It runs only if you set up
# systemd-networkd yourself (a .network file in /etc/systemd/network).
[Unit]
ConditionDirectoryNotEmpty=/etc/systemd/network
