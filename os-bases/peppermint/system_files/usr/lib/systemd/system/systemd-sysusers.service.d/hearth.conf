# Hearth on Peppermint/Debian: create the system accounts a newer image added (listed in
# /usr/lib/sysusers.d/hearth-image.conf by build.sh) on every start. Upstream only runs this when /usr is newer
# than /etc, which never looks true on an ostree system (/usr's dates are fixed). An empty condition resets it.
[Unit]
ConditionNeedsUpdate=
