# Hearth OS: the power button sleeps, like SteamOS (the system's own default turns the device off on a tap).
# While Hearth's session runs, Hearth handles the button itself (nimbus-session holds logind's handle-power-key
# inhibitor; Settings › Power button: a press sleeps, a hold opens the power menu), so this is for the sign-in
# screen, or if Hearth isn't running. Holding the button for several seconds still forces the device off (that's
# the firmware's). Closing a lid sleeps too, plugged in or not; with an external screen in use it doesn't.
[Login]
HandlePowerKey=suspend
HandleSuspendKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
