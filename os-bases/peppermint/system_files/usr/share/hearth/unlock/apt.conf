// Hearth OS on Peppermint: the writable system (hearth-unlock, docs/BASE-PEPPERMINT.md). build.sh installs this as
// /etc/apt/apt.conf.d/50-hearth-unlock.
// apt's auto/manual marks live in /usr next to dpkg's database (/usr/lib/sysimage/dpkg), so each Hearth OS version's
// marks always match its own packages.
Dir::State::extended_states "/usr/lib/sysimage/apt/extended_states";
// A copy of every .deb installed from a file (not from a repository), so an update can put it back.
DPkg::Pre-Install-Pkgs { "/usr/bin/hearth-unlock --stash-debs || cat >/dev/null || true"; };
