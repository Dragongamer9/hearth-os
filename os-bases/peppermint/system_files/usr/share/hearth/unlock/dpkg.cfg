# Hearth OS on Peppermint: after every dpkg run (apt's too), the record of the packages you added follows, so an
# update can put them back (hearth-unlock). build.sh installs this as /etc/dpkg/dpkg.cfg.d/hearth-unlock.
post-invoke="if [ -x /usr/bin/hearth-unlock ]; then /usr/bin/hearth-unlock --record-later || true; fi"
