# Hearth OS on Anatase: the boot chain comes only with Hearth OS's updates (bootc), never from dnf, also with "Unlock
# the file system" on (red flag 2: an install must never stop the PC from starting). hearth-unlock checks this file
# is here and unchanged before it installs anything, and checks every plan as well.
[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-devel,grub2*,shim*,dracut*,ostree*,rpm-ostree*,bootc*,bootupd*,systemd-boot*,composefs*
