# Hearth OS on Anatase (test, 1.15): also runs without a plan, so a PC switched here by hand from Debian (sudo bootc
# switch, no plan written) gets its /etc set up for Fedora at its first start. hearth-clean-install does nothing unless
# Debian's accounts are still in /etc/passwd (its arrival_plan); your home folder is never touched by it.
[Unit]
ConditionPathExists=
ConditionPathExists=/usr/share/nimbus/image-info.json
