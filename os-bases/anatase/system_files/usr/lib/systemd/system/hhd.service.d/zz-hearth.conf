# (Named to sort after Anatase's own override.conf in this folder.)
# Hearth OS on Anatase: Handheld Daemon runs the controller, power limit, fan and lights, as on Anatase, but Hearth
# does the rest:
#  - updates (Settings › Updates through hearth-admin): HHD's bootc updater is off, and so is its fallback to
#    Anatase's own image (it would leave Hearth OS);
#  - the login screen's autologin (nimbus-autologin signs you into Hearth's session): HHD's Game Mode autologin
#    switch would point it at Anatase's Steam session instead.
[Service]
UnsetEnvironment=HHD_BOOTC HHD_BOOTC_FALLBACK_IMG HHD_BOOTC_SOFT_REBOOT HHD_GS_AUTOLOGIN
