# Hearth OS on Anatase (test, 1.15): a PC that came here from Hearth OS on Debian starts through Debian's signed shim
# and GRUB with Hearth's own menu (/boot/grub2/hearth-bls.cfg). Fedora's boot loader is never written over it by
# itself: with that menu there, bootupd's automatic update is skipped (red flag 2: switching back must keep working).
[Unit]
ConditionPathExists=!/boot/grub2/hearth-bls.cfg
