# Hearth OS on Anatase (test, 1.15): only on a PC whose boot menu is Hearth's own (it came here from Hearth OS on
# Debian: Debian's GRUB reads /boot/grub2/hearth-bls.cfg, it has no blscfg). There the menu must follow Anatase's
# updates and a rollback to Debian; on a PC with Fedora's own GRUB (blscfg) nothing runs.
[Unit]
ConditionPathExists=/boot/grub2/hearth-bls.cfg
