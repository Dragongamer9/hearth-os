# Hearth on Ubuntu: Ubuntu's kernel can restrict unprivileged user namespaces to programs with an AppArmor
# profile (Ubuntu's apparmor package ships those profiles; this image has no AppArmor userspace or profiles).
# Steam's runtime (pressure-vessel/bwrap), Proton, Flatpak, Hearth Browser's Chromium sandbox and Couch Co-op's
# bubblewrap all need user namespaces, as on SteamOS, Bazzite and Debian, so the restriction is off.
kernel.apparmor_restrict_unprivileged_userns = 0
