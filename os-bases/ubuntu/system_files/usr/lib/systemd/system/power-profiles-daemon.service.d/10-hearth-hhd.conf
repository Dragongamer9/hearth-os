# Hearth: Handheld Daemon provides the power profiles D-Bus service (net.hadess.PowerProfiles) itself, with the
# device's real power limits behind it, and the two can't both own that name. power-profiles-daemon only runs
# when Handheld Daemon is switched off (sudo touch /etc/hearth/no-hhd).
[Unit]
ConditionPathExists=/etc/hearth/no-hhd
