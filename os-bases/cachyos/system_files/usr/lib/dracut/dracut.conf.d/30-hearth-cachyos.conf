# Hearth on CachyOS: a generic initramfs (boots any PC) with ostree's root setup (ostree-prepare-root), bootc's
# module and the boot splash. Nvidia's modules load later from the system (only on Nvidia cards); nouveau stays out
# (nvidia-utils blacklists it anyway).
hostonly="no"
reproducible="yes"
compress="zstd"
add_dracutmodules+=" ostree bootc plymouth "
omit_drivers+=" nouveau nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem "
# Arch's dracut doesn't find these for bootc's module by itself (bootcrew's arch-bootc sets the same).
systemdsystemconfdir=/etc/systemd/system
systemdsystemunitdir=/usr/lib/systemd/system
