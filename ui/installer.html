<!doctype html>
<!--
  Hearth OS installer: what the Hearth USB shows. Install-only, full screen, controller first (touch, mouse and keyboard
  work too). The Hearth app (hosts/hearth-rs) opens this page instead of index.html when /etc/hearth-installer exists.
  The install itself is the same engine as always (os/live/src/hearth-install, through hearth-core's osinstall.rs);
  this page only asks:
    Welcome (controllers: Bluetooth ones in pairing mode pair by themselves; language, screen rotation, the look) >
    Internet (optional: the offline USB has everything) > the drive (browse with ◀ ▶, hold A to erase) > you (name,
    PC name, password or none) > time zone (guessed online, quick picks, or the full list) > a last look > install >
    done (take out the USB, restart into Hearth OS, which starts in Steam Game Mode).
  Looks: the same eight as Mantel and hearthos.fun, coloured from Mantel's palettes (ui/installer-looks.js, made by
  tools/installer-looks.py from hosts/linux/desktop/theme/palettes.json). Hearth, dark is the default and is built in
  here (:root below), so a missing or broken looks file only means the picker isn't offered. A look the person picks
  goes along in the plan ("look": {name, mode}) and becomes the new user's starting look (desktop.json); nothing is
  sent when they didn't pick one.
  First-time setup is folded in here: the installed system doesn't run the old Game Mode setup screens any more.
  Opened in a plain browser it runs against a pretend PC (MOCK), for previews (tools/installer-check.py).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Hearth OS</title>
<style>
:root{
  /* Hearth, dark (palettes.json "hearth"), as lookVars('hearth', 'dark') makes it: the page's own look, and what it
     falls back to whenever a look can't be used (tools/installer-check.py checks the two agree). */
  --bg:#0f0b09; --bg2:#17110e; --panel:rgba(38,29,24,.78); --panel2:rgba(255,255,255,.055); --panel3:#33271f;
  --line:rgba(255,138,61,.12); --text:#f4ece3; --muted:#a69484; --danger:#ff5d5d; --accent:#ff8a3d; --accent2:#ffd166;
  --ink:#2a1206; --accent-soft:rgba(255,138,61,.14); --accent-line:rgba(255,138,61,.3); --glow:rgba(255,138,61,.22);
  --accent2-soft:rgba(255,209,102,.2); --btn-hi:#ffa34b; --ok:#7fd88f; --warm:#ffae52; --win:#6fa3ff; --scrim:rgba(15,11,9,.6);
  --r:16px; --font:"Inter","Noto Sans","DejaVu Sans",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
html{background:var(--bg)}
body{background:radial-gradient(1000px 560px at 78% 60%,var(--glow),transparent 62%),radial-gradient(900px 400px at 50% 110%,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0}
svg{display:block}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:fixed;inset:0;z-index:1;overflow:hidden}
/* the bar at the top of the middle screens */
#top{position:fixed;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:12px;padding:0 44px;z-index:5}
#top .fl{width:30px;height:30px}
#top b{font-size:17px;font-weight:700}
#top .sub{color:var(--muted);font-size:14px}
#steps{margin-left:auto;display:flex;gap:6px;font-size:13px;color:var(--muted)}
#steps i{font-style:normal;padding:6px 13px;border-radius:14px;background:var(--panel2);white-space:nowrap}
#steps i.on{background:var(--accent);color:var(--ink);font-weight:700}
#steps i.done{color:var(--warm)}
body[data-step=welcome] #top,body[data-step=install] #top,body[data-step=done] #top,body[data-step=failed] #top{display:none}
.screen{position:absolute;top:100px;bottom:66px;left:0;right:0;max-width:1000px;margin:0 auto;padding:0 40px;display:flex;flex-direction:column;animation:in .3s var(--ease)}
.screen.wide{max-width:1140px}
.screen.center{justify-content:center;align-items:center;text-align:center;top:40px}
.screen.full{top:0;bottom:0;max-width:none;padding:0}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.18em;font-size:13px;text-transform:uppercase}
h1{font-size:46px;font-weight:850;letter-spacing:-.015em;line-height:1.05;margin:6px 0 10px}
h1.xl{font-size:62px;line-height:1.0;letter-spacing:-.025em;margin:14px 0 0}
.lead{color:var(--muted);font-size:18px;line-height:1.45;margin:0 0 24px;max-width:780px}
.center .lead{margin-left:auto;margin-right:auto}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 8px 16px;margin:0 -8px;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}
.ok{color:var(--ok)!important}.warn{color:var(--warm)!important}.bad{color:var(--danger)!important}.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.list{padding:12px;display:flex;flex-direction:column;gap:8px}
/* rows (Wi-Fi networks, switches, messages) */
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:12px 18px;border-radius:calc(var(--r) * .75);background:var(--panel2);text-align:left;cursor:pointer;outline:none;position:relative;transition:background .15s,box-shadow .15s}
.row:hover{background:var(--accent-soft)}
.row.f{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.row[disabled],.row.static{cursor:default}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:18px;font-weight:650}
.row small{display:block;color:var(--muted);font-size:14px;margin-top:3px;line-height:1.35}
.row .v{color:var(--muted);font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.row .v svg{width:18px;height:18px}
.ic{width:44px;height:44px;flex:0 0 44px;border-radius:calc(var(--r) * .7);background:var(--accent-soft);display:grid;place-items:center;color:var(--warm)}
.ic svg{width:24px;height:24px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin:6px 6px 0 0;background:var(--panel2)}
/* buttons */
.acts{display:flex;gap:14px;align-items:center;justify-content:flex-end;padding-top:16px}
.center .acts{justify-content:center}
.btn{height:54px;min-width:120px;padding:0 30px;border-radius:min(27px,calc(var(--r) * 1.7));background:var(--panel2);color:var(--text);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;outline:none;white-space:nowrap;transition:box-shadow .15s,transform .15s,background .15s}
.btn svg{width:20px;height:20px}
.btn:hover{background:var(--accent-soft)}
.btn.p{background:linear-gradient(90deg,var(--accent),var(--btn-hi));color:var(--ink);box-shadow:0 0 0 3px var(--accent-line),0 10px 30px var(--glow)}
.btn.d{background:var(--danger);color:#fff;box-shadow:0 0 0 3px rgba(229,72,77,.3)}
.btn.lg{height:62px;font-size:19px;padding:0 38px;border-radius:min(31px,calc(var(--r) * 1.9))}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.icon{min-width:54px;width:54px;padding:0}
.btn.icon.lg{width:62px;min-width:62px}
.btn.f{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent),0 10px 30px var(--glow);transform:scale(1.04)}
.btn.ghost.f{color:var(--text)}
.btn[aria-disabled=true]{opacity:.55}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0 100% 0 0;background:rgba(255,255,255,.24)}
.hold .lbl{position:relative}
/* the big flame */
.bigflame{position:absolute;right:-30px;top:120px;width:620px;height:620px;filter:drop-shadow(0 30px 120px var(--glow));pointer-events:none}
.bigflame.hot{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:drop-shadow(0 30px 120px var(--glow))}50%{filter:drop-shadow(0 30px 160px var(--accent-line))}}
.hero{position:absolute;left:0;top:0;bottom:0;width:660px;padding:84px 70px 86px;display:flex;flex-direction:column;z-index:2}
.hero.mid{justify-content:center;padding-top:0;padding-bottom:40px}
.ember{position:absolute;border-radius:50%;background:var(--btn-hi);box-shadow:0 0 8px var(--accent);animation:rise 7s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-420px);opacity:0}}
/* Welcome: the look chips, the controller tiles */
.lookbar{position:absolute;top:26px;right:44px;display:flex;gap:10px;z-index:4}
.chip{height:42px;padding:0 16px;border-radius:21px;background:var(--panel);border:1px solid var(--accent-line);color:var(--text);display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;cursor:pointer;outline:none;white-space:nowrap}
.chip svg{width:18px;height:18px}
.chip.f{box-shadow:0 0 0 3px var(--accent)}
.chip.on{background:var(--accent-soft);color:var(--warm)}
.sw{display:flex;padding-left:4px}.sw i{width:14px;height:14px;border-radius:7px;margin-left:-4px;border:2px solid var(--bg)}
.pads-h{display:flex;align-items:center;gap:12px;margin-top:30px;font-size:15px}
.pads-h .st{color:var(--muted);font-size:14.5px}
.scan{width:10px;height:10px;flex:0 0 10px;border-radius:5px;background:var(--muted);margin:0 4px}
.scan.on{background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft),0 0 0 14px var(--accent-soft);animation:ping 1.8s ease-in-out infinite}
@keyframes ping{0%,100%{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 9px transparent}50%{box-shadow:0 0 0 6px var(--accent-soft),0 0 0 14px var(--accent-soft)}}
.tiles{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.tile{width:156px;min-height:122px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);padding:15px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;font-size:14px;text-align:left;outline:none}
.tile svg{width:28px;height:28px}
.tile b{display:block;font-size:15.5px;line-height:1.2}
.tile .s{display:block;margin-top:3px;font-size:14px}
.tile .s.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 8px var(--ok)}
.tile.pad-ok svg{color:var(--accent)}
.tile.pad-busy .s{color:var(--warm)}
.tile.pad-bad{cursor:pointer}
.tile.pad-bad .s{color:var(--danger)}
.tile.pad-bad .again{display:inline-block;margin-top:6px;font-weight:700;color:var(--warm)}
.tile.f{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft);transform:scale(1.04)}
.tile.tip{border:2px dashed var(--accent-line);background:transparent;color:var(--muted);font-size:13px;line-height:1.35}
.tile.tip svg{width:22px;height:22px}
.dots3 i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:2px;background:var(--accent);vertical-align:middle;animation:dot 1.4s ease-in-out infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.padtip{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.4;max-width:520px}
.welcome-acts{margin-top:auto;display:flex;gap:14px;align-items:center;padding-top:18px}
/* Drive: cards to browse */
.drives{display:flex;gap:20px;overflow-x:auto;overflow-y:hidden;padding:14px 10px 18px;margin:0 -10px;scroll-behavior:smooth;scrollbar-width:none}
.drives::-webkit-scrollbar{display:none}
.dcard{flex:0 0 calc((100% - 40px) / 3);min-width:250px;min-height:250px;padding:26px;text-align:left;display:flex;flex-direction:column;cursor:pointer;outline:none;transition:transform .18s var(--ease),box-shadow .18s,background .18s}
.dcard.one{flex-basis:min(440px,100%)}
.dcard[disabled]{opacity:.45;cursor:default}
.dcard .nm{display:block;font-size:24px;font-weight:750;margin-top:18px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .sub{color:var(--muted);margin-top:5px;font-size:15px}
.dcard.cur{box-shadow:inset 0 0 0 2px var(--accent-line)}
.dcard.f{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.pbar{height:10px;border-radius:5px;background:var(--panel2);margin-top:auto;overflow:hidden;display:flex;gap:2px}
.pbar i{display:block;height:100%;min-width:3px}
.legend{margin-top:12px;font-size:14px;line-height:1.6}
.legend span{display:inline-flex;align-items:center;gap:7px;margin-right:14px}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,var(--muted))}
.dcard .why{margin-top:auto;font-size:14px;color:var(--danger)}
/* Erase */
.warnbig{width:96px;height:96px;border-radius:48px;margin:0 auto;background:rgba(229,72,77,.14);display:grid;place-items:center;color:var(--danger)}
.warnbig svg{width:48px;height:48px}
/* About you */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.field{display:flex;flex-direction:column;gap:7px}
.field.wide{grid-column:1 / -1}
.field label{color:var(--muted);font-size:13.5px;font-weight:600}
.field input{height:56px;border-radius:calc(var(--r) * .75);border:2px solid transparent;background:var(--panel2);color:var(--text);font:inherit;font-size:18px;padding:0 16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input.f{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field .hint{font-size:13px;color:var(--muted);min-height:17px}
.field .hint.bad{color:var(--danger)}
.switch .knob{width:52px;height:30px;border-radius:15px;background:var(--panel3);position:relative;flex:0 0 52px;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:var(--text);transition:left .2s}
.switch.on .knob{background:var(--accent)}.switch.on .knob::after{left:26px;background:var(--ink)}
/* Time zone */
.tzbig{padding:24px 28px;display:flex;align-items:center;gap:22px}
.tzbig .ic{width:64px;height:64px;flex-basis:64px}.tzbig .ic svg{width:34px;height:34px}
.tzbig .nm{font-size:32px;font-weight:800;line-height:1.1}
.tzbig .sub{color:var(--muted);margin-top:4px;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chips .chip{height:40px;border-color:transparent;background:var(--panel2)}
.chips .chip.on{background:var(--accent-soft);color:var(--warm)}
.zones{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.zones .row{min-height:52px;padding:8px 18px}
.zones .row b{font-size:16.5px}
.zones .row.sel{background:var(--accent-soft)}
/* Review */
.summary{margin-top:2px;padding:6px 26px;display:grid;grid-template-columns:200px 1fr;font-size:17px}
.summary dt,.summary dd{padding:13px 0;margin:0;border-top:1px solid var(--line)}
.summary dt:first-of-type,.summary dd:first-of-type{border-top:0}
.summary dt{color:var(--muted)}.summary dd{font-weight:600}
/* Installing */
.topprog{position:fixed;left:0;right:0;top:0;height:4px;background:var(--panel2);z-index:6}
.topprog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--btn-hi));transition:width .6s ease}
.huge{font-size:124px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:10px}
.huge .pc{font-size:62px;color:var(--warm)}
.checklist{margin-top:30px;display:flex;flex-direction:column;gap:13px;font-size:16px}
.checklist div{display:flex;align-items:center;gap:12px;color:var(--muted)}
.checklist div::before{content:"";width:10px;height:10px;border-radius:6px;border:2px solid currentColor;flex:0 0 10px}
.checklist .done{color:var(--ok)}
.checklist .done::before{content:"✓";border:0;width:14px;flex-basis:14px;height:auto;font-weight:800;font-size:15px;line-height:1}
.checklist .now{color:var(--text);font-weight:650}
.checklist .now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
/* hints, toast, splash, modal, picker, keyboard */
#hints{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;justify-content:flex-end;gap:22px;padding:0 44px;color:var(--muted);font-size:14px;z-index:5;pointer-events:none}
#hints .k{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--panel3);color:var(--text);font-weight:700;font-size:12px;margin-right:7px}
#hints .left{margin-right:auto}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel3);color:var(--text);padding:14px 22px;border-radius:calc(var(--r) * .75);box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:16px;transition:opacity .2s,transform .2s;z-index:70;max-width:80vw;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#splash{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg2),var(--bg));transition:opacity .6s}
#splash .in{text-align:center;animation:pop 1.1s ease-out both}
#splash .mark{width:170px;height:170px;margin:0 auto}
#splash .word{margin-top:22px;font-size:26px;font-weight:600;letter-spacing:.5em;padding-left:.5em}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#splash.out{opacity:0;pointer-events:none}
#modal{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;z-index:30;padding-top:12vh}
#modal.on{display:flex}
#modal .box{width:min(640px,90vw);background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h2{margin:0 0 6px;font-size:24px}
#picker{position:fixed;inset:0;z-index:25;display:none;background:rgba(0,0,0,.28)}
#picker.on{display:block}
#picker .pick{position:absolute;top:80px;right:44px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow-y:auto;padding:18px;background:var(--bg2);box-shadow:0 30px 80px rgba(0,0,0,.55);animation:in .2s var(--ease)}
#picker .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
#picker .ph b{font-size:17px}
#picker .ph small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
.seg{display:flex;background:var(--panel2);border-radius:20px;padding:4px;gap:4px;flex:0 0 auto}
.seg button{padding:7px 14px;border-radius:16px;font-size:13px;font-weight:650;cursor:pointer;outline:none}
.seg button.on{background:var(--accent);color:var(--ink)}
.seg button.f{box-shadow:0 0 0 2px var(--text)}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.lk{border-radius:12px;padding:8px;background:var(--panel2);font-size:13px;font-weight:650;text-align:left;cursor:pointer;outline:none;transition:transform .15s,box-shadow .15s}
.lk .prev{height:58px;border-radius:8px;margin-bottom:7px;position:relative;overflow:hidden}
.lk .prev i{position:absolute;left:8px;right:8px;top:7px;height:6px;border-radius:3px}
.lk .prev u{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:40%;height:8px;border-radius:4px}
.lk .prev svg{position:absolute;left:50%;top:18px;width:22px;height:22px;transform:translateX(-50%)}
.lk small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lk.on{box-shadow:inset 0 0 0 2px var(--accent-line)}
.lk.f{box-shadow:0 0 0 3px var(--accent);transform:scale(1.04)}
#osk{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:14px 18px 18px;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#osk.on{display:block;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#osk .preview{max-width:1000px;margin:0 auto 12px;height:48px;border-radius:calc(var(--r) * .6);background:var(--panel2);display:flex;align-items:center;padding:0 16px;font-size:20px}
#osk .preview .lbl{color:var(--muted);font-size:14px;margin-right:14px}
#osk .row{display:flex;gap:8px;justify-content:center;margin:0 auto 8px;max-width:1000px;min-height:0;padding:0;background:none;box-shadow:none;cursor:default}

// ------------------------------------------------------------------ controllers (Welcome)
// Wired and built-in controllers show from the Gamepad API (they just work). Bluetooth ones in pairing mode are paired
// by themselves through hearth-core's "Connect a controller" (bt.autoPads: controllers only, never keyboards or
// headsets; scanning stops while one pairs, a failed one is tried again a few times). Nothing here ever blocks: no
// Bluetooth, a broken Bluetooth stack or a controller that won't pair only changes what the tiles say.
const PADS = {bt: 'idle', bt_on: false, devs: [], gp: [], recheck: null, poll: null};

}

  return l.map(g => padName(g.id));
}

  const busy = list.some(d => d.state === 'pairing');
  const dots = '<span class="dots3"><i></i><i></i><i></i></span>';
  let st;
  if (none) st = list.length ? 'Ready to use' : '';
  else if (busy) st = `Connecting a controller${dots}`;
  else if (on) st = `${list.length ? 'Looking for more controllers' : 'Looking for controllers'}${dots}`;
  else st = list.length ? 'Ready to use' : 'Plug one in, or put a Bluetooth one in pairing mode';
  const tiles = list.map((d, i) => {
    if (d.state === 'paired') return `<div class="tile pad-ok">${IC.pad}<span><b>${esc(d.name)}</b><span class="s ok">Connected</span></span></div>`;
    if (d.state === 'pairing') return `<div class="tile pad-busy">${IC.pad}<span><b>${esc(d.name)}</b><span class="s">Pairing…</span></span></div>`;
    return `<button class="tile pad-bad" data-f data-k="pad-retry-${i}" data-act="act-padretry">${IC.pad}<span><b>${esc(d.name)}</b><span class="s">Couldn't connect</span><span class="again">Try again</span></span></button>`;

function padsRefresh() {

}
function padsPoll() {

const cur = () => focusables().find(e => e.classList.contains('f'));
function move(dir) {
  const els = focusables(); if (!els.length) return;
  const c = cur(); if (!c) return focus(els[0]);
  const r = c.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = Infinity;
  for (const e of els) {
    if (e === c) continue;
    const q = e.getBoundingClientRect(), x = q.left + q.width / 2, y = q.top + q.height / 2;
    const dx = x - cx, dy = y - cy;
    const along = dir === 'up' ? -dy : dir === 'down' ? dy : dir === 'left' ? -dx : dx;
    const across = dir === 'up' || dir === 'down' ? Math.abs(dx) : Math.abs(dy);
    if (along <= 4) continue;
    const s = along + across * 2.2;
    if (s < bs) { bs = s; best = e; }
  }
  if (best) { focus(best); tick(); }
}
function activate(el) {
  if (!el) return;
  if (el.closest('#osk')) return oskKey(el);
  if (el.closest('#modal') && el.dataset.mact) return modalDone(el.dataset.mact === 'ok');
  if (el.tagName === 'INPUT') { if (S.input === 'pad' || S.input === 'touch') return oskOpen(el); return nextField(el); }
  act(el);
}
function nextField(el) {
  const els = focusables(); const i = els.indexOf(el);
  if (el.closest('#modal')) return modalDone(true);
  const nxt = els.slice(i + 1).find(e => e.tagName === 'INPUT') || els.slice(i + 1).find(e => e.dataset.k === 'next') || els[i + 1];
  if (nxt) focus(nxt);
}
// Hold-to-confirm buttons (data-hold): A, Enter, Space or a press held that long.
let holding = null;
function holdStart(el) {
  if (!el || !el.dataset.hold || holding) return false;
  const ms = +el.dataset.hold, fill = el.querySelector('.fill'), t0 = performance.now();
  holding = {el, raf: 0};
  const stepFn = now => {
    const p = Math.min(1, (now - t0) / ms);
    if (fill) fill.style.right = (100 - p * 100) + '%';
    if (p >= 1) { holding = null; if (fill) fill.style.right = '100%'; act(el); return; }
    holding.raf = requestAnimationFrame(stepFn);
  };
  holding.raf = requestAnimationFrame(stepFn);
  return true;
}
function holdEnd() {
  if (!holding) return;
  cancelAnimationFrame(holding.raf);
  const f = holding.el.querySelector('.fill'); if (f) f.style.right = '100%';
  if (holding.el.isConnected) toast(S.input === 'pad' ? 'Keep holding Ⓐ until the bar fills' : 'Keep holding until the bar fills');
  holding = null;
}
function setInput(kind) {
  if (S.input === kind) return;
  S.input = kind; hints();
  const l = document.querySelector('[data-hold] .lbl');
  if (l) l.textContent = `${kind === 'pad' ? 'Hold Ⓐ' : kind === 'touch' ? 'Press and hold' : 'Hold Enter'} to erase this drive`;
}

document.addEventListener('keydown', e => {
  setInput('keys');
  const el = cur(), inInput = el && el.tagName === 'INPUT';
  if (e.key === 'F2' && inInput) { e.preventDefault(); return oskOpen(el); }
  if ($('#osk').classList.contains('on') && !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'].includes(e.key)) {
    // A real keyboard while the on-screen one is up types into the field as usual.
    if (OSK.target && e.key.length === 1) { e.preventDefault(); oskType(e.key); } else if (e.key === 'Backspace') { e.preventDefault(); oskType('\b'); }
    return;
  }
  switch (e.key) {
    case 'ArrowUp': case 'ArrowDown': e.preventDefault(); return move(e.key === 'ArrowUp' ? 'up' : 'down');
    case 'ArrowLeft': case 'ArrowRight': if (inInput) return; e.preventDefault(); return move(e.key === 'ArrowLeft' ? 'left' : 'right');
    case 'Tab': e.preventDefault(); return move(e.shiftKey ? 'up' : 'down');
    case 'Enter': case ' ':
      if (e.key === ' ' && inInput) return;
      e.preventDefault();
      if (e.repeat) return;
      if (el && el.dataset.hold) return holdStart(el);
      return activate(el);
    case 'Escape': e.preventDefault(); return goBack();
    case 'Backspace': if (!inInput) { e.preventDefault(); goBack(); } return;
  }
});
document.addEventListener('keyup', e => { if ((e.key === 'Enter' || e.key === ' ') && holding) holdEnd(); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.field;
  if (k && k !== 'wifipw') onField(k, e.target.value);
});
document.addEventListener('pointerdown', e => {
  setInput(e.pointerType === 'touch' ? 'touch' : 'keys');
  const el = e.target.closest('[data-f]'); if (!el || el.disabled) return;
  focus(el, true);
  if (el.dataset.hold) { e.preventDefault(); holdStart(el); return; }
});
document.addEventListener('pointerup', () => { if (holding) holdEnd(); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-f]'); if (!el || el.disabled || el.dataset.hold) return;
  if (el.tagName === 'INPUT') { if (S.input === 'touch') oskOpen(el); return; }
  activate(el);
});

// The controller (any the browser engine sees): D-pad / left stick move, A select (hold on hold buttons), B back,
// X the look picker on Welcome (backspace on the on-screen keyboard), Y the language on Welcome (shift on the
// keyboard), Start turns off on Welcome and finishes typing. Read through Hearth's controller reader
// (ui/pad/hearth-gamepad.js, docs/CONTROLLER-FOCUS.md): no presses while the window isn't in front, none carried over.
const PAD = {prev: {}, rep: {}};
function padLoop(now) {
  const pads = HearthGamepad.pads();
  const btn = {};
  for (const p of pads) {
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    const ax = p.axes || [];
    btn.a = btn.a || b(0); btn.b = btn.b || b(1); btn.x = btn.x || b(2); btn.y = btn.y || b(3); btn.start = btn.start || b(9);
    btn.up = btn.up || b(12) || ax[1] < -0.6; btn.down = btn.down || b(13) || ax[1] > 0.6;
    btn.left = btn.left || b(14) || ax[0] < -0.6; btn.right = btn.right || b(15) || ax[0] > 0.6;
  }
  for (const k of Object.keys(btn)) {
    const was = !!PAD.prev[k], is = !!btn[k];
    if (is && !was) { setInput('pad'); padPress(k, true); PAD.rep[k] = now + 380; }
    else if (is && was && ['up', 'down', 'left', 'right'].includes(k) && now > PAD.rep[k]) { padPress(k, false); PAD.rep[k] = now + 110; }
    else if (!is && was && k === 'a' && holding) holdEnd();
  }
  PAD.prev = btn;
}
function padPress(k, first) {
  const el = cur(), osk = $('#osk').classList.contains('on'), modal = $('#modal').classList.contains('on');
  if (k === 'up' || k === 'down' || k === 'left' || k === 'right') return move(k);
  if (!first) return;
  if (k === 'a') { if (el && el.dataset.hold) return holdStart(el); return activate(el); }
  if (k === 'b') return osk ? oskClose() : goBack();
  if (k === 'x') { if (osk) return oskType('\b'); if (PICK.on) return pickerClose(); if (S.step === 'welcome' && !modal) return pickerOpen(); return; }
  if (k === 'y') { if (osk) return oskShift(); if (el && el.tagName === 'INPUT') return oskOpen(el); if (S.step === 'welcome' && !modal && !PICK.on) return act({dataset: {act: 'act-lang'}}); return; }
  if (k === 'start') { if (osk) return oskClose(true); if (S.step === 'welcome' && !modal && !PICK.on) return act({dataset: {act: 'poweroff'}}); }
}
HearthGamepad.loop(padLoop);

function hints() {
  const pad = S.input === 'pad';
  const k = (key, label) => `<span><span class="k">${key}</span>${label}</span>`;
  const step = S.step;
  let h = '', left = S.disksInfo && S.disksInfo.offline ? 'Everything is on this USB stick: no internet needed' : '';
  if ($('#osk').classList.contains('on')) h = pad ? k('Ⓐ', 'Type') + k('Ⓧ', 'Delete') + k('Ⓨ', 'Shift') + k('☰', 'Done') + k('Ⓑ', 'Close') : k('Enter', 'Type') + k('Esc', 'Close');
  else if (PICK.on) h = pad ? k('✥', 'Move') + k('Ⓐ', 'Pick') + k('Ⓑ', 'Close') : k('Enter', 'Pick') + k('Esc', 'Close');
  else if (step === 'install') { h = ''; left = 'Keep the USB stick in and the PC plugged in'; }
  else if (step === 'welcome') { left = 'Mouse, keyboard and touch work too'; h = pad ? k('Ⓐ', 'Select') + (LOOKS ? k('Ⓧ', 'Look') : '') + k('Ⓨ', 'Language') + k('☰', 'Turn off') : k('Enter', 'Select'); }
  else {
    if (step === 'you') left = pad ? 'Ⓨ opens the on-screen keyboard' : 'F2 opens the on-screen keyboard';
    h = (step === 'drive' && S.disks && S.disks.length > 1 ? k(pad ? '◀▶' : '← →', 'Browse') : '')
      + (pad ? k('Ⓐ', step === 'confirm' ? 'Hold to erase' : step === 'you' ? 'Type' : 'Select') : k('Enter', step === 'confirm' ? 'Hold to erase' : 'Select'))
      + (step === 'you' ? (pad ? k('Ⓨ', 'Keyboard') : k('F2', 'Keyboard')) : '')
      + (back[step] ? (pad ? k('Ⓑ', 'Back') : k('Esc', 'Back')) : '');
  }
  $('#hints').innerHTML = `<span class="left">${esc(left)}</span>${h}`;
}

// ------------------------------------------------------------------ on-screen keyboard
const OSK = {target: null, shift: false, sym: false};
const ROWS = {
  abc: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', '-'], ['⇧', 'z', 'x', 'c', 'v', 'b', 'n', 'm', '.', '⌫'], ['&123', 'space', '_', 'Done']],
  sym: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')'], ['~', '`', '+', '=', '[', ']', '{', '}', '\\', '|'], ['⇧', ';', ':', "'", '"', ',', '<', '>', '/', '⌫'], ['abc', 'space', '?', 'Done']],
};
function oskRender() {
  const rows = OSK.sym ? ROWS.sym : ROWS.abc;
  const t = OSK.target, pw = t && t.type === 'password';
  const label = t ? (t.closest('.field') && t.closest('.field').querySelector('label') ? t.closest('.field').querySelector('label').textContent : 'Password') : '';
  const val = t ? (pw ? '•'.repeat(t.value.length) : t.value) : '';
  const keyCap = c => c.length === 1 && OSK.shift ? c.toUpperCase() : c === 'space' ? 'Space' : c;
  const w = c => c === 'space' ? 'w6' : c === 'Done' || c === '&123' || c === 'abc' ? 'w2' : c === '⇧' || c === '⌫' ? 'w2' : '';
  const prevKey = (document.querySelector('#osk .key.f') || {}).dataset?.k;
  $('#osk').innerHTML = `<div class="preview"><span class="lbl">${esc(label)}</span>${esc(val)}<span style="opacity:.6">|</span></div>`
    + rows.map((r, ri) => `<div class="row">${r.map((c, ci) => `<button class="key ${w(c)} ${c === '⇧' && OSK.shift ? 'on' : ''}" data-f data-k="osk-${ri}-${ci}" data-c="${esc(c)}">${esc(keyCap(c))}</button>`).join('')}</div>`).join('')
    + `<div class="keyhint">${S.input === 'pad' ? 'Ⓐ type · Ⓧ delete · Ⓨ shift · ☰ done · Ⓑ close' : 'Type on your keyboard or tap the keys'}</div>`;
  const want = (prevKey && document.querySelector(`#osk [data-k="${prevKey}"]`)) || document.querySelector('#osk [data-k="osk-1-0"]');
  if (want) { document.querySelectorAll('#osk .f').forEach(e => e.classList.remove('f')); want.classList.add('f'); }
}
function oskOpen(input) {
  OSK.target = input; OSK.shift = input.dataset.field === 'full' && !input.value; OSK.sym = false;
  $('#osk').classList.add('on'); oskRender(); hints();
  input.scrollIntoView({block: 'center'});
  call('osinstall.screen', {name: 'osk'}).catch(() => {});
}
function oskClose(doneTyping) {
  const t = OSK.target;
  $('#osk').classList.remove('on'); $('#osk').innerHTML = ''; OSK.target = null; hints();
  if (t && t.isConnected) { focus(t); if (doneTyping) nextField(t); }
}
function oskShift() { OSK.shift = !OSK.shift; oskRender(); }
function oskType(c) {
  const t = OSK.target; if (!t) return;
  if (c === '\b') t.value = t.value.slice(0, -1);
  else t.value += c;
  t.dispatchEvent(new Event('input', {bubbles: true}));
  oskRender();
}
function oskKey(el) {
  const c = el.dataset.c;
  if (c === '⇧') return oskShift();
  if (c === '⌫') return oskType('\b');
  if (c === 'space') return oskType(' ');
  if (c === '&123' || c === 'abc') { OSK.sym = !OSK.sym; return oskRender(); }
  if (c === 'Done') return oskClose(true);
  oskType(OSK.shift ? c.toUpperCase() : c);
  if (OSK.shift && OSK.target && OSK.target.dataset.field === 'full' && OSK.target.value.length === 1) { OSK.shift = false; oskRender(); }
}

// ------------------------------------------------------------------ modal, toast, sound
let MODAL = null;
function modalOpen(html, done) {
  MODAL = {done, back: cur()};
  $('#modalbox').innerHTML = html; $('#modal').classList.add('on');
  const f = document.querySelector('#modal [data-first]') || focusables()[0]; if (f) focus(f);
}
function modalDone(ok) { const m = MODAL; modalClose(); if (m && m.done) m.done(ok); }
function modalClose() {
  if (!MODAL) return;
  const back = MODAL.back; MODAL = null;
  $('#modal').classList.remove('on'); $('#modalbox').innerHTML = '';
  if (back && back.isConnected) focus(back); else render(true);
}
function confirmBox(title, sub, okLabel, run) {
  modalOpen(`<h2>${esc(title)}</h2><p class="lead" style="font-size:16px">${esc(sub)}</p>
    <div class="acts"><button class="btn ghost" data-f data-first data-k="m-cancel" data-mact="cancel">Cancel</button><button class="btn p" data-f data-k="m-ok" data-mact="ok">${esc(okLabel)}</button></div>`, ok => { if (ok) run(); });
}
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }
let AC = null;
function tone(f, d, v) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch (e) {}
}
const tick = () => tone(1400, 0.03, 0.015), blip = () => tone(880, 0.06, 0.03);

// ------------------------------------------------------------------ start
window.addEventListener('resize', () => { if (!overlayOpen() && S.step !== 'install') render(true); });
setTimeout(() => { $('#splash').classList.add('out'); }, 1500);
setTimeout(() => { go('welcome'); }, 1600);
// Get the drives and the network ready while the person reads the welcome screen.
setTimeout(() => { loadDisks(); scanWifi(false); }, 400);
</script>
