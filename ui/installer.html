<!doctype html>
<!--
  Hearth OS installer (1.1): what the Hearth USB shows. Install-only, full screen, controller first (touch, mouse and
  keyboard work too), in Mantel's Steam-style look (hosts/linux/desktop/theme/palettes.json, "steam"). The Hearth app
  (hosts/hearth-rs) opens this page instead of index.html when /etc/hearth-installer exists. The install itself is
  the same engine as always (os/live/src/hearth-install, through hearth-core's osinstall.rs); this page only asks:
    Welcome (language, screen rotation, controllers: Bluetooth ones in pairing mode pair by themselves) > Wi-Fi (optional: the offline USB has everything) > the drive (hold A to
    erase) > you (name, PC name, password or none) > time zone (guessed online) > a last look > install > remove the
    USB > restart into Hearth OS, which starts in Steam Game Mode.
  First-time setup is folded in here: the installed system doesn't run the old Game Mode setup screens any more.
  Opened in a plain browser it runs against a pretend PC (MOCK), for previews.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Hearth OS</title>
<style>
:root{
  /* Mantel's Steam-style look (palettes.json "steam", dark) */
  --bg:#171a21; --bg2:#1b2838; --panel:#1e2633; --panel2:#24303f; --panel3:#2a475e; --line:#32404f;
  --text:#dce5ed; --muted:#8f98a0; --danger:#e5484d; --accent:#1a9fff; --sky:#66c0f4; --ink:#06121d; --warm:#ffb347;
  --r:6px; --focus:0 0 0 2px var(--accent), 0 0 0 6px rgba(26,159,255,.25), 0 10px 30px rgba(0,0,0,.45);
  --font:"Inter","Noto Sans","DejaVu Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(1200px 700px at 50% 18%,rgba(26,159,255,.10),transparent 60%),linear-gradient(180deg,var(--bg2),#0e131a)}
button{font:inherit;color:inherit}
#top{position:fixed;top:0;left:0;right:0;height:72px;display:flex;align-items:center;gap:14px;padding:0 36px;z-index:5}
#top .mark{width:34px;height:34px}
#top .name{font-weight:700;font-size:18px;letter-spacing:.02em}
#top .sub{color:var(--muted);font-size:14px;margin-left:4px}
#dots{margin-left:auto;display:flex;gap:8px;align-items:center}
#dots i{width:8px;height:8px;border-radius:4px;background:var(--panel3);transition:width .25s,background .25s}
#dots i.on{width:26px;background:var(--accent)}
#dots i.done{background:var(--sky)}
#app{position:absolute;top:72px;bottom:64px;left:0;right:0;overflow:hidden}
.screen{height:100%;max-width:980px;margin:0 auto;padding:18px 40px 10px;display:flex;flex-direction:column;animation:in .28s ease-out}
.screen.center{justify-content:center;align-items:center;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:40px;font-weight:800;margin:6px 0 10px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:18px;line-height:1.45;margin:0 0 22px;max-width:760px}
.center .lead{margin-left:auto;margin-right:auto}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 8px 16px;margin:0 -8px;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:18px;width:100%;min-height:76px;padding:14px 20px;border:0;border-radius:var(--r);
  background:var(--panel);text-align:left;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;outline:none;position:relative}
.card:hover{background:var(--panel2)}
.card.f{background:var(--panel2);box-shadow:var(--focus);transform:scale(1.012)}
.card[disabled]{opacity:.45;cursor:default}
.card .ic{width:46px;height:46px;flex:0 0 46px;border-radius:var(--r);background:var(--panel3);display:grid;place-items:center}
.card .ic svg{width:26px;height:26px}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:19px;font-weight:650}
.card small{display:block;color:var(--muted);font-size:14.5px;margin-top:4px;line-height:1.35}
.card .v{color:var(--muted);font-size:16px;white-space:nowrap}
.card .v.ok{color:var(--sky)}
.card.sel{background:linear-gradient(90deg,rgba(26,159,255,.20),var(--panel2))}
.warn{color:var(--warm)!important}
.bad{color:var(--danger)!important}
.tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin:6px 6px 0 0;background:var(--panel3);color:var(--text)}
.tag.warn{background:rgba(255,179,71,.14)}
.tag.bad{background:rgba(229,72,77,.16)}
.acts{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding-top:14px}
.center .acts{justify-content:center}
.btn{min-width:180px;height:54px;padding:0 28px;border:0;border-radius:var(--r);background:var(--panel3);font-size:17px;font-weight:650;cursor:pointer;outline:none;transition:background .15s,box-shadow .15s,transform .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.f{box-shadow:var(--focus);transform:scale(1.03)}
.btn.primary.f{background:#47b1ff}
.btn[disabled]{opacity:.45}
.mark-big{width:150px;height:150px;margin:0 auto 10px;filter:drop-shadow(0 10px 40px rgba(255,140,60,.25))}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.field{display:flex;flex-direction:column;gap:7px}
.field.wide{grid-column:1 / -1}
.field label{color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.02em}
.field input{height:56px;border-radius:var(--r);border:2px solid transparent;background:var(--panel);color:var(--text);font:inherit;font-size:19px;padding:0 16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input.f{border-color:var(--accent);box-shadow:var(--focus)}
.field .hint{font-size:13.5px;color:var(--muted);min-height:18px}
.field .hint.bad{color:var(--danger)}
.switch{display:flex;align-items:center;gap:16px}
.switch .knob{width:52px;height:30px;border-radius:15px;background:var(--panel3);position:relative;flex:0 0 52px;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:var(--text);transition:left .2s}
.switch.on .knob{background:var(--accent)}.switch.on .knob::after{left:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:40px;padding:0 16px;border-radius:20px;border:0;background:var(--panel);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;outline:none}
.chip.on{background:var(--panel3)}
.chip.f{box-shadow:var(--focus)}
.big-tz{font-size:30px;font-weight:750}
.prog{width:100%;max-width:720px;height:14px;border-radius:7px;background:var(--panel);overflow:hidden;margin:26px auto 14px;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--sky));border-radius:7px;transition:width .6s ease}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 1.8s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pct{font-size:56px;font-weight:800;letter-spacing:-.02em}
.stage{color:var(--muted);font-size:18px;min-height:26px}
.flame{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:drop-shadow(0 6px 30px rgba(255,140,60,.25))}50%{filter:drop-shadow(0 6px 50px rgba(255,140,60,.55))}}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0 100% 0 0;background:rgba(255,255,255,.22);transition:none}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger.f{background:#ff6266}
.summary{display:grid;grid-template-columns:200px 1fr;gap:12px 22px;background:var(--panel);border-radius:var(--r);padding:20px 24px;font-size:17px}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:600}
#hints{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:flex-end;gap:26px;padding:0 36px;
  background:linear-gradient(0deg,rgba(10,14,19,.9),rgba(10,14,19,.0));color:var(--muted);font-size:15px;z-index:5}
#hints .k{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--panel3);color:var(--text);font-weight:700;font-size:13px;margin-right:8px}
#hints .left{margin-right:auto;font-size:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);padding:14px 22px;border-radius:var(--r);
  box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:16px;transition:opacity .2s,transform .2s;z-index:20;max-width:80vw;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg2),#0e131a);transition:opacity .6s}
#splash .in{text-align:center;animation:rise 1.1s ease-out both}
#splash .mark{width:170px;height:170px}
#splash .word{margin-top:22px;font-size:26px;font-weight:600;letter-spacing:.5em;padding-left:.5em;color:var(--text)}
@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#splash.out{opacity:0;pointer-events:none}
/* modal (Wi-Fi password) */
#modal{position:fixed;inset:0;background:rgba(5,8,12,.72);display:none;align-items:flex-start;justify-content:center;z-index:30;padding-top:12vh}
#modal.on{display:flex}
#modal .box{width:min(640px,90vw);background:var(--panel);border-radius:10px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal h2{margin:0 0 6px;font-size:24px}
/* on-screen keyboard */
#osk{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#10161e;border-top:1px solid var(--line);padding:14px 18px 18px;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#osk.on{display:block;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#osk .preview{max-width:1000px;margin:0 auto 12px;height:48px;border-radius:var(--r);background:var(--panel);display:flex;align-items:center;padding:0 16px;font-size:20px}
#osk .preview .lbl{color:var(--muted);font-size:14px;margin-right:14px}
#osk .row{display:flex;gap:8px;justify-content:center;margin:0 auto 8px;max-width:1000px}
#osk .key{flex:1 1 0;height:56px;min-width:0;border:0;border-radius:var(--r);background:var(--panel2);font-size:20px;font-weight:600;cursor:pointer;outline:none}
#osk .key.w2{flex-grow:2}#osk .key.w3{flex-grow:3}#osk .key.w6{flex-grow:6}
#osk .key.f{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #fff3}
#osk .key.on{background:var(--panel3)}
#osk .keyhint{text-align:center;color:var(--muted);font-size:13.5px;margin-top:6px}
.portrait-note{font-size:14px;color:var(--muted)}
/* Welcome › Controllers: looks for controllers and pairs Bluetooth ones by itself (bt.autoPads) */
.mark-welcome{width:96px;height:96px;margin-bottom:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.pads{padding:14px 20px 12px;border-radius:var(--r);background:var(--panel);border:1px solid rgba(102,192,244,.10)}
.pads-h{display:flex;align-items:center;gap:18px}
.pads-h .ic{width:46px;height:46px;flex:0 0 46px;border-radius:var(--r);background:var(--panel3);display:grid;place-items:center;position:relative;color:var(--sky)}
.pads-h .ic svg{width:28px;height:28px}
.pads-h .ic.on::before,.pads-h .ic.on::after{content:"";position:absolute;inset:0;border-radius:var(--r);border:2px solid var(--sky);opacity:0;animation:ping 2.4s ease-out infinite}
.pads-h .ic.on::after{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.55);opacity:0}}
.pads-h .t{flex:1;min-width:0}
.pads-h b{display:block;font-size:19px;font-weight:650}
.pads-h small{display:block;color:var(--muted);font-size:14.5px;margin-top:4px;line-height:1.35}
.pads-h small.warn{color:var(--warm)}
.dots3 i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:2px;background:var(--sky);vertical-align:middle;animation:dot 1.4s ease-in-out infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.pad-list{display:flex;flex-direction:column;gap:6px;margin:12px 0 0 64px}
.pad-row{display:flex;align-items:center;gap:12px;min-height:40px;padding:4px 6px 4px 14px;border-radius:var(--r);background:var(--panel2);font-size:16px}
.pad-row .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-row .st{color:var(--muted);font-size:14.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pad-row .st.ok{color:var(--sky)}
.pad-row .st.ok svg{width:16px;height:16px}
.pad-row .st.bad{color:var(--danger)}
.pad-row .lamp{width:8px;height:8px;border-radius:4px;flex:0 0 8px;background:var(--muted)}
.pad-row.ok .lamp{background:var(--sky);box-shadow:0 0 8px rgba(102,192,244,.7)}
.pad-row.busy .lamp{background:var(--warm);animation:breathe2 1.2s ease-in-out infinite}
.pad-row.bad .lamp{background:var(--danger)}
@keyframes breathe2{0%,100%{opacity:.35}50%{opacity:1}}
.pad-row .chip{height:34px;font-size:14px;background:var(--panel3)}
.pads .tip{margin:10px 0 0 64px;color:var(--muted);font-size:13.5px;line-height:1.4}
</style>
</head>
<body>
<div id="splash"><div class="in"><svg class="mark" viewBox="0 0 512 512"><use href="#hearth-mark"/></svg><div class="word">HEARTH OS</div></div></div>
<div id="top"><svg class="mark" viewBox="0 0 512 512"><use href="#hearth-mark"/></svg><span class="name">Hearth OS</span><span class="sub" id="topsub">Installer</span><div id="dots"></div></div>
<div id="app"></div>
<div id="hints"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="osk"></div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="hm-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e5483b"/></linearGradient>
    <linearGradient id="hm-core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#ffc24f"/></linearGradient>
    <linearGradient id="hm-stone" gradientUnits="userSpaceOnUse" x1="0" y1="108" x2="0" y2="475"><stop offset="0" stop-color="#f6ece0"/><stop offset="1" stop-color="#cdbba8"/></linearGradient>
    <symbol id="hearth-mark" viewBox="0 0 512 512">
      <path d="M112 432 V252 A144 144 0 0 1 400 252 V432" fill="none" stroke="url(#hm-stone)" stroke-width="30" stroke-linecap="round"/>
      <path d="M76 462 H436" stroke="url(#hm-stone)" stroke-width="26" stroke-linecap="round"/>
      <path d="M256 168 C298 222 340 262 340 332 C340 386 302 422 256 422 C210 422 172 386 172 332 C172 294 190 266 212 244 C210 276 222 298 242 306 C232 258 236 212 256 168 Z" fill="url(#hm-flame)"/>
      <path d="M258 284 C280 314 300 338 300 368 C300 394 282 412 258 412 C234 412 216 394 216 368 C216 340 238 316 258 284 Z" fill="url(#hm-core)"/>
    </symbol>
  </defs>
</svg>
<script src="pad/hearth-gamepad.js"></script>
<script>
'use strict';
// ------------------------------------------------------------------ the host (the Hearth app's bridge) or a pretend PC
const host = window.nimbusHost || null;
const pending = new Map(); let rid = 0;
function call(method, args = {}, timeout = 30000) {
  if (!host) return MOCK.call(method, args);
  return new Promise((resolve, reject) => {
    const id = ++rid; pending.set(id, {resolve, reject});
    host.postMessage({type: 'call', id, method, args});
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("The system didn't answer in time")); } }, timeout);
  });
}
function onHost(m) {
  if (m.type === 'result') { const p = pending.get(m.id); if (!p) return; pending.delete(m.id); return m.ok ? p.resolve(m.value) : p.reject(new Error(m.error || 'That didn\'t work')); }
  if (m.type === 'event' && m.name === 'osInstall') return onInstall(m.data || {});
  if (m.type === 'event' && m.name === 'bt.pad') return padsEvent(m.data || {});
  if (m.type === 'event' && m.name === 'bt.autoPadsOff') return padsOff(m.data || {});
}
if (host) host.addEventListener('message', e => onHost(e.data || {}));

const MOCK = (() => {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let pct = 0, timer = null, padT = [];
  // Previews: ?nobt is a PC without Bluetooth, ?padfail a controller that doesn't connect the first time.
  const q = (typeof location !== 'undefined' && location.search) || '';
  const emit = (name, data) => onHost({type: 'event', name, data});
  const log = [];
  return {log, async call(m, a) {
    log.push([m, a]);
    if (m === 'bt.autoPads') {
      padT.forEach(clearTimeout); padT = [];
      if (a && a.on) {
        const name = 'Xbox Wireless Controller', fail = /[?&]padfail\b/.test(q) && !log.some(x => x[0] === 'mock-failed-once');
        padT.push(setTimeout(() => emit('bt.pad', {state: 'pairing', name}), 1400));
        padT.push(setTimeout(() => emit('bt.pad', fail ? {state: 'failed', name, error: 'it took too long'} : {state: 'paired', name}), 3200));
        if (fail) log.push(['mock-failed-once']);
      }
      return null;
    }
    await wait(250);
    if (m === 'bt.paired') return [];
    if (m === 'osinstall.disks') return {edition: 'peppermint', offline: true, efi: true, secureBoot: true, disks: [
      {dev: '/dev/nvme0n1', size: 1024209543168, model: 'Samsung SSD 980 PRO 1TB', tran: 'nvme', live: false, tooSmall: false, windows: true, systems: [{kind: 'windows', name: 'Windows'}]},
      {dev: '/dev/sda', size: 2000398934016, model: 'WD Blue SA510 2TB', tran: 'sata', live: false, tooSmall: false, windows: false, systems: [{kind: 'linux', name: 'SteamOS'}]},
      {dev: '/dev/sdb', size: 64023257088, model: 'SanDisk Ultra 64GB', tran: 'usb', live: false, tooSmall: true, windows: false, systems: []}]};
    if (m === 'sys.status') return {wifi: {available: true, on: true, ssid: null, bars: 0}, bt: /[?&]nobt\b/.test(q) ? {available: false, on: false} : {available: true, on: true}};
    if (m === 'wifi.scan') return [{ssid: 'Casa Wifi 5G', bars: 4, secure: true}, {ssid: 'Hearth Lab', bars: 3, secure: true}, {ssid: 'Coffee Shop Guest', bars: 2, secure: false}];
    if (m === 'wifi.connect') return {ok: true};
    if (m === 'osinstall.tzGuess') return {zone: 'America/Chicago', how: 'online'};
    if (m === 'osinstall.start') { pct = 0; clearInterval(timer); timer = setInterval(() => { pct += 7; const done = pct >= 100;
      onInstall(done ? {state: 'done', pct: 100, text: 'Hearth OS is installed'} : {state: 'running', pct, text: pct < 20 ? 'Making room on the drive' : pct < 80 ? 'Copying Hearth OS from the USB stick · 2.1 of 5.4 GB' : 'Setting up the boot loader', left: Math.round((100 - pct) * 3)});
      if (done) clearInterval(timer); }, 700); return {state: 'running'}; }
    return null;
  }};
})();

// ------------------------------------------------------------------ state
const STEPS = ['welcome', 'wifi', 'drive', 'confirm', 'you', 'time', 'review', 'install', 'done'];
const DOT_OF = {welcome: 0, wifi: 1, drive: 2, confirm: 2, you: 3, time: 4, review: 5, install: 6, done: 6, failed: 6};
const S = {
  step: 'welcome', turn: 0, disksInfo: null, disks: null, disk: null, loadingDisks: false,
  wifi: null, nets: null, scanning: false, connecting: null,
  full: '', user: '', host: '', pw: '', pw2: '', nopass: false, askAtStart: false, userEdited: false, hostEdited: false,
  tz: null, tzHow: '', tzRegion: null, inst: null, error: null, input: 'keys', touched: {},
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const gb = b => b >= 1e12 ? (b / 1e12).toFixed(b >= 1e13 ? 0 : 1) + ' TB' : Math.round(b / 1e9) + ' GB';

const IC = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>',
  rotate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9a9 9 0 0 1 4-5M21 15a9 9 0 0 1-4 5"/></svg>',

}

function render(keepFocus) {
  const prevKey = keepFocus ? (document.querySelector('.f') || {}).dataset?.k : null;
  const f = VIEWS[S.step] || VIEWS.welcome;

function card(k, icon, title, sub, act, right = '', disabled = false, extra = '', cls = '') {
  return `<button class="card ${cls}" data-f data-k="${k}" ${act ? `data-act="${act}"` : ''} ${disabled ? 'disabled' : ''} ${extra}>
    <span class="ic">${icon}</span><span class="t"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span>${right}</button>`;
}
function switchCard(k, title, sub, on) {
  return `<button class="card switch ${on ? 'on' : ''}" data-f data-k="sw-${k}" data-act="act-switch" data-s="${k}"><span class="t"><b>${title}</b><small>${sub}</small></span><span class="knob"></span></button>`;
}
const note = t => `<div class="card" style="cursor:default"><span class="t"><small style="font-size:16px">${t}</small></span></div>`;
const curDisk = () => (S.disks || []).find(d => d.dev === S.disk);

// ------------------------------------------------------------------ the account
const RESERVED = new Set('root bin daemon adm lp sync shutdown halt mail operator games ftp nobody liveuser admin system systemd dbus polkitd sddm gdm wheel users audio video input render kvm tty disk dialout plugdev sudo utmp sys cdrom sshd nogroup kmem mem floppy tape'.split(' '));
function userFrom(full) {
  const w = (full.trim().split(/\s+/)[0] || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
  let u = w.replace(/^[^a-z_]+/, '').slice(0, 32);
  if (RESERVED.has(u)) u += '1';
  return u;
}
function validateYou() {
  const r = {};
  if (!S.full.trim()) r.full = 'Type your name';
  if (!/^[a-z_][a-z0-9_-]{0,31}$/.test(S.user)) r.user = 'Small letters, numbers, - and _, starting with a letter';
  else if (RESERVED.has(S.user)) r.user = `"${S.user}" is used by the system: pick another`;
  if (!/^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/.test(S.host)) r.host = 'Letters, numbers and -';
  if (!S.nopass) {
    if (!S.pw) r.pw = 'Choose a password (or No password below)';
    else if (/\n/.test(S.pw)) r.pw = "The password can't have a line break";
    if (S.pw2 !== S.pw) r.pw2 = "The passwords don't match";
  }
  r.ok = !r.full && !r.user && !r.host && !r.pw && !r.pw2;
  return r;
}
function onField(k, val) {
  S[k] = val; S.touched[k] = true;
  if (k === 'full') {
    if (!S.userEdited) S.user = userFrom(val);
    if (!S.hostEdited) S.host = (S.user || 'hearth').replace(/_+/g, '-').replace(/^-+|-+$/g, '') + '-hearth';
    const u = document.querySelector('[data-field="user"]'), h = document.querySelector('[data-field="host"]');
    if (u && !S.userEdited) u.value = S.user;
    if (h && !S.hostEdited) h.value = S.host;
  }
  if (k === 'user') { S.userEdited = true; if (!S.hostEdited) { S.host = (val || 'hearth').replace(/_+/g, '-').replace(/^-+|-+$/g, '') + '-hearth'; const h = document.querySelector('[data-field="host"]'); if (h) h.value = S.host; } }
  if (k === 'host') S.hostEdited = true;
  refreshYouHints();
}
function refreshYouHints() {
  if (S.step !== 'you') return;
  const v = validateYou();
  for (const k of ['full', 'user', 'host', 'pw', 'pw2']) {
    const el = document.querySelector(`[data-field="${k}"]`); if (!el) continue;
    const h = el.parentNode.querySelector('.hint');
    const bad = S.touched[k] && v[k];
    h.classList.toggle('bad', !!bad);
    if (bad) h.textContent = v[k];
    else h.textContent = {user: 'Small letters and numbers: used for your home folder', host: 'How this PC shows up on your network', pw: 'For signing in and system changes', full: '', pw2: ''}[k];
  }
  const nb = document.querySelector('[data-k="next"]'); if (nb) nb.setAttribute('aria-disabled', v.ok ? 'false' : 'true');
}

// ------------------------------------------------------------------ time zones
let ZONES = null;
function allZones() {
  if (ZONES) return ZONES;
  let z = [];
  try { z = Intl.supportedValuesOf('timeZone'); } catch (e) {}
  if (!z || z.length < 20) z = ['America/New_York', 'America/Chicago', 'America/Denver', 'America/Phoenix', 'America/Los_Angeles', 'America/Anchorage', 'Pacific/Honolulu',
    'America/Toronto', 'America/Mexico_City', 'America/Sao_Paulo', 'America/Buenos_Aires', 'Europe/London', 'Europe/Dublin', 'Europe/Lisbon', 'Europe/Paris', 'Europe/Berlin', 'Europe/Madrid',
    'Europe/Rome', 'Europe/Amsterdam', 'Europe/Stockholm', 'Europe/Warsaw', 'Europe/Helsinki', 'Europe/Athens', 'Europe/Istanbul', 'Europe/Moscow', 'Africa/Cairo', 'Africa/Lagos',
    'Africa/Johannesburg', 'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Singapore', 'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Tokyo', 'Asia/Seoul', 'Australia/Perth',
    'Australia/Adelaide', 'Australia/Sydney', 'Pacific/Auckland'];
  ZONES = [...new Set(z.filter(x => /^(Africa|America|Antarctica|Asia|Atlantic|Australia|Europe|Indian|Pacific)\//.test(x)).concat(['UTC']))];
  return ZONES;
}
function zoneTime(z, short) {
  try {
    return new Intl.DateTimeFormat('en-US', short ? {timeZone: z, hour: 'numeric', minute: '2-digit'} : {timeZone: z, weekday: 'long', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'}).format(new Date());
  } catch (e) { return ''; }
}

const OSK = {target: null, shift: false, sym: false};
const ROWS = {
  abc: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'], ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', '-'], ['⇧', 'z', 'x', 'c', 'v', 'b', 'n', 'm', '.', '⌫'], ['&123', 'space', '_', 'Done']],
  sym: [['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')'], ['~', '`', '+', '=', '[', ']', '{', '}', '\\', '|'], ['⇧', ';', ':', "'", '"', ',', '<', '>', '/', '⌫'], ['abc', 'space', '?', 'Done']],
};
function oskRender() {
  const rows = OSK.sym ? ROWS.sym : ROWS.abc;
  const t = OSK.target, pw = t && t.type === 'password';
  const label = t ? (t.closest('.field') && t.closest('.field').querySelector('label') ? t.closest('.field').querySelector('label').textContent : 'Password') : '';
  const val = t ? (pw ? '•'.repeat(t.value.length) : t.value) : '';
  const keyCap = c => c.length === 1 && OSK.shift ? c.toUpperCase() : c === 'space' ? 'Space' : c;
  const w = c => c === 'space' ? 'w6' : c === 'Done' || c === '&123' || c === 'abc' ? 'w2' : c === '⇧' || c === '⌫' ? 'w2' : '';
  const prevKey = (document.querySelector('#osk .key.f') || {}).dataset?.k;
  $('#osk').innerHTML = `<div class="preview"><span class="lbl">${esc(label)}</span>${esc(val)}<span style="opacity:.6">|</span></div>`
    + rows.map((r, ri) => `<div class="row">${r.map((c, ci) => `<button class="key ${w(c)} ${c === '⇧' && OSK.shift ? 'on' : ''}" data-f data-k="osk-${ri}-${ci}" data-c="${esc(c)}">${esc(keyCap(c))}</button>`).join('')}</div>`).join('')
    + `<div class="keyhint">${S.input === 'pad' ? 'Ⓐ type · Ⓧ delete · Ⓨ shift · ☰ done · Ⓑ close' : 'Type on your keyboard or tap the keys'}</div>`;
  const want = (prevKey && document.querySelector(`#osk [data-k="${prevKey}"]`)) || document.querySelector('#osk [data-k="osk-1-0"]');
  if (want) { document.querySelectorAll('#osk .f').forEach(e => e.classList.remove('f')); want.classList.add('f'); }
}
function oskOpen(input) {
  OSK.target = input; OSK.shift = input.dataset.field === 'full' && !input.value; OSK.sym = false;
  $('#osk').classList.add('on'); oskRender(); hints();
  input.scrollIntoView({block: 'center'});
  call('osinstall.screen', {name: 'osk'}).catch(() => {});
}
function oskClose(doneTyping) {
  const t = OSK.target;
  $('#osk').classList.remove('on'); $('#osk').innerHTML = ''; OSK.target = null; hints();
  if (t && t.isConnected) { focus(t); if (doneTyping) nextField(t); }
}
function oskShift() { OSK.shift = !OSK.shift; oskRender(); }
function oskType(c) {
  const t = OSK.target; if (!t) return;
  if (c === '\b') t.value = t.value.slice(0, -1);
  else t.value += c;
  t.dispatchEvent(new Event('input', {bubbles: true}));
  oskRender();
}
function oskKey(el) {
  const c = el.dataset.c;
  if (c === '⇧') return oskShift();
  if (c === '⌫') return oskType('\b');
  if (c === 'space') return oskType(' ');
  if (c === '&123' || c === 'abc') { OSK.sym = !OSK.sym; return oskRender(); }
  if (c === 'Done') return oskClose(true);
  oskType(OSK.shift ? c.toUpperCase() : c);
  if (OSK.shift && OSK.target && OSK.target.dataset.field === 'full' && OSK.target.value.length === 1) { OSK.shift = false; oskRender(); }
}

// ------------------------------------------------------------------ modal, toast, sound
let MODAL = null;
function modalOpen(html, done) {
  MODAL = {done, back: cur()};
  $('#modalbox').innerHTML = html; $('#modal').classList.add('on');
  const f = document.querySelector('#modal [data-first]') || focusables()[0]; if (f) focus(f);
}
function modalDone(ok) { const m = MODAL; modalClose(); if (m && m.done) m.done(ok); }
function modalClose() {
  if (!MODAL) return;
  const back = MODAL.back; MODAL = null;
  $('#modal').classList.remove('on'); $('#modalbox').innerHTML = '';
  if (back && back.isConnected) focus(back); else render(true);
}
function confirmBox(title, sub, okLabel, run) {
  modalOpen(`<h2>${esc(title)}</h2><p class="lead" style="font-size:16px">${esc(sub)}</p>
    <div class="acts"><button class="btn ghost" data-f data-first data-k="m-cancel" data-mact="cancel">Cancel</button><button class="btn primary" data-f data-k="m-ok" data-mact="ok">${esc(okLabel)}</button></div>`, ok => { if (ok) run(); });
}
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }
let AC = null;
function tone(f, d, v) {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch (e) {}
}
const tick = () => tone(1400, 0.03, 0.015), blip = () => tone(880, 0.06, 0.03);

// ------------------------------------------------------------------ start
window.addEventListener('resize', () => { if (!$('#osk').classList.contains('on') && !$('#modal').classList.contains('on') && S.step !== 'install') render(true); });
setTimeout(() => { $('#splash').classList.add('out'); }, 1500);
setTimeout(() => { go('welcome'); }, 1600);
// Get the drives and the network ready while the person reads the welcome screen.
setTimeout(() => { loadDisks(); scanWifi(false); }, 400);
</script>
