<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<style>
:root{
  --bg:#0c1016; --bg2:#121821; --panel:#161d27; --panel2:#1d2531; --panel3:#273140;
  --line:#2a3443; --text:#e9eef4; --dim:#8d99a8; --faint:#5d6978;
  --accent:#3fd0b8; --accent2:#2aa892; --accentInk:#06231e; --warn:#ffb547; --danger:#ff6b6b;
  --r:10px; --top:52px; --foot:46px; --gut:clamp(16px,3vw,44px);
  --ease:cubic-bezier(.2,.8,.2,1);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--dim);text-transform:uppercase;margin:22px 0 12px}

/* ---------- focus ---------- */
[data-f]{outline:none;transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s}
[data-f].focus{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent),0 8px 30px color-mix(in srgb,var(--accent) 18%,transparent)}
.tile[data-f].focus{transform:scale(1.045);z-index:2;will-change:transform}

/* ---------- frame ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--top) 1fr var(--foot);grid-template-columns:minmax(0,1fr)}
#app.dim{filter:brightness(.55) saturate(.8);transition:filter .25s}
.topbar{display:flex;align-items:center;gap:6px;padding:0 var(--gut);background:linear-gradient(var(--bg2),rgba(18,24,33,.6));border-bottom:1px solid rgba(255,255,255,.03);z-index:5}
.topbar .title{font-weight:600;font-size:16px;margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.topbar .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;position:relative;color:var(--dim)}
.ibtn:hover,.ibtn.focus{color:var(--text);background:var(--panel2)}
.badge{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accentInk);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.stat{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:13px;padding:0 6px}
.clock{font-weight:600;font-size:15px;color:var(--text);padding-left:8px;font-variant-numeric:tabular-nums}
#view{overflow-y:auto;overflow-x:hidden;padding:4px var(--gut) 40px;scroll-behavior:smooth;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.footer{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 var(--gut);background:var(--bg2);border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.footer .running{margin-right:auto;display:flex;align-items:center;gap:8px;color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.hint{display:flex;align-items:center;gap:7px;border-radius:16px;padding:4px 10px 4px 4px;color:inherit;font-size:13px}
button.hint{cursor:pointer}
button.hint:hover{background:var(--panel2);color:var(--text)}
.glyph.kc{border-radius:5px;font-size:11px;background:var(--panel3);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);min-width:24px;padding:0 7px;font-weight:600}
.hint svg{width:16px;height:16px}
body.pad-mode, body.pad-mode *{cursor:none!important}
#topBack{display:none} #topBack.show{display:grid}
.glyph{min-width:22px;height:22px;border-radius:11px;background:var(--panel3);color:var(--text);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.glyph.a{background:#3a7d3a}.glyph.b{background:#9a3434}.glyph.x{background:#2f5f9a}.glyph.y{background:#9a7f2a}

/* ---------- covers & tiles ---------- */
.cover{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.cover .art{position:absolute;inset:0}
.cover .ct{position:absolute;left:12px;right:12px;bottom:12px;font-weight:700;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cover .src{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.45);color:#dfe6ee;text-transform:uppercase}
.cover .notinst{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.55);color:var(--warn)}
.tile{flex:none;border-radius:var(--r);position:relative}
.tile.p{width:clamp(118px,13vw,170px);aspect-ratio:2/3}
.tile.p .ct{font-size:clamp(14px,1.3vw,18px)}
.tile.l{height:calc(clamp(118px,13vw,170px)*1.5);aspect-ratio:16/10}
.tile.l .ct{font-size:clamp(20px,2vw,28px)}
.tile .cover{width:100%;height:100%}
.cover .dl{position:absolute;left:10px;right:10px;bottom:10px;z-index:2}
.cover .dl .bar{background:rgba(0,0,0,.55);height:6px}
.cover .dl span{display:block;font-size:11px;font-weight:700;margin-bottom:5px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.thumb .cover{position:absolute;inset:0;border-radius:6px}
.cover.ni .img{filter:saturate(.55) brightness(.7)}
.play.dling{background:var(--panel3);color:var(--text);min-width:230px;flex-direction:column;align-items:stretch;gap:8px;padding:12px 22px}
.play.dling .bar{height:5px}
.tile .cap{position:absolute;left:4px;right:0;top:calc(100% + 8px);font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.tile.focus .cap{opacity:1;color:var(--text)}
.shelf{display:flex;gap:14px;overflow-x:auto;overflow-y:visible;padding:12px 14px 34px;margin:0 -14px;scroll-behavior:smooth;scrollbar-width:none;align-items:flex-end}
.shelf::-webkit-scrollbar{display:none}
.home-hero{position:relative;height:clamp(150px,26vh,260px);margin:0 calc(-1*var(--gut)) -70px;overflow:hidden;pointer-events:none}
.home-hero .art{position:absolute;inset:0;filter:blur(30px) saturate(1.2);opacity:.55;transform:scale(1.2);transition:background .4s;will-change:transform;contain:strict}
.home-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,var(--bg))}
.home-sec{position:relative}

/* news */
.news{display:flex;gap:14px;overflow-x:auto;padding:8px 14px 20px;margin:0 -14px;scrollbar-width:none}
.news::-webkit-scrollbar{display:none}
.ncard{flex:none;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:clamp(240px,26vw,330px);background:var(--panel);border-radius:var(--r);overflow:hidden}
.ncard .nart{height:110px;position:relative}
.ncard .nb{padding:12px 14px 14px}
.ncard .nk{font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ncard .nt{font-weight:600;margin:4px 0 3px}
.ncard .nd{font-size:12px;color:var(--dim)}

/* ---------- library ---------- */
.libhead{display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg)}
.tab.focus{color:var(--text)} .tab.on.focus{color:var(--bg)}
.lbrb{font-size:11px}
.libmeta{display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:13px;margin:8px 0 14px}
.pill{padding:7px 12px;border-radius:8px;background:var(--panel2);font-size:13px;display:flex;align-items:center;gap:6px}
.pill.on{background:var(--accent);color:var(--accentInk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(118px,13vw,170px),1fr));gap:30px 14px;padding:4px}
.grid .tile.p{width:100%}
/* Big libraries: tiles off screen aren't drawn until they scroll into view (WebKit drew every one). */
.grid .tile{content-visibility:auto;contain-intrinsic-size:auto 170px auto 280px}
.empty{padding:60px 0;text-align:center;color:var(--dim)}

/* ---------- game page ---------- */
.gpage{margin:-4px calc(-1*var(--gut)) 0}
.ghero{position:relative;height:clamp(200px,42vh,420px)}
.ghero .art{position:absolute;inset:0}
.ghero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,16,22,0) 30%,var(--bg) 100%)}
.cover .img,.ghero .img,.home-hero .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.home-hero .img{filter:blur(30px) saturate(1.2);opacity:.55;transform:scale(1.2);will-change:transform}
.glogo-img{position:absolute;left:var(--gut);bottom:24px;z-index:1;max-width:min(46%,520px);max-height:42%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 24px rgba(0,0,0,.6))}
.glogo{position:absolute;left:var(--gut);bottom:28px;z-index:1;font-size:clamp(30px,5vw,58px);font-weight:800;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6);max-width:70%}
.gbar{display:flex;align-items:center;gap:12px;padding:0 var(--gut);flex-wrap:wrap}
.play{display:flex;align-items:center;gap:10px;padding:14px 34px;border-radius:8px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:17px}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none}
.play.install{background:var(--panel3);color:var(--text)}
.play.install svg{fill:none;stroke:currentColor}
.sq{width:50px;height:50px;border-radius:8px;background:var(--panel2);display:grid;place-items:center}
.sq.on{color:var(--warn)}
.sq.on svg{fill:currentColor}
.gstats{display:flex;gap:28px;margin-left:12px;flex-wrap:wrap}
.gstat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.gstat .v{font-weight:600;margin-top:2px}
.gbody{display:grid;grid-template-columns:2fr 1fr;gap:18px;padding:24px var(--gut)}
.card{background:var(--panel);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:14px;margin-bottom:10px}
.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.muted{color:var(--dim);font-size:13px;line-height:1.5}

/* ---------- list views ---------- */
.rows{display:flex;flex-direction:column;gap:8px;max-width:900px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel);border-radius:var(--r)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:600}
.row .rt small{color:var(--dim);font-size:12px}
.row .rv{color:var(--dim);font-size:13px}
.row .thumb{width:84px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;position:relative;flex:none}
.sw{width:42px;height:24px;border-radius:12px;background:var(--panel3);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd6de;transition:transform .2s var(--ease)}
.sw.on{background:var(--accent)} .sw.on:after{transform:translateX(18px);background:#fff}
.settings{display:grid;grid-template-columns:clamp(176px,16vw,224px) 1fr;gap:16px;margin-top:8px}
.snav{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start}
.snav button{padding:8px 10px;border-radius:10px;color:var(--dim);display:flex;gap:10px;align-items:center;text-align:left;min-height:48px}
.snav button.on{background:var(--panel2);color:var(--text)}
.snav .sgi{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none}.snav button.on .sgi{background:var(--accent);color:#fff}
.snav .sgi svg{width:18px;height:18px}.snav .sgt{display:flex;flex-direction:column;min-width:0}.snav .sgt b{font-weight:700;font-size:14px}
.snav .sgt small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.spane{min-width:0;display:flex;flex-direction:column;gap:8px}.stabs{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- overlays ---------- */
.layer{position:fixed;z-index:20;visibility:hidden;pointer-events:none}
.layer.open{visibility:visible;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;z-index:15;pointer-events:none}
.scrim.open{opacity:1;pointer-events:auto}
#menu{top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--panel);transform:translateX(-102%);transition:transform .24s var(--ease),visibility .24s;display:flex;flex-direction:column;padding:22px 14px;box-shadow:20px 0 60px rgba(0,0,0,.4)}
#menu.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 22px;font-weight:800;font-size:22px;letter-spacing:.04em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--accent),#7a8cff,var(--accent));display:grid;place-items:center}
.brand .mark i{width:12px;height:12px;border-radius:50%;background:var(--panel)}
.brand .mark.hm{background:none;width:34px;height:34px}
.mitem{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:9px;font-weight:600;font-size:16px;color:var(--dim)}
.mitem.cur{color:var(--text)}
.mitem.cur:before{content:"";position:absolute;left:4px;width:3px;height:22px;border-radius:2px;background:var(--accent)}
.mitem{position:relative}
.mitem.focus{background:var(--panel2);color:var(--text)}
.mfoot{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#7a8cff,var(--accent));position:relative;overflow:hidden;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar .ave{font-size:1.5em;text-shadow:none}
.avatar.sm{width:30px;height:30px;border-radius:8px;font-size:12px}
.avatar.md{width:64px;height:64px;border-radius:14px;font-size:22px}
.avatar.lg{width:104px;height:104px;border-radius:20px;font-size:38px}
.ibtn.av{width:40px;height:40px;margin-left:4px}
.mfoot{width:100%;border-radius:9px}
.mfoot.focus{background:var(--panel2)}
.mfoot b{display:block}
/* profile */
.prof{display:flex;align-items:center;gap:20px;padding:18px;background:var(--panel);border-radius:var(--r)}
.prof .pname{font-size:24px;font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:10px;padding:4px 2px}
.avopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:12px;width:88px}
.avopt small{font-size:11px;color:var(--dim);text-align:center;line-height:1.2}
.avopt.on{background:var(--panel2)} .avopt.on small{color:var(--text)}
.avopt .pick{width:64px;height:64px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--dim);font-size:26px}
.swatch{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#0b0f14}
.swatch.on:after{content:"✓";font-weight:800;font-size:18px}
.theme{display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px;border-radius:12px;width:112px}
.theme .tprev{width:100px;height:62px;border-radius:10px;position:relative;overflow:hidden;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.06)}
.theme .tprev i{position:absolute;left:10px;bottom:10px;width:34px;height:6px;border-radius:3px;background:var(--accent)}
.theme small{font-size:11px;color:var(--dim)}
.theme.on{background:var(--panel2)} .theme.on small{color:var(--text)}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;display:none}
body.hasbg #bg{display:block}
body.hasbg #bg:after{content:"";position:absolute;inset:0;background:rgba(6,8,12,.72)}
html.hasbg,body.hasbg{background:#000}
body.hasbg .home-hero:after,body.hasbg .ghero:after{background:linear-gradient(180deg,transparent 30%,rgba(6,8,12,.55))}
/* stores */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px;max-width:1100px}
.scard{min-width:0;background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--sc)}
.scard .shd{display:flex;align-items:center;gap:14px}
.smark{width:48px;height:48px;border-radius:12px;background:var(--sc);display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.scard .sti{flex:1;min-width:0}
.scard .sti b{display:block;font-size:17px}
.scard .sti small{color:var(--dim);font-size:13px}
.scard .sti small.on{color:var(--accent)}
.sblurb{color:var(--dim);font-size:13px;line-height:1.5}
.sstats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sstats span{color:var(--dim)} .sstats b{color:var(--text)}
.serr{font-size:13px;color:var(--warn);line-height:1.4}
/* A store sign-in that expired (Sign in again): the card's status, its border, and the bell's badge */
.scard .sti small.warn{color:var(--warn);font-weight:600}
.scard.expired{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 55%,transparent)}
.badge.warn{background:var(--warn);color:#241703}
.sbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.sbtn{padding:10px 16px;border-radius:8px;background:var(--panel3);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.sbtn.pri{background:var(--accent);color:var(--accentInk)}
.sbtn svg{width:16px;height:16px}
.libmeta .lmr{display:flex;gap:8px}
#qam{top:0;bottom:0;right:0;width:min(400px,92vw);background:var(--panel);transform:translateX(102%);transition:transform .24s var(--ease),visibility .24s;display:grid;grid-template-columns:1fr 58px;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
#qam.open{transform:none}
.qbody{overflow-y:auto;padding:22px 18px;scrollbar-width:none}
.qbody h3{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 14px}
.qtabs{background:var(--bg2);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.qtab{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:var(--dim)}
.qtab.on{color:var(--accent);background:var(--panel2)}
.qtab.focus{color:var(--text)}
.ctl{padding:12px 12px;border-radius:9px;margin-bottom:6px;background:var(--panel2)}
.ctl.editing{box-shadow:inset 0 0 0 2px var(--accent)}.ctl.editing .slider b{transform:translate(-50%,-50%) scale(1.35)}.ctl.editing .lab span{color:var(--accent)}
.ctl .lab{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-bottom:10px}
.ctl .lab span{margin-left:auto;color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
.ctl.tg{display:flex;width:100%;align-items:center;gap:10px;font-size:14px;font-weight:600}
.ctl.tg .sw{margin-left:auto}
.slider{height:6px;border-radius:3px;background:var(--panel3);position:relative}
.slider i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.slider b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:8px 0;border-radius:7px;background:var(--panel3);text-align:center;font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.notif{display:flex;gap:12px;padding:12px;border-radius:9px;background:var(--panel2);margin-bottom:6px}
.notif .ni{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--panel3);color:var(--accent);flex:none}
.notif b{font-size:14px;display:block}
.notif small{color:var(--dim);font-size:12px}
.np{border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.np .nart{height:140px;position:relative}
.np .nb{padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:8px;background:var(--panel3);font-weight:600;width:100%;text-align:center;margin-top:8px}
.btn.danger{background:rgba(255,107,107,.15);color:var(--danger)}
#power{inset:0;display:grid;place-items:center}
.modal{background:var(--panel);border-radius:14px;padding:22px;width:min(380px,90vw);transform:scale(.94);opacity:0;transition:transform .2s var(--ease),opacity .2s}

#search,#prompt{inset:0;display:flex;flex-direction:column;background:rgba(6,8,12,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0;opacity:0;transition:opacity .2s var(--ease),visibility .2s}
#search.open,#prompt.open{opacity:1}
.kbtop{background:var(--panel);padding:20px var(--gut) 16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
/* The on-screen keyboard (Game Mode), laid out like SteamOS's: docked at the bottom, full width, big keys. */
.kb{margin-top:auto;background:#15171c;border-radius:18px 18px 0 0;padding:12px max(12px,calc(var(--gut) - 8px)) 14px;display:flex;flex-direction:column;gap:7px;box-shadow:0 -18px 50px rgba(0,0,0,.5);transform:translateY(30px);transition:transform .22s var(--ease)}
.open .kb{transform:none}
.kbrow{display:flex;gap:7px}
.kb .key{flex:1 1 0;width:auto;min-width:0;height:clamp(44px,7.2vh,58px);border-radius:10px;background:#2b2f37;color:#eef1f6;font-size:clamp(16px,2.1vw,21px);font-weight:600;position:relative;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.kb .key.mod{background:#21242b;color:#b8bfcc;font-size:clamp(14px,1.7vw,17px)}
.kb .key.w15{flex-grow:1.5} .kb .key.w6{flex-grow:6}
.kb .key.go{background:var(--accent);color:var(--accentInk)}
.kb .key.on{background:#eef1f6;color:#15171c}
.kb .key .kg{position:absolute;top:4px;right:6px;font-size:10px;font-weight:700;opacity:.55;letter-spacing:.02em}
.kb .key:active{transform:translateY(1px)}
/* The selected key, like SteamOS's: lit up and a little bigger, so it's plain from across the room. After .on and .go so it wins. */
.kb .key.focus{background:#f4f6fa;color:#101216;box-shadow:0 0 0 3px var(--accent),0 6px 22px color-mix(in srgb,var(--accent) 45%,transparent);transform:scale(1.08);z-index:2}
.kb .key.go.focus{background:var(--accent);color:var(--accentInk);box-shadow:0 0 0 3px #f4f6fa,0 6px 22px color-mix(in srgb,var(--accent) 55%,transparent)}
.kb .key.focus .kg{opacity:.8}
.kb .key.on:not(.focus){background:color-mix(in srgb,var(--accent) 35%,#2b2f37);color:#fff}
.kb .key{transition:transform .08s,background .08s}
.sfield{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:10px;padding:14px 16px;font-size:18px;min-height:54px}
.sfield .q:empty:before{content:attr(data-ph);color:var(--faint)}
.sfield .q.mono{letter-spacing:.14em}
.caret{width:2px;height:22px;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sres{display:flex;gap:10px;margin:14px 0;min-height:54px;overflow-x:auto;scrollbar-width:none;padding:4px}
.sres .row{flex:none;width:260px;padding:8px 10px;background:var(--panel2)}
.osk{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:6px}
.osk div{display:flex;gap:6px}
.key{width:clamp(30px,6.4vw,54px);height:44px;border-radius:7px;background:var(--panel3);display:grid;place-items:center;font-weight:600;font-size:16px;text-align:center}
.key.w2{width:clamp(70px,13vw,116px)} .key.w4{width:clamp(150px,30vw,250px)}
.key.go{background:var(--accent);color:var(--accentInk)}
#launch{z-index:19;inset:0;background:var(--bg);display:grid;place-items:center;opacity:0;transition:opacity .25s,visibility .25s}
#launch.open{opacity:1}
#launch .img{width:100%;height:100%;object-fit:cover}
#launch .art{position:absolute;inset:0;filter:blur(40px) brightness(.5);transform:scale(1.2)}
.ptiles{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.ptile{width:170px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:20px;border:2px solid transparent;background:transparent}
.ptile .pav{width:116px;height:116px;border-radius:30px;display:grid;place-items:center;font-size:50px;font-weight:800;color:#1a0d06;overflow:hidden;transition:transform .15s}
.ptile .pav .pavimg{width:100%;height:100%;border-radius:0}
.ptile.add .pav{background:var(--panel2);color:var(--dim);border:2px dashed var(--panel3)}
.ptile b{font-size:17px}.ptile small{color:var(--dim);font-size:12px}
.ptile.f,.ptile:focus-visible,.ptile.focus{border-color:var(--accent);background:var(--panel)}
.ptile.cur .pav{box-shadow:0 0 0 3px var(--accent)}
.pdb{display:inline-block;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-weight:700;font-size:.9em}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ach{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px}
.ach img{width:40px;height:40px;border-radius:6px;flex:none}
.ach b{display:block;font-size:13px}.ach small{color:var(--dim);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ach.locked{opacity:.55}
.setup h1{font-size:32px;font-weight:800;margin:0 0 8px;letter-spacing:-.01em}
.setup .lead{color:var(--dim);font-size:16px;margin:0 0 18px;max-width:620px}
.setup .mark{width:110px;height:110px;margin:0 auto 18px}
.setup .mark svg{width:100%;height:100%;display:block}
.setup .acts{display:flex;gap:12px;align-items:center;margin-top:22px}
.setup .center{text-align:center}
.padpic{width:120px;height:120px;margin:0 auto 18px;border-radius:32px;display:grid;place-items:center;background:var(--panel2);color:var(--dim);animation:padpulse 1.6s ease-in-out infinite}
.padpic svg{width:72px;height:72px}
.padpic.on{background:var(--accent);color:var(--accentInk);animation:none}
@keyframes padpulse{50%{transform:scale(1.06);opacity:.75}}
.padwait{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0 4px}
.padhow{max-width:560px;margin:14px auto 0;padding:14px 18px;border-radius:14px;background:var(--panel);color:var(--dim);font-size:14px;line-height:1.55}
.padhow b{color:var(--text)}
.setup .center .lead{margin-left:auto;margin-right:auto}
.setup .center .acts{justify-content:center}
.lbox{position:relative;text-align:center}
.lbox .t{font-size:30px;font-weight:800;margin-top:22px}
.lbox .s{color:var(--dim);margin-top:6px}
.lbox .hint{color:var(--dim);margin:14px auto 0;max-width:460px;font-size:14px}
.lbox .btn{margin-top:18px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:var(--gut);bottom:calc(var(--foot) + 14px);display:flex;flex-direction:column;gap:8px;z-index:40;pointer-events:none}
.osd{position:fixed;top:26px;left:50%;z-index:9999;display:flex;align-items:center;gap:14px;min-width:320px;padding:12px 20px;border-radius:999px;
  background:var(--panel2);box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,-16px);transition:opacity .18s var(--ease),transform .18s var(--ease);pointer-events:none}
.osd.on{opacity:1;transform:translate(-50%,0)}
.osd svg{width:22px;height:22px;flex:none}
.osd .obar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);position:relative;overflow:visible}
.osd .obar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.osd .obar i.hot{background:linear-gradient(90deg,var(--accent),#ff5d5d)}
.osd .obar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.5);border-radius:1px}
.osd b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.toast{background:var(--panel2);border-left:3px solid var(--accent);padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .25s var(--ease);max-width:340px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.vfade{animation:vf .22s var(--ease)}
@keyframes vf{from{opacity:0;transform:translateY(6px)}}

/* ---------- system settings ---------- */
.shead{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:18px 4px 2px}
.ricon{width:36px;height:36px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;flex:none;color:var(--text)}
.row.focus .ricon{background:var(--panel3)}
.tag{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.tag.on{color:var(--accent)}
.mini-spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
.note{color:var(--dim);font-size:13px;padding:8px 4px;line-height:1.5}
/* Hearth Linux's output (Settings › System › Linux on Android) */
/* The Linux desktop inside Hearth (Android, Hearth Linux stage 2): noVNC's screen, Hearth's own pointer over it, a slim
   bar of keys at the top (hidden until Guide/View or Back). Layers (the keyboard prompt, sheets) go above it. */
#desk{position:fixed;inset:0;z-index:30;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#desk.open{display:block}
#deskScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deskTouch{position:absolute;inset:0;z-index:2;touch-action:none}
#deskCursor{position:absolute;left:0;top:0;width:20px;height:20px;z-index:3;pointer-events:none;transform:translate(-99px,-99px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
#deskMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:none;flex-direction:column;align-items:center;gap:14px;max-width:min(520px,90vw);padding:22px 26px;border-radius:16px;background:color-mix(in srgb,var(--panel) 94%,transparent);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#deskMsg.show{display:flex}
#deskMsg .dm-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#deskBar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.45);transform:translateY(-110%);transition:transform .18s var(--ease)}
#deskBar.show{transform:none}
#deskBar .dk{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;background:var(--panel2);color:var(--text);font:600 13px/1 inherit;border:0}
#deskBar .dk svg{width:16px;height:16px}
#deskBar .dk.on{background:var(--accent);color:#fff}
#deskBar .dk.cur{box-shadow:0 0 0 2px var(--accent)}
#deskBar .dk-sp{flex:1}
#deskBar .dk-hint{color:var(--dim);font-size:12px;padding:0 6px}
body.desk-open .layer{z-index:36}
body.desk-open .scrim{z-index:34}
.lxout{margin:0;padding:12px 14px;background:var(--panel);border-radius:var(--r);font:12px/1.45 ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;color:var(--text);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;grid-column:1/-1}
.hhd-sub{display:flex;flex-direction:column;gap:8px;margin-left:16px;padding-left:12px;border-left:2px solid var(--panel3)}.hhd-sub:empty{display:none}
.hhd-h{font-size:14px;font-weight:700;margin:8px 4px 0}
.qhhd{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.qhhd .row{background:var(--panel2);padding:10px 12px;gap:10px;border-radius:9px}
.qhhd .row .rt b{font-size:14px}
.qhhd .row .rv{max-width:48%;text-align:right}
.qhhd .ctl{margin-bottom:0}
.qhhd .hhd-sub{margin-left:6px;padding-left:8px;gap:6px}
.qhhd .hhd-h{font-size:13px;color:var(--dim);margin:6px 2px 0}
.qhhd-note{font-size:12px;margin:8px 2px 0}
/* Settings and Handheld Daemon pages, compact: rows about 48px high, one line of explanation (the whole of it shows
   while the row is selected), small section headings, and short toggles two to a line on wide screens (.sgrid). */
.srows{gap:6px;max-width:940px}
.srows .row{padding:7px 14px;gap:12px;min-height:48px;border-radius:10px}
.srows .row .rt b{font-size:15px;line-height:1.3}
.srows .row .rt small{display:block;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srows .row.focus .rt small{white-space:normal}
.srows .row .rv{white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;flex:none}
.srows .row.focus .rv{white-space:normal;text-align:right}
.srows .ricon{width:30px;height:30px;border-radius:7px}
.srows .ricon svg{width:18px;height:18px}
.srows .shead{font-size:11px;margin:10px 4px 0}
.srows>.shead:first-child,.srows>.stabs+.shead{margin-top:0}
.srows .note{font-size:12px;padding:2px 4px;line-height:1.4}
.srows .ctl{margin-bottom:0;padding:9px 14px;border-radius:10px;background:var(--panel)}
.srows .ctl .lab{margin-bottom:8px}
.srows .ctl .chint{font-size:12px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srows .ctl.focus .chint{white-space:normal}
.srows .seg button{padding:7px 0}
.srows .chips{margin:0}
.srows .hhd-sub{gap:6px;margin-left:12px;padding-left:10px}
.srows .hhd-h{font-size:13px;margin:4px 4px 0;color:var(--dim)}
.srows .storage{height:6px;margin-top:5px}
.srows .opts{gap:6px;padding:0 2px}
.srows .layouts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.srows .lcard{padding:6px 6px 8px;gap:4px}
.srows .lcard b{font-size:14px;margin-top:2px}
.srows .lcard small{-webkit-line-clamp:1}
.srows .lcard.focus small{-webkit-line-clamp:3}
.srows .about-head{padding:12px 14px;gap:14px}
.srows .about-head .amark{width:48px;height:48px;border-radius:12px}
.srows .about-head .amark svg{width:32px;height:32px}
.srows .about-head h3{font-size:19px}
.srows .prof{padding:12px 14px}
.sgrid{display:contents}
@media (min-width:1100px){
  .srows{max-width:1080px}
  .sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
}
/* Quick Access › Performance, compact */
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:2px}
.pstats .pstat{margin:0;padding:9px 10px}
.pstats .pstat .lab{gap:7px;font-size:13px;margin-bottom:6px;min-width:0}
.pstats .pstat .lab svg{display:none}
.pstats .pstat .lab span{white-space:nowrap}
.pstats .pstat .psub{display:block;font-size:11px;color:var(--dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pctl{margin-top:10px}
.pctl .chips{gap:5px;margin:6px 0 2px}
.pctl .chip{flex:1 0 auto;text-align:center;padding:8px 6px;min-width:36px}
.pctl>.muted{font-size:12px;line-height:1.35}
.qhhd .ricon{width:26px;height:26px;border-radius:7px}
.qhhd .ricon svg{width:16px;height:16px}
.qhhd .row{min-height:44px}
.row .seg{flex:1;max-width:420px}
.ctl.tg .tgl{display:flex;flex-direction:column;min-width:0}
.ctl.tg .tgl small{font-size:12px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl.tg .mini-spin{margin-left:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#sheet{inset:0;display:grid;place-items:center}
#sheetBox{max-height:86vh;overflow-y:auto;scrollbar-width:none}
/* in-game overlay window: only the Quick Access panel */
body.overlay #app,body.overlay #scrim,body.overlay #bg{display:none!important}
body.overlay #qam{position:fixed;inset:0;width:100%;transform:none;transition:none;box-shadow:none}
html.ovfull,html.ovfull body{background:transparent!important}
body.ovfull:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35)}
body.overlay.ovfull #qam{left:auto;width:min(440px,92vw);box-shadow:-20px 0 60px rgba(0,0,0,.5)}
/* the overlay window is only the panel's width (Ember's, beside the game): the panel fills it, nothing to dim */
@media (max-width:520px){body.ovfull:before{display:none}body.overlay.ovfull #qam{left:0;width:100%;box-shadow:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.chip{padding:8px 12px;border-radius:16px;background:var(--panel2);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accentInk)}
.pctl{margin-top:14px}
.pctl .lab{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:8px}
body.overlay #toasts{bottom:14px;right:72px}
/* Closed overlay: nothing drawn but the volume bar (the window itself stays on screen, see-through) */
body.overlay.ov-closed > :not(#osd){visibility:hidden!important}
body.overlay .modal{width:min(380px,92vw)}
.np .nart .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pstat{padding:12px;border-radius:9px;background:var(--panel2);margin-bottom:6px}
.pstat .lab{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin-bottom:8px}
.pstat .lab span{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text)}
.pstat .lab small{color:var(--dim);font-weight:500}
.btn.sm{margin-top:6px;padding:10px 14px}
#sheet.open .modal{transform:none;opacity:1}

.ptitle{font-weight:600;margin-bottom:12px}
.key.on{background:var(--text);color:var(--bg)}

/* ---------- layouts (Settings › Appearance) ---------- */
.topnav{display:none;gap:4px;margin-left:8px}
.topnav button{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
.topnav button.cur{background:var(--text);color:var(--bg)}
.topnav button.focus{color:var(--text)} .topnav button.cur.focus{color:var(--bg)}
body.L-tiles .topnav,body.L-spotlight .topnav{display:flex}
body.L-tiles #vtitle,body.L-spotlight #vtitle{display:none}
body.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
/* ---- Accessibility: high contrast (Settings › Accessibility) */
body.hc{--bg:#000;--bg2:#000;--panel:#000;--panel2:#0b0b0b;--panel3:#1c1c1c;--line:#fff;--text:#fff;--dim:#f0f0f0;--faint:#cfcfcf}
body.hc .row,body.hc .chip,body.hc .btn,body.hc .card{border:1px solid #fff!important}
body.hc .muted,body.hc small{color:#f0f0f0!important}
/* ---- end Accessibility */
/* Lighter effects: when the host draws the compatible way (no DMA-BUF: Nvidia RTX 50, basic graphics), big blurs and
   shadows are drawn without the graphics card's help every frame, which made Hearth sluggish. Same look, flatter. */
body.lite .home-hero .art,body.lite .home-hero .img,body.lite #launch .art{filter:none!important;opacity:.22;transform:none;will-change:auto}
body.lite .linfo{backdrop-filter:none;background:var(--panel)}
body.lite *{box-shadow:none!important;text-shadow:none!important}
body.no-battpct #battPct{display:none}

/* Tiles: a dashboard — the latest game big, recent ones around it, pins and shortcuts below */
.tl-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(92px,13vh,150px);gap:12px;margin:14px 0 6px}
.tl{position:relative;border-radius:6px;overflow:hidden;background:var(--panel2)}
.tl .cover{position:absolute;inset:0;border-radius:0}
.tl .cover .ct{font-size:15px}
.tl.big{grid-column:span 2;grid-row:span 2}
.tl.big .cover .ct{font-size:clamp(20px,2.2vw,30px);bottom:44px}
.tl .tlbar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.tl .tlbar span{color:var(--dim);font-weight:500}
.tl[data-f].focus{transform:scale(1.03);z-index:2}
.tl.util{display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:var(--panel)}
.tl.util svg{width:30px;height:30px;color:var(--accent)}
.tl.util b{font-size:15px}
.tl.util small{color:var(--dim);font-size:12px}
.tl-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:clamp(92px,13vh,150px);gap:12px}

/* Spotlight: one row of games; the focused one fills the screen */
.sp-bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sp-bg .art,.sp-bg .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,12,.9) 0%,rgba(6,8,12,.55) 45%,rgba(6,8,12,.15) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 45%)}
body.L-spotlight #app{background:transparent}
body.L-spotlight .topbar{background:linear-gradient(rgba(6,8,12,.7),transparent);border-bottom:0}
.sp-strip{display:flex;gap:12px;align-items:center;overflow-x:auto;padding:16px 14px 18px;margin:0 -14px;scrollbar-width:none;scroll-behavior:smooth}
.sp-strip::-webkit-scrollbar{display:none}
.sp-ic{flex:none;width:clamp(64px,7vw,92px);aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--panel2);transition:width .2s var(--ease)}
.sp-ic .cover{position:absolute;inset:0;border-radius:0}
.sp-ic .cover .ct,.sp-ic .cover .src,.sp-ic .cover .notinst{display:none}
.sp-ic.focus{width:clamp(96px,10vw,136px)}
.sp-ic.lib{display:grid;place-items:center;background:var(--panel)}
.sp-ic.lib svg{width:34px;height:34px;color:var(--dim)}
.sp-name{font-size:18px;font-weight:700;min-height:26px;margin:0 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sp-detail{margin-top:clamp(16px,6vh,80px);max-width:min(640px,90%)}
.sp-logo{max-width:min(520px,80%);max-height:140px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 24px rgba(0,0,0,.6));display:block}
.sp-title{font-size:clamp(30px,4.6vw,56px);font-weight:800;line-height:1.05;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sp-meta{color:var(--dim);margin:12px 0 22px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.sp-acts{display:flex;gap:12px;align-items:center}
.sp-acts .sq{background:rgba(255,255,255,.1)}

/* Appearance: layout picker */
.layouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.lcard small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard{background:var(--panel);border-radius:var(--r);padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.lcard.on{border-color:var(--accent)}
.lcard b{font-size:15px;margin-top:4px;display:flex;align-items:center;gap:8px}
.lcard b em{font-style:normal;font-size:11px;font-weight:700;color:var(--accentInk);background:var(--accent);border-radius:6px;padding:2px 6px}
.lcard small{color:var(--dim);font-size:12px;line-height:1.4}
.lprev{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--bg)}
.lprev i{position:absolute;display:block;border-radius:2px;background:var(--panel3)}
.lprev .acc{background:var(--accent)}
.lprev .glow{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,transparent),transparent)}
.storage{height:10px;border-radius:5px;background:var(--panel3);overflow:hidden;margin-top:8px}
.storage i{display:block;height:100%;background:var(--accent)}
.about-head{display:flex;align-items:center;gap:18px;padding:18px;background:var(--panel);border-radius:var(--r);max-width:900px}
.about-head .amark{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--panel2)}
.about-head .amark svg{width:44px;height:44px}
.about-head h3{font-size:22px}
.dl-wrap{max-width:1100px}
.dl-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:16px;margin:16px 0 18px}
@media (max-width:900px){.dl-top{grid-template-columns:1fr}}
.dl-card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--panel);min-height:250px}
.dl-card .art,.dl-card .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dl-card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,12,.94) 0%,rgba(6,8,12,.66) 60%,rgba(6,8,12,.3))}
.dl-card .dl-now-body{position:absolute;left:22px;right:22px;bottom:18px;z-index:1}
.dl-card .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.dl-card .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));transition:width .6s var(--ease)}
.dl-card.paused .bar i{background:var(--dim)}
.dl-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.dl-acts .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px}
.dl-acts .pill svg{width:18px;height:18px}
.dl-acts .pill.ghost{background:rgba(255,255,255,.1);color:var(--text)}
.dl-speed{background:var(--panel);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dl-speed .big{font-size:30px;font-weight:800;line-height:1}
.dl-speed .big small{font-size:14px;color:var(--dim);font-weight:600;margin-left:4px}
.dl-speed .sub{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
.dl-speed svg{width:100%;height:110px;display:block}
.su-card{background:var(--panel);border-radius:var(--r);padding:18px 20px;margin:6px 0 10px;display:flex;flex-direction:column;gap:16px}
.su-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.su-head b{font-size:18px}
.su-head .pc{font-size:30px;font-weight:800;line-height:1}
.su-ph{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center}
.su-ph .n{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--panel3);color:var(--dim)}
.su-ph.on .n{background:var(--accent);color:var(--accentInk,#fff)}
.su-ph.ok .n{background:var(--panel3);color:var(--accent)}
.su-ph .t{font-weight:700}
.su-ph .p{font-weight:800;font-variant-numeric:tabular-nums}
.su-ph .bar{grid-column:2 / 4;height:8px}
.su-ph .s{grid-column:2 / 4;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.su-ph:not(.on):not(.ok) .t,.su-ph:not(.on):not(.ok) .p{color:var(--dim)}
.su-speed{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border-top:1px solid var(--panel3);padding-top:14px}
.su-speed .big{font-size:26px;font-weight:800;line-height:1}
.su-speed .big small{font-size:13px;color:var(--dim);font-weight:600;margin-left:4px}
.su-speed .sub{color:var(--dim);font-size:12px;margin-top:6px}
.su-speed svg{width:100%;height:70px;display:block}
.dl-q{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;background:var(--panel);margin-bottom:8px}
.dl-q .thumb{width:120px;height:56px;flex:none;border-radius:8px;overflow:hidden;position:relative}
.dl-q .rt{flex:1;min-width:0}
.dl-q .rt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-q .rt small{color:var(--dim);font-size:12px}
.dl-q .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}
.dl-q .bar i{display:block;height:100%;background:var(--accent)}
.dl-q .ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);flex:none}
.dl-q .ib svg{width:20px;height:20px}
.dl-q .ib.focus,.dl-acts .pill.focus{box-shadow:0 0 0 3px var(--accent)}
.dl-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}

.dl-now{display:block;position:relative;width:100%;max-width:900px;height:clamp(180px,30vh,260px);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.dl-now .art,.dl-now .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.dl-now-body{position:absolute;left:24px;right:24px;bottom:22px;z-index:1}

.dl-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
.dl-meta span:first-child{color:var(--text);font-weight:700}
.appr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);margin-bottom:8px}

.np-banner{display:flex;align-items:center;gap:16px;padding:12px 16px;margin:14px 0 6px;border-radius:var(--r);background:var(--panel);max-width:900px;position:relative;overflow:hidden}

.xj-d{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}.xj-dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}.xj-d.today .xj-dot{background:var(--accent)}.xj-d small{color:var(--dim)}.xj-d.today>small:first-of-type{color:var(--accent)}
.xj-bar{width:100%;aspect-ratio:2/3}.xj-bar .cover{width:100%;height:100%}.xj-none{width:100%;aspect-ratio:2/3;border-radius:var(--r);border:2px dashed var(--line)}.xj-d b{font-size:14px}
.xj-now{display:flex;align-items:center;gap:16px;margin-top:20px;padding:16px 20px;border-radius:16px;background:var(--panel)}.xj-now .rt{flex:1}.xj-now small{color:var(--dim)}
.logcode{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:var(--panel2);margin-bottom:6px}.logcode b{font-size:30px;letter-spacing:.12em;color:var(--accent);font-variant-numeric:tabular-nums}.logcode code{font-size:13px;word-break:break-all;color:var(--dim)}
.frchips{margin:0 0 14px}.frplat{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;background:var(--panel3);color:var(--dim)}.fp-steam{background:#1b2838;color:#66c0f4}.fp-xbox{background:#0e3a12;color:#7ad15a}.fp-epic{background:#2a2a2a;color:#ddd}.frjoin{color:var(--accent);font-weight:700}
.frav{position:relative;width:42px;height:42px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:none;margin-right:12px}.frav img{width:100%;height:100%;border-radius:50%;object-fit:cover}.frav i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#56606e;border:2px solid var(--bg)}.frow.on .frav i{background:#5aa9ff}.frow.ing .frav i{background:#7ad15a}.frow.ing small{color:#7ad15a}
/* ===================== Library layouts (Settings › You › Library layout) ===================== */
/* Shared: status chips, the info bar, the background art, boxes that fill the rest of the screen (.lfit) */
.lwrap{position:relative}
.lst{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel3);color:var(--dim);white-space:nowrap}
.lst.inst{color:var(--text);background:rgba(255,255,255,.07)}
.lst.on,.lst.qr,.lst.dl{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
.lst.ni{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.lst.cloud{color:#8fc7ff;background:rgba(143,199,255,.12)}
.lfav{color:#ffd166;font-style:normal}
.tile .lfav,.lwc .lfav{position:absolute;right:7px;bottom:7px;z-index:3;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.lfit{overflow:hidden;margin-bottom:-36px}
.lbg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.lbg .art,.lbg .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.lbg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 72%,transparent) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 40%,var(--bg) 85%)}
.linfo{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px 8px 8px;border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.45);border:1px solid var(--line)}
.linfo:empty{display:none}
.linfo .li-th{width:30px;aspect-ratio:2/3;flex:none}
.linfo .li-th .cover{width:100%;height:100%;border-radius:4px}
.linfo .li-th .ct,.linfo .li-th .notinst,.linfo .li-th .dl{display:none}
.linfo .li-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.linfo .li-t b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linfo .li-t small{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfloat{position:fixed;left:var(--gut);right:var(--gut);bottom:calc(var(--foot) + 10px);z-index:4}
.lpadb{padding-bottom:84px}
.lrow h2{display:flex;align-items:baseline;gap:10px;margin:18px 0 0}
.lrow h2 span{font-size:12px;color:var(--faint);font-weight:600}
.ljflash{position:fixed;left:50%;top:50%;z-index:60;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:28px;display:grid;place-items:center;font-size:64px;font-weight:800;background:color-mix(in srgb,var(--panel2) 92%,transparent);box-shadow:0 20px 60px rgba(0,0,0,.5);pointer-events:none;opacity:0}
.ljflash.on{animation:ljf .7s var(--ease)}
@keyframes ljf{0%{opacity:0;transform:scale(.9)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}

/* List & details */
.ll{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,40%);gap:clamp(14px,2vw,28px);min-height:320px}
.ll-col{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;gap:2px;padding:2px 8px 24px 4px}
.ll-col::-webkit-scrollbar{display:none}
.ll-hd,.ll-row{display:grid;grid-template-columns:40px minmax(0,1fr) 78px 104px 150px;align-items:center;gap:14px}
.ll-hd{position:sticky;top:0;z-index:3;padding:6px 12px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--bg)}
.ll-row{flex:none;padding:6px 12px;border-radius:var(--r);content-visibility:auto;contain-intrinsic-size:auto 72px}
.ll-col{container-type:inline-size}
@container (max-width:640px){.ll-hd,.ll-row{grid-template-columns:40px minmax(0,1fr) 70px 150px}.ll-hd>:nth-child(4),.ll-row>:nth-child(4){display:none}}
.ll-row.focus{background:var(--panel2)}
.ll-th{width:40px;aspect-ratio:2/3}
.ll-th .cover{width:100%;height:100%;border-radius:5px}
.ll-th .ct,.ll-th .notinst,.ll-th .dl{display:none}
.ll-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.ll-t b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-t small,.ll-c{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll-c{font-variant-numeric:tabular-nums}
.ll-s{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.ll-s .bar{width:100%;height:4px}
.ll-detail{position:relative;border-radius:16px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.ld-art{position:relative;flex:1 1 40%;min-height:90px}
.ld-art .art,.ld-art .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ld-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,var(--panel) 100%)}
.ld-body{position:relative;padding:0 clamp(16px,2vw,26px) clamp(14px,2vh,22px);margin-top:-36px;display:flex;flex-direction:column;gap:12px;min-height:0}
.ld-head{position:relative;min-height:36px;display:flex;align-items:flex-end}
.ld-title{font-size:clamp(22px,2.3vw,32px);font-weight:800;line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.ld-logo{max-width:80%;max-height:90px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 4px 20px rgba(0,0,0,.6))}
.ld-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ld-body .sp-acts .play{padding:11px 26px;font-size:16px}
.ld-body .sp-acts .sq{width:44px;height:44px;background:var(--panel2)}
.ld-about{color:var(--dim);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.ld-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px 14px;padding-top:12px;border-top:1px solid var(--line)}
.ld-stats small{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ld-stats b{display:block;font-size:14px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.ll-hd,.ll-row{grid-template-columns:40px minmax(0,1fr) 72px 132px}.ll-hd>:nth-child(4),.ll-row>.ll-c+.ll-c{display:none}}

/* Shelves */
.lsh .shelf{padding:12px 14px 30px}
.lsh .tile .cap{opacity:0}.lsh .tile.focus .cap{opacity:1}
.lsee{flex:none;align-self:stretch;width:clamp(118px,11vw,150px);border-radius:var(--r);background:var(--panel);border:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center}
.lsee b{font-size:15px}.lsee small{color:var(--dim);font-size:12px}
.lsh .grid{margin-top:12px}

/* Compact wall */
.lw-grid{grid-template-columns:repeat(auto-fill,minmax(clamp(78px,8vw,104px),1fr));gap:12px 10px;padding:4px 44px 90px 4px}
.lwc{position:relative;aspect-ratio:2/3;border-radius:7px;content-visibility:auto;contain-intrinsic-size:auto 150px}
.lwc .cover{position:absolute;inset:0;border-radius:7px}
.lwc .cover .ct{font-size:11px;left:7px;right:7px;bottom:7px}.lwc:has(.lfav) .cover .ct{right:22px}
.lwc .cover .notinst{font-size:0;padding:0;width:8px;height:8px;border-radius:50%;background:var(--warn);top:6px;left:6px}
.lwc .cover .dl{left:6px;right:6px;bottom:6px}.lwc .cover .dl span{display:none}
.lwc .lqr{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:rgba(10,14,20,.85);color:var(--accent);display:grid;place-items:center;z-index:3}
.lwc .lqr svg{width:10px;height:10px;fill:currentColor}
.lwc.focus{transform:scale(1.12);z-index:2}
.lstrip{position:fixed;right:max(6px,calc(var(--gut) - 30px));top:calc(var(--top) + 60px);bottom:calc(var(--foot) + 84px);z-index:4;display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:30px;padding:6px 0;border-radius:15px;background:color-mix(in srgb,var(--panel) 85%,transparent)}
.lstrip>*{flex:1 1 0;min-height:0;width:26px;max-height:26px;display:grid;place-items:center;font-size:11px;font-weight:700;border-radius:8px;color:var(--dim)}
.lstrip span{color:var(--faint);opacity:.45}
.lstrip .cur{color:var(--accentInk);background:var(--accent)}
.lstrip button.focus{color:var(--text);background:var(--panel3)}

/* ---- experimental library layouts ---- */
/* Cover Flow */
.lx-flow{display:flex;flex-direction:column;justify-content:center;gap:10px}
.lx-flow .shelf{perspective:1100px;align-items:center;padding:30px 45%;gap:0;flex:none}
.lfc{flex:none;width:clamp(130px,15vw,210px);aspect-ratio:2/3;margin:0 -22px;transform:rotateY(48deg) scale(.86);transition:transform .28s var(--ease)}
.lfc .cover{width:100%;height:100%;box-shadow:0 18px 40px rgba(0,0,0,.55);-webkit-box-reflect:below 6px linear-gradient(transparent 70%,rgba(255,255,255,.18))}
.lfc.focus~.lfc{transform:rotateY(-48deg) scale(.86)}
.lfc.focus{transform:none;z-index:3;margin:0 24px}
.lx-flow .linfo{align-self:center;width:min(640px,100%)}
/* Bookshelf */
.lx-spines{display:flex;flex-wrap:wrap;gap:30px 5px;padding:150px 6px 100px;background:repeating-linear-gradient(180deg,transparent 0 206px,#3b2a1d 206px 218px,transparent 218px 236px) 0 150px no-repeat}
.lsp{position:relative;width:36px;height:206px;border-radius:4px 4px 2px 2px;overflow:visible;flex:none;content-visibility:auto;contain-intrinsic-size:36px 206px}
.lsp .lsp-b{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.lsp .lsp-b:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.4))}
.lsp .lsp-t{position:absolute;inset:8px 0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:1;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.lsp .lsp-cv{display:none;position:absolute;left:50%;bottom:calc(100% - 30px);width:110px;aspect-ratio:2/3;transform:translateX(-50%);z-index:5}
.lsp .lsp-cv .cover{width:100%;height:100%;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.lsp.focus{transform:translateY(-14px);z-index:4;content-visibility:visible}
.lsp.focus .lsp-cv{display:block}
/* Timeline */
.lx-tl .lrow{position:relative;padding-left:30px}
.lx-tl .lrow:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.lx-tl .lrow:after{content:"";position:absolute;left:3px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
/* Store towers */
.lx-tw{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.ltw{flex:1 0 220px;max-width:320px;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-radius:14px;overflow:hidden}
.ltw h3{padding:12px 14px 8px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.ltw h3 small{color:var(--faint);font-size:12px}
.ltw-l{overflow-y:auto;scrollbar-width:none;padding:2px 8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.ltw-r{flex:none;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;content-visibility:auto;contain-intrinsic-size:auto 56px}
.ltw-r.focus{background:var(--panel3)}
.ltw-r .ll-th{width:30px;flex:none}
.ltw-r .rt{min-width:0}.ltw-r b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ltw-r small{color:var(--dim);font-size:12px}
/* Constellations */
.lx-stars{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:6px 0 100px}
.lcl{position:relative;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%)}
.lcl>b{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.lstar{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,#fff 0 30%,hsla(var(--h),90%,75%,.9) 45%,transparent 72%)}
.lstar.dim{opacity:.55}
.lstar.focus{box-shadow:0 0 0 2px var(--accent),0 0 22px var(--accent);transform:scale(1.5);z-index:3}
/* Arcade cabinet */
.lx-arc{display:flex;flex-direction:column;align-items:center;gap:8px}
.lcab{flex:1;min-height:0;width:min(760px,92%);display:flex;flex-direction:column;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#2a1d3f,#151020);padding:12px 22px 14px;box-shadow:0 0 0 3px #3d2b5c,0 20px 60px rgba(0,0,0,.5)}
.lcab-m{text-align:center;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(14px,1.6vw,20px);padding:6px;border-radius:8px;background:linear-gradient(90deg,#ff5fa2,#ffd166,#5fd0ff);color:#1a1020;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcab-s{position:relative;flex:1;min-height:60px;margin:10px 0;border-radius:14px;overflow:hidden;border:6px solid #0a0710;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.lcab-s .art,.lcab-s .img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lcab-s:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
.lcab-s .lcab-t{position:absolute;left:16px;bottom:12px;right:16px;z-index:1;font-size:clamp(18px,2vw,26px);font-weight:800;text-shadow:0 2px 12px #000}
.lcab-p{display:flex;align-items:center;justify-content:center;gap:12px}
.lx-arc .shelf{flex:none;width:100%;padding:12px 14px 16px;align-items:center}
.lx-arc .lwc{width:clamp(56px,5.6vw,76px);flex:none}
/* Polaroids */
.lx-pol{grid-template-columns:repeat(auto-fill,minmax(clamp(130px,13vw,170px),1fr));gap:26px 22px;padding:10px 6px 100px}
.lpo{background:#f3efe6;padding:8px 8px 30px;border-radius:3px;transform:rotate(var(--r));box-shadow:0 10px 26px rgba(0,0,0,.45);content-visibility:auto;contain-intrinsic-size:auto 230px}
.lpo .cover{aspect-ratio:1;border-radius:1px}
.lpo .cover .ct,.lpo .cover .src{display:none}
.lpo small{position:absolute;left:8px;right:8px;bottom:7px;color:#2b2b2b;font:600 14px/1.1 "Segoe Print","Bradley Hand","Comic Neue","Comic Sans MS",cursive;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.lpo.focus{transform:rotate(0) scale(1.08);z-index:2}
/* Stats board */
.lx-stats .lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:4px 0 16px}
.lx-stats .lsum div{background:var(--panel);border-radius:12px;padding:12px 16px}
.lx-stats .lsum small{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lx-stats .lsum b{display:block;font-size:22px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsr{display:grid;grid-template-columns:44px 34px minmax(140px,1.2fr) 2fr 80px;align-items:center;gap:14px;padding:6px 12px;border-radius:var(--r);width:100%;content-visibility:auto;contain-intrinsic-size:auto 62px}
.lsr.focus{background:var(--panel2)}
.lsr .n{color:var(--faint);font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lsr .ll-th{width:34px}
.lsr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lsr .lbar{height:10px;border-radius:5px;background:var(--panel3);overflow:hidden}
.lsr .lbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff))}
.lsr .h{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.lx-stats [data-lnav]{display:flex;flex-direction:column;gap:2px}
/* Rolodex */
.lx-rx .lrow{display:flex;align-items:center;gap:14px}
.lrx-card{flex:none;width:clamp(84px,8vw,112px);aspect-ratio:3/4;border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:grid;place-items:center;font-size:clamp(32px,3.6vw,48px);font-weight:800;color:var(--accent);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);position:relative}
.lrx-card:before{content:"";position:absolute;left:30%;right:30%;top:8px;height:6px;border-radius:3px;background:var(--bg)}
.lx-rx .shelf{flex:1;min-width:0;padding:16px 14px 26px}
.lx-rx .tile.p{width:clamp(132px,11.5vw,172px)}
/* Honeycomb */
.lx-hex{padding:8px 0 110px}
.lhx-r{display:flex;gap:6px}
.lhx-r+.lhx-r{margin-top:-24px}
.lhx-r.odd{margin-left:58px}
.lhx{position:relative;width:110px;height:126px;flex:none;content-visibility:auto;contain-intrinsic-size:110px 126px}
.lhx,.lhx.focus{box-shadow:none!important}
.lhx .hxo,.lhx .hxi{position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.lhx .hxo{inset:0;background:var(--accent);opacity:0}
.lhx .hxi{inset:4px}
.lhx .hxi .cover{position:absolute;inset:0;border-radius:0}
.lhx .hxi .ct{font-size:11px;text-align:center;bottom:26px;left:14px;right:14px}
.lhx .hxi .src,.lhx .hxi .notinst{display:none}
.lhx.focus{transform:scale(1.12);z-index:2}
.lhx.focus .hxo{opacity:1}
/* Hand of cards */
.lx-deck{display:flex;flex-direction:column;justify-content:space-between}
.lx-deck .ldh{padding:clamp(10px,4vh,40px) 4px 0;max-width:640px}
.lx-deck .ldh .ld-title{font-size:clamp(28px,3.4vw,46px)}
.lx-deck .ldh .xd-meta{color:var(--dim);margin:8px 0 14px}
.lx-deck .shelf{padding:70px 45% 30px;align-items:flex-end;flex:none}
.ldk{flex:none;width:clamp(120px,12vw,160px);aspect-ratio:2/3;margin-left:-54px;transform:rotate(var(--r)) translateY(var(--y));transform-origin:50% 120%;transition:transform .22s var(--ease)}
.ldk:first-child{margin-left:0}
.ldk .cover{width:100%;height:100%;box-shadow:-8px 10px 24px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.12)}
.ldk.focus{transform:translateY(-46px) scale(1.08);z-index:5}
.ldk.focus~.ldk{transform:rotate(calc(var(--r)*-1)) translateY(var(--y))}
/* Mosaic */
.lx-mos{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,8vw,110px),1fr));grid-auto-rows:clamp(84px,8vw,110px);grid-auto-flow:dense;gap:8px;padding:4px 4px 100px}
.lmo{position:relative;border-radius:8px;content-visibility:auto;contain-intrinsic-size:auto 110px}
.lmo .cover{position:absolute;inset:0}
.lmo.s1 .cover .ct{font-size:11px;left:7px;right:7px;bottom:7px}.lmo.s1 .src,.lmo.s1 .notinst{display:none}
.lmo.s3{grid-column:span 3;grid-row:span 3}.lmo.s3 .ct{font-size:clamp(20px,2vw,28px)}
.lmo.s2{grid-column:span 2;grid-row:span 2}
.lmo.w{grid-column:span 2}
.lmo.focus{transform:scale(1.05);z-index:2}
.lmo .lmh{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55)}

/* Settings: Library layout previews */
.lprev .lp-a{background:var(--accent)}.lprev .lp-t{background:var(--text)}.lprev .lp-p{background:var(--panel2)}
body.reduce-motion .lfc,body.reduce-motion .ldk{transition:none}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hue(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }
// Selector-safe focus key for arbitrary strings (SSIDs, device ids)
function hk(s){ let h=5381; for(const c of String(s)) h=((h*33)^c.charCodeAt(0))>>>0; return h.toString(36); }
const timers={};
function debounce(k,fn,ms){ clearTimeout(timers[k]); timers[k]=setTimeout(fn,ms); }
function artBg(g){
  if(g.src==='beacon') return beaconBg(g);
  const h=hue(g.title), h2=(h+50)%360, h3=(h+200)%360;
  return `background:
    radial-gradient(120% 80% at 80% 10%, hsla(${h2},80%,60%,.55), transparent 55%),
    radial-gradient(90% 70% at 10% 100%, hsla(${h3},70%,45%,.45), transparent 60%),
    repeating-linear-gradient(${h%180}deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px),
    linear-gradient(160deg, hsl(${h},55%,30%), hsl(${h2},65%,12%))`;
}
// Beacon's games have no art of their own (Beacon ships none): a warm tile in Beacon's colors, a shade per shelf
// (Battle for Middle-earth, Lord of the Rings, other games). Steam copies (UaW, SWGB) get Steam's art on top.
function beaconBg(g){
  const f=(g.beacon&&g.beacon.family)||'bfme', h={bfme:34,lotr:16,other:205}[f]??34, k=hue(g.title)%22;
  return `background:
    radial-gradient(90% 70% at 85% 0%, hsla(${h+k},90%,55%,.45), transparent 60%),
    radial-gradient(80% 60% at 0% 100%, hsla(${h+12},70%,35%,.5), transparent 65%),
    repeating-linear-gradient(135deg, rgba(255,220,160,.045) 0 2px, transparent 2px 16px),
    linear-gradient(170deg, hsl(${h},45%,21%), #0f0d0b)`;
}
// Real art when the host provides it; the generated gradient stays underneath as the fallback.
// Tries each kind in order; if an image fails to load, the next one is tried, then the gradient shows.
function artImg(g, kinds, cls='art'){
  const a=g.art||{}; const srcs=[...new Set(kinds.map(k=>a[k]).filter(Boolean))];
  if(!srcs.length) return '';
  return `<img class="${cls} img" src="${esc(srcs[0])}" data-alts="${esc(srcs.slice(1).join('\n'))}" alt="" loading="lazy" decoding="async" onerror="artNext(this)">`;
}
let artFails=0;
function artNext(img){
  if(host && artFails++<40) send({type:'log', text:'art failed: '+img.src});
  const alts=(img.dataset.alts||'').split('\n').filter(Boolean);
  if(!alts.length) return img.remove();
  img.dataset.alts=alts.slice(1).join('\n'); img.src=alts[0];
}
const STATE_LABEL = {downloading:'Downloading', queued:'Queued', paused:'Paused', updating:'Updating', installing:'Installing'};

const playable = g => g.inst || g.cloud;

  const pct = g.progress!=null ? Math.round(g.progress*100) : null;
  // Steam downloads say what Steam is doing ("Verifying", "Waiting for Steam", "Stopped: …").
  return {pct, label: (g.stage || STATE_LABEL[g.state]) + (pct!=null && g.state!=='queued' && !/^Stopped/.test(g.stage||'') ? ` ${pct}%` : '')};
}

    ${g.cloud&&!g.inst?'<span class="notinst">Cloud</span>':!g.inst&&!act?'<span class="notinst">Not installed</span>':''}

function ago(t){ if(!t) return 'Never'; const d=(Date.now()-t)/D; if(d<1) return 'Today'; if(d<2) return 'Yesterday'; if(d<7) return Math.floor(d)+' days ago'; if(d<30) return Math.floor(d/7)+' wk ago'; if(d<365) return Math.floor(d/30)+' mo ago'; const y=Math.floor(d/365); return y+(y===1?' year ago':' years ago'); }

let actx=null;
// Sound packs (Settings › Appearance): the same moves, a different voice.
const SOUND_PACKS = {soft:{name:'Soft', type:'sine', f:1, d:1, v:1}, warm:{name:'Warm', type:'triangle', f:.6, d:1.8, v:1.3}, arcade:{name:'Arcade', type:'square', f:1.25, d:.8, v:.35}, glass:{name:'Glass', type:'sine', f:2.1, d:3.2, v:.6}};
// The sound engine, kept working: the browser engine can suspend, interrupt or stall it (the sound device
// changing, sleep, an idle output that PipeWire switched off), and then every sound after that was silent until
// Hearth restarted: heard for a moment, then gone. Resumed when it's not running, made again when it's closed
// or its clock stopped; while sounds are being played it keeps the output awake with an inaudible tone, so the
// next sound's start isn't cut off while the output wakes up.
let actxSeen=null, actxKeep=null, actxKeepT=0;
function audioCtx(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  const nowW=performance.now();
  if(actx && actx.state!=='closed' && actxSeen && actx.state==='running' && nowW-actxSeen.w>1500 && actx.currentTime===actxSeen.t){
    try{ actx.close(); }catch(e){} actx=null; actxKeep=null;   // its clock stopped: a new one
  }
  if(actx && actx.state==='closed'){ actx=null; actxKeep=null; }
  if(!actx) actx=new AC();
  if(actx.state!=='running'){ try{ actx.resume(); }catch(e){} }
  actxSeen={w:nowW, t:actx.currentTime};
  try{
    if(!actxKeep){
      const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=30; g.gain.value=0.00002;
      o.connect(g).connect(actx.destination); o.start(); actxKeep=o;
    }
    clearTimeout(actxKeepT);
    actxKeepT=setTimeout(()=>{ try{ actxKeep&&actxKeep.stop(); }catch(e){} actxKeep=null; }, 20000);   // quiet again 20 s after the last sound
  }catch(e){}
  return actx;
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && actx && actx.state!=='running'){ try{ actx.resume(); }catch(e){} } });
function blip(f=700,d=.035,v=.035){
  if(!S.set.sounds) return;
  const P=SOUND_PACKS[LOOK.soundPack]||SOUND_PACKS.soft; f*=P.f; d*=P.d; v*=P.v;
  try{ const ctx=audioCtx(); if(!ctx) return; actx=ctx;
    const o=actx.createOscillator(), g=actx.createGain(); o.type=P.type; o.frequency.value=f;
    g.gain.setValueAtTime(v,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d+.01);
  }catch(e){}
}

// A friend picked: what you can do with them.
function frOpen(f){
