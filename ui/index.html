// ---------- Couch Co-op: 2-4 players on this screen, each with their own controller and copy of the game ----------
// (hearth-coop does the work: docs/COUCH-COOP.md). Each player presses A on their controller to join.
const CO = {check:null, games:null, players:[], game:null, layout:'auto', busy:null, status:null, waiting:false, timer:null};
const CO_LAYOUTS = [['auto','Automatic'],['vertical','Side by side'],['horizontal','One above the other'],['grid','Four corners']];
const coopOn = () => (HOSTINFO.features||[]).includes('coop');
function loadCoop(){
  if(!host){ CO.check={ready:true,problems:[],warnings:[]}; CO.games=[]; return render(null,true); }
  call('coop.check',{},20000).then(r=>{ CO.check=r; if(S.view==='coop') render(null,true); }).catch(e=>{ CO.check={ready:false,problems:[e.message],warnings:[]}; if(S.view==='coop') render(null,true); });
  call('coop.games',{},30000).then(r=>{ CO.games=r.games||[]; if(S.view==='coop') render(null,true); }).catch(e=>{ CO.games=[]; toast(e.message); });
  coopPoll();
}
function coopPoll(){
  if(!host) return;
  call('coop.status',{},10000).then(r=>{
    const was=CO.status&&CO.status.running; CO.status=r;
    if(r.running && !CO.timer) CO.timer=setInterval(coopPoll,5000);
    if(!r.running){ clearInterval(CO.timer); CO.timer=null; if(was){ toast('Couch Co-op ended'); call('coop.stop').catch(()=>{}); } }
    if(S.view==='coop' && !S.layers.length) render(null,true);
  }).catch(()=>{});
}
function viewCoop(){
  let h = `<div class="muted" style="margin:4px 0 16px;max-width:760px">Play together on this screen, even games without split-screen: every player gets their own part of the screen, their own controller and their own copy of the game, which find each other like on a network.</div>` + note('<b>Beta Experimental:</b> Couch Co-op is new and hasn\'t been tested on real devices yet. Expect some games not to work, and please send logs (Settings › System) when something goes wrong.');
  const st=CO.status;
  if(st&&st.running) return h + shead('Playing now') + `<div class="rows">
    <button class="row" data-f data-k="co-back" data-act="coop" data-v="back"><span class="ricon">${I.play}</span><div class="rt"><b>Back to ${esc(st.game&&st.game.title||'the game')}</b><small>${(st.players||[]).length} players · Super+Esc on a keyboard also ends it</small></div><div class="rv">›</div></button>
    <button class="row" data-f data-k="co-stop" data-act="coop" data-v="stop"><span class="ricon">${I.x}</span><div class="rt"><b>Stop Couch Co-op</b><small>Closes every player's copy of the game</small></div></button></div>`;
  if(CO.busy) return h + note(`<span class="mini-spin"></span> ${esc(CO.busy)}`);
  const c=CO.check;
  if(!c) return h + note('Checking what this device has…');
  if(c.problems&&c.problems.length) h += c.problems.map(p=>note(esc(p))).join('');
  const g=CO.game&&(CO.games||[]).find(x=>x.id===CO.game);
  h += shead('Game') + `<div class="rows"><button class="row" data-f data-k="co-game" data-act="coop" data-v="game"><span class="ricon">${I.lib}</span><div class="rt"><b>${g?esc(g.title):'Choose a game'}</b><small>${g?esc([g.usesGoldberg?'Players find each other over a local network (Steam stand-in)':'', ...(g.notes||[])].filter(Boolean).join(' · ')||'Ready'):(CO.games?`${CO.games.filter(x=>x.canPlay).length} games can be played this way`:'Looking at your games…')}</small></div><div class="rv">›</div></button></div>`;
  h += shead('Players') + `<div class="rows">` + CO.players.map((p,i)=>`<button class="row" data-f data-k="co-p${i}" data-act="coop" data-v="player" data-i="${i}"><span class="ricon">${I.pad}</span><div class="rt"><b>Player ${i+1} · ${esc(p.name||'Player '+(i+1))}</b><small>${esc(p.padName||p.pad)}</small></div><div class="rv">›</div></button>`).join('')
    + (CO.players.length<4 ? `<button class="row" data-f data-k="co-add" data-act="coop" data-v="add"><span class="ricon">${I.plus||I.user}</span><div class="rt"><b>${CO.waiting?`Player ${CO.players.length+1}: press A on your controller…`:'Add a player'}</b><small>${CO.waiting?'Waiting up to 20 seconds':'Each player presses A on the controller they\'ll use'}</small></div></button>` : '') + `</div>`;
  h += shead('Screen') + `<div class="rows"><button class="row" data-f data-k="co-layout" data-act="coop" data-v="layout"><span class="ricon">${I.display}</span><div class="rt"><b>${(CO_LAYOUTS.find(x=>x[0]===CO.layout)||CO_LAYOUTS[0])[1]}</b><small>How the screen is shared</small></div><div class="rv">›</div></button></div>`;
  const ready = g && g.canPlay && CO.players.length>=2 && (!c.problems||!c.problems.length);
  h += `<div class="acts" style="margin-top:18px"><button class="btn primary" ${ready?'data-f':'disabled'} data-k="co-start" data-act="coop" data-v="start">${I.play} Start Couch Co-op</button></div>`;
  if(!ready) h += note(!g ? 'Choose a game, then add at least two players.' : CO.players.length<2 ? 'Add at least two players.' : '');
  if(c.warnings&&c.warnings.length) h += c.warnings.map(w=>note(esc(w))).join('');
  h += note('Doesn\'t work with games that use anti-cheat. Each copy of the game uses memory and power, so on a handheld lighter games work best.');
  return h;
}
function coopAct(d){
  const v=d.v;
  if(v==='back') return call('coop.show').catch(e=>toast(e.message));
  if(v==='stop') return call('coop.stop',{},20000).then(()=>{ CO.status=null; toast('Couch Co-op stopped'); render(null,true); }).catch(e=>toast(e.message));
  if(v==='game'){
    const list=(CO.games||[]); if(!list.length) return toast(CO.games?'No installed games found':'Still looking at your games…');
    return openSheet({title:'Choose a game', sub:'Games that can\'t be played this way say why.', items:list.slice(0,60).map(x=>({label:x.title+(x.canPlay?'':' (can\'t: '+(x.why||'not supported')+')'), icon:x.canPlay?'play':'x', run:()=>{ if(!x.canPlay) return toast(x.why||'This game can\'t be played in Couch Co-op'); CO.game=x.id; render('co-game',true); }}))});
  }
  if(v==='add'){
    if(CO.waiting) return;
    if(!host){ CO.players.push({pad:'demo'+CO.players.length, padName:'Controller', name:'Player '+(CO.players.length+1)}); return render('co-add',true); }
    CO.waiting=true; render('co-add',true);
    return call('coop.waitButton',{timeout:20, exclude:CO.players.map(p=>p.pad)}).catch(e=>{ CO.waiting=false; toast(e.message); render('co-add',true); });
  }
  if(v==='player'){
    const i=+d.i, p=CO.players[i]; if(!p) return;
    return openSheet({title:`Player ${i+1}`, sub:p.padName||p.pad, items:[
      {label:'Change name', icon:'user', run:()=>openPrompt({title:`Name for player ${i+1}`, value:p.name||''}).then(n=>{ if(n==null) return; p.name=n.trim().slice(0,24); if(host) call('coop.setName',{seat:i+1,name:p.name}).catch(()=>{}); render('co-p'+i,true); })},
      {label:'Remove this player', icon:'x', run:()=>{ CO.players.splice(i,1); render('co-add',true); }}]});
  }
  if(v==='layout'){ const i=CO_LAYOUTS.findIndex(x=>x[0]===CO.layout); CO.layout=CO_LAYOUTS[(i+1)%CO_LAYOUTS.length][0]; return render('co-layout',true); }
  if(v==='start'){
    if(!host) return toast('Couch Co-op works on Hearth OS');
    CO.busy='Starting…'; render(null,true);
    return call('coop.start',{game:CO.game, pads:CO.players.map(p=>p.pad), layout:CO.layout}).catch(e=>{ CO.busy=null; toast(e.message); render(null,true); });
  }
}
function coopEvent(name, data){
  if(name==='coop.pad.done'){
    CO.waiting=false;
    const p=data&&data.pad;
    if(!p) toast('No button was pressed. Try again.');
    else if(CO.players.some(x=>x.pad===p.id)) toast('That controller has already joined');
    else { const n=CO.players.length+1; CO.players.push({pad:p.id, padName:p.label||p.name||'Controller', name:''}); toast(`Player ${n} joined`); }
    if(host && CO.players.length && !CO.players.some(x=>x.name)) call('coop.profiles').then(r=>{ (r.players||[]).forEach(pp=>{ const x=CO.players[pp.seat-1]; if(x&&!x.name) x.name=pp.name; }); if(S.view==='coop') render(null,true); }).catch(()=>{});
  } else if(name==='coop.pad.error'){ CO.waiting=false; toast(data.text); }
  else if(name==='coop.start.progress'){ CO.busy=data.text||'Starting…'; }
  else if(name==='coop.start.done'){ CO.busy=null; coopPoll(); }
  else if(name==='coop.start.error'){ CO.busy=null; openSheet({title:'Couch Co-op couldn\'t start', sub:data.text, items:[{label:'OK', icon:'check', run:()=>{}}]}); }
  if(S.view==='coop' && !S.layers.length) render(null,true);
}

// The preview's made-up PC (no Hearth OS): two screens on one card, two controllers, Sunshine installed.

  if(kind==='plan') return {possible:{gpu:false,nested:true,split:true,stream:true}, recommended:'nested', reasons:['Preview: made-up screens and controllers.'], warnings:[], outputs,
    presets:{stream_sizes:Object.keys(STREAM_SIZE_NAMES), stream_fps:[30,60,90,120], split_layouts:SPLIT_CAP},
    performance:'Every extra player shares this PC\'s graphics card and processor (and its power limit), so games can run slower for everyone. Each streamed player also needs the graphics card to make their video.',
    layout:{mode:'nested', seats:[{seat:1,user:'you',mode:'nested',output:'card0-HDMI-A-1',pads:['usb:1-2']},{seat:2,user:'hearth-p2',mode:'nested',output:'card0-DP-1',pads:[]}]}};
  if(kind==='scan') return {pads:[{id:'usb:1-2',name:'Xbox Controller',seat:1,assignable:true},{id:'uniq:aa:bb:cc:dd:ee:ff',name:'DualSense',seat:1,assignable:true}]};
  if(kind==='configured') return {configured:true, enabled:true, mode:'split', split:{output:'card0-HDMI-A-1',layout:'columns'}, audio:{volumes:{'2':75},only_p1:false}, host:{running:true,paused:false},
    seats:[{seat:1,user:'you',mode:'split',output:'card0-HDMI-A-1',region:0,pads:['usb:1-2'],state:'active'},{seat:2,user:'hearth-p2',mode:'split',output:'card0-HDMI-A-1',region:1,pads:['uniq:aa:bb:cc:dd:ee:ff'],state:'running'},
           {seat:3,user:'hearth-p3',mode:'stream',output:null,pads:[],state:'running',stream:{size:'1920x1080',fps:60,port:49989,name:'hearth-pc Player 3'}}]};
  if(kind==='stream') return {seats:[{seat:3,user:'hearth-p3',name:'hearth-pc Player 3',port:49989,size:'1920x1080',fps:60,running:true,reachable:true,clients:[{name:'Living room TV',uuid:'0123-abcd'}],pending:[{id:'0123456789abcdef0123456789abcdef',name:'Phone'}],addresses:['192.168.1.20:49989'],qr:null}]};
  return {configured:false};
}
function loadSeats(){
  if(!host){ if(!(SE.status&&SE.status.configured)) SE.status=seatsMock('status'); SE.plan=seatsMock('plan'); SE.scan=seatsMock('scan'); if(SE.status.configured) SE.stream=seatsMock('stream'); return; }
  call('seats.status',{},15000).then(r=>{ SE.status=r; seatsRedraw();
    if(r&&r.configured&&(r.seats||[]).some(s=>s.mode==='stream')) call('seats.streamInfo',{},30000).then(i=>{ SE.stream=i; seatsRedraw(); }).catch(()=>{});
  }).catch(e=>{ SE.status={configured:false,error:e.message}; seatsRedraw(); });
  call('seats.plan',{},20000).then(r=>{ SE.plan=r; SE.draft=null; seatsRedraw(); }).catch(e=>{ SE.plan={possible:{},reasons:[e.message],warnings:[]}; seatsRedraw(); });
  call('seats.scan',{},20000).then(r=>{ SE.scan=r; seatsRedraw(); }).catch(()=>{});
}
function seatsRedraw(){ if(S.view==='settings' && S.settingsTab==='seats' && !S.layers.length) render(null,true); }
const seatsOutput = id => ((SE.plan&&SE.plan.outputs)||[]).find(o=>o.id===id);
const seatsOutName = id => { const o=seatsOutput(id); return o ? (o.monitor||o.connector) : (id||''); };
function seatsPadName(id){ const p=((SE.scan&&SE.scan.pads)||[]).find(x=>x.id===id); return (p&&p.name)||SE.padNames[id]||id; }
// The set-up being chosen (before Set up): plan's proposal, changed by the player.
function seatsDraft(){
  if(!SE.draft && SE.plan && SE.plan.layout){ SE.draft=JSON.parse(JSON.stringify(SE.plan.layout)); if(!SE.draft.split) SE.draft.split={layout:'columns'}; seatsFix(SE.draft); }
  return SE.draft;
}
// Player 1 matches the others; everyone on the split screen shares player 1's screen, a part each; streamed players
// have no screen or controllers here.
function seatsFix(d){
  const s1=d.seats[0], kinds=new Set(d.seats.filter(s=>s.seat!==1).map(s=>s.mode));
  if(!s1.output){ const o=((SE.plan&&SE.plan.outputs)||[])[0]; if(o) s1.output=o.id; }
  s1.mode = kinds.has('gpu')?'gpu':kinds.has('split')?'split':kinds.has('nested')?'nested':'local';
  d.mode = s1.mode==='local'?'stream':s1.mode;
  const split=d.seats.filter(s=>s.mode==='split');
  if(split.length){
    if(split.length>SPLIT_CAP[d.split.layout]) d.split.layout='grid';
    const used=new Set();
    split.forEach(s=>{ s.output=s1.output; if(typeof s.region!=='number'||s.region>=SPLIT_CAP[d.split.layout]||used.has(s.region)) s.region=null; else used.add(s.region); });
    split.forEach(s=>{ if(s.region===null){ let r=0; while(used.has(r)) r++; s.region=r; used.add(r); } });
  }
  d.seats.forEach(s=>{ if(s.mode!=='split') delete s.region; if(s.mode==='stream'){ s.output=null; s.pads=[]; s.stream=s.stream||{size:'1920x1080',fps:60}; } else delete s.stream; });
}
function seatsSetKind(n, kind){
  const d=seatsDraft(), s=d&&d.seats.find(x=>x.seat===n); if(!s) return false;
  const others=d.seats.filter(x=>x.seat!==1&&x.seat!==n).map(x=>x.mode);
  if((kind==='gpu'&&others.some(k=>k==='nested'||k==='split')) || ((kind==='nested'||kind==='split')&&others.includes('gpu'))){ toast('A graphics card per player can only be mixed with streamed players'); return false; }
  if(kind==='nested'||kind==='gpu'){
    const s1=d.seats[0], g1=(seatsOutput(s1.output)||{}).gpu;
    const taken=new Set(d.seats.filter(x=>x.seat!==n&&x.output).map(x=>x.output));
    const cards=new Set(d.seats.filter(x=>x.seat!==n&&x.output).map(x=>(seatsOutput(x.output)||{}).gpu));
    const free=((SE.plan&&SE.plan.outputs)||[]).find(o=>!taken.has(o.id) && (kind==='gpu' ? !cards.has(o.gpu) : o.gpu===g1));
    if(!free){ toast(kind==='gpu'?'There\'s no other graphics card with a screen connected':'There\'s no free screen on this graphics card. Connect another TV or monitor, or split this screen.'); return false; }
    s.output=free.id;
  }

}
function seatsPreview(d){
  const o=seatsOutput(d.seats[0].output)||{}, m=/^(\d+)x(\d+)$/.exec(o.mode||'')||[0,16,9], lay=d.split.layout;
  const who=r=>d.seats.find(s=>s.mode==='split'&&s.region===r);

    + SPLIT_PCT[lay].map((c,r)=>{ const s=who(r); return `<div style="position:absolute;left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%;box-sizing:border-box;border:1px solid color-mix(in srgb,var(--text) 22%,transparent);display:grid;place-items:center;font-weight:700;${s?`background:color-mix(in srgb,var(--accent) ${s.seat===1?34:18}%,transparent)`:''}">${s?`Player ${s.seat}`:'<span class="muted">Empty</span>'}</div>`; }).join('')
    + `</div><div class="muted" style="font-size:12px">${esc(o.monitor||o.connector||'This screen')}${o.mode?' · '+esc(o.mode):''}</div>`;
}
function seatsWhere(s, split){
  if(s.mode==='stream') return `${STREAM_SIZE_NAMES[(s.stream||{}).size]||(s.stream||{}).size||''} at ${(s.stream||{}).fps||60} frames a second`;
  if(s.mode==='split') return `${(REGION_NAMES[(split||{}).layout]||[])[s.region]||'Part'} of ${seatsOutName(s.output)}`;
  return seatsOutName(s.output);
}

  if(v==='onlyp1'){ const a=(SE.status&&SE.status.audio)||{}; return call('seats.audio',{onlyP1:!a.only_p1},15000).then(r=>{ SE.status.audio=r; render('se-onlyp1',true); }).catch(e=>toast(e.message)); }
  if(v==='volume') return openSheet({title:`Player ${n}'s volume`, items:[100,75,50,25,0].map(x=>({label:x+'%', icon:x?'vol':'mute', run:()=>call('seats.audio',{seat:n, volume:x},15000).then(r=>{ SE.status.audio=r; render('se-vol'+n,true); }).catch(e=>toast(e.message))}))});
  if(v==='start'||v==='stop') return call('seats.'+v,{},60000).then(r=>{ toast(v==='start'?'Multi-seat is on':'Multi-seat is off for now'); seatsAfter(r); loadSeats(); }).catch(e=>toast(e.message));
  if(v==='pad'){
    const pads=(SE.scan&&SE.scan.pads||[]).filter(p=>p.assignable!==false), seats=(SE.status&&SE.status.seats||[]).filter(s=>s.mode!=='stream');
    if(!pads.length) return toast('No controllers that can be moved (a handheld\'s own controls stay with player 1)');
    return openSheet({title:'Which controller?', items:pads.map(p=>({label:`${p.name}${p.seat?` (player ${p.seat})`:''}`, icon:'pad', run:()=>setTimeout(()=>openSheet({title:`Give ${p.name} to`, items:seats.map(s=>({label:`Player ${s.seat} · ${s.user||''}`, icon:'user', run:()=>call('seats.assignPad',{pad:p.id, seat:s.seat},30000).then(()=>{ toast(`${p.name} is player ${s.seat}'s now`); loadSeats(); }).catch(e=>toast(e.message))}))}),50)}))});
  }
  if(v==='remove') return openSheet({title:'Remove multi-seat?', sub:'Back to one screen and one player. The extra players\' accounts can stay (their Steam sign-in, games and saves are kept for next time) or be deleted.', items:[
    {label:'Remove, keep their accounts', icon:'check', run:()=>{ SE.busy='Removing…'; render(null,true); call('seats.remove',{deleteUsers:false}).catch(e=>{ SE.busy=null; toast(e.message); seatsRedraw(); }); }},
    {label:'Remove and delete their accounts', icon:'trash', run:()=>{ SE.busy='Removing…'; render(null,true); call('seats.remove',{deleteUsers:true}).catch(e=>{ SE.busy=null; toast(e.message); seatsRedraw(); }); }},
    {label:'Cancel', icon:'x', run:()=>{}}]});
}
function seatsAfter(r){
  if(!r) return;
  if((r.warnings||[]).length) toast(r.warnings[0]);
  if(r.restart) openSheet({title:'Restart to finish', sub:'Each graphics card goes to its player when the device starts.', items:[{label:'Restart now', icon:'restart', run:()=>power('restart',true)},{label:'Later', icon:'x', run:()=>{}}]});
  else if(r.restart_game_mode) openSheet({title:'Game Mode restarts', sub:'To share the screens out, Game Mode starts again (your games are closed first).', items:[{label:'Restart Game Mode now', icon:'restart', run:()=>{ closeAll(); toast('Restarting Game Mode…'); call('seats.restartGameMode').catch(e=>toast(e.message)); }},{label:'Later', icon:'x', run:()=>{}}]});
}
function seatsEvent(name, data){
  if(name==='seats.setup.progress'||name==='seats.remove.progress'){ SE.busy=data.text||SE.busy; }
  else if(name==='seats.setup.done'){ SE.busy=null; SE.draft=null; toast('Multi-seat is set up'); seatsAfter(data); loadSeats(); }
  else if(name==='seats.remove.done'){ SE.busy=null; SE.draft=null; toast('Multi-seat removed'); seatsAfter(data); loadSeats(); }
  else if(name==='seats.setup.error'||name==='seats.remove.error'){ SE.busy=null; openSheet({title:name==='seats.setup.error'?'Multi-seat couldn\'t be set up':'Multi-seat couldn\'t be removed', sub:data.text+' Nothing was left half done.', items:[{label:'OK', icon:'check', run:()=>{}}]}); }
  else if(name==='seats.pad.done'){
    const w=SE.waiting, p=data&&data.pad; SE.waiting=null;
    if(w && !p) toast('No button was pressed. Try again.');
    else if(w && w.live) call('seats.assignPad',{pad:p.id, seat:w.seat},30000).then(()=>{ toast(`${p.name} is player ${w.seat}'s now`); loadSeats(); }).catch(e=>toast(e.message));
    else if(w){ const dd=seatsDraft(); if(dd){ dd.seats.forEach(s=>{ s.pads=(s.pads||[]).filter(x=>x!==p.id); }); const s=dd.seats.find(x=>x.seat===w.seat); if(s&&s.mode!=='stream') s.pads.push(p.id); } SE.padNames[p.id]=p.name; toast(`${p.name} is player ${w.seat}'s`); }
  }
  else if(name==='seats.pad.error'){ SE.waiting=null; toast(data.text); }
  else if(name==='seats.pair.done'){ SE.pairing=null; toast('Paired: that device can now play as this player'); loadSeats(); }
  else if(name==='seats.pair.error'){ SE.pairing=null; openSheet({title:'Pairing didn\'t work', sub:data.text, items:[{label:'OK', icon:'check', run:()=>{}}]}); }
  seatsRedraw();
}

// ---------- Quick Resume (Hearth): games put aside stay frozen in memory and carry on where they were ----------
const QR = {list:[], on:true, hib:null};
const qrFeature = () => (HOSTINFO.features||[]).includes('quickResume');
const isFrozen = g => !!g && QR.list.some(q=>q.id===g.id);
// Quick Resume is one feature: games put aside (and the one running) stay through sleep, and through Shut down and
// Restart too when the PC can save memory to the drive (hibernation; power.hibernateStatus). Shut down then
// hibernates and turns off, Restart hibernates and restarts (restartKeep: Linux only; Windows can't).
const qrGames = () => (S.running?1:0) + QR.list.filter(q=>q.id!==S.running).length;
const qrKeeps = () => qrFeature() && QR.on && !!(QR.hib&&QR.hib.supported);
const qrKeepsRestart = () => qrKeeps() && !!QR.hib.restartKeep;
function loadHib(){
  if(!host || QR.hibBusy) return;
  QR.hibBusy=true;
  const was=JSON.stringify(QR.hib&&[QR.hib.supported,QR.hib.restartKeep,QR.hib.reason]);
  call('power.hibernateStatus').then(r=>{ QR.hib=r; }).catch(()=>{ if(!QR.hib) QR.hib={supported:false}; }).finally(()=>{
    QR.hibBusy=false; QR.hibAt=Date.now();
    if(JSON.stringify(QR.hib&&[QR.hib.supported,QR.hib.restartKeep,QR.hib.reason])===was) return;
    if(S.view==='settings') render(null,true);
    if(S.layers.includes('power')) renderPower();
  });
}
function applyQuick(d){
  if(!d) return;
  QR.list = Array.isArray(d.list) ? d.list : []; QR.on = d.on!==false;
  if('runningId' in d && !S.layers.includes('launch')) { S.running = d.runningId || null; if(!S.running) S.paused=false; }
}
function quickResume(id){
  const g=G(id);
  closeAll();
  if(!host){ QR.list=QR.list.filter(q=>q.id!==id); if(S.running) QR.list.unshift({id:S.running,frozenAt:Date.now()}); S.running=id; toast(`Back to ${g?g.title:'the game'}`); return render(null,true); }
  call('game.quickResume',{id}).then(r=>{ applyQuick(r); toast(`Back to ${g?g.title:'the game'}`); render(null,true); }).catch(e=>toast(e.message));
}
function quickClose(id){
  const g=G(id);
  if(!host){ QR.list=QR.list.filter(q=>q.id!==id); return render(null,true); }
  toast(`Closing ${g?g.title:'the game'}…`);
  call('game.quickClose',{id},20000).then(r=>{ applyQuick(r.state); if(r.game&&r.game.id){ const x=G(r.game.id); if(x) Object.assign(x, fromHost(r.game)); } render(null,true); if(S.layers.includes('qam')) renderQam(); }).catch(e=>toast(e.message));
}
function putAside(){
  const g=G(S.running);
  if(!host){ if(S.running){ QR.list.unshift({id:S.running,frozenAt:Date.now()}); S.running=null; } closeAll(); return render(null,true); }
  call('game.putAside').then(r=>{ applyQuick(r); closeAll(); toast(`${g?g.title:'The game'} is put aside. Pick it from Quick Resume to carry on.`); render(null,true); }).catch(e=>toast(e.message));
}
// Home: the games put aside, newest first.
function quickShelf(){
  const L=QR.list.map(q=>G(q.id)).filter(Boolean);
  if(!L.length) return '';
  return `<h2>Quick Resume</h2><div class="shelf">${L.map(g=>`<button class="tile p qr" data-f data-k="h-qr-${esc(g.id)}" data-act="quickres" data-id="${esc(g.id)}">

}

const XV = {votes:null, mine:{}, timer:null, open:false};

  fetch(COUNTER.url+'/v1/votes').then(r=>r.json()).then(v=>{ XV.votes=v.counts||{}; if(S.view==='settings'&&(S.settingsTab==='appearance'||S.settingsTab==='liblook')) render(null,true); }).catch(()=>{});

  const up=!XV.mine[id]; XV.mine[id]=up; try{ localStorage.setItem('hearth.xvotes', JSON.stringify(XV.mine)); }catch(e){}

  {id:'hearth', name:'Hearth', accent:'#ff9f43', bg:'preset:4', sounds:'warm', wall:''},
  {id:'midnight', name:'Midnight', accent:'#3fd0b8', bg:'default', sounds:'soft', wall:'anim:aurora'},

];
const themeOn = t => PROFILE.accent.toLowerCase()===t.accent && PROFILE.background===t.bg && (LOOK.soundPack||'soft')===t.sounds;
async function applyTheme(id){
  const t=THEME_PACKS.find(x=>x.id===id); if(!t) return;
  LOOK.soundPack=t.sounds; saveLook();
  await saveProfile({accent:t.accent, background:t.bg}, 'ap-th-'+id);
  if(LINUX && host) call('desktop.setWallpaper',{value:t.wall}).then(r=>{ DESKWALL.v=r.wallpaper; }).catch(()=>{});
  blip(660,.05,.05); setTimeout(()=>blip(880,.06,.05),90);
  toast(`${t.name} theme${LINUX?', on the desktop too':''}`);
}

// ---------- Settings › Accessibility (Hearth OS) ----------
// Zoom and colour filters are gamescope's, the screen reader is Orca: desktop/shell/hearth-access does them (through
// hearth-core's access.* calls), with the same settings file as Desktop Mode's Settings › Accessibility. Text size,
// high contrast and reduce motion are this page's own (LOOK). Ember (Windows) doesn't have it yet.
const A11Y = {s:null, busy:false};
const A11Y_FILTERS = [['none','Off',''],['grayscale','Greyscale','Shades of grey only'],['invert','Inverted colours','Light becomes dark and colours flip'],
  ['invert-brightness','Inverted brightness','Light becomes dark; colours stay much the same'],['protanopia','Red-green (protanopia)','Moves reds where they\'re easier to tell apart'],
  ['deuteranopia','Green-red (deuteranopia)','Moves greens where they\'re easier to tell apart'],['tritanopia','Blue-yellow (tritanopia)','Moves blues and yellows where they\'re easier to tell apart']];
const A11Y_ZOOMS = [[1,'Off'],[1.25,'1.25×'],[1.5,'1.5×'],[2,'2×'],[2.5,'2.5×'],[3,'3×'],[4,'4×']];
const A11Y_DEMO = {settings:{magnifierSize:'full',magnifierZoom:2,magnifierStep:.5,gameZoom:1,filter:'none',screenReader:false,textScale:1,highContrast:false,largePointer:false},
  mode:'game', available:{orca:true, xprop:true, labwcMagnifier:true, filters:A11Y_FILTERS.map(f=>f[0])}, orcaRunning:false, problems:{}};
function a11yCall(m, args){ return host ? call(m, args||{}, 20000) : Promise.resolve(m==='access.set' ? (Object.assign(A11Y_DEMO.settings, args.set), A11Y_DEMO) : A11Y_DEMO); }
function a11yLoad(){ a11yCall('access.status').then(r=>{ A11Y.s=r; refreshUI(); }).catch(e=>{ A11Y.s={error:e.message||String(e)}; refreshUI(); }); }
function a11ySet(o, key, done){
  A11Y.busy=true; render(key, true);
  a11yCall('access.set', {set:o}).then(r=>{ A11Y.s=r; const p=Object.values(r.problems||{}); toast(p.length ? p[0] : done); })
    .catch(e=>toast(e.message||String(e))).finally(()=>{ A11Y.busy=false; render(key, true); });
}
function pageAccess(){
  const st=A11Y.s, set=(st&&st.settings)||{}, av=(st&&st.available)||{};
  const ts=(TEXT_SIZES.find(t=>t[0]===LOOK.textSize)||TEXT_SIZES[1])[1];
  const zoom=(A11Y_ZOOMS.find(z=>z[0]===set.gameZoom)||[0, set.gameZoom>1 ? set.gameZoom+'×' : 'Off'])[1];
  const filt=(A11Y_FILTERS.find(f=>f[0]===set.filter)||A11Y_FILTERS[0])[1];
  const spin = A11Y.busy ? '<span class="mini-spin"></span>' : '';
  let h = shead('Seeing the screen', !st);
  if(st && st.error) h += note('Couldn\'t read the accessibility settings: '+esc(st.error));
  h += sgrid(`<button class="row" data-f data-k="a11y-zoom" data-act="a11yZoom"><span class="ricon">${I.search}</span><div class="rt"><b>Zoom</b><small>Makes the whole screen bigger, around the pointer</small></div>${spin||`<div class="rv">${esc(zoom)} ›</div>`}</button>`
    + `<button class="row" data-f data-k="a11y-filter" data-act="a11yFilter"><span class="ricon">${I.display}</span><div class="rt"><b>Colour filter</b><small>Greyscale, inverted colours, or colours for colour blindness</small></div>${spin||`<div class="rv">${esc(filt)} ›</div>`}</button>`
    + `<button class="row" data-f data-k="a11y-reader" data-act="a11yReader"><span class="ricon">${I.vol}</span><div class="rt"><b>Screen reader</b><small>${st&&!av.orca?'Orca, the screen reader, isn\'t installed':'Orca reads out what\'s on the screen'}</small></div>${spin||`<div class="sw ${set.screenReader?'on':''}"></div>`}</button>`
    + `<button class="row" data-f data-k="a11y-hc" data-act="a11yHc"><span class="ricon">${I.sun}</span><div class="rt"><b>High contrast</b><small>Black and white with clear outlines, in ${APP}</small></div><div class="sw ${LOOK.highContrast?'on':''}"></div></button>`
    + `<button class="row" data-f data-k="ap-text" data-act="textSize"><span class="ricon">${I.text}</span><div class="rt"><b>Text size</b><small>Makes everything in ${APP} bigger or smaller</small></div><div class="rv">${ts} ›</div></button>`
    + lookRow('reduceMotion','Reduce motion','Turns off animations and smooth scrolling'));
  h += shead('In Desktop Mode')
    + tipRow('a11y-desk', 'Magnifier, filters and more', 'In Desktop Mode, Super+= zooms in around the pointer, Super+- zooms out and Super+Esc turns the magnifier off. Super+Alt+S turns the screen reader on or off, and Super+. opens emoji and symbols. Its Settings › Accessibility has the magnifier\'s size, bigger text for apps, a large pointer and high contrast. There, only inverted colours work of the colour filters.');
  return h;
}
function a11yAct(a, d){

function libGames(){
  const t=S.tab;
  const allow=allowedList();
  let L = t==='hidden' ? GAMES.filter(g=>g.hidden && (!allow || allow.includes(g.id))) : visible();
  if(t.startsWith('c:')) L=L.filter(g=>(g.cols||[]).includes(t.slice(2)));
  const f=S.lfilter||'';
  if(f==='inst') L=L.filter(g=>g.inst||isActive(g)); else if(f==='notinst') L=L.filter(g=>!g.inst&&!isActive(g));
  else if(f==='unplayed') L=L.filter(g=>!g.last&&!g.hrs); else if(f==='played') L=L.filter(g=>g.last||g.hrs);
  else if(f==='short') L=L.filter(g=>g.hrs<2);
  if(t==='inst') L=L.filter(g=>g.inst || isActive(g));
  else if(t==='fav') L=L.filter(g=>g.fav);
  else if(SOURCES[t]) L=L.filter(g=>g.src===t);
  if(S.sort==='recent') L.sort((a,b)=>b.last-a.last || a.title.localeCompare(b.title));
  else if(S.sort==='alpha') L.sort((a,b)=>a.title.localeCompare(b.title));
  else if(S.sort==='hours') L.sort((a,b)=>b.hrs-a.hrs);
  else if(S.sort==='added') L.sort((a,b)=>b.added-a.added);
  return L;
}
// Tabs: hide store tabs with no games (when real data is loaded), show Hidden only when something is hidden.
function libTabs(){
  const t=LIB_TABS.filter(([k])=>{
    if(k==='hidden') return GAMES.some(g=>g.hidden);
    if(k==='beacon') return GAMES.some(g=>g.src==='beacon' && !g.hidden);   // only with Beacon installed
    if(host && SOURCES[k]) return GAMES.some(g=>g.src===k && !g.hidden);
    return true;
  });
  // Your collections come right after Favorites.
  const at=t.findIndex(([k])=>k==='fav')+1;
  t.splice(at,0,...COLS.map(c=>['c:'+c.id, c.name]));
  return t;
}
// Collections: your own groups of games (each profile has its own).
let COLS=[];
const LFILTERS=[['','Everything'],['inst','Installed'],['notinst','Not installed'],['played','Played'],['unplayed','Never played'],['short','Under 2 hours played']];
function colCount(id){ return GAMES.filter(g=>(g.cols||[]).includes(id)).length; }
async function colNew(addGame){
  const name=await openPrompt({title:'New collection', value:''}); if(name==null||!name.trim()) return;
  try{
    const c = host ? await call('library.collection.create',{name}) : {id:'c'+Date.now().toString(36), name:name.trim()};
    COLS.push({id:c.id, name:c.name});
    if(addGame) await colSet(c.id, addGame, true, true);
    toast(addGame?`Added ${addGame.title} to ${c.name}`:`Made ${c.name}`);
    render(null,true);
  }catch(e){ toast(e.message); }
}
async function colSet(id, g, on, quiet){
  try{
    if(host) await call('library.collection.set',{id, game:g.id, on});
    const s=new Set(g.cols||[]); if(on) s.add(id); else s.delete(id); g.cols=[...s];
    const c=COLS.find(x=>x.id===id);
    if(!quiet) toast(on?`Added to ${c?c.name:'collection'}`:`Removed from ${c?c.name:'collection'}`);
  }catch(e){ toast(e.message); }
}
function colPick(g){
  openSheet({title:'Collections', sub:g.title, items:[
    ...COLS.map(c=>{ const on=(g.cols||[]).includes(c.id); return {label:c.name, icon:on?'check':'', run:()=>colSet(c.id,g,!on).then(()=>render(null,true))}; }),
    {label:'New collection…', icon:'lib', run:()=>colNew(g)}]});
}
function colEdit(id){
  const c=COLS.find(x=>x.id===id); if(!c) return;
  openSheet({title:c.name, sub:`${colCount(id)} games · Add games from a game's ⋯ menu`, items:[
    {label:'Rename', icon:'gear', run:async()=>{ const n=await openPrompt({title:'Rename collection', value:c.name}); if(n==null||!n.trim()) return;
      try{ if(host) await call('library.collection.rename',{id, name:n}); c.name=n.trim(); render(null,true); }catch(e){ toast(e.message); } }},
    {label:'Delete collection', icon:'trash', run:async()=>{ try{ if(host) await call('library.collection.remove',{id}); COLS=COLS.filter(x=>x.id!==id); GAMES.forEach(g=>{ if(g.cols) g.cols=g.cols.filter(x=>x!==id); }); S.tab='all'; toast(`Deleted ${c.name}. The games are still in your library.`); render(null,true); }catch(e){ toast(e.message); } }}]});
}

// =====================================================================
// Library layouts (Settings › You › Library layout). Covers is the grid above; List & details, Shelves and
// Compact wall, plus experimental ones. Every layout shows the same games (libGames: tabs, Show, Sort, hidden and
// parental limits). The game you move to fills a detail panel / info bar / background in place (lUpdate, like
// xUpdate on Home), so moving never draws the page again. Keys (data-k) are per game, so Back finds it again.
// =====================================================================
const LIB_LAYOUTS = [

];
const XLIB_LAYOUTS = [
  {id:'x-lib-flow', name:'Cover Flow', desc:'Covers on a turning carousel; the one in the middle faces you.'},
  {id:'x-lib-spines', name:'Bookshelf', desc:'Games as spines on shelves. The one you pick shows its cover.'},
  {id:'x-lib-timeline', name:'Timeline', desc:'Grouped by when you last played: today, this week, this month, earlier, never.'},
  {id:'x-lib-towers', name:'Store towers', desc:'One column per store, side by side.'},
  {id:'x-lib-stars', name:'Constellations', desc:'Each store a cluster of stars, every star a game. The most played shine brightest.'},
  {id:'x-lib-arcade', name:'Arcade cabinet', desc:'One game on a big cabinet screen, the rest along a strip below.'},
  {id:'x-lib-polaroid', name:'Polaroids', desc:'Snapshots scattered on a table, each a little crooked.'},
  {id:'x-lib-stats', name:'Stats board', desc:'Ranked by play time, with bars. See where the hours went.'},
  {id:'x-lib-rolodex', name:'Rolodex', desc:'A card for each letter, A to Z, with its games beside it.'},
  {id:'x-lib-hex', name:'Honeycomb', desc:'Hexagon covers packed like a honeycomb.'},
  {id:'x-lib-deck', name:'Hand of cards', desc:'Your games fanned out like a hand of cards; the one you pick is lifted out.'},
  {id:'x-lib-mosaic', name:'Mosaic', desc:'Tiles sized by play time: your most played games are the biggest.'},
];
const libLayout = () => { const id=LOOK.libLayout; return LIB_LAYOUTS.some(l=>l.id===id) || XLIB_LAYOUTS.some(l=>l.id===id) ? id : 'covers'; };
const LST = {row:null};
const lId = g => esc(g.id);
const lLetter = g => { const c=((g&&g.title)||'').trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };
const lSrc = g => g.system || SOURCES[g.src] || g.src;
function lStatus(g){
  if(S.running===g.id) return ['on','Playing now'];
  if(isFrozen(g)) return ['qr','Quick Resume'];
  if(isActive(g)) return ['dl',dlInfo(g).label];
  if(g.cloud && !g.inst) return ['cloud','Cloud'];
  const sz = g.size && g.size!=='—' ? g.size : '';
  if(g.inst) return ['inst', sz ? 'Installed · '+sz : 'Installed'];
  if(g.src==='beacon') return ['ni','Not set up'];
  return ['ni', sz ? 'Not installed · '+sz : 'Not installed'];
}
const lMeta = g => [lSrc(g), g.hrs?hrs(g.hrs):'Not played yet', g.last?'Played '+ago(g.last).toLowerCase():''].filter(Boolean).join(' · ');
function lAbout(g){
  if(g.genre) return esc(g.genre)+'.';
  if(g.cloud) return 'Streams with Xbox Cloud Gaming.';
  if(g.system) return `A ${esc(g.system)} game from your ROMs folder, played with RetroArch.`;
  if(g.src==='beacon' && typeof beaconAbout==='function') return beaconAbout(g);
  if(g.note) return esc(g.note)+'.';
  return g.inst ? `Installed through ${esc(lSrc(g))}.` : `In your ${esc(lSrc(g))} library.`;
}
// Play / Resume / Install, as on the game's page.
function lPlay(g, k){
  const run=S.running===g.id, fr=isFrozen(g);
  const a = run?'resume' : fr?'quickres' : playable(g)?'play' : isActive(g)?'game' : 'install';
  const l = run||fr ? 'Resume' : playable(g) ? (g.cloud&&!g.inst?'Stream':'Play') : isActive(g) ? dlInfo(g).label : g.src==='beacon' ? 'Set up in Beacon' : 'Install';
  return `<button class="play${playable(g)||run?'':' install'}" data-f data-k="${k}" data-act="${a}" data-id="${lId(g)}">${playable(g)||run?I.play:I.dl}${esc(l)}</button>`;
}
const lQr = g => isFrozen(g) ? `<span class="lqr">${I.play}</span>` : '';
const lFav = g => g.fav ? '<i class="lfav">★</i>' : '';
// A game card that tells the layout when it's picked (data-lspot).
const lTile = (g, kind, k) => `<button class="tile ${kind}${isFrozen(g)?' qr':''}" data-f data-k="${k}" data-act="game" data-id="${lId(g)}" data-lspot="${lId(g)}">
    ${cover(g,{wide:kind==='l'})}${isFrozen(g)?`<span class="qrb">${I.play}Quick Resume</span>`:''}${lFav(g)}<div class="cap">${esc(g.title)}${g.last?' · '+ago(g.last):''}</div></button>`;
const lSmall = (g, k, cls='lwc') => `<button class="${cls}" data-f data-k="${k}" data-act="game" data-id="${lId(g)}" data-lspot="${lId(g)}">${cover(g,{badge:false})}${lQr(g)}${lFav(g)}</button>`;
const lBgInner = g => g ? `<div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide'])}` : '';
const lBg = g => `<div class="lbg" id="lBg" data-id="${g?lId(g):''}">${lBgInner(g)}</div>`;
function lInfo(g){
  if(!g) return '';
  const [sc,sl]=lStatus(g);
  return `<div class="li-th">${cover(g,{badge:false})}</div><div class="li-t"><b>${esc(g.title)}${g.fav?' <i class="lfav">★</i>':''}</b><small>${esc(lMeta(g))}</small></div><span class="lst ${sc}">${esc(sl)}</span>`;
}
const lInfoBar = (g, cls='lfloat') => `<div class="linfo ${cls}" id="lInfo" data-id="${g?lId(g):''}">${lInfo(g)}</div>`;
function lDetail(g){
  if(!g) return '';
  const [sc,sl]=lStatus(g);
  const logo=(g.art&&g.art.logo) ? `<img class="ld-logo" src="${esc(g.art.logo)}" alt="${esc(g.title)}" loading="lazy" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.remove()">` : '';
  const stats=[['Play time',g.hrs?hrs(g.hrs):'—'],['Last played',ago(g.last)],[g.system?'System':'Store',lSrc(g)],['Size',g.size||'—'],...(g.ach?[['Achievements',`${g.ach[0]} of ${g.ach[1]}`]]:[]),...(g.beacon&&g.inst&&typeof beaconModName==='function'?[['Mod',beaconModName(g)]]:[])];
  return `<div class="ld-art"><div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide','cover'])}</div>
    <div class="ld-body"><div class="ld-head"><div class="ld-title">${esc(g.title)}</div>${logo}</div>
      <div class="ld-meta"><span class="lst ${sc}">${esc(sl)}</span>${g.fav?'<span class="lst"><i class="lfav">★</i> Favorite</span>':''}</div>
      <div class="sp-acts">${lPlay(g,'ld-play')}<button class="sq" data-f data-k="ld-page" data-act="game" data-id="${lId(g)}" aria-label="Game page">${I.info}</button><button class="sq" data-f data-k="ld-opt" data-act="gopts" data-id="${lId(g)}" aria-label="Options">${I.dots}</button></div>
      <p class="ld-about">${lAbout(g)}</p>
      <div class="ld-stats">${stats.map(([k,v])=>`<div><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div></div>`;
}
// The picked game fills whatever this layout has: detail panel, info bar, background, cabinet screen, A–Z strip.
function lUpdate(id){
  const g=G(id); if(!g) return;
  if(focused && focused.dataset.lspot===id) LST.row=focused.dataset.k;
  const d=$('#lDetail'); if(d && d.dataset.id!==id){ d.dataset.id=id; d.innerHTML=lDetail(g); }
  const n=$('#lInfo'); if(n && n.dataset.id!==id){ n.dataset.id=id; n.innerHTML=lInfo(g); }
  const b=$('#lBg'); if(b && b.dataset.id!==id){ b.dataset.id=id; b.innerHTML=lBgInner(g); }
  const s=$('#lScreen'); if(s && s.dataset.id!==id){ s.dataset.id=id; s.innerHTML=`<div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide'])}<div class="lcab-t">${esc(g.title)}</div>`;
    const m=$('#lMarquee'); if(m) m.textContent=g.title; const p=$('#lPanel'); if(p) p.innerHTML=lCabPanel(g); }
  const h=$('#lHead'); if(h && h.dataset.id!==id){ h.dataset.id=id; h.innerHTML=lDeckHead(g); }
  const st=$('#lStrip'); if(st){ const l=lLetter(g); const c=st.querySelector('.cur'); if(!c || c.dataset.v!==l){ if(c) c.classList.remove('cur'); const e=st.querySelector(`[data-v="${l}"]`); if(e) e.classList.add('cur'); } }
}
// Called by setFocus for every focus in the Library, before it scrolls.
function libFocus(el){ lFit(); if(el.dataset.lspot) lUpdate(el.dataset.lspot); }
// Layouts that fill the rest of the screen (.lfit): sized to what's left under the tabs, so their lists scroll
// inside and the detail panel stays put. Measured in CSS pixels, so the text size setting is respected.
function lFit(){
  const v=$('#view'), box=v && v.querySelector('.lfit'); if(!box) return;
  let top=0; for(let e=box; e && e!==v && e!==v.offsetParent; e=e.offsetParent) top+=e.offsetTop;
  top-=v.offsetTop;
  const h=Math.max(300, v.clientHeight-top-10)+'px';
  if(box.style.height!==h) box.style.height=h;
}

// Fast moves for long lists and rows (like gridMove): along a list/row it's the next one; across, the nearest
// one in the next row/column. Nothing measured but that row. null = the usual search decides.
function libMove(dir){
  const f=focused, p=f && f.parentElement; if(!p) return null;
  // List & details: right goes to the panel's Play, left from the panel back to the game you were on.
  if(f.classList.contains('ll-row') && dir==='right') return $('#lDetail [data-f]');
  if(f.closest('#lDetail') && dir==='left' && !f.previousElementSibling){ const r=LST.row && $(`#view [data-k="${CSS.escape(LST.row)}"]`); if(r) return r; }
  const nav=p.dataset.lnav; if(!nav) return null;
  const h=nav==='h', along = h ? (dir==='left'||dir==='right') : (dir==='up'||dir==='down');
  const fwd = dir==='right'||dir==='down';
  if(along){
    let s=f; do{ s = fwd ? s.nextElementSibling : s.previousElementSibling; } while(s && !s.hasAttribute('data-f'));
    return s;   // null at the end: the usual search (to the header, or nothing)
  }
  const grp=p.closest('[data-lgrp]');
  if(!grp) return !h && (dir==='left'||dir==='right') ? f : null;   // a single full-width list: left/right stay put
  if((h && (dir==='left'||dir==='right')) || (!h && (dir==='up'||dir==='down'))) return null;
  let s=grp; do{ s = fwd ? s.nextElementSibling : s.previousElementSibling; } while(s && !s.matches('[data-lgrp]'));
  if(!s) return null;
  const box = s.matches('[data-lnav]') ? s : s.querySelector('[data-lnav]');
  if(!box) return null;
  const r=f.getBoundingClientRect(), c = h ? r.left+r.width/2 : r.top+r.height/2;
  let best=null, bd=Infinity;
  for(const e of box.children){ if(!e.hasAttribute('data-f')) continue;
    const b=e.getBoundingClientRect(), d=Math.abs((h ? b.left+b.width/2 : b.top+b.height/2) - c);
    if(d<bd){ bd=d; best=e; } }
  return best;
}
// A–Z: the right stick (or Page Up/Down) jumps a letter; the wall's strip jumps to one. Needs the A–Z sort.
function lJumpItems(){ return [...document.querySelectorAll('#view [data-lj] > [data-f][data-id]')]; }
function lFlash(c){
  if(LOOK.reduceMotion) return;
  let e=$('#ljFlash'); if(!e){ e=document.createElement('div'); e.id='ljFlash'; e.className='ljflash'; document.body.appendChild(e); }
  e.textContent=c; e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
}
function lSortAlpha(){
  if(S.sort==='alpha') return false;
  S.sort='alpha'; render('sort', true); toast('Sorted A–Z, so you can jump by letter');
  return true;
}
function libJump(d){
  if(S.view!=='library' || S.layers.length) return;
  if(lSortAlpha()){ const it=lJumpItems(); if(it[0]) setFocus(it[0]); return; }
  const it=lJumpItems(); if(!it.length) return;
  const M=new Map(GAMES.map(g=>[g.id,g])), L=i=>lLetter(M.get(it[i].dataset.id));
  let i=it.indexOf(focused); if(i<0) i=0;
  const cur=L(i); let j=i;
  if(d>0){ while(j<it.length && L(j)===cur) j++; if(j>=it.length) j=it.length-1; }
  else { let s=i; while(s>0 && L(s-1)===cur) s--;
    if(s<i) j=s; else { j=Math.max(0,s-1); const P=L(j); while(j>0 && L(j-1)===P) j--; } }
  setFocus(it[j]); blip(560); lFlash(L(j));
}
function lJumpTo(c){
  lSortAlpha();
  const it=lJumpItems(); if(!it.length) return;
  const order='#ABCDEFGHIJKLMNOPQRSTUVWXYZ', want=order.indexOf(c);
  const M=new Map(GAMES.map(g=>[g.id,g]));
  const el=it.find(e=>order.indexOf(lLetter(M.get(e.dataset.id)))>=want) || it[it.length-1];
  setFocus(el); lFlash(c);
}

// ---------- the layouts ----------
function lShelfRows(L){
  const set=new Set(L), rows=[], tab=S.tab;
  const add=(id,title,list,see,o={})=>{ if(list.length) rows.push({id,title,list,see,max:o.max||40,wide:!!o.wide,total:o.total??list.length}); };
  const byLast=L.filter(g=>g.last).sort((a,b)=>b.last-a.last);
  const cont=[...new Set([G(S.running), ...QR.list.map(q=>G(q.id)), ...byLast].filter(g=>g && set.has(g)))].slice(0,12);
  add('cont','Continue playing',cont,null,{wide:true});
  const added=L.filter(g=>g.added).sort((a,b)=>b.added-a.added).slice(0,16);
  if(added.length>2) add('new','Recently added',added,null);
  if(tab!=='all') return rows;
  const T=new Set(libTabs().map(t=>t[0]));
  if(tab!=='inst') add('inst','Installed',L.filter(g=>g.inst||isActive(g)),'inst');
  add('fav','Favorites',L.filter(g=>g.fav),'fav');
  COLS.forEach(c=>add('c-'+c.id,c.name,L.filter(g=>(g.cols||[]).includes(c.id)),'c:'+c.id));
  for(const s of ['steam','epic','gog','xbox','beacon','emu','manual']){
    const title = s==='xbox' ? (LINUX?'Xbox Cloud Gaming':'Xbox') : s==='manual' ? 'Non-library games' : SOURCES[s];
    add('s-'+s, title, L.filter(g=>g.src===s), T.has(s)?s:null);
  }
  return rows;
}

// Downloads: the one downloading now (big), what's next, and what finished while Hearth was open.
const DL_DONE = [];   // ids installed this session, newest first
function dlItems(){
  if(host) return GAMES.filter(isActive).map(g=>({g, state:g.state, pct:dlInfo(g).pct, label:dlInfo(g).label, done:g.bytesDone, total:g.bytesTotal, speed:g.state==='downloading'?g.speed:0}));
  return DOWNLOADS.map(d=>{ const g=G(d.g); const tot=parseFloat(g.size)*1e9||0; return {g, state:d.p>=1?'updating':d.p>0?'downloading':'queued', pct:Math.round(d.p*100), label:d.state,
    done:tot*d.p, total:tot, speed:d.speed?parseFloat(d.speed)*1e6:0}; });
}
const gbs = b => b!=null&&b>0 ? (b/1e9).toFixed(b>=1e10?0:1)+' GB' : '';
function etaText(it){
  if(!it.speed || !it.total || it.done==null) return '';
  const s=(it.total-it.done)/it.speed; if(!(s>0) || !isFinite(s)) return '';
  if(s<60) return 'less than a minute left';
  const m=Math.round(s/60); return m<60 ? `${m} min left` : `${Math.floor(m/60)} h ${m%60} min left`;
}
// Downloads, laid out like SteamOS: the current download big with its controls, a live speed graph next to
// it, the queue (each with start-now / pause / cancel), then what finished installing lately. The queue and
// the "recently installed" list are kept by Hearth, so they're still there after a restart.
const DLS = {speeds:[], recent:[]};
if(!host){ const t=Date.now(); for(let i=0;i<100;i++) DLS.speeds.push([t-(100-i)*3000, 2.4e7+Math.sin(i/6)*9e6+Math.random()*6e6]); }   // browser preview
const fmtSpeed = b => b>=1e6 ? (b/1e6).toFixed(b>=1e8?0:1)+' MB/s' : b>=1e3 ? Math.round(b/1e3)+' KB/s' : '0 KB/s';
function speedGraph(pts=DLS.speeds, gid='dlg'){
  const W=600, H=110, now=Date.now(), span=5*60e3;
  const max=Math.max(1e6, ...pts.map(p=>p[1]))*1.15;
  if(pts.length<2) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}" stroke="var(--panel3)" stroke-width="2"/></svg>`;
  const xy=pts.map(([t,b])=>[Math.max(0,W-(now-t)/span*W), H-2-(b/max)*(H-8)]);
  const line=xy.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  const area=`${line} L${xy.at(-1)[0].toFixed(1)} ${H} L${xy[0][0].toFixed(1)} ${H} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[.25,.5,.75].map(f=>`<line x1="0" y1="${H*f}" x2="${W}" y2="${H*f}" stroke="var(--panel3)" stroke-width="1"/>`).join('')}
    <path d="${area}" fill="url(#${gid})" stroke="none"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
const ours = it => !host || it.g.installKind==='nimbus';   // downloads Hearth runs itself (Epic, GOG) can be paused
function dlButtons(it, big){
  const g=it.g, id=esc(g.id), paused=it.state==='paused';
  // A Steam install Steam hasn't taken up yet can be cancelled here; after that it's Steam's (Manage in Steam).
  const waiting = g.src==='steam' && g.stage==='Waiting for Steam';
  if(!ours(it)) return big ? `${waiting?`<button class="pill ghost" data-f data-k="dc-x" data-act="dlCancel" data-id="${id}">${I.x} Cancel</button>`:''}<button class="pill ghost" data-f data-k="dc-steam" data-act="dlSteam">${I.display} Manage in Steam</button><button class="pill ghost" data-f data-k="dc-info" data-act="game" data-id="${id}">${I.info} Game details</button>`
    : waiting ? `<button class="ib" data-f data-k="dq-x-${id}" data-act="dlCancel" data-id="${id}" aria-label="Cancel">${I.x}</button>` : '';
  if(big) return `${paused?`<button class="pill" data-f data-k="dc-pp" data-act="dlResume" data-id="${id}">${I.play} Resume</button>`:`<button class="pill" data-f data-k="dc-pp" data-act="dlPause" data-id="${id}">${I.pause} Pause</button>`}

    <button class="ib" data-f data-k="dq-x-${id}" data-act="dlCancel" data-id="${id}" aria-label="Cancel">${I.x}</button>`;
}
function viewDownloads(){
  const items=dlItems(), cur=items.find(i=>i.state==='downloading') || items.find(i=>i.state!=='paused') || items[0], next=items.filter(i=>i!==cur);
  const speed=items.reduce((t,i)=>t+(i.speed||0),0);
  const peak=Math.max(speed, ...DLS.speeds.map(p=>p[1]));
  const st=SYSINFO.s && SYSINFO.s.storage;
  const recentIds = host ? DLS.recent.map(r=>r.id) : DL_DONE;
  const done=[...new Set([...DL_DONE, ...recentIds])].map(G).filter(g=>g && g.inst).slice(0,8);
  let h = '<div class="dl-wrap">';
  // A store whose sign-in expired: its downloads can't start until you sign in again (expSignIn).
  for(const s of ['epic','gog']) if(isExpired(s)) h += `<div class="rows" style="margin-bottom:14px"><button class="row" data-f data-k="dl-exp-${s}" data-act="expSignIn" data-s="${s}"><span class="ricon">${I.user}</span><div class="rt"><b>Your ${storeName(s)} sign-in expired</b><small>Downloads from ${storeName(s)} can't start until you sign in again${accOf(s).name?' as '+esc(accOf(s).name):''}.</small></div><div class="rv">Sign in again ›</div></button></div>`;
  if(cur){
    const g=cur.g, eta=etaText(cur), paused=cur.state==='paused';
    h += `<div class="dl-top">
      <div class="dl-card ${paused?'paused':''}"><div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide'])}
        <div class="dl-now-body"><div class="dl-k">${esc(cur.label)}</div><div class="dl-t">${esc(g.title)}</div>
          <div class="bar"><i style="width:${cur.pct??0}%"></i></div>
          <div class="dl-meta"><span>${cur.pct!=null?cur.pct+'%':''}</span>${cur.total?`<span>${gbs(cur.done)} of ${gbs(cur.total)}</span>`:''}${!paused&&cur.speed>1e4?`<span>${fmtSpeed(cur.speed)}</span>`:''}${!paused&&eta?`<span>${eta}</span>`:''}<span>${SOURCES[g.src]}</span></div>
          <div class="dl-acts">${dlButtons(cur,true)}</div></div></div>
      <div class="dl-speed"><div class="sub"><span>Download speed</span><span>Last 5 minutes</span></div>
        <div class="big">${fmtSpeed(speed).replace(/ (\S+)$/,'<small>$1</small>')}</div>
        ${speedGraph()}
        <div class="sub"><span>Peak ${fmtSpeed(peak)}</span>${st&&st.totalBytes?`<span>${gbs(st.freeBytes)} free of ${gbs(st.totalBytes)}</span>`:''}</div></div>
    </div>`;
  } else {
    h += `<div class="dl-sum"><div><b>No downloads</b><small>Everything is up to date</small></div>
      ${st&&st.totalBytes?`<div class="dl-disk"><small>${gbs(st.freeBytes)} free of ${gbs(st.totalBytes)}</small><div class="storage"><i style="width:${Math.round((1-st.freeBytes/st.totalBytes)*100)}%"></i></div></div>`:''}</div>`;
  }
  if(next.length) h += `<div class="dl-h"><h2>Up next · ${next.length}</h2></div>${next.map((it,i)=>{ const g=it.g; return `
      <div class="dl-q"><div class="thumb"><div class="art" style="position:absolute;inset:0;${artBg(g)}"></div>${artImg(g,['wide','hero','cover'])}</div>
        <div class="rt"><b>${esc(g.title)}</b><small>${esc(it.label)}${it.total?` · ${it.done?gbs(it.done)+' of ':''}${gbs(it.total)}`:''} · ${SOURCES[g.src]}</small>
          ${it.pct?`<div class="bar"><i style="width:${it.pct}%"></i></div>`:''}</div>
        ${dlButtons(it,false) || `<button class="ib" data-f data-k="dq-i-${i}" data-act="game" data-id="${esc(g.id)}" aria-label="Details">${I.info}</button>`}</div>`}).join('')}`;
  if(done.length) h += `<div class="dl-h"><h2>Recently installed</h2>${host?`<button class="pill ghost" data-f data-k="dd-clear" data-act="dlClearRecent">Clear</button>`:''}</div>${done.map(g=>`
      <div class="dl-q"><div class="thumb"><div class="art" style="position:absolute;inset:0;${artBg(g)}"></div>${artImg(g,['wide','hero','cover'])}</div>
        <div class="rt"><b>${esc(g.title)}</b><small>Installed · ${SOURCES[g.src]}</small></div>
        <button class="pill" data-f data-k="dd-${g.id}" data-act="play" data-id="${esc(g.id)}">${I.play} Play</button></div>`).join('')}`;
  if(!items.length && !done.length) h += `<div class="empty"><div class="muted" style="margin-bottom:16px">Nothing is downloading. Find a game to install in your library.</div>
      <button class="pill" style="display:inline-flex" data-f data-k="d-lib" data-act="nav" data-view="library">${I.lib} Library</button></div>`;
  if(host && items.some(i=>i.g.src==='steam')) h += note('Steam downloads its games in the background, without its window. To pause or reorder them, use Manage in Steam.');
  if(host && items.some(i=>i.g.installKind==='nimbus')) h += note('Epic and GOG games download one at a time. Paused downloads keep what they have and carry on from there, also after a restart.');
  return h + '</div>';
}

function pageWifi(){
  const w=S.sys.wifi;
  let h = radioRow('wifi','Wi-Fi', w.on ? (w.ssid?`Connected to ${w.ssid}`:'Not connected') : 'Off')
        + radioRow('air','Airplane mode','Turns off Wi-Fi and Bluetooth');
  if(!w.available) return h+note('No Wi-Fi adapter found on this PC.');
  if(!w.on) return h+note('Turn on Wi-Fi to see available networks.');
  h += shead('Available networks', S.sys.scanning);
  const nets=S.sys.nets;
  if(!nets) h += note(S.sys.scanning?'Looking for networks…':'');
  else if(!nets.length) h += note(LINUX ? 'No networks found.' : 'No networks found. On Windows 11 24H2 and later, scanning needs location access for desktop apps (Windows Settings › Privacy & security › Location).');
  else {
  // A short list: the network you're on and your saved ones, then the strongest others, up to 6. The rest
  // fold away behind "Show all networks" (a long list was hard to get through with a controller).
  const SHORT=6;
  const first=nets.filter(n=>n.connected||n.saved||S.sys.connecting===n.ssid);
  const others=nets.filter(n=>!first.includes(n));
  const shown=S.sys.wifiAll ? first.concat(others) : first.concat(others.slice(0, Math.max(0, SHORT-first.length)));
  const hidden=nets.length-shown.length;
  h += shown.map(n=>{
    const right = S.sys.connecting===n.ssid ? '<span class="mini-spin"></span>'
               : n.connected ? '<span class="tag on">Connected</span>'
               : n.secure ? `<span class="rv">${I.lock}</span>` : '';
    const sub=[n.secure?'Secured':'Open network', n.saved&&!n.connected?'Saved':''].filter(Boolean).join(' · ');
    return `<button class="row" data-f data-k="w-${hk(n.ssid)}" data-act="wifiNet" data-ssid="${esc(n.ssid)}"><span class="ricon">${barsIcon(n.bars)}</span><div class="rt"><b>${esc(n.ssid)}</b><small>${sub}</small></div>${right}</button>`;
  }).join('');
  if(hidden>0 || S.sys.wifiAll && others.length>Math.max(0, SHORT-first.length))
    h += `<button class="row" data-f data-k="w-all" data-act="wifiAll"><span class="ricon">${I.wifi}</span><div class="rt"><b>${S.sys.wifiAll?'Show fewer networks':`Show all networks (${hidden} more)`}</b></div><span class="rv">${S.sys.wifiAll?'▴':'▾'}</span></button>`;
  }
  h += `<button class="row" data-f data-k="w-scan" data-act="wifiScan"><span class="ricon">${I.refresh}</span><div class="rt"><b>${S.sys.scanning?'Scanning…':'Scan again'}</b></div></button>`;
  return h;
}
function devIcon(kind=''){
  const k=String(kind).toLowerCase();

  if(k.includes('keyboard')) return I.kbd;
  if(/mouse|pointing/.test(k)) return I.mouse;
  if(/audio|head|speaker/.test(k)) return I.head;

  if(/display|tele/.test(k)) return I.display;
  return I.bt;

let dispRevert=null;
async function setDisplayMode(w,h,hz){
  const d=S.sys.display, prev={w:d.width,h:d.height,hz:d.refreshRate};
  if(prev.w===w && prev.h===h && prev.hz===hz) return;
  if(d.appliesOnRestart){ // Linux Game Mode: gamescope picks up the new mode when Game Mode starts again
    toast('Restarting Game Mode with the new display settings…');
    try{ await call('display.setMode',{w,h,hz},30000); }catch(e){ toast(e.message); }
    return;
  }
  try{ const r=await call('display.setMode',{w,h,hz},30000); Object.assign(S.sys.display,r); refreshUI(); }
  catch(e){ return toast(e.message); }
  let left=15;
  const revert=async()=>{ clearInterval(dispRevert); dispRevert=null;
    try{ const r=await call('display.setMode',prev,30000); Object.assign(S.sys.display,r); toast('Switched back to the previous display settings'); }catch(e){ toast(e.message); }
    refreshUI(); };
  openSheet({title:'Keep these display settings?', sub:`${w} × ${h} at ${hz} Hz. Switching back in ${left} seconds…`, noCancel:true,
    items:[{label:'Keep changes',icon:'check',run:()=>{ clearInterval(dispRevert); dispRevert=null; toast('Display settings saved'); }},
           {label:'Switch back',icon:'restart',run:revert}],
    onCancel:revert});
  clearInterval(dispRevert);
  dispRevert=setInterval(()=>{
    left--;
    if(left<=0){ if(S.layers.at(-1)==='sheet' && sheet && sheet.title.startsWith('Keep these')){ sheet.picked=true; closeLayer(); } return revert(); }
    if(sheet && sheet.title.startsWith('Keep these')){ sheet.sub=`${w} × ${h} at ${hz} Hz. Switching back in ${left} seconds…`; const sub=$('#sheetBox .muted'); if(sub) sub.textContent=sheet.sub; }
  },1000);
}

let osdTimer=null;
function showOsd(d){
  if(!d) return;
  let el=$('#osd'); if(!el){ el=document.createElement('div'); el.id='osd'; el.className='osd'; document.body.appendChild(el); }
  if(d.kind==='msg'){ el.innerHTML=`${I[d.icon]||I.bell}<span style="flex:1">${esc(d.text||'')}</span>`; el.classList.add('on'); clearTimeout(osdTimer); osdTimer=setTimeout(()=>el.classList.remove('on'),(d.ms||4000)-300); return; }
  if(d.kind!=='vol') return;
  const max=d.max||100, v=d.volume||0, pct=Math.min(100,v/max*100);
  el.innerHTML = `${d.muted||!v?I.mute:I.vol}<div class="obar"><i class="${v>100?'hot':''}" style="width:${d.muted?0:pct}%"></i>${max>100?`<u style="left:${100/max*100}%"></u>`:''}</div><b>${d.muted?'Muted':v+'%'}</b>`;
  el.classList.add('on');
  S.sys.audio.volume=v; S.sys.audio.muted=!!d.muted; S.set.vol=v;
  clearTimeout(osdTimer); osdTimer=setTimeout(()=>el.classList.remove('on'),1500);
}

async function ctlDo(p, k){

// ---------- Settings › Controls › Handheld Daemon (the Hearth OS editions) ----------
// Handheld Daemon (HHD) runs the built-in controller, the power limit, the fan and the lights. Its own settings app
// isn't on these editions: this page is it, drawn from the settings tree HHD serves for this device (hhd.settings),
// so it has every setting HHD has, with HHD's titles, hints, choices and limits. HHD's sections are tabs; a mode
// (a choice with settings of its own, like the controller type) shows the settings of the one picked, under it.
// Switches, choices (a list), numbers (a slider), buttons (actions) and read-only lines; advanced ones behind
// "Show advanced settings"; hidden ones never. hearth-core checks every change against the same tree.
// While the page is open it reads HHD's state every 1.5 s, so changes made elsewhere (the power limit in Quick
// Access, HHD's own shortcuts) show up here.
const HHDS = {s:null};      // hhd.status: is HHD running (Settings › Controls shows the way in)
function loadHhd(){ if(LINUX) return call('hhd.status',{},20000).then(r=>{ HHDS.s=r; if(S.view==='settings') render(null,true); }).catch(()=>{ HHDS.s={running:false}; }); }
function hhdLinkRow(){
  const s=HHDS.s; if(!s || !s.running) return '';
  return shead('Handheld Daemon')
    + `<button class="row" data-f data-k="hhd-open" data-act="hhdOpen"><span class="ricon">${I.sliders}</span><div class="rt"><b>Handheld Daemon settings</b><small>Everything for the built-in controller, power limit, fan and lights</small></div><div class="rv">›</div></button>`;
}
const HHDP = {schema:null, version:null, state:{}, sections:{}, sec:null, adv:false, err:null, loading:false, timer:null, polling:false, pending:{}, busy:{},
  compact:false, kp:'hh-', offAt:0};   // compact, kp: drawing Quick Access's part (see hhdQam)
const HHD_SKIP = ['hidden','hhd-update-decky','hhd-version-display-decky','theme-selector'];   // as hearth-core's SKIP_TAGS
const HHD_KINDS = ['container','mode','bool','multiple','discrete','int','float','action','display','custom'];
const HHD_FIRST = ['controllers','tdp','rgb'];   // the sections most people want, first; then HHD's order
const hhdTags = n => Array.isArray(n && n.tags) ? n.tags : [];
const hhdTitle = (n, k) => { const t = n && typeof n.title==='string' ? n.title.trim() : ''; return t || String(k||'').split('.').pop().replace(/_/g,' ').replace(/^./, c=>c.toUpperCase()); };
// A value in HHD's state by dotted key (a change on its way to HHD counts already).
function hv(k){ if(k in HHDP.pending) return HHDP.pending[k]; return k.split('.').reduce((o,p)=>o==null?undefined:o[p], HHDP.state); }
function hhdShown(n){
  if(!n || typeof n!=='object' || !HHD_KINDS.includes(n.type)) return false;
  const t=hhdTags(n);
  if(t.some(x=>HHD_SKIP.includes(x))) return false;
  if(!HHDP.adv && (t.includes('advanced') || t.includes('expert'))) return false;
  if(HHDP.compact && t.includes('non-essential')) return false;   // Quick Access: the essentials only (a fan curve's points stay on the page)
  if(n.type==='container') return Object.values(n.children||{}).some(hhdShown);
  if(n.type==='mode') return Object.values(n.modes||{}).some(m=>m && !hhdTags(m).some(x=>HHD_SKIP.includes(x)));
  return true;
}
// The entry for a dotted key, as hearth-core's find(): {n, mode} (mode: the key is a mode's choice), or null.
function hhdFind(key){
  const p=String(key).split('.'); if(p.length<3 || !HHDP.schema) return null;
  let n=(HHDP.schema[p[0]]||{})[p[1]];
  for(let i=2;i<p.length;i++){
    if(!n || typeof n!=='object') return null;
    if(n.type==='mode' && p[i]==='mode' && i===p.length-1) return {n, mode:true};
    n = n.type==='mode' ? (n.modes||{})[p[i]] : n.type==='container' ? (n.children||{})[p[i]] : null;
  }
  return n && !['container','mode'].includes(n.type) ? {n, mode:false} : null;
}
function hhdSections(){
  const S2=HHDP.schema||{};
  const keys=Object.keys(S2).filter(s=>Object.values(S2[s]||{}).some(hhdShown));
  return [...HHD_FIRST.filter(k=>keys.includes(k)), ...keys.filter(k=>!HHD_FIRST.includes(k))];
}
const hhdSecTitle = s => (HHDP.sections && typeof HHDP.sections[s]==='string' && HHDP.sections[s]) || s.replace(/_/g,' ').replace(/^./, c=>c.toUpperCase());
function hhdLoad(){
  if(HHDP.loading) return; HHDP.loading=true;
  return call('hhd.settings',{},20000).then(r=>{
    HHDP.loading=false;
    if(!r || !r.running){ HHDP.schema=null; HHDP.err='off'; HHDP.offAt=Date.now(); }
    else {
      HHDP.schema = typeof r.schema==='string' ? JSON.parse(r.schema) : (r.schema||{});
      HHDP.version=r.version||null; HHDP.state=r.state||{}; HHDP.sections=r.sections||{}; HHDP.err=null;
    }
    if(S.view==='hhd') render(null,true);
    qamPerfRedraw();
  }).catch(e=>{ HHDP.loading=false; HHDP.err=e.message||String(e); if(S.view==='hhd') render(null,true); qamPerfRedraw(); });
}
function hhdApply(r){
  if(!r || !r.running) return;
  if(r.version && HHDP.version && r.version!==HHDP.version) return hhdLoad();   // HHD changed its tree: read it again
  const before=JSON.stringify(HHDP.state); HHDP.state=r.state||{};
  if(JSON.stringify(HHDP.state)!==before){ if(S.view==='hhd') render(null,true); qamPerfRedraw(); }
}
/** Whatever shows Handheld Daemon's settings, drawn again: its page, and Quick Access › Performance. */
function hhdRedraw(){ if(S.view==='hhd') render(null,true); qamPerfRedraw(); }
function hhdStartPoll(){
  clearInterval(HHDP.timer);
  HHDP.timer=setInterval(()=>{
    if(S.view!=='hhd'){ clearInterval(HHDP.timer); HHDP.timer=null; return; }
    if(HHDP.polling || HHDP.loading || !HHDP.schema) return;
    HHDP.polling=true;
    call('hhd.state',{},8000).then(r=>{ HHDP.polling=false; hhdApply(r); }).catch(()=>{ HHDP.polling=false; });
  }, 1500);
}
function hhdOpen(){ closeAll(); S.settingsTab='controller'; navigate('hhd'); }
const hhdHint = n => n && n.hint && !HHDP.compact ? `<small>${esc(String(n.hint).trim())}</small>` : '';   // Quick Access: no hints (HHD's are long)
const hhdNum = (v, unit) => v==null || v==='' ? '—' : (typeof v==='number' ? String(+v.toFixed(3)) : esc(String(v))) + (unit ? (/^[%°]/.test(unit)?'':' ')+esc(unit) : '');
function hhdOptLabel(n, id){
  if(n.type==='mode'){ const m=(n.modes||{})[id]; return m ? hhdTitle(m, id)+(m.unit?` (${m.unit})`:'') : String(id??'—'); }
  const o=n.options||{}; const l=o[id]; return typeof l==='string' && l ? l : String(id??'—');
}
function hhdRow(k, n){
  const id=HHDP.kp+k, title=esc(hhdTitle(n, k)), t=hhdTags(n), busy=HHDP.busy[k];
  const right = v => busy ? '<span class="mini-spin"></span>' : v;
  switch(n.type){
    case 'bool': return `<button class="row" data-f data-k="${id}" data-act="hhd" data-op="bool" data-key="${esc(k)}"><div class="rt"><b>${title}</b>${hhdHint(n)}</div>${right(`<div class="sw ${hv(k)?'on':''}"></div>`)}</button>`;
    case 'multiple':
      if(!Object.keys(n.options||{}).length) return '';
      return `<button class="row" data-f data-k="${id}" data-act="hhd" data-op="pick" data-key="${esc(k)}"><div class="rt"><b>${title}</b>${hhdHint(n)}</div>${right(`<div class="rv">${esc(hhdOptLabel(n, hv(k)))} ›</div>`)}</button>`;
    case 'discrete': case 'int': case 'float': {
      const lim = n.type==='discrete' ? (n.options||[]).length>1 : typeof n.min==='number' && typeof n.max==='number' && n.max>n.min;
      if(!lim) return `<button class="row" data-f data-k="${id}" data-act="hhd" data-op="num" data-key="${esc(k)}"><div class="rt"><b>${title}</b>${hhdHint(n)}</div>${right(`<div class="rv">${hhdNum(hv(k), n.unit)} ›</div>`)}</button>`;
      let min, max, step, pos, shown;
      if(n.type==='discrete'){ const o=n.options; min=0; max=o.length-1; step=1; pos=Math.max(0, o.findIndex(x=>x==hv(k))); shown=hhdNum(o[pos], n.unit); }
      else { min=n.min; max=n.max; step=+n.step>0 ? +n.step : (n.type==='int' ? 1 : (max-min)/20); const v=hv(k); pos=typeof v==='number' ? Math.max(min, Math.min(max, v)) : min; shown=hhdNum(v, n.unit); }
      const pct=(pos-min)/(max-min)*100;
      return `<div class="ctl" data-f data-k="${id}" data-slider="hhd:${esc(k)}" data-min="${min}" data-max="${max}" data-step="${step}" data-unit="">
        <div class="lab">${title}<span>${shown}</span></div><div class="slider"><i style="width:${pct}%"></i><b style="left:${pct}%"></b></div>${n.hint&&!HHDP.compact?`<div class="muted chint">${esc(String(n.hint).trim())}</div>`:''}</div>`;
    }
    case 'action': {
      const running = busy || !!hv(k);
      return `<button class="row" data-f data-k="${id}" data-act="hhd" data-op="action" data-key="${esc(k)}"><span class="ricon">${I.play}</span><div class="rt"><b>${title}</b>${hhdHint(n)}</div>${running?'<span class="mini-spin"></span>':''}</button>`;
    }
    case 'display': {
      const v=hv(k); if(v==null || v==='' || (typeof v==='object' && !Object.keys(v).length)) return '';
      const text = typeof v==='object' ? JSON.stringify(v) : String(v), err=t.includes('error');
      const blank = !n.title || !String(n.title).trim();
      return `<div class="row" data-f data-k="${id}"><span class="ricon">${err?I.x:I.info}</span><div class="rt">${blank?'':`<b${err?' style="color:var(--danger)"':''}>${title}</b>`}<small style="white-space:pre-line${blank?';font-size:14px;color:var(--text)':''}">${esc(text)}</small></div></div>`;
    }
    case 'custom': {
      const v=hv(k);
      if(t.includes('dropdown') && v && typeof v==='object' && v.options)
        return `<button class="row" data-f data-k="${id}" data-act="hhd" data-op="pick" data-key="${esc(k)}"><div class="rt"><b>${title}</b>${hhdHint(n)}</div>${right(`<div class="rv">${esc(v.options[v.value]||v.value||'—')} ›</div>`)}</button>`;
      if(t.includes('progress') && v && typeof v==='object'){
        const pct = typeof v.value==='number' ? Math.max(0, Math.min(100, v.value/(v.max||100)*100)) : null;
        return `<div class="row" data-f data-k="${id}"><div class="rt"><b>${esc(v.text||hhdTitle(n,k))}</b>${pct!=null?`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`:'<small>Working…</small>'}</div></div>`;
      }
      if(v!=null && typeof v!=='object' && v!=='') return `<div class="row" data-f data-k="${id}"><div class="rt"><b>${title}</b><small>${esc(String(v))}</small></div></div>`;
      return '';
    }
  }
  return '';
}
function hhdMode(k, n){
  const cur=hv(k+'.mode'), m=(n.modes||{})[cur];
  let h = `<button class="row" data-f data-k="${HHDP.kp}${k}.mode" data-act="hhd" data-op="pick" data-key="${esc(k)}.mode"><div class="rt"><b>${esc(hhdTitle(n,k))}</b>${m&&m.hint&&!HHDP.compact?`<small>${esc(String(m.hint).trim())}</small>`:hhdHint(n)}</div>${HHDP.busy[k+'.mode']?'<span class="mini-spin"></span>':`<div class="rv">${esc(hhdOptLabel(n, cur))} ›</div>`}</button>`;
  if(m && hhdShown(m)) h += `<div class="hhd-sub">${hhdKids(k+'.'+cur, m)}</div>`;
  else if(HHDP.compact && m && Object.keys(m.children||{}).length) h += `<div class="muted qhhd-note" style="margin:0 4px 2px">${LINUX&&!OVERLAY?'Its settings are in Handheld Daemon settings, below.':'Its settings are in Settings › Controls › Handheld Daemon.'}</div>`;
  return h;
}
function hhdKids(k, c){
  const items = Object.entries(c.children||{}).filter(([,n])=>hhdShown(n)).map(([ck,n])=>{
    const key=k+'.'+ck;
    if(n.type==='mode') return [hhdMode(key, n)];
    if(n.type==='container') return [`${n.title&&!hhdTags(n).includes('hide-title')?`<div class="hhd-h">${esc(hhdTitle(n,ck))}</div>`:''}<div class="hhd-sub">${hhdKids(key, n)}</div>`];
    return [hhdRow(key, n), n.type==='bool'];
  });
  // On the page (not Quick Access): switches next to each other go two to a line on wide screens.
  let h='', run=[];
  const flush=()=>{ h += run.length>1 && !HHDP.compact ? sgrid(run.join('')) : run.join(''); run=[]; };
  for(const [html, sw] of items){ if(sw && html) run.push(html); else { flush(); h += html; } }
  flush();
  return h;
}
function viewHhd(){
  let h='<div class="rows srows">';
  if(!HHDP.schema){
    h += HHDP.err==='off' ? note('Handheld Daemon isn\'t running, so its settings can\'t be shown. It starts with Hearth OS on handhelds it supports.')
       : HHDP.err ? note('Couldn\'t read Handheld Daemon\'s settings: '+esc(HHDP.err))
                    + `<button class="row" data-f data-k="hh-retry" data-act="hhdRetry"><span class="ricon">${I.refresh}</span><div class="rt"><b>Try again</b></div></button>`
       : note('Loading…');

  }
  const secs=hhdSections();

  const sec=HHDP.schema[HHDP.sec]||{}, conts=Object.entries(sec).filter(([,c])=>hhdShown(c));
  for(const [ck,c] of conts){
    const key=HHDP.sec+'.'+ck;
    const head = conts.length>1 && !hhdTags(c).includes('hide-title') ? hhdTitle(c, ck) : '';
    if(head) h += shead(esc(head));
    h += c.type==='container' ? hhdKids(key, c) : c.type==='mode' ? hhdMode(key, c) : hhdRow(key, c);
  }
  if(HHDP.sec==='tdp') h += note('The same power settings as in Quick Access › Performance.');
  h += `<button class="row" data-f data-k="hh-adv" data-act="hhd" data-op="adv"><div class="rt"><b>Show advanced settings</b><small>Settings most people don't need, like extra buttons, stick and trigger ranges, and Handheld Daemon's own options</small></div><div class="sw ${HHDP.adv?'on':''}"></div></button>`;
  h += note('Handheld Daemon '+(hv('hhd.settings.version')?esc(hv('hhd.settings.version'))+' ':'')+'runs the built-in controller, power limit, fan and lights. Changes apply right away.');
  return h+'</div>';
}
// The settings a game keeps (as hearth-core's game_power_key): a power plugin's power mode, and its custom mode's.
const HHD_GAME_KEY = /^tdp\.[A-Za-z0-9_-]+\.tdp\.(mode|custom\.[A-Za-z0-9_-]+)$/;
async function hhdWrite(key, value, opts={}){
  HHDP.busy[key]=true; if(!opts.quiet) hhdRedraw();
  // From Quick Access › Performance while a game plays: the game keeps it (hearth-core puts it back on whenever
  // the game is in front).
  const game = qamPerfShowing() && !!S.running && HHD_GAME_KEY.test(key);
  try{
    const r=await call('hhd.set',{key, value, state:true, game},30000);
    if(HHDP.pending[key]===value) delete HHDP.pending[key];
    if(r && r.gamePower && PERF.s) PERF.s.gamePower=r.gamePower;
    hhdApply(r);
    if(opts.done) toast(opts.done);
  }catch(e){ if(HHDP.pending[key]===value) delete HHDP.pending[key]; toast(e.message||String(e)); }
  delete HHDP.busy[key];
  hhdRedraw();
}
function hhdAct(op, key){
  if(op==='sec'){ HHDP.sec=key; return render('hh-sec-'+key, true); }
  if(op==='adv'){ HHDP.adv=!HHDP.adv; return render('hh-adv', true); }
  const f=hhdFind(key); if(!f || HHDP.busy[key]) return;
  const n=f.n, title=hhdTitle(n, key);
  if(op==='bool'){ const v=!hv(key); HHDP.pending[key]=v; return hhdWrite(key, v); }
  if(op==='action'){
    const run=()=>hhdWrite(key, true, {done:title+': done'});
    if(hhdTags(n).includes('verify')) return openSheet({title:title+'?', sub:n.hint?String(n.hint).trim():'', items:[{label:title, icon:'check', run}]});
    return run();
  }
  if(op==='pick'){
    const cur=hv(key);
    let items;
    if(f.mode) items=Object.entries(n.modes||{}).filter(([,m])=>m && !hhdTags(m).some(x=>HHD_SKIP.includes(x))).map(([id])=>({id, label:hhdOptLabel(n, id)}));
    else if(n.type==='custom') items=Object.entries((cur&&cur.options)||{}).map(([id,l])=>({id, label:String(l||id)}));
    else items=Object.keys(n.options||{}).map(id=>({id, label:hhdOptLabel(n, id)}));
    const now = n.type==='custom' ? cur&&cur.value : cur;
    return openSheet({title, sub:n.hint?String(n.hint).trim():'', items:items.map(o=>({label:o.label, icon:o.id===now?'check':'', run:()=>{ if(o.id!==now) hhdWrite(key, o.id); }}))});
  }
  if(op==='num'){
    const v=typeof hv(key)==='number' ? hv(key) : 0, st=+n.step>0 ? +n.step : 1;
    const ok=x=>(typeof n.min!=='number'||x>=n.min) && (typeof n.max!=='number'||x<=n.max);
    const items=[[st,'Raise'],[-st,'Lower']].map(([d,l])=>[+(v+d).toFixed(6),l]).filter(([x])=>ok(x)).map(([x,l])=>({label:`${l} to ${hhdNum(x,n.unit)}`, run:()=>hhdWrite(key, n.type==='int'?Math.round(x):x)}));
    return openSheet({title, sub:`Now ${hhdNum(v,n.unit)}`, items});
  }
}
/** A Handheld Daemon slider moved (adjustSlider hands the hhd: ones here); the change goes to HHD a moment after it stops. */
function hhdSlide(el, d){
  const sk=el.dataset.slider, key=sk.slice(4), f=hhdFind(key); if(!f) return;
  const n=f.n, min=+el.dataset.min, max=+el.dataset.max, st=+el.dataset.step;
  const cur = n.type==='discrete' ? Math.max(0, (n.options||[]).findIndex(x=>x==hv(key))) : (typeof hv(key)==='number' ? hv(key) : min);
  let pos = d===0 && typeof S.set[sk]==='number' ? S.set[sk] : cur + d*st;
  delete S.set[sk];
  pos = Math.max(min, Math.min(max, +(min + Math.round((pos-min)/st)*st).toFixed(6)));
  const value = n.type==='discrete' ? n.options[pos] : n.type==='int' ? Math.round(pos) : pos;
  if(value===hv(key)) return;
  HHDP.pending[key]=value;
  const pct=(pos-min)/(max-min)*100;
  el.querySelector('.slider i').style.width=pct+'%'; el.querySelector('.slider b').style.left=pct+'%';
  el.querySelector('.lab span').innerHTML=hhdNum(value, n.unit);
  debounce(sk, ()=>hhdWrite(key, value, {quiet:true}), 350);
  blip(500+pct*3,.03);
}
