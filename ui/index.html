function onSysEvent(name, data){
  if(name==='status') return applyStatus(data);
  if(name==='open'){ if(data&&data.view&&S.view!==data.view) navigate(data.view); return; }
  if(name==='game.started') return gameStarted(data.id);
  if(name==='update') return OVERLAY ? null : onUpdate(data);
  if(name==='pad') return hostPad(data.b);
  if(name==='padMouse'){ PAD.mouseOn=!!data.on; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='padHost'){ PAD.host = data.connected>0; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='game.exited') return gameEnded(data);
  if(name==='accounts.changed') return OVERLAY ? null : loadAccounts(true);
  if(name==='overlay.shown') return overlayShown();
  if(name==='overlay.hidden') return overlayHidden();
  if(name==='install.done'){
    const t=data.title||'The game';
    if(data.error==='cancelled') toast(`Cancelled the download of ${t}`);
    else if(data.error) toast(`${t} didn't install: ${data.error}`);
    else { toast(`${t} is installed and ready to play`); NOTIFS.unshift({i:'dl', t:`${t} is ready to play`, s:'Installed by '+APP+''}); updateBadge(); }
    return OVERLAY ? null : loadLibrary(true);
  }
  if(name==='game.timeout'){ hideLaunch(); const g=G(data.id); return toast(`${APP} couldn't see ${g?g.title:'the game'} start. If it's running, it still works; it just won't show here.`); }
  if(name==='bt.found'){
    const known = S.sys.found.some(d=>d.id===data.id) || (S.sys.paired||[]).some(d=>d.id===data.id);
    if(!known && data.name){ S.sys.found.push(data); refreshUI(); }
    return;
  }
  if(name==='bt.scanDone'){ S.sys.btScanning=false; S.sys.foundDone=true; return refreshUI(); }
  if(name==='bt.pin'){
    if(data.confirm) return openSheet({title:'Confirm pairing', sub:`Make sure the device shows ${data.pin}`,
      items:[{label:'It matches, pair',icon:'check',run:()=>call('bt.confirmPin',{accept:true}).catch(()=>{})},
             {label:"It doesn't match",icon:'x',run:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})}],
      noCancel:true, onCancel:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})});
    return openSheet({title:'Enter this PIN on the device', sub:`${data.pin}, then press Enter on the device`, items:[{label:'OK',icon:'check'}], noCancel:true});
  }
}
function applyStatus(st){
  if(!st) return;
  if(st.wifi) S.sys.wifi={...S.sys.wifi,...st.wifi};
  if(st.bt) S.sys.bt={...S.sys.bt,...st.bt};
  if('airplane' in st) S.sys.airplane=!!st.airplane;
  if(st.battery) S.sys.battery=st.battery;
  if(st.audio) Object.assign(S.sys.audio, st.audio);
  if(st.display) Object.assign(S.sys.display, st.display);
  if(st.powerMode) S.sys.powerMode=st.powerMode;
  if(S.sys.nets) S.sys.nets.forEach(n=>n.connected = n.ssid===S.sys.wifi.ssid);
  S.set.vol=S.sys.audio.volume; S.set.bright=S.sys.display.brightness;
  refreshUI();
}
function refreshStatus(){ return call('sys.status').then(applyStatus).catch(()=>{}); }

// Re-render whatever is showing live system data, keeping focus where it was.
function refreshUI(){
  updateStatusBar();
  if(S.view==='settings') render(null, true);
  if(S.layers.includes('qam')){
    const k = focused && $('#qam').contains(focused) ? focused.dataset.k : null;
    renderQam();
    if(k){ const el=$(`#qam [data-k="${k}"]`); if(el) setFocus(el,true); }
  }
}
function updateStatusBar(){
  const w=S.sys.wifi, ws=$('#wifiStat');
  ws.innerHTML = S.sys.airplane ? I.plane : !w.on ? I.wifiOff : barsIcon(w.ssid ? w.bars : 0);
  ws.style.opacity = (w.on && w.ssid && !S.sys.airplane) ? 1 : .5;
  const b=S.sys.battery;
  if(b && b.present===false) $('#batt').style.display='none';
  else if(b && b.pct!=null){ $('#batt').style.display=''; $('#battPct').textContent=b.pct+'%'+(b.charging?' ⚡':''); $('#battFill').setAttribute('width', Math.max(1,10*b.pct/100)); }
}

function onSettingsTab(t){
  if(t==='wifi') wifiScan();
  if(t==='shell') loadShellStatus();
  if(t==='profile'){ loadProfile(); loadAccounts(true); }
  if(t==='updates') loadUpdateStatus();
  if(t==='controller') call('overlay.settings').then(r=>{ OVS.s=r; render(null,true); }).catch(()=>{});
  if(t==='controller' && host) call('pad.status').then(s=>{ PAD.mouseMode=s.mouseMode; PAD.mouseOn=s.mouseOn; PAD.host=s.connected>0; render(null,true); }).catch(()=>{});
  if(t==='bluetooth') loadPaired();
  if(t==='audio') call('audio.get').then(r=>{ Object.assign(S.sys.audio,r); S.set.vol=r.volume; refreshUI(); }).catch(e=>toast(e.message));
  if(t==='display') call('display.get').then(r=>{ Object.assign(S.sys.display,r); S.set.bright=r.brightness; refreshUI(); }).catch(e=>toast(e.message));
  if(t==='power') call('power.get').then(r=>{ S.sys.battery={present:r.present,pct:r.pct,charging:r.charging}; S.sys.powerMode=r.mode; refreshUI(); }).catch(e=>toast(e.message));
}

async function toggleRadio(kind){
  if(S.sys.busy[kind]) return;
  S.sys.busy[kind]=true; refreshUI();
  try{
    const st = kind==='air' ? await call('airplane.set',{on:!S.sys.airplane})
                            : await call('radios.set',{kind, on:!radioOn(kind)});
    applyStatus(st);
    if(kind!=='bt'){ S.sys.nets=null; if(S.sys.wifi.on) setTimeout(()=>wifiScan(true), 1200); } // adapter needs a moment after power-on
    if(kind!=='wifi'){ if(!S.sys.bt.on){ S.sys.found=[]; S.sys.btScanning=false; } loadPaired(); }
  }catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[kind]; refreshUI(); }
}

// ---- Wi-Fi ----
async function wifiScan(force){
  if(S.sys.scanning || !S.sys.wifi.on) return;
  if(!force && S.sys.nets && Date.now()-S.sys.scannedAt < 20000) return;
  S.sys.scanning=true; refreshUI();
  try{ S.sys.nets = await call('wifi.scan'); S.sys.scannedAt=Date.now(); }
  catch(e){ toast(e.message); if(!S.sys.nets) S.sys.nets=[]; }
  finally{ S.sys.scanning=false; refreshUI(); }
}
function askPassword(n){
  openPrompt({title:`Password for ${n.ssid}`, secret:true, min:8}).then(pw=>{ if(pw!=null) wifiConnect(n,pw); });
}
function wifiNet(ssid){
  const n=(S.sys.nets||[]).find(x=>x.ssid===ssid);
  if(!n || S.sys.connecting) return;
  if(n.connected) return openSheet({title:ssid, sub:'Connected', items:[
    {label:'Disconnect',icon:'x',run:wifiDisconnect},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(n.saved) return openSheet({title:ssid, sub:'Saved network', items:[
    {label:'Connect',icon:'wifi',run:()=>wifiConnect(n)},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(!n.secure) return wifiConnect(n);
  askPassword(n);
}
async function wifiConnect(n,pw){
  S.sys.connecting=n.ssid; refreshUI();
  let retry=false;
  try{
    const r=await call('wifi.connect',{ssid:n.ssid, password:pw==null?null:pw}, 60000);
    if(r && r.ok) toast(`Connected to ${n.ssid}`);
    else { const err=(r&&r.error)||"Couldn't connect"; toast(err); retry = n.secure && /password|credential/i.test(err); }
  }catch(e){ toast(e.message); }
  finally{ S.sys.connecting=null; await refreshStatus(); refreshUI(); }
  if(retry) askPassword(n); else wifiScan(true);
}
async function wifiDisconnect(){
  try{ await call('wifi.disconnect'); toast('Disconnected'); }catch(e){ toast(e.message); }
  await refreshStatus(); wifiScan(true);
}
async function wifiForget(ssid){
  try{ await call('wifi.forget',{ssid}); toast(`Forgot ${ssid}`); }catch(e){ toast(e.message); }
  await refreshStatus(); wifiScan(true);
}

// ---- Bluetooth ----
function loadPaired(){
  return call('bt.paired').then(list=>{
    S.sys.paired=list||[];
    S.sys.found=S.sys.found.filter(f=>!S.sys.paired.some(p=>p.id===f.id));
    refreshUI();
  }).catch(e=>{ if(S.sys.paired==null) S.sys.paired=[]; toast(e.message); refreshUI(); });
}
async function btScanToggle(){
  if(S.sys.btScanning){ S.sys.btScanning=false; refreshUI(); return call('bt.scanStop').catch(()=>{}); }
  S.sys.found=[]; S.sys.foundDone=false; S.sys.btScanning=true; refreshUI();
  try{ await call('bt.scanStart',{seconds:15}); }
  catch(e){ S.sys.btScanning=false; toast(e.message); refreshUI(); }
}
async function btPair(id){
  const d=S.sys.found.find(x=>x.id===id);
  if(!d || S.sys.busy[id]) return;
  S.sys.busy[id]=true; refreshUI(); toast(`Pairing with ${d.name}…`);
  try{
    const r=await call('bt.pair',{id}, 120000);
    if(r && r.ok){ toast(`${d.name} is paired`); S.sys.found=S.sys.found.filter(x=>x.id!==id); }
    else toast(`Couldn't pair: ${(r&&r.error)||'unknown error'}`);
  }catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[id]; await loadPaired(); }
}
function btDevice(id){
  const d=(S.sys.paired||[]).find(x=>x.id===id); if(!d) return;
  openSheet({title:d.name, sub:d.connected?'Connected':'Paired · turn the device on to connect', items:[
    {label:'Remove device',icon:'trash',run:()=>btUnpair(d)}]});
}
async function btUnpair(d){
  S.sys.busy[d.id]=true; refreshUI();
  try{ const r=await call('bt.unpair',{id:d.id}); toast(r && r.ok ? `Removed ${d.name}` : `Couldn't remove: ${(r&&r.error)||'unknown error'}`); }
  catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[d.id]; await loadPaired(); }
}

// ---- Audio / power ----
async function setMute(m){
  try{ await call('audio.setMute',{m}); S.sys.audio.muted=m; }catch(e){ toast(e.message); }
  refreshUI();
}
async function setOutput(id){
  try{ const r=await call('audio.setDefault',{id}); Object.assign(S.sys.audio,r); S.set.vol=r.volume;
       const d=r.devices.find(x=>x.id===id); if(d) toast(`Sound output: ${d.name}`); }
  catch(e){ toast(e.message); }
  refreshUI();
}
async function setPowerMode(mode){
  try{ const r=await call('power.setMode',{mode}); S.sys.powerMode=r.mode; }catch(e){ toast(e.message); }
  refreshUI();
}

// ---------- input modes & footer prompts ----------
// Prompts follow whatever you used last: controller buttons, keyboard keys, or clickable buttons for the mouse.
// Settings › Controls can pin them to one style.
const INPUT = {last:'kbd', mode:'auto'};
try{ INPUT.mode = localStorage.getItem('nimbus.inputMode') || 'auto'; }catch(e){}
function promptStyle(){ return INPUT.mode==='auto' ? INPUT.last : INPUT.mode; }
function setInput(kind){
  if(INPUT.last===kind) return;
  INPUT.last=kind;
  document.body.classList.toggle('pad-mode', kind==='pad');
  renderFooter();
  // Update the label in place: re-rendering here would swallow the click that caused it.
  const n=$('#inputNow'); if(n) n.textContent = INPUT_NAMES[kind];
}
const INPUT_NAMES = {pad:'Controller', kbd:'Keyboard', mouse:'Mouse or touch'};
const GLYPHS = {
  pad: {select:['A','a'], back:['B','b'], search:['Y','y'], menu:['☰',''], qam:['⧉',''], tabs:['LB RB',''], adjust:['◀▶',''], del:['Y','y'], space:['X','x'], done:['☰',''], stores:['X','x']},
  kbd: {select:['Enter','kc'], back:['Esc','kc'], search:['/','kc'], menu:['M','kc'], qam:['Q','kc'], tabs:['Tab','kc'], adjust:['← →','kc'], del:['Bksp','kc'], space:['Space','kc'], done:['Enter','kc'], stores:['F','kc']},
};
const HINT_ICON = {back:I.x, search:I.search, menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>', qam:I.sliders, tabs:I.lib, stores:I.user};
function renderFooter(){
  const top=S.layers.at(-1);
  const tb=$('#topBack'); if(tb) tb.classList.toggle('show', !!(S.layers.length || S.history.length));
  if(top==='launch'){ $('#footer').innerHTML=''; return; }
  const style=promptStyle();
  const h=[];  // [id, label]
  if(focused?.dataset.slider) h.push(['adjust','Adjust']);
  h.push(['select','Select'],['back','Back']);
  if(top==='prompt') h.push(['del','Delete'],['space','Space'],['done','Done']);
  if(!top && S.view==='library') h.push(['tabs','Tabs'],['stores','Stores']);
  if(top==='qam') h.push(['tabs','Sections']);
  if(!top) h.push(['search','Search'],['menu','Menu'],['qam','Quick Access']);
  const g=S.running&&G(S.running);
  const items = h.filter(([id])=> style!=='mouse' || !['select','adjust'].includes(id)).map(([id,l],i)=>{
    let glyph;
    if(style==='mouse') glyph = HINT_ICON[id] || '';
    else { const [k,c]=(GLYPHS[style]||GLYPHS.kbd)[id]; glyph=`<span class="glyph ${c}">${k}</span>`; }
    return `<button class="hint ${i>2?'hide-s':''}" data-act="hint" data-h="${id}">${glyph}${l}</button>`;
  });
  $('#footer').innerHTML = (g?`<div class="running"><span class="dot"></span>${esc(g.title)}</div>`:'') + items.join('');
}
function hintAction(id){
  ({select:()=>focused&&act(focused), back:()=>back(), search:()=>input('y'), menu:()=>input('start'),
    qam:()=>input('select'), tabs:()=>input('rb'), adjust:()=>{}, del:()=>input('y'), space:()=>input('x'), done:()=>input('start'), stores:()=>input('x')})[id]?.();
}

// =====================================================================
// Input: gamepad, keyboard, pointer
// =====================================================================
function input(k){
  const top=S.layers.at(-1);
  if(top==='launch') return;
  if(OVERLAY){
    // The overlay is only the Quick Access panel (plus its pop-ups and the text prompt).
    if((k==='select'||k==='guide') && top==='qam') return overlayClose();
    if(k==='start' && top!=='prompt') return;
    if((k==='y'||k==='x') && top!=='prompt') return;
  }
  switch(k){
    case 'up': case 'down': case 'left': case 'right': return move(k);
    case 'a': return focused && act(focused);
    case 'b': return back();
    case 'start': return top==='prompt' ? promptSubmit() : toggleLayer('menu');
    case 'select': case 'guide': return top==='prompt'||top==='sheet' ? null : toggleLayer('qam');
    case 'y': return top==='prompt' ? promptKey('bksp') : top==='search' ? typeKey('bksp') : (closeAll(), query='', openLayer('search'));
    case 'x': return top==='prompt' ? promptKey(' ') : top==='search' ? typeKey(' ') : (S.view==='game' && !top ? act($('[data-k="g-fav"]')) : S.view==='library' && !top ? navigate('stores') : null);
    case 'lb': case 'rb': return shiftTab(k==='lb'?-1:1);
  }
}
function shiftTab(d){
  const top=S.layers.at(-1);
  if(top==='qam'){ const i=QTABS.findIndex(t=>t[0]===S.qtab); S.qtab=QTABS[(i+d+QTABS.length)%QTABS.length][0]; renderQam(); if(S.qtab==='perf') startPerf(); setFocus($(`#qam [data-k="qt-${S.qtab}"]`),true); return blip(600); }
  if(!top && S.view==='library'){ const i=LIB_TABS.findIndex(t=>t[0]===S.tab); S.tab=LIB_TABS[(i+d+LIB_TABS.length)%LIB_TABS.length][0]; render('tab-'+S.tab); return blip(600); }
}

// Controllers: Xbox-style controllers come from the host (XInput, exact button names, works with any
// controller order). Other controllers use the browser gamepad API, with optional A/B and X/Y swaps.
const OVS = {s:null};
async function overlayTip(){
  let shown=false; try{ shown=localStorage.getItem('nimbus.overlayTip')==='1'; }catch(e){}
  if(shown || !host || LINUX) return;
  try{ localStorage.setItem('nimbus.overlayTip','1'); }catch(e){}
  try{ OVS.s=await call('overlay.settings'); }catch(e){ return; }
  toast(OVS.s.gameBarButton ? 'Tip: press the Xbox button for the '+APP+' overlay. If Game Bar opens too, turn it off in Settings › Controls.'
                            : 'Tip: press the Xbox button for the '+APP+' overlay.');
}
const PAD = {host:false, last:'', swapAB:false, swapXY:false, mouseMode:'steam', mouseOn:false};
try{ PAD.swapAB = localStorage.getItem('nimbus.swapAB')==='1'; PAD.swapXY = localStorage.getItem('nimbus.swapXY')==='1'; }catch(e){}
function mapPad(k){
  if(PAD.swapAB && (k==='a'||k==='b')) return k==='a'?'b':'a';
  if(PAD.swapXY && (k==='x'||k==='y')) return k==='x'?'y':'x';
  return k;
}
const PAD_NAMES = {a:'A',b:'B',x:'X',y:'Y',lb:'LB',rb:'RB',start:'Menu (☰)',select:'View (⧉)',guide:'Xbox / Guide',up:'D-pad up',down:'D-pad down',left:'D-pad left',right:'D-pad right'};
function padPressed(k){
  setInput('pad');
  PAD.last=k;
  const t=$('#padTest'); if(t) t.textContent = PAD_NAMES[k]||k;
  input(k);
}
function hostPad(k){ padPressed(mapPad(k)); }

// Gamepad (standard mapping) with key-repeat on d-pad / stick
const REPEAT = new Set(['up','down','left','right']);
const held={};
let padSeen=false;
function pollPads(t){
  // The host reads Xbox-style controllers itself; don't also read them here (that would double every press).
  const pads = PAD.host ? [] : (navigator.getGamepads ? navigator.getGamepads() : []);
  const st={};
  for(const p of pads){ if(!p) continue;
    const b=i=>!!(p.buttons[i] && p.buttons[i].pressed), ax=i=>p.axes[i]||0;
    st.a=st.a||b(0); st.b=st.b||b(1); st.x=st.x||b(2); st.y=st.y||b(3);
    st.lb=st.lb||b(4); st.rb=st.rb||b(5); st.select=st.select||b(8); st.start=st.start||b(9); st.guide=st.guide||b(16);
    st.up=st.up||b(12)||ax(1)<-.55; st.down=st.down||b(13)||ax(1)>.55;
    st.left=st.left||b(14)||ax(0)<-.55; st.right=st.right||b(15)||ax(0)>.55;
  }
  for(const k of ['a','b','x','y','lb','rb','select','start','guide','up','down','left','right']){
    const on=!!st[k], h=held[k];
    if(on && !h){ held[k]={t0:t,last:t}; padPressed(mapPad(k)); }
    else if(on && h && REPEAT.has(k) && t-h.t0>340 && t-h.last>85){ h.last=t; input(k); }
    else if(!on && h) delete held[k];
  }
  requestAnimationFrame(pollPads);
}
window.addEventListener('gamepadconnected', e=>{ if(!padSeen) toast(`Controller connected: ${e.gamepad.id.split('(')[0].trim()||'Gamepad'}`); padSeen=true; });

const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'a',' ':'a',Escape:'b',Backspace:'b',
  m:'start',M:'start',q:'select',Q:'select','[':'lb',']':'rb','/':'y',f:'x',F:'x',
  w:'up',W:'up',a:'left',A:'left',s:'down',S:'down',d:'right',D:'right'};
// Shortcuts that aren't controller buttons
const KEY_EXTRA = {Home:()=>{ closeAll(); if(S.view!=='home'){ S.history=[]; navigate('home',{},false); } },
  F1:()=>{ S.settingsTab='controller'; S.view==='settings' ? (render('st-controller'), onSettingsTab('controller')) : navigate('settings',{focusKey:'st-controller'}); }};
document.addEventListener('keydown', e=>{
  // Debug: Ctrl+Shift+D writes the focused/open game's art and image load state to bridge.log
  if(e.ctrlKey && e.shiftKey && (e.key==='D'||e.key==='d')){
    const id = S.view==='game' ? S.game : focused?.dataset.id; const g=id&&G(id);
    const imgs=[...document.querySelectorAll('img.img')].filter(i=>!g || (i.closest('[data-id]')?.dataset.id===id) || S.view==='game')
      .slice(0,8).map(i=>`${i.complete?(i.naturalWidth?'ok':'broken'):'loading'} ${i.naturalWidth}x${i.naturalHeight} ${i.currentSrc||i.src}`);
    send({type:'log', text:'debug '+JSON.stringify({id, art:g&&g.art, imgs})});
    toast('Debug info written to bridge.log'); e.preventDefault(); return;
  }
  if(S.layers.at(-1)==='prompt' && prompt){
    if(e.key==='Enter'){ e.preventDefault(); return promptSubmit(); }
    if(e.key==='Escape'){ e.preventDefault(); return back(); }
    if(e.key==='Backspace'){ e.preventDefault(); prompt.text=prompt.text.slice(0,-1); return renderPrompt(focused?.dataset.k); }
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); prompt.text+=e.key; return renderPrompt(focused?.dataset.k); }
  }
  if(S.layers.at(-1)==='search'){
    if(e.key.length===1 && /[\w\- ]/.test(e.key) && !e.ctrlKey && !e.metaKey){ e.preventDefault(); query+=e.key; return renderSearch(focused?.dataset.k); }
    if(e.key==='Backspace'){ e.preventDefault(); if(query){ query=query.slice(0,-1); return renderSearch(focused?.dataset.k);} return back(); }
  }
  if(e.key==='Tab'){ e.preventDefault(); setInput('kbd'); return input(e.shiftKey?'lb':'rb'); }
  if(KEY_EXTRA[e.key] && !e.ctrlKey && !e.altKey){ e.preventDefault(); setInput('kbd'); return KEY_EXTRA[e.key](); }
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const k=KEYMAP[e.key]; if(!k) return;
  e.preventDefault(); setInput('kbd'); input(k);
});
document.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse'||e.pointerType==='pen') setInput('mouse'); else if(e.pointerType==='touch') setInput('mouse'); });
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act],[data-f]'); if(!el) return;
  if(el.dataset.f!==undefined) setFocus(el,true);
  if(el.dataset.slider){ const s=el.querySelector('.slider'), r=s.getBoundingClientRect();
    if(e.clientX>=r.left-8 && e.clientX<=r.right+8){ const min=+el.dataset.min,max=+el.dataset.max,st=+el.dataset.step;
      const v=min+Math.round(((e.clientX-r.left)/r.width)*(max-min)/st)*st; S.set[el.dataset.slider]=Math.max(min,Math.min(max,v)); adjustSlider(el,0);} return; }
  act(el);
});
let lastPtr=null;
document.addEventListener('pointermove', e=>{
  if(e.pointerType!=='mouse') return;
  // Ignore tiny jitters; a real mouse movement switches prompts to mouse buttons.
  if(lastPtr && Math.hypot(e.clientX-lastPtr[0], e.clientY-lastPtr[1])>6) setInput('mouse');
  lastPtr=[e.clientX,e.clientY];
  const el=e.target.closest('[data-f]');
  if(el && el!==focused && root().contains(el)) { if(focused) focused.classList.remove('focus'); focused=el; el.classList.add('focus'); renderFooter(); }
});
document.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- status bar ----------
function tick(){ const d=new Date(); $('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
tick(); setInterval(tick, 10e3);

// ---------- boot ----------
if(host){ NOTIFS=[]; GAMES.length=0; }
updateBadge();
render();
loadHostInfo();
refreshStatus();
if(OVERLAY){ document.body.classList.add('overlay'); NOTIFS=[]; }
applyProfile();
loadProfile();
loadLibrary();
if(!OVERLAY){ loadAccounts(true); loadUpdateStatus(); }
else { S.qtab='quick'; openLayer('qam'); }
requestAnimationFrame(pollPads);
send({type:'ready'});
</script>
