// ---------- Settings › Updates ----------
const UPD = {status:null, notified:null};
function loadUpdateStatus(){ if(host) call('update.status').then(onUpdate).catch(()=>{}); }
function onUpdate(s){
  if(!s || !s.current) return;
  UPD.status=s;
  if(s && s.state==='available' && s.latest && UPD.notified!==s.latest.version){
    UPD.notified=s.latest.version;
    NOTIFS.unshift({i:'dl', t:`${APP} ${s.latest.version} is available`, s:'Select to open Settings › Updates', go:'updates'});
    updateBadge(); toast(`${APP} ${s.latest.version} is available. See Settings › Updates.`);
  }
  if(s && s.state==='error' && s.error) toast(s.error);
  refreshUI();
}
function pageUpdates(){
  if(!host) return note('Updates work in the '+APP+' app, not the browser preview.');
  if(LINUX && HOSTINFO.system) return pageSystemUpdate();
  const s=UPD.status;
  if(!s) return note('Checking…');
  const L=s.latest, mb=b=>b?` (${(b/1e6).toFixed(0)} MB)`:'';
  const line = {idle:'Not checked yet', checking:'Checking for updates…', upToDate:'You have the latest version',
    available:`Version ${L?.version} is available${mb(L?.size)}`, downloading:`Downloading ${L?.version}… ${Math.round((s.progress||0)*100)}%`,
    ready:`Version ${L?.version} is ready to install`, error:s.error||'Something went wrong'}[s.state] || s.state;
  let h = `<div class="row"><span class="ricon">${I.info}</span><div class="rt"><b>${APP} ${esc(s.current)}</b><small>${esc(line)}${s.lastChecked?` · checked ${ago(s.lastChecked).toLowerCase()}`:''}</small></div>
    ${s.state==='checking'||s.state==='downloading'?'<span class="mini-spin"></span>':''}</div>`;
  if(s.state==='downloading') h += `<div class="row"><div class="rt"><div class="bar"><i style="width:${Math.round((s.progress||0)*100)}%"></i></div></div></div>`;
  if(s.state==='available' && s.canInstallHere)
    h += `<button class="row" data-f data-k="up-dl" data-act="updDownload"><span class="ricon">${I.dl}</span><div class="rt"><b>Download update</b><small>${APP} keeps running while it downloads</small></div></button>`;
  if(s.state==='ready')
    h += `<button class="row" data-f data-k="up-install" data-act="updInstall"><span class="ricon">${I.restart}</span><div class="rt"><b>Restart ${APP} to update</b><small>Takes a few seconds. If the new version has problems, ${APP} switches back automatically.</small></div></button>`;
  if(!['checking','downloading'].includes(s.state))
    h += `<button class="row" data-f data-k="up-check" data-act="updCheck"><span class="ricon">${I.refresh}</span><div class="rt"><b>Check for updates</b></div></button>`;
  h += `<button class="row" data-f data-k="up-auto" data-act="updAuto"><div class="rt"><b>Check automatically</b><small>At startup and every 6 hours</small></div><div class="sw ${s.autoCheck?'on':''}"></div></button>`;
  if(!s.canInstallHere) h += note(LINUX && HOSTINFO.system ? 'This is the Hearth OS install, so it updates together with the system: Hearth downloads updates in the background and applies them the next time you restart.'
    : LINUX ? 'This copy of '+APP+' runs from source, so it can only check for updates. The AppImage from GitHub Releases updates itself.'
    : `This is a development copy of ${APP}. Updates install into <code>${esc(s.installFolder)}</code>, the copy that install-shell.cmd set up.`);
  if(L && L.notes && ['available','ready','downloading'].includes(s.state)) h += shead("What's new") + note(esc(L.notes).replace(/\n/g,'<br>'));
  return h;
}

const LOGIN = {s:null};

    h += `<button class="row" data-f data-k="li-host" data-act="loginHost"><span class="ricon">${I.info}</span><div class="rt"><b>Device name</b><small>How this PC shows up on your network and to other devices</small></div><div class="rv">${esc(L.hostname)} ›</div></button>`;
  } else h += note('Signing in automatically, your password and the device name can be changed here on Hearth, the OS. On other Linux systems, use the system\'s own settings.');

async function loginAuto(){
  const on=!(LOGIN.s&&LOGIN.s.autologin);
  try{ LOGIN.s=await call('login.setAutologin',{on},30000); toast(on?'Signs in automatically from the next start':'Shows the login screen from the next start'); }catch(e){ toast(e.message); }

}
function loginStart(){

async function loginPass(){
  const old=await openPrompt({title:'Current password', secret:true}); if(old==null) return;
  const pw=await openPrompt({title:'New password', secret:true, min:4}); if(pw==null) return;
  const again=await openPrompt({title:'New password again', secret:true}); if(again==null) return;
  if(pw!==again) return toast('The new passwords don\'t match');

async function loginHost(){

// ---------- Settings › Updates › System (Hearth, the OS) ----------
const SYSUPD = {s:null};
function loadSystemUpdate(){ if(host && LINUX && HOSTINFO.system) call('system.update.status',{},90000).then(r=>{ SYSUPD.s=r; refreshUI(); }).catch(()=>{}); }
function onSystemUpdate(d){
  const was=SYSUPD.s; SYSUPD.s=d;
  if(was && was.state==='updating' && d.state==='idle') toast(d.error ? d.error : (d.status&&d.status.staged ? 'Update downloaded. Restart to finish.' : 'Everything is up to date'));
  if(was && was.state==='checking' && d.state==='idle' && d.error) toast(d.error);
  if(S.view==='settings' && S.settingsTab==='updates') render(null,true);
}
const gbx = b => (b/1e9).toFixed(b>=1e10?1:2)+' GB';
function timeLeft(s){ if(!(s>0) || !isFinite(s)) return ''; if(s<60) return 'less than a minute left'; const m=Math.round(s/60); return m<60?`${m} min left`:`${Math.floor(m/60)} h ${m%60} min left`; }
// The three parts of a system update, each with its own bar: downloading the new system (size, speed, time
// left, a live speed graph), installing it (bootc's steps), then updating apps (Flatpak, one by one).
function sysUpdCard(u, o={}){
  const ph=u.phases||{}, d=ph.download||{}, ins=ph.install||{}, ap=ph.apps||{}, cur=(u.stage||{}).phase||'download';
  const ORD=['download','install','apps','done'], stateOf=k=>{ const c=ORD.indexOf(cur), i=ORD.indexOf(k); return i<c?'ok':i===c?'on':''; };
  const pct=x=>x&&x.pct!=null?Math.round(x.pct):null;
  const row=(k,n,title,sub)=>{ const st=stateOf(k), p=st==='ok'?100:pct(ph[k]);
    return `<div class="su-ph ${st}"><div class="n">${st==='ok'?'✓':n}</div><div class="t">${title}</div><div class="p">${p!=null&&st?p+'%':''}</div>
      <div class="bar"><i style="width:${st==='ok'?100:(p||0)}%"></i></div><div class="s">${sub}</div></div>`; };
  const dSub = stateOf('download')==='ok' ? (d.total?`${gbx(d.total)} downloaded`:'Downloaded')
    : d.total ? [`${gbx(d.done||0)} of ${gbx(d.total)}`, d.bps?fmtSpeed(d.bps):'', timeLeft(d.eta), d.layers?`part ${d.layer} of ${d.layers}`:''].filter(Boolean).join(' · ')
    : 'Connecting…';
  const iSub = stateOf('install')==='ok' ? 'Installed, ready for the next restart'
    : cur==='install' ? esc(ins.desc||'Installing')+(ins.steps?` · step ${Math.min(ins.step+1,ins.steps)} of ${ins.steps}`:'') : 'Waiting for the download';
  const aSub = stateOf('apps')==='ok' ? (ap.total?`${ap.total} app${ap.total===1?'':'s'} updated`:'Your apps are up to date')
    : cur==='apps' ? (ap.total?`${esc(ap.desc||'Updating')} · ${Math.max(1,ap.n||0)} of ${ap.total}`:esc(ap.desc||'Checking your apps…')) : 'After the system update';
  const overall=u.progress!=null?Math.round(u.progress*100):0;
  const pts=u.speeds||[], peak=pts.length?Math.max(...pts.map(p=>p[1])):0, now=pts.length?pts.at(-1)[1]:0;
  const elapsed=u.started?Math.round((Date.now()-u.started)/1000):0;
  let h=`<div class="su-card"><div class="su-head"><div><b>${esc(o.title||'Updating Hearth OS')}</b><div class="muted" style="font-size:13px;margin-top:4px">${esc(o.sub||'Keep playing; it finishes when you restart')}${elapsed>5?` · ${elapsed<60?elapsed+' s':Math.floor(elapsed/60)+' min '+(elapsed%60)+' s'} so far`:''}</div></div><div class="pc">${overall}%</div></div>`
    + row('download',1,o.noApps?'Downloading the new system':'Downloading the update',dSub) + row('install',2,'Installing it',iSub) + (o.noApps?'':row('apps',3,'Updating apps',aSub));
  if(cur==='download' && pts.length) h+=`<div class="su-speed"><div><div class="big">${fmtSpeed(now).replace(/ (\S+)$/,'<small>$1</small>')}</div><div class="sub">Peak ${fmtSpeed(peak)}</div></div>${speedGraph(pts,'sug')}</div>`;
  return h+'</div>';
}
function pageSystemUpdate(){
  const u=SYSUPD.s;
  let h=shead('System', u&&u.state!=='idle');
  if(!u) return h+note('Checking…');
  const st=u.status||{}, v=x=>x&&x.version?x.version:'';
  if(u.state==='updating'){
    h += `<div class="row"><span class="ricon">${I.info}</span><div class="rt"><b>Hearth OS ${esc(v(st.booted))}</b><small>${st.available?`Getting version ${esc(v(st.available))}`:'Getting the newest version'}</small></div></div>`;
    return h + sysUpdCard(u) + note('Hearth also updates by itself in the background and finishes the next time you restart.') + newOsRows();
  }
  const line = u.state==='checking' ? 'Checking for updates…'
    : st.staged ? `Version ${v(st.staged)} is downloaded. Restart to finish.`
    : st.available ? `Version ${v(st.available)} is available`
    : u.error ? u.error
    : 'Up to date';
  h += `<div class="row"><span class="ricon">${I.info}</span><div class="rt"><b>Hearth OS ${esc(v(st.booted))}</b><small>${esc(line)}</small></div>
      ${u.state!=='idle'?'<span class="mini-spin"></span>':''}</div>`;
  if(u.state==='idle'){
    if(st.staged) h += `<button class="row" data-f data-k="su-restart" data-act="pwr" data-p="restart"><span class="ricon">${I.restart}</span><div class="rt"><b>Restart to finish updating</b><small>Takes a minute. If something's wrong, the previous version is still in the boot menu.</small></div></button>`;
    h += `<button class="row" data-f data-k="su-install" data-act="sysUpdInstall"><span class="ricon">${I.dl}</span><div class="rt"><b>Update now</b><small>Downloads the newest Hearth (system, drivers, ${APP}) and updates your apps. Keep playing while it downloads.</small></div></button>`;
    h += `<button class="row" data-f data-k="su-check" data-act="sysUpdCheck"><span class="ricon">${I.refresh}</span><div class="rt"><b>Check for updates</b></div></button>`;
  }
  h += note('Hearth also updates by itself in the background and finishes the next time you restart.');
  return h + newOsRows();
}

// ---------- Settings › Updates › Move to a new Hearth OS (only on the Bazzite-based Hearth OS) ----------
// Hearth OS moves away from Bazzite as a clean install that keeps your games. You pick which one: Hearth OS on
// Anatase (recommended) or a Beta Experimental edition (Ubuntu, CachyOS, Peppermint). A choice lights up once its
// image is published ("Not ready yet" until then). Picking one shows what's kept and what's put aside, then asks
// once more; hearth-admin move-to-new-os --edition downloads it, and its first start keeps the games and puts
// everything else aside for 30 days.
const NEWOS = {s:null, pick:''};
const NEWOS_KEEPS = [
  ['Your Steam games and saves','Installed games, their Proton prefixes and shader caches, and your Steam saves and settings. Steam libraries on other drives aren\'t touched.'],
  ['Games '+APP+' installed','Epic and GOG games, with their Windows (Wine) settings and saves'],
  ['Heroic and Lutris games','The game folders they installed'],
  ['Games you added yourself','Their folder in your games folder (or just the game\'s file)'],
  ['You','Your account and password, device name, Wi-Fi networks, language and time zone']];
const NEWOS_MOVES = [
  ['Everything else in your home folder','Documents, downloads, pictures, other apps and their settings, sign-ins (Steam and the stores ask you to sign in again). Moved to a folder named .old-hearth- and the date, not deleted: for 30 days you can restore any of it from Settings › System, then it\'s deleted.'],
  ['The old system\'s apps and changes','Bazzite\'s preinstalled apps, packages added on top, and changed system settings: back to the new system\'s defaults']];
function loadNewOs(){ if(LINUX && (!host || (HOSTINFO.system && /^(amd|nvidia|anatase|ubuntu|cachyos|peppermint)$/.test(HOSTINFO.edition||'')))) call('newos.status',{},90000).then(r=>{ NEWOS.s=r; if(S.view==='settings'&&S.settingsTab==='updates') render(null,true); }).catch(()=>{}); }
function newOsChoice(id){ return ((NEWOS.s&&NEWOS.s.editions)||[]).find(e=>e.id===id); }
function newOsRows(){
  const n=NEWOS.s; if(!n || !n.eligible) return '';
  const sw=!!n.switch, curLabel={anatase:'Hearth OS on Anatase',ubuntu:'Ubuntu',cachyos:'CachyOS',peppermint:'Peppermint'}[n.current]||'this edition';
  let h=shead(sw?'Switch edition':'Move to a new Hearth OS', n.state==='moving');
  if(n.state==='moving') return h + sysUpdCard(n,{title:'Getting '+(n.label||'the new Hearth OS'), sub:'Keep playing: nothing changes until you restart', noApps:true});
  if(n.state==='done') return h + `<div class="row"><span class="ricon">${I.check}</span><div class="rt"><b>${esc(n.label||'The new Hearth OS')} is ready</b><small>Restart to start it. The first start takes a little longer: it keeps your games and puts everything else aside.</small></div></div>`
    + `<button class="row" data-f data-k="no-restart" data-act="pwr" data-p="restart"><span class="ricon">${I.restart}</span><div class="rt"><b>Restart now</b><small>If something's wrong, the old Hearth OS is still in the boot menu.</small></div></button>`;
  const pick=NEWOS.pick && newOsChoice(NEWOS.pick);
  if(pick && pick.allowed) return h + newOsConfirmRows(n, pick);
  h += sw ? `<div class="row" data-f data-k="no-intro"><span class="ricon">${I.dl}</span><div class="rt"><b>You're on ${esc(curLabel)}</b><small>Switch to another edition of Hearth OS. Switching starts you fresh and keeps your games. You'll see exactly what's kept before anything starts, and ${esc(curLabel)} stays in the boot menu.</small></div></div>`
    : `<div class="row" data-f data-k="no-intro"><span class="ricon">${I.dl}</span><div class="rt"><b>Hearth OS is moving away from Bazzite</b><small>Choose the Hearth OS you want next. Moving starts you fresh and keeps your games. You'll see exactly what's kept before anything starts.</small></div></div>`;
  if(n.archived) h += note(esc(curLabel)+' is archived for now: it gets no more updates. Switch to Anatase or Peppermint to keep getting them; your games come with you.');
  if(n.error) h += note(esc(n.error));
  if(!n.editions) return h + note('Checking which ones are ready…');

    const items=[...d.steam,...d.epic,...d.gog,...(d.lutris||[]),...d.files], all=items.length&&items.every(x=>IMP.sel.has(x.key));
    h+=shead(`${esc(d.name)}${d.os&&d.os!==d.name?' · '+esc(d.os):''} · ${gb(d.size)}`);
    if(d.problem){ h+=note('This drive can\'t be read: '+esc(d.problem)+'.'); continue; }
    h+=`<button class="row" data-f data-k="imp-all-${esc(d.id)}" data-act="impAll" data-drive="${esc(d.id)}"><div class="rt"><b>${all?'Unselect everything':'Select everything'} on this drive</b><small>${items.length} item${items.length===1?'':'s'} · ${gbs(items.reduce((a,x)=>a+(x.size||0),0))}</small></div></button>`;
    if(d.steam.length) h+=`<div class="muted" style="margin:10px 4px 4px;font-size:13px;font-weight:700">STEAM</div>`+d.steam.map(x=>grow(x)).join('');
    if(d.epic.length) h+=`<div class="muted" style="margin:10px 4px 4px;font-size:13px;font-weight:700">EPIC GAMES</div>`+d.epic.map(x=>grow(x)).join('');
    if(d.gog.length) h+=`<div class="muted" style="margin:10px 4px 4px;font-size:13px;font-weight:700">GOG</div>`+d.gog.map(x=>grow(x)).join('');
    if((d.lutris||[]).length) h+=`<div class="muted" style="margin:10px 4px 4px;font-size:13px;font-weight:700">LUTRIS</div>`+d.lutris.map(x=>grow(x)).join('');
    if(d.files.length) h+=`<div class="muted" style="margin:10px 4px 4px;font-size:13px;font-weight:700">YOUR FILES</div>`+d.files.map(x=>row(x, x.name+(x.user?` (${x.user})`:''))).join('');
  }
  const sel=impItems().filter(x=>IMP.sel.has(x.key)), need=sel.reduce((a,x)=>a+(x.size||0),0), free=st.scan.free||0, tooBig=need>free;
  h+=shead('Import')
    + `<button class="row" data-f data-k="imp-start" data-act="impStart"><span class="ricon">${I.dl}</span><div class="rt"><b>${sel.length?`Copy ${sel.length} item${sel.length===1?'':'s'}`:'Pick what to bring'}</b><small>${sel.length?`${gbs(need)||'0 GB'} · ${gb(free)} free on Hearth · the other drive keeps everything`:'Turn on the games and folders you want'}${tooBig?' · not enough space':''}</small></div></button>`
    + `<button class="row" data-f data-k="imp-move" data-act="impMove"><span class="ricon">${I.dl}</span><div class="rt"><b>${sel.length?`Move ${sel.length} item${sel.length===1?'':'s'}`:'Move'} (Beta Experimental)</b><small>Copy, check every file, then delete the original from the other drive. Frees space there that you can give to Hearth${tooBig?' · not enough space':''}</small></div></button>`
    + `<button class="row" data-f data-k="imp-scan" data-act="impScan"><span class="ricon">${I.refresh}</span><div class="rt"><b>Look again</b></div></button>`
    + note('Steam checks each imported game the first time you start it (a minute, not a download). Epic games need you signed in to Epic. Games that only run on Windows play through Proton, like other Windows games on Hearth.');
  return h + pageSpace() + pageTakeover(st);
}

// ---------- Make Hearth bigger (Beta Experimental) ----------
// After games were moved off Windows, SteamOS or another Linux on this PC: that system gets smaller and Hearth
// gets the space (hearth-space: shrink its file system and partition, add the space to Hearth's file system).
const SPC = {s:null, loading:false, err:null, sel:null, gb:0, job:null, result:null, error:null, open:false};
const GIB = 1024**3;
const gib = b => Math.floor((b||0)/GIB);
const gbi = b => b>=1024*GIB ? (b/1024/GIB).toFixed(1)+' TB' : Math.round((b||0)/GIB)+' GB';   // the same GB as the amount chosen
if(!host) SPC.mock = {beta:true, hearth:{size:213e9, used:160e9, free:53e9, devices:['/dev/nvme0n1p6'], disks:['/dev/nvme0n1']},
  systems:[{id:'nvme0n1p3', dev:'/dev/nvme0n1p3', name:'Windows', kind:'windows', fs:'ntfs', size:200*GIB, used:86*GIB, min:80*GIB, keep:106*GIB, canGive:94*GIB, blockers:[], warnings:[]}],
  free:[], problems:[], journal:null, power:{plugged:true, battery:null}};
function spcLoad(sel){
  SPC.open=true; SPC.loading=true; SPC.err=null; if(sel) SPC.sel=sel; render(null,true);
  const p = host ? call('space.status',{},180000) : new Promise(r=>setTimeout(()=>r(JSON.parse(JSON.stringify(SPC.mock))),400));
  p.then(r=>{ SPC.s=r; SPC.loading=false; spcPick(SPC.sel, true); }).catch(e=>{ SPC.loading=false; SPC.err=e.message; render(null,true); });
}
// The sources that can give space: other systems, and free (unpartitioned) space on Hearth's drive.
function spcSources(){
  const s=SPC.s; if(!s) return [];
  return [...(s.systems||[]).map(x=>({...x, key:x.dev})), ...(s.free||[]).map((f,i)=>({key:'free', dev:'free', name:'Free space on the drive', fs:'', size:f.bytes, canGive:f.canGive, blockers:f.blockers||[], warnings:[], free:true, afterHearth:f.afterHearth, idx:i}))]
    .filter((x,i,a)=>x.key!=='free' || a.findIndex(y=>y.key==='free')===i);
}
function spcPick(dev, quiet){
  const src=spcSources().find(x=>x.key===dev) || spcSources().find(x=>!x.blockers.length && x.canGive>=GIB);
  SPC.sel=src?src.key:null;
  if(src){ const max=gib(src.canGive); SPC.gb=Math.max(1, Math.min(max, SPC.gb||Math.min(max, Math.max(1, Math.round(max/2/8)*8)))); }
  render(null,true);
}
function spcStep(d){
  const src=spcSources().find(x=>x.key===SPC.sel); if(!src) return;
  const max=gib(src.canGive), step=max>=32?8:1;
  SPC.gb = d==='max' ? max : Math.max(1, Math.min(max, (d>0 ? Math.floor(SPC.gb/step)*step+step : Math.ceil(SPC.gb/step)*step-step)));
  render(null,true);
}
function spcGo(){
  const src=spcSources().find(x=>x.key===SPC.sel); if(!src) return toast('Choose where the space comes from');
  if(src.blockers.length) return toast(src.blockers[0].text);
  const g=SPC.gb, from=src.free?'the free space on the drive':src.name;
  const start=()=>{
    SPC.job={pct:0, text:'Starting', from:src.name, gb:g}; SPC.error=null; SPC.result=null; render(null,true);
    if(!host){ let p=0; const t=setInterval(()=>{ p+=20; spaceEvent(p<100?'space.grow.progress':'space.grow.done', p<100?{pct:p,text:'Making room'}:{ok:true, gave:g*GIB, hearth:{size:213e9+g*GIB, free:53e9+g*GIB}}); if(p>=100) clearInterval(t); },500); return; }
    call('space.grow',{from:src.dev, gb:g},30000).catch(e=>{ SPC.job=null; SPC.error=e.message; render(null,true); });
  };
  openSheet({title:`Give ${g} GB from ${from} to ${APP}?`, sub:(src.free?`${APP} gets ${g} GB of space nobody uses yet.`:`Back up anything important first. ${src.name} keeps working but gets smaller: ${gbi(src.size)} becomes ${gbi(src.size-g*GIB)}.`)+' Keep the device plugged in and on until it\'s done; on a full drive this can take an hour.'+(src.free?'':` The space becomes a new partition named hearth-more, part of ${APP}: never delete it (in Windows\' Disk Management or anywhere else), or ${APP} won\'t start.`)+' Beta Experimental: new and not tested on real devices yet. Back up first.',
    items:[{label:'I\'ve backed up what matters', icon:'check', run:()=>setTimeout(()=>openSheet({title:'Last check: start now?', sub:`${from} → ${APP}: ${g} GB. If anything goes wrong, ${APP} puts back what it changed. Don't turn the device off.`, items:[
      {label:`Make ${APP} bigger`, icon:'dl', run:start}]}),250)}]});
}
function spaceEvent(name, d){
  if(name==='space.grow.progress'){ SPC.job={...(SPC.job||{}), pct:d.pct||0, text:d.text||''}; }
  else if(name==='space.grow.done'){ SPC.job=null; SPC.result=d||{ok:true}; SPC.s=null; toast(`${APP} is bigger now`); }
  else if(name==='space.grow.error'){ SPC.job=null; SPC.error=d.text||'It didn\'t work'; SPC.s=null; toast(SPC.error); }
  if(S.view==='settings' && S.settingsTab==='import') render(null,true);
}
function pageSpace(){
  if(SPC.job){ const j=SPC.job, pct=Math.max(0,Math.min(100,Math.round(j.pct||0)));
    return note(BETA_X)+`<div class="su-card"><div class="su-head"><div><b>Making ${APP} bigger</b><div class="muted" style="font-size:13px;margin-top:4px">${esc(j.text||'Working')} · ${j.gb} GB from ${esc(j.from||'')}</div></div><div class="pc">${pct}%</div></div>
      <div class="bar" style="height:8px"><i style="width:${pct}%"></i></div></div>` + note('Keep the device on and plugged in. This can\'t be stopped half-way: if something goes wrong, '+APP+' puts back what it changed.'); }
  if(SPC.result){ const r=SPC.result;
    return `<div class="row"><span class="ricon">${I.check}</span><div class="rt"><b>${APP} is ${gbi(r.gave||0)} bigger</b><small>${r.hearth?`${gbi(r.hearth.size)} in all · ${gbi(r.hearth.free)} free now`:''}</small></div></div>`
      + ((r.warnings||[]).map(w=>note(esc(w))).join(''))
      + `<button class="row" data-f data-k="spc-done" data-act="spcDone"><span class="ricon">${I.check}</span><div class="rt"><b>Done</b></div></button>`; }
  let h=shead(`Make ${APP} bigger (Beta Experimental)`, SPC.loading);
  if(SPC.error) h+=note(esc(SPC.error));
  if(!SPC.open || (!SPC.s && !SPC.loading)) return h+(SPC.err?note(esc(SPC.err)):'')+`<button class="row" data-f data-k="spc-load" data-act="spcLoad"><span class="ricon">${I.dl}</span><div class="rt"><b>See how much space ${APP} could get</b><small>After moving games: Windows, SteamOS or another Linux on this PC gets smaller and ${APP} gets the space. Nothing changes until you confirm twice.</small></div><div class="rv">›</div></button>`;
  if(SPC.loading && !SPC.s) return h+`<div class="row"><span class="mini-spin"></span><div class="rt"><b>Looking at the drive…</b><small>Checking how full each system is. This can take half a minute.</small></div></div>`;
  const s=SPC.s, hs=s.hearth||{};
  h+=note(BETA_X+' The other system keeps working but gets smaller.');
  h+=`<div class="row"><span class="ricon">${HEARTH_MARK}</span><div class="rt"><b>${APP}: ${gbi(hs.free||0)} free of ${gbi(hs.size||0)}</b><small>${(hs.devices||[]).length>1?`On ${hs.devices.length} partitions`:'Its own partition'}${s.limited?' · exact numbers need the system\'s OK':''}</small></div></div>`;
  if(s.journal) h+=note(esc((s.problems||[]).find(p=>p.id==='unfinished')?.text||'An earlier resize didn\'t finish.'))
    + `<button class="row" data-f data-k="spc-clear" data-act="spcClear"><span class="ricon">${I.check}</span><div class="rt"><b>I've checked it</b><small>After starting the other system once and letting it check its drive</small></div></button>`;
  const srcs=spcSources();
  if(!srcs.length) h+=note(`Nothing else on ${APP}'s drive can give space. Other drives (a second SSD, an SD card) stay separate.`);
  for(const x of srcs){
    const max=gib(x.canGive), blocked=x.blockers.length>0, on=SPC.sel===x.key;
    const info = x.free ? `${gbi(x.size)} not used by any system${x.afterHearth?' · right after '+APP:''}`
      : `${gbi(x.size)} · ${x.used!=null?gbi(x.used)+' used':'used: unknown'} · ${esc((x.fs||'').toUpperCase())}${x.estimate?' · estimate':''}`;
    h+=`<button class="row" data-f data-k="spc-${esc(x.key)}" data-act="spcPick" data-dev="${esc(x.key)}"><div class="rt"><b>${esc(x.name)}${blocked?'':` · can give ${max} GB`}</b><small>${info}${blocked?' · '+esc(x.blockers[0].text):''}</small></div><div class="sw ${on&&!blocked?'on':''}"></div></button>`;
    if(on) (x.warnings||[]).forEach(w=>h+=note(esc(w.text)));
  }
  const src=srcs.find(x=>x.key===SPC.sel && !x.blockers.length && x.canGive>=GIB);
  if(src){
    const g=SPC.gb;
    h+=`<div class="row"><div class="rt"><b>Give ${g} GB to ${APP}</b><small>${src.free?'':`${esc(src.name)}: ${gbi(src.size)} → ${gbi(src.size-g*GIB)} · `}${APP}: ${gbi(hs.size||0)} → ${gbi((hs.size||0)+g*GIB)}</small></div>
      <div class="seg" style="max-width:300px"><button data-f data-k="spc-less" data-act="spcStep" data-d="-1">−</button><button data-f data-k="spc-more" data-act="spcStep" data-d="1">+</button><button data-f data-k="spc-max" data-act="spcStep" data-d="max">Max</button></div></div>`;
    h+=`<button class="row" data-f data-k="spc-go" data-act="spcGo"><span class="ricon">${I.dl}</span><div class="rt"><b>Make ${APP} bigger</b><small>${src.free?'Uses free space on the drive':`${esc(src.name)} gets ${g} GB smaller`}. Asks twice before anything changes.</small></div></button>`;
  }
  h+=`<button class="row" data-f data-k="spc-refresh" data-act="spcLoad"><span class="ricon">${I.refresh}</span><div class="rt"><b>Look again</b></div></button>`;
  return h;
}

  let h = `<div class="row"><span class="ricon">${I.shell}</span><div class="rt"><b>${state}</b><small>Only affects your Windows account. Other accounts and Safe Mode keep Explorer.</small></div></div>`;

      + `<button class="row" data-f data-k="sh-dm" data-act="pwr" data-p="desktop"><span class="ricon">${I.desk}</span><div class="rt"><b>Switch to the desktop</b><small>${s.desktopStyle==='windows'?'The normal Windows desktop with the taskbar and Start menu.':s.desktopStyle==='mantel-full'?'Full Mantel: Hearth\'s own desktop, with no Explorer.':'Mantel: Hearth\'s taskbar and launcher on top of Windows.'} The controller works as a mouse. Come back with the Game Mode shortcut on the desktop, the ${APP} tray icon, Ctrl+Alt+G, or the Xbox button</small></div></button>`
      + `<button class="row" data-f data-k="sh-style" data-act="emberStyle"><span class="ricon">${I.layout}</span><div class="rt"><b>Desktop style</b><small>${s.desktopStyle==='windows'?'The normal Windows desktop':s.desktopStyle==='mantel-full'?'Full Mantel: Hearth\'s own desktop with no Explorer at all. Ember shows the tray icons itself; other apps\' pop-up notifications may not appear':'Mantel: Hearth\'s taskbar, app launcher and wallpapers on top of Windows. Windows\' tray icons and notifications still work'}</small></div><div class="rv">${{windows:'Windows','mantel-full':'Full Mantel'}[s.desktopStyle]||'Mantel'} ›</div></button>`
      + (s.desktopStyle!=='windows' ? `<button class="row" data-f data-k="sh-wall" data-act="emberWall"><span class="ricon">${I.display}</span><div class="rt"><b>Wallpaper</b><small>Used while you're in Mantel</small></div><div class="rv">${s.wallpaper?esc(s.wallpaper.replace('hearth-','').replace('anim:','').replace(/^./,c=>c.toUpperCase())+(s.wallpaper.startsWith('anim:')?' (moving)':'')):'Your Windows wallpaper'} ›</div></button>` : '')
      + (s.running ? `<button class="row" data-f data-k="sh-start" data-act="emberStart"><span class="ricon">${I.desk}</span><div class="rt"><b>Start in</b><small>What you see after signing in</small></div><div class="rv">${dm} ›</div></button>` : '');
  }
  h += shead('If something goes wrong')
    + `<button class="row" data-f data-k="sh-fe" data-act="pwr" data-p="explorer"><span class="ricon">${I.desk}</span><div class="rt"><b>Open File Explorer</b><small>Also works any time with Ctrl+Alt+Shift+E</small></div></button>`
    + note(`Black screen? Press <b>Ctrl+Shift+Esc</b> for Task Manager, choose <b>Run new task</b>, and run <code>%USERPROFILE%\\nimbus-restore.cmd</code>. That brings back the normal Windows desktop.`)
    + (s&&s.exe ? note(`Running from <code>${esc(s.exe)}</code>`) : '');
  return h;
}

// ---------- Hearth Linux on Android (Beta Experimental; hosts/android LinuxEnv.kt, docs/ANDROID-LINUX.md) ----------
// A Debian Linux inside Hearth, run by PRoot (no root needed). linux.status: {installed, sizeBytes, distro, version,
// running, jobs, busy:{kind,pct,text}|null, x11App, supported, unsupported, freeBytes, error}. Long jobs report with
// events: linux.progress {kind,pct,text}, linux.output {job,lines}, linux.exit {job,kind,code}, linux.done {kind,ok,error,status}.
const LX = {s:null, out:[], job:null, cmd:'', x11:'xterm'};
const LX_MAX = 200;                       // output lines kept
const LX_PKG = /^[a-z0-9][a-z0-9+.-]*$/;
const lxOn = () => ANDROID && (!host || hasFeat('linux'));
function lxCall(m, a={}, ms=30000){ return host ? call(m, a, ms) : LX_MOCK(m, a); }
function loadLinux(){ lxCall('linux.status').then(r=>{ LX.s=r; if(S.view==='settings'&&S.settingsTab==='linux') render(null,true); }).catch(()=>{}); }
function lxOut(lines){
  LX.out.push(...lines.map(l=>String(l))); if(LX.out.length>LX_MAX) LX.out.splice(0, LX.out.length-LX_MAX);
  const el=$('#lxout'); if(el){ el.textContent=LX.out.join('\n'); el.scrollTop=el.scrollHeight; }
}
function onLinuxEvent(name, d){
  const here = S.view==='settings' && S.settingsTab==='linux';
  if(name==='linux.progress'){
    if(LX.s) LX.s.busy={kind:d.kind, pct:d.pct, text:d.text||''};
    const bar=$('#lxbar'), txt=$('#lxbusy');
    if(bar && txt){ bar.style.width=(d.pct||0)+'%'; txt.textContent=`${d.pct||0}% · ${d.text||''}`; } else if(here) render(null,true);
    return;
  }
  if(name==='linux.desktop'){
    if(DESK.s){ DESK.s.running = d.state==='ready'; DESK.s.ready = d.state==='ready'; if(d.state==='ready') DESK.s.method=d.mode; }
    if(d.state==='ready' && d.mode==='hearth' && DESK.open){ deskSetConn(d); if(!DESK.rfb) deskConnect(); }
    else if(d.state==='stopped' && DESK.open && !DESK.closing && d.mode==='hearth'){ deskDropRfb(); deskProblem('The Linux desktop stopped.', true); }
    else if(d.state==='failed'){ if(DESK.open) deskProblem(d.error||'The desktop didn\'t start.', true); else toast(d.error||'The desktop didn\'t start'); }
    if(d.state!=='ready') loadDesktop(); else if(here) render(null,true);
    return;
  }
  if(name==='linux.x11'){
    if(d.kind==='desktop'){ toast(d.ok ? 'The desktop is in Termux:X11' : (d.error||'Termux:X11 didn\'t start')); loadDesktop(); return; }
    if(d.ok && d.job){ LX.job=d.job; LX.out=[]; lxOut(['[Termux:X11] $ '+LX.x11]); if(here) render('lx-stop',true); }
    else if(!d.ok) toast(d.error||'Termux:X11 didn\'t start');
    return;
  }
  if(name==='linux.output'){ if(d.job===LX.job || (LX.s&&LX.s.busy&&d.job===LX.s.busy.kind)) lxOut(d.lines||[]); return; }
  if(name==='linux.exit'){ if(d.job===LX.job){ lxOut([`[done, exit code ${d.code}]`]); LX.job=null; } loadLinux(); return; }
  if(name==='linux.done'){
    if(d.status) LX.s=d.status; else if(LX.s) LX.s.busy=null;
    toast(d.ok ? (d.text||'Done') : (d.error||'That didn\'t work'));
    if(d.kind==='desktop'){ if(DESK.s) DESK.s.installing=false; loadDesktop(); }
    if(here) render(null,true);
  }
}
async function lxAct(v){
  const s=LX.s||{};
  const fail = e => toast(e.message);
  if(v==='install') return lxCall('linux.install').then(()=>{ LX.out=[]; s.busy={kind:'install',pct:0,text:'Starting…'}; render('lx-cancel',true); }).catch(fail);
  if(v==='cancel') return lxCall('linux.stop',{job:(s.busy&&s.busy.kind)||''}).then(()=>toast('Stopping…')).catch(fail);
  if(v==='stop') return LX.job ? lxCall('linux.stop',{job:LX.job}).catch(fail) : null;
  if(v==='run' || v==='root'){
    const cmd=await openPrompt({title:v==='root'?'Run a command as root':'Run a command in Linux', value:LX.cmd}); if(cmd==null||!cmd.trim()) return;
    LX.cmd=cmd;
    return lxCall('linux.run',{cmd, root:v==='root'}).then(r=>{ LX.job=r.job; LX.out=[]; lxOut([(v==='root'?'# ':'$ ')+cmd]); render('lx-stop',true); }).catch(fail);
  }
  if(v==='pkg' || v==='upg'){
    let packages=[];
    if(v==='pkg'){
      const t=await openPrompt({title:'Packages to install (names, with spaces between)', value:''}); if(t==null||!t.trim()) return;
      packages=t.split(/[\s,]+/).filter(Boolean);
      const bad=packages.find(p=>!LX_PKG.test(p)); if(bad) return toast(`"${bad}" isn't a package name (lower case letters, digits, + . -)`);
    }
    return lxApt(v==='pkg'?'install':'upgrade', packages);
  }
  if(v==='x11'){
    const cmd=await openPrompt({title:'Linux app to show in Termux:X11', value:LX.x11}); if(cmd==null||!cmd.trim()) return;
    LX.x11=cmd;
    try{
      const r=await lxCall('linux.openX11',{cmd}, 60000);
      if(r && r.needApp) return openSheet({title:'Termux:X11 is needed', sub:r.text||'', items:[{label:'Get Termux:X11', icon:'dl', run:()=>lxLink(r.url)}]});
      if(r && r.needTrust) return openSheet({title:r.changed?'Termux:X11 was replaced':'Allow Termux:X11?', sub:r.text||'', items:[
        {label:'Allow Termux:X11', icon:'check', run:()=>lxCall('linux.trustX11',{signer:r.signer, confirm:true}).then(()=>{ toast('Termux:X11 allowed. Open it again.'); }).catch(fail)}]});
      if(r && r.needPackages) return openSheet({title:'One more package', sub:r.text||'', items:[{label:'Install '+r.needPackages.join(' '), icon:'dl', run:()=>lxApt('install', r.needPackages)}]});
      if(r && r.job){ LX.job=r.job; LX.out=[]; lxOut(['[Termux:X11] $ '+cmd]); render('lx-stop',true); }
      else if(r && r.starting) toast('Starting Termux:X11…');
    }catch(e){ fail(e); }
    return;
  }
  if(v==='desk') return deskOpen();
  if(v==='dmode') return openSheet({title:'Show the Linux desktop', sub:'In Hearth: right here, with the controller as mouse and keyboard. In Termux:X11: in the Termux:X11 app (installed on its own).', items:[
    {label:'In Hearth (recommended)', icon:'display', run:()=>deskSetMode('hearth')},
    {label:'In Termux:X11', icon:'desk', run:()=>deskSetMode('x11')}]});
  if(v==='dstop') return lxCall('linux.desktop.stop').then(()=>{ toast('Linux desktop stopped'); if(DESK.s) DESK.s.running=false; loadDesktop(); render(null,true); }).catch(fail);
  if(v==='reset') return openSheet({title:'Reset Linux?', sub:'Linux starts over as it was installed: the programs you installed and every file in it are deleted.', items:[
    {label:'Yes, reset Linux', icon:'refresh', run:()=>lxCall('linux.reset',{confirm:true}).then(()=>{ LX.out=[]; if(LX.s) LX.s.busy={kind:'reset',pct:0,text:'Starting…'}; render(null,true); }).catch(fail)}]});
  if(v==='remove') return openSheet({title:'Remove Linux?', sub:'Deletes the Linux system, everything in it and the saved download. Hearth stays as it is.', items:[
    {label:'Yes, remove Linux', icon:'trash', run:()=>lxCall('linux.remove',{confirm:true},120000).then(r=>{ LX.s=r; LX.out=[]; LX.job=null; toast('Linux removed'); render(null,true); }).catch(fail)}]});
}
function lxApt(action, packages){
  return lxCall('linux.apt',{action, packages}).then(r=>{ LX.job=r.job; LX.out=[]; lxOut(['# apt-get '+action+(packages.length?' '+packages.join(' '):'')]); if(LX.s) LX.s.busy={kind:'apt',pct:0,text:'apt-get '+action}; render('lx-stop',true); }).catch(e=>toast(e.message));
}
function lxLink(url){ if(!host) return toast(url); return call('android.openUrl',{url}).catch(()=>toast(url)); }
// Settings › System › Linux: the Linux desktop's rows (install with progress, open, where it shows, stop).
function deskRows(b){

  let r = lxRow('lx-desk','desk','desk', ds.installed ? (ds.running ? 'Open the Linux desktop' : 'Linux desktop') : 'Install the Linux desktop',
    ds.installed ? (ds.running ? `Running ${ds.method==='x11'?'in Termux:X11':'in Hearth'}` : 'XFCE, with the controller as mouse and keyboard') : 'XFCE and a terminal, in one install', ds.installed ? '›' : '＋');

const lxRow = (k, v, icon, title, sub, right) => `<button class="row" data-f data-k="${k}" data-act="lx" data-v="${v}">${icon?`<span class="ricon">${I[icon]||I.gear}</span>`:''}<div class="rt"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div><div class="rv">${right||'›'}</div></button>`;
function linuxPage(){
  const s=LX.s, beta=note('<b>Beta Experimental:</b> a real Debian Linux (ARM64) inside Hearth, without root, run by PRoot. It\'s new and hasn\'t been tested on many devices: expect rough edges, and please send logs (Settings › System) when something goes wrong.');
  if(!s) return beta + sgrid(infoRow('lx-st','Linux','Checking…'));

function deskTick(t){

  DESK.raf=requestAnimationFrame(deskTick);
  const dt=Math.min(.05, Math.max(0, (t-(DESK.last||t))/1000)); DESK.last=t;
  if(DESK.bar || S.layers.length || (DESK.msg && DESK.msgBtns)) return;
  const a=DESK.ax;
  let vx=a.rx||0, vy=a.ry||0;
  if(Math.hypot(a.lx||0, a.ly||0) > Math.hypot(vx, vy)){ vx=a.lx||0; vy=a.ly||0; }
  const m=Math.min(1, Math.hypot(vx, vy));
  if(m>DESK_DEAD){
    DESK.moveT+=dt;
    const speed = Math.max(DESK.w, DESK.h)*.6 * Math.pow((m-DESK_DEAD)/(1-DESK_DEAD), 1.7) * Math.min(2.4, 1+DESK.moveT*1.4);

    deskPointer();
  } else DESK.moveT=0;
  for(const k of ['lb','rb']) if(DESK.held[k] && t>DESK.scrollAt){ deskWheel(k==='lb'?-1:1); DESK.scrollAt=t+90; }
  for(const k of ['up','down','left','right']) if(DESK.held[k] && t-DESK.heldAt[k]>400 && t-(DESK.rep[k]||0)>45){ DESK.rep[k]=t; deskSendKey(XK[k], true); }

}

// tap is a right click) and a real mouse (where it points) ----
const DT = {pts:new Map(), start:0, moved:0, two:null, lastTap:0, drag:false, multi:false};
function deskTouchInit(){
  const el=$('#deskTouch'); if(!el || el.__init) return; el.__init=true;
  const bit=b=>b===2?4:b===1?2:1;
  const abs=e=>{ const r=deskRect(); DESK.x=(e.clientX-r.left)/r.scale; DESK.y=(e.clientY-r.top)/r.scale; };
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(_){}
    if(DESK.bar) deskBarToggle(false);
    if(e.pointerType==='mouse'){ abs(e); deskMouse(bit(e.button), true); return; }
    DT.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const now=performance.now();
    if(DT.pts.size===1){ DT.start=now; DT.moved=0; DT.multi=false; DT.drag = now-DT.lastTap<300; if(DT.drag) deskMouse(1, true); }
    else if(DT.pts.size===2){ DT.multi=true; DT.two={start:now, moved:0, acc:0}; if(DT.drag){ deskMouse(1, false); DT.drag=false; } }
  });
  el.addEventListener('pointermove', e=>{
    if(e.pointerType==='mouse'){ abs(e); deskPointer(); return; }
    const p=DT.pts.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(DT.two){ DT.two.moved+=Math.abs(dy)+Math.abs(dx); DT.two.acc+=dy/2; while(Math.abs(DT.two.acc)>=22){ const s=Math.sign(DT.two.acc); deskWheel(s>0?-1:1); DT.two.acc-=s*22; } return; }
    if(DT.multi) return;
    DT.moved+=Math.abs(dx)+Math.abs(dy);
    const k=1.25/deskRect().scale;
    DESK.x+=dx*k; DESK.y+=dy*k; deskPointer();
  });
  const up=e=>{
    if(e.pointerType==='mouse'){ deskMouse(bit(e.button), false); return; }
    if(!DT.pts.delete(e.pointerId)) return;
    const now=performance.now();
    if(DT.two){ if(!DT.pts.size){ if(DT.two.moved<14 && now-DT.two.start<400){ deskMouse(4, true); deskMouse(4, false); } DT.two=null; } return; }
    if(DT.pts.size || DT.multi){ if(!DT.pts.size) DT.multi=false; return; }
    if(DT.drag){ deskMouse(1, false); DT.drag=false; DT.lastTap=0; return; }
    if(DT.moved<10 && now-DT.start<280){ deskMouse(1, true); deskMouse(1, false); DT.lastTap=now; }
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e=>{ e.preventDefault(); if(e.deltaY) deskWheel(e.deltaY<0?-1:1); }, {passive:false});
}

      <div class="chips">${(p.powerModes&&p.powerModes.length?PMODES.filter(([k])=>p.powerModes.includes(k)):PMODES).map(([k,l])=>`<button class="chip ${p.powerMode===k?'on':''}" data-f data-k="pp-${k}" data-act="perfPower" data-v="${k}">${l}</button>`).join('')}</div></div>`;
  }

}
async function perfTick(){
  if(PERF.busy) return; PERF.busy=true;
  try{ await perfTickNow(); } finally { PERF.busy=false; }
}
async function perfTickNow(){
  PERF.timer=null;
  const showing = S.layers.includes('qam') && S.qtab==='perf' && (!OVERLAY || OV.shown);
  if(!showing) return;
  // Is Handheld Daemon here? Found out first, so Hearth's own power controls don't show for a moment before its.
  if(LINUX && HHDP.loading && !HHDP.schema){ PERF.timer=setTimeout(perfTick, 250); return; }
  const hp = hhdPerf();
  try{
    // With Handheld Daemon, its state too, every second: changes from its own buttons and shortcuts (or its page)
    // show while Quick Access is open. Not while a change is on its way (the answer brings the new state).
    const quiet = !HHDP.polling && !Object.keys(HHDP.busy).length && !Object.keys(HHDP.pending).length;
    const [r, hs] = await Promise.all([call('perf.stats', hp?{hhd:true}:{}), hp && quiet ? call('hhd.state',{},8000).catch(()=>null) : null]);
    PERF.s=r; applyRunning(r);
    if(hs && hs.running===false){ HHDP.schema=null; HHDP.err='off'; HHDP.offAt=Date.now(); }   // it stopped: Hearth's own controls
    else if(hs) hhdApply(hs);
  }catch(e){}
  qamPerfRedraw();
  PERF.timer=setTimeout(perfTick, 1000);
}
function startPerf(){
  if(LINUX && !HHDS.s && !OVERLAY) loadHhd();
  // Handheld Daemon's settings tree, for its power settings here (not running: asked again after a minute).
  if(LINUX && !HHDP.schema && !HHDP.loading && (HHDP.err!=='off' || Date.now()-HHDP.offAt>60000)) hhdLoad();
  if(!PERF.timer && !PERF.busy) PERF.timer=setTimeout(perfTick, 50);
}
function qamPerfShowing(){ return S.layers.includes('qam') && S.qtab==='perf'; }
/** Quick Access › Performance drawn again in place: the selection (and a slider being moved) stays where it was. */
function qamPerfRedraw(){
  if(!qamPerfShowing()) return;
  const qb=$('#qam .qbody'); if(!qb) return;
  const inQam = !!(focused && $('#qam').contains(focused));
  const k = inQam ? focused.dataset.k : null, wasSlide = !!(SLIDE && SLIDE===focused), top=qb.scrollTop;
  qb.innerHTML=`<h3>Performance</h3>${perfBody()}`; qb.scrollTop=top;
  if(!inQam) return;
  const el = k && $(`#qam [data-k="${CSS.escape(k)}"]`);
  if(!el){ setFocus($('#qam .qbody [data-f]')||$('#qam [data-f]'),true); return; }
  if(wasSlide) SLIDE=null;
  setFocus(el,true);
  if(wasSlide){ SLIDE=el; el.classList.add('editing'); renderFooter(); }
}
// Quick Access › Performance on Handheld Daemon systems: HHD's own power section ("tdp" in its settings tree: the
// power mode, the limit with HHD's range, boost, the fan, and whatever else HHD has there for this device), drawn
// by the Handheld Daemon page's renderer in a compact form: advanced and non-essential settings (a fan curve's
// points) stay on that page. The same controls work over a game (the overlay) with the controller.
function hhdQam(fn){
  const keep={adv:HHDP.adv, compact:HHDP.compact, kp:HHDP.kp};
  HHDP.adv=false; HHDP.compact=true; HHDP.kp='qh-';
  try{ return fn(); } finally { Object.assign(HHDP, keep); }
}
function hhdQamConts(){
  const sec=HHDP.schema && HHDP.schema.tdp;

  return hhdQam(()=>Object.entries(sec).filter(([,c])=>hhdShown(c)));
}
const hhdPerf = () => LINUX && !!HHDP.schema && hhdQamConts().length>0;
function hhdQamBody(){

    const conts=hhdQamConts(); let h='';

// ==== Hearth Recorder (hosts/hearth-recorder) in Quick Access › Now playing: record the game (or the screen), and

const REC = {ok:false, st:null, at:0};
function recLoad(){

    const was=JSON.stringify([REC.ok,REC.st]); REC.ok=true; REC.st=(r&&r.session)||null; REC.secs=(r&&r.settings&&r.settings.replaySecs)||30;
    if(JSON.stringify([REC.ok,REC.st])!==was && S.layers.includes('qam') && S.qtab==='now'){ const k=document.activeElement&&document.activeElement.dataset.k; renderQam(); if(k) setFocus($(`#qam [data-k="${k}"]`)||$('#qam .qbody [data-f]'),true); }

function recQam(){

    : `<button class="btn" data-f data-k="q-rec" data-act="recToggle" ${k==='sound'?'disabled':''}>${I.display}Record</button>`;

// ---------- the on-screen keyboard (Game Mode), laid out like SteamOS's ----------
// Docked at the bottom, full width: a number row with backspace, Enter at the end of the middle row, Shift on both
// sides (tap once for one capital, twice for caps lock), &123 for symbols, a wide Space and ← → to move the caret.
// Controller shortcuts, shown on the keys: Y backspace, X space, LB shift, RB symbols, ☰ Done, B closes.
const KB_LETTERS=[['1','2','3','4','5','6','7','8','9','0','bksp'],['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l','enter'],['shift','z','x','c','v','b','n','m',',','.','shift2'],['sym','@','space','left','right','done']];
const KB_SYMS=[['1','2','3','4','5','6','7','8','9','0','bksp'],['!','@','#','$','%','^','&','*','(',')'],['-','_','=','+','[',']','{','}',';','enter'],['shift',"'",'"','/','\\','|','~','`',':','?','shift2'],['sym','.','space','left','right','done']];
const KB_SPECIAL={bksp:'⌫',enter:'↵',shift:'⇧',shift2:'⇧',sym:'&123',space:'Space',left:'←',right:'→',done:'Done'};
const KB_WIDE={bksp:'w15',enter:'w15',shift:'w15',shift2:'w15',sym:'w15',space:'w6',done:'w15 go'};
function kbGlyph(c){
  const st=promptStyle(); if(st!=='pad') return '';
  return {bksp:'Y',space:'X',shift:'LB',sym:'RB',done:'☰'}[c]||'';
}
function kbHTML(t, pre, actName){
  const up=(t.shift||t.caps)&&!t.sym;
  return `<div class="kb">${(t.sym?KB_SYMS:KB_LETTERS).map((r,ri)=>`<div class="kbrow">${r.map((c,ci)=>{
    const sp=Object.prototype.hasOwnProperty.call(KB_SPECIAL,c);
    const ch=up?c.toUpperCase():c;
    const lab=sp?(c==='sym'&&t.sym?'ABC':c==='enter'&&t.enterLabel?t.enterLabel:KB_SPECIAL[c]):ch;
    const on=(c==='shift'||c==='shift2')&&(t.shift||t.caps);

    return `<button class="key ${sp?'mod':''} ${KB_WIDE[c]||''} ${on?'on':''}" data-f data-k="${pre}-${ri}-${ci}" data-act="${actName}" data-c="${esc(sp?c:ch)}">${esc(lab)}${g?`<small class="kg">${g}</small>`:''}</button>`;

function back(){
  if(SLIDE){ slideDone(); return blip(420,.04); }
  if(S.locked && !S.layers.includes('prompt')) return;
  if(OVERLAY && S.layers.length<=1) return overlayClose();
  if(S.layers.length && S.layers.at(-1)==='launch' && S.launchWaiting) return launchShow();
  if(S.layers.length && S.layers.at(-1)!=='launch'){ const top=S.layers.at(-1); closeLayer(); return resumeIfGame(top); }
  if(!S.layers.length && S.view==='shots' && SH.open>=0){ const i=SH.open; SH.open=-1; return render('sh-'+i,true); }
  if(!S.layers.length && goBack()) return blip(420,.05);
}
function typeKey(c){
  const k=focused?.dataset.k;
  if(c==='clear'){ query=''; SKB.caret=0; return renderSearch(k); }
  const t=Object.assign(SKB,{text:query});
  const r=kbEdit(t,c); query=t.text;
  if(r==='done') return back();
  if(r==='enter'){ const first=$('#search .sres [data-f]'); if(first) return act(first); return; }
  renderSearch(k);
}
function power(p, sure){
  // Quick Resume keeps games through Shut down and Restart when the PC can (hibernation: Shut down saves them to the
  // drive and turns off, Restart saves them and restarts). `sure`: really shut down or restart (closes them).
  const games = qrFeature() ? qrGames() : 0;
  if(!sure && games && p==='shutdown' && qrKeeps()) p='hibernate';
  else if(!sure && games && p==='restart' && qrKeepsRestart()) p='hibernateRestart';
  else if(!sure && (p==='shutdown'||p==='restart') && games){
    // Can't keep them this way: ask first, and offer what keeps them.
    const items=[{label:p==='shutdown'?'Shut down anyway':'Restart anyway', icon:p==='shutdown'?'power':'restart', run:()=>power(p,true)}];
    if(p==='restart' && qrKeeps()) items.push({label:'Shut down instead (keeps games)', icon:'power', run:()=>power('hibernate',true)});
    items.push({label:'Sleep instead (keeps games)', icon:'moon', run:()=>power('sleep',true)});
    return openSheet({title:p==='shutdown'?'Shut down?':'Restart?', sub:`${games===1?'1 game is':games+' games are'} open or in Quick Resume. ${p==='shutdown'?'Shutting down':'Restarting'} closes ${games===1?'it':'them'}, and anything not saved in the game is lost.`, items});
  }
  closeAll();
  const label={hibernate:'Turning off. Your games will be here when you turn it back on…',hibernateRestart:'Restarting. Your games will be here when it starts again…',sleep:'Going to sleep…',restart:'Restarting…',shutdown:'Shutting down…',signout:'Signing out…',desktop:LINUX?'Switching to Mantel…':'Switching to the desktop…',explorer:'Opening File Explorer…'}[p];
  send({type:'power', action:p});
  toast(host?label:label+' (simulated in the browser preview)');
}
function updateBadge(){ const b=$('#nbadge'); b.textContent=NOTIFS.length; b.style.display=NOTIFS.length?'':'none'; b.classList.toggle('warn', NOTIFS.some(n=>n.expired)); }

let launchTimer=null;
function hideLaunch(){
  clearTimeout(launchTimer);
  if(!S.layers.includes('launch')) return;
  // Quick Access (or a sheet) opened over the starting screen closes with it: the game is coming to the front.
  while(S.layers.length && S.layers.at(-1)!=='launch') closeLayer();
  S.layers=S.layers.filter(x=>x!=='launch'); $('#launch').classList.remove('open'); focusStack.pop();
  renderFooter();
}
// mod (Beacon's games, Play with…): a mod id to play with this time, '@none' without mods; left out: Beacon's choice.
function launch(g, mod){
  if(isFrozen(g)) return quickResume(g.id);
  if(S.running===g.id){ closeAll(); return send({type:'resume'}); }
  let aside=null;
  if(S.running && S.running!==g.id){
    const cur=G(S.running);
    // Quick Resume: the game that's running is put aside (frozen where it is) and this one starts.
    if(!qrFeature() || !QR.on){ toast(`Exit ${cur?cur.title:'the game that\'s running'} first (Quick Access → Now playing)`); return; }
    if(cur && cur.cloud){ toast(`Close ${cur.title} first: cloud games can't be put aside`); return; }
    aside=cur;
  }
  if(aside) toast(`${aside.title} is put aside (Quick Resume)`);
  const L=$('#launch');
  L.innerHTML = `<div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide'])}<div class="lbox"><div class="spin"></div><div class="t">${esc(g.title)}</div><div class="s">${g.cloud?'Streaming with Xbox Cloud Gaming…':`Starting via ${SOURCES[g.src]}${mod?(mod==='@none'?' without mods':' with '+esc(beaconModName(g,mod))):''}…`}</div></div>`;
  closeAll();
  focusStack.push({el:focused, k:focused?.dataset.k}); S.layers.push('launch'); L.classList.add('open'); renderFooter();

  if(!host){ // browser preview: pretend
    launchTimer=setTimeout(()=>{ hideLaunch(); gameStarted(g.id); }, 1700);
    return;
  }
  call('game.launch',mod?{id:g.id, mod}:{id:g.id}).then(r=>{
    if(r && r.tracked===false){ // shortcut Nimbus can't watch
      launchTimer=setTimeout(()=>{ hideLaunch(); toast(`Started ${g.title}`); }, 2500);
      return;
    }
    // Started without the store (its sign-in expired): it plays offline; cloud saves and online play wait.
    if(r && r.expired) toast(`${g.title} is starting offline: your ${storeName(r.expired)} sign-in expired, so cloud saves didn't sync. Sign in again from Notifications.`);
    // Stay on the launch screen until the game's process shows up; stores can take a while.
    launchTimer=setTimeout(()=>{ hideLaunch(); toast(`${g.title} is still starting. The store may be updating it.`); }, 25000);
  }).catch(e=>{
    hideLaunch();
    // It needed the store and the store's sign-in expired: say so, with Sign in again.
    if(STORE_INFO[g.src] && g.src!=='steam' && /sign-in expired/i.test(e.message)){ loadAccounts(true); return expiredSheet(g.src, `${g.title} couldn't start: it needs ${storeName(g.src)} online.`); }
    toast(e.message);
  });
}
// Mantel's Games section (Desktop Mode's launcher) starts a game through here, the same as its Play button: once the
// library is in (Hearth may just be starting), with the starting screen and everything after it.
function playFromDesktop(id, tries=0){
  if(!id) return;
  const g=G(id);
  if(!g){ if(tries<60) setTimeout(()=>playFromDesktop(id, tries+1), 500); else toast("That game isn't in your library anymore"); return; }
  launch(g);
}
// Hearth (Linux): the game loads behind the starting screen and comes to the front once its window is up
// ("game.ready"). Until then the screen says what's happening; B or "Show it now" skips the wait.
function gameWaiting(id){
  const g=G(id); clearTimeout(launchTimer);
  S.running=id; S.runningSince=Date.now(); if(g) g.last=Date.now();
  const s=$('#launch .s'); if(s) s.textContent='Getting it ready…';
  S.launchWaiting=id;
}
function gameSlow(d){
  if(S.launchWaiting!==d.id || !S.layers.includes('launch')) return;
  const box=$('#launch .lbox'); if(!box || box.querySelector('.hint')) return;
  box.insertAdjacentHTML('beforeend', `<div class="hint">${d.firstRun?'The first start of a Windows game sets up Proton and can take a few minutes. It comes to the front by itself when it\'s ready.':'Still starting. It comes to the front by itself when it\'s ready.'}</div><button class="btn" data-f data-k="l-show" data-act="launchShow">Show it now</button>`);
  setFocus($('#launch [data-k="l-show"]'));
}
function launchQam(){
  if(host && !OVERLAY && (HOSTINFO.features||[]).includes('overlayOverLaunch')) return send({type:'overlay', action:'open'});
  openLayer('qam');
}
function launchShow(){ S.launchWaiting=null; hideLaunch(); send({type:'resume'}); }
function gameReady(id){
  if(S.launchWaiting!==id) return;
  S.launchWaiting=null;
  gameStarted(id);
}
function gameStarted(id){
  if(host && LINUX && !OVERLAY && S.launchWaiting!==id && S.layers.includes('launch') && S.running!==id){ gameWaiting(id); return; }
  const g=G(id); hideLaunch();
  S.running=id; S.runningSince=Date.now(); if(g) g.last=Date.now();
  if(!OVERLAY) overlayTip();
  if(S.view==='game') render(null,true); else renderFooter();
  if(S.layers.includes('qam')) renderQam();
  if(g) toast(`${g.title} is running. Open Quick Access to exit.`);
}
function gameEnded(dto){
  if(dto && dto.id){ const g=G(dto.id); if(g) Object.assign(g, fromHost(dto)); }
  S.running=null; S.paused=false; S.launchWaiting=null; hideLaunch();
  if(!S.layers.length) render(null,true); else { renderFooter(); if(S.layers.includes('qam')) renderQam(); }
}
async function exitGame(){
  const g=G(S.running);
  if(!host){ S.running=null; toast(g?`Closed ${g.title}`:'Closed game'); return gameEnded(null); }
  toast(g?`Closing ${g.title}…`:'Closing game…');
  try{ const r=await call('game.close',{},20000); if(r && r.ok===false) toast("Some of the game's windows wouldn't close. It may be running as administrator."); }
  catch(e){ toast(e.message); }
  // The exit itself arrives as a game.exited event once the process is gone.
}

const IM_KB = [
  ['ESC','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'],
  ['GRAVE','1','2','3','4','5','6','7','8','9','0','MINUS','EQUAL','BACKSPACE'],
  ['TAB','Q','W','E','R','T','Y','U','I','O','P','LEFTBRACE','RIGHTBRACE','BACKSLASH'],
  ['CAPSLOCK','A','S','D','F','G','H','J','K','L','SEMICOLON','APOSTROPHE','ENTER'],
  ['LEFTSHIFT','Z','X','C','V','B','N','M','COMMA','DOT','SLASH','RIGHTSHIFT'],
  ['LEFTCTRL','LEFTMETA','LEFTALT','SPACE','RIGHTALT','COMPOSE','RIGHTCTRL'],
  ['INSERT','DELETE','HOME','END','PAGEUP','PAGEDOWN','UP','DOWN','LEFT','RIGHT'],
  ['KP0','KP1','KP2','KP3','KP4','KP5','KP6','KP7','KP8','KP9','KPDOT','KPENTER'],
  ['KPPLUS','KPMINUS','KPASTERISK','KPSLASH','SYSRQ','SCROLLLOCK','PAUSE','NUMLOCK'],
];
let IMK=null;
function imCss(){
  if($('#imkeys')) return;
  document.head.insertAdjacentHTML('beforeend', `<style>
#imkeys{top:0;left:0;right:0;background:var(--panel);padding:18px var(--gut) 16px;transform:translateY(-102%);transition:transform .24s var(--ease),visibility .24s;box-shadow:0 20px 60px rgba(0,0,0,.45);max-height:100vh;overflow-y:auto;scrollbar-width:none}
#imkeys.open{transform:none}
#imkeys .osk{margin-top:12px}
#imkeys .key{width:auto;min-width:clamp(30px,5.4vw,50px);padding:0 8px;font-size:13px;height:40px}
#imkeys .key.w4{min-width:clamp(140px,24vw,230px)}
#imtest{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--panel);border-radius:14px;padding:16px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);width:min(560px,92vw)}
#imtest b{display:block;margin-bottom:8px}
#imtest .imrow{display:flex;gap:10px;font-size:14px;margin:4px 0}#imtest .imrow span:first-child{width:64px;color:var(--dim)}
#imtest .muted{font-size:12px;margin-top:8px}
</style>`);
  const el=document.createElement('section'); el.className='layer'; el.id='imkeys'; document.body.appendChild(el);
}
function imPickKeys(title, max){
  imCss();
  return new Promise(res=>{ IMK={title, max, picked:[], res, done:false}; openLayer('imkeys'); });
}
function renderImKeys(keepK){
  const k=IMK; if(!k) return;
  const L=IM.keyLabel||{}, wide={SPACE:'w4', BACKSPACE:'w2', ENTER:'w2', LEFTSHIFT:'w2', RIGHTSHIFT:'w2', TAB:'w2', CAPSLOCK:'w2'};
  const rows=IM_KB.map(r=>r.filter(n=>L[n]!=null)).filter(r=>r.length);
  const shown = k.max>1 ? ' · '+(k.picked.length ? k.picked.map(n=>L[n]||n).join(' + ') : 'pick up to '+k.max+' keys, then Done') : '';
  $('#imkeys').innerHTML = `<div class="ptitle">${esc(k.title)}${esc(shown)}</div>
    <div class="osk">${rows.map(r=>`<div>${r.map(n=>`<button class="key ${wide[n]||''} ${k.picked.includes(n)?'on':''}" data-f data-k="imk-${n}" data-act="im" data-op="kb" data-v="${n}">${esc(L[n])}</button>`).join('')}</div>`).join('')}
      <div>${k.max>1?`<button class="key w2" data-f data-k="imk-clear" data-act="im" data-op="kbclear">Clear</button><button class="key w2 go" data-f data-k="imk-done" data-act="im" data-op="kbdone">Done</button>`:''}<button class="key w2" data-f data-k="imk-x" data-act="back">Cancel</button></div></div>`;
  const el=keepK && $(`#imkeys [data-k="${keepK}"]`); if(el) setFocus(el, true);
}
function imKb(n){
  const k=IMK; if(!k) return;
  if(k.max===1){ k.done=true; closeLayer(); return k.res([n]); }
  const i=k.picked.indexOf(n);
  if(i>=0) k.picked.splice(i,1); else if(k.picked.length<k.max) k.picked.push(n); else toast('Up to '+k.max+' keys together');
  renderImKeys('imk-'+n);
}
function imKbDone(){ const k=IMK; if(!k) return; k.done=true; closeLayer(); k.res(k.picked.length ? k.picked.slice() : null); }
LAYER_RENDER.imkeys = ()=>renderImKeys();
LAYER_CLOSE.imkeys = ()=>{ if(IMK && !IMK.done) IMK.res(null); IMK=null; };

// Trying a layout: Hearth Input runs it for a few seconds wherever Hearth is; what it sends shows here (and does
// nothing else to the page).
function imTest(){
  if(IM.test) return imTestStop();
  imCall('input.test', {layout:IM.draft, seconds:20}).then(r=>imTestStart(r.seconds||20)).catch(e=>toast(e.message));
}
function imKeyName(e){ return e.key===' ' ? 'Space' : e.key.length===1 ? e.key.toUpperCase() : e.key.replace(/^Arrow/,'').replace(/^Control$/,'Ctrl').replace(/^Escape$/,'Esc'); }
function imTestStart(secs){
  imCss();
  const t={until:Date.now()+secs*1000, keys:new Set(), click:'', scroll:'', dx:0, dy:0};
  IM.test=t;
  const box=document.createElement('div'); box.id='imtest'; document.body.appendChild(box);
  const mine = e => e.target && e.target.closest && e.target.closest('#imtest button');
  const swallow = e => { if(mine(e)) return false; e.preventDefault(); e.stopImmediatePropagation(); return true; };
  t.h = {
    keydown:e=>{ swallow(e); t.keys.add(imKeyName(e)); imTestDraw(); },
    keyup:e=>{ swallow(e); t.keys.delete(imKeyName(e)); imTestDraw(); },
    mousedown:e=>{ if(swallow(e)){ t.click=['Left click','Middle click','Right click','Mouse back','Mouse forward'][e.button]||'Click'; imTestDraw(); } },
    mouseup:e=>{ if(swallow(e)){ t.click=''; imTestDraw(); } },
    click:swallow, auxclick:swallow, contextmenu:swallow, dblclick:swallow,
    mousemove:e=>{ swallow(e); t.dx+=e.movementX||0; t.dy+=e.movementY||0; imTestDraw(); },
    wheel:e=>{ swallow(e); t.scroll = e.deltaY<0 ? 'Scroll up' : e.deltaY>0 ? 'Scroll down' : e.deltaX<0 ? 'Scroll left' : 'Scroll right'; imTestDraw(); },
  };
  for(const [k,f] of Object.entries(t.h)) window.addEventListener(k, f, {capture:true, passive:false});
  t.timer=setInterval(()=>{
    if(Date.now()>=t.until) return imTestStop(true);
    imTestDraw();
    // The Guide button ends it early (Hearth Input lets go): stop here too.
    if(host) imCall('input.status').then(s=>{ if(IM.test===t && s && s.ok && !s.test) imTestStop(true); }).catch(()=>{});
  }, 1000);
  imTestDraw();
  if(S.view==='inputmap' && !S.layers.length) render('im-test', true);
}
function imTestDraw(){
  const t=IM.test, box=$('#imtest'); if(!t || !box) return;
  const left=Math.max(0, Math.ceil((t.until-Date.now())/1000));
  const arrow=(v,a,b)=>v ? (v<0?a:b)+' '+Math.abs(v) : '';
  box.innerHTML = `<b>Trying “${esc(IM.draft ? IM.draft.name||'Custom' : '')}” · ${left} s left</b>
    <div class="imrow"><span>Keys</span><span>${t.keys.size ? esc([...t.keys].join(' + ')) : '—'}</span></div>
    <div class="imrow"><span>Mouse</span><span>${esc([arrow(t.dx,'←','→'), arrow(t.dy,'↑','↓'), t.click, t.scroll].filter(Boolean).join(' · ') || '—')}</span></div>
    <div class="muted">The controller sends these instead of its own buttons. Press Guide (the Xbox button) to stop early.</div>
    <button class="btn sm">Stop</button>`;
  box.querySelector('button').onclick = ()=>imTestStop();
}
function imTestStop(timedOut){
  const t=IM.test; if(!t) return;
  clearInterval(t.timer);
  for(const [k,f] of Object.entries(t.h)) window.removeEventListener(k, f, {capture:true});
  const box=$('#imtest'); if(box) box.remove();
  IM.test=null;
  imCall('input.test', {stop:true}).catch(()=>{});
  toast(timedOut ? 'Done trying the layout' : 'Stopped trying the layout');
  if(S.view==='inputmap' && !S.layers.length) render('im-test', true);
}

// Quick Access › Now playing: the running game's layout, gyro, sensitivity
function inputQam(g){
  if(!(LINUX || hasFeat('hearthInput')) || !g || g.cloud) return '';
  imLoadTables(); imLoad(g.id); imLoadStatus();
  const c=IM.games[g.id]; if(!c || !IM.tables) return '';
  IM.qaGame=g.id;
  let h=`<h3 style="margin-top:16px">Controller layout</h3><button class="btn sm" data-f data-k="q-im" data-act="im" data-op="pick" data-id="${esc(g.id)}">${I.pad}${esc(imChoiceLabel(c))}</button>`;
  if(c.layout!=='off'){
    const gy=IM.status && IM.status.gyro, on=!!(c.prefs && c.prefs.gyro);
    h += `<button class="ctl tg" data-f data-k="q-imgyro" data-act="im" data-op="qaGyro" data-id="${esc(g.id)}" style="margin-top:6px">${I.pad}<span class="tgl">Gyro aiming<small>${gy && gy.available ? 'Tilt the controller to aim' : 'No motion sensors found'}</small></span><div class="sw ${on?'on':''}"></div></button>`;
    h += imSlider('qa.sens', 'Aiming sensitivity');
    h += `<div class="muted" style="font-size:12px;margin-top:4px">The controller acts as a keyboard and mouse in this game. While Quick Access is open the controller is ${APP}'s.</div>`;

function imAct(el, d){
  switch(d.op){
    case 'pick': return imPick(d.id);
    case 'btn': return imBtnMenu(d.c);
    case 'stick': return imStickMenu(d.c);
    case 'tog': imSetVal(d.p, !imGet(d.p)); return imChanged(true);
    case 'set': IM.set=d.v; return render('im-set-'+d.v, true);
    case 'name': return imRename();
    case 'test': return imTest();
    case 'reset': return imReset();
    case 'dpad': return imDpadMenu();
    case 'radial': return imRadial(+d.i);
    case 'kb': return imKb(d.v);
    case 'kbdone': return imKbDone();
    case 'kbclear': if(IMK){ IMK.picked=[]; renderImKeys('imk-clear'); } return;
    case 'qaGyro': { const c=IM.games[d.id]; if(!c) return; const on=!(c.prefs && c.prefs.gyro); return imSave(d.id, {prefs:{gyro:on}}).then(r=>{ if(r) toast('Gyro aiming '+(on?'on':'off')); }); }
  }
}

function gameOptions(g){
  if(!g) return;
  const items=[];
  if(host && (LINUX || hasFeat('gameSettings')) && !g.cloud) items.push({label:'Game settings',icon:'gear',run:()=>navigate('gameset',{game:g.id})});
  items.push({label:'Add to collection…',icon:'lib',run:()=>colPick(g)});
  items.push(g.hidden ? {label:'Show in library',icon:'lib',run:()=>setHidden(g,false)} : {label:'Hide from library',icon:'x',run:()=>setHidden(g,true)});
  if(g.canRemove) items.push({label:'Remove from '+APP+'',icon:'trash',run:()=>removeGame(g)});
  if(ANDROID && g.src!=='emu') items.push({label:'App info',icon:'info',run:()=>andOpen('app', g.id)});
  if(isActive(g) && g.installKind==='nimbus') items.unshift({label:'Cancel download',icon:'x',run:()=>cancelInstall(g)});
  if(g.inst && canDelete(g) && !isActive(g)) items.push({label:'Uninstall…',icon:'trash',run:()=>uninstallGame(g)});
  if(g.src==='beacon'){
    if(g.inst && beaconMods(g).length) items.unshift({label:'Play with…',icon:'play',run:()=>beaconPlayWith(g)});
    items.push({label:'Game setup',icon:'sliders',run:()=>beaconSetup(g)});
    if(g.inst) items.push({label:'Mods',icon:'lib',run:()=>beaconModsPage(g)});
    items.push({label:'Open Beacon',icon:'sliders',run:()=>beaconOpen()});
  }
  gamingGameItems(g, items);   // Hearth's gaming apps (block below)
  openSheet({title:g.title, sub:SOURCES[g.src], items});
}

// ---------- Beacon (BFME, Age of the Ring, LOTR: Conquest…): mods, Play with…, Beacon's window ----------
// Beacon keeps each game's mod (beacon select-mod); Play starts with it, Play with… picks one for this time only.
const beaconMods = g => (g&&g.beacon&&g.beacon.mods)||[];
function beaconModName(g, id){
  const m = id===undefined ? (g.beacon&&g.beacon.mod) : id;
  if(!m || m==='@none') return 'No mod';
  const x=beaconMods(g).find(y=>y.id===m); return x?x.name:m;
}
function beaconAbout(g){
  const b=g.beacon||{}, mods=beaconMods(g);
  if(!g.inst) return `Beacon knows this game, but it isn't set up yet${b.blocker?` (${esc(b.blocker)})`:''}. Select Set up to install it or show where it's installed.`;
  let t=`Started by Beacon${b.edition?`, as ${esc(b.edition)}`:''}${b.viaSteam?', through Steam':''}.`;
  if(b.blocker) t+=` <b>Can't start yet:</b> ${esc(b.blocker)}. Game setup says how to fix it.`;
  else { const w=(b.issues||[]).find(i=>i.level!=='error'); if(w) t+=` Note: ${esc(w.message)}.`; }
  if(mods.length) t+=` Mods in Beacon: ${mods.map(m=>esc(m.name)).join(', ')}.`;
  return t;
}
function beaconPlayWith(g){
  if(!g) return;
  const cur=g.beacon&&g.beacon.mod;
  openSheet({title:'Play with…', sub:`${g.title}, this time only. Game settings › Mod changes what Play starts with.`, items:[
    ...beaconMods(g).map(m=>({label:m.name+(m.id===cur?' (your choice)':''), icon:'play', run:()=>launch(g, m.id)})),
    {label:'No mod (the base game)'+(!cur?' (your choice)':''), icon:'play', run:()=>launch(g, '@none')}]});
}
function beaconPickMod(g, k){
  if(!g) return;
  const cur=g.beacon&&g.beacon.mod;
  const set=async id=>{
    try{
      const d = host ? await call('beacon.selectMod',{id:g.id, mod:id||'@none'},30000) : null;
      if(d) Object.assign(g, fromHost(Object.assign({}, d, {fav:g.fav, hidden:g.hidden})));
      else g.beacon=Object.assign({}, g.beacon, {mod:id||null});
      toast(id ? `${g.title} starts with ${beaconModName(g,id)}` : `${g.title} starts without mods`);
      render(k||null,true);
    }catch(e){ toast(e.message); }
  };
  openSheet({title:'Mod', sub:`What ${g.title} starts with. Saved in Beacon, which shows the same choice.`, items:[
    ...beaconMods(g).map(m=>({label:m.name+(m.kind==='launcher'?' (its own launcher)':''), icon:m.id===cur?'check':'', run:()=>set(m.id)})),
    {label:'No mod (the base game)', icon:!cur?'check':'', run:()=>set(null)},
    {label:'Mods…', icon:'sliders', run:()=>beaconModsPage(g)}]});
}

// ---------- Beacon's screens in Hearth: Game setup, Mods, the game's log (Beacon 0.0.6+, hearth-core beacon.rs) ----------
// Everything Beacon's own window does, here: a Beacon game's page › Game setup / Mods. Each change goes to Beacon
// (beacon.set, beacon.setKey…) and the answer is the game's details read again; long jobs (Prepare the game, an
// installer, looking for games or mods) report beacon.progress then beacon.done. One change at a time.
const BC = {d:{}, err:{}, loading:{}, job:null, log:{}};
const BC_RELEASES = 'https://github.com/Dragongamer9/beacon/releases';
const BC_RES = ['1280x720','1280x800','1366x768','1600x900','1920x1080','1920x1200','2560x1440','2560x1600','3840x2160'];
const bcSlug = g => String((g&&g.id)||g||'').replace(/^beacon:/,'');
function bcCall(m, a={}, ms=60000){ return host ? call(m, a, ms) : BC_MOCK(m, a); }
function bcRedraw(k){ if(!S.layers.length && ['bsetup','bmods','blog','game','library','stores'].includes(S.view)) render(k||null, true); }
function bcLoad(id){
  BC.loading[id]=true;
  return bcCall('beacon.details',{id},90000).then(d=>{ BC.d[id]=d; BC.err[id]=null; })
    .catch(e=>{ BC.err[id]=e.message; }).finally(()=>{ BC.loading[id]=false; bcRedraw(); });
}
function beaconSetup(g){ if(!g) return; bcLoad(g.id); navigate('bsetup',{game:g.id}); }
function beaconModsPage(g){ if(!g) return; bcLoad(g.id); navigate('bmods',{game:g.id}); }
function beaconGameCard(g){

// Library › Beacon: look for games, Beacon's own window.
function beaconLibPills(){

function bcRow(k, act, icon, title, sub, val, extra=''){
  return `<button class="row" data-f data-k="${k}" data-act="${act}" ${extra}>${icon?`<span class="ricon">${icon}</span>`:''}<div class="rt"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div>${val!=null?`<div class="rv">${val}</div>`:''}</button>`;
}
function bcSw(k, what, title, sub, on){
  return `<button class="row" data-f data-k="${k}" data-act="bcnSet" data-what="${what}" data-v="${on?'off':'on'}"><div class="rt"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div><div class="sw ${on?'on':''}"></div></button>`;

// A long job in progress, at the top of the page it's about.
function bcJobRow(id){
  const j=BC.job; if(!j || (id && j.game && j.game!==bcSlug(id))) return '';
  const pct=Math.max(0,Math.min(100,Math.round(j.pct||0)));
  return `<div class="su-card" data-f data-k="bc-job" tabindex="-1"><div class="su-head"><div><b>${esc(j.label[0].toUpperCase()+j.label.slice(1))}</b><div class="muted" style="font-size:13px;margin-top:4px">${esc(j.text||'Working')}</div></div><div class="pc">${j.pct==null?'':pct+'%'}</div></div>
    <div class="bar" style="height:8px"><i style="width:${pct}%"></i></div></div>`;
}
function bcErrNote(g){
  const e=BC.err[g.id]||'';
  return note(esc(e)+(/newer Beacon|0\.0\.6/.test(e)?` Update Beacon to set games up in ${APP}.`:''))
    + bcRow('bc-retry','bcnReload',I.refresh,'Try again','Asks Beacon again',null,`data-id="${esc(g.id)}"`)
    + bcRow('bc-open','beaconOpen',I.sliders,'Open Beacon','Beacon\'s own window','›');
}
// What fixes an issue Beacon reports (its own words): [action, button label, extra data].
function bcFix(st, msg){
  const m=msg.toLowerCase();
  if(!st.installed && /folder|not found|install/.test(m)) return ['bcnLocate','Find it',''];
  if(/cd key/.test(m)) return ['bcnKey','Add key',''];
  if(/runner|wine|proton/.test(m)) return ['bcnRunner','Choose',''];
  if(st.requires && /requires|needs|first/.test(m)) return ['bcnReq','Set it up',''];
  if(/prefix|set up|setup|registry/.test(m)) return ['bcnJob','Prepare','data-job="setup"'];
  return null;
}

    else h+=bcRow('bc-vd','bcnVd',I.display,'Virtual desktop','Keeps an old game in one window of its own. Try it if the game\'s window misbehaves.',(st.virtualDesktop?'On':'Off')+(st.vdChoice==null?' (usual)':'')+' ›',dk);
    if(st.steamAppid) h+=bcSw('bc-steam','viaSteam','Launch through Steam','For the copy in your Steam library',st.viaSteam);
    h+=bcRow('bc-args','bcnArgs',I.text,'Extra arguments',st.extraArgs?esc(st.extraArgs):'Passed to the game, like -noshellmap','Edit ›',dk)
      + bcRow('bc-locate','bcnLocate',I.lib,'Game folder',st.path?esc(st.path):'Not set','Change ›',dk);
  }
  const c=d.community;
  if(st.hasCommunity && c){
    const act=(c.editions||[]).find(e=>e.active);
    h+=shead('Community versions');
    if((c.editions||[]).length) h+=bcRow('bc-edition','bcnEdition',I.star,'Version','Which one Play starts',esc(c.chosen?(act?act.name:c.chosen):'Automatic'+(act?` (${act.name})`:''))+' ›',dk);
    (c.steps||[]).forEach((s,i)=>{ h+=bcRow('bc-step-'+i,'bcnStep',s.done?I.check:I.dl,esc(s.title),esc(s.detail||''),s.done?'Done ›':(s.action==='link'?'Open ›':'Add files ›'),`${dk} data-i="${i}"`); });
  }
  h+=shead('Tools');
  if(st.installed) h+=bcRow('bc-prepare','bcnJob',I.refresh,'Prepare the game','Sets up its Wine prefix and settings. Play does this too; this shows how it goes.',st.needsSetup?'Needs doing ›':st.needsSetup===false?'Done ›':'›',`${dk} data-job="setup"`);
  h+=bcRow('bc-patch','bcnJob',I.dl,'Run a patch or installer','An official patch, a mod installer or the game\'s own installer, in the game\'s Wine setup','Choose ›',`${dk} data-job="patch"`);
  if(st.toolLauncher) h+=bcRow('bc-tool','bcnJob',I.play,`${esc(st.short||g.title)}'s own launcher`,'For its updates and options','Open ›',`${dk} data-job="tool"`);
  h+=bcRow('bc-log','bcnLog',I.text,'Game log',st.hasLog?'What happened the last time it started':'Nothing yet: it\'s written when the game starts','›',dk);
  if(st.installed) h+=bcRow('bc-mods','bcnMods',I.lib,'Mods',`${(d.mods&&d.mods.list.length)||0} installed · find and add more`,'›',dk);

  }

function viewBLog(){

VIEWS.bsetup = viewBSetup; TITLES.bsetup = 'Game setup';
