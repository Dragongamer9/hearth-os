// Changes: each answer is the game's details again.
function bcApply(id, d, k){ if(d){ BC.d[id]=d; if(d.message) toast(d.message); } bcRedraw(k); }
function bcSet(id, what, value, k){ return bcCall('beacon.set',{id, what, value},60000).then(d=>bcApply(id,d,k)).catch(e=>toast(e.message)); }
function bcStart(id, job, extra={}, k){
  if(BC.job) return toast(`Beacon is still busy (${BC.job.label}). Try again when it's done.`);
  // A file picker may open first (installers, patches, downloads): it waits for the person.
  return bcCall('beacon.job', Object.assign({id:id||null, job}, extra), 15*60e3).then(r=>{
    if(!r) return;   // picker closed
    BC.job={game:id?bcSlug(id):null, job, pct:0, text:'Starting', label:r.label||'working', k};
    bcRedraw(k);
  }).catch(e=>toast(e.message));
}
function beaconEvent(name, d){
  if(name==='beacon.progress'){
    BC.job=Object.assign(BC.job||{game:d.game||null, job:d.job, label:'working'}, {pct:d.pct==null?(BC.job&&BC.job.pct):d.pct, text:d.text||''});
  } else if(name==='beacon.done'){
    BC.job=null;
    const what={setup:'Prepared', install:'The installer finished', patch:'Done', tool:'The launcher closed', scan:'Done looking', findMods:'Done looking', addFiles:'Files added', aioGet:'Installed'}[d.job]||'Done';
    toast(d.ok ? (d.message||what) : (d.error||'That didn\'t work'));
    if(d.job==='aioGet' && d.ok && d.ready) loadLibrary(false);
    if(d.game) bcLoad('beacon:'+d.game);
    if(d.job==='scan' || d.job==='findMods' || d.job==='install' || d.job==='aioGet') Object.keys(BC.d).forEach(id=>{ if(!d.game || id!=='beacon:'+d.game) bcLoad(id); });
  }
  bcRedraw();
}
function bcPrompt(o){ return openPrompt(o); }
function beaconAct(a, d){
  const g=G(d.id), id=d.id, dd=g&&BC.d[g.id], st=dd&&dd.status;
  switch(a){
    case 'bcnGet':
      // Ember installs Beacon itself (its official Windows installer, silently); elsewhere the releases page.
      if(feat('beaconInstall')){ if(S.bcnInstalling) return; S.bcnInstalling=true; toast('Installing Beacon…');
        return call('beacon.install',{},600000).then(()=>{ S.bcnInstalling=false; toast('Beacon is installed'); loadAccounts(); loadLibrary(false); }).catch(e=>{ S.bcnInstalling=false; toast(e.message); }); }
      return bcLink(BC_RELEASES);
    case 'bcnSetup': return beaconSetup(g);
    case 'bcnMods': return beaconModsPage(g);
    case 'bcnReload': return bcLoad(id);
    case 'bcnReq': { const r=st&&G('beacon:'+st.requires); return r ? beaconSetup(r) : null; }
    case 'bcnJob': return bcStart(d.job==='scan'||d.job==='findMods' ? null : id, d.job, {}, focused&&focused.dataset.k);
    case 'bcnLocate': return bcCall('beacon.locate',{id},15*60e3).then(r=>{ if(r) bcApply(id,r,'bc-locate'); }).catch(e=>toast(e.message));
    case 'bcnLog': S.view==='blog' || navigate('blog',{game:id}); BC.log[id]=BC.log[id]||null;
      return bcCall('beacon.log',{id},30000).then(l=>{ BC.log[id]=l; }).catch(e=>{ BC.log[id]={error:e.message}; }).finally(()=>bcRedraw('bl-refresh'));
    case 'bcnSet': return bcSet(id||S.game, d.what, d.v, focused&&focused.dataset.k);
  }
  if(!st) return;
  switch(a){
    case 'bcnKey': {
      const ask=()=>bcPrompt({title:`CD key for ${g.title}`, secret:true}).then(v=>{
        if(v==null) return; const k=v.trim();
        if(!/^[A-Za-z0-9-]{4,64}$/.test(k)) return toast('A CD key has only letters, numbers and dashes');
        return bcCall('beacon.setKey',{id, key:k},60000).then(r=>bcApply(id,r,'bc-key')).catch(e=>toast(e.message)); });
      if(!st.hasCdKey) return ask();
      return openSheet({title:'CD key', sub:`${g.title} has a saved key. Only Beacon keeps it.`, items:[
        {label:'Change the key', icon:'lock', run:()=>setTimeout(ask,200)},
        {label:'Remove the saved key', icon:'trash', run:()=>bcCall('beacon.setKey',{id, clear:true},60000).then(r=>bcApply(id,r,'bc-key')).catch(e=>toast(e.message))}]});
    }
    case 'bcnRunner': {
      const cur=st.runnerChoice||null;
      return openSheet({title:'Runner', sub:`What runs ${g.title}. Automatic picks the best one Beacon finds.`, items:[
        {label:'Automatic'+(dd.best?` (${((dd.runners||[]).find(r=>r.id===dd.best)||{name:dd.best}).name})`:''), icon:!cur?'check':'', run:()=>bcSet(id,'runner','auto','bc-runner')},
        ...(dd.runners||[]).map(r=>({label:r.name+(r.kind?` · ${r.kind==='umu'?'umu':r.kind==='proton'?'Proton':'Wine'}`:''), icon:cur===r.id?'check':'', run:()=>bcSet(id,'runner',r.id,'bc-runner')}))]});
    }
    case 'bcnRes': {
      const scr=`${Math.round(screen.width*(window.devicePixelRatio||1))}x${Math.round(screen.height*(window.devicePixelRatio||1))}`;
      const list=[...new Set([scr,...BC_RES])].filter(r=>{ const [w,h]=r.split('x').map(Number); return w>=640&&h>=480; });
      return openSheet({title:'Resolution', sub:`What ${g.title} draws at`, items:[
        {label:`Match the screen (${scr})`, icon:st.resolution===scr?'check':'display', run:()=>bcSet(id,'resolution',scr,'bc-res')},
        ...list.filter(r=>r!==scr).map(r=>({label:r.replace('x',' × '), icon:st.resolution===r?'check':'', run:()=>bcSet(id,'resolution',r,'bc-res')})),
        {label:'The game\'s own setting', icon:!st.resolution?'check':'', run:()=>bcSet(id,'resolution','clear','bc-res')}]});
    }
    case 'bcnVd': return openSheet({title:'Virtual desktop', sub:`Runs ${g.title} inside one window of its own`, items:[
        {label:'On', icon:st.vdChoice===true?'check':'', run:()=>bcSet(id,'virtualDesktop','on','bc-vd')},
        {label:'Off', icon:st.vdChoice===false?'check':'', run:()=>bcSet(id,'virtualDesktop','off','bc-vd')},
        {label:`Usual for this game (${st.vdDefault?'on':'off'})`, icon:st.vdChoice==null?'check':'', run:()=>bcSet(id,'virtualDesktop','default','bc-vd')}]});
    case 'bcnArgs': return bcPrompt({title:'Extra arguments', value:st.extraArgs||''}).then(v=>{ if(v!=null) bcSet(id,'args',v.trim(),'bc-args'); });
    case 'bcnEdition': { const c=dd.community||{};
      return openSheet({title:'Version', sub:`Which version of ${g.title} Play starts`, items:[
        {label:'Automatic (the community version when it\'s installed)', icon:!c.chosen?'check':'', run:()=>bcSet(id,'edition','auto','bc-edition')},
        ...(c.editions||[]).map(e=>({label:e.name+(e.installed?'':' (not installed yet)'), icon:c.chosen===e.id?'check':'', run:()=>bcSet(id,'edition',e.id,'bc-edition')}))]}); }
    case 'bcnStep': { const s=((dd.community||{}).steps||[])[+d.i]; if(!s) return;
      const k='bc-step-'+d.i, items=[];
      if(s.url) items.push({label:'Open its page', icon:'globe', run:()=>bcLink(s.url)});
      if(s.action==='installer') items.push({label:'Run the installer you downloaded…', icon:'dl', run:()=>bcStart(id,'addFiles',{step:s.id},k)});
      if(s.action==='merge'||s.action==='mods'){ items.push({label:'Add the file you downloaded…', icon:'dl', run:()=>bcStart(id,'addFiles',{step:s.id},k)});
        items.push({label:'Add a folder you downloaded…', icon:'lib', run:()=>bcStart(id,'addFiles',{step:s.id, folder:true},k)}); }

// ---------- installs and downloads ----------
const INSTALLING = new Set();   // install requests on their way (a second press didn't start a second install)
async function installGame(g){
  if(!g) return;
  if(g.src==='beacon') return beaconSetup(g);   // Game setup: install it, or show where it is
  // The store's sign-in expired: installing needs it, so offer Sign in again instead of failing in the queue.
  const xs = (g.src==='epic' || g.src==='gog') && isExpired(g.src);
  if(xs && !g.note) return expiredSheet(g.src, `${g.title} can't install until you do.`);
  if(!host) return toast(`The browser preview can't install games`);
  if(g.note) return toast(`${g.note}. ${APP} can't install it.`);
  if(INSTALLING.has(g.id)) return;
  INSTALLING.add(g.id);
  try{
    const r = await call('game.install',{id:g.id},60000);
    if(r && r.silent){
      // Steam, without its window (docs/STEAM.md): it waits for a download Steam is busy with, or starts now.
      g.state='queued'; g.stage='Waiting for Steam';
      toast(r.waiting ? `${g.title} is queued. Steam starts it when its current download or game is done.` : `Steam is downloading ${g.title} in the background. Follow it under Downloads.`);
      render(null,true);
    }
    else if(g.installKind==='nimbus'){
      g.state='queued'; toast(`Downloading ${g.title}. Follow it under Downloads.`);
      render(null,true);
    }
    else if(g.installKind==='beacon') toast(`Beacon is open: show it where ${g.title} is installed. ${APP} picks it up when it's ready.`);
    else if(g.installKind==='store') toast(`The Microsoft Store is open. Install ${g.title} there; ${APP} picks it up when it's done.`);
    else toast(`${SOURCES[g.src]}'s install window is open: A installs, B cancels, D-pad moves (or use the right stick as a mouse).`);
    startDownloadPoll(true);
  }catch(e){
    if((g.src==='epic' || g.src==='gog') && /sign-in expired/i.test(e.message)){ await loadAccounts(true); return expiredSheet(g.src, `${g.title} can't install until you do.`); }
    toast(e.message);
  }
  finally{ INSTALLING.delete(g.id); }
}
let dlTimer=null, dlWatchUntil=0, dlRunning=false, dlSig='';
// Polls Steam's install records while anything is downloading (and for a while after an install request,
// since the download only appears once you confirm Steam's dialog). One poll at a time: a second request while
// one was waiting for its answer used to start another chain, and they piled up (dozens of calls a second,
// redrawing the screen each time, which made the selection jump and Hearth sluggish).
function startDownloadPoll(expectNew){
  if(expectNew) dlWatchUntil=Date.now()+5*60e3;
  if(dlRunning) return;
  dlRunning=true;
  const tick=async()=>{
    dlTimer=null;
    let next=10000;
    try{
      const r=await call('library.downloads');
      if(r.speeds) DLS.speeds=r.speeds; if(r.recent) DLS.recent=r.recent;
      const before=new Map(GAMES.map(g=>[g.id,g.state]));
      for(const d of r.active){ const g=G(d.id); if(g) Object.assign(g, fromHost({...d, fav:g.fav, hidden:g.hidden})); else GAMES.push(fromHost(d)); }
      // Redraw only when something on screen changed.
      const sig=JSON.stringify([r.active.map(a=>[a.id,a.state,Math.round((a.progress||0)*100),a.bytesDone]), S.view==='downloads'?(r.speeds||[]).slice(-1):0]);
      if(r.changed){
        const finished=[...before].filter(([id,st])=>STATE_LABEL[st] && !r.active.some(a=>a.id===id)).map(([id])=>G(id)).filter(Boolean);
        await loadLibrary(true);
        finished.filter(g=>G(g.id)&&G(g.id).inst).forEach(g=>toast(`${g.title} is ready to play`));
      } else if(sig!==dlSig && !S.layers.length && ['downloads','library','home','game'].includes(S.view)) render(null,true);
      dlSig=sig;
      const keep = r.active.length>0 || Date.now()<dlWatchUntil || S.view==='downloads';
      if(!keep){ dlRunning=false; return; }
      next = S.view==='downloads' ? 2000 : 3000;
    }catch(e){}
    dlTimer=setTimeout(tick, next);
  };
  dlTimer=setTimeout(tick, 1500);
}

const MOCKEXP = {gog: /[?&]expired/.test(location.search) ? Date.now()-3.6e6 : 0};
async function loadAccounts(fromEvent){
  if(!host && !MOCK) return;
  try{
    const r = await call('accounts.status');
    const first = ACC.list===null;
    ACC.list=r.accounts||[]; ACC.root=r.installRoot||''; ACC.beacon=r.beacon||null;
    ACC.steamLib=((ACC.list.find(a=>a.store==='steam')||{}).library)||'';
    // Reload the library when an account was added/removed or its game list arrived.
    const sig=ACC.list.map(a=>`${a.store}:${a.signedIn?1:0}:${a.fetched}`).join('|');
    const changed = ACC.sig && sig!==ACC.sig; ACC.sig=sig;
    if(changed && host) loadLibrary(true);
    syncExpired(!first);
    if(S.view==='stores' || S.view==='library' || S.view==='downloads') render(null,true);
    else if(S.view==='settings' && S.settingsTab==='profile') render(null,true);
    deskSignCheck();
  }catch(e){ if(!fromEvent) toast(e.message); }
}
// ---------- Expired store sign-ins ----------
// A store refused its saved sign-in (hearth-core's stores::expiry, Ember's SignInExpiry): accounts.status says
// expired. Library › Stores shows "Sign-in expired" with Sign in again; a bell entry stays until it's handled;
// whatever failed because of it (an install, a start, Downloads) offers the same instead of a dead end.
// Games already installed keep showing and still start if they work offline.
const EXPIRED_TOLD = new Set();   // stores whose expiry has been announced (once per expiry)
const accOf = store => (ACC.list||[]).find(a=>a.store===store);
const isExpired = store => !!(accOf(store) && accOf(store).expired);
function storeName(store){ return STORE_INFO[store] ? STORE_INFO[store].name : store; }
// announce: a toast for an expiry that's new since the last look (not at start: the bell has it then).
function syncExpired(announce){
  const list=(ACC.list||[]).filter(a=>a.expired && STORE_INFO[a.store] && a.store!=='steam');
  const before=NOTIFS.length;
  NOTIFS=NOTIFS.filter(n=>!n.expired || list.some(a=>a.store===n.expired));
  for(const s of [...EXPIRED_TOLD]) if(!list.some(a=>a.store===s)) EXPIRED_TOLD.delete(s);
  let added=false;
  for(const a of list){
    if(!NOTIFS.some(n=>n.expired===a.store)){ NOTIFS.unshift({i:'user', t:`Your ${storeName(a.store)} sign-in expired`, s:`Select to sign in again${a.name?' as '+a.name:''}`, expired:a.store}); added=true; }
    if(!EXPIRED_TOLD.has(a.store)){ EXPIRED_TOLD.add(a.store); if(announce && !OVERLAY) expiredToast(a.store); }
  }
  if(added || NOTIFS.length!==before){ updateBadge(); if(S.layers.includes('qam')) renderQam(); }
}
function expiredToast(store){ toast(`Your ${storeName(store)} sign-in expired. Open Notifications or Library › Stores to sign in again.`); }
// The host noticed it just now (hearth-core sends accounts.expired once per expiry).
function onAccExpired(d){
  if(!d || !STORE_INFO[d.store]) return;
  if(!EXPIRED_TOLD.has(d.store)){ EXPIRED_TOLD.add(d.store); expiredToast(d.store); }
  loadAccounts(true);
}
// Sign in again: on the Stores page (Game Mode: through Desktop Mode, as any sign-in from there).
function expSignIn(store){
  closeAll();
  if(S.view!=='stores') navigate('stores');
  if(store==='steam') return accSignIn('steam');
  setTimeout(()=>accSignIn(store), 250);
}
// What failed because of it says so, with Sign in again. why: what didn't work ("Grimforge didn't install.").
function expiredSheet(store, why){
  const a=accOf(store)||{}, n=storeName(store);
  openSheet({title:`Your ${n} sign-in expired`,
    sub:`${why?why+' ':''}${n} needs you to sign in again${a.name?' as '+a.name:''} to install games, sync cloud saves and play online. Games you've installed still start if they work offline.`,
    items:[{label:'Sign in again', icon:'user', run:()=>setTimeout(()=>expSignIn(store),250)}]});
}

function padState(){
  const pads=(navigator.getGamepads?[...navigator.getGamepads()]:[]).filter(p=>p&&p.connected!==false);
  if(pads.length) return {on:true, name:pads[0].id.split('(')[0].replace(/\s+/g,' ').trim()||'Controller'};
  if(PAD.host) return {on:true, name:'Controller'};

}
let padWatch=null, padWas=null;
const BTPAD={state:'', name:''};
function watchPad(on){
  if(!!padWatch===on) return;
  clearInterval(padWatch); padWatch=null; padWas=null;
  // Bluetooth controllers are found and paired automatically while this screen is up: nothing else to press.
  if(host && LINUX) call('bt.autoPads',{on}).catch(()=>{});
  if(!on){ BTPAD.state=''; return; }
  padWatch=setInterval(()=>{
    const waiting = S.view==='pad' || (S.view==='setup' && SETUP_STEPS[S.setupStep||0]==='controller');
    if(!waiting){ watchPad(false); return; }

// Hearth OS on Anatase, or a Beta Experimental edition), how (next to Windows, or a whole drive), which drive and
// how much room, your account, internet, a last look, then the install itself.
const OSI = {step:'how', disks:null, check:null, checking:false, mode:null, disk:null, give:0, target:null,
  user:{full:'', name:'', password:''}, hostname:'', tz:'', s:null, editions:null, edition:'anatase'};
const OSI_STEPS = ['how','drive','account','online','review','run'];

const osiSteps = ()=> (HOSTINFO.installer || (OSI.editions||[]).length>1) ? ['edition', ...OSI_STEPS] : OSI_STEPS;

const OSI_TZ = ['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu',
  'America/Toronto','America/Mexico_City','America/Sao_Paulo','Europe/London','Europe/Dublin','Europe/Paris','Europe/Berlin','Europe/Madrid','Europe/Rome',

function osiOpen(){

function osiLoad(){

  call('osinstall.disks',{},60000).then(r=>{ OSI.disks=r.disks||[]; OSI.image=r.image||''; OSI.offline=!!r.offline;

const osiDisk = ()=> (OSI.disks||[]).find(d=>d.dev===OSI.disk);

function osiSizeStep(dir){

function lockNow(){

}
function lockShow(){
  if(S.locked) return;

  S.locked=true; S.view='lock';
  render('lk-go');
}
async function lockUnlock(){
  const pw=await openPrompt({title:'Password', secret:true}); if(pw==null) return;
  const r=await call('login.unlock',{password:pw}).catch(()=>({ok:false}));
  if(!r.ok){ toast('That password isn\'t right'); return; }
  S.locked=false;
  const f=S.lockFrom||{view:'home'}; S.view=f.view&&f.view!=='lock'?f.view:'home'; S.game=f.game;

}

// ---------- parental controls: PIN, daily play time, allowed games ----------
async function askPin(title){
  const pin=await openPrompt({title:title||'Enter the PIN', secret:true, min:4}); if(pin==null) return false;
  try{ await call('profiles.unlock',{pin}); if(PROF.s) PROF.s.unlocked=true; return true; }catch(e){ toast(e.message); return false; }
}
/** A profiles call that may need the PIN: asks for it once, then tries again. */
async function pinCall(method, args, ms){
  try{ return await call(method, args, ms); }
  catch(e){ if(!/PIN first/.test(e.message)) throw e; if(!(await askPin())) throw new Error('Not changed: that needs the PIN'); return call(method, args, ms); }
}
const fmtMins = m => m>=60 ? `${Math.floor(m/60)} h${m%60?' '+(m%60)+' min':''}` : `${m} min`;
const LIMIT_CHOICES=[0,30,45,60,90,120,180,240];
function limitsSummary(p){ const l=p.limits||{}; const a=[]; if(l.minutesPerDay) a.push(`${fmtMins(l.minutesPerDay)} a day`); if(l.allowed) a.push(`${l.allowed.length} game${l.allowed.length===1?'':'s'}`); return a.length?a.join(' · '):'No limits'; }
async function pinSetup(){
  const s=PROF.s; if(!s) return;
  if(s.hasPin && !s.unlocked && !(await askPin('Current PIN'))) return;
  const items=[{label:s.hasPin?'Change PIN':'Set a PIN', icon:'lock', run:()=>setTimeout(async()=>{
    const a=await openPrompt({title:'New PIN (4 to 8 numbers)', secret:true, min:4}); if(a==null) return;
    const b=await openPrompt({title:'Same PIN again', secret:true, min:4}); if(b==null) return;
    if(a!==b) return toast("Those didn't match. Try again.");
    try{ await pinCall('profiles.setPin',{pin:a}); await loadProfiles(); toast('PIN set. Now set limits on a profile.'); }catch(e){ toast(e.message); } },250)}];
  if(s.hasPin) items.push({label:'Remove PIN and all limits', icon:'trash', run:()=>pinCall('profiles.setPin',{pin:''}).then(loadProfiles).then(()=>toast('PIN and limits removed')).catch(e=>toast(e.message))});
  openSheet({title:'Parental controls', sub:'The PIN keeps limits, profiles and switching away from a limited profile for grown-ups.', items});
}

  if(!s.hasPin) return openSheet({title:'Set a PIN first', sub:'So only you can change the limits.', items:[{label:'Set a PIN', icon:'lock', run:()=>setTimeout(pinSetup,250)}]});
  if(!s.unlocked && !(await askPin())) return;

async function accSignIn(store){
  const info=STORE_INFO[store];
  if(!host){
    // Preview (?expired): signing in again clears the mock's expired sign-in.
    if(MOCKEXP[store]){ MOCKEXP[store]=0; toast(`Signed in to ${info.name} (preview)`); return loadAccounts(true); }
    return toast(`Signing in needs the ${APP} app (not the browser preview).`);
  }
  if(store==='steam') return steamSignIn();
  if(signInViaDesktop()) return accSignInFromGame(store);
  if(store==='steam'){
    try{ await call('accounts.signIn',{store}); toast('Steam is open. Sign in or switch accounts there, then come back to '+APP+'.'); }catch(e){ toast(e.message); }
    return;
  }
  ACC.signing=store; render(null,true);
  toast(`Sign in to ${info.name} in the window that opened.`);
  try{
    const r=await call('accounts.signIn',{store},60*60e3);
    if(r && r.ok) toast(`Signed in to ${info.name}. Getting your games…`);
  }catch(e){ toast(e.message); }
  finally{ ACC.signing=null; loadAccounts(); }
}
// ---------- Store sign-ins from Game Mode happen in Desktop Mode ----------
// gamescope shows one window at a time and has no real keyboard focus, so store sign-in pages (and Steam's own
// window) misbehave there. From Game Mode, Hearth goes to Desktop Mode; the desktop opens Hearth in a window and
// starts the sign-in (desktop/shell/hearth-signin, hearth-core's signin_handoff), then offers the way back.
// Signing out needs no window, so it stays here.
const DESKSIGN = {store:null, base:null, offered:false, timer:null};
function signInViaDesktop(){ return LINUX && !!host && !!HOSTINFO.gameMode; }
function accSignInFromGame(store){
  const info=STORE_INFO[store]; if(!info) return;
  openSheet({title:`Sign in to ${info.name}`, sub:'Sign-in opens in Desktop Mode, where the keyboard and mouse work normally. '+APP+' brings you back afterwards.',
    items:[{label:'Go to Desktop Mode', icon:'desk', run:()=>{

      if(S.view==='setup'){ try{ localStorage.setItem('hearth.setupStep', String(SETUP_STEPS.indexOf('accounts'))); }catch(e){} }
      call('accounts.signInDesktop',{store},10000).then(()=>{ toast(`Opening Desktop Mode… ${info.name} sign-in opens there in a moment`); setTimeout(()=>power('desktop',true),800); }).catch(e=>toast(e.message));
    }}]});
}
function setupResumeStep(){
  let n=0; try{ n=parseInt(localStorage.getItem('hearth.setupStep')||'0',10)||0; localStorage.removeItem('hearth.setupStep'); }catch(e){}
  return n>0 && n<SETUP_STEPS.length ? n : 0;
}
// "signedIn:name" for a store, to tell when the sign-in has happened (or Steam switched accounts).
function deskSignState(store){ const a=(ACC.list||[]).find(x=>x.store===store); return a ? `${a.signedIn?1:0}:${a.expired?1:0}:${a.name||''}` : ''; }
// In a windowed Hearth (Desktop Mode): the sign-in Game Mode asked for.
async function deskSignBegin(store){
  if(!STORE_INFO[store] || !host) return;
  clearInterval(DESKSIGN.timer);
  Object.assign(DESKSIGN, {store, base:null, offered:false, timer:null});
  if(S.layers.length) closeAll();
  S.history=[];
  if(S.view!=='stores') navigate('stores',{},false); else render(null,true);
  await loadAccounts(true);
  DESKSIGN.base=deskSignState(store);
  render(null,true);
  // Steam signs in in its own window and tells nobody: look at its account every few seconds.
  // (For up to 20 minutes: a sign-in that never happened kept asking, and redrawing the page, every 4 seconds for good.)
  const until=Date.now()+20*60e3;
  if(store==='steam') DESKSIGN.timer=setInterval(()=>{ if(DESKSIGN.store!=='steam'||DESKSIGN.offered||Date.now()>until){ clearInterval(DESKSIGN.timer); return; } loadAccounts(true); }, 4000);
  accSignIn(store);
}
// After each account change: once that store is signed in (or on another account), offer Game Mode.
function deskSignCheck(){
  const st=DESKSIGN.store; if(!st || DESKSIGN.offered || DESKSIGN.base===null) return;
  const a=(ACC.list||[]).find(x=>x.store===st); if(!a || !a.signedIn || a.expired || deskSignState(st)===DESKSIGN.base) return;
  DESKSIGN.offered=true; clearInterval(DESKSIGN.timer);
  const info=STORE_INFO[st];
  openSheet({title:`Signed in to ${info.name}. Back to Game Mode?`, sub:`Your games from ${info.name} show in the library there.`, noCancel:true,

async function loadLibrary(rescan, announce){

function onSysEvent(name, data){
  if(name==='status') return applyStatus(data);

  if(name==='systemUpdate') return onSystemUpdate(data);
  if(name==='xodus') return onXodus(data);
  if(name==='import') return onImport(data);
  if(name==='osInstall') return onOsInstall(data);
  if(name==='lock') return lockNow();
  if(name==='profiles.changed') return loadProfiles();
  if(name==='bt.pad'){ BTPAD.state=data.state; BTPAD.name=data.name||'the controller'; if(data.state==='paired') toast(`${BTPAD.name} connected`); if(S.view==='pad'||S.view==='setup') render(null,true); return; }
  if(name==='parental.timeup'){ toast("Play time's up for today"); return; }
  if(name==='profiles.switching'){ PROF.switching=data.name; if(S.view!=='profiles') navigate('profiles',{},false); else render(null,true); return; }
  if(name==='newOs'){ const was=NEWOS.s; NEWOS.s=Object.assign({},was||{},data); if(was&&was.state==='moving'&&data.state!=='moving') toast(data.error?data.error:'The new Hearth OS is ready. Restart to start it.'); if(S.view==='settings'&&S.settingsTab==='updates') render(null,true); return; }
  if(name==='switch'){ if(SW.s) SW.s.job=data.job; if(data.job && data.job.state==='done') loadSwitch(); if(data.job && data.job.state==='error') toast(data.job.error||'That step didn\'t work'); if(S.view==='settings'&&S.settingsTab==='switch') render(null,true); return; }
  if(name==='watchdog'){ const d=data||{}; if(d.code){ LOGS.r={code:d.code, url:'https://hearth-counter.game305-cl.workers.dev/v1/logs/'+d.code}; NOTIFS.unshift({i:'refresh', t:APP+' got stuck and sent a report', s:'Code '+d.code}); updateBadge(); toast(APP+' got stuck. Report sent: '+d.code); } else toast(APP+' got stuck. It\'s freeing itself.'); return; }
  if(name==='library.changed'){ if(!OVERLAY) loadLibrary(false); return; }
  if(name==='desktopFailed') return openSheet({title:"Mantel (Desktop Mode) couldn't start", sub:data.text, items:[{label:'OK', icon:'check', run:()=>{}}]});
  if(name==='open'){ if(data&&data.view&&S.view!==data.view) navigate(data.view); return; }
  if(name==='game.started') return gameStarted(data.id);
  if(name==='game.ready') return gameReady(data.id);
  if(name==='game.slow') return gameSlow(data);
  if(name==='update') return OVERLAY ? null : onUpdate(data);
  if(name==='pad'){
    if(deskActive()) return deskPadEvent(data);         // the Linux desktop's view takes the controller
    if(data.down===false) return;                        // raw mode (the desktop under a prompt): presses only
    return hostPad(data.b);
  }
  if(name==='padAxes'){ if(DESK.open) deskAxes(data); return; }
  if(name==='padMouse'){ PAD.mouseOn=!!data.on; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='padHost'){ PAD.host = data.connected>0; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='game.exited') return gameEnded(data);
  if(name==='friends'){ if(S.view==='friends' && !S.layers.length) loadFriends(); return; }
  if(name.startsWith('coop.')) return coopEvent(name, data||{});
  if(name.startsWith('seats.')) return seatsEvent(name, data||{});
  if(name.startsWith('space.')) return spaceEvent(name, data||{});
  if(name.startsWith('beacon.')) return beaconEvent(name, data||{});
  if(name==='quickResume'){ applyQuick(data); if(!OVERLAY && !S.layers.length) render(null,true); else { renderFooter(); if(S.layers.includes('qam')) renderQam(); } return; }
  if(name==='game.paused'){ S.paused=!!data.paused; if(S.layers.includes('qam')) renderQam(); return; }
  if(name==='accounts.changed') return OVERLAY ? null : loadAccounts(true);
  if(name==='steam.signedIn'){ if(OVERLAY) return; toast(`Signed in to Steam${data&&data.name?' as '+data.name:''}. Getting your games…`); loadAccounts(true); return loadLibrary(true); }
  if(name==='steam.window'){ if(OVERLAY) return; if(data&&data.text) toast(data.text); return; }
  if(name==='accounts.expired') return OVERLAY ? null : onAccExpired(data);
  if(name==='signinStart') return OVERLAY ? null : deskSignBegin(data&&data.store);
  if(name==='play') return OVERLAY ? null : playFromDesktop(data&&data.id);
  if(name==='osd') return showOsd(data);
  if(name==='library.art'){ if(!LIB.loading && !OVERLAY) loadLibrary(false); return; }
  if(name==='net'){ S.online=!!data.online; toast(data.online?'Back online':"You're offline. Installed games and your library still work."); return; }
  if(name==='claude'){
    const was=CLAUDE.s; CLAUDE.s=Object.assign({}, was||{}, data);
    if(data && data.state==='idle'){
      if(data.error){ CLAUDE.openAfter=false; toast(data.error); }
      loadClaude();
      if(CLAUDE.openAfter && !data.error){ CLAUDE.openAfter=false; toast('Claude is installed. Opening it…'); call('claude.act',{action:'open'}).catch(()=>{}); }
    }
    if(S.view==='settings' && S.settingsTab==='system') render(null,true);
    return;
  }
  if(name==='browser'){ BROWSER.s=data; if(S.view==='settings' && S.settingsTab==='system') render(null,true); if(data && data.error && data.state==='idle') toast(data.error); return; }
  if(name==='overlay.unavailable'){ if(!OVERLAY && S.layers.at(-1)==='launch'){ send({type:'log', text:'overlay: none to show Quick Access in over the starting screen; using this window\'s'}); openLayer('qam'); } return; }
  if(name==='power.menu'){ if(OVERLAY && OV.busy){ OV.wantPower=true; return; } if(S.layers.at(-1)!=='power'){ if(!OVERLAY) closeAll(); openLayer('power'); } return; }
  if(name==='overlay.shown') return overlayShown();
  if(name==='overlay.hidden') return overlayHidden();
  if(name==='install.done'){
    const t=data.title||'The game';
    // Failed because the store's sign-in expired: say so, with Sign in again (not a dead-end error).
    const xs = data.error && data.error!=='cancelled' ? (data.expired || (()=>{ const s=String(data.id||'').split(':')[0]; return STORE_INFO[s] && (isExpired(s) || /sign-in expired/i.test(data.error)) ? s : null; })()) : null;
    if(data.error==='cancelled') toast(`Cancelled the download of ${t}`);
    else if(xs && !OVERLAY){ toast(`${t} didn't install: your ${storeName(xs)} sign-in expired`); loadAccounts(true); if(!S.layers.length && !S.running) expiredSheet(xs, `${t} didn't install.`); }
    else if(data.error) toast(`${t} didn't install: ${data.error}`);
    else { if(data.id){ const k=DL_DONE.indexOf(data.id); if(k>=0) DL_DONE.splice(k,1); DL_DONE.unshift(data.id); DL_DONE.length=Math.min(DL_DONE.length,6); }
      toast(`${t} is installed and ready to play`); NOTIFS.unshift({i:'dl', t:`${t} is ready to play`, s:'Installed by '+APP+''}); updateBadge(); }
    return OVERLAY ? null : loadLibrary(true);
  }
  if(name==='game.timeout'){ hideLaunch(); const g=G(data.id); return toast(`${APP} couldn't see ${g?g.title:'the game'} start. If it's running, it still works; it just won't show here.`); }
  if(name==='bt.found'){
    const known = S.sys.found.some(d=>d.id===data.id) || (S.sys.paired||[]).some(d=>d.id===data.id);
    if(!known && data.name){ S.sys.found.push(data); refreshUI(); }
    return;
  }
  if(name==='bt.scanDone'){ S.sys.btScanning=false; S.sys.foundDone=true; return refreshUI(); }
  if(name==='bt.pin'){
    if(data.confirm) return openSheet({title:'Confirm pairing', sub:`Make sure the device shows ${data.pin}`,
      items:[{label:'It matches, pair',icon:'check',run:()=>call('bt.confirmPin',{accept:true}).catch(()=>{})},
             {label:"It doesn't match",icon:'x',run:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})}],
      noCancel:true, onCancel:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})});
    return openSheet({title:'Enter this PIN on the device', sub:`${data.pin}, then press Enter on the device`, items:[{label:'OK',icon:'check'}], noCancel:true});
  }
}
function applyStatus(st){
  if(!st) return;
  if(st.wifi) S.sys.wifi={...S.sys.wifi,...st.wifi};
  if(st.bt) S.sys.bt={...S.sys.bt,...st.bt};
  if('airplane' in st) S.sys.airplane=!!st.airplane;
  if(st.battery) S.sys.battery=st.battery;
  if(st.audio) Object.assign(S.sys.audio, st.audio);
  if(st.display) Object.assign(S.sys.display, st.display);
  if(st.powerMode) S.sys.powerMode=st.powerMode;
  if(S.sys.nets) S.sys.nets.forEach(n=>n.connected = n.ssid===S.sys.wifi.ssid);
  // A slider you're changing (or changed a moment ago) keeps its value: the status can be older than it.
  const busy=k=>(SLIDE&&SLIDE.dataset.slider===k) || performance.now()-(SLIDE_AT[k]||0)<2500;
  if(!busy('vol')) S.set.vol=S.sys.audio.volume;
  if(!busy('bright')) S.set.bright=S.sys.display.brightness;
  refreshUI();
}

async function toggleRadio(kind){

// ---- Wi-Fi ----
async function wifiScan(force){
  if(S.sys.scanning || !S.sys.wifi.on) return;
  if(!force && S.sys.nets && Date.now()-S.sys.scannedAt < 20000) return;
  S.sys.scanning=true; refreshUI();
  try{ S.sys.nets = await call('wifi.scan',{},60000); S.sys.scannedAt=Date.now(); }
  catch(e){ toast(e.message); if(!S.sys.nets) S.sys.nets=[]; }
  finally{ S.sys.scanning=false; refreshUI(); }
}
function askPassword(n){
  openPrompt({title:`Password for ${n.ssid}`, secret:true, min:8}).then(pw=>{ if(pw!=null) wifiConnect(n,pw); });
}
function wifiNet(ssid){
  const n=(S.sys.nets||[]).find(x=>x.ssid===ssid);
  if(!n || S.sys.connecting) return;
  if(n.connected) return openSheet({title:ssid, sub:'Connected', items:[
    {label:'Disconnect',icon:'x',run:wifiDisconnect},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(n.saved) return openSheet({title:ssid, sub:'Saved network', items:[
    {label:'Connect',icon:'wifi',run:()=>wifiConnect(n)},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(!n.secure) return wifiConnect(n);
  askPassword(n);
}
async function wifiConnect(n,pw){
  S.sys.connecting=n.ssid; refreshUI();
  let retry=false;
  try{
    const r=await call('wifi.connect',{ssid:n.ssid, password:pw==null?null:pw}, 60000);
    if(r && r.ok) toast(`Connected to ${n.ssid}`);
    else { const err=(r&&r.error)||"Couldn't connect"; toast(err); retry = n.secure && /password|credential/i.test(err); }
  }catch(e){ toast(e.message); }
  finally{ S.sys.connecting=null; await refreshStatus(); refreshUI(); }
  if(retry) askPassword(n); else wifiScan(true);
}
async function wifiDisconnect(){
  try{ await call('wifi.disconnect'); toast('Disconnected'); }catch(e){ toast(e.message); }
  await refreshStatus(); wifiScan(true);
}
async function wifiForget(ssid){
  try{ await call('wifi.forget',{ssid}); toast(`Forgot ${ssid}`); }catch(e){ toast(e.message); }

// Gamepad (standard mapping) with key-repeat on d-pad / stick
const REPEAT = new Set(['up','down','left','right']);
const held={};
let padSeen=false;
function pollPads(t){
  try{ pollPadsNow(t); } catch(e){ try{ send({type:'log', text:'controller: '+(e&&e.stack||e)}); }catch(_){} }
  requestAnimationFrame(pollPads);
}
function pollPadsNow(t){
  // The host reads Xbox-style controllers itself; don't also read them here (that would double every press).
  const pads = PAD.host || ACC.signing ? [] : (navigator.getGamepads ? navigator.getGamepads() : []);
  if(deskActive()) return deskPollPads(pads);
  const st={};
  for(const p of pads){ if(!p) continue;
    const b=i=>!!(p.buttons[i] && p.buttons[i].pressed), ax=i=>p.axes[i]||0;
    st.a=st.a||b(0); st.b=st.b||b(1); st.x=st.x||b(2); st.y=st.y||b(3);
    st.lb=st.lb||b(4); st.rb=st.rb||b(5); st.select=st.select||b(8); st.start=st.start||b(9); st.guide=st.guide||b(16);
    const th=k=>held[k]?.35:.55;
    st.up=st.up||b(12)||ax(1)<-th('up'); st.down=st.down||b(13)||ax(1)>th('down');
    st.left=st.left||b(14)||ax(0)<-th('left'); st.right=st.right||b(15)||ax(0)>th('right');
    if(p.mapping==='standard'){ st.rup=st.rup||ax(3)<-.6; st.rdown=st.rdown||ax(3)>.6; }   // right stick (Library A–Z jump)
  }
  for(const k of ['a','b','x','y','lb','rb','select','start','guide','up','down','left','right','rup','rdown']){
    const on=!!st[k], h=held[k];
    if(on && !h){ held[k]={t0:t,last:t}; padPressed(mapPad(k)); }
    else if(on && h && REPEAT.has(k) && t-h.t0>400 && t-h.last>110){ h.last=t; PAD_AT[k]=performance.now(); input(k); }
    else if(!on && h) delete held[k];
  }
}
// The Linux desktop's view with a controller the page reads itself (no host controller): presses, releases, sticks.
function deskPollPads(pads){
  const st={}, ax={lx:0,ly:0,rx:0,ry:0,lt:0,rt:0}; let any=false;
  for(const p of pads){ if(!p) continue; any=true;
    const b=i=>!!(p.buttons[i] && p.buttons[i].pressed), v=i=>p.axes[i]||0;
    st.a=st.a||b(0); st.b=st.b||b(1); st.x=st.x||b(2); st.y=st.y||b(3); st.lb=st.lb||b(4); st.rb=st.rb||b(5);
    st.select=st.select||b(8); st.start=st.start||b(9); st.guide=st.guide||b(16);
    st.up=st.up||b(12); st.down=st.down||b(13); st.left=st.left||b(14); st.right=st.right||b(15);
    for(const [k,i] of [['lx',0],['ly',1],['rx',2],['ry',3]]) if(Math.abs(v(i))>Math.abs(ax[k])) ax[k]=v(i);
    ax.lt=Math.max(ax.lt, p.buttons[6]?p.buttons[6].value||0:0); ax.rt=Math.max(ax.rt, p.buttons[7]?p.buttons[7].value||0:0);
  }
  if(!any) return;
  deskAxes(ax);
  for(const k of ['a','b','x','y','lb','rb','select','start','guide','up','down','left','right']){
    const on=!!st[k]; if(on!==!!DESK.poll[k]){ DESK.poll[k]=on; deskButton(mapPad(k), on); }
  }
}

const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'a',' ':'a',Escape:'b',Backspace:'b',
  m:'start',M:'start',q:'select',Q:'select','[':'lb',']':'rb',PageUp:'rup',PageDown:'rdown','/':'y',f:'x',F:'x',
  w:'up',W:'up',a:'left',A:'left',s:'down',S:'down',d:'right',D:'right'};
// Shortcuts that aren't controller buttons
const KEY_EXTRA = {Home:()=>{ closeAll(); if(S.view!=='home'){ S.history=[]; navigate('home',{},false); } },
  F1:()=>{ S.settingsTab='controller'; S.view==='settings' ? (render('st-controller'), onSettingsTab('controller')) : navigate('settings',{focusKey:'st-controller'}); }};
// Steam (running in the background) can turn controller buttons into keys for the window in front: the d-pad
// into arrow keys, A into Enter. With the controller also read here, every press counted twice, and the
// selection jumped two places. Navigation keys that arrive while a controller button is held are dropped.
const NAV_KEYS=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace','Tab','w','a','s','d']);
function padHeldNow(){
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  return pads.some(p => p.buttons.some(b => b && b.pressed) || (p.mapping==='standard' && p.axes.slice(0,4).some(a => Math.abs(a) > .5)));

document.addEventListener('keydown', e=>{
  if(deskActive()){ if(DESK.rfb && document.activeElement && document.activeElement.tagName!=='CANVAS') try{ DESK.rfb.focus({preventScroll:true}); }catch(_){} return; }
  if(NAV_KEYS.has(e.key) && !e.ctrlKey && !e.altKey && padHeldNow()){ logInput('key '+e.key+' dropped (controller held)'); e.preventDefault(); e.stopImmediatePropagation(); return; }
  if(INPUT_LOG && NAV_KEYS.has(e.key)) logInput('key '+e.key);
  // Debug: Ctrl+Shift+D writes the focused/open game's art and image load state to bridge.log
  if(e.ctrlKey && e.shiftKey && (e.key==='D'||e.key==='d')){
    const id = S.view==='game' ? S.game : focused?.dataset.id; const g=id&&G(id);
    const imgs=[...document.querySelectorAll('img.img')].filter(i=>!g || (i.closest('[data-id]')?.dataset.id===id) || S.view==='game')
      .slice(0,8).map(i=>`${i.complete?(i.naturalWidth?'ok':'broken'):'loading'} ${i.naturalWidth}x${i.naturalHeight} ${i.currentSrc||i.src}`);
    send({type:'log', text:'debug '+JSON.stringify({id, art:g&&g.art, imgs})});
    toast('Debug info written to bridge.log'); e.preventDefault(); return;
  }
  if(S.layers.at(-1)==='prompt' && prompt){
    if(e.key==='Enter'){ e.preventDefault(); return promptSubmit(); }
    if(e.key==='Escape'){ e.preventDefault(); return back(); }
    if(e.key==='Backspace'){ e.preventDefault(); return promptKey('bksp'); }
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); return promptKey(e.key==='ArrowLeft'?'left':'right'); }
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); kbEdit(prompt, e.key); return renderPrompt(focused?.dataset.k); }
  }
  if(S.layers.at(-1)==='search'){
    // Any character a keyboard types (titles have ' : & . , and accents too, which couldn't be typed here).
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey){ e.preventDefault(); return typeKey(e.key===' '?'space':e.key); }
    if(e.key==='Backspace'){ e.preventDefault(); if(query) return typeKey('bksp'); return back(); }
  }
  if(e.key==='Tab'){ e.preventDefault(); setInput('kbd'); return input(e.shiftKey?'lb':'rb'); }
  if(KEY_EXTRA[e.key] && !e.ctrlKey && !e.altKey){ e.preventDefault(); setInput('kbd'); return KEY_EXTRA[e.key](); }
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const k=KEYMAP[e.key]; if(!k) return;

  // is up): the same move from the keyboard within 250 ms of the controller's is that echo, not a second press.
  if(performance.now()-(PAD_AT[k]||0) < 250 && !e.ctrlKey && !e.altKey){ logInput('key '+e.key+' dropped (echo of the controller)'); return; }
  setInput('kbd'); input(k);
});
document.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse'||e.pointerType==='pen') setInput('mouse'); else if(e.pointerType==='touch') setInput('mouse'); });
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act],[data-f]'); if(!el) return;
  if(el.dataset.f!==undefined) setFocus(el,true);
  if(el.dataset.slider){ const s=el.querySelector('.slider'), r=s.getBoundingClientRect();
    if(e.clientX>=r.left-8 && e.clientX<=r.right+8){ const min=+el.dataset.min,max=+el.dataset.max,st=+el.dataset.step;
      const v=min+Math.round(((e.clientX-r.left)/r.width)*(max-min)/st)*st; S.set[el.dataset.slider]=Math.max(min,Math.min(max,v)); adjustSlider(el,0);} return; }
  act(el);
});
let lastPtr=null;
document.addEventListener('pointermove', e=>{
  if(e.pointerType!=='mouse') return;
  // Only a real movement of the pointer selects what's under it. Not: tiny jitters (a touchscreen, Handheld Daemon's
  // virtual mouse), the page scrolling under a pointer that's standing still (same spot, new thing under it), or the
  // moments right after the controller or keyboard moved the selection: each of those made the selection jump back
  // and forth between where the controller put it and the pointer.
  const first=!lastPtr, moved=first?0:Math.hypot(e.clientX-lastPtr[0], e.clientY-lastPtr[1]);
  if(first || moved>6) lastPtr=[e.clientX,e.clientY];
  if(first || moved<=6) return;
  if(performance.now()-NAV_AT < 800) return;
  setInput('mouse');
  const el=e.target.closest('[data-f]');
  if(el && el!==focused && root().contains(el)) { if(focused) focused.classList.remove('focus'); focused=el; el.classList.add('focus'); renderFooter(); }
});
document.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- status bar ----------
function clockText(d){ return d.toLocaleTimeString([], LOOK.clock24?{hour:'2-digit',minute:'2-digit',hour12:false}:{hour:'numeric',minute:'2-digit'}); }
// The top bar's clock, and the big ones (the lock screen, Home's Focus layout), which kept the time they were drawn
// at: after waking, the lock screen said when it went to sleep.
function tick(){ const d=new Date(), set=(sel,t)=>{ const e=$(sel); if(e && e.textContent!==t) e.textContent=t; };
  set('#clock', clockText(d));
  set('#view .lk-time', clockText(d)); set('#view .lk-day', longDate(d));
  set('#view .xf-clock', xFocusTime(d)); set('#view .xf-date', longDate(d)); }
tick(); setInterval(tick, 10e3);

// ---------- boot ----------
if(host){ NOTIFS=[]; GAMES.length=0; }
updateBadge();
render();
applyLook();
loadHostInfo();
// Game Mode came back with a new display mode on trial (Settings › Display): keep it, or it switches back by itself
// after 20 seconds (Hearth does that even if this screen can't be seen).
function checkDisplayTrial(){
  if(!host) return;
  call('display.get').then(d=>{
    if(!d || !d.pending) return;
    Object.assign(S.sys.display,d);
    let left=18;
    const sub=()=>`${d.width} × ${d.height} at ${d.refreshRate} Hz. Switching back in ${left} seconds…`;
    openSheet({title:'Keep these display settings?', sub:sub(), noCancel:true,
      items:[{label:'Keep changes',icon:'check',run:()=>{ clearInterval(dispRevert); dispRevert=null; call('display.keep').catch(()=>{}); toast('Display settings saved'); }},
             {label:'Switch back',icon:'restart',run:()=>{ clearInterval(dispRevert); dispRevert=null; toast('Switching back…'); call('display.revert').catch(e=>toast(e.message)); }}]});
    clearInterval(dispRevert);
    dispRevert=setInterval(()=>{ left--;
      if(left<=0){ clearInterval(dispRevert); dispRevert=null; if(S.layers.at(-1)==='sheet' && sheet && sheet.title.startsWith('Keep these')){ sheet.picked=true; closeLayer(); } toast('Switching back…'); return; }
      if(sheet && sheet.title.startsWith('Keep these')){ sheet.sub=sub(); const el=$('#sheetBox .muted'); if(el) el.textContent=sheet.sub; } },1000);
  }).catch(()=>{});
}
setTimeout(checkDisplayTrial, 1500);
refreshStatus();
if(OVERLAY){ document.body.classList.add('overlay','ov-closed'); NOTIFS=[]; }
if(/[?&]overlay=full/.test(location.search)){ document.documentElement.classList.add('ovfull'); document.body.classList.add('ovfull'); }
applyProfile();
loadProfile();
loadLibrary();
if(!OVERLAY){ loadAccounts(true); loadUpdateStatus(); }
else { S.qtab='quick'; openLayer('qam'); }
requestAnimationFrame(pollPads);
send({type:'ready'});
</script>
