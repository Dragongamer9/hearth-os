  if(keepK){ const el=$(`#prompt [data-k="${keepK}"]`); if(el) setFocus(el,true); }
}
function promptKey(c){
  const p=prompt; if(!p) return;
  if(c==='done') return promptSubmit();
  if(c==='bksp') p.text=p.text.slice(0,-1);
  else if(c==='shift') p.shift=!p.shift;
  else if(c==='sym') p.sym=!p.sym;
  else if(c==='show') p.show=!p.show;
  else { p.text+=c; p.shift=false; }
  renderPrompt(focused?.dataset.k);
}
function promptSubmit(){
  const p=prompt; if(!p) return;
  if(p.min && p.text.length<p.min) return toast(`Enter at least ${p.min} characters`);
  p.done=true; closeLayer(); p.res(p.text);
}

const LAYER_RENDER = {menu:renderMenu, qam:()=>{ renderQam(); refreshStatus(); if(S.qtab==='perf') startPerf(); if(S.qtab==='apps') loadApps(); }, power:renderPower, search:()=>renderSearch(), sheet:renderSheet, prompt:()=>renderPrompt()};
const LAYER_CLOSE = {
  sheet:()=>{ if(sheet && !sheet.picked && sheet.onCancel) sheet.onCancel(); sheet=null; },
  prompt:()=>{ if(prompt && !prompt.done) prompt.res(null); prompt=null; },
};
const focusStack=[];
function openLayer(id, focusKey){
  if(S.locked && id!=='prompt' && id!=='toast') return;
  if(S.layers.includes(id)) return;
  LAYER_RENDER[id]?.();
  focusStack.push({el:focused, k:focused?.dataset.k});
  S.layers.push(id);
  $('#'+id).classList.add('open');
  syncScrim();
  const el = (focusKey && $(`#${id} [data-k="${focusKey}"]`)) || $(`#${id} .cur`) || $(`#${id} .on[data-f]`) || $(`#${id} [data-f]`);
  setFocus(el, true);
  renderFooter(); blip(520,.05);
}
function closeLayer(){
  const id=S.layers.pop(); if(!id) return;
  $('#'+id).classList.remove('open');
  syncScrim();
  LAYER_CLOSE[id]?.();
  // Restore focus; if the element was re-rendered meanwhile, find its replacement by key.
  const prev=focusStack.pop(), r=root();
  const el = (prev?.el && document.contains(prev.el) && r.contains(prev.el)) ? prev.el
           : (prev?.k && r.querySelector(`[data-k="${prev.k}"]`)) || (S.layers.length ? r.querySelector('[data-f]') : $('#view [data-f]'));
  setFocus(el, true);
  renderFooter(); blip(420,.05);
  if(OVERLAY && !S.layers.length) setTimeout(overlayEmptyCheck, 50);
}
function closeAll(){ while(S.layers.length) closeLayer(); }
// The overlay with nothing open in it is just an invisible window holding the controller: close it.
function overlayEmptyCheck(){ if(OVERLAY && OV.shown && !S.layers.length) overlayClose(); }
// While the overlay is open, tell Hearth every second that this page is alive (it reloads a frozen one).
if(OVERLAY) setInterval(()=>{ if(OV.shown) send({type:'overlay', action:'alive'}); }, 1000);
function toggleLayer(id){ if(S.layers.at(-1)===id){ closeLayer(); resumeIfGame(id); } else { closeAll(); openLayer(id); } }
// Leaving Quick Access with a game running goes back to the game (the Linux host hides Nimbus; Windows ignores it).
function resumeIfGame(closed){ if(LINUX && host && closed==='qam' && S.running && !S.layers.length) send({type:'resume'}); }
function syncScrim(){
  const top=S.layers.at(-1);
  $('#scrim').classList.toggle('open', !!top && top!=='launch');
  $('#app').classList.toggle('dim', !!top && top!=='launch');
}

// =====================================================================
// Focus & spatial navigation
// =====================================================================
let focused=null;
function root(){ const top=S.layers.at(-1); return top ? $('#'+top) : $('#app'); }
function focusables(){ return [...root().querySelectorAll('[data-f]')].filter(el=>el.getClientRects().length); }
// Scrolling to the focused item. While presses come quickly (a held direction, fast tapping) it jumps instead
// of gliding: a smooth scroll still moving under the next press made the next pick wrong (it bounced between
// two items), and the glide fell behind on a handheld.
let lastNav=0;
const scrollOpts = (el, smooth) => { const shelf = el.closest('.shelf,.news,.tabs,.sres');
  return {block: shelf?'nearest':'center', inline: shelf?'center':'nearest', behavior: smooth?'smooth':'auto'}; };
/** Ends a smooth scroll still under way (jumps to where it was going), so positions are final. */
function settleScroll(){ if(focused && document.contains(focused)) focused.scrollIntoView(scrollOpts(focused, false)); }
function setFocus(el, quiet){
  if(!el) return;
  if(SLIDE && el!==SLIDE) slideDone();
  if(focused) focused.classList.remove('focus');
  focused=el; el.classList.add('focus');
  el.focus({preventScroll:true});
  const now=performance.now(), rapid = now-lastNav < 260;
  lastNav=now;
  el.scrollIntoView(scrollOpts(el, !quiet && !rapid && !LOOK.reduceMotion));
  if(S.view==='home' && el.dataset.spot && !S.layers.length) updateSpot(el.dataset.spot);
  if(S.view==='home' && el.dataset.id && !S.layers.length){
    const h=$('#heroArt'), hi=$('#heroImg'), g=G(el.dataset.id);
    if(h&&g&&h.dataset.id!==g.id){ h.dataset.id=g.id; h.setAttribute('style', artBg(g)); if(hi) hi.innerHTML=heroImg(g); }
  }
  renderFooter();
}
// Big grids (the library): the next tile is worked out from its place in the grid, instead of measuring every
// tile on the page (hundreds of them made each press slow in WebKit). Leaving the grid uses the normal search.
function gridMove(dir){
  const grid=focused.parentElement;
  if(!grid || !grid.classList.contains('grid')) return null;
  const items=grid.children, n=items.length, i=Array.prototype.indexOf.call(items, focused);
  if(i<0 || n<24) return null;
  const cols=Math.max(1, getComputedStyle(grid).gridTemplateColumns.split(' ').length);
  const j = dir==='left' ? (i%cols ? i-1 : -1) : dir==='right' ? ((i%cols)<cols-1 && i+1<n ? i+1 : -1) : dir==='up' ? i-cols : i+cols;
  if(dir==='down' && j>=n){ const last=n-1; return Math.floor(last/cols)>Math.floor(i/cols) ? items[last] : null; }
  return j>=0 && j<n ? items[j] : null;
}
function move(dir){
  if(!focused || !document.contains(focused) || !root().contains(focused)) return setFocus(focusables()[0]);
  // Sliders change only after A picks them (so moving past one doesn't change the volume); up/down leave them.
  if(SLIDE && SLIDE===focused){ if(dir==='left'||dir==='right') return adjustSlider(focused, dir==='left'?-1:1); slideDone(); }
  const t0=performance.now();
  try { moveNow(dir); } finally { perfLog('move '+dir, t0); }
}
function moveNow(dir){
  const g=gridMove(dir);
  if(g && g.hasAttribute('data-f')){ setFocus(g); blip(); return; }
  settleScroll();
  // The focused card is drawn a little bigger (scaled from its centre): measure its real box.
  const rr=focused.getBoundingClientRect(), fw=focused.offsetWidth||rr.width, fh=focused.offsetHeight||rr.height;
  const cx=rr.left+rr.width/2, cy=rr.top+rr.height/2;
  const r={left:cx-fw/2, right:cx+fw/2, top:cy-fh/2, bottom:cy+fh/2, width:fw, height:fh};
  let best=null, bs=Infinity;
  for(const el of focusables()){
    if(el===focused) continue;
    const b=el.getBoundingClientRect(), x=b.left+b.width/2, y=b.top+b.height/2, dx=x-cx, dy=y-cy;
    let main, cross;
    if(dir==='left'||dir==='right'){
      if(dir==='left' ? dx>-4 : dx<4) continue;
      main=Math.abs(dx); cross=(b.top<r.bottom && b.bottom>r.top) ? 0 : Math.abs(dy);
    } else {
      if(dir==='up' ? dy>-4 : dy<4) continue;
      main=Math.abs(dy); cross=(b.left<r.right && b.right>r.left) ? Math.abs(dx)*.25 : Math.abs(dx);
    }
    const s=main+cross*3;
    if(s<bs){ bs=s; best=el; }
  }
  if(best){ setFocus(best); blip(); }
}
let SLIDE=null;
function slideDone(){ if(SLIDE) SLIDE.classList.remove('editing'); SLIDE=null; renderFooter(); }
function slidePick(el){ if(SLIDE===el) return slideDone(); slideDone(); SLIDE=el; el.classList.add('editing'); blip(620,.04); renderFooter(); }
function adjustSlider(el, d){
  const k=el.dataset.slider, min=+el.dataset.min, max=+el.dataset.max, st=+el.dataset.step;
  S.set[k]=Math.max(min,Math.min(max,S.set[k]+d*st));
  const pct=(S.set[k]-min)/(max-min)*100;
  el.querySelector('.slider i').style.width=pct+'%'; el.querySelector('.slider b').style.left=pct+'%';
  el.querySelector('.lab span').textContent=S.set[k]+el.dataset.unit;
  const v=S.set[k];
  if(k==='vol') debounce('vol',()=>call('audio.setVolume',{v}).then(()=>{ S.sys.audio.volume=v; }).catch(e=>toast(e.message)),60);
  else if(k==='bright') debounce('bright',()=>call('display.setBrightness',{v}).then(()=>{ S.sys.display.brightness=v; }).catch(e=>toast(e.message)),150);
  else send({type:'setting', key:k, value:v});
  blip(500+v*4,.03);
}

function back(){
  if(SLIDE){ slideDone(); return blip(420,.04); }
  if(S.locked && !S.layers.includes('prompt')) return;
  if(OVERLAY && S.layers.length<=1) return overlayClose();
  if(S.layers.length && S.layers.at(-1)==='launch' && S.launchWaiting) return launchShow();
  if(S.layers.length && S.layers.at(-1)!=='launch'){ const top=S.layers.at(-1); closeLayer(); return resumeIfGame(top); }
  if(!S.layers.length && S.view==='shots' && SH.open>=0){ const i=SH.open; SH.open=-1; return render('sh-'+i,true); }
  if(!S.layers.length && goBack()) return blip(420,.05);
}
function typeKey(c){
  const k=focused?.dataset.k;
  if(c==='bksp') query=query.slice(0,-1); else if(c==='clear') query=''; else query+=c;
  renderSearch(k);
}
function power(p){
  closeAll();
  const label={hibernate:'Turning off. Your games will be here when you turn it back on…',sleep:'Going to sleep…',restart:'Restarting…',shutdown:'Shutting down…',signout:'Signing out…',desktop:LINUX?'Switching to Mantel…':'Switching to the desktop…',explorer:'Opening File Explorer…'}[p];
  send({type:'power', action:p});
  toast(host?label:label+' (simulated in the browser preview)');
}
function updateBadge(){ const b=$('#nbadge'); b.textContent=NOTIFS.length; b.style.display=NOTIFS.length?'':'none'; }

let launchTimer=null;
function hideLaunch(){
  clearTimeout(launchTimer);
  if(!S.layers.includes('launch')) return;
  S.layers=S.layers.filter(x=>x!=='launch'); $('#launch').classList.remove('open'); focusStack.pop();
  renderFooter();
}
function launch(g){
  if(isFrozen(g)) return quickResume(g.id);
  if(S.running===g.id){ closeAll(); return send({type:'resume'}); }
  let aside=null;
  if(S.running && S.running!==g.id){
    const cur=G(S.running);
    // Quick Resume: the game that's running is put aside (frozen where it is) and this one starts.
    if(!qrFeature() || !QR.on){ toast(`Exit ${cur.title} first (Quick Access → Now playing)`); return; }
    if(cur && cur.cloud){ toast(`Close ${cur.title} first: cloud games can't be put aside`); return; }
    aside=cur;
  }
  if(aside) toast(`${aside.title} is put aside (Quick Resume)`);
  const L=$('#launch');
  L.innerHTML = `<div class="art" style="${artBg(g)}"></div>${artImg(g,['hero','wide'])}<div class="lbox"><div class="spin"></div><div class="t">${esc(g.title)}</div><div class="s">${g.cloud?'Streaming with Xbox Cloud Gaming…':`Starting via ${SOURCES[g.src]}…`}</div></div>`;
  closeAll();
  focusStack.push({el:focused, k:focused?.dataset.k}); S.layers.push('launch'); L.classList.add('open'); renderFooter();

  if(!host){ // browser preview: pretend
    launchTimer=setTimeout(()=>{ hideLaunch(); gameStarted(g.id); }, 1700);
    return;
  }
  call('game.launch',{id:g.id}).then(r=>{
    if(r && r.tracked===false){ // shortcut Nimbus can't watch
      launchTimer=setTimeout(()=>{ hideLaunch(); toast(`Started ${g.title}`); }, 2500);
      return;
    }
    // Stay on the launch screen until the game's process shows up; stores can take a while.
    launchTimer=setTimeout(()=>{ hideLaunch(); toast(`${g.title} is still starting. The store may be updating it.`); }, 25000);
  }).catch(e=>{ hideLaunch(); toast(e.message); });
}
// Hearth (Linux): the game loads behind the starting screen and comes to the front once its window is up
// ("game.ready"). Until then the screen says what's happening; B or "Show it now" skips the wait.
function gameWaiting(id){
  const g=G(id); clearTimeout(launchTimer);
  S.running=id; S.runningSince=Date.now(); if(g) g.last=Date.now();
  const s=$('#launch .s'); if(s) s.textContent='Getting it ready…';
  S.launchWaiting=id;
}
function gameSlow(d){
  if(S.launchWaiting!==d.id || !S.layers.includes('launch')) return;
  const box=$('#launch .lbox'); if(!box || box.querySelector('.hint')) return;
  box.insertAdjacentHTML('beforeend', `<div class="hint">${d.firstRun?'The first start of a Windows game sets up Proton and can take a few minutes. It comes to the front by itself when it\'s ready.':'Still starting. It comes to the front by itself when it\'s ready.'}</div><button class="btn" data-f data-k="l-show" data-act="launchShow">Show it now</button>`);
  setFocus($('#launch [data-k="l-show"]'));
}
function launchShow(){ S.launchWaiting=null; hideLaunch(); send({type:'resume'}); }
function gameReady(id){
  if(S.launchWaiting!==id) return;
  S.launchWaiting=null;
  gameStarted(id);
}
function gameStarted(id){
  if(host && LINUX && !OVERLAY && S.launchWaiting!==id && S.layers.includes('launch') && S.running!==id){ gameWaiting(id); return; }
  const g=G(id); hideLaunch();
  S.running=id; S.runningSince=Date.now(); if(g) g.last=Date.now();
  if(!OVERLAY) overlayTip();
  if(S.view==='game') render(null,true); else renderFooter();
  if(S.layers.includes('qam')) renderQam();
  if(g) toast(`${g.title} is running. Open Quick Access to exit.`);
}
function gameEnded(dto){
  if(dto && dto.id){ const g=G(dto.id); if(g) Object.assign(g, fromHost(dto)); }
  S.running=null; S.paused=false; S.launchWaiting=null; hideLaunch();
  if(!S.layers.length) render(null,true); else { renderFooter(); if(S.layers.includes('qam')) renderQam(); }
}
async function exitGame(){
  const g=G(S.running);
  if(!host){ S.running=null; toast(g?`Closed ${g.title}`:'Closed game'); return gameEnded(null); }
  toast(g?`Closing ${g.title}…`:'Closing game…');
  try{ const r=await call('game.close',{},20000); if(r && r.ok===false) toast("Some of the game's windows wouldn't close. It may be running as administrator."); }
  catch(e){ toast(e.message); }
  // The exit itself arrives as a game.exited event once the process is gone.
}

function viewGameSettings(){
  const g=G(S.game); if(!g) return note('That game isn\'t in the library anymore.');
  const r=GSET.s; if(!r) return `<h2>${esc(g.title)}</h2>`+note('Loading…');
  const o=r.options;
  const sw=(k,label,sub)=>`<button class="row" data-f data-k="gs-${k}" data-act="gsToggle" data-key="${k}"><div class="rt"><b>${label}</b>${sub?`<small>${sub}</small>`:''}</div><div class="sw ${o[k]?'on':''}"></div></button>`;
  let h=`<h2>${esc(g.title)}</h2><div class="rows">`;
  // For every game, Steam's too: Hearth sets these while it plays.
  const ingame = shead('While it plays')
    + `<button class="row" data-f data-k="gs-fps" data-act="gsFps"><span class="ricon">${I.perf||I.gear}</span><div class="rt"><b>Frame-rate cap</b><small>Smoother and cooler: caps this game, then goes back to your usual limit</small></div><div class="rv">${o.fpsLimit?o.fpsLimit+' FPS':'Usual'} ›</div></button>`
    + `<button class="row" data-f data-k="gs-tdp" data-act="gsTdp"><span class="ricon">${I.power}</span><div class="rt"><b>Power limit</b><small>More watts for a demanding game, fewer for battery life</small></div><div class="rv">${o.tdp?o.tdp+' W':'Usual'} ›</div></button>`;

      + sw('fsr','AMD FSR upscaling','Sharper picture when the game runs below the screen\'s resolution (fullscreen games)');
  }

  if((g.src==='epic'||g.src==='gog') && r.canResetPrefix) h += shead('Saves') + sw('cloudSaves',`${g.src==='gog'?'GOG':'Epic'} cloud saves`,`Newer saves come down from ${g.src==='gog'?'GOG':'Epic'} before you play and go up after, for games that have cloud saves`);
  h += shead('Launch')
    + `<button class="row" data-f data-k="gs-args" data-act="gsText" data-key="args"><div class="rt"><b>Launch options</b><small>${o.args?esc(o.args):'Extra options passed to the game, like -skipintro'}</small></div><div class="rv">Edit ›</div></button>`
    + `<button class="row" data-f data-k="gs-env" data-act="gsText" data-key="env"><div class="rt"><b>Environment variables</b><small>${o.env?esc(o.env):'Like DXVK_HUD=fps or PROTON_USE_WINED3D=1'}</small></div><div class="rv">Edit ›</div></button>`;
  h += shead('Performance')
    + sw('mangohud','Performance overlay (MangoHud)','Shows FPS, CPU and GPU in the corner of the game')

  return h+`</div>`+note('Changes apply the next time you start the game.');
}

// ---------- installs and downloads ----------
async function installGame(g){
  if(!g) return;
  if(!host) return toast(`The browser preview can't install games`);
  if(g.note) return toast(`${g.note}. ${APP} can't install it.`);
  try{
    await call('game.install',{id:g.id},60000);
    if(g.installKind==='nimbus'){
      g.state='queued'; toast(`Downloading ${g.title}. Follow it under Downloads.`);
      render(null,true);
    }
    else if(g.installKind==='store') toast(`The Microsoft Store is open. Install ${g.title} there; ${APP} picks it up when it's done.`);
    else toast(`${SOURCES[g.src]}'s install window is open: A installs, B cancels, D-pad moves (or use the right stick as a mouse).`);
    startDownloadPoll(true);
  }catch(e){ toast(e.message); }
}
let dlTimer=null, dlWatchUntil=0;
// Polls Steam's install records while anything is downloading (and for a while after an install request,
// since the download only appears once you confirm Steam's dialog).
function startDownloadPoll(expectNew){
  if(expectNew) dlWatchUntil=Date.now()+5*60e3;
  if(dlTimer) return;
  const tick=async()=>{
    dlTimer=null;
    try{
      const r=await call('library.downloads');
      if(r.speeds) DLS.speeds=r.speeds; if(r.recent) DLS.recent=r.recent;
      const before=new Map(GAMES.map(g=>[g.id,g.state]));
      for(const d of r.active){ const g=G(d.id); if(g) Object.assign(g, fromHost({...d, fav:g.fav, hidden:g.hidden})); else GAMES.push(fromHost(d)); }
      if(r.changed){
        const finished=[...before].filter(([id,st])=>STATE_LABEL[st] && !r.active.some(a=>a.id===id)).map(([id])=>G(id)).filter(Boolean);
        await loadLibrary(true);
        finished.filter(g=>G(g.id)&&G(g.id).inst).forEach(g=>toast(`${g.title} is ready to play`));
      } else if(!S.layers.length) render(null,true);
      const keep = r.active.length>0 || Date.now()<dlWatchUntil || S.view==='downloads';
      if(keep) dlTimer=setTimeout(tick, S.view==='downloads' ? 2000 : 3000);
    }catch(e){ dlTimer=setTimeout(tick, 10000); }
  };
  dlTimer=setTimeout(tick, 1500);
}

function padState(){
  const pads=(navigator.getGamepads?[...navigator.getGamepads()]:[]).filter(p=>p&&p.connected!==false);
  if(pads.length) return {on:true, name:pads[0].id.split('(')[0].replace(/\s+/g,' ').trim()||'Controller'};
  if(PAD.host) return {on:true, name:'Controller'};
  return {on:false, name:''};
}
let padWatch=null, padWas=null;
const BTPAD={state:'', name:''};
function watchPad(on){
  if(!!padWatch===on) return;
  clearInterval(padWatch); padWatch=null; padWas=null;
  // Bluetooth controllers are found and paired automatically while this screen is up: nothing else to press.
  if(host && LINUX) call('bt.autoPads',{on}).catch(()=>{});
  if(!on){ BTPAD.state=''; return; }
  padWatch=setInterval(()=>{
    const waiting = S.view==='pad' || (S.view==='setup' && SETUP_STEPS[S.setupStep||0]==='controller');
    if(!waiting){ watchPad(false); return; }
    const st=padState(); if(padWas===st.on) return;
    const first=padWas===null; padWas=st.on;
    if(!first){ if(st.on) blip(880,.06,.05); render(st.on?'pad-go':'pad-skip', true); }
  }, 600);
}
function padBody(go, skip, extra=''){

// ---------- Install Hearth (live USB): Hearth's own installer, controller-first ----------
// The same engine as Mantel's install window (hearth-install). Steps: how (next to Windows, or a whole drive),
// which drive and how much room, your account, internet, a last look, then the install itself.
const OSI = {step:'how', disks:null, check:null, checking:false, mode:null, disk:null, give:0, target:null,
  user:{full:'', name:'', password:''}, hostname:'', tz:'', s:null};
const OSI_STEPS = ['how','drive','account','online','review','run'];
const OSI_TZ = ['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles','America/Anchorage','Pacific/Honolulu',
  'America/Toronto','America/Mexico_City','America/Sao_Paulo','Europe/London','Europe/Dublin','Europe/Paris','Europe/Berlin','Europe/Madrid','Europe/Rome',
  'Europe/Warsaw','Europe/Helsinki','Europe/Moscow','Africa/Johannesburg','Asia/Dubai','Asia/Kolkata','Asia/Singapore','Asia/Shanghai','Asia/Tokyo','Asia/Seoul',
  'Australia/Perth','Australia/Sydney','Pacific/Auckland','UTC'];
function osiOpen(){
  if(!S.view || S.view!=='osinstall') navigate('osinstall');
  if(OSI.s && (OSI.s.state==='running'||OSI.s.state==='done')) OSI.step='run';
  else OSI.step='how';
  if(!OSI.tz){ try{ const z=Intl.DateTimeFormat().resolvedOptions().timeZone; OSI.tz = z && z!=='Etc/UTC' ? z : 'UTC'; }catch(e){ OSI.tz='UTC'; } }
  osiLoad(); render('osi-0');
}
function osiLoad(){
  call('osinstall.status').then(s=>{ OSI.s=s; if(s.state==='running') OSI.step='run'; render(null,true); }).catch(()=>{});
  call('osinstall.disks',{},60000).then(r=>{ OSI.disks=r.disks||[]; OSI.image=r.image||''; render(null,true); }).catch(e=>{ OSI.disks=[]; toast(e.message); });
}
function osiCheck(){
  if(OSI.checking) return; OSI.checking=true; OSI.check=null; render(null,true);
  const t=OSI.target;
  call('osinstall.check',{part:t&&t.kind==='linux'?(t.shrink||t.part):null},180000).then(r=>{ OSI.check=r; OSI.give = r.suggested || r.target&&r.target.canGive || 0; })
    .catch(e=>{ OSI.check={problems:[{id:'error',text:e.message}]}; })
    .finally(()=>{ OSI.checking=false; render(null,true); });
}
const osiDisk = ()=> (OSI.disks||[]).find(d=>d.dev===OSI.disk);
/** Systems Hearth can go next to, on every drive: Windows, SteamOS, other Linux. */
const osiSystems = ()=> (OSI.disks||[]).filter(d=>!d.live).flatMap(d=>(d.systems||[]).map(x=>({...x, disk:d.dev, model:d.model, size:d.size})));
const osiName = ()=> (OSI.target&&OSI.target.name) || 'Windows';
const osiUsable = ()=> (OSI.disks||[]).filter(d=>!d.live && !d.tooSmall);
function osiGo(d){
  const i=OSI_STEPS.indexOf(OSI.step)+d;
  if(i<0){ S.history.length ? goBack() : navigate('home',{},false); return; }
  const next=OSI_STEPS[Math.min(i,OSI_STEPS.length-1)];
  if(d>0){ const why=osiBlock(OSI.step); if(why) return toast(why); }
  if(next==='online' && S.sys.wifi && S.sys.wifi.ssid && d>0){ OSI.step='online'; return osiGo(1); }   // already online: skip
  OSI.step=next;

      const hard=(c.problems||[]).filter(p=>!p.soft); if(hard.length) return hard[0].text; if(OSI.give<64*2**30) return 'Hearth needs at least 64 GB'; }

// ---------- Lock (Game Mode, after sleep) ----------
// Settings › Sign-in › "Ask for my password after sleep". Hearth locks as the device goes to sleep, so it's
// locked when it wakes. An account with no password is never locked (nothing to type).
function lockNow(){
  if(S.locked) return;
  call('login.unlock',{password:''}).then(r=>{ if(!r.ok) lockShow(); }).catch(()=>lockShow());
}
function lockShow(){
  if(S.locked) return;
  closeAll();
  S.lockFrom={view:S.view, game:S.game};
  S.locked=true; S.view='lock';
  render('lk-go');
}
async function lockUnlock(){
  const pw=await openPrompt({title:'Password', secret:true}); if(pw==null) return;
  const r=await call('login.unlock',{password:pw}).catch(()=>({ok:false}));
  if(!r.ok){ toast('That password isn\'t right'); return; }
  S.locked=false;
  const f=S.lockFrom||{view:'home'}; S.view=f.view&&f.view!=='lock'?f.view:'home'; S.game=f.game;
  render(null);
}

async function askPin(title){
  const pin=await openPrompt({title:title||'Enter the PIN', secret:true, min:4}); if(pin==null) return false;
  try{ await call('profiles.unlock',{pin}); if(PROF.s) PROF.s.unlocked=true; return true; }catch(e){ toast(e.message); return false; }
}
/** A profiles call that may need the PIN: asks for it once, then tries again. */
async function pinCall(method, args, ms){
  try{ return await call(method, args, ms); }
  catch(e){ if(!/PIN first/.test(e.message)) throw e; if(!(await askPin())) throw new Error('Not changed: that needs the PIN'); return call(method, args, ms); }
}
const fmtMins = m => m>=60 ? `${Math.floor(m/60)} h${m%60?' '+(m%60)+' min':''}` : `${m} min`;
const LIMIT_CHOICES=[0,30,45,60,90,120,180,240];
function limitsSummary(p){ const l=p.limits||{}; const a=[]; if(l.minutesPerDay) a.push(`${fmtMins(l.minutesPerDay)} a day`); if(l.allowed) a.push(`${l.allowed.length} game${l.allowed.length===1?'':'s'}`); return a.length?a.join(' · '):'No limits'; }
async function pinSetup(){
  const s=PROF.s; if(!s) return;

  const items=[{label:s.hasPin?'Change PIN':'Set a PIN', icon:'lock', run:()=>setTimeout(async()=>{
    const a=await openPrompt({title:'New PIN (4 to 8 numbers)', secret:true, min:4}); if(a==null) return;
    const b=await openPrompt({title:'Same PIN again', secret:true, min:4}); if(b==null) return;
    if(a!==b) return toast("Those didn't match. Try again.");
    try{ await pinCall('profiles.setPin',{pin:a}); await loadProfiles(); toast('PIN set. Now set limits on a profile.'); }catch(e){ toast(e.message); } },250)}];
  if(s.hasPin) items.push({label:'Remove PIN and all limits', icon:'trash', run:()=>pinCall('profiles.setPin',{pin:''}).then(loadProfiles).then(()=>toast('PIN and limits removed')).catch(e=>toast(e.message))});

function initials(n){ const p=String(n||'?').trim().split(/\s+/).filter(Boolean); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }

function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function applyProfile(){
  const st=document.documentElement.style, acc=/^#[0-9a-f]{6}$/i.test(PROFILE.accent)?PROFILE.accent:'#3fd0b8';
  const [r,g,b]=hexRgb(acc);

  st.setProperty('--accent2',rgbHex(r*.8,g*.8,b*.8));
  const lum=(.2126*r+.7152*g+.0722*b)/255;
  st.setProperty('--accentInk', lum>.45 ? rgbHex(r*.12,g*.12,b*.12) : '#ffffff');
  const custom = PROFILE.background==='custom' && PROFILE.customBackground;
  const th = THEMES.find(t=>t[0]===PROFILE.background) || THEMES[0];

  let h = `<div class="prof">${avatarHtml(p,'avatar lg')}<div><div class="pname">${esc(p.name)}</div><div class="muted">${esc(p.status||'Online')}</div></div></div>`;
  h += `<button class="row" data-f data-k="pf-name" data-act="pfName"><span class="ricon">${I.user}</span><div class="rt"><b>Name</b><small>${esc(p.name)}</small></div><div class="rv">Edit ›</div></button>`;
  h += `<button class="row" data-f data-k="pf-status" data-act="pfStatus"><span class="ricon">${I.note}</span><div class="rt"><b>Status line</b><small>${esc(p.status||'Online')}</small></div><div class="rv">Edit ›</div></button>`;
  // Picture
  const opt=(key,label)=>`<button class="avopt ${p.avatar===key?'on':''}" data-f data-k="pa-${key.replace(':','-')}" data-act="pfAvatar" data-v="${key}">${avatarHtml(p,'avatar md',key)}<small>${label}</small></button>`;
  let av = opt('initials','Initials') + AV_PRESETS.map((_,i)=>opt('preset:'+i,'')).join('');
  const sa=p.storeAvatars||{};
  if(sa.xbox) av += opt('xbox','Xbox gamerpic');
  if(sa.steam) av += opt('steam','Steam picture');
  if(sa.gog) av += opt('gog','GOG picture');
  if(p.customAvatar) av += opt('custom','Your picture');
  av += `<button class="avopt" data-f data-k="pa-pick" data-act="pfPick" data-kind="avatar"><div class="pick">＋</div><small>Choose a picture…</small></button>`;
  h += shead('Picture') + `<div class="opts">${av}</div>`;
  // Accent
  h += shead('Accent color') + `<div class="opts">${ACCENTS.map(([c,n],i)=>`<button class="swatch ${p.accent.toLowerCase()===c?'on':''}" data-f data-k="pc-${i}" data-act="pfAccent" data-v="${c}" style="--c:${c}" aria-label="${n}" title="${n}"></button>`).join('')}</div>`;
  // Background
  const th=THEMES.map(t=>`<button class="theme ${p.background===t[0]?'on':''}" data-f data-k="pb-${t[0].replace(':','-')}" data-act="pfBg" data-v="${t[0]}"><div class="tprev" style="background:linear-gradient(135deg,${t[2]} 0%,${t[2]} 45%,${t[6]} 100%)"><i></i></div><small>${t[1]}</small></button>`).join('');
  const cust = p.customBackground ? `<button class="theme ${p.background==='custom'?'on':''}" data-f data-k="pb-custom" data-act="pfBg" data-v="custom"><div class="tprev" style="background-image:url('${esc(p.customBackground)}')"><i></i></div><small>Your picture</small></button>` : '';
  h += shead('Background') + `<div class="opts">${th}${cust}<button class="theme" data-f data-k="pb-pick" data-act="pfPick" data-kind="background"><div class="tprev" style="display:grid;place-items:center;color:var(--dim);font-size:24px;border-style:dashed">＋</div><small>Choose a picture…</small></button></div>`;
  h += note('Your profile is saved on this PC. Signing in to Xbox, Steam or GOG (Library › Stores) adds their pictures to the choices above.');
  return h;
}

// ---------- real library (host) ----------
const LIB = {loading:false, counts:{}};
const fmtSize = b => !b ? '' : b>=1e9 ? (b/1e9).toFixed(1)+' GB' : Math.round(b/1e6)+' MB';
function fromHost(d){
  return {id:d.id, title:d.title, src:d.source, fav:!!d.fav, hidden:!!d.hidden, cols:d.cols||[],
          hrs:(d.minutes||0)/60, last:d.lastPlayed||0, added:d.added||0, size:fmtSize(d.sizeBytes),
          ach:null, art:d.art||{}, path:d.path||'', canRemove:!!d.canRemove,
          inst:d.installed!==false, cloud:!!d.cloud, state:d.state||'installed', progress:d.progress, bytesDone:d.bytesDone, bytesTotal:d.bytesTotal, speed:d.bytesPerSec,
          canUninstall:!!d.canUninstall, note:d.note||null, installKind:d.installKind||null, system:d.system||null};
}
async function loadLibrary(rescan, announce){
  if(!host) return;
  LIB.loading=true; if(!GAMES.length) render(null,true);
  try{
    const lib=await call('library.get',{rescan:!!rescan},120000);
    applyLib(lib);
    const s=lib.sources||{}; S.set.srcSteam=s.steam!==false; S.set.srcEpic=s.epic!==false; S.set.srcGog=s.gog!==false; S.set.srcXbox=s.xbox!==false; S.set.srcEmu=s.emu!==false;
    if(lib.runningId) S.running=lib.runningId;
    if(lib.quickResume) applyQuick({list:lib.quickResume.list, on:lib.quickResume.on});
    S.set.steamBg = lib.steamBackground!==false;
    if(GAMES.some(isActive)) startDownloadPoll();
    if(announce) toast(`Found ${GAMES.length} game${GAMES.length===1?'':'s'}`);
  }catch(e){ toast("Couldn't load your library: "+e.message); }
  finally{ LIB.loading=false; render(null,true); }
}
function applyLib(lib){
  if(!lib || !lib.games) return;
  GAMES.length=0; lib.games.forEach(d=>GAMES.push(fromHost(d)));
  LIB.counts=lib.counts||{};
  if(Array.isArray(lib.collections)) COLS=lib.collections.map(c=>({id:c.id,name:c.name}));
}
async function setSources(){
  try{
    const lib=await call('library.setSources',{steam:S.set.srcSteam,epic:S.set.srcEpic,gog:S.set.srcGog,xbox:S.set.srcXbox,emu:S.set.srcEmu},120000);
    GAMES.length=0; lib.games.forEach(d=>GAMES.push(fromHost(d))); LIB.counts=lib.counts||{};
  }catch(e){ toast(e.message); }
  render(null,true);
}

// =====================================================================
// System controls (Wi-Fi, Bluetooth, audio, display, power)
// =====================================================================
function onSysEvent(name, data){
  if(name==='status') return applyStatus(data);
  if(name==='systemUpdate') return onSystemUpdate(data);
  if(name==='import') return onImport(data);
  if(name==='osInstall') return onOsInstall(data);
  if(name==='lock') return lockNow();
  if(name==='profiles.changed') return loadProfiles();
  if(name==='bt.pad'){ BTPAD.state=data.state; BTPAD.name=data.name||'the controller'; if(data.state==='paired') toast(`${BTPAD.name} connected`); if(S.view==='pad'||S.view==='setup') render(null,true); return; }
  if(name==='parental.timeup'){ toast("Play time's up for today"); return; }
  if(name==='profiles.switching'){ PROF.switching=data.name; if(S.view!=='profiles') navigate('profiles',{},false); else render(null,true); return; }
  if(name==='switch'){ if(SW.s) SW.s.job=data.job; if(data.job && data.job.state==='done') loadSwitch(); if(data.job && data.job.state==='error') toast(data.job.error||'That step didn\'t work'); if(S.view==='settings'&&S.settingsTab==='switch') render(null,true); return; }
  if(name==='library.changed'){ if(!OVERLAY) loadLibrary(false); return; }
  if(name==='desktopFailed') return openSheet({title:"Mantel (Desktop Mode) couldn't start", sub:data.text, items:[{label:'OK', icon:'check', run:()=>{}}]});
  if(name==='open'){ if(data&&data.view&&S.view!==data.view) navigate(data.view); return; }
  if(name==='game.started') return gameStarted(data.id);
  if(name==='game.ready') return gameReady(data.id);
  if(name==='game.slow') return gameSlow(data);
  if(name==='update') return OVERLAY ? null : onUpdate(data);
  if(name==='pad') return hostPad(data.b);
  if(name==='padMouse'){ PAD.mouseOn=!!data.on; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='padHost'){ PAD.host = data.connected>0; if(S.view==='settings' && S.settingsTab==='controller') render(null,true); return; }
  if(name==='game.exited') return gameEnded(data);
  if(name==='friends'){ if(S.view==='friends' && !S.layers.length) loadFriends(); return; }
  if(name==='quickResume'){ applyQuick(data); if(!OVERLAY && !S.layers.length) render(null,true); else { renderFooter(); if(S.layers.includes('qam')) renderQam(); } return; }
  if(name==='game.paused'){ S.paused=!!data.paused; if(S.layers.includes('qam')) renderQam(); return; }
  if(name==='accounts.changed') return OVERLAY ? null : loadAccounts(true);
  if(name==='osd') return showOsd(data);
  if(name==='library.art'){ if(!LIB.loading && !OVERLAY) loadLibrary(false); return; }
  if(name==='net'){ S.online=!!data.online; toast(data.online?'Back online':"You're offline. Installed games and your library still work."); return; }
  if(name==='browser'){ BROWSER.s=data; if(S.view==='settings' && S.settingsTab==='system') render(null,true); if(data && data.error && data.state==='idle') toast(data.error); return; }
  if(name==='power.menu'){ if(OVERLAY && OV.busy){ OV.wantPower=true; return; } if(S.layers.at(-1)!=='power'){ if(!OVERLAY) closeAll(); openLayer('power'); } return; }
  if(name==='overlay.shown') return overlayShown();
  if(name==='overlay.hidden') return overlayHidden();
  if(name==='install.done'){
    const t=data.title||'The game';
    if(data.error==='cancelled') toast(`Cancelled the download of ${t}`);
    else if(data.error) toast(`${t} didn't install: ${data.error}`);
    else { if(data.id){ const k=DL_DONE.indexOf(data.id); if(k>=0) DL_DONE.splice(k,1); DL_DONE.unshift(data.id); DL_DONE.length=Math.min(DL_DONE.length,6); }
      toast(`${t} is installed and ready to play`); NOTIFS.unshift({i:'dl', t:`${t} is ready to play`, s:'Installed by '+APP+''}); updateBadge(); }
    return OVERLAY ? null : loadLibrary(true);
  }
  if(name==='game.timeout'){ hideLaunch(); const g=G(data.id); return toast(`${APP} couldn't see ${g?g.title:'the game'} start. If it's running, it still works; it just won't show here.`); }
  if(name==='bt.found'){
    const known = S.sys.found.some(d=>d.id===data.id) || (S.sys.paired||[]).some(d=>d.id===data.id);
    if(!known && data.name){ S.sys.found.push(data); refreshUI(); }
    return;
  }
  if(name==='bt.scanDone'){ S.sys.btScanning=false; S.sys.foundDone=true; return refreshUI(); }
  if(name==='bt.pin'){
    if(data.confirm) return openSheet({title:'Confirm pairing', sub:`Make sure the device shows ${data.pin}`,
      items:[{label:'It matches, pair',icon:'check',run:()=>call('bt.confirmPin',{accept:true}).catch(()=>{})},
             {label:"It doesn't match",icon:'x',run:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})}],
      noCancel:true, onCancel:()=>call('bt.confirmPin',{accept:false}).catch(()=>{})});
    return openSheet({title:'Enter this PIN on the device', sub:`${data.pin}, then press Enter on the device`, items:[{label:'OK',icon:'check'}], noCancel:true});
  }
}
function applyStatus(st){
  if(!st) return;
  if(st.wifi) S.sys.wifi={...S.sys.wifi,...st.wifi};
  if(st.bt) S.sys.bt={...S.sys.bt,...st.bt};
  if('airplane' in st) S.sys.airplane=!!st.airplane;
  if(st.battery) S.sys.battery=st.battery;
  if(st.audio) Object.assign(S.sys.audio, st.audio);
  if(st.display) Object.assign(S.sys.display, st.display);
  if(st.powerMode) S.sys.powerMode=st.powerMode;
  if(S.sys.nets) S.sys.nets.forEach(n=>n.connected = n.ssid===S.sys.wifi.ssid);
  S.set.vol=S.sys.audio.volume; S.set.bright=S.sys.display.brightness;
  refreshUI();
}
function refreshStatus(){ return call('sys.status').then(applyStatus).catch(()=>{}); }

// Re-render whatever is showing live system data, keeping focus where it was.
function refreshUI(){
  updateStatusBar();
  if(S.view==='settings') render(null, true);
  if(S.layers.includes('qam')){
    const k = focused && $('#qam').contains(focused) ? focused.dataset.k : null;
    renderQam();
    if(k){ const el=$(`#qam [data-k="${k}"]`); if(el) setFocus(el,true); }
  }
}
function updateStatusBar(){
  const w=S.sys.wifi, ws=$('#wifiStat');
  ws.innerHTML = S.sys.airplane ? I.plane : !w.on ? I.wifiOff : barsIcon(w.ssid ? w.bars : 0);
  ws.style.opacity = (w.on && w.ssid && !S.sys.airplane) ? 1 : .5;
  const b=S.sys.battery;
  if(b && b.present===false) $('#batt').style.display='none';
  else if(b && b.pct!=null){ $('#batt').style.display=''; $('#battPct').textContent=b.pct+'%'+(b.charging?' ⚡':''); $('#battFill').setAttribute('width', Math.max(1,10*b.pct/100)); }
}

function onSettingsTab(t){
  if(t==='wifi') wifiScan();
  if(t==='shell') loadShellStatus();
  if(t==='profile'){ loadProfile(); loadAccounts(true); }
  if(t==='updates'){ loadUpdateStatus(); loadSystemUpdate(); }
  if(t==='signin') loadLogin();
  if(t==='remote') loadRemote();
  if(t==='sources') loadEmu();
  if(t==='appearance') loadDeskWall();
  if(t==='import') loadImport();
  if(t==='switch') loadSwitch();
  if(t==='profiles') loadProfiles();
  if(t==='system' || t==='about') loadSysInfo();
  if(t==='system'){ loadBrowser(); loadArtStatus(); }
  if(t==='about'){ loadCounterStats(); if(!UPD.status) loadUpdateStatus(); loadSystemUpdate(); if(host) call('display.get').then(r=>{ Object.assign(S.sys.display,r); refreshUI(); }).catch(()=>{}); }
  if(t==='controller') call('overlay.settings').then(r=>{ OVS.s=r; render(null,true); }).catch(()=>{});
  if(t==='controller' && host) call('pad.status').then(s=>{ PAD.mouseMode=s.mouseMode; PAD.mouseOn=s.mouseOn; PAD.host=s.connected>0; render(null,true); }).catch(()=>{});
  if(t==='bluetooth') loadPaired();
  if(t==='power' || t==='audio') loadButtons();
  if(t==='controller') loadRemap();
  if(t==='audio') call('audio.get').then(r=>{ Object.assign(S.sys.audio,r); S.set.vol=r.volume; refreshUI(); }).catch(e=>toast(e.message));
  if(t==='display') call('display.get').then(r=>{ Object.assign(S.sys.display,r); S.set.bright=r.brightness; refreshUI(); }).catch(e=>toast(e.message));
  if(t==='power') call('power.get').then(r=>{ S.sys.battery={present:r.present,pct:r.pct,charging:r.charging}; S.sys.powerMode=r.mode; S.sys.power=r; refreshUI(); }).catch(e=>toast(e.message));
}

async function toggleRadio(kind){
  if(S.sys.busy[kind]) return;
  S.sys.busy[kind]=true; refreshUI();
  try{
    const st = kind==='air' ? await call('airplane.set',{on:!S.sys.airplane})
                            : await call('radios.set',{kind, on:!radioOn(kind)});
    applyStatus(st);
    if(kind!=='bt'){ S.sys.nets=null; if(S.sys.wifi.on) setTimeout(()=>wifiScan(true), 1200); } // adapter needs a moment after power-on
    if(kind!=='wifi'){ if(!S.sys.bt.on){ S.sys.found=[]; S.sys.btScanning=false; } loadPaired(); }
  }catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[kind]; refreshUI(); }
}

// ---- Wi-Fi ----
async function wifiScan(force){
  if(S.sys.scanning || !S.sys.wifi.on) return;
  if(!force && S.sys.nets && Date.now()-S.sys.scannedAt < 20000) return;
  S.sys.scanning=true; refreshUI();
  try{ S.sys.nets = await call('wifi.scan'); S.sys.scannedAt=Date.now(); }
  catch(e){ toast(e.message); if(!S.sys.nets) S.sys.nets=[]; }
  finally{ S.sys.scanning=false; refreshUI(); }
}
function askPassword(n){
  openPrompt({title:`Password for ${n.ssid}`, secret:true, min:8}).then(pw=>{ if(pw!=null) wifiConnect(n,pw); });
}
function wifiNet(ssid){
  const n=(S.sys.nets||[]).find(x=>x.ssid===ssid);
  if(!n || S.sys.connecting) return;
  if(n.connected) return openSheet({title:ssid, sub:'Connected', items:[
    {label:'Disconnect',icon:'x',run:wifiDisconnect},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(n.saved) return openSheet({title:ssid, sub:'Saved network', items:[
    {label:'Connect',icon:'wifi',run:()=>wifiConnect(n)},
    {label:'Forget network',icon:'trash',run:()=>wifiForget(ssid)}]});
  if(!n.secure) return wifiConnect(n);
  askPassword(n);
}
async function wifiConnect(n,pw){
  S.sys.connecting=n.ssid; refreshUI();
  let retry=false;
  try{
    const r=await call('wifi.connect',{ssid:n.ssid, password:pw==null?null:pw}, 60000);
    if(r && r.ok) toast(`Connected to ${n.ssid}`);
    else { const err=(r&&r.error)||"Couldn't connect"; toast(err); retry = n.secure && /password|credential/i.test(err); }
  }catch(e){ toast(e.message); }
  finally{ S.sys.connecting=null; await refreshStatus(); refreshUI(); }
  if(retry) askPassword(n); else wifiScan(true);
}
async function wifiDisconnect(){
  try{ await call('wifi.disconnect'); toast('Disconnected'); }catch(e){ toast(e.message); }
  await refreshStatus(); wifiScan(true);
}
async function wifiForget(ssid){
  try{ await call('wifi.forget',{ssid}); toast(`Forgot ${ssid}`); }catch(e){ toast(e.message); }
  await refreshStatus(); wifiScan(true);
}

// ---- Bluetooth ----
function loadPaired(){
  return call('bt.paired').then(list=>{
    S.sys.paired=list||[];
    S.sys.found=S.sys.found.filter(f=>!S.sys.paired.some(p=>p.id===f.id));
    refreshUI();
  }).catch(e=>{ if(S.sys.paired==null) S.sys.paired=[]; toast(e.message); refreshUI(); });
}
async function btScanToggle(){
  if(S.sys.btScanning){ S.sys.btScanning=false; refreshUI(); return call('bt.scanStop').catch(()=>{}); }
  S.sys.found=[]; S.sys.foundDone=false; S.sys.btScanning=true; refreshUI();
  try{ await call('bt.scanStart',{seconds:15}); }
  catch(e){ S.sys.btScanning=false; toast(e.message); refreshUI(); }
}
async function btPair(id){
  const d=S.sys.found.find(x=>x.id===id);
  if(!d || S.sys.busy[id]) return;
  S.sys.busy[id]=true; refreshUI(); toast(`Pairing with ${d.name}…`);
  try{
    const r=await call('bt.pair',{id}, 120000);
    if(r && r.ok){ toast(`${d.name} is paired`); S.sys.found=S.sys.found.filter(x=>x.id!==id); }
    else toast(`Couldn't pair: ${(r&&r.error)||'unknown error'}`);
  }catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[id]; await loadPaired(); }
}
function btDevice(id){
  const d=(S.sys.paired||[]).find(x=>x.id===id); if(!d) return;
  openSheet({title:d.name, sub:d.connected?'Connected':'Paired · turn the device on to connect', items:[
    {label:'Remove device',icon:'trash',run:()=>btUnpair(d)}]});
}
async function btUnpair(d){
  S.sys.busy[d.id]=true; refreshUI();
  try{ const r=await call('bt.unpair',{id:d.id}); toast(r && r.ok ? `Removed ${d.name}` : `Couldn't remove: ${(r&&r.error)||'unknown error'}`); }
  catch(e){ toast(e.message); }
  finally{ delete S.sys.busy[d.id]; await loadPaired(); }
}

// ---- Audio / power ----
async function setMute(m){
  try{ await call('audio.setMute',{m}); S.sys.audio.muted=m; }catch(e){ toast(e.message); }
  refreshUI();
}
async function setOutput(id){
  try{ const r=await call('audio.setDefault',{id}); Object.assign(S.sys.audio,r); S.set.vol=r.volume;
       const d=r.devices.find(x=>x.id===id); if(d) toast(`Sound output: ${d.name}`); }
  catch(e){ toast(e.message); }
  refreshUI();
}
async function setPowerMode(mode){
  try{ const r=await call('power.setMode',{mode}); S.sys.powerMode=r.mode; }catch(e){ toast(e.message); }
  refreshUI();
}

// ---------- input modes & footer prompts ----------
// Prompts follow whatever you used last: controller buttons, keyboard keys, or clickable buttons for the mouse.
// Settings › Controls can pin them to one style.
const INPUT = {last:'kbd', mode:'auto'};
try{ INPUT.mode = localStorage.getItem('nimbus.inputMode') || 'auto'; }catch(e){}
function promptStyle(){ return INPUT.mode==='auto' ? INPUT.last : INPUT.mode; }
function setInput(kind){
  if(INPUT.last===kind) return;
  INPUT.last=kind;
  document.body.classList.toggle('pad-mode', kind==='pad');
  renderFooter();
  // Update the label in place: re-rendering here would swallow the click that caused it.
  const n=$('#inputNow'); if(n) n.textContent = INPUT_NAMES[kind];
}
const INPUT_NAMES = {pad:'Controller', kbd:'Keyboard', mouse:'Mouse or touch'};
const GLYPHS = {
  pad: {select:['A','a'], back:['B','b'], search:['Y','y'], menu:['☰',''], qam:['⧉',''], tabs:['LB RB',''], adjust:['◀▶',''], del:['Y','y'], space:['X','x'], done:['☰',''], stores:['X','x']},
  kbd: {select:['Enter','kc'], back:['Esc','kc'], search:['/','kc'], menu:['M','kc'], qam:['Q','kc'], tabs:['Tab','kc'], adjust:['← →','kc'], del:['Bksp','kc'], space:['Space','kc'], done:['Enter','kc'], stores:['F','kc']},
};
const HINT_ICON = {back:I.x, search:I.search, menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>', qam:I.sliders, tabs:I.lib, stores:I.user};
function renderFooter(){
  const top=S.layers.at(-1);
  const tb=$('#topBack'); if(tb) tb.classList.toggle('show', !!(S.layers.length || S.history.length));
  if(top==='launch'){ $('#footer').innerHTML=''; return; }
  const style=promptStyle();
  const h=[];  // [id, label]
  if(focused?.dataset.slider){ if(SLIDE===focused) h.push(['adjust','Adjust'],['select','Done']); else h.push(['select','Change']); }
  else h.push(['select','Select']);
  h.push(['back','Back']);
  if(top==='prompt') h.push(['del','Delete'],['space','Space'],['done','Done']);
  if(!top && S.view==='library') h.push(['tabs','Tabs'],['stores','Stores']);
  if(top==='qam') h.push(['tabs','Sections']);
  if(!top) h.push(['search','Search'],['menu','Menu'],['qam','Quick Access']);
  const g=S.running&&G(S.running);
  const items = h.filter(([id])=> style!=='mouse' || !['select','adjust'].includes(id)).map(([id,l],i)=>{
    let glyph;
    if(style==='mouse') glyph = HINT_ICON[id] || '';
    else { const [k,c]=(GLYPHS[style]||GLYPHS.kbd)[id]; glyph=`<span class="glyph ${c}">${k}</span>`; }
    return `<button class="hint ${i>2?'hide-s':''}" data-act="hint" data-h="${id}">${glyph}${l}</button>`;
  });
  $('#footer').innerHTML = (g?`<div class="running"><span class="dot"></span>${esc(g.title)}</div>`:'') + items.join('');
}
function hintAction(id){
  ({select:()=>focused&&act(focused), back:()=>back(), search:()=>input('y'), menu:()=>input('start'),
    qam:()=>input('select'), tabs:()=>input('rb'), adjust:()=>{}, del:()=>input('y'), space:()=>input('x'), done:()=>input('start'), stores:()=>input('x')})[id]?.();
}

// =====================================================================
// Input: gamepad, keyboard, pointer
// =====================================================================
// Settings › System › Log controller input: every press and what it selected goes to the log (Save logs),
// so a jumpy selection can be looked at afterwards.
let INPUT_LOG=false; try{ INPUT_LOG=localStorage.getItem('nimbus.inputLog')==='1'; }catch(e){}
function logInput(what){ if(INPUT_LOG) send({type:'log', text:`input ${what} | view ${S.view} layer ${S.layers.at(-1)||'-'} | focus ${focused?.dataset.k||'-'} | t ${Math.round(performance.now())}`}); }
function input(k){
  logInput(k);
  const top=S.layers.at(-1);
  if(top==='launch') return;
  if(OVERLAY){
    // The overlay is only the Quick Access panel (plus its pop-ups and the text prompt).
    if((k==='select'||k==='guide') && top==='qam') return overlayClose();
    if(k==='start' && top!=='prompt') return;
    if((k==='y'||k==='x') && top!=='prompt') return;
  }
  switch(k){
    case 'up': case 'down': case 'left': case 'right': return move(k);
    case 'a': return focused && act(focused);
    case 'b': return back();
    case 'start': return top==='prompt' ? promptSubmit() : toggleLayer('menu');
    case 'select': case 'guide': return top==='prompt'||top==='sheet' ? null : toggleLayer('qam');
    case 'y': return top==='prompt' ? promptKey('bksp') : top==='search' ? typeKey('bksp') : (closeAll(), query='', openLayer('search'));
    case 'x': return top==='prompt' ? promptKey(' ') : top==='search' ? typeKey(' ') : (S.view==='game' && !top ? act($('[data-k="g-fav"]')) : S.view==='library' && !top ? navigate('stores') : null);
    case 'lb': case 'rb': return shiftTab(k==='lb'?-1:1);
  }
}
function shiftTab(d){
  const top=S.layers.at(-1);
  if(top==='qam'){ const i=QTABS.findIndex(t=>t[0]===S.qtab); S.qtab=QTABS[(i+d+QTABS.length)%QTABS.length][0]; renderQam(); if(S.qtab==='perf') startPerf(); if(S.qtab==='apps') loadApps(); setFocus($(`#qam [data-k="qt-${S.qtab}"]`),true); return blip(600); }
  if(!top && S.view==='library'){ const T=libTabs(), i=T.findIndex(t=>t[0]===S.tab); S.tab=T[(i+d+T.length)%T.length][0]; render('tab-'+S.tab); return blip(600); }
}

// Controllers: Xbox-style controllers come from the host (XInput, exact button names, works with any
// controller order). Other controllers use the browser gamepad API, with optional A/B and X/Y swaps.
const OVS = {s:null};
async function overlayTip(){
  let shown=false; try{ shown=localStorage.getItem('nimbus.overlayTip')==='1'; }catch(e){}
  if(shown || !host || LINUX) return;
  try{ localStorage.setItem('nimbus.overlayTip','1'); }catch(e){}
  try{ OVS.s=await call('overlay.settings'); }catch(e){ return; }
  toast(OVS.s.gameBarButton ? 'Tip: press the Xbox button for the '+APP+' overlay. If Game Bar opens too, turn it off in Settings › Controls.'
                            : 'Tip: press the Xbox button for the '+APP+' overlay.');
}
const PAD = {host:false, last:'', swapAB:false, swapXY:false, mouseMode:'steam', mouseOn:false};
try{ PAD.swapAB = localStorage.getItem('nimbus.swapAB')==='1'; PAD.swapXY = localStorage.getItem('nimbus.swapXY')==='1'; }catch(e){}
function mapPad(k){
  if(PAD.swapAB && (k==='a'||k==='b')) return k==='a'?'b':'a';
  if(PAD.swapXY && (k==='x'||k==='y')) return k==='x'?'y':'x';
  return k;
}
const PAD_NAMES = {a:'A',b:'B',x:'X',y:'Y',lb:'LB',rb:'RB',start:'Menu (☰)',select:'View (⧉)',guide:'Xbox / Guide',up:'D-pad up',down:'D-pad down',left:'D-pad left',right:'D-pad right'};
function padPressed(k){
  setInput('pad');
  PAD.last=k;
  const t=$('#padTest'); if(t) t.textContent = PAD_NAMES[k]||k;
  input(k);
}
function hostPad(k){ padPressed(mapPad(k)); }

// Gamepad (standard mapping) with key-repeat on d-pad / stick
const REPEAT = new Set(['up','down','left','right']);
const held={};
let padSeen=false;
function pollPads(t){
  // The host reads Xbox-style controllers itself; don't also read them here (that would double every press).
  const pads = PAD.host || ACC.signing ? [] : (navigator.getGamepads ? navigator.getGamepads() : []);
  const st={};
  for(const p of pads){ if(!p) continue;
    const b=i=>!!(p.buttons[i] && p.buttons[i].pressed), ax=i=>p.axes[i]||0;
    st.a=st.a||b(0); st.b=st.b||b(1); st.x=st.x||b(2); st.y=st.y||b(3);
    st.lb=st.lb||b(4); st.rb=st.rb||b(5); st.select=st.select||b(8); st.start=st.start||b(9); st.guide=st.guide||b(16);
    st.up=st.up||b(12)||ax(1)<-.55; st.down=st.down||b(13)||ax(1)>.55;
    st.left=st.left||b(14)||ax(0)<-.55; st.right=st.right||b(15)||ax(0)>.55;
  }
  for(const k of ['a','b','x','y','lb','rb','select','start','guide','up','down','left','right']){
    const on=!!st[k], h=held[k];
    if(on && !h){ held[k]={t0:t,last:t}; padPressed(mapPad(k)); }
    else if(on && h && REPEAT.has(k) && t-h.t0>340 && t-h.last>85){ h.last=t; input(k); }
    else if(!on && h) delete held[k];
  }
  requestAnimationFrame(pollPads);
}
window.addEventListener('gamepadconnected', e=>{ if(!padSeen) toast(`Controller connected: ${e.gamepad.id.split('(')[0].trim()||'Gamepad'}`); padSeen=true; });

const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'a',' ':'a',Escape:'b',Backspace:'b',
  m:'start',M:'start',q:'select',Q:'select','[':'lb',']':'rb','/':'y',f:'x',F:'x',
  w:'up',W:'up',a:'left',A:'left',s:'down',S:'down',d:'right',D:'right'};
// Shortcuts that aren't controller buttons
const KEY_EXTRA = {Home:()=>{ closeAll(); if(S.view!=='home'){ S.history=[]; navigate('home',{},false); } },
  F1:()=>{ S.settingsTab='controller'; S.view==='settings' ? (render('st-controller'), onSettingsTab('controller')) : navigate('settings',{focusKey:'st-controller'}); }};
// Steam (running in the background) can turn controller buttons into keys for the window in front: the d-pad
// into arrow keys, A into Enter. With the controller also read here, every press counted twice, and the
// selection jumped two places. Navigation keys that arrive while a controller button is held are dropped.
const NAV_KEYS=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace','Tab','w','a','s','d']);
function padHeldNow(){
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  return pads.some(p => p.buttons.some(b => b && b.pressed) || p.axes.some(a => Math.abs(a) > .5));
}
document.addEventListener('keydown', e=>{
  if(NAV_KEYS.has(e.key) && !e.ctrlKey && !e.altKey && padHeldNow()){ logInput('key '+e.key+' dropped (controller held)'); e.preventDefault(); e.stopImmediatePropagation(); return; }
  if(INPUT_LOG && NAV_KEYS.has(e.key)) logInput('key '+e.key);
  // Debug: Ctrl+Shift+D writes the focused/open game's art and image load state to bridge.log
  if(e.ctrlKey && e.shiftKey && (e.key==='D'||e.key==='d')){
    const id = S.view==='game' ? S.game : focused?.dataset.id; const g=id&&G(id);
    const imgs=[...document.querySelectorAll('img.img')].filter(i=>!g || (i.closest('[data-id]')?.dataset.id===id) || S.view==='game')
      .slice(0,8).map(i=>`${i.complete?(i.naturalWidth?'ok':'broken'):'loading'} ${i.naturalWidth}x${i.naturalHeight} ${i.currentSrc||i.src}`);
    send({type:'log', text:'debug '+JSON.stringify({id, art:g&&g.art, imgs})});
    toast('Debug info written to bridge.log'); e.preventDefault(); return;
  }
  if(S.layers.at(-1)==='prompt' && prompt){
    if(e.key==='Enter'){ e.preventDefault(); return promptSubmit(); }
    if(e.key==='Escape'){ e.preventDefault(); return back(); }
    if(e.key==='Backspace'){ e.preventDefault(); prompt.text=prompt.text.slice(0,-1); return renderPrompt(focused?.dataset.k); }
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); prompt.text+=e.key; return renderPrompt(focused?.dataset.k); }
  }
  if(S.layers.at(-1)==='search'){
    if(e.key.length===1 && /[\w\- ]/.test(e.key) && !e.ctrlKey && !e.metaKey){ e.preventDefault(); query+=e.key; return renderSearch(focused?.dataset.k); }
    if(e.key==='Backspace'){ e.preventDefault(); if(query){ query=query.slice(0,-1); return renderSearch(focused?.dataset.k);} return back(); }
  }
  if(e.key==='Tab'){ e.preventDefault(); setInput('kbd'); return input(e.shiftKey?'lb':'rb'); }
  if(KEY_EXTRA[e.key] && !e.ctrlKey && !e.altKey){ e.preventDefault(); setInput('kbd'); return KEY_EXTRA[e.key](); }
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  const k=KEYMAP[e.key]; if(!k) return;
  e.preventDefault(); setInput('kbd'); input(k);
});
document.addEventListener('pointerdown', e=>{ if(e.pointerType==='mouse'||e.pointerType==='pen') setInput('mouse'); else if(e.pointerType==='touch') setInput('mouse'); });
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act],[data-f]'); if(!el) return;
  if(el.dataset.f!==undefined) setFocus(el,true);
  if(el.dataset.slider){ const s=el.querySelector('.slider'), r=s.getBoundingClientRect();
    if(e.clientX>=r.left-8 && e.clientX<=r.right+8){ const min=+el.dataset.min,max=+el.dataset.max,st=+el.dataset.step;
      const v=min+Math.round(((e.clientX-r.left)/r.width)*(max-min)/st)*st; S.set[el.dataset.slider]=Math.max(min,Math.min(max,v)); adjustSlider(el,0);} return; }
  act(el);
});
let lastPtr=null;
document.addEventListener('pointermove', e=>{
  if(e.pointerType!=='mouse') return;
  // Ignore tiny jitters; a real mouse movement switches prompts to mouse buttons.
  if(lastPtr && Math.hypot(e.clientX-lastPtr[0], e.clientY-lastPtr[1])>6) setInput('mouse');
  lastPtr=[e.clientX,e.clientY];
  const el=e.target.closest('[data-f]');
  if(el && el!==focused && root().contains(el)) { if(focused) focused.classList.remove('focus'); focused=el; el.classList.add('focus'); renderFooter(); }
});
document.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- status bar ----------
function tick(){ const d=new Date(); const c=$('#clock'); if(c) c.textContent=d.toLocaleTimeString([], LOOK.clock24?{hour:'2-digit',minute:'2-digit',hour12:false}:{hour:'numeric',minute:'2-digit'}); }
tick(); setInterval(tick, 10e3);

// ---------- boot ----------
if(host){ NOTIFS=[]; GAMES.length=0; }
updateBadge();
render();
applyLook();
loadHostInfo();
refreshStatus();
if(OVERLAY){ document.body.classList.add('overlay','ov-closed'); NOTIFS=[]; }
if(/[?&]overlay=full/.test(location.search)){ document.documentElement.classList.add('ovfull'); document.body.classList.add('ovfull'); }
applyProfile();
loadProfile();
loadLibrary();
if(!OVERLAY){ loadAccounts(true); loadUpdateStatus(); }
else { S.qtab='quick'; openLayer('qam'); }
requestAnimationFrame(pollPads);
send({type:'ready'});
</script>
</body>
