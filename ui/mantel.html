<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantel</title>
<!--
  Mantel on Windows (Ember's Desktop Mode), built to look and work like Mantel on Hearth OS
  (hosts/linux/desktop/shell: Bar.qml, Launcher.qml, QuickAccess.qml, PowerMenu.qml, Wallpaper.qml).
  One page, several windows, picked with ?part=:
    bar       the floating taskbar along the bottom
    launcher  the app launcher (search, every app, power)
    quick     Quick Access (volume, brightness, toggles, performance, actions), from the right edge
    power     the power menu
    radial    the Hearth menu (the Xbox button)
    help      the controller's controls (a tap of View)
    keyboard  Hearth's on-screen keyboard (Keyboard.qml), docked above the taskbar
    desktop   full Mantel's desktop: the wallpaper (the Hearth fireside, Lava, Aurora, or a picture) and the
              desktop icons (Desktop.qml: your Desktop folder and the Public desktop)
    menu      Hearth's right-click menu (PopMenu.qml), for the taskbar, the launcher and the desktop
    clock     the clock's panel (ClockPanel.qml): notifications, Do Not Disturb and the calendar
    clip      clipboard history (Clipboard.qml), from Windows' own history
    dialog    the desktop's small questions and details (DeskDialog.qml): rename, new folder, properties
  Icons come from Hearth's own set (mantel-icons.js, made from hosts/linux/desktop/shell/icons).
  What's still different from Hearth OS, and why: docs/MANTEL-PARITY.md.
  Hosted by Ember (Mantel/MantelHost.cs) in WebView2. Windows give each window its rounded shape; this page
  draws what's inside. Calls the same bridge as the main UI ("call"), plus "mantel" messages for windows
  and apps. Opens in a normal browser too, with sample data (add &preview=1 to see the shape).
-->
<style>
:root{
  --bg:#0f0b09; --bg2:#17110e; --panel:#1c1512; --panel2:#261d18; --panel3:#33271f; --line:#3b2e26;
  --text:#f4ece3; --muted:#a69484; --danger:#ff5d5d; --ember:#ff8a3d; --flame:#ffd166;
  --accent:#ff8a3d; --accentInk:#2a1206; --glass:rgba(28,21,18,.97);
  --quick:140ms; --calm:260ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--panel);color:var(--text);font:14px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus{outline:none}

/* ---------------- taskbar (Bar.qml): a floating rounded bar; the window's shape matches .barbox ---------------- */
html.bar,body.bar{background:var(--bg)}
.barbox{position:fixed;top:4px;left:8px;right:8px;bottom:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px}
.bb{height:44px;min-width:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;flex:none;transition:background var(--quick)}
.bb:hover{background:var(--panel3)}
.bb.active{background:var(--panel2)}
.bb.active:hover{background:var(--panel3)}
.bb.run::after,.bb.active::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:3px;border-radius:2px;background:var(--muted);transition:width var(--quick),height var(--quick)}
.bb.run.many::after{width:10px}
.bb.active::after{width:16px;background:var(--accent)}
.bb.narrow{min-width:30px;width:30px}
.bb.wide{padding:0 10px}
.bb .logo{width:32px;height:32px}
.bb img.ic,.bb .gen{width:28px;height:28px}
.bb.narrow img{width:20px;height:20px}
.gen{border-radius:7px;background:var(--panel3);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--flame)}
.bb .lbl{font-size:13px}
.bb svg{width:18px;height:18px}
.sep{width:1px;height:24px;background:var(--line);flex:none}
.wins{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.fill{flex:1;min-width:0}
.ticons{display:flex;gap:6px;align-items:center}
.bclock{height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 10px;line-height:1.2;flex:none;transition:background var(--quick)}
.bclock:hover{background:var(--panel3)}
/* virtual desktops (DeskSwitcher.qml): one small button per desktop, the one you're on lit */
.desks{display:flex;gap:3px;padding:4px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);flex:none}
.desks:empty{display:none}
.dk{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--muted);transition:background var(--quick)}
.dk:hover{background:var(--panel3)}
.dk.on{background:var(--accent);color:var(--accentInk);font-weight:700}
body.portrait .desks{flex-direction:column}
/* the notifications bell: a dot for ones you haven't seen */
.bell .dot{position:absolute;left:calc(50% + 1px);top:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);border:1px solid var(--panel);color:var(--accentInk);font:700 10px/14px "Segoe UI",system-ui,sans-serif;font-style:normal;text-align:center}
/* Show desktop: the thin strip at the very end of the bar (Windows' corner) */
.sdesk{flex:none;width:8px;height:36px;border-radius:3px;border:1px solid transparent;margin-left:2px}
.sdesk:hover{background:var(--panel3);border-color:var(--line)}
body.portrait .sdesk{width:32px;height:8px;margin:2px 0 0}
/* a pinned app being dragged along the bar, and where it would land */
.bb.dragging{opacity:.75;z-index:5;transition:none}
.bb.drop-before::before,.bb.drop-after::before{content:"";position:absolute;top:4px;bottom:4px;width:3px;border-radius:1px;background:var(--accent)}
.bb.drop-before::before{left:-4px}
.bb.drop-after::before{right:-4px}
body.portrait .bb.drop-before::before,body.portrait .bb.drop-after::before{left:4px;right:4px;width:auto;height:3px;top:auto;bottom:auto}
body.portrait .bb.drop-before::before{top:-4px}
body.portrait .bb.drop-after::before{bottom:-4px}
.bell.dnd svg{color:var(--muted)}
.bclock b{font-size:14px;font-weight:700}
.bclock small{font-size:11px;color:var(--muted)}
.gm{height:36px;border-radius:10px;padding:0 14px;background:var(--accent);color:var(--accentInk);font-weight:700;font-size:13px;flex:none;transition:filter var(--quick)}
.gm:hover{filter:brightness(1.12)}
/* upright screen: the bar runs down the left side (6 in from the left, 4 from the right, 8 top and bottom) */
body.portrait .barbox{top:8px;bottom:8px;left:6px;right:4px;flex-direction:column;padding:8px 0}
body.portrait .wins,body.portrait .ticons{flex-direction:column}
body.portrait .sep{width:28px;height:1px}
body.portrait .bb.narrow{width:44px;height:30px}
body.portrait .bb.wide{padding:0}
body.portrait .bb .lbl{display:none}
body.portrait .bb.run::after,body.portrait .bb.active::after{bottom:auto;left:1px;top:50%;transform:translateY(-50%);width:3px;height:5px}
body.portrait .bb.run.many::after{width:3px;height:10px}
body.portrait .bb.active::after{width:3px;height:16px}
body.portrait .bclock{padding:0;width:44px;align-items:center}
body.portrait .bclock b{font-size:13px}
body.portrait .bclock small{display:none}
body.portrait .gm{width:44px;height:44px;padding:0;display:grid;place-items:center}
body.portrait .gm .gmt{display:none}
.gm .gmi{display:none}
body.portrait .gm .gmi{display:block}

/* ---------------- launcher (Launcher.qml): the box in the middle of a dimmed screen ---------------- */
.box{position:fixed;inset:0;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:22px}
.search{height:48px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;flex:none}
.search.focus{border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:17px}
.search input::placeholder{color:var(--muted)}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;align-content:start;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent}
.cell{height:112px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px;margin:4px;padding:0 8px;border:1px solid transparent;cursor:pointer}
.cell:hover{background:var(--panel2)}
.cell.cur{background:var(--panel3);border-color:var(--accent)}
.cell img,.cell .gen{width:48px;height:48px}
.cell .gen{border-radius:12px;font-size:20px}
.cell span{font-size:12px;text-align:center;line-height:1.25;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;width:100%}
/* pinned to the taskbar (Launcher.qml: a small muted pin in the corner) */
.cell .pinmark{position:absolute;top:12px;right:12px;width:14px;height:14px;color:var(--muted);display:grid;place-items:center}
.cell .pinmark svg{width:14px;height:14px}
.none{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:14px;padding-top:120px}
/* the launcher's sections (Apps, Games, Windows): lit when shown, ringed when the D-pad is on them */
.ltabs{display:flex;gap:8px;align-items:center;flex:none}
.ltab{height:38px;border-radius:10px;padding:0 18px;background:var(--panel2);font-size:14px;transition:background var(--quick)}
.ltab:hover{background:var(--panel3)}
.ltab.on{background:var(--accent);color:var(--accentInk);font-weight:700}
.ltabs.nav .ltab.on{box-shadow:0 0 0 2px var(--text)}
.ltabs .hint{margin-left:auto;color:var(--muted);font-size:12px}
.grid.nav .cell.cur{border-color:var(--line)}
/* a game: its cover (its first letter until the picture is in, or without one) */
.cell.game{height:236px}
.cell.game .cover{width:120px;height:168px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;color:var(--muted);font-size:40px;overflow:hidden;flex:none;position:relative}
.cell.game .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.ab{height:40px;border-radius:10px;padding:0 16px;background:var(--panel2);font-size:13px;transition:background var(--quick)}
.ab:hover{background:var(--panel3)}
.ab.primary{background:var(--accent);color:var(--accentInk);font-weight:700}
.ab.primary:hover{background:var(--accent);filter:brightness(1.12)}
.loading{grid-column:1/-1;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:center;padding-top:120px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel3);border-top-color:var(--accent);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

/* ---------------- Quick Access (QuickAccess.qml) ---------------- */
.panel{position:fixed;inset:0;border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:18px;overflow-y:auto;scrollbar-width:none}
/* slides in from the right edge like Hearth's (Theme.calm, OutCubic) */
.panel.enter{animation:qin var(--calm) cubic-bezier(.33,1,.68,1)}
@keyframes qin{from{transform:translateX(calc(100% + 20px))}to{transform:none}}
.panel::-webkit-scrollbar{display:none}
.qcol{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center}
.qhead b{font-size:26px;font-weight:600;flex:1}
.qhead span{display:flex;align-items:center;gap:6px;font-size:15px}
.f{border-radius:12px;border:2px solid transparent;transition:border-color var(--quick),background var(--quick)}
.f.focus{border-color:var(--accent)}
.slider{height:64px;background:var(--panel2);display:flex;align-items:center;gap:12px;padding:0 16px 0 14px}
.slider .sic{display:grid;place-items:center;cursor:pointer}
.slider .sic svg{width:22px;height:22px}
.slider .sb{flex:1;display:flex;flex-direction:column;gap:8px}
.slider .sr{display:flex;justify-content:space-between;font-size:14px}
.slider .sr small{color:var(--muted);font-size:13px}
.track{position:relative;height:8px;border-radius:4px;background:var(--panel3);cursor:pointer}
.track::before{content:"";position:absolute;inset:-14px 0}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--ember),var(--flame));min-width:8px}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tog{height:100px;background:var(--panel2);display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;text-align:left;gap:2px}
.tog svg{width:22px;height:22px}
.tog .grow{flex:1}
.tog b{font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tog small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tog.lit{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.tog.lit svg{color:var(--accent)}
.tog.off{opacity:.5}
.qlabel{color:var(--muted);font-size:13px;margin-bottom:-8px}
.ch3{display:flex;gap:8px}
.choice{flex:1;height:44px;background:var(--panel2);font-size:13px}
.choice.lit{background:var(--accent);color:var(--accentInk);font-weight:600}
.ac4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{height:76px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px}
.act svg{width:22px;height:22px}
.act.accent{background:var(--accent);color:var(--accentInk)}

/* ---------------- power menu (PowerMenu.qml) ---------------- */
.card{position:fixed;inset:0;border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:6px}
.card h2{font-size:20px;font-weight:600;margin:0 0 6px 4px}
.pi{height:52px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;gap:14px;padding:0 16px;font-size:15px;text-align:left;transition:background var(--quick)}
.pi:hover{background:var(--panel3)}
.pi.lit{background:var(--accent);color:var(--accentInk);font-weight:600}

/* ---------------- the Hearth menu (RadialMenu.qml): a ring; the window is round ---------------- */
html.radial,body.radial{background:var(--glass)}
.ring{position:fixed;inset:0;border-radius:50%;background:var(--glass);border:1px solid var(--line)}
/* opens with Hearth's pop: scale .85 → 1 (OutBack, Theme.calm) and a quick fade */
.ring.pop{animation:rpop var(--calm) cubic-bezier(.34,1.56,.64,1),rfade var(--quick) ease-out}
@keyframes rpop{from{transform:scale(.85)}to{transform:none}}
@keyframes rfade{from{opacity:0}to{opacity:1}}
.ring .warm{position:absolute;left:22.5%;top:22.5%;width:55%;height:55%;background:url(mantel-img/ember-glow.png) center/100% 100% no-repeat;opacity:.18}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;pointer-events:none}
.ring .mid img{width:16%;height:16%}
.ring .mid b{font-size:max(16px,5vmin);font-weight:600}
.ring .mid small{font-size:max(11px,2.8vmin);color:var(--muted)}
.slot{position:absolute;width:17%;height:17%;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;transition:transform var(--quick),background var(--quick)}
.slot:hover{background:var(--panel3)}
.slot.lit{background:var(--accent);color:var(--accentInk);border-color:var(--accent);transform:scale(1.14)}
.slot svg{width:42%;height:42%}
/* ---------------- controls (Help.qml) ---------------- */
.help{position:fixed;inset:0;border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:10px}
.help .hh{display:flex;align-items:center;gap:12px}
.help .hh img{width:36px;height:36px}
.help h2{font-size:22px;font-weight:600}
.help p{color:var(--muted);font-size:13px}
.help .pairs{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;margin-top:6px}
.help .pairs b{color:var(--accent);font-weight:600;white-space:nowrap}

/* ---------------- on-screen keyboard (Keyboard.qml): docked above the taskbar; the window's shape matches .kbox ---------------- */
html.keyboard,body.keyboard{background:var(--glass)}
.kbox{position:fixed;top:6px;left:8px;right:8px;bottom:0;border-radius:18px;background:var(--glass);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.krow{flex:1;display:flex;gap:8px;min-height:0}
.key{flex:1 1 0;border-radius:10px;background:var(--panel2);border:2px solid transparent;display:grid;place-items:center;font-weight:500;font-size:var(--kf,18px);transition:border-color 90ms;min-width:0;overflow:hidden;white-space:nowrap}
.key:active{background:var(--panel3)}
.key.lit{background:var(--panel3);border-color:var(--accent)}
.key.on{background:var(--accent);color:var(--accentInk)}
.kfoot{display:flex;align-items:center;gap:12px;flex:none}
.kfoot span{flex:1;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfoot button{color:var(--accent);font-weight:600;font-size:13px;padding:4px 8px;margin:-4px -8px}

/* ---------------- desktop (Wallpaper.qml) ---------------- */
html.desktop,body.desktop{background:var(--bg)}
.layer{position:fixed;inset:0;overflow:hidden}
.pic{position:fixed;inset:0;background:center/cover no-repeat}
/* the Hearth fireside: warm darkness lit from below by a slowly breathing fire, with embers drifting up */
.fire{background:linear-gradient(180deg,#0b0807 0%,#17110e 60%,#1f140e 100%)}
.glow{position:absolute;background:url(mantel-img/ember-glow.png) center/100% 100% no-repeat}
.glow.wide{width:150vw;height:110vh;left:-25vw;top:calc(100vh - 110vh * .45);opacity:.32;animation:breathe 7.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.30}46%{opacity:.42}}
.glow.core{width:70vw;height:60vh;left:15vw;top:calc(100vh - 60vh * .42);opacity:.22;animation:flicker 3.8s ease-in-out infinite,sway 11.3s ease-in-out infinite}
@keyframes flicker{0%{opacity:.22}18%{opacity:.30}47%{opacity:.20}60%{opacity:.27}100%{opacity:.18}}
@keyframes sway{0%,100%{transform:translateX(0)}46%{transform:translateX(2vw)}}
.spark{position:absolute;bottom:0;width:4px;height:4px;border-radius:2px;opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--d)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:.55}50%{transform:translate(var(--w),-45vh)}85%{opacity:.4}100%{transform:translate(calc(var(--w) * -0.6),-90vh);opacity:0}}
/* Lava: big soft blobs drifting slowly */
.lava{background:#120a09}
.blob{position:absolute;opacity:.85;background:center/100% 100% no-repeat;animation:bdrift var(--t) ease-in-out infinite,bscale var(--s) ease-in-out infinite alternate}
@keyframes bdrift{0%,100%{translate:0 0}33%{translate:var(--dx) var(--dy)}77%{translate:calc(var(--dx) * -1) calc(var(--dy) * -1)}}
@keyframes bscale{from{scale:.9}to{scale:1.18}}
/* Aurora: warm ribbons under twinkling stars */
.aurora{background:linear-gradient(180deg,#0a0609,#1e0f0d)}
.star{position:absolute;border-radius:50%;background:#fff4e0;animation:twinkle var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes twinkle{from{opacity:var(--o)}to{opacity:.15}}
.rib{position:absolute;width:160vw;height:45vh;left:-30vw;background:center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);animation:ribbon var(--t) ease-in-out infinite alternate,ribfade calc(var(--t) * .66) ease-in-out infinite alternate}
@keyframes ribbon{from{transform:translateX(-15vw)}to{transform:translateX(15vw)}}
@keyframes ribfade{from{opacity:var(--o)}to{opacity:calc(var(--o) * .5)}}
.ridge{position:absolute;left:0;right:0;bottom:0;height:12vh;background:linear-gradient(180deg,transparent,#0c0607 40%)}
@media (prefers-reduced-motion:reduce){.spark,.blob,.star,.rib{animation:none}.glow.core{animation:none}}
/* Settings › Appearance › Reduce motion: the wallpaper stands still, like on Hearth OS */
body.still .spark,body.still .blob,body.still .star,body.still .rib,body.still .glow{animation:none}
body.still .spark{display:none}

/* ---------------- right-click menu (PopMenu.qml): the window is the card ---------------- */
html.menu,body.menu{background:var(--glass)}
.pm{position:fixed;inset:0;border-radius:14px;background:var(--glass);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;overflow:hidden}
.pm.pop{animation:pmin var(--quick) cubic-bezier(.33,1,.68,1)}
.pm.above{transform-origin:bottom center}
@keyframes pmin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.pm .pt{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.pm .pt span{overflow:hidden;text-overflow:ellipsis}
.pm .pt button{color:var(--muted);display:grid;place-items:center;margin:-8px 0 -8px -8px;padding:8px}
.pm .pt svg{width:14px;height:14px}
.pm .ps{height:9px;flex:none;position:relative}
.pm .ps::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:1px;background:var(--line)}
.pm .pi2{height:40px;flex:none;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;text-align:left;width:100%}
.pm .pi2 svg{width:18px;height:18px}
.pm .pi2 .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note2.nav{border-color:var(--accent)}

.note2 .nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.note2 .nm{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.note2 .nm span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note2 .ns{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hr{height:1px;background:var(--line);flex:none}

  if(PART==='launcher'){ L.query=''; L.cur=0; L.onTabs=false; const i=$('.search input'); if(i){ i.value=''; } renderTabs(); renderGrid(); setTimeout(()=>{ const i=$('.search input'); i&&i.focus(); }, 30); if(!ST.apps) mantel('apps'); mantel('games'); if(!ST.winApps) mantel('windowsApps'); }
  if(PART==='quick'){ Qn.r=0; Qn.c=0; refreshStatus(); refreshDesk(); call('pad.status').then(p=>{ ST.mouseOn=!!p.mouseOn; renderQuick(); }).catch(()=>{}); renderQuick(); replay($('.panel'), 'enter'); }
  if(PART==='power'){ P.sel=0; renderPower(); }
  if(PART==='radial'){ R.sel=-1; R.keys.clear(); call('pad.status').then(p=>{ ST.mouseOn=!!p.mouseOn; renderRadial(); }).catch(()=>{}); renderRadial(); replay($('.ring'), 'pop'); }
  // Hearth's controls card closes by itself after 12 seconds.
  if(PART==='help'){ clearTimeout(helpTimer); helpTimer=setTimeout(()=>mantel('hidePanel'), 12000); }
  if(PART==='keyboard') renderKeyboard();
  if(PART==='clock'){ CK.nav=-1; const t=new Date(); CK.month=new Date(t.getFullYear(), t.getMonth(), 1); renderClock(); replay($('.cp'), 'enter'); call('notify.seen').catch(()=>{}); }
  if(PART==='clip'){ CB.cur=0; CB.confirm=false; refreshClip(); }
}
// Night light and the other desktop settings (Hearth Settings › Appearance), for Quick Access.
const refreshDesk = () => call('desktop.get').then(d => { ST.desk=d||null; if(PART==='quick') renderQuick(); }).catch(()=>{});
const refreshStatus = () => call('sys.status').then(s => { ST.status=s; if(PART==='bar') renderStatus(); if(PART==='quick') renderQuick(); }).catch(()=>{});

// ================================================================ desktop (Wallpaper.qml)
let shownWall = null;
function renderDesktop(){
  if(!$('#wall')){ document.body.innerHTML='<div id="wall"></div><div id="icons"></div>'; setupIcons(); }
  renderWall();
  refreshIcons();
}
function renderWall(){
  const w = ST.wallpaper || 'anim:fireside';
  document.body.classList.toggle('still', ST.still);
  if(shownWall===w) return;
  shownWall = w;
  const wall = $('#wall');
  if(w==='anim:lava'){
    const blobs=[['red',.22,.62,.62,.10,.08,23],['orange',.52,.34,.55,-.12,.10,29],['gold',.74,.66,.58,-.08,-.12,31],['plum',.80,.22,.40,-.10,.06,26],['orange',.30,.20,.36,.12,.10,34],['red',.58,.90,.44,.06,-.12,27]];
    wall.innerHTML=`<div class="layer lava">${blobs.map(([c,x,y,s,dx,dy,t])=>{ const size=`calc(100vh * ${s*1.6})`;
      return `<div class="blob" style="background-image:url(mantel-img/blob-${c}.png);width:${size};height:${size};left:calc(${x*100}vw - ${size} / 2);top:calc(${y*100}vh - ${size} / 2);--dx:${dx*100}vw;--dy:${dy*100}vh;--t:${t*3}s;--s:${t*1.8}s"></div>`; }).join('')}</div>`;
  } else if(w==='anim:aurora'){
    const stars=Array.from({length:90},(_,i)=>{ const rx=(i*0.6180339)%1, ry=(i*0.3819660*1.7)%1, sz=2+(i%3);
      return `<div class="star" style="left:${rx*100}vw;top:${ry*85}vh;width:${sz}px;height:${sz}px;--o:${(0.3+(i%5)*0.12).toFixed(2)};--t:${(1.8+(i%7)*0.3).toFixed(1)}s;--d:${((i*397)%4000)/1000}s"></div>`; }).join('');
    const ribs=[['a',.20,40,.75],['b',.30,52,.55],['c',.38,46,.6]].map(([k,y,t,o])=>`<div class="rib" style="background-image:url(mantel-img/aurora-${k}.png);top:${y*100}vh;--t:${t}s;--o:${o}"></div>`).join('');
    wall.innerHTML=`<div class="layer aurora">${stars}${ribs}<div class="ridge"></div></div>`;
  } else if(w.startsWith('anim:')){   // the Hearth fireside (Hearth OS's default)
    const sparks=Array.from({length:24},(_,i)=>{ const x=25+((i*37)%50), t=6+((i*7)%6), w=((i*53)%60)-30;
      return `<div class="spark" style="left:${x}vw;background:${i%2?'var(--ember)':'var(--flame)'};--t:${t}s;--d:${-((i*1.7)%t).toFixed(1)}s;--w:${w}px"></div>`; }).join('');
    wall.innerHTML=`<div class="layer fire"><div class="glow wide"></div><div class="glow core"></div>${sparks}</div>`;
  } else if(w.startsWith('custom:')){   // a picture you chose (kept in %LOCALAPPDATA%\Nimbus\wallpapers, served by Ember)
    wall.innerHTML=`<div class="pic" style="background-image:url('https://hearth-walls.local/${esc(encodeURIComponent(w.slice(7)))}')"></div>`;
  } else {
    wall.innerHTML=`<div class="pic" style="background-image:url('wallpapers/${esc(w)}.jpg')"></div>`;
  }
}


// ---------------------------------------------------------------- desktop icons (Desktop.qml, full Mantel)
// Your Desktop folder and the Public desktop, working like Windows' desktop: click selects, Ctrl+click adds or
// removes one, Shift+click selects a run, drag a box on the empty desktop to select several; double-click opens (a
// tap on a selected icon opens on a touchscreen). Drag icons to move them (the places are remembered). Right-click
// or press and hold for Open, Open with, Cut, Copy, Rename, Delete (to the Recycle Bin) and Properties; the
// background's menu has New folder, New text document, Paste, Sort by, Refresh and the display settings.
// Keyboard: arrows (Shift extends), Enter opens, F2 renames, Delete (Shift+Delete for good, after asking), Ctrl+A,
// Ctrl+C / Ctrl+X / Ctrl+V (Windows' clipboard, so File Explorer and other apps paste them too), F5, the Menu key
// (or Shift+F10), Ctrl+Shift+N a new folder. Over Explorer, Windows draws its own desktop instead.
const DK = {entries:[], dir:'', sel:'', picked:[], cut:[], seq:0, drag:null, press:null, band:null};
const CELL_W=104, CELL_H=112, BAR=60;
const deskArea = () => { const p=innerHeight>innerWidth; const x=p?BAR+10:12, y=12; return {x, y, w:innerWidth-x-12, h:innerHeight-y-(p?12:BAR+10)}; };
const deskGrid = () => { const a=deskArea(); return {cols:Math.max(1,Math.floor(a.w/CELL_W)), rows:Math.max(1,Math.floor(a.h/CELL_H))}; };
const iconsOn = () => ST.full && ST.desktopIcons;
function refreshIcons(){
  if(PART!=='desktop') return;
  if(!iconsOn()){ DK.entries=[]; return renderIcons(); }
  const n=++DK.seq, g=deskGrid();
  call('desk.icons', g).then(r=>{ if(n!==DK.seq || DK.drag) return; DK.dir=(r&&r.dir)||''; DK.entries=(r&&r.entries)||[];
    if(DK.sel && !DK.entries.some(e=>e.name===DK.sel)) DK.sel='';
    DK.picked=DK.picked.filter(x=>DK.entries.some(e=>e.name===x)); DK.cut=DK.cut.filter(x=>DK.entries.some(e=>e.name===x));
    renderIcons(); })
    .catch(()=>{ if(!host){ renderIcons(); } });
}
const thumbUrl = (e, s) => `https://hearth-files.local/thumb?p=${encodeURIComponent(e.path)}&s=${s}${/\.(png|jpe?g|gif|webp|bmp)$/i.test(e.name)?'':'&icon=1'}`;
function renderIcons(){
  const el=$('#icons'); if(!el) return;
  const a=deskArea();
  el.innerHTML = (iconsOn()?DK.entries:[]).map(e=>`<div class="di ${DK.picked.includes(e.name)?'sel':''} ${DK.sel===e.name?'focus':''} ${DK.cut.includes(e.name)?'cut':''}" data-name="${esc(e.name)}" style="left:${a.x+e.col*CELL_W+4}px;top:${a.y+e.row*CELL_H+4}px">
    <div class="dpic">${host?`<img src="${thumbUrl(e, 96)}" alt="" onerror="this.outerHTML=IC('${e.dir?'folder':'file'}')">`:IC(e.dir?'folder':'file')}</div><div class="dl">${esc(e.label||e.name)}</div></div>`).join('');
}
const entryOf = name => DK.entries.find(e=>e.name===name) || null;
function paintPicks(){ document.querySelectorAll('.di').forEach(d=>{ d.classList.toggle('sel', DK.picked.includes(d.dataset.name)); d.classList.toggle('focus', d.dataset.name===DK.sel); }); }
// One icon picked (or none).
function deskSelect(name){ DK.sel=name||''; DK.picked=name?[name]:[]; paintPicks(); }
function deskToggle(name){ DK.sel=name; DK.picked=DK.picked.includes(name)?DK.picked.filter(x=>x!==name):DK.picked.concat([name]); paintPicks(); }
// Shift+click: everything between the focused icon and this one, down the columns.
function deskRange(name){
  const order=DK.entries.slice().sort((a,b)=>a.col-b.col||a.row-b.row).map(e=>e.name);
  const i=order.indexOf(DK.sel), j=order.indexOf(name);
  if(i<0||j<0) return deskSelect(name);
  DK.picked=order.slice(Math.min(i,j), Math.max(i,j)+1); paintPicks();
}
const picks = () => { const l=DK.entries.filter(e=>DK.picked.includes(e.name)); return l.length ? l : (entryOf(DK.sel) ? [entryOf(DK.sel)] : []); };
const what = l => l.length===1 ? '“'+(l[0].label||l[0].name)+'”' : l.length+' items';
const toast = t => mantel('toast', {text:t});
function deskOpen(e){
  if(!e) return;
  if(e.dir) return mantel('openApp', {app:'files', path:e.path});
  call('files.open', {path:e.path}).catch(err=>toast(err.message));
}
function deskRename(e){
  if(!e) return;
  ask('Rename “'+(e.label||e.name)+'”', e.name, 'Rename', v=>{
    if(v===e.name) return;
    call('files.rename', {path:e.path, name:v}).then(r=>{
      const nn=(r&&r.path?r.path.split('\\').pop():v); deskSelect(nn);
      const g=deskGrid(); return call('desk.place', {name:nn, col:e.col, row:e.row, cols:g.cols, rows:g.rows});
    }).then(()=>refreshIcons()).catch(err=>toast(err.message));
  });
}
function deskTrash(list){
  if(!list || !list.length) return;
  call('files.trash', {paths:list.map(e=>e.path)}).then(()=>{ toast('Moved '+what(list)+' to the Recycle Bin'); deskSelect(''); refreshIcons(); }).catch(err=>toast(err.message));
}
// Shift+Delete: gone for good, after asking (Cancel is picked first).
function deskDeleteForGood(list){
  if(!list || !list.length) return;
  confirmBox('Delete '+what(list)+' for good?', "They won't go to the Recycle Bin, so this can't be undone.", 'Delete', ()=>{
    call('files.delete', {paths:list.map(e=>e.path)}).then(()=>{ deskSelect(''); refreshIcons(); }).catch(err=>toast(err.message));
  });
}
// Cut / Copy: Windows' clipboard (a file list, "cut" marked), so File Explorer and other apps can paste them.
function deskCopy(list, cut){
  if(!list || !list.length) return;
  call('files.clipSet', {paths:list.map(e=>e.path), cut}).then(()=>{ DK.cut=cut?list.map(e=>e.name):[]; renderIcons(); toast((cut?'Cut ':'Copied ')+what(list)); }).catch(err=>toast(err.message));
}
function deskPaste(){
  if(!DK.dir) return toast("There's no Desktop folder to paste into");
  call('files.clipGet').then(r=>{
    const paths=(r&&r.paths)||[];
    if(!paths.length) return toast("There's nothing to paste. Copy files first");
    return call('files.paste', {paths, dest:DK.dir, move:!!r.cut}).then(()=>{ if(r.cut){ DK.cut=[]; call('files.clipClear').catch(()=>{}); } setTimeout(refreshIcons, 600); });
  }).catch(err=>toast(err.message));
}
const human = n => { const u=['bytes','KB','MB','GB','TB']; let i=0; n=+n||0; while(n>=1024 && i<u.length-1){ n/=1024; i++; } return (i===0?n:n.toFixed(n<10?1:0))+' '+u[i]; };
function deskProps(e){
  if(!e) return;
  call('files.info', {path:e.path}).then(r=>{
    const rows=[['Kind', e.launcher?'Shortcut':r.dir?'Folder':(r.type||'File')], ['Size', human(r.size)+(r.dir?` (${r.files} files, ${r.folders} folders${r.partial?', still counting':''})`:'')],
      ['Where', r.location||''], ['Changed', new Date(r.modified).toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'})]];
    if(r.company) rows.push(['Made by', r.company]);
    if(r.version) rows.push(['Version', r.version]);
    if(r.readOnly || r.hidden) rows.push(['Attributes', [r.readOnly?'Read-only':'', r.hidden?'Hidden':''].filter(x=>x).join(', ')]);
    if(e.public) rows.push(['Shown for', 'Everyone on this PC (Public desktop)']);
    info(e.label||e.name, rows);
  }).catch(err=>toast(err.message));
}
function deskNewFolder(){
  ask('New folder on the desktop', 'New folder', 'Create', v=>{
    call('desk.newFolder', {name:v}).then(r=>{ if(!ST.desktopIcons) toast('Made “'+r.name+'” in your Desktop folder'); deskSelect(r.name); refreshIcons(); }).catch(err=>toast(err.message));
  });
}
// A new empty text document, then its name to change (like Windows' New › Text Document).
function deskNewText(){
  call('desk.newText').then(r=>{
    deskSelect(r.name);
    const g=deskGrid();
    return call('desk.icons', g).then(x=>{ DK.entries=(x&&x.entries)||[]; renderIcons(); const e=entryOf(r.name); if(e) deskRename(e); });
  }).catch(err=>toast(err.message));
}
function itemMenu(e, x, y){
  if(!DK.picked.includes(e.name)) deskSelect(e.name); else { DK.sel=e.name; paintPicks(); }
  const list=picks(), multi=list.length>1, items=[];
  if(multi) items.push({label:'Open '+list.length+' items', icon:'open', run:()=>list.forEach(deskOpen)});
  else items.push({label:'Open', icon:'open', run:()=>deskOpen(e)});
  if(!multi && !e.dir && !e.launcher) items.push({label:'Open with…', icon:'open', run:()=>call('files.openWith', {path:e.path}).catch(err=>toast(err.message))});
  if(!multi) items.push({label:'Show in Files', icon:'folder', run:()=>mantel('openApp', {app:'files', path:e.path.replace(/\\[^\\]*$/, '')})});
  items.push({separator:true},
    {label:'Cut', icon:'file', run:()=>deskCopy(list, true)},
    {label:'Copy', icon:'clipboard', run:()=>deskCopy(list, false)});
  if(!multi) items.push({label:'Rename', icon:'edit', run:()=>deskRename(e)});
  items.push({separator:true}, {label:'Move to the Recycle Bin', icon:'trash', danger:true, run:()=>deskTrash(list)});
  if(!multi) items.push({separator:true}, {label:'Properties', icon:'info', run:()=>deskProps(e)});
  showMenu(x, y, {title:multi?list.length+' items':(e.label||e.name)}, items);
}
function backgroundMenu(x, y){
  deskSelect('');
  const g=deskGrid();
  const sorts=[['name','Name'],['type','Type'],['size','Size'],['date','Date modified']].map(([k,l])=>({label:l, checked:ST.sortBy===k?true:undefined,
    run:()=>{ ST.sortBy=k; call('desk.arrange', Object.assign({by:k}, g)).then(()=>refreshIcons()).catch(err=>toast(err.message)); }}));
  const list=[{label:'New folder', icon:'plus', run:deskNewFolder}, {label:'New text document', icon:'file', run:deskNewText},
    {label:'Paste', icon:'clipboard', run:deskPaste}, {separator:true}];
  if(iconsOn()){ list.push({label:'Sort by', icon:'grid', sub:sorts}); list.push({label:'Refresh', icon:'restart', run:refreshIcons}); }
  list.push({label:'Show desktop icons', checked:ST.desktopIcons, run:()=>{ ST.desktopIcons=!ST.desktopIcons; call('desk.set', {key:'desktopIcons', value:ST.desktopIcons}).catch(()=>{}); refreshIcons(); }});
  list.push({separator:true},
    {label:'Change wallpaper', icon:'palette', run:()=>mantel('settings', {page:'appearance'})},
    {label:'Display settings', icon:'display', run:()=>mantel('settings', {page:'display'})},
    {label:'Open Files', icon:'folder', run:()=>mantel('openApp', {app:'files', path:DK.dir||''})});
  showMenu(x, y, {title:'Desktop'}, list);
}
function deskStep(dc, dr, extend){
  if(!DK.entries.length) return;
  const cur=entryOf(DK.sel);
  if(!cur) return deskSelect(DK.entries.slice().sort((a,b)=>a.col-b.col||a.row-b.row)[0].name);
  let best=null, bestD=1e9;
  for(const e of DK.entries){
    if(e===cur) continue;
    const ddc=e.col-cur.col, ddr=e.row-cur.row;
    if((dc && Math.sign(ddc)!==dc) || (dr && Math.sign(ddr)!==dr)) continue;
    const d = dc ? Math.abs(ddc)*10+Math.abs(ddr)*11 : Math.abs(ddr)*10+Math.abs(ddc)*11;
    if(d<bestD){ bestD=d; best=e; }
  }
  if(!best) return;
  if(extend){ DK.sel=best.name; if(!DK.picked.includes(best.name)) DK.picked=DK.picked.concat([best.name]); paintPicks(); }
  else deskSelect(best.name);
}
function deskKey(e){
  const cur=entryOf(DK.sel), k=e.key.toLowerCase();
  if(e.key==='ContextMenu' || (e.key==='F10' && e.shiftKey)){
    e.preventDefault();
    if(cur){ const a=deskArea(); itemMenu(cur, a.x+cur.col*CELL_W+CELL_W/2, a.y+cur.row*CELL_H+CELL_H/2); } else backgroundMenu(innerWidth/2, innerHeight/2);
    return;
  }
  if(k==='n' && e.ctrlKey && e.shiftKey){ e.preventDefault(); return deskNewFolder(); }
  if(e.ctrlKey && !e.shiftKey && !e.altKey){
    if(k==='a'){ e.preventDefault(); DK.picked=DK.entries.map(x=>x.name); if(!DK.sel && DK.entries.length) DK.sel=DK.entries[0].name; return paintPicks(); }
    if(k==='c'){ e.preventDefault(); return deskCopy(picks(), false); }
    if(k==='x'){ e.preventDefault(); return deskCopy(picks(), true); }
    if(k==='v'){ e.preventDefault(); return deskPaste(); }
  }
  switch(e.key){
    case 'ArrowLeft': deskStep(-1,0,e.shiftKey); break; case 'ArrowRight': deskStep(1,0,e.shiftKey); break;
    case 'ArrowUp': deskStep(0,-1,e.shiftKey); break; case 'ArrowDown': deskStep(0,1,e.shiftKey); break;
    case 'Enter': picks().forEach(deskOpen); break; case 'F2': deskRename(cur); break;
    case 'Delete': if(e.shiftKey) deskDeleteForGood(picks()); else deskTrash(picks()); break;
    case 'F5': refreshIcons(); break;
    case 'Escape': deskSelect(''); break;
    default: return;
  }
  e.preventDefault();
}
// Pointer: press selects (Ctrl / Shift add); a move past 8 px drags the icon(s), or on the empty desktop draws a
// selection box; letting go puts the icons in the nearest places; a press held for half a second without moving
// opens the menu (touch).
function setupIcons(){
  const el=$('#icons');
  el.addEventListener('pointerdown', e=>{
    const t=e.target.closest('.di'), name=t?t.dataset.name:'';
    const wasSel = !!t && DK.picked.includes(name);
    if(e.button===2) return;
    let pickOne=false;
    if(t){
      if(e.ctrlKey) deskToggle(name);
      else if(e.shiftKey) deskRange(name);
      else if(!wasSel) deskSelect(name);
      else { DK.sel=name; paintPicks(); pickOne=DK.picked.length>1; }
    } else {
      DK.bandBase = e.ctrlKey ? DK.picked.slice() : [];
      if(!e.ctrlKey) deskSelect('');
    }
    DK.press={x:e.clientX, y:e.clientY, t, name, wasSel, pickOne, touch:e.pointerType==='touch', moved:false, timer:setTimeout(()=>{ if(DK.press && !DK.press.moved){ const p=DK.press; DK.press=null; if(p.t) itemMenu(entryOf(p.name), p.x, p.y); else backgroundMenu(p.x, p.y); } }, 500)};
    (t||el).setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    const p=DK.press; if(!p) return;
    if(!p.moved && Math.hypot(e.clientX-p.x, e.clientY-p.y) > 8){
      p.moved=true; clearTimeout(p.timer);
      if(p.t){
        DK.drag=p;
        // The dragged icon and, when it's part of the selection, the others with it.
        const names=DK.picked.includes(p.name) ? DK.picked.slice() : [p.name];
        p.group=names.map(n=>{ const d=document.querySelector(`.di[data-name="${CSS.escape(n)}"]`); return d ? {n, d, ox:parseFloat(d.style.left), oy:parseFloat(d.style.top)} : null; }).filter(Boolean);
        p.group.forEach(g=>g.d.classList.add('drag'));
      } else if(iconsOn()){
        DK.band=document.createElement('div'); DK.band.className='band'; document.body.appendChild(DK.band);
      }
    }
    if(!p.moved) return;
    if(p.t && p.group){
      const dx=e.clientX-p.x, dy=e.clientY-p.y;
      p.group.forEach(g=>{ g.d.style.left=Math.max(0, Math.min(innerWidth-96, g.ox+dx))+'px'; g.d.style.top=Math.max(0, Math.min(innerHeight-104, g.oy+dy))+'px'; });
    } else if(DK.band){
      const x1=Math.min(p.x, e.clientX), y1=Math.min(p.y, e.clientY), x2=Math.max(p.x, e.clientX), y2=Math.max(p.y, e.clientY);
      Object.assign(DK.band.style, {left:x1+'px', top:y1+'px', width:(x2-x1)+'px', height:(y2-y1)+'px'});
      const a=deskArea();
      const hit=DK.entries.filter(en=>{ const l=a.x+en.col*CELL_W+4, t=a.y+en.row*CELL_H+4; return l<x2 && l+96>x1 && t<y2 && t+104>y1; }).map(en=>en.name);
      DK.picked=(DK.bandBase||[]).concat(hit.filter(n=>!(DK.bandBase||[]).includes(n)));
      if(hit.length) DK.sel=hit[hit.length-1];
      paintPicks();
    }
  });
  const up = e=>{
    const p=DK.press; DK.press=null;
    if(DK.band){ DK.band.remove(); DK.band=null; }
    if(!p) return;
    clearTimeout(p.timer);
    if(p.moved && p.t && p.group){
      const a=deskArea(), g=deskGrid();
      const moves=p.group.map(x=>({name:x.n,
        col:Math.max(0, Math.min(g.cols-1, Math.round((parseFloat(x.d.style.left)-4-a.x)/CELL_W))),
        row:Math.max(0, Math.min(g.rows-1, Math.round((parseFloat(x.d.style.top)-4-a.y)/CELL_H)))}));
      const req = moves.length===1 ? call('desk.place', Object.assign({}, moves[0], {cols:g.cols, rows:g.rows})) : call('desk.placeMany', {moves, cols:g.cols, rows:g.rows});
      req.catch(err=>toast(err.message)).finally(()=>{ DK.drag=null; refreshIcons(); });
      if(!host){ moves.forEach(m=>{ const en=entryOf(m.name); if(en){ en.col=m.col; en.row=m.row; } }); DK.drag=null; renderIcons(); }
      return;
    }
    if(e.type!=='pointerup' || !p.t || e.ctrlKey || e.shiftKey) return;
    if(p.pickOne) deskSelect(p.name);
    else if(p.wasSel && p.touch) deskOpen(entryOf(p.name));   // a tap on a selected icon opens it (a mouse double-clicks)
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('dblclick', e=>{ const t=e.target.closest('.di'); if(t) deskOpen(entryOf(t.dataset.name)); });
  el.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(DK.press){ clearTimeout(DK.press.timer); DK.press=null; }

// ================================================================ shared: right-click menus and dialogs
// The menu is its own window (part=menu, PopMenu.qml's look); the page that opens it keeps what each item does and
// hears back which one was chosen (mantel.menuPick). Items: {label, icon, run, danger, enabled:false, checked, sub:[…]}
// or {separator:true}.
let MENU_RUN = {}, MENU_SEQ = 0;
function wireItems(list){
  return list.map(it=>{
    if(it.separator) return {separator:true};
    const id='m'+(++MENU_SEQ); if(it.run) MENU_RUN[id]=it.run;
    return {id, label:it.label, icon:it.icon||'', danger:!!it.danger, enabled:it.enabled!==false, checked:it.checked, sub:it.sub?wireItems(it.sub):undefined};
  });
}
const menuHeight = (title, items) => 12 + (title?26:0) + items.reduce((h,it)=>h+(it.separator?9:40), 0);
// (x, y): where in this window (CSS pixels), or on the screen (screen pixels) with screenPx.
function showMenu(x, y, opts, list, screenPx){
  MENU_RUN={};
  const items=wireItems(list), dpr=window.devicePixelRatio||1;
  if(!screenPx){ x=Math.round((window.screenX+x)*dpr); y=Math.round((window.screenY+y)*dpr); }
  mantel('menu', {x, y, above:!!(opts&&opts.above), title:(opts&&opts.title)||'', items, h:menuHeight(opts&&opts.title, items)});
  if(!host) window.lastMenu={x, y, opts, items};
}
// The desktop's small questions and details (part=dialog, DeskDialog.qml's look).
let DIALOG_CB = {}, DIALOG_SEQ = 0;
function ask(title, value, ok, cb){ const req=++DIALOG_SEQ; DIALOG_CB[req]=cb; mantel('dialog', {mode:'ask', title, value, ok, req}); }
function info(title, rows){ mantel('dialog', {mode:'info', title, rows, req:++DIALOG_SEQ}); }
function confirmBox(title, text, ok, cb){ const req=++DIALOG_SEQ; DIALOG_CB[req]=cb; mantel('dialog', {mode:'confirm', title, text, ok, req}); }

// Pinned apps first (in pin order), then the other open apps; each app's windows share one button (Bar.qml's taskItems).
function taskItems(){
  const out=[], byKey={};
  for(const p of ST.pins){
    const k=String(p.id).toLowerCase(); if(byKey[k]) continue;
    out.push(byKey[k]={key:k, id:p.id, name:p.name, icon:p.icon||ownIcon(p.id), pinned:true, own:String(p.id).startsWith('hearth:'), windows:[]});
  }
  for(const w of ST.windows){
    const k=String(w.key||('win:'+w.id)).toLowerCase();
    if(!byKey[k]) out.push(byKey[k]={key:k, id:w.pinId||'', name:w.name||w.app||w.title, icon:w.icon, pinned:false, own:!!w.own, windows:[]});
    const it=byKey[k]; it.windows.push(w); if(!it.icon) it.icon=w.icon;
  }
  return out;
}
let TASKS=[];
function renderWins(){
  const el=$('.wins'); if(!el) return;

    const ws=it.windows, focused=ws.some(w=>w.active);
    const tip = ws.length>1 ? `${it.name} (${ws.length} windows)\n` + ws.slice(0,6).map(w=>'• '+(w.title||it.name)).join('\n') : ws.length===1 ? (ws[0].title||it.name) : it.name;
    return `<button class="bb ${it.pinned?'pinned':''} ${ws.length?'run':''} ${ws.length>1?'many':''} ${focused?'active':''}" data-act="task" data-i="${i}" title="${esc(tip)}">${icon(it.icon, it.name)}</button>`;

}
// Click: open it (no windows), focus it (in front again: minimize); several windows: a list of them to pick from,
// like Windows' taskbar (Windows+number steps through them instead).
function focusApp(it, btn){
  const ws=it.windows;
  if(!ws.length){ if(it.id) mantel('launch', {id:it.id}); return; }
  if(ws.length>1 && btn) return windowList(btn, it);
  const i=ws.findIndex(w=>w.active);
  if(ws.length===1) mantel('focus', {id:ws[0].id, min:!!ws[0].active && !ws[0].minimized});
  else mantel('activate', {id:ws[(i+1)%ws.length].id});
}
function windowList(btn, it){
  const list=it.windows.slice(0,12).map(w=>({label:w.title||it.name, icon:'window', checked:w.active?true:undefined, run:()=>mantel('activate', {id:w.id})}));
  if(it.id && !it.own) list.push({separator:true}, {label:'New window', icon:'plus', run:()=>mantel('launch', {id:it.id})});
  const p=menuPoint(btn);
  showMenu(p.x, p.y, {title:it.name, above:p.above}, list, true);
}
// Windows+1-9 (Ember's keyboard hook in full Mantel): the app at that place on the taskbar.
function activateNth(n){ const it=TASKS[n-1]; if(it) focusApp(it); }
// Right-click on the volume, network or battery: a short menu of where to go (Windows' own settings pages).
function statusMenu(btn, kind){
  const a=ST.status&&ST.status.audio, list=[];
  if(kind==='sound'){
    if(a) list.push({label:a.muted?'Unmute':'Mute', icon:a.muted?'vol':'vol-mute', run:()=>{ a.muted=!a.muted; renderStatus(); call('audio.setMute',{m:a.muted}).catch(()=>{}); }});
    list.push({label:'Sound settings', icon:'gear', run:()=>mantel('launch', {id:'ms-settings:sound'})});
    list.push({label:'Volume mixer', icon:'vol', run:()=>mantel('launch', {id:'ms-settings:apps-volume'})});
  } else if(kind==='net'){
    list.push({label:'Network & internet settings', icon:'wifi', run:()=>mantel('launch', {id:'ms-settings:network'})});
    list.push({label:'Quick Access', icon:'menu', run:()=>mantel('quick')});
  } else {
    list.push({label:'Power & battery settings', icon:'power', run:()=>mantel('launch', {id:'ms-settings:powersleep'})});
  }

// Dragging a pinned app along the bar puts it somewhere else (saved by Ember, mantel.json).
let PDRAG=null;
function setupPinDrag(){
  const box=$('.barbox');
  box.addEventListener('pointerdown', e=>{
    const b=e.target.closest('.wins .bb.pinned'); if(!b || e.button!==0) return;
    PDRAG={b, i:+b.dataset.i, x:e.clientX, y:e.clientY, on:false, to:+b.dataset.i, id:e.pointerId};
  });
  box.addEventListener('pointermove', e=>{
    const d=PDRAG; if(!d) return;
    const portrait=document.body.classList.contains('portrait');
    const delta=portrait ? e.clientY-d.y : e.clientX-d.x;
    if(!d.on && Math.abs(delta)>12){ d.on=true; d.b.classList.add('dragging'); try{ d.b.setPointerCapture(d.id); }catch(_){} if(HOLD){ clearTimeout(HOLD.timer); HOLD=null; } }
    if(!d.on) return;
    d.b.style.transform = portrait ? `translateY(${delta}px)` : `translateX(${delta}px)`;
    const pinned=[...document.querySelectorAll('.wins .bb.pinned')];
    const pos=portrait?e.clientY:e.clientX;
    let n=0;
    pinned.forEach((x)=>{ const k=+x.dataset.i; if(k===d.i) return; const r=x.getBoundingClientRect(); if((portrait?r.top+r.height/2:r.left+r.width/2)<pos) n++; });
    d.to=n;
    pinned.forEach(x=>x.classList.remove('drop-before','drop-after'));
    if(n!==d.i){ const t=pinned.find(x=>+x.dataset.i===n); if(t) t.classList.add(n<d.i?'drop-before':'drop-after'); }
  });
  const end=()=>{
    const d=PDRAG; PDRAG=null; if(!d || !d.on) return;
    d.b.classList.remove('dragging'); d.b.style.transform='';
    document.querySelectorAll('.wins .bb').forEach(x=>x.classList.remove('drop-before','drop-after'));
    PDRAG_DONE=Date.now();
    if(d.to===d.i) return;
    const order=TASKS.filter(t=>t.pinned).map(t=>t.id), moved=order.splice(d.i,1)[0];
    order.splice(d.to,0,moved);
    const byId=Object.fromEntries(ST.pins.map(p=>[String(p.id).toLowerCase(), p]));
    ST.pins=order.map(id=>byId[String(id).toLowerCase()]).filter(Boolean).concat(ST.pins.filter(p=>!order.some(id=>same(id,p.id))));
    renderWins();
    mantel('pinsOrder', {ids:ST.pins.map(p=>p.id)});
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}
let PDRAG_DONE=0;
// Screen pixels just outside the bar next to a button, for its menu (Bar.qml's menuPoint).
function menuPoint(btn){
  const r=btn.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(document.body.classList.contains('portrait')) return {x:Math.round((window.screenX+innerWidth+4)*dpr), y:Math.round((window.screenY+r.top+r.height/2-20)*dpr), above:false};
  return {x:Math.round((window.screenX+r.left+r.width/2-134)*dpr), y:Math.round((window.screenY+4)*dpr), above:true};
}
// Right-click (X on the controller) on an app: Open / New window, Pin to / Unpin from taskbar, Move to desktop,
// Maximize / Restore size, Close window / Close all.
function taskMenu(btn, it){
  const ws=it.windows, win=ws.find(w=>w.active)||ws[0]||null, list=[];
  if(it.id && !it.own) list.push({label:ws.length?'New window':'Open', icon:'open', run:()=>mantel('launch', {id:it.id})});
  if(it.id && (!it.own || it.pinned)){
    const pinned=ST.pins.some(p=>same(p.id, it.id));
    list.push({label:pinned?'Unpin from taskbar':'Pin to taskbar', icon:pinned?'unpin':'pin', run:()=>mantel('pin', {id:it.id, name:it.name, on:!pinned})});
  }
  if(win){
    if(list.length) list.push({separator:true});
    if(ST.desks.length>1){
      const sub=ST.desks.map((d,i)=>({label:d.name+(d.active?' (this one)':''), enabled:!d.active, run:()=>call('vdesk.move', {window:win.id, desk:d.id}).then(r=>{ if(r && !r.ok && r.error) mantel('toast', {text:r.error}); }).catch(()=>{})}));
      list.push({label:'Move to desktop', icon:'desktops', sub});
    }
    if(!win.maximized) list.push({label:'Maximize', icon:'window', run:()=>mantel('maximize', {id:win.id, on:true})});
    else list.push({label:'Restore size', icon:'window', run:()=>mantel('maximize', {id:win.id, on:false})});
    list.push({separator:true});
    if(ws.length>1) list.push({label:'Close all '+ws.length+' windows', icon:'close', danger:true, run:()=>ws.forEach(w=>mantel('close', {id:w.id}))});
    else list.push({label:'Close window', icon:'close', danger:true, run:()=>mantel('close', {id:win.id})});
  }
  if(!list.length) return;
  const p=menuPoint(btn);
  showMenu(p.x, p.y, {title:it.name, above:p.above}, list, true);
}
// Full Mantel shows the apps' tray icons itself; on top of Explorer, ^ shows Windows' own tray for a moment.
function renderTray(){
  const el=$('.ticons'), b=$('.trayb'); if(!el) return;
  b.style.display = ST.tray.full ? 'none' : '';
  el.innerHTML = ST.tray.full ? ST.tray.icons.map(i=>`<button class="bb narrow" data-act="trayIcon" data-key="${esc(i.key)}" title="${esc(i.tip)}">${i.image?`<img src="${i.image}" alt="">`:I.up}</button>`).join('') : '';
}
function renderStatus(){
  const s = ST.status || {}, a = s.audio, b = s.battery, w = s.wifi || {};
  const v=$('.vol'), n=$('.net'), bt=$('.batt'); if(!v) return;
  // The same icons at the same points as Bar.qml: muted, over 33 %, the rest low.
  if(a){ const pct=a.volume||0; v.style.display='';
    v.innerHTML = (a.muted ? I.mute : pct>33 ? I.vol : I.volLow) + (a.muted ? '' : `<span class="lbl">${pct}%</span>`);
    v.title = a.muted ? 'Muted' : `Volume ${pct}%`; }
  else v.style.display='none';
  // Wired first (like NetworkManager's device order), then Wi-Fi when connected, else offline.
  const wiredOn = !!(s.wired && (s.wired.connected ?? s.wired === true));
  n.innerHTML = wiredOn ? I.wired : w.on && w.ssid ? I.wifi : I.offline;
  n.title = wiredOn ? 'Connected to '+((s.wired&&s.wired.name)||'Ethernet') : w.ssid ? 'Connected to '+w.ssid : 'Not connected';
  if(b && b.present){ bt.style.display='';
    bt.innerHTML = (b.charging ? I.batChg : (b.pct??100) > 60 ? I.bat : I.batLow) + `<span class="lbl">${b.pct ?? ''}%</span>`;
    bt.title = `${b.pct}%${b.charging?', charging':''}`; }
  else bt.style.display='none';
}
function tickClock(){
  const c=$('.bclock'); if(!c) return;
  const now=new Date();
  c.querySelector('b').textContent = ST.clock24 ? now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hourCycle:'h23'})
    : document.body.classList.contains('portrait') ? now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hourCycle:'h12'}).replace(/\s?[AP]M$/i,'') : timeText(now);
  c.querySelector('small').textContent = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  c.title = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
function volumeBy(d){
  const a=ST.status&&ST.status.audio; if(!a) return;
  const v=Math.max(0, Math.min(100, (a.volume||0)+d));
  a.volume=v; a.muted=false; renderStatus(); if(PART==='quick') renderQuick();
  call('audio.setMute',{m:false}).catch(()=>{}); call('audio.setVolume',{v}).catch(()=>{});
}

// ================================================================ launcher (Launcher.qml)
const L = {query:'', cur:0, tab:'apps', onTabs:false};
// The launcher's sections: every app, your installed games (they start through Ember's library, like Hearth's Play
// button), and the programs that come with Windows. Tab / Shift+Tab switch, or up from the top row to the buttons
// and left / right (the D-pad).
const LTABS = [['apps','Apps'],['games','Games'],['windows','Windows']];
function renderTabs(){
  const t=$('.ltabs'); if(!t) return;
  t.classList.toggle('nav', L.onTabs);
  t.innerHTML = LTABS.map(([k,n])=>`<button class="ltab ${L.tab===k?'on':''}" data-act="ltab" data-tab="${k}">${n}</button>`).join('')
    + `<span class="hint">${L.onTabs?'◀ ▶ switch · ▼ back to the list':'Tab switches'}</span>`;
  const i=$('.search input'); if(i) i.placeholder = L.tab==='games' ? 'Search games' : L.tab==='windows' ? 'Search Windows programs' : 'Search apps';
  const g=$('.grid'); if(g) g.classList.toggle('nav', L.onTabs);
}
function setLTab(t){
  if(!LTABS.some(x=>x[0]===t) || L.tab===t) return;
  L.tab=t; L.cur=0; renderTabs(); renderGrid();
  if(t==='games') mantel('games');
  if(t==='windows' && !ST.winApps) mantel('windowsApps');
}
function nextLTab(d){ const i=LTABS.findIndex(x=>x[0]===L.tab); setLTab(LTABS[(i+d+LTABS.length)%LTABS.length][0]); }
// Opens what the launcher shows at i: an app, or a game (played through Ember's library).
function launchAt(i){
  const a=matches()[i]; if(!a) return;
  if(L.tab==='games') mantel('playGame', {id:a.id}); else mantel('launch', {id:a.id});
}
function renderLauncher(){
  if(!$('.box')){
    document.body.innerHTML = `<div class="box">
      <div class="ltabs"></div>
      <div class="search"><input placeholder="Search apps" spellcheck="false" aria-label="Search apps"></div>
      <div class="grid"></div>
      <div class="acts">
        <button class="ab primary" data-act="game">Game Mode</button>
        <button class="ab" data-act="settings">Settings</button>
        <div class="fill"></div>
        <button class="ab" data-act="power" data-what="sleep">Sleep</button>
        <button class="ab" data-act="power" data-what="restart">Restart</button>
        <button class="ab" data-act="power" data-what="shutdown">Shut down</button>
        <button class="ab" data-act="power" data-what="signout">Log out</button></div></div>`;
    const input=$('.search input');
    input.addEventListener('input', () => { L.query=input.value; L.cur=0; renderGrid(); });

function source(){ return L.tab==='games' ? ST.games : L.tab==='windows' ? ST.winApps : ST.apps; }
function matches(){
  const all=(source()||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const q=L.query.trim().toLowerCase(); if(!q) return all;
  return all.filter(a=>a.name.toLowerCase().includes(q)).sort((a,b)=>(b.name.toLowerCase().startsWith(q))-(a.name.toLowerCase().startsWith(q)));
}
function cols(){ const g=$('.grid'); return Math.max(1, Math.floor(((g&&g.clientWidth)||800) / (L.tab==='games' ? 150 : 120))); }
function renderGrid(){
  const g=$('.grid'); if(!g) return;
  g.style.gridTemplateColumns = `repeat(${cols()}, 1fr)`;
  const what = L.tab==='games' ? 'games' : L.tab==='windows' ? 'programs' : 'apps';
  if(!source()){ g.innerHTML = `<div class="loading"><span class="spin"></span>Finding your ${what}…</div>`; return; }
  const list=matches(), pinned=new Set(ST.pins.map(p=>String(p.id).toLowerCase()));
  L.cur=Math.max(0, Math.min(L.cur, list.length-1));
  const empty = L.query ? `No ${what} match "${esc(L.query)}"` : L.tab==='games' ? 'No games installed yet. Games you install in Hearth show up here.' : `No ${what}`;
  g.innerHTML = !list.length ? `<div class="none">${empty}</div>` : L.tab==='games'
    ? list.map((a,i)=>`<div class="cell game ${i===L.cur?'cur':''}" data-act="play" data-game="${esc(a.id)}" data-i="${i}" title="${esc(a.name)}"><div class="cover">${esc((a.name||'?').trim().charAt(0).toUpperCase())}${a.cover?`<img src="${esc(a.cover)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div><span>${esc(a.name)}</span></div>`).join('')
    : list.map((a,i)=>`<div class="cell ${i===L.cur?'cur':''}" data-act="launch" data-app="${esc(a.id)}" data-i="${i}" title="${esc(a.name)}">${icon(a.icon, a.name, '')}<span>${esc(a.name)}</span>
      ${pinned.has(String(a.id).toLowerCase())?`<i class="pinmark" title="Pinned to the taskbar">${IC('pin')}</i>`:''}</div>`).join('');
  const c=g.querySelector('.cell.cur'); if(c) c.scrollIntoView({block:'nearest'});
}
// Right-click, press and hold, or the Menu key (X on the controller): Open / Pin to taskbar (shell.qml's launcher menu).
function launcherMenu(i){
  const a=matches()[i]; if(!a) return;
  L.cur=i; renderGrid();
  const c=$('.cell.cur'), r=c?c.getBoundingClientRect():{left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  if(L.tab==='games') return showMenu(r.left+r.width/2, r.top+r.height/2, {title:a.name}, [{label:'Play', icon:'pad', run:()=>mantel('playGame', {id:a.id})}]);
  const pinned=ST.pins.some(p=>same(p.id, a.id));
  showMenu(r.left+r.width/2, r.top+r.height/2, {title:a.name}, [
    {label:'Open', icon:'open', run:()=>mantel('launch', {id:a.id})},
    {label:pinned?'Unpin from taskbar':'Pin to taskbar', icon:pinned?'unpin':'pin', run:()=>{
      // Shown at once (Ember saves it and tells every window).
      ST.pins = pinned ? ST.pins.filter(p=>!same(p.id, a.id)) : ST.pins.concat([{id:a.id, name:a.name, icon:a.icon}]); renderGrid();

// ================================================================ on-screen keyboard (Keyboard.qml + hearth-pad's layout)
// A full US layout: every symbol a terminal or a password needs, plus Esc, Tab, Ctrl, Alt, Caps and arrows.
// Pick keys with the D-pad or left stick, A to type, X backspace, LB shift, Menu (☰) Enter, B or Y close; or tap them.
// Ember does the typing ({type:'mantel', action:'type'}) into the window you were in.
const OSK_ROWS = [
  ['`','1','2','3','4','5','6','7','8','9','0','-','=','bksp'],
  ['tab','q','w','e','r','t','y','u','i','o','p','[',']','\\'],
  ['caps','a','s','d','f','g','h','j','k','l',';',"'",'enter'],
  ['shift','z','x','c','v','b','n','m',',','.','/','up'],
  ['ctrl','alt','esc','space','left','down','right'],

const OSK_SHIFTED = {'`':'~','1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')','-':'_','=':'+','[':'{',']':'}','\\':'|',';':':',"'":'"',',':'<','.':'>','/':'?'};
const OSK_LABELS = {shift:'⇧ Shift', space:'Space', bksp:'⌫', tab:'Tab', enter:'Enter ↵', caps:'Caps', ctrl:'Ctrl', alt:'Alt', esc:'Esc', up:'↑', down:'↓', left:'←', right:'→'};
const OSK_WIDE = {shift:1.6, space:4.5, bksp:1.5, tab:1.4, enter:1.8, caps:1.6, ctrl:1.3, alt:1.2, esc:1.2};
const OSK_SPECIAL = new Set(['space','bksp','tab','enter','esc','up','down','left','right']);
const K = {row:1, col:1, shift:false, caps:false, ctrl:false, alt:false};
const kLabel = k => OSK_LABELS[k] || (/^[a-z]$/.test(k) ? ((K.shift!==K.caps) ? k.toUpperCase() : k) : (K.shift ? (OSK_SHIFTED[k]||k) : k));
const kOn = k => (k==='shift'&&K.shift)||(k==='caps'&&K.caps)||(k==='ctrl'&&K.ctrl)||(k==='alt'&&K.alt);
function renderKeyboard(){
  if(!$('.kbox')){
    document.body.innerHTML = `<div class="kbox">${OSK_ROWS.map((r,ri)=>`<div class="krow">${r.map((k,ci)=>`<button class="key" data-act="key" data-r="${ri}" data-c="${ci}" style="flex-grow:${OSK_WIDE[k]||1}"></button>`).join('')}</div>`).join('')}
      <div class="kfoot"><span>A type · X ⌫ · LB shift · ☰ Enter · B close · Shift, Ctrl and Alt apply to the next key</span><button data-act="kclose">Close</button></div></div>`;
    new ResizeObserver(kbdFont).observe($('.kbox'));
  }
  document.querySelectorAll('.key').forEach(el=>{
    const k=OSK_ROWS[+el.dataset.r][+el.dataset.c];
    el.textContent=kLabel(k);
    el.classList.toggle('on', kOn(k));

  if(d==='up'||d==='down'){ const last=OSK_ROWS[r].length-1, nr=Math.max(0, Math.min(OSK_ROWS.length-1, r+(d==='down'?1:-1))); c=Math.round((last?c/last:0)*(OSK_ROWS[nr].length-1)); r=nr; }
  else c=Math.max(0, Math.min(OSK_ROWS[r].length-1, c+(d==='right'?1:-1)));

}
function kbdKey(k){

  mantel('type', {key:k, ch, shift:K.shift, ctrl:K.ctrl, alt:K.alt});

    case 'lb': return kbdKey('shift');

}

function ckShift(d){ CK.month=new Date(CK.month.getFullYear(), CK.month.getMonth()+d, 1); renderClock(); }
function ckActivate(i){
  const h=ckHistory(), cal=ckCalRow();
  if(i===0){ ST.dnd=!ST.dnd; ST.notes.dnd=ST.dnd; renderClock(); call('desk.set', {key:'dnd', value:ST.dnd}).catch(()=>{}); }
  else if(i===1){ ST.notes.history=[]; CK.nav=0; renderClock(); call('notify.clear').catch(()=>{}); }
  else if(i===cal){ const t=new Date(); CK.month=new Date(t.getFullYear(), t.getMonth(), 1); renderClock(); }
  else if(i>=2 && h[i-2]){ const k=h[i-2].key; ST.notes.history=h.filter(n=>n.key!==k); CK.nav=Math.min(CK.nav, ckCalRow()-1); renderClock(); call('notify.forget', {key:k}).catch(()=>{}); }
}
function clockKey(e){
  const cal=ckCalRow(), none=ckHistory().length===0;
  switch(e.key){
    case 'Escape': mantel('hidePanel'); break;
    case 'ArrowUp': CK.nav = CK.nav<0 ? cal : Math.max(0, CK.nav-1); if(none && CK.nav===1) CK.nav=0; renderClock(); break;
    case 'ArrowDown': case 'Tab': CK.nav = CK.nav<0 ? 0 : Math.min(cal, CK.nav+1); if(none && CK.nav===1) CK.nav=cal; renderClock(); break;
    case 'ArrowLeft': if(CK.nav===cal || CK.nav<0) ckShift(-1); else if(CK.nav===1){ CK.nav=0; renderClock(); } break;
    case 'ArrowRight': if(CK.nav===cal || CK.nav<0) ckShift(1); else if(CK.nav===0 && !none){ CK.nav=1; renderClock(); } break;
    case 'PageUp': ckShift(-1); break;
    case 'PageDown': ckShift(1); break;
    case 'Enter': case ' ': if(CK.nav>=0) ckActivate(CK.nav); break;
    default: return;
  }
  e.preventDefault();
}

// ================================================================ clipboard history (Clipboard.qml)
// Click an item or press A / Enter to paste it into the app you were in; X (or Delete) forgets one, and "Clear all" at the
// end forgets everything (press it twice); B / Esc closes. Windows keeps the history (Settings › Clipboard turns it on).
const CB = {items:[], cur:0, confirm:false, loading:false, state:null};
function refreshClip(){
  CB.loading=true; renderClip();
  call('clipboard.list').then(r=>{ CB.state=r||{}; CB.items=(r&&r.items)||[]; }).catch(()=>{ CB.state={available:false}; CB.items=[]; })
    .finally(()=>{ CB.loading=false; CB.cur=Math.min(CB.cur, Math.max(0, CB.items.length-1)); renderClip(); });
}
function renderClip(){
  let el=$('.cb');
  if(!el){ document.body.innerHTML=`<div class="cb"><div class="cbh">${IC('clipboard')}<b>Clipboard history</b><small>Ⓐ paste  Ⓧ forget  Ⓑ close</small></div><div class="clist"></div></div>`; el=$('.cb'); }
  const st=CB.state||{}, last=CB.items.length;
  const empty = st.policy ? 'Your organization turned clipboard history off on this PC.'
    : st.available===false ? "Windows' clipboard history isn't available here."
    : CB.loading && !last ? 'Loading…'
    : st.enabled===false ? 'Clipboard history is off. Turn it on in Settings › Clipboard.'
    : st.denied ? "Windows didn't let Ember read the clipboard history."
    : 'Nothing copied yet. Copy some text or a picture and it shows up here.';
  el.querySelector('.clist').innerHTML = CB.items.map((it,i)=>`<div class="ci ${it.kind==='image'?'img':''} ${i===CB.cur?'lit':''}" data-act="clipPaste" data-i="${i}">
      ${it.kind==='image'?`<img src="${esc(it.image||'')}" alt=""><span class="cpic">Picture${it.dims?' · '+esc(it.dims):''}</span>`
        :`<span class="ctx">${esc(it.kind==='binary'?`Something copied (${it.format||'data'})`:String(it.text||'').replace(/\s+/g,' ').trim())}</span>`}
      <button class="del" data-act="clipForget" data-i="${i}" title="Forget">${IC('close')}</button></div>`).join('')
    + (last?`<button class="cclear ${CB.cur===last?'lit':''} ${CB.confirm?'warn':''}" data-act="clipClear">${CB.confirm?'Clear everything? Press again to clear':'Clear all'}</button>`:`<div class="cnone">${esc(empty)}</div>`);
  const lit=el.querySelector('.ci.lit, .cclear.lit'); if(lit) lit.scrollIntoView({block:'nearest'});
}
function clipForget(i){ const it=CB.items[i]; if(!it) return; CB.items=CB.items.filter((x,k)=>k!==i); CB.cur=Math.min(CB.cur, CB.items.length); renderClip(); call('clipboard.delete', {id:it.id}).catch(()=>{}); }
function clipClear(){ if(!CB.confirm){ CB.confirm=true; CB.cur=CB.items.length; return renderClip(); } CB.confirm=false; CB.items=[]; CB.cur=0; renderClip(); call('clipboard.clear').catch(()=>{}); }
function clipPaste(i){ const it=CB.items[i]; if(it) mantel('clipPaste', {id:it.id}); }
function clipKey(e){
  const last=CB.items.length;
  switch(e.key){
    case 'ArrowDown': case 'Tab': if(e.key==='Tab' && e.shiftKey){ CB.cur=Math.max(0, CB.cur-1); } else CB.cur=Math.min(last, CB.cur+1); CB.confirm=false; break;
    case 'ArrowUp': CB.cur=Math.max(0, CB.cur-1); CB.confirm=false; break;
    case 'Home': CB.cur=0; break;
    case 'End': CB.cur=last; break;
    case 'Enter': case ' ': if(CB.cur>=last) clipClear(); else clipPaste(CB.cur); e.preventDefault(); return;
    case 'Delete': case 'ContextMenu': case 'x': case 'X': case 'F23': if(CB.cur<last) clipForget(CB.cur); e.preventDefault(); return;
    case 'Escape': mantel('hidePanel'); break;
    default: return;
  }
  e.preventDefault(); renderClip();
}

// ================================================================ the desktop's dialogs (DeskDialog.qml)
// ask: a text box with OK / Cancel; info: a card of details. Enter (A) is OK, Esc (B) cancels, Tab / arrows move between
// the box and the buttons; Y on the controller opens the keyboard.
const DG = {mode:'ask', title:'', ok:'OK', rows:[], text:'', req:0, focus:0};
function openDialog(d){
  DG.mode=['info','confirm'].includes(d.mode)?d.mode:'ask'; DG.title=d.title||''; DG.ok=d.ok||'OK'; DG.rows=d.rows||[]; DG.text=d.text||''; DG.req=d.req||0;
  DG.focus=DG.mode==='confirm'?2:0;   // confirm: Cancel first, so Enter alone doesn't delete anything
  renderDialog();
  const i=$('.dbox input');
  if(i){ i.value=d.value||''; const dot=i.value.lastIndexOf('.'); setTimeout(()=>{ i.focus(); i.setSelectionRange(0, dot>0?dot:i.value.length); }, 30); }
}
function renderDialog(){
  let el=$('.dg'); if(!el){ document.body.innerHTML='<div class="dg"><div class="dgin"></div></div>'; el=$('.dg'); }
  const keep=$('.dbox input') ? $('.dbox input').value : null;
  el.querySelector('.dgin').innerHTML = `<h3>${esc(DG.title)}</h3>`
    + (DG.mode==='ask' ? `<label class="dbox ${DG.focus===0?'on':''}"><input spellcheck="false" aria-label="${esc(DG.title)}"></label><div class="dhint">Controller: Y opens the keyboard</div>`
      : DG.mode==='confirm' ? `<div class="dhint dtext">${esc(DG.text)}</div>`
      : `<div class="dinfo">${DG.rows.map(([k,v])=>`<span>${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div>`)
    + `<div class="dbtns">${DG.mode!=='info'?`<button class="db ${DG.focus===2?'lit':''}" data-act="dgCancel">Cancel</button>`:''}<button class="db primary ${DG.mode==='info'||DG.focus===1?'lit':''}" data-act="dgOk">${esc(DG.mode!=='info'?DG.ok:'Close')}</button></div>`;
  const i=$('.dbox input');
  if(i){ if(keep!==null) i.value=keep; i.addEventListener('focus', ()=>{ DG.focus=0; $('.dbox').classList.add('on'); }); }
  requestAnimationFrame(()=>mantel('dialogFit', {h:Math.ceil(el.querySelector('.dgin').scrollHeight)+2}));
}
function dgAccept(){
  if(DG.mode==='confirm') return mantel('dialogDone', {req:DG.req, value:'', ok:true});
  if(DG.mode==='ask'){ const v=($('.dbox input')||{}).value||''; if(!v.trim()) return; mantel('dialogDone', {req:DG.req, value:v.trim(), ok:true}); }
  else mantel('dialogDone', {req:DG.req, value:'', ok:false});
}
function dgCancel(){ mantel('dialogDone', {req:DG.req, value:'', ok:false}); }
function dialogKey(e){
  const typing=document.activeElement && document.activeElement.tagName==='INPUT';
  switch(e.key){
    case 'Escape': dgCancel(); break;
    case 'Enter': if(DG.mode!=='info' && DG.focus===2) dgCancel(); else dgAccept(); break;
    case ' ': if(typing) return; if(DG.mode!=='info' && DG.focus===2) dgCancel(); else dgAccept(); break;
    case 'Tab': case 'ArrowDown': case 'ArrowRight':
      if(typing && e.key==='ArrowRight') return;
      if(DG.mode==='ask'){ DG.focus=Math.min(2, DG.focus+1); if(typing) document.activeElement.blur(); updateDgFocus(); }
      else if(DG.mode==='confirm'){ DG.focus=2; updateDgFocus(); } break;
    case 'ArrowUp': case 'ArrowLeft':
      if(typing) return;
      if(DG.mode==='ask'){ DG.focus=Math.max(0, DG.focus-1); updateDgFocus(); }
      else if(DG.mode==='confirm'){ DG.focus=1; updateDgFocus(); } break;
    case 'F24': mantel('keyboard'); break;   // Y on the controller
    default: return;
  }
  e.preventDefault();
}
function updateDgFocus(){
  const b=$('.dbox'), btns=document.querySelectorAll('.db');
  if(b) b.classList.toggle('on', DG.focus===0);
  if(btns.length===2){ btns[0].classList.toggle('lit', DG.focus===2); btns[1].classList.toggle('lit', DG.focus===1); }
  if(DG.focus===0){ const i=$('.dbox input'); if(i) i.focus(); }
}

let HOLD = null;   // press and hold (touch): the menu instead of a click
document.addEventListener('click', e => {
  if(PART==='help'){ mantel('hidePanel'); return; }   // a click anywhere closes the controls, like Help.qml

    case 'trayIcon': return trayClick(el, e.detail>=2 ? 'double' : 'left');
    case 'q': { const rows=navRows(); rows.forEach((r,ri)=>{ const ci=r.indexOf(d.id); if(ci>=0){ Qn.r=ri; Qn.c=ci; } }); return quickDo(d.id); }
    case 'q-mute': return quickDo('q-mute');

// A click outside the menu card (there's nothing outside: the window is the card) or anywhere else closes it (Ember).
function trayClick(el, button){

}
// Right-click (X on the controller): the tray icon's own menu, an app's menu on the taskbar, the launcher's Open / Pin
// menu, and Do Not Disturb on the bell (like Bar.qml).
function secondary(e, el){
  if(el.dataset.act==='trayIcon') return trayClick(el, 'right');
  if(el.dataset.act==='task'){ const it=TASKS[+el.dataset.i]; if(it) taskMenu(el, it); return; }
  if(el.dataset.menu==='bell'){ ST.dnd=!ST.dnd; renderBell(); call('desk.set', {key:'dnd', value:ST.dnd}).catch(()=>{}); return; }
  if(['sound','net','batt'].includes(el.dataset.menu)) return statusMenu(el, el.dataset.menu);

}
document.addEventListener('contextmenu', e => {

});
document.addEventListener('pointerdown', e => {
  if(PART==='bar'){ const a=e.target.closest('[data-act]'); mantel('barTouch', {what:a?a.dataset.act:''}); }
  if(e.button!==0 || !['bar','launcher'].includes(PART)) return;
  const el=e.target.closest('[data-act="task"], .cell'); if(!el) return;

});
document.addEventListener('keydown', e => {
  if(PART==='launcher') return launcherKey(e);

  if(PART==='radial') return radialKey(e);

});

  if(PART==='launcher') mantel('apps');

  if(PART==='clock' || PART==='bar') call('notify.list').then(n=>{ if(n){ ST.notes=n; ST.dnd=!!n.dnd; if(PART==='bar') renderBell(); else renderClock(); } }).catch(()=>{});
}
</script>
