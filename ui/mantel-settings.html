<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Settings</title>
<!--
  Hearth Settings for Mantel on Windows: the desktop's own settings window, like Mantel's on Hearth OS
  (hosts/linux/desktop/shell/SettingsApp.qml and its Set*.qml pages): the page list on the left, the page on
  the right. Works with the mouse, the keyboard and the controller: Up/Down pick a page, Right/Enter go into
  it, Left/Esc come back, Esc on the list closes. Hosted by Ember (Mantel/MantelHost.cs) in WebView2; uses
  the same bridge as the main UI. Opens in a normal browser too, with sample data.
-->
<style>
:root{
  --bg:#0f0b09; --bg2:#17110e; --panel:#1c1512; --panel2:#261d18; --panel3:#33271f; --line:#3b2e26;
  --text:#f4ece3; --muted:#a69484; --danger:#ff5d5d; --ember:#ff8a3d; --flame:#ffd166; --accent:#ff8a3d; --accentInk:#2a1206;
  --quick:140ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus{outline:none}
.app{display:flex;height:100%}
nav{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:4px}
@media (max-width:900px){nav{width:220px}}
.brand{display:flex;align-items:center;gap:10px;margin:6px 6px 14px}
.brand img{width:30px;height:30px}
.brand b{font-size:20px;font-weight:600}
.ni{height:48px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:15px;transition:background var(--quick)}
.ni:hover{background:var(--panel2)}
.ni.lit{background:var(--panel3);font-weight:600}
.ni.lit svg{color:var(--accent)}
nav.focus .ni.lit{background:var(--accent);color:var(--accentInk)}
nav.focus .ni.lit svg{color:var(--accentInk)}
.navhint{margin-top:auto;padding:0 6px;color:var(--muted);font-size:12px}
main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent}
.page{width:min(100% - 48px,820px);margin:24px auto;display:flex;flex-direction:column;gap:8px}
.page h1{font-size:26px;font-weight:600;margin-bottom:6px}
.hd{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:14px}
.row{min-height:64px;border-radius:12px;background:var(--panel2);border:2px solid transparent;display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;transition:background var(--quick),border-color var(--quick)}
button.row:hover,.row.click:hover{background:var(--panel3)}
.row.f-on{border-color:var(--accent)}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .tx b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{font-size:12px;color:var(--muted)}
.row .val{color:var(--muted);font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--muted);font-size:20px}
.row.danger,.row.danger .ic{color:var(--danger)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--panel3);position:relative;flex:none;transition:background var(--quick)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text);transition:left var(--quick),background var(--quick)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px;background:var(--accentInk)}
.slider{min-height:76px}
.slider .tx .top{display:flex;justify-content:space-between}
.slider .tx .top span{color:var(--muted);font-size:13px;font-weight:400}
.track{position:relative;height:8px;border-radius:4px;background:var(--panel3);margin-top:7px;cursor:pointer}
.track::before{content:"";position:absolute;inset:-14px 0}
.track i{position:absolute;left:0;top:0;bottom:0;min-width:8px;border-radius:4px;background:linear-gradient(90deg,var(--ember),var(--flame))}
.choice{border-radius:12px;background:var(--panel2);border:2px solid transparent;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.choice.f-on{border-color:var(--accent)}
.choice .t b{font-size:15px;font-weight:600}
.choice .t small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:90px;height:40px;border-radius:10px;background:var(--panel3);text-align:center;font-size:13px}
.opt.on{background:var(--accent);color:var(--accentInk);font-weight:600}
.field{display:flex;gap:8px}
.field input{flex:1;height:44px;border-radius:12px;background:var(--panel3);border:2px solid transparent;padding:0 14px;color:var(--text);font-size:15px}
.field input:focus{border-color:var(--accent)}
.btn{height:44px;border-radius:12px;padding:0 18px;background:var(--panel3);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accentInk)}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wall{aspect-ratio:16/10;border-radius:12px;background:center/cover var(--panel3);border:2px solid transparent;position:relative;overflow:hidden}
.wall.on{border-color:var(--accent)}
.wall.f-on{outline:2px solid var(--flame);outline-offset:2px}
.wall span{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:600;text-shadow:0 1px 4px #000}
.note{color:var(--muted);font-size:13px;padding:4px 2px}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:22px;padding:11px 18px;font-size:14px;opacity:0;transition:opacity var(--quick);pointer-events:none}
.msg.show{opacity:1}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel3);border-top-color:var(--accent);animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app"><nav></nav><main><div class="page"></div></main></div>
<div class="msg"></div>
<script>
'use strict';
const host = window.chrome && window.chrome.webview ? window.chrome.webview : null;
const send = m => host ? host.postMessage(m) : null;
let callId = 0; const pending = {};
const call = (method, args={}, ms=30000) => host ? new Promise((ok, no) => {
  const id = ++callId; pending[id] = {ok, no}; send({type:'call', id, method, args});
  setTimeout(() => { if(pending[id]){ delete pending[id]; no(new Error('That took too long')); } }, ms);
}) : (MOCK[method] ? Promise.resolve(MOCK[method](args)) : Promise.reject(new Error('preview')));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const I = {
  wifi:'<svg viewBox="0 0 24 24"><path d="M2.5 9a15 15 0 0 1 19 0M5.5 12.5a10 10 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/></svg>',
  bt:'<svg viewBox="0 0 24 24"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  display:'<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg>',
  palette:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-1.3-1.2-1.6-1.2-2.7 0-1 .8-1.5 1.8-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg>',
  power:'<svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>',
  pad:'<svg viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4M15.5 12h.01M18 14h.01"/></svg>',
  update:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/></svg>',
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  mouse:'<svg viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 7v3"/></svg>',
  bat:'<svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="17" height="9" rx="2"/><path d="M21.5 10.5v3M5.5 10.5v3M8.5 10.5v3M11.5 10.5v3"/></svg>',
  dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
};

// ---------------------------------------------------------------- pages
const PAGES = [['wifi','wifi','Wi-Fi'],['bluetooth','bt','Bluetooth'],['sound','vol','Sound'],['display','display','Display'],['appearance','palette','Appearance'],
  ['power','power','Power'],['controller','pad','Controller'],['updates','update','Updates'],['about','info','About']];
const S = {page:'wifi', inPage:false, f:0, st:null, nets:null, scanning:false, connecting:null, pw:null, paired:null, found:[], btScan:false,
  audio:null, display:null, power:null, shell:null, pad:null, overlay:null, upd:null, sys:null, profile:null};

function toast(t){ const m=$('.msg'); m.textContent=t; m.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>m.classList.remove('show'), 2400); }
function renderNav(){
  $('nav').innerHTML = `<div class="brand"><img src="hearth-logo.svg" alt=""><b>Settings</b></div>`
    + PAGES.map(([id,ic,l])=>`<button class="ni ${S.page===id?'lit':''}" data-act="page" data-p="${id}">${I[ic]}${l}</button>`).join('')
    + `<div class="navhint">Ⓐ open  Ⓑ back</div>`;
  $('nav').classList.toggle('focus', !S.inPage);
}
const row = (o) => `<${o.act?'button':'div'} class="row ${o.danger?'danger':''}" data-f ${o.act?`data-act="${o.act}"`:''} ${o.data||''}>${o.icon?`<div class="ic">${I[o.icon]||''}</div>`:''}<div class="tx"><b>${esc(o.title)}</b>${o.sub?`<small>${o.sub}</small>`:''}</div>${o.val!=null?`<div class="val">${esc(o.val)}</div>`:''}${o.sw!=null?`<div class="sw ${o.sw?'on':''}"></div>`:''}${o.spin?'<span class="spin"></span>':''}${o.chev?'<div class="chev">›</div>':''}</${o.act?'button':'div'}>`;
const slider = (id, icon, title, v, max=100, label) => `<div class="row slider" data-f data-slide="${id}" data-max="${max}"><div class="ic">${I[icon]}</div><div class="tx"><b class="top">${esc(title)}<span>${label ?? Math.round(v)+'%'}</span></b><div class="track"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></div></div></div>`;
const choice = (id, title, sub, opts, cur) => `<div class="choice" data-f data-choice="${id}"><div class="t"><b>${esc(title)}</b>${sub?`<small>${sub}</small>`:''}</div><div class="opts">${opts.map(([v,l])=>`<button class="opt ${String(v)===String(cur)?'on':''}" data-act="choose" data-id="${id}" data-v="${esc(v)}">${esc(l)}</button>`).join('')}</div></div>`;
const hd = t => `<div class="hd">${esc(t)}</div>`;
const note = t => `<div class="note">${t}</div>`;

function renderPage(){
  const p=S.page, title=(PAGES.find(x=>x[0]===p)||[])[2]||'';
  let h=`<h1>${esc(title)}</h1>`;
  const st=S.st||{};
  if(p==='wifi'){
    const w=st.wifi||{};
    h += row({icon:'wifi', title:'Wi-Fi', sub:w.on?(w.ssid?`Connected to ${esc(w.ssid)}`:'Not connected'):'Off', sw:!!w.on, act:'wifiToggle'});
    if(w.on){
      h += hd('Networks') + row({icon:'update', title:S.scanning?'Looking for networks…':'Look again', act:'wifiScan', spin:S.scanning});
      for(const n of S.nets||[]){
        const sub = S.connecting===n.ssid ? 'Connecting…' : n.connected ? 'Connected' : n.saved ? 'Saved' : n.secure ? 'Needs a password' : 'Open';
        h += row({icon:n.secure?'lock':'wifi', title:n.ssid, sub, val:'▂▄▆█'.slice(0, Math.max(1,n.bars||1)), act:'wifiNet', data:`data-ssid="${esc(n.ssid)}"`});
        if(S.pw===n.ssid) h += `<div class="field"><input type="password" placeholder="Password for ${esc(n.ssid)}" data-f data-pw="${esc(n.ssid)}"><button class="btn primary" data-act="wifiJoin" data-ssid="${esc(n.ssid)}">Connect</button></div>`;
        if(n.connected && S.open===n.ssid) h += `<div class="field"><button class="btn" data-f data-act="wifiDisconnect">Disconnect</button><button class="btn" data-f data-act="wifiForget" data-ssid="${esc(n.ssid)}">Forget</button></div>`;
      }
      if(S.nets && !S.nets.length) h += note('No networks found.');
    }
  }
  else if(p==='bluetooth'){
    const b=st.bt||{};
    h += row({icon:'bt', title:'Bluetooth', sub:b.on?'On':'Off', sw:!!b.on, act:'btToggle'});
    if(b.on){
      h += hd('Your devices') + ((S.paired||[]).map(d=>row({icon:'bt', title:d.name, sub:d.connected?'Connected':'Paired', val:'Remove', act:'btUnpair', data:`data-id="${esc(d.id)}"`})).join('') || note(S.paired?'No devices paired yet.':'Loading…'));
      h += hd('Add a device') + row({icon:'update', title:S.btScan?'Looking for devices… (put yours in pairing mode)':'Look for devices', act:'btScan', spin:S.btScan});
      h += S.found.map(d=>row({icon:'bt', title:d.name, sub:'Select to pair', act:'btPair', data:`data-id="${esc(d.id)}"`})).join('');
    }
  }
  else if(p==='sound'){
    const a=S.audio||st.audio;
    if(!a) h += note('Loading…');
    else {
      h += slider('volume','vol','Volume', a.muted?0:a.volume);
      h += row({icon:'vol', title:'Mute', sw:!!a.muted, act:'mute'});
      if(a.devices&&a.devices.length) h += hd('Output') + a.devices.map(d=>row({icon:'vol', title:d.name, sub:d.isDefault?'In use':'', val:d.isDefault?'✓':'', act:'audioDev', data:`data-id="${esc(d.id)}"`})).join('');
    }
  }
  else if(p==='display'){
    const d=S.display;
    if(!d) h += note('Loading…');
    else {
      if(d.supported) h += slider('brightness','sun','Brightness', d.brightness||0);
      if(d.modes&&d.modes.length){
        h += choice('res','Resolution', `Now ${d.width} × ${d.height}`, d.modes.map(m=>[`${m.width}x${m.height}`, `${m.width} × ${m.height}`]), `${d.width}x${d.height}`);
        const cur=d.modes.find(m=>m.width===d.width&&m.height===d.height);
        if(cur&&cur.rates&&cur.rates.length>1) h += choice('rate','Refresh rate','', cur.rates.map(r=>[r, r+' Hz']), d.refreshRate);
      }
      if(d.scales&&d.scales.length) h += choice('scale','Scale', d.scaleRecommended?`${d.scaleRecommended}% is recommended`:'', d.scales.map(s=>[s, s+'%']), d.scalePercent);
    }
  }
  else if(p==='appearance'){
    const s=S.shell||{};
    h += choice('style','Desktop style','Full Mantel is Hearth\'s own desktop with no Explorer; Mantel goes on top of Windows. Changes from the next time you switch to the desktop.',
      [['mantel-full','Full Mantel'],['mantel','Mantel'],['windows','Windows']], s.desktopStyle||'mantel');
    h += hd('Wallpaper') + `<div class="walls">${[['anim:fireside','Fireside','#1f140e'],['anim:lava','Lava','url(mantel-img/wall-lava.jpg)'],['anim:aurora','Aurora','url(mantel-img/wall-aurora.jpg)'],
      ...['cabin','lanterns','fox','peaks','embers','bloom','topo','forge'].map(w=>['hearth-'+w, w[0].toUpperCase()+w.slice(1)])]
      .map(([v,l,c])=>`<button class="wall ${s.wallpaper===v||(!s.wallpaper&&false)?'on':''}" data-f data-act="wall" data-v="${v}" style="background-image:${!c?`url(wallpapers/${v}-thumb.jpg)`:c.startsWith('url')?c:`radial-gradient(ellipse at 50% 110%,#ff8a3d66,transparent 60%),linear-gradient(${c},#0b0807)`}"><span>${l}${c?' (moving)':''}</span></button>`).join('')}</div>`;
    h += note('Moving wallpapers show in Full Mantel.');
    h += hd('Accent color') + `<div class="opts" data-f data-choice="accent">${['#ff8a3d','#ffd166','#e5483b','#3fd0b8','#5aa9ff','#b57bff','#7ad15a'].map(c=>`<button class="opt ${(S.profile&&S.profile.accent)===c?'on':''}" data-act="accent" data-v="${c}" style="background:${c};flex:0 0 52px;min-width:52px"></button>`).join('')}</div>`;
  }
  else if(p==='power'){
    const pw=S.power;
    if(!pw) h += note('Loading…');
    else {
      if(pw.present) h += row({icon:'bat', title:`Battery ${pw.pct ?? ''}%`, sub:pw.charging?'Charging':'On battery'});
      h += choice('mode','Power mode','The Windows power mode slider', [['efficiency','Battery saver'],['balanced','Balanced'],['performance','Performance']], pw.mode);
      h += row({icon:'power', title:'More power settings', sub:'Windows Settings › Power', chev:true, act:'uri', data:'data-v="ms-settings:powersleep"'});
    }
  }
  else if(p==='controller'){
    const c=S.pad||{};
    h += row({icon:'pad', title:c.connected?`${c.connected} controller${c.connected>1?'s':''} connected`:'No controller connected', sub:'Xbox and XInput controllers'});
    h += choice('mouse','Controller mouse', 'In Desktop Mode the controller is always a mouse. Elsewhere:', [['off','Off'],['steam','In Steam'],['always','Always']], c.mouseMode);
    if(S.overlay) h += row({icon:'pad', title:'Xbox button opens only Ember', sub:'Turns off the Windows Game Bar on the Xbox button', sw:!S.overlay.gameBarButton, act:'gameBar'});
    h += row({icon:'info', title:'Controls', sub:'Xbox button: Hearth menu · Menu: apps · Y: keyboard · B: back · LB/RB: switch windows · View + B: close · View: the controls list'});
  }
  else if(p==='updates'){
    const u=S.upd;
    if(!u) h += note('Loading…');
    else {
      const line={idle:'Up to date',checking:'Checking…',available:`Version ${u.latest&&u.latest.version} is available`,downloading:'Downloading…',ready:`Version ${u.latest&&u.latest.version} is ready`,error:u.error||'Something went wrong'}[u.state]||u.state;
      h += row({icon:'update', title:`Ember ${u.current||''}`, sub:esc(line), spin:u.state==='checking'||u.state==='downloading'});
      if(u.state==='available' && u.canInstallHere) h += row({icon:'dl', title:'Download the update', act:'updDl'});
      if(u.state==='ready') h += row({icon:'update', title:'Restart Ember to update', sub:'Takes a few seconds', act:'updInstall'});
      if(!['checking','downloading'].includes(u.state)) h += row({icon:'update', title:'Check for updates', act:'updCheck'});
      h += row({icon:'update', title:'Check automatically', sub:'At startup and every 6 hours', sw:!!u.autoCheck, act:'updAuto'});
    }
  }
  else if(p==='about'){
    const i=S.sys||{};
    h += `<div class="row"><div class="ic"><img src="hearth-logo.svg" style="width:26px" alt=""></div><div class="tx"><b>Ember ${esc((S.upd&&S.upd.current)||'')}</b><small>Hearth OS's shell for Windows 11 · Mantel desktop</small></div></div>`;
    for(const [k,v] of [['Device',i.device],['Windows',i.osPretty||[i.os,i.osVersion].filter(Boolean).join(' ')],['Processor',i.cpu&&(i.cpu+(i.cores?` · ${i.cores} threads`:''))],['Graphics',i.gpu],['Memory',i.memoryBytes&&Math.round(i.memoryBytes/1e9)+' GB'],['Storage',i.storage&&i.storage.totalBytes&&`${Math.round(i.storage.totalBytes/1e9)} GB (${Math.round(i.storage.freeBytes/1e9)} GB free)`],['Device name',i.hostname]])
      if(v) h += row({title:k, val:v});
  }
  $('.page').innerHTML = h;
  focusPaint();
}

// ---------------------------------------------------------------- loading
function load(p){
  const st=()=>call('sys.status').then(s=>{ S.st=s; renderPage(); }).catch(()=>{});
  if(p==='wifi'){ st(); scan(); }
  if(p==='bluetooth'){ st(); call('bt.paired').then(l=>{ S.paired=l||[]; renderPage(); }).catch(e=>{ S.paired=[]; toast(e.message); renderPage(); }); }
  if(p==='sound') call('audio.get').then(a=>{ S.audio=a; renderPage(); }).catch(e=>toast(e.message));
  if(p==='display') call('display.get').then(d=>{ S.display=d; renderPage(); }).catch(e=>toast(e.message));
  if(p==='appearance'){ call('shell.status').then(s=>{ S.shell=s; renderPage(); }).catch(()=>{}); call('profile.get').then(pr=>{ S.profile=pr; renderPage(); }).catch(()=>{}); }
  if(p==='power') call('power.get').then(pw=>{ S.power=pw; renderPage(); }).catch(e=>toast(e.message));
  if(p==='controller'){ call('pad.status').then(c=>{ S.pad=c; renderPage(); }).catch(()=>{}); call('overlay.settings').then(o=>{ S.overlay=o; renderPage(); }).catch(()=>{}); }
  if(p==='updates'||p==='about') call('update.status').then(u=>{ S.upd=u; renderPage(); }).catch(()=>{});
  if(p==='about') call('system.info').then(i=>{ S.sys=i; renderPage(); }).catch(()=>{});
}
async function scan(){
  if(S.scanning) return; S.scanning=true; renderPage();
  try{ S.nets=await call('wifi.scan',{},30000); }catch(e){ if(!S.nets) S.nets=[]; toast(e.message); }
  S.scanning=false; renderPage();
}
function go(p){ S.page=p; S.f=0; S.pw=null; S.open=null; renderNav(); renderPage(); load(p); }

// ---------------------------------------------------------------- actions
async function act(el){
  const d=el.dataset, st=S.st||{};
  try{ switch(d.act){
    case 'page': S.inPage=false; return go(d.p);
    case 'wifiToggle': S.st=await call('radios.set',{kind:'wifi', on:!(st.wifi&&st.wifi.on)}); renderPage(); if(S.st.wifi.on) scan(); return;
    case 'wifiScan': return scan();
    case 'wifiNet': { const n=(S.nets||[]).find(x=>x.ssid===d.ssid); if(!n) return;
      if(n.connected){ S.open=S.open===n.ssid?null:n.ssid; return renderPage(); }
      if(n.secure && !n.saved){ S.pw=n.ssid; renderPage(); const i=$(`[data-pw="${CSS.escape(n.ssid)}"]`); i&&i.focus(); return; }
      return join(n.ssid, null); }
    case 'wifiJoin': return join(d.ssid, ($(`[data-pw="${CSS.escape(d.ssid)}"]`)||{}).value||'');
    case 'wifiDisconnect': await call('wifi.disconnect'); toast('Disconnected'); S.open=null; return load('wifi');
    case 'wifiForget': await call('wifi.forget',{ssid:d.ssid}); toast(`Forgot ${d.ssid}`); S.open=null; return load('wifi');
    case 'btToggle': S.st=await call('radios.set',{kind:'bt', on:!(st.bt&&st.bt.on)}); return load('bluetooth');
    case 'btScan': if(S.btScan){ S.btScan=false; renderPage(); return call('bt.scanStop').catch(()=>{}); } S.found=[]; S.btScan=true; renderPage(); return call('bt.scanStart',{seconds:15});
    case 'btPair': { const dev=S.found.find(x=>x.id===d.id); toast(`Pairing with ${dev?dev.name:'the device'}…`); const r=await call('bt.pair',{id:d.id},60000); toast(r&&r.ok===false?(r.error||'Couldn\'t pair'):'Paired'); S.found=S.found.filter(x=>x.id!==d.id); return load('bluetooth'); }
    case 'btUnpair': await call('bt.unpair',{id:d.id}); toast('Removed'); return load('bluetooth');
    case 'mute': { const a=S.audio; if(!a) return; a.muted=!a.muted; renderPage(); return call('audio.setMute',{m:a.muted}); }
    case 'audioDev': S.audio=await call('audio.setDefault',{id:d.id}); return renderPage();
    case 'choose': return choose(d.id, d.v);
    case 'wall': S.shell=await call('shell.setWallpaper',{name:d.v}); return renderPage();
    case 'accent': S.profile=await call('profile.set',{accent:d.v}); send({type:'mantel', action:'accent', accent:d.v}); return renderPage();
    case 'gameBar': S.overlay=await call('overlay.setGameBarButton',{on:!S.overlay.gameBarButton}); return renderPage();
    case 'uri': return send({type:'mantel', action:'uri', uri:d.v});
    case 'updCheck': S.upd={...S.upd, state:'checking'}; renderPage(); S.upd=await call('update.check',{},120000); return renderPage();
    case 'updDl': S.upd={...S.upd, state:'downloading'}; renderPage(); S.upd=await call('update.download',{},600000); return renderPage();
    case 'updInstall': return call('update.install');
    case 'updAuto': S.upd=await call('update.setAuto',{on:!S.upd.autoCheck}); return renderPage();
  } }catch(e){ toast(e.message); }
}
async function join(ssid, password){
  S.connecting=ssid; S.pw=null; renderPage();
  try{ const r=await call('wifi.connect',{ssid, password}, 60000); toast(r&&r.ok?`Connected to ${ssid}`:((r&&r.error)||'Couldn\'t connect')); }
  catch(e){ toast(e.message); }
  S.connecting=null; load('wifi');
}
async function choose(id, v){
  try{
    if(id==='res'){ const [w,h]=v.split('x').map(Number), m=S.display.modes.find(x=>x.width===w&&x.height===h); S.display=await call('display.setMode',{w,h,hz:(m&&m.rates&&m.rates[0])||60},30000); }
    else if(id==='rate') S.display=await call('display.setMode',{w:S.display.width,h:S.display.height,hz:+v},30000);
    else if(id==='scale') S.display=await call('display.setScale',{v:+v},30000);
    else if(id==='style') S.shell=await call('shell.setDesktopStyle',{style:v});
    else if(id==='mode'){ await call('power.setMode',{mode:v}); S.power=await call('power.get'); }
    else if(id==='mouse') S.pad=await call('pad.setMouseMode',{mode:v});
  }catch(e){ toast(e.message); }
  renderPage();
}

// Sliders: drag on the track, or Left/Right when focused.
let sliding=null;
function slideTo(el, frac){
  const id=el.dataset.slide, v=Math.round(Math.max(0,Math.min(1,frac))*100);
  el.querySelector('i').style.width=v+'%'; el.querySelector('.top span').textContent=v+'%';
  clearTimeout(slideTo.t);
  slideTo.t=setTimeout(()=>{
    if(id==='volume'){ if(S.audio){ S.audio.volume=v; S.audio.muted=false; } call('audio.setMute',{m:false}).catch(()=>{}); call('audio.setVolume',{v}).catch(()=>{}); }
    if(id==='brightness'){ if(S.display) S.display.brightness=Math.max(1,v); call('display.setBrightness',{v:Math.max(1,v)}).catch(()=>{}); }
  }, 40);
}
document.addEventListener('pointerdown', e => { const t=e.target.closest('.track'); if(!t) return; sliding=t.closest('[data-slide]'); t.setPointerCapture(e.pointerId); const r=t.getBoundingClientRect(); slideTo(sliding,(e.clientX-r.left)/r.width); });
document.addEventListener('pointermove', e => { if(!sliding) return; const t=sliding.querySelector('.track'), r=t.getBoundingClientRect(); slideTo(sliding,(e.clientX-r.left)/r.width); });
document.addEventListener('pointerup', () => { sliding=null; });

// ---------------------------------------------------------------- keyboard and controller
const focusables = () => $$('.page [data-f]');
function focusPaint(){
  $$('.f-on').forEach(x=>x.classList.remove('f-on'));
  if(!S.inPage) return;
  const f=focusables(); if(!f.length) return;
  S.f=Math.max(0,Math.min(S.f,f.length-1));
  const el=f[S.f]; el.classList.add('f-on'); el.scrollIntoView({block:'nearest'});
  if(el.tagName==='INPUT') el.focus(); else if(document.activeElement && document.activeElement.tagName==='INPUT') document.activeElement.blur();
}
document.addEventListener('keydown', e => {
  const typing=document.activeElement && document.activeElement.tagName==='INPUT';
  if(typing && e.key==='Enter'){ const i=document.activeElement; if(i.dataset.pw) join(i.dataset.pw, i.value); return; }
  if(typing && !['Escape','ArrowUp','ArrowDown'].includes(e.key)) return;
  const idx=PAGES.findIndex(p=>p[0]===S.page);
  if(!S.inPage){
    if(e.key==='ArrowDown'||e.key==='Tab'&&!e.shiftKey){ e.preventDefault(); return go(PAGES[Math.min(PAGES.length-1,idx+1)][0]); }
    if(e.key==='ArrowUp'||e.key==='Tab'&&e.shiftKey){ e.preventDefault(); return go(PAGES[Math.max(0,idx-1)][0]); }
    if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){ e.preventDefault(); S.inPage=true; S.f=0; renderNav(); return focusPaint(); }
    if(e.key==='Escape'){ e.preventDefault(); return send({type:'mantel', action:'closeSettings'}); }
    return;
  }
  const f=focusables(), el=f[S.f];
  switch(e.key){
    case 'ArrowDown': e.preventDefault(); S.f=Math.min(f.length-1,S.f+1); return focusPaint();
    case 'ArrowUp': e.preventDefault(); S.f=Math.max(0,S.f-1); return focusPaint();
    case 'ArrowLeft': case 'ArrowRight': {
      if(!el) return;
      const dir=e.key==='ArrowLeft'?-1:1;
      if(el.dataset.slide){ e.preventDefault(); const cur=parseFloat(el.querySelector('i').style.width)||0; return slideTo(el,(cur+dir*5)/100); }
      if(el.dataset.choice){ e.preventDefault(); const opts=[...el.querySelectorAll('.opt')], i=opts.findIndex(o=>o.classList.contains('on')), n=opts[Math.max(0,Math.min(opts.length-1,i+dir))]; if(n && n!==opts[i]) n.click(); return; }
      if(el.classList.contains('wall')){ e.preventDefault(); S.f=Math.max(0,Math.min(f.length-1,S.f+dir)); return focusPaint(); }
      if(dir<0){ e.preventDefault(); S.inPage=false; renderNav(); return focusPaint(); }
      return;
    }
    case 'Enter': case ' ': if(!el) return; e.preventDefault(); { const a=el.matches('[data-act]')?el:el.querySelector('[data-act]'); if(a) a.click(); } return;
    case 'Escape': e.preventDefault(); if(typing) document.activeElement.blur(); S.inPage=false; S.pw=null; renderNav(); renderPage(); return;
  }
});
document.addEventListener('click', e => {
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.closest('.page')){ const f=focusables(), i=f.indexOf(el.closest('[data-f]')); if(i>=0){ S.inPage=true; S.f=i; renderNav(); } }
  act(el);
});
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- from Ember
if(host) host.addEventListener('message', e => {
  const m=e.data; if(!m||typeof m!=='object') return;
  if(m.type==='result'){ const p=pending[m.id]; if(!p) return; delete pending[m.id]; m.ok ? p.ok(m.value) : p.no(new Error(m.error)); return; }
  if(m.type!=='event') return;
  const d=m.data;
  if(m.name==='status'){ S.st=d; if(['wifi','bluetooth'].includes(S.page)) renderPage(); }
  else if(m.name==='bt.found'){ if(d&&d.name&&!S.found.some(x=>x.id===d.id)&&!(S.paired||[]).some(x=>x.id===d.id)){ S.found.push(d); if(S.page==='bluetooth') renderPage(); } }
  else if(m.name==='bt.scanDone'){ S.btScan=false; if(S.page==='bluetooth') renderPage(); }
  else if(m.name==='bt.pin'){ toast(d.confirm?`Check the device shows ${d.pin}`:`Type ${d.pin} on the device`); if(d.confirm) call('bt.confirmPin',{accept:true}).catch(()=>{}); }
  else if(m.name==='update'){ S.upd=d; if(['updates','about'].includes(S.page)) renderPage(); }
  else if(m.name==='mantel.settingsPage'){ if(d&&d.page&&PAGES.some(p=>p[0]===d.page)) go(d.page); }
});

};
const startPage = new URLSearchParams(location.search).get('page');
if(startPage && PAGES.some(p=>p[0]===startPage)) S.page=startPage;
renderNav(); renderPage(); load(S.page);
if(host){ send({type:'ready'}); call('profile.get').then(p=>{ const a=p&&p.accent; if(/^#[0-9a-f]{6}$/i.test(a||'')){ document.documentElement.style.setProperty('--accent',a); const n=parseInt(a.slice(1),16); document.documentElement.style.setProperty('--accentInk',((n>>16&255)*.2126+(n>>8&255)*.7152+(n&255)*.0722)/255>.45?'#2a1206':'#ffffff'); } }).catch(()=>{}); }
</script>
