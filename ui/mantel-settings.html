<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Settings</title>
<!--
  Hearth Settings for Mantel on Windows: the desktop's own settings window, the same as Mantel's on Hearth OS
  (hosts/linux/desktop/shell/SettingsApp.qml and its Set*.qml pages): the same pages in the same order, the same
  rows, words and controls, the page list on the left and the page on the right. Works with the mouse, the
  keyboard and the controller: Up/Down pick a page, Right/Enter go into it, Up/Down move between controls,
  Left/Esc come back, Esc on the list closes. Hosted by Ember (Mantel/MantelHost.cs) in WebView2; uses the same
  bridge as the main UI. Things Windows does differently (or not at all) are listed in docs/MANTEL-PARITY.md;
  Windows-only settings sit under a "Windows" heading at the end of their page. Opens in a normal browser too,
  with sample data.
-->
<style>
:root{
  --bg:#0f0b09; --bg2:#17110e; --panel:#1c1512; --panel2:#261d18; --panel3:#33271f; --line:#3b2e26;
  --text:#f4ece3; --muted:#a69484; --danger:#ff5d5d; --ember:#ff8a3d; --flame:#ffd166; --accent:#ff8a3d; --accentInk:#2a1206;
  --quick:140ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.3 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus{outline:none}
.app{display:flex;height:100%}
/* ---- page list (SettingsApp.qml) ---- */
nav{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:4px}
@media (max-width:900px){nav{width:220px}}
.brand{display:flex;align-items:center;gap:10px;margin:6px 6px 14px}
.brand img{width:30px;height:30px}
.brand b{font-size:20px;font-weight:600}
.navlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.ni{height:48px;flex:none;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:15px;transition:background var(--quick)}
.ni:hover{background:var(--panel2)}
.ni.lit{background:var(--panel3);font-weight:600}
.ni.lit svg{color:var(--accent)}
nav.focus .ni.lit{background:var(--accent);color:var(--accentInk)}
nav.focus .ni.lit svg{color:var(--accentInk)}
.navhint{padding:6px 6px 0;color:var(--muted);font-size:12px}
/* ---- a page (SetPage.qml): left-aligned, up to 820 wide ---- */
main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent;scroll-behavior:smooth}
.page{width:min(100% - 48px,820px);margin:20px 24px 48px;display:flex;flex-direction:column;gap:8px}
.page h1{font-size:26px;font-weight:600;margin-bottom:6px}
.hd{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-top:14px}
/* SetRow / SetBase */
.row{min-height:64px;border-radius:12px;background:var(--panel2);border:2px solid transparent;display:flex;align-items:center;gap:14px;padding:10px 16px;width:100%;transition:background var(--quick),border-color var(--quick)}
button.row:hover{background:var(--panel3)}
.row.f-on,.choice.f-on,.wall.f-on,.field.f-on{border-color:var(--accent)}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .tx b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:pre}
.row .tx small{font-size:12px;color:var(--muted)}
.row .val{color:var(--muted);font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--muted);font-size:20px}
.row.danger .tx b,.row.danger .ic{color:var(--danger)}
.row.fact{min-height:52px}
.row.narrow{width:140px;flex:none}
.row.mid{width:160px;flex:none}
/* SetSwitch */
.sw{width:46px;height:26px;border-radius:13px;background:var(--panel3);position:relative;flex:none;transition:background var(--quick)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:var(--text);transition:left var(--quick),background var(--quick)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px;background:var(--accentInk)}
/* SetSlider */
.slider{min-height:76px;padding-right:18px}
.slider .tx{gap:10px}
.slider .tx .top{display:flex;justify-content:space-between}
.slider .tx .top span{color:var(--muted);font-size:13px;font-weight:400}
.track{position:relative;height:8px;border-radius:4px;background:var(--panel3);cursor:pointer}
.track::before{content:"";position:absolute;inset:-14px 0}
.track i{position:absolute;left:0;top:0;bottom:0;min-width:8px;border-radius:4px;background:linear-gradient(90deg,var(--ember),var(--flame))}
/* SetChoice */
.choice{border-radius:12px;background:var(--panel2);border:2px solid transparent;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;transition:border-color var(--quick)}
.choice .t b{font-size:15px;font-weight:600}
.choice .t small{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.opts{display:flex;gap:8px}
.opt{flex:1;min-width:0;height:40px;border-radius:10px;background:var(--panel3);text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.opt.on{background:var(--accent);color:var(--accentInk);font-weight:600}
/* SetField */
.field{height:52px;border-radius:12px;background:var(--panel3);border:2px solid transparent;display:flex;flex:1;transition:border-color var(--quick)}
.field input{flex:1;min-width:0;background:none;border:0;padding:0 14px;color:var(--text);font-size:15px}
.field input::placeholder{color:var(--muted)}
.pwline{display:flex;gap:8px;margin-left:52px;align-items:stretch}
/* the wallpaper grid (SetAppearance.qml) */
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wall{height:130px;border-radius:12px;background:var(--panel2);border:2px solid transparent;padding:4px;transition:border-color var(--quick)}
.wall:hover{background:var(--panel3)}
.wall.on{border-color:color-mix(in srgb,var(--accent) 80%,#fff)}
.wall .pv{position:relative;width:100%;height:100%;border-radius:9px;overflow:hidden;background:#1a110c center/cover no-repeat}
.wall .pv.fire{background:radial-gradient(ellipse 70% 100% at 50% 115%,#ff8a3d99,transparent 70%),#1a110c}
.wall .lab{position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(transparent,#000c);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#fff;gap:6px}
.wall .lab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall .lab i{font-style:normal;color:var(--flame);font-size:14px;font-weight:700}
/* text lines, banners, progress */
.note{color:var(--muted);font-size:13px;padding-left:4px}
.note.small{font-size:12px;padding-left:0}
.note.bad{color:var(--danger)}
.note.good{color:var(--flame)}
.banner{border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);border:1px solid var(--accent);padding:14px;display:flex;flex-direction:column;gap:8px}
.banner b{font-size:15px;font-weight:600}
.banner .btns{display:flex;gap:8px}
.prog{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.prog .pl{display:flex;justify-content:space-between;font-size:14px}
.prog .pl b{color:var(--flame);font-weight:600}
.bar{position:relative;height:8px;border-radius:4px;background:var(--panel3);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;min-width:8px;border-radius:4px;background:linear-gradient(90deg,var(--ember),var(--flame));transition:width .3s}
.bar i.busy{width:30%;animation:busy 1.8s ease-in-out infinite}
@keyframes busy{0%,100%{left:0}50%{left:70%}}
.about{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.about img{width:64px;height:64px}
.about b{display:block;font-size:22px;font-weight:600}
.about small{color:var(--muted);font-size:13px}
.swatch{flex:0 0 52px !important;min-width:52px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel3) center/cover no-repeat;display:grid;place-items:center;font-size:16px;font-weight:600;flex:none}
.avatar.big{width:56px;height:56px;font-size:20px}
.btnrow{display:flex;gap:8px;margin-left:52px}
.btnrow .row{flex:1;min-height:52px}
.twofield{display:flex;gap:8px}
.page>.field{flex:none}
.confirm{margin-left:52px;display:flex;flex-direction:column;gap:8px}
.confirm p{font-size:14px}
.msg{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(28,21,18,.92);border:1px solid var(--line);border-radius:22px;height:44px;padding:0 18px;display:flex;align-items:center;font-size:14px;opacity:0;transition:opacity var(--quick);pointer-events:none;z-index:5}
.msg.show{opacity:1}
</style>
</head>
<body>
<div class="app"><nav></nav><main><div class="page"></div></main></div>
<div class="msg"></div>
<script src="mantel-icons.js"></script>
<script>
'use strict';
const host = window.chrome && window.chrome.webview ? window.chrome.webview : null;
const send = m => host ? host.postMessage(m) : null;
const mantel = (action, extra) => send({type:'mantel', action, ...(extra||{})});
let callId = 0; const pending = {};
const call = (method, args={}, ms=30000) => host ? new Promise((ok, no) => {
  const id = ++callId; pending[id] = {ok, no}; send({type:'call', id, method, args});
  setTimeout(() => { if(pending[id]){ delete pending[id]; no(new Error('That took too long')); } }, ms);
}) : (MOCK[method] ? Promise.resolve(MOCK[method](args)) : Promise.reject(new Error('preview')));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
// Hearth's own icons (the same as Icon.qml draws); a dot if one's missing.
const I = new Proxy(window.HEARTH_ICONS || {}, {get:(o,k)=>o[k] || o.dot || ''});

// ---------------------------------------------------------------- pages (SettingsApp.qml's list, in its order)
const PAGES = [['wifi','wifi','Wi-Fi'],['bluetooth','bt','Bluetooth'],['sound','vol','Sound'],['display','display','Display'],['appearance','palette','Appearance'],
  ['power','power','Power'],['controller','pad','Controller'],['keyboard','kbd','Keyboard'],['printers','printer','Printers'],['datetime','clock','Date & time'],
  ['defaults','grid','Default apps'],['clipboard','clipboard','Clipboard'],['users','user','Users'],['signin','lock','Sign-in'],['browser','globe','Web browser'],['updates','update','Updates'],['about','info','About']];
const S = {page:'wifi', inPage:false, f:0, st:null, nets:null, scanning:false, busy:'', asking:'', msg:'', paired:null, found:[], btScan:false, btBusy:'', btMsg:'',
  audio:null, input:null, display:null, prev:null, countdown:0, power:null, powerError:'', shell:null, desk:null, pad:null, overlay:null, upd:null, sys:null, user:'',
  profile:null, browser:null, signMsg:'', signBad:false,
  // Date & time, Keyboard, Default apps, Users, Printers, Clipboard (SetDateTime.qml … SetClipboard.qml)
  pm:null, inputs:{}, busyWhat:'', tm:null, zones:[], region:'', mantel:null, kb:null, kbAll:[], kbShort:[], kbPicked:-1,
  defaults:null, users:null, usPicked:'', usConfirm:'', printers:null, prPicked:'', prConfirm:'', clip:null, clipConfirm:false};
// A result line under the page's first rows (each page's "message" on Hearth OS).
const say = (text, bad) => { S.pm={page:S.page, text, bad:!!bad}; renderPage(); };
const pageMsg = () => S.pm && S.pm.page===S.page && S.pm.text ? note(S.pm.text, S.pm.bad?'bad':'good') : '';
const inputVal = id => (S.inputs[id]||'');

function toast(t){ const m=$('.msg'); m.textContent=t; m.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>m.classList.remove('show'), 1800); }
function renderNav(){
  $('nav').innerHTML = `<div class="brand"><img src="hearth-logo.svg" alt=""><b>Settings</b></div><div class="navlist">`
    + PAGES.map(([id,ic,l])=>`<button class="ni ${S.page===id?'lit':''}" data-act="page" data-p="${id}">${I[ic]}${l}</button>`).join('')
    + `</div><div class="navhint">Ⓐ open  Ⓑ back</div>`;
  $('nav').classList.toggle('focus', !S.inPage);
  const lit=$('.ni.lit'); if(lit) lit.scrollIntoView({block:'nearest'});
}

// ---------------------------------------------------------------- building blocks (Set*.qml)
// SetRow: icon, title, a line of explanation, a value, and an arrow when it does something (chev:false hides it).
// Rows that don't do anything (act unset) aren't in the focus order, like interactive:false on Hearth OS.
const row = o => { const tag=o.act?'button':'div', chev=o.act && o.chev!==false && o.sw==null;
  return `<${tag} class="row ${o.danger?'danger':''} ${o.cls||''}" ${o.act?`data-f data-act="${o.act}"`:''} ${o.data||''}>${o.icon?`<div class="ic">${I[o.icon]}</div>`:''}<div class="tx"><b>${esc(o.title)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</div>${o.val?`<div class="val">${esc(o.val)}</div>`:''}${o.sw!=null?`<div class="sw ${o.sw?'on':''}"></div>`:''}${chev?'<div class="chev">›</div>':''}</${tag}>`; };
// SetSlider: frac is 0..1; the value text and what Left/Right does come from SLIDERS.
const slider = (id, icon, title, frac) => `<div class="row slider" data-f data-slide="${id}"><div class="ic">${I[icon]}</div><div class="tx"><b class="top">${esc(title)}<span>${esc(SLIDERS[id].text(frac))}</span></b><div class="track"><i style="width:${Math.max(0,Math.min(1,frac))*100}%"></i></div></div></div>`;
// SetChoice: segmented options; Left/Right move between them, Enter takes the next one.
const choice = (id, title, sub, opts, cur) => `<div class="choice" data-f data-choice="${id}"><div class="t"><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div><div class="opts">${opts.map(([v,l,style])=>`<button class="opt ${style?'swatch':''} ${String(v)===String(cur)?'on':''}" data-act="choose" data-id="${id}" data-v="${esc(v)}" ${style?`style="${style}" title="${esc(l)}"`:''}>${style?'':esc(l)}</button>`).join('')}</div></div>`;
const hd = t => `<div class="hd">${esc(t)}</div>`;
const note = (t, cls='') => `<div class="note ${cls}">${esc(t)}</div>`;
const field = (id, placeholder, secret) => `<label class="field" data-f data-field="${id}"><input ${secret?'type="password"':''} placeholder="${esc(placeholder)}" spellcheck="false" data-input="${id}"></label>`;
const bars = b => b >= 4 ? '▂▄▆█' : b === 3 ? '▂▄▆' : b === 2 ? '▂▄' : '▂';
const hm = s => { if(!s || s <= 0) return ''; const h=Math.floor(s/3600), m=Math.round((s%3600)/60); return h ? `${h} h ${m} min` : `${m} min`; };
const progress = (line, frac) => `<div class="prog"><div class="pl"><span>${esc(line)}</span>${frac>=0?`<b>${Math.floor(frac*100)}%</b>`:''}</div><div class="bar"><i class="${frac>=0?'':'busy'}" ${frac>=0?`style="width:${Math.max(0,Math.min(1,frac))*100}%"`:''}></i></div></div>`;

const SLIDERS = {
  volume:{text:f=>Math.round(f*100)+'%', step:.05, set:f=>{ const v=Math.round(f*100); if(S.audio){ S.audio.volume=v; S.audio.muted=false; } call('audio.setMute',{m:false}).catch(()=>{}); call('audio.setVolume',{v}).catch(()=>{}); }},
  input:{text:f=>Math.round(f*100)+'%', step:.05, set:f=>{ const v=Math.round(f*100); if(S.input) S.input.volume=v; call('audio.setInputVolume',{v}).catch(e=>toast(e.message)); }},
  brightness:{text:f=>Math.round(f*100)+'%', step:.05, set:f=>{ const v=Math.max(1,Math.round(f*100)); if(S.display) S.display.brightness=v; call('display.setBrightness',{v}).catch(()=>{}); }},
  kdelay:{text:f=>(250+Math.round(f*3)*250)+' ms', step:1/3, set:f=>{ if(S.kb){ S.kb.delay=250+Math.round(f*3)*250; kbSoon(); } }},
  krate:{text:f=>Math.round(2.5+f*27.5)+' per second', step:1/31, set:f=>{ if(S.kb){ S.kb.rate=Math.round(2.5+f*27.5); kbSoon(); } }},
  speed:{text:f=>(Math.round((0.4+f*1.6)*10)/10).toFixed(1)+'×', step:.0625, set:f=>{ const v=Math.round((0.4+f*1.6)*10)/10; if(S.desk) S.desk.pointerSpeed=v; call('desktop.set',{key:'pointerSpeed', value:v}).catch(e=>toast(e.message)); }},
};

// ---------------------------------------------------------------- the pages
function renderPage(){
  const p=S.page, title=(PAGES.find(x=>x[0]===p)||[])[2]||'';
  let h=`<h1>${esc(title)}</h1>`;
  const st=S.st||{};
  if(p==='wifi'){   // SetWifi.qml
    const w=st.wifi||{}, inUse=(S.nets||[]).find(n=>n.connected);
    h += row({icon:'wifi', title:'Wi-Fi', sub:w.on?(inUse?`Connected to ${inUse.ssid}`:w.ssid?`Connected to ${w.ssid}`:'Not connected'):'Off', sw:!!w.on, act:'wifiToggle'});
    if(S.msg) h += note(S.msg);
    if(w.on){
      h += hd(S.scanning?'Networks · looking…':'Networks');
      for(const n of S.nets||[]){
        const sub = n.connected ? 'Connected' : S.busy===n.ssid ? 'Connecting…' : n.saved ? 'Saved' : n.secure ? 'Secured' : 'Open';
        h += row({icon:'wifi', title:n.ssid, sub, val:bars(n.bars||0)+(n.secure?'  🔒':''), act:'wifiNet', data:`data-ssid="${esc(n.ssid)}"`});
        if(S.asking===n.ssid) h += `<div class="pwline">${field('pw', 'Password for '+n.ssid, true)}${row({title:'Connect', act:'wifiJoin', chev:false, cls:'narrow', data:`data-ssid="${esc(n.ssid)}"`})}</div>`;
      }
      h += row({icon:'restart', title:'Look again', chev:false, act:'wifiScan'});
    }
    else h += note('Turn on Wi-Fi to see networks.');
  }
  else if(p==='bluetooth'){   // SetBluetooth.qml
    const b=st.bt||{}, paired=S.paired||[], conn=paired.filter(d=>d.connected);
    h += row({icon:'bt', title:'Bluetooth', sub:b.on?(conn.length?conn.map(d=>d.name).join(', ')+' connected':'On'):'Off', sw:!!b.on, act:'btToggle'});
    if(S.btMsg) h += note(S.btMsg);
    if(b.on){
      h += hd('Your devices');
      // Windows connects paired devices by itself; selecting one opens Windows' Bluetooth settings to connect or disconnect it.
      h += paired.map(d=>row({icon:'pad', title:d.name, sub:S.btBusy===d.id?'Working…':d.connected?'Connected · select for Windows\' Bluetooth settings':'Not connected · select for Windows\' Bluetooth settings', val:d.connected?'Connected':'', act:'btDevice', data:`data-id="${esc(d.id)}"`})).join('');
      if(S.paired && !paired.length) h += note('No devices yet. Put a controller or headphones in pairing mode, then look for devices.');
      if(!S.paired) h += note('Loading…');
      h += hd(S.btScan?'New devices · looking…':'New devices');
      h += row({icon:'bt', title:S.btScan?'Looking for devices…':'Look for devices', sub:'Put the device in pairing mode first', chev:false, act:'btScan'});
      h += S.found.map(d=>row({icon:'dot', title:d.name, sub:S.btBusy===d.id?'Pairing…':'Select to pair', act:'btPair', data:`data-id="${esc(d.id)}"`})).join('');
      if(paired.length){
        h += hd('Manage');
        h += paired.map(d=>row({icon:'close', danger:true, title:'Forget '+d.name, chev:false, act:'btForget', data:`data-id="${esc(d.id)}"`})).join('');
      }
    }
  }
  else if(p==='sound'){   // SetSound.qml
    const a=S.audio||(st.audio?{...st.audio, devices:[]}:null);
    if(!a) h += note('Loading…');
    else {
      h += slider('volume', a.muted?'vol-mute':'vol', 'Volume', a.muted?0:(a.volume||0)/100);
      h += row({icon:'vol-mute', title:'Mute', sw:!!a.muted, act:'mute'});
      h += hd('Play sound through');
      h += (a.devices||[]).map(d=>row({icon:'vol', title:d.name, val:d.isDefault?'In use':'', chev:false, act:'audioDev', data:`data-id="${esc(d.id)}"`})).join('');
      h += hd('Microphone');
      const i=S.input;
      if(i && i.present!==false) h += slider('input', 'mic', 'Input volume', (i.volume||0)/100);
      if(i) h += (i.devices||[]).map(d=>row({icon:'mic', title:d.name, val:d.isDefault?'In use':'', chev:false, act:'inputDev', data:`data-id="${esc(d.id)}"`})).join('');
    }
  }
  else if(p==='display'){   // SetDisplay.qml
    const d=S.display;
    if(S.countdown>0) h += `<div class="banner"><b>Keep these display settings? Going back in ${S.countdown} s</b><div class="btns">${row({title:'Keep', chev:false, act:'dispKeep', cls:'mid'})}${row({title:'Go back', chev:false, act:'dispRevert', cls:'mid'})}</div></div>`;
    if(!d) h += note('Loading…');
    else {
      if(d.supported) h += slider('brightness', 'sun', 'Brightness', (d.brightness||0)/100);
      if(d.scales&&d.scales.length) h += choice('scale','Scale','Makes text and everything else bigger or smaller', d.scales.map(s=>[s, s+'%']), d.scalePercent);
      const modes=(d.modes||[]).slice().sort((a,b)=>b.width*b.height-a.width*a.height);
      const cur=modes.find(m=>m.width===d.width&&m.height===d.height);
      const rates=cur&&cur.rates?[...new Set(cur.rates.map(Math.round))].sort((a,b)=>b-a):[];

// The wallpaper grid: the moving ones, then Hearth's pictures (named like on Hearth OS, A–Z by file), then yours.
const WALL_NAMES = {fireside:'Fireside (still)', embers:'Embers', ridge:'Dusk Ridge', mark:'The Mark', kiln:'Kiln', cat:'Hearth Cat', cabin:'Night Cabin',
  lanterns:'Lanterns', bloom:'Ember Bloom', peaks:'Low Poly Peaks', forge:'Forge Grid', topo:'Cinder Topo', fox:'Fox Moon'};
function wallpapers(s){
  const list=[['anim:fireside','Fireside','fire',''],['anim:lava','Lava','','mantel-img/wall-lava.jpg'],['anim:aurora','Aurora','','mantel-img/wall-aurora.jpg']];
  for(const id of Object.keys(WALL_NAMES).sort()) list.push(['hearth-'+id, WALL_NAMES[id], '', `wallpapers/hearth-${id}-thumb.jpg`]);
  for(const f of (s.pictures||[])) list.push(['custom:'+f, f.replace(/\.(jpe?g|png|webp|bmp)$/i,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()), '', 'https://hearth-walls.local/'+encodeURIComponent(f)]);
  list.push(['', 'Your Windows wallpaper', '', '']);
  return list;
}

// Date & time: "2026-10-19T19:40:27-07:00" → the time and date as they are in the chosen zone (not this page's).
function tmNow(t, c24){
  const m=String(t.now||'').match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/); if(!m) return '';
  const hh=+m[4], time = c24 ? m[4]+':'+m[5] : ((hh+11)%12+1)+':'+m[5]+(hh<12?' AM':' PM');
  return time+' · '+new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}
const KB_SWITCH = [['','None'],['alt_shift','Alt+Shift'],['ctrl_shift','Ctrl+Shift']];
// Keyboard: changes are saved together (sliders once they stop).
function kbSave(){
  const k=S.kb; if(!k) return;
  S.busyWhat='kb'; renderPage();
  call('keyboard.set', {layouts:k.layouts.map(l=>l.tip), switch:k.switch, delay:k.delay, rate:k.rate}, 120000)
    .then(r=>{ S.kb=r; S.busyWhat=''; say('Saved and in use.'); }).catch(e=>{ S.busyWhat=''; say(e.message, true); load('keyboard'); });
}
function kbSoon(){ clearTimeout(kbSoon.t); kbSoon.t=setTimeout(kbSave, 900); }
// Settings that ask Windows for an administrator's OK, or take a while: "Saving…" while they run.
async function busy(what, fn, ok){
  S.busyWhat=what; renderPage();
  try{ await fn(); S.busyWhat=''; if(ok) say(ok); else renderPage(); }
  catch(e){ S.busyWhat=''; say(e.message, true); }
}

// ---------------------------------------------------------------- loading
function load(p){
  const st=()=>call('sys.status').then(s=>{ S.st=s; renderPage(); }).catch(()=>{});
  const desk=()=>call('desktop.get').then(d=>{ S.desk=d; renderPage(); }).catch(()=>{});
  const shell=()=>call('shell.status').then(s=>{ S.shell=s; renderPage(); }).catch(()=>{});
  if(p==='wifi'){ st(); scan(); }
  if(p==='bluetooth'){ st(); call('bt.paired').then(l=>{ S.paired=l||[]; renderPage(); }).catch(e=>{ S.paired=[]; S.btMsg=e.message; renderPage(); }); }
  if(p==='sound'){ call('audio.get').then(a=>{ S.audio=a; renderPage(); }).catch(e=>toast(e.message)); call('audio.input').then(i=>{ S.input=i; renderPage(); }).catch(()=>{ S.input=null; }); }
  if(p==='display') call('display.get').then(d=>{ S.display=d; renderPage(); }).catch(e=>toast(e.message));
  if(p==='appearance'){ shell(); desk(); call('profile.get').then(pr=>{ S.profile=pr; renderPage(); }).catch(()=>{}); }
  if(p==='power'){ desk(); call('power.get').then(pw=>{ S.power=pw; renderPage(); }).catch(e=>toast(e.message)); }
  if(p==='controller'){ desk(); call('pad.status').then(c=>{ S.pad=c; renderPage(); }).catch(()=>{}); call('overlay.settings').then(o=>{ S.overlay=o; renderPage(); }).catch(()=>{}); }
  if(p==='signin'){ shell(); desk(); call('system.info').then(i=>{ S.sys=i; renderPage(); }).catch(()=>{}); }
  if(p==='browser') call('browser.status').then(b=>{ S.browser=b; renderPage(); }).catch(()=>{ S.browser={installed:false}; renderPage(); });
  if(p==='updates'||p==='about') call('update.status').then(u=>{ S.upd=u; renderPage(); }).catch(()=>{});
  if(p==='keyboard'){ call('keyboard.get',{},60000).then(k=>{ S.kb=k; renderPage(); }).catch(e=>say(e.message, true)); call('keyboard.layouts').then(r=>{ S.kbAll=(r&&r.layouts)||[]; renderPage(); }).catch(()=>{}); call('keyboard.shortcuts').then(r=>{ S.kbShort=(r&&r.shortcuts)||[]; renderPage(); }).catch(()=>{}); }
  if(p==='printers') call('printers.get').then(r=>{ S.printers=r; renderPage(); }).catch(e=>say(e.message, true));
  if(p==='datetime'){ call('time.get').then(t=>{ S.tm=t; renderPage(); }).catch(()=>{}); call('time.zones').then(r=>{ S.zones=(r&&r.zones)||[]; renderPage(); }).catch(()=>{}); call('desk.get').then(d=>{ S.mantel=d; renderPage(); }).catch(()=>{}); }
  if(p==='defaults') call('defaults.get').then(d=>{ S.defaults=d; renderPage(); }).catch(e=>say(e.message, true));
  if(p==='users') call('users.get').then(u=>{ S.users=u; renderPage(); }).catch(e=>say(e.message, true));
  if(p==='clipboard') call('clipboard.status').then(c=>{ S.clip=c; renderPage(); }).catch(()=>{ S.clip={available:false}; renderPage(); });
  if(p==='about'){ call('system.info').then(i=>{ S.sys=i; renderPage(); }).catch(()=>{}); call('host.info').then(h=>{ S.user=(h&&h.user)||''; renderPage(); }).catch(()=>{}); }
}
async function scan(){
  if(S.scanning) return; S.scanning=true; renderPage();
  try{ S.nets=(await call('wifi.scan',{},30000))||[]; S.nets.sort((a,b)=>(b.connected-a.connected)||((b.bars||0)-(a.bars||0))); }catch(e){ if(!S.nets) S.nets=[]; }
  S.scanning=false; renderPage();
}
// Wi-Fi looks again every 15 seconds and Bluetooth every 8 while their page is open, like on Hearth OS.
setInterval(()=>{ if(S.page==='wifi' && !S.asking){ call('sys.status').then(s=>{ S.st=s; }).catch(()=>{}); scan(); } }, 15000);
// Date & time looks again every 20 seconds, Printers every 15, like their pages on Hearth OS.
setInterval(()=>{ if(S.page==='datetime' && !S.busyWhat) call('time.get').then(t=>{ S.tm=t; renderPage(); }).catch(()=>{}); }, 20000);
setInterval(()=>{ if(S.page==='printers' && !S.busyWhat) call('printers.get').then(r=>{ S.printers=r; renderPage(); }).catch(()=>{}); }, 15000);
setInterval(()=>{ if(S.page==='bluetooth' && !S.btScan) call('bt.paired').then(l=>{ S.paired=l||[]; renderPage(); }).catch(()=>{}); }, 8000);
function go(p){ S.page=p; S.f=0; S.asking=''; S.msg=''; S.btMsg=''; S.signMsg=''; S.pm=null; S.region=''; S.kbPicked=-1; S.usPicked=''; S.usConfirm=''; S.prPicked=''; S.prConfirm=''; S.clipConfirm=false; renderNav(); $('main').scrollTop=0; renderPage(); load(p); }

// ---------------------------------------------------------------- actions
async function act(el){
  const d=el.dataset, st=S.st||{};

    case 'page': S.inPage=false; return go(d.p);

    case 'wifiScan': return scan();
    case 'wifiNet': { const n=(S.nets||[]).find(x=>x.ssid===d.ssid); if(!n) return;
      if(n.connected){ await call('wifi.disconnect'); S.msg='Disconnected from '+n.ssid; return load('wifi'); }
      if(n.secure && !n.saved){ S.asking=n.ssid; renderPage(); const i=$('[data-input="pw"]'); if(i){ S.f=focusables().indexOf(i.closest('[data-f]')); focusPaint(); } return; }
      return join(n.ssid, null); }
    case 'wifiJoin': return join(d.ssid, ($('[data-input="pw"]')||{}).value||'');
    // Bluetooth
    case 'btToggle': { const on=!(st.bt&&st.bt.on); S.st=await call('radios.set',{kind:'bt', on}); S.btMsg=on?'Bluetooth on':'Bluetooth off'; return load('bluetooth'); }
    case 'btDevice': return mantel('uri', {uri:'ms-settings:bluetooth'});
    case 'btScan': if(S.btScan) return; S.found=[]; S.btScan=true; renderPage(); return call('bt.scanStart',{seconds:12}).catch(e=>{ S.btScan=false; S.btMsg=e.message; renderPage(); });
    case 'btPair': { const dev=S.found.find(x=>x.id===d.id); S.btBusy=d.id; renderPage(); const r=await call('bt.pair',{id:d.id},60000); S.btBusy='';
      S.btMsg = r&&r.ok===false ? (r.error||'That didn\'t work') : (dev?dev.name:'The device')+' is paired'; S.found=S.found.filter(x=>x.id!==d.id); return load('bluetooth'); }
    case 'btForget': { const dev=(S.paired||[]).find(x=>x.id===d.id); const r=await call('bt.unpair',{id:d.id}); S.btMsg = r&&r.ok===false ? (r.error||'That didn\'t work') : (dev?dev.name:'The device')+' forgotten'; return load('bluetooth'); }
    // Sound
    case 'mute': { const a=S.audio; if(!a) return; a.muted=!a.muted; renderPage(); return call('audio.setMute',{m:a.muted}); }
    case 'audioDev': S.audio=await call('audio.setDefault',{id:d.id}); return renderPage();
    case 'inputDev': await call('audio.setDefault',{id:d.id}); S.input=await call('audio.input'); return renderPage();
    // Display
    case 'dispRes': { const w=+d.w, hh=+d.h, m=(S.display.modes||[]).find(x=>x.width===w&&x.height===hh); return applyDisplay({w, h:hh, hz:(m&&m.rates&&Math.max(...m.rates))||60}); }
    case 'dispKeep': S.countdown=0; S.prev=null; return renderPage();
    case 'dispRevert': return revertDisplay();
    // Appearance
    case 'choose': return choose(d.id, d.v);
    case 'wall': S.shell=await call('shell.setWallpaper',{name:d.v}); return renderPage();
    case 'wallPick': { const s=await call('shell.pickWallpaper',{},120000); if(s) S.shell=s; return renderPage(); }
    case 'night': case 'motion': { const key=d.act==='night'?'nightLight':'reduceMotion'; const v=!(S.desk&&S.desk[key]); S.desk=await call('desktop.set',{key, value:v}); return renderPage(); }
    // Controller
    case 'padMouse': { const r=await call('pad.toggleMouse'); S.pad={...(S.pad||{}), mouseOn:!!(r&&r.mouseOn)}; return renderPage(); }
    case 'gameBar': S.overlay=await call('overlay.setGameBarButton',{on:!S.overlay.gameBarButton}); return renderPage();
    case 'help': return mantel('help');
    case 'keyboard': return mantel('keyboard');
    // Sign-in
    case 'lockWake': { const v=!(S.desk&&S.desk.lockOnWake); S.desk=await call('desktop.set',{key:'lockOnWake', value:v}); S.signMsg=v?'It will ask for your password when it wakes.':'It won\'t ask for your password when it wakes.'; S.signBad=false; return renderPage(); }
    // Keyboard
    case 'kbPick': S.kbPicked = S.kbPicked===+d.i ? -1 : +d.i; return renderPage();
    case 'kbMove': { const i=+d.i, j=i+(+d.d), l=S.kb.layouts.slice(); if(j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; S.kb.layouts=l; S.kbPicked=-1; kbSave(); return; }
    case 'kbRemove': S.kb.layouts=S.kb.layouts.filter((x,i)=>i!==+d.i); S.kbPicked=-1; S.f=0; return kbSave();
    case 'kbAdd': if(S.kb.layouts.length>=4) return say('Up to 4 layouts.', true); S.kb.layouts=S.kb.layouts.concat([{tip:d.tip, name:d.name}]); S.inputs.kbAdd=''; return kbSave();

    case 'prTest': return busy('test', ()=>call('printers.test', {name:d.n}, 60000), 'Test page sent to '+d.n+'.');
    case 'prDefault': return busy('default', async ()=>{ S.printers=await call('printers.default', {name:d.n}); }, d.n+' is now the default printer.');
    case 'prConfirm': S.prConfirm=d.n; return renderPage();
    case 'prCancel': S.prConfirm=''; return renderPage();
    case 'prRemove': return busy('remove', async ()=>{ S.printers=await call('printers.remove', {name:d.n}, 60000); S.prPicked=''; S.prConfirm=''; }, 'Printer removed.');
    // Date & time
    case 'tmNtp': { const on=!(S.tm&&S.tm.ntp); return busy('ntp', async ()=>{ S.tm=await call('time.setNtp', {on}, 180000); }, on?'The clock will be set from the internet.':'Automatic time is off.'); }
    case 'tmSet': {
      const dt=inputVal('tmDate').trim(), tt=inputVal('tmTime').trim().replace(/^(\d):/, '0$1:');

      if(!/^\d\d:\d\d$/.test(tt)) return say('Type the time like 14:05.', true);
      return busy('time', async ()=>{ S.tm=await call('time.set', {when:dt+' '+tt}, 180000); S.inputs.tmDate=''; S.inputs.tmTime=''; }, 'Clock set.');
    }
    case 'tmRegion': { const was=S.region; S.region=d.r||''; renderPage(); const f=focusables(); if(S.region){ S.f=Math.max(0, f.findIndex(x=>x.dataset.act==='tmRegion')); } else { const i=f.findIndex(x=>x.dataset.r===was); S.f=i>=0?i:S.f; } return focusPaint(); }
    case 'tmZone': {
      const z=(S.zones||[]).find(x=>x.zone===d.z); if(!z || (S.tm && S.tm.timezone===z.zone)) return;
      return busy('zone', async ()=>{ S.tm=await call('time.setZone', {zone:z.zone}, 60000); S.inputs.tz=''; S.region=''; }, 'Time zone set to '+z.city+'.');
    }
    // Clipboard
    case 'cbToggle': { const on=!(S.clip&&S.clip.enabled); S.clip=await call('clipboard.set', {on}); return say(on?'Clipboard history is on.':"Clipboard history is off. What's already kept stays until you clear it."); }
    case 'cbOpen': return mantel('openApp', {app:'clipboard'});
    case 'cbConfirm': S.clipConfirm=true; return renderPage();
    case 'cbCancel': S.clipConfirm=false; return renderPage();
    case 'cbClear': await call('clipboard.clear'); S.clipConfirm=false; return say('Clipboard history cleared.');
    // Users
    case 'usPick': S.usPicked = S.usPicked===d.n ? '' : d.n; S.usConfirm=''; return renderPage();
    case 'usConfirm': S.usConfirm=d.n; return renderPage();
    case 'usCancel': S.usConfirm=''; return renderPage();
    case 'usRemove': { const del=d.del==='1', n=d.n; return busy('remove', async ()=>{ S.users=await call('users.remove', {name:n, deleteFiles:del}, 300000); S.usPicked=''; S.usConfirm=''; },
      del ? n+' and their files were removed.' : n+' was removed. Their files are still there.'); }
    // Power and the rest
    case 'game': return mantel('game');
    case 'pw': return mantel('power', {what:d.what});
    case 'uri': return mantel('uri', {uri:d.v});
    case 'updCheck': S.upd={...S.upd, state:'checking'}; renderPage(); S.upd=await call('update.check',{},120000); return renderPage();
    case 'updDl': S.upd={...S.upd, state:'downloading'}; renderPage(); S.upd=await call('update.download',{},600000); return renderPage();
    case 'updInstall': return call('update.install');
    case 'updAuto': S.upd=await call('update.setAuto',{on:!S.upd.autoCheck}); return renderPage();
  } }catch(e){
    if(S.page==='wifi') { S.msg=e.message; renderPage(); }
    else if(S.page==='bluetooth') { S.btMsg=e.message; renderPage(); }
    else if(S.page==='signin') { S.signMsg=e.message; S.signBad=true; renderPage(); }
    else toast(e.message);
  }
}
async function join(ssid, password){
  S.busy=ssid; S.asking=''; S.msg=''; renderPage();
  try{ const r=await call('wifi.connect',{ssid, password}, 60000); S.msg = r&&r.ok ? `Connected to ${ssid}` : ((r&&r.error)||'That didn\'t work'); }
  catch(e){ S.msg=e.message; }
  S.busy=''; load('wifi');
}
// A new display mode or scale is kept only if you say so within 15 seconds (so one the screen can't show fixes itself).
async function applyDisplay(next){
  const d=S.display; if(!d) return;
  if(!S.countdown) S.prev={w:d.width, h:d.height, hz:d.refreshRate, scale:d.scalePercent};
  try{
    if(next.scale) S.display=await call('display.setScale',{v:next.scale},30000);
    else S.display=await call('display.setMode',{w:next.w, h:next.h, hz:next.hz},30000);
  }catch(e){ toast(e.message); return renderPage(); }
  S.countdown=15; renderPage();
  const keep=$('[data-act="dispKeep"]'); if(keep){ S.inPage=true; S.f=focusables().indexOf(keep); renderNav(); focusPaint(); }
}
async function revertDisplay(){
  const p=S.prev; S.countdown=0; S.prev=null;
  if(p){ try{
    const d=S.display||{};
    if(p.scale && p.scale!==d.scalePercent) S.display=await call('display.setScale',{v:p.scale},30000);
    if(p.w && (p.w!==S.display.width || p.h!==S.display.height || p.hz!==S.display.refreshRate)) S.display=await call('display.setMode',{w:p.w, h:p.h, hz:p.hz},30000);
  }catch(e){ toast(e.message); } }
  renderPage();
}
setInterval(()=>{ if(S.countdown>0){ S.countdown--; if(S.countdown===0) revertDisplay(); else if(S.page==='display'){ const b=$('.banner b'); if(b) b.textContent=`Keep these display settings? Going back in ${S.countdown} s`; } } }, 1000);
async function choose(id, v){
  try{
    if(id==='rate'){ const d=S.display, m=(d.modes||[]).find(x=>x.width===d.width&&x.height===d.height); return applyDisplay({w:d.width, h:d.height, hz:+v||(m&&m.rates[0])||60}); }
    if(id==='scale') return applyDisplay({scale:+v});
    if(id==='style') S.shell=await call('shell.setDesktopStyle',{style:v});
    else if(id==='accent'){ S.profile=await call('profile.set',{accent:v}); mantel('accent', {accent:v}); setAccent(v); }
    else if(id==='mode'){ S.powerError=''; S.power={...S.power, mode:v}; renderPage(); try{ await call('power.setMode',{mode:v}); }catch(e){ S.powerError=e.message; } S.power=await call('power.get'); }
    else if(id==='press') S.desk=await call('desktop.set',{key:'powerPress', value:v});
    else if(id==='mouse') S.pad=await call('pad.setMouseMode',{mode:v});
    else if(id==='start') S.shell=await call('shell.setStartMode',{mode:v});

  }catch(e){ toast(e.message); }
  renderPage();

// Sliders: drag on the track, or Left/Right when focused.
let sliding=null;
function slideTo(el, frac){
  const id=el.dataset.slide, sl=SLIDERS[id]; if(!sl) return;
  frac=Math.max(0,Math.min(1,frac));
  el.dataset.frac=frac;
  el.querySelector('i').style.width=frac*100+'%'; el.querySelector('.top span').textContent=sl.text(frac);
  clearTimeout(slideTo.t); slideTo.t=setTimeout(()=>sl.set(frac), 40);
}
const fracOf = el => el.dataset.frac!=null ? +el.dataset.frac : (parseFloat(el.querySelector('i').style.width)||0)/100;
document.addEventListener('pointerdown', e => { const t=e.target.closest('.track'); if(!t) return; sliding=t.closest('[data-slide]'); t.setPointerCapture(e.pointerId);
  const f=focusables(), i=f.indexOf(sliding); if(i>=0){ S.inPage=true; S.f=i; renderNav(); focusPaint(); }
  const r=t.getBoundingClientRect(); slideTo(sliding,(e.clientX-r.left)/r.width); });
document.addEventListener('pointermove', e => { if(!sliding) return; const t=sliding.querySelector('.track'), r=t.getBoundingClientRect(); slideTo(sliding,(e.clientX-r.left)/r.width); });
document.addEventListener('pointerup', () => { sliding=null; });

// ---------------------------------------------------------------- keyboard and controller (SetBase.qml's keys)
const focusables = () => $$('.page [data-f]');
function focusPaint(){
  $$('.f-on').forEach(x=>x.classList.remove('f-on'));
  if(!S.inPage) return;
  const f=focusables(); if(!f.length) return;
  S.f=Math.max(0,Math.min(S.f,f.length-1));
  const el=f[S.f]; el.classList.add('f-on'); el.scrollIntoView({block:'nearest'});
  const input=el.querySelector('input');
  if(input) input.focus(); else if(document.activeElement && document.activeElement.tagName==='INPUT') document.activeElement.blur();
}
document.addEventListener('keydown', e => {
  const typing=document.activeElement && document.activeElement.tagName==='INPUT';
  if(typing && e.key==='Enter'){
    e.preventDefault();
    const id=document.activeElement.dataset.input;
    if(id==='pw' && S.asking) join(S.asking, document.activeElement.value);
    else if(id==='tmDate'){ const t=$('[data-input="tmTime"]'); if(t){ S.f=focusables().indexOf(t.closest('[data-f]')); focusPaint(); } }
    else if(id==='tmTime'){ const b=$('[data-act="tmSet"]'); if(b) b.click(); }
    return;
  }
  if(typing && !['Escape','ArrowUp','ArrowDown','Tab'].includes(e.key)) return;
  const idx=PAGES.findIndex(p=>p[0]===S.page);
  if(!S.inPage){
    if(e.key==='ArrowDown'||e.key==='Tab'&&!e.shiftKey){ e.preventDefault(); return go(PAGES[Math.min(PAGES.length-1,idx+1)][0]); }
    if(e.key==='ArrowUp'||e.key==='Tab'&&e.shiftKey){ e.preventDefault(); return go(PAGES[Math.max(0,idx-1)][0]); }
    if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){ e.preventDefault(); if(!focusables().length) return; S.inPage=true; S.f=0; renderNav(); return focusPaint(); }
    if(e.key==='Escape'){ e.preventDefault(); return mantel('closeSettings'); }
    return;
  }
  const f=focusables(), el=f[S.f];
  switch(e.key){
    case 'ArrowDown': case 'Tab': if(e.key==='Tab'&&e.shiftKey){ e.preventDefault(); S.f=Math.max(0,S.f-1); return focusPaint(); } e.preventDefault(); S.f=Math.min(f.length-1,S.f+1); return focusPaint();
    case 'ArrowUp': e.preventDefault(); S.f=Math.max(0,S.f-1); return focusPaint();
    case 'ArrowLeft': case 'ArrowRight': {
      if(!el) return;
      const dir=e.key==='ArrowLeft'?-1:1;
      if(el.dataset.slide){ e.preventDefault(); return slideTo(el, fracOf(el)+dir*SLIDERS[el.dataset.slide].step); }
      if(el.dataset.choice){ e.preventDefault(); const opts=[...el.querySelectorAll('.opt')], i=opts.findIndex(o=>o.classList.contains('on')), n=opts[Math.max(0,Math.min(opts.length-1,(i<0?0:i)+dir))]; if(n && n!==opts[i]) n.click(); return; }
      if(dir<0){ e.preventDefault(); S.inPage=false; renderNav(); return focusPaint(); }
      return;
    }
    case 'Enter': case ' ': {
      if(!el) return; e.preventDefault();
      if(el.dataset.choice){ const opts=[...el.querySelectorAll('.opt')], i=opts.findIndex(o=>o.classList.contains('on')); const n=opts[(i+1)%opts.length]; if(n) n.click(); return; }
      const a=el.matches('[data-act]')?el:el.querySelector('[data-act]'); if(a) a.click(); return;
    }
    case 'Escape': e.preventDefault(); if(typing) document.activeElement.blur(); S.inPage=false; S.asking=''; renderNav(); renderPage(); return;
  }
});
document.addEventListener('click', e => {
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.closest('.page')){ const f=focusables(), i=f.indexOf(el.closest('[data-f]')); if(i>=0){ S.inPage=true; S.f=i; renderNav(); focusPaint(); } }
  act(el);
});
const LIVE = new Set(['tz', 'kbAdd']);
document.addEventListener('input', e => {
  const id=e.target.dataset && e.target.dataset.input; if(!id) return;
  S.inputs[id]=e.target.value;
  if(LIVE.has(id)){ clearTimeout(LIVE.t); LIVE.t=setTimeout(renderPage, 150); }
});
document.addEventListener('focusin', e => { const fl=e.target.closest && e.target.closest('.page [data-f]'); if(fl){ const i=focusables().indexOf(fl); if(i>=0 && (i!==S.f || !S.inPage)){ S.inPage=true; S.f=i; renderNav(); focusPaint(); } } });
document.addEventListener('contextmenu', e => e.preventDefault());

function setAccent(a){
  if(!/^#[0-9a-f]{6}$/i.test(a||'')) return;
  const n=parseInt(a.slice(1),16);
  document.documentElement.style.setProperty('--accent', a);
  document.documentElement.style.setProperty('--accentInk', ((n>>16&255)*.2126+(n>>8&255)*.7152+(n&255)*.0722)/255>.45?'#2a1206':'#ffffff');
}

// ---------------------------------------------------------------- from Ember
if(host) host.addEventListener('message', e => {
  const m=e.data; if(!m||typeof m!=='object') return;
  if(m.type==='result'){ const p=pending[m.id]; if(!p) return; delete pending[m.id]; m.ok ? p.ok(m.value) : p.no(new Error(m.error)); return; }
  if(m.type!=='event') return;
  const d=m.data;
  if(m.name==='status'){ S.st=d; if(['wifi','bluetooth'].includes(S.page) && !(document.activeElement && document.activeElement.tagName==='INPUT')) renderPage(); }
  else if(m.name==='bt.found'){ if(d&&d.name&&!S.found.some(x=>x.id===d.id)&&!(S.paired||[]).some(x=>x.id===d.id||x.name===d.name)&&!/^([0-9A-F]{2}[-:]){5}/i.test(d.name)){ S.found.push(d); if(S.page==='bluetooth') renderPage(); } }
  else if(m.name==='bt.scanDone'){ S.btScan=false; if(S.page==='bluetooth') renderPage(); }
  else if(m.name==='bt.pin'){ S.btMsg = d.confirm?`Check the device shows ${d.pin}`:`Type ${d.pin} on the device`; if(S.page==='bluetooth') renderPage(); if(d.confirm) call('bt.confirmPin',{accept:true}).catch(()=>{}); }
  else if(m.name==='update'){ S.upd=d; if(['updates','about'].includes(S.page)) renderPage(); }
  else if(m.name==='profile'){ if(d&&d.accent) setAccent(d.accent); }
  else if(m.name==='mantel.settingsPage'){ if(d&&d.page&&PAGES.some(p=>p[0]===d.page)) go(d.page); }
});
