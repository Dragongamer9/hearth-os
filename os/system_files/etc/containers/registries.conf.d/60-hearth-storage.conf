# Hearth OS updates from Hearth Storage (docs/HEARTH-LINK.md): Hearth's images are tried through the local mirror
# first (hearth-update-mirror.socket, 127.0.0.1 only), which gets the pieces from your Hearth Storage server when one
# is at home and from ghcr.io otherwise. When the mirror says it's unavailable (no server) or fails, Hearth's images
# come straight from ghcr.io as before: updates never depend on the server.
[[registry]]
prefix = "ghcr.io/dragongamer9"
location = "ghcr.io/dragongamer9"

[[registry.mirror]]
location = "127.0.0.1:479/dragongamer9"
insecure = true
