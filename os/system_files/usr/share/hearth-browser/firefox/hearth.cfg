// Hearth Browser's start-up script (Firefox skips this first line). See defaults/pref/autoconfig.js.
// It makes resource://hearth/ point at the hearth folder next to it and starts hearth/hearth.sys.mjs. Anything
// going wrong here only loses Hearth's additions: Firefox itself carries on.
(function () {
  try {
    const Cc = Components.classes, Ci = Components.interfaces;
    const dir = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("GreD", Ci.nsIFile);
    dir.append("hearth");
    const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler).setSubstitution("hearth", io.newFileURI(dir));
    ChromeUtils.importESModule("resource://hearth/hearth.sys.mjs").start();
  } catch (e) {
    Components.utils.reportError("Hearth Browser: " + e);
  }
})();
