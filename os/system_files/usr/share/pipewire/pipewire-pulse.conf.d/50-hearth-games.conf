# Hearth OS: steadier game sound.
# Games running through Proton talk to PipeWire's PulseAudio side. Some ask
# for very small buffers, and when the game keeps the processor busy those
# buffers run dry and the sound crackles or stutters. A floor of 1024 samples
# (about 21 ms at 48 kHz) keeps them filled; music, calls and the desktop are
# unaffected. Override in ~/.config/pipewire/pipewire-pulse.conf.d/.
pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.frag    = 1024/48000
    pulse.min.quantum = 1024/48000
}
