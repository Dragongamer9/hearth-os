# Hearth: load the normal USB HID driver before the Xbox one (the owner's Legion Go S, Nov 28, 2026, log MK7T-YJPX-7T).
# Otherwise xpad starts first and takes the Go S controller's touchpad (USB interface 1.2) and settings channel (1.3) as
# if they were Xbox pads: the touchpad is dead and Handheld Daemon can't find the controller, so it restarts it every
# 3 s and the controls only partly work. With usbhid first, xpad keeps only the real gamepad part (1.1), as on SteamOS.
# Harmless on every other PC: usbhid is loaded on all of them anyway.
softdep xpad pre: usbhid
