# Hearth: the system log is kept on the drive (not only in memory), so a start that froze or failed can be looked at
# after the restart (journalctl -b -1; the bug report includes it). The images' /var starts empty, so the folder
# isn't always there to switch this on by itself. Written to the drive every 15 s instead of every 5 min: what led
# up to a freeze or a forced power-off is in the log.
[Journal]
Storage=persistent
SyncIntervalSec=15s
