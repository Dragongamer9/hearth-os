# Hearth: in rescue mode, instead of a root password prompt (a dead end on a handheld), a
# screen that says what failed and offers what to do with a keyboard or a handheld's own buttons (volume up/down to
# move, power to choose): start the previous version, check the drives, save a bug report, restart, a command line
# after an administrator's password. See /usr/libexec/nimbus/hearth-emergency. If the screen itself can't run, the
# usual sulogin comes up as before.
[Service]
ExecStart=
ExecStart=-/bin/sh -c '/usr/libexec/nimbus/hearth-emergency rescue || exec /usr/lib/systemd/systemd-sulogin-shell rescue'
