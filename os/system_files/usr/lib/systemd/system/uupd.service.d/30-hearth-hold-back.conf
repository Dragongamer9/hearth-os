# Hearth Storage (docs/HEARTH-LINK.md, "Hearth OS updates"). Before the update: the registries.conf.d mirror entry is
# written only while this device updates from a Hearth Storage server (removed otherwise: no server, today's update
# path), then hold-back: wait until one device has started the new version well (at most 3 days; no server, Hearth
# Link not running or any error: no wait). After it: an update that failed while the entry was in place removes it
# and skips the mirror for 7 days. "Update now" is never held. See /usr/libexec/nimbus/hearth-update-mirror.
[Service]
ExecCondition=/usr/libexec/nimbus/hearth-update-mirror may-stage
ExecStopPost=-/usr/libexec/nimbus/hearth-update-mirror after-update
