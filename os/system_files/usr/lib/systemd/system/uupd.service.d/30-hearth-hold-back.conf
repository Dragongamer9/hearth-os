# Hearth Storage's hold-back: with a Hearth Storage server at home, background updates wait until one device has
# started the new version well (at most 3 days; no server, Hearth Link not running or any error: no wait).
# "Update now" in Settings is never held. See /usr/libexec/nimbus/hearth-update-mirror may-stage.
[Service]
ExecCondition=/usr/libexec/nimbus/hearth-update-mirror may-stage
