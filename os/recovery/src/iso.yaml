label: "HearthRecov"
grub2:
  # Starts by itself after 3 seconds: the Ally (and any handheld) has no keyboard for GRUB's menu.
  # (Debian's live boot: dracut's dmsquash-live, with the changes kept in memory through overlayfs.)
  default: 0
  timeout: 3
  entries:
    - name: "Hearth Recovery"
      linux: "/images/pxeboot/vmlinuz quiet splash root=live:CDLABEL=HearthRecov rd.live.image rd.live.overlay.overlayfs=1 hearth.recovery"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Hearth Recovery (basic graphics)"
      linux: "/images/pxeboot/vmlinuz quiet splash root=live:CDLABEL=HearthRecov rd.live.image rd.live.overlay.overlayfs=1 hearth.recovery nomodeset"
      initrd: "/images/pxeboot/initrd.img"
