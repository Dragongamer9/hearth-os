[package]
name = "hearth-connect"
version = "0.1.0"
edition = "2021"
description = "Hearth Connect: link a phone to Hearth OS (pairing, files, notifications, clipboard, remote input, media, find my phone, battery), compatible with KDE Connect"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_connect"
path = "src/lib.rs"

[[bin]]
name = "hearth-connect"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal", "process"] }
# KDE Connect's protocol (v8): TLS with self-signed certificates both ways (rustls with ring).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
x509-parser = "0.16"
sha2 = "0.10"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"

# Linux: notifications and media players on the session bus, the virtual mouse and keyboard (uinput).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
