[package]
name = "hearth-recorder"
version = "0.1.0"
edition = "2021"
description = "Hearth Recorder: Hearth OS's screen recorder (whole screen, an area, Game Mode's game), instant replay and sound recorder"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_recorder"
path = "src/lib.rs"

[[bin]]
name = "hearth-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hearth-media = { path = "../hearth-media" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
