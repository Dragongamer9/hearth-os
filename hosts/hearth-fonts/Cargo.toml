[package]
name = "hearth-fonts"
version = "0.1.0"
edition = "2021"
description = "Hearth Fonts: see the fonts on your system with previews in your own words, install a .ttf or .otf for yourself, and remove ones you installed"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_fonts"
path = "src/lib.rs"

[[bin]]
name = "hearth-fonts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
