[package]
name = "hearth-calculator"
version = "0.1.0"
edition = "2021"
description = "Hearth Calculator: Hearth OS's own calculator (standard, scientific, programmer and unit conversion)"
license = "GPL-3.0-or-later"

[[bin]]
name = "hearth-calculator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
