[package]
name = "hearthfetch"
version = "0.3.1"
edition = "2021"
description = "hearthfetch: a short summary of this device and Hearth OS for the terminal (like fastfetch)"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
