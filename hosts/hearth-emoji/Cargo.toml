[package]
name = "hearth-emoji"
version = "0.1.0"
edition = "2021"
description = "Hearth's emoji and symbol picker (Super+. in Desktop Mode): search emoji by name, recent ones, skin tones, symbols and kaomoji; types the one you pick into the app you were in"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_emoji"
path = "src/lib.rs"

[[bin]]
name = "hearth-emoji"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
