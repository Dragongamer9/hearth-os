<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji</title>
<style>
/* Hearth 1.10's picker (the approved mockup): a compact popup in Hearth's dark blues, with Emoji / Symbols / Kaomoji
   tabs, search and Most used. ~/.config/hearth/theme.css (Settings › Appearance) overrides these with your look. */
:root {
  --bg:#1e2f42; --bg2:#10151b; --panel:#1e2f42; --panel2:#213347; --panel3:#2a475e; --line:#2f4a63;
  --text:#e6eef5; --muted:#9fb2c3; --faint:#6f8396; --ember:#66c0f4; --flame:#66c0f4; --danger:#ff9c8f;
  --ink:#06121c; --r:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--panel); color:var(--text); }
body { font:400 13px/1.35 var(--font, "Inter", system-ui, "Segoe UI", Cantarell, "Noto Sans", sans-serif); overflow:hidden; user-select:none; -webkit-user-select:none; }
button, input { font:inherit; color:inherit; }
.app { display:flex; flex-direction:column; gap:10px; height:100%; padding:12px; }
.top { display:flex; gap:4px; align-items:center; }
.tab { all:unset; cursor:pointer; padding:5px 12px; border-radius:min(6px, var(--corner, 6px)); color:var(--muted); }
.tab.on { background:var(--panel3); color:var(--text); font-weight:600; }
.tab:focus-visible { box-shadow:0 0 0 2px var(--ember); }
.spacer { flex:1; }
.tone, .x { all:unset; cursor:pointer; width:28px; height:28px; display:grid; place-items:center; border-radius:min(6px, var(--corner, 6px)); color:var(--muted); font-size:16px; }
.tone:hover, .x:hover { background:var(--panel2); }
.search { display:flex; align-items:center; gap:8px; padding:0 10px; height:34px; border-radius:min(6px, var(--corner, 6px)); background:var(--bg2); border:1px solid var(--line); color:var(--muted); }
.search:focus-within { border-color:var(--ember); }
.search svg { width:14px; height:14px; flex:none; }
.search input { flex:1; background:none; border:0; outline:none; color:var(--text); min-width:0; }
nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:none; }
nav[hidden] { display:none; }
nav button { all:unset; cursor:pointer; flex:none; height:28px; min-width:30px; display:grid; place-items:center; border-radius:min(6px, var(--corner, 6px)); font-size:16px;
  font-family:"Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", system-ui, sans-serif; opacity:.75; }
nav button:hover { background:var(--panel2); opacity:1; }
nav button.on { background:var(--panel2); opacity:1; }
main { flex:1; overflow:auto; margin:0 -4px; padding:0 4px; scrollbar-width:thin; scrollbar-color:var(--panel3) transparent; }
h2 { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:6px 2px 6px; font-weight:600; }
h2:first-child { margin-top:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(38px, 1fr)); gap:4px; }
.grid.wide { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); }
.cell { height:38px; border-radius:min(6px, var(--corner, 6px)); border:0; background:transparent; font-size:22px; line-height:1; cursor:pointer; outline:none; padding:0;
  font-family:"Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", system-ui, sans-serif; transition:transform .1s var(--ease), background .1s; }
.grid.sym .cell { font-family:system-ui, "Noto Sans", "DejaVu Sans", sans-serif; font-size:19px; }
.grid.wide .cell { font-size:14px; font-family:system-ui, "Noto Sans CJK JP", "Noto Sans", sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; }
.cell:hover { background:var(--panel2); }
.cell:focus { background:var(--panel3); box-shadow:0 0 0 2px var(--ember); }
.cell:active { transform:scale(.92); }
.empty { color:var(--muted); padding:14px 4px; text-align:center; }
footer { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; min-height:18px; }
.now { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
.now b { font-size:18px; font-family:"Noto Color Emoji", system-ui, sans-serif; font-weight:400; color:var(--text); }
.now span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hints { display:none; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
.pad .hints { display:flex; }
.hints i { font-style:normal; display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 4px; border-radius:min(5px, var(--corner, 5px)); background:var(--panel3); color:var(--text); margin-right:3px; font-size:10px; }
.osk { position:fixed; left:12px; right:12px; bottom:40px; background:var(--panel); border:1px solid var(--line); border-radius:min(12px, var(--corner, 12px)); padding:8px; display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
.osk button { height:34px; border-radius:min(7px, var(--corner, 7px)); border:1px solid var(--line); background:var(--panel3); cursor:pointer; outline:none; }
.osk button:focus { box-shadow:0 0 0 2px var(--ember); }
.osk .wide { grid-column:span 2; }
.toast { position:fixed; left:50%; bottom:44px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:7px 12px; border-radius:min(8px, var(--corner, 8px)); white-space:nowrap; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top" role="tablist" aria-label="Kinds">
    <button class="tab" role="tab" data-tab="emoji">Emoji</button>
    <button class="tab" role="tab" data-tab="symbols">Symbols</button>
    <button class="tab" role="tab" data-tab="kaomoji">Kaomoji</button>
    <span class="spacer"></span>
    <button class="tone" id="tone" title="Skin tone (Y)" aria-label="Skin tone">✋</button>
    <button class="x" id="close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Search emoji, symbols and kaomoji" spellcheck="false" autocomplete="off" aria-label="Search"></label>
  <nav id="cats" aria-label="Emoji groups"></nav>
  <main id="main"></main>
  <footer><div class="now" id="now"></div><div class="hints" id="hints"></div></footer>
</div>
<script src="hearth-gamepad.js"></script>
<script src="emoji-data.js"></script>
<script>
'use strict';
const T = window.__TAURI__;
const invoke = T ? T.core.invoke : demoInvoke;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA = window.EMOJI_DATA || [];
const TONES = ['', '\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
const TONE_SHOW = ['✋', '✋🏻', '✋🏼', '✋🏽', '✋🏾', '✋🏿'];
// Three tabs, as in Windows: Emoji (Most used first, then every group; the row of group icons jumps to one), Symbols
// (special characters) and Kaomoji. Search looks through all three.
const TABS = ['emoji', 'symbols', 'kaomoji'];
const EMOJI_CATS = [['smileys', '😀', 'Smileys'], ['people', '👋', 'People'], ['nature', '🐻', 'Animals & nature'], ['food', '🍔', 'Food'],
  ['travel', '🚗', 'Travel'], ['activities', '⚽', 'Activities'], ['objects', '💡', 'Objects'], ['symbols', '❤️', 'Symbols'], ['flags', '🏁', 'Flags']];
const CHAR_GROUPS = [['punctuation', 'Punctuation'], ['currency', 'Currency'], ['maths', 'Maths'], ['arrows', 'Arrows'], ['letters', 'Letters'],
  ['numbers', 'Numbers and fractions'], ['marks', 'Marks and signs'], ['shapes', 'Shapes and lines']];
const EMOJI_GROUPS = new Set(EMOJI_CATS.map(c => c[0]));
const byChar = new Map(DATA.map(d => [d.e, d]));
const S = { tab: 'emoji', tone: 0, recent: [], most: [], q: '', pad: false, busy: false };

function withTone(d) {
  if (!d.s || !S.tone) return d.e;
  const cps = [...d.e]; let rest = cps.slice(1);
  if (rest[0] === '️') rest = rest.slice(1);
  return cps[0] + TONES[S.tone] + rest.join('');
}
function cellHtml(d, i) {
  const e = EMOJI_GROUPS.has(d.g) ? withTone(d) : d.e;
  return `<button class="cell" data-i="${i}" data-e="${esc(e)}" title="${esc(d.n)}" aria-label="${esc(d.n)}">${esc(e)}</button>`;
}
let shown = [];   // the entries on screen, in order (cells point into it)
function section(title, list, kind, id) {
  if (!list.length) return '';
  const start = shown.length; shown.push(...list);
  return (title ? `<h2${id ? ` id="sec-${id}"` : ''}>${esc(title)}</h2>` : '') + `<div class="grid ${kind || ''}">${list.map((d, j) => cellHtml(d, start + j)).join('')}</div>`;
}
function entryFor(e) { return byChar.get(e) || byChar.get(stripTone(e)) || { e, n: e, g: 'chars' }; }

function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = [];
  for (const d of DATA) {
    const n = d.n, k = d.k || [];
    let score = 0, ok = true;
    for (const w of words) {
      if (n === w || k.includes(w)) score += 4;
      else if (n.startsWith(w) || n.includes(' ' + w)) score += 3;
      else if (k.some(x => x.startsWith(w))) score += 2;
      else if (n.includes(w) || d.e === w) score += 1;
      else { ok = false; break; }
    }
    if (ok) scored.push([score + (EMOJI_GROUPS.has(d.g) ? .5 : 0), d]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return scored.slice(0, 400).map(x => x[1]);
}

// Most used: how often you picked each (the app counts them), then recent ones; only this tab's kind.
function mostUsed(kind) {
  const list = (S.most.length ? S.most : S.recent).map(entryFor);
  if (kind === 'emoji') return list.filter(d => EMOJI_GROUPS.has(d.g)).slice(0, 21);
  if (kind === 'kaomoji') return list.filter(d => d.g === 'kaomoji').slice(0, 8);
  return list.filter(d => !EMOJI_GROUPS.has(d.g) && d.g !== 'kaomoji').slice(0, 14);
}

function render(keepFocus) {
  shown = [];
  let h = '';
  const searching = !!S.q.trim();
  if (searching) {
    const r = search(S.q.trim());
    const em = r.filter(d => EMOJI_GROUPS.has(d.g)), sy = r.filter(d => !EMOJI_GROUPS.has(d.g) && d.g !== 'kaomoji'), ka = r.filter(d => d.g === 'kaomoji');
    h = section('Emoji', em) + section('Symbols', sy, 'sym') + section('Kaomoji', ka, 'wide');
    if (!r.length) h = `<div class="empty">Nothing called "${esc(S.q)}". Try another word, like heart, arrow or euro.</div>`;
  } else if (S.tab === 'emoji') {
    const most = mostUsed('emoji');
    h = most.length ? section('Most used', most) : '<h2>Most used</h2><div class="empty">The ones you pick most show up here.</div>';
    for (const [g, , title] of EMOJI_CATS) h += section(title, DATA.filter(d => d.g === g), '', g);
  } else if (S.tab === 'symbols') {
    h = section('Most used', mostUsed('symbols'), 'sym');
    for (const [g, title] of CHAR_GROUPS) h += section(title, DATA.filter(d => d.g === g), 'sym');
  } else {
    h = section('Most used', mostUsed('kaomoji'), 'wide') + section('Kaomoji', DATA.filter(d => d.g === 'kaomoji'), 'wide');
  }
  $('#main').innerHTML = h;
  document.querySelectorAll('.tab').forEach(b => { const on = !searching && b.dataset.tab === S.tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
  $('#cats').hidden = searching || S.tab !== 'emoji';
  if (!keepFocus) $('#main').scrollTop = 0;
  describe(document.activeElement);
}
function stripTone(e) { return TONES.slice(1).reduce((s, t) => s.split(t).join(''), e); }

function renderCats() {
  $('#cats').innerHTML = EMOJI_CATS.map(([id, icon, label]) => `<button data-cat="${id}" title="${esc(label)}" aria-label="${esc(label)}">${esc(icon)}</button>`).join('');
}
function renderTone() { $('#tone').textContent = TONE_SHOW[S.tone]; }
function setTone(t) { S.tone = t; renderTone(); const f = document.activeElement?.dataset?.i; render(true); if (f != null) $(`.cell[data-i="${f}"]`)?.focus({ preventScroll: true }); invoke('set_tone', { tone: t }).catch(() => {}); }
function setTab(t) { S.tab = t; S.q = ''; $('#q').value = ''; render(); }
function stepTab(d) { const i = TABS.indexOf(S.tab); setTab(TABS[(i + d + TABS.length) % TABS.length]); focusFirst(); }
function jumpTo(cat) {
  if (S.tab !== 'emoji' || S.q) setTab('emoji');
  const h = $('#sec-' + cat); if (!h) return;
  h.scrollIntoView({ block: 'start' });
  h.nextElementSibling?.querySelector('.cell')?.focus({ preventScroll: true });
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
}
function focusFirst() { $('.cell')?.focus(); }

function describe(el) {
  if (el && el.classList?.contains('cell')) {
    const d = shown[+el.dataset.i];
    $('#now').innerHTML = `<b>${esc(el.dataset.e.length > 6 ? '' : el.dataset.e)}</b><span>${esc(d ? d.n : '')}</span>`;
  } else $('#now').innerHTML = `<span>${DATA.length ? 'Super+. opens this anywhere you type · the controller works too' : 'The emoji list is missing.'}</span>`;
}
function hints() {
  $('#app').classList.toggle('pad', S.pad);
  $('#hints').innerHTML = '<span><i>A</i>Type</span><span><i>Y</i>Tone</span><span><i>X</i>Search</span><span><i>LB RB</i>Tabs</span><span><i>B</i>Close</span>';
}

let toastTimer = 0;
function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2400); }
async function choose(el, copyOnly) {
  if (!el || !el.dataset.e || S.busy) return;
  S.busy = true;
  try {
    const r = await invoke('pick', { text: el.dataset.e, copyOnly: !!copyOnly });
    if (!T) { toast((copyOnly ? 'Copied ' : 'Typed ') + el.dataset.e); S.recent = [el.dataset.e, ...S.recent.filter(x => x !== el.dataset.e)]; }
    else if (r && !r.typed) toast('Copied: paste it with Ctrl+V');
  } catch (e) { toast(String(e)); }
  S.busy = false;
}
function close() { invoke('close').catch(() => window.close()); }

// ---------------------------------------------------------------- moving around
function cells() { return [...document.querySelectorAll('.cell')]; }
function move(dir) {
  const el = document.activeElement;
  if (!el || !el.classList.contains('cell')) { if (dir === 'down' || dir === 'right') focusFirst(); return; }
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const c of cells()) {
    if (c === el) continue;
    const q = c.getBoundingClientRect(), qx = q.left + q.width / 2, qy = q.top + q.height / 2, dx = qx - cx, dy = qy - cy;
    if (dir === 'left' && (Math.abs(dy) > r.height / 2 || dx >= -2)) continue;
    if (dir === 'right' && (Math.abs(dy) > r.height / 2 || dx <= 2)) continue;
    if (dir === 'up' && dy >= -4) continue;
    if (dir === 'down' && dy <= 4) continue;
    const score = (dir === 'left' || dir === 'right') ? Math.abs(dx) : Math.abs(dy) * 3 + Math.abs(dx);
    if (score < bestScore) { bestScore = score; best = c; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
  else if (dir === 'up') $('#q').focus();
  else if (dir === 'left' || dir === 'right') {   // the end of a row: on to the next one
    const all = cells(), i = all.indexOf(el), n = all[i + (dir === 'right' ? 1 : -1)];
    if (n) { n.focus(); n.scrollIntoView({ block: 'nearest' }); }
  }
}

document.addEventListener('keydown', e => {
  S.pad = false; hints();
  const inSearch = e.target === $('#q');
  const k = e.key;
  if (oskOpen()) { if (k === 'Escape') { e.preventDefault(); closeOsk(); } return; }
  if (k === 'Escape') { e.preventDefault(); if (S.q) { S.q = ''; $('#q').value = ''; render(); $('#q').focus(); } else close(); return; }
  if (k === 'Tab') { e.preventDefault(); stepTab(e.shiftKey ? -1 : 1); return; }
  if (inSearch) {
    if (k === 'ArrowDown' || (k === 'Enter' && !e.shiftKey && !e.ctrlKey)) { e.preventDefault(); if (k === 'Enter') return choose($('.cell'), false); focusFirst(); }
    if (k === 'Enter' && (e.shiftKey || e.ctrlKey)) { e.preventDefault(); choose($('.cell'), true); }
    return;
  }
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (dirs[k]) { e.preventDefault(); move(dirs[k]); return; }
  if (k === 'Enter' || k === ' ') { e.preventDefault(); choose(document.activeElement, e.shiftKey || e.ctrlKey); return; }
  if ((e.ctrlKey && k.toLowerCase() === 'c')) { e.preventDefault(); choose(document.activeElement, true); return; }
  // Typing a letter anywhere searches.
  if (k.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { $('#q').focus(); }
  if (k === 'Backspace') { $('#q').focus(); }
});
$('#q').addEventListener('input', () => { S.q = $('#q').value; render(); });
document.addEventListener('focusin', e => describe(e.target));
document.addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (c) return choose(c, e.shiftKey || e.ctrlKey);
  const tab = e.target.closest('[data-tab]'); if (tab) return setTab(tab.dataset.tab);
  const cat = e.target.closest('[data-cat]'); if (cat) return jumpTo(cat.dataset.cat);
  if (e.target.closest('#tone')) return setTone((S.tone + 1) % 6);
  if (e.target.closest('#close')) return close();
  const o = e.target.closest('.osk button'); if (o) return oskPress(o.dataset.k);
});
// Right-click (or long press) copies without typing.
document.addEventListener('contextmenu', e => { const c = e.target.closest('.cell'); if (c) { e.preventDefault(); choose(c, true); } });
// Clicking another window closes the picker, as on other systems.
let blurTimer = 0;
window.addEventListener('blur', () => { if (!T) return; blurTimer = setTimeout(() => { if (!document.hasFocus()) close(); }, 300); });
window.addEventListener('focus', () => clearTimeout(blurTimer));

// ---------------------------------------------------------------- on-screen keyboard (controller search)
const OSK_KEYS = 'qwertyuiopasdfghjkl\'zxcvbnm-.!1234567890'.split('');
function oskOpen() { return !!$('.osk'); }
function openOsk() {
  if (oskOpen()) return;
  const d = document.createElement('div'); d.className = 'osk';
  d.innerHTML = OSK_KEYS.map(k => `<button data-k="${esc(k)}">${esc(k)}</button>`).join('') +
    '<button class="wide" data-k="space">Space</button><button class="wide" data-k="back">⌫</button><button class="wide" data-k="clear">Clear</button><button class="wide" data-k="done">Done</button>';
  document.body.appendChild(d); d.querySelector('button').focus();
}
function closeOsk() { $('.osk')?.remove(); if ($('.cell')) focusFirst(); else $('#q').focus(); }
function oskPress(k) {
  if (k === 'done') return closeOsk();
  let v = $('#q').value;
  v = k === 'space' ? v + ' ' : k === 'back' ? v.slice(0, -1) : k === 'clear' ? '' : v + k;
  $('#q').value = v; S.q = v; render(true);
}
function oskMove(dir) {
  const bs = [...document.querySelectorAll('.osk button')], i = bs.indexOf(document.activeElement);
  const cols = 10, span = b => b.classList.contains('wide') ? 2 : 1;
  // Position of each key in the 10-wide grid.
  let col = 0, row = 0; const pos = bs.map(b => { const p = [row, col]; col += span(b); if (col >= cols) { col = 0; row++; } return p; });
  const [r, c] = pos[Math.max(0, i)];
  const target = dir === 'left' ? [r, c - 1] : dir === 'right' ? [r, c + span(bs[i]) ] : dir === 'up' ? [r - 1, c] : [r + 1, c];
  let best = -1, bd = 1e9;
  pos.forEach(([pr, pc], j) => { if (pr !== target[0]) return; const d = Math.abs(pc - target[1]); if (d < bd) { bd = d; best = j; } });
  if (best >= 0 && (dir === 'up' || dir === 'down' || bd === 0)) bs[best].focus();
}

// ---------------------------------------------------------------- controller (standard mapping)
const held = {}; let lastMove = 0;
function pad() {
  const pads = HearthGamepad.pads();
  const now = performance.now();
  const st = { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0, x: 0, y: 0, lb: 0, rb: 0, menu: 0 };
  for (const g of pads) {
    const bt = i => g.buttons[i]?.pressed; const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    st.up ||= bt(12) || ay < -.6; st.down ||= bt(13) || ay > .6; st.left ||= bt(14) || ax < -.6; st.right ||= bt(15) || ax > .6;
    st.a ||= bt(0); st.b ||= bt(1); st.x ||= bt(2); st.y ||= bt(3); st.lb ||= bt(4); st.rb ||= bt(5); st.menu ||= bt(9);
  }
  for (const [k, on] of Object.entries(st)) {
    if (!on) { held[k] = 0; continue; }
    const first = !held[k], dir = ['up', 'down', 'left', 'right'].includes(k);
    const repeat = held[k] && now - held[k] > 360 && now - lastMove > 90;
    if (first) held[k] = now;
    if (!(first || (repeat && dir))) continue;
    if (!S.pad) { S.pad = true; hints(); }
    lastMove = now;
    if (oskOpen()) {
      if (dir) oskMove(k); else if (k === 'a') oskPress(document.activeElement?.dataset?.k); else if (k === 'b' || k === 'x') closeOsk(); else if (k === 'y') oskPress('back');
      continue;
    }
    if (dir) { if (document.activeElement === $('#q') && k !== 'down') continue; move(k); }
    else if (k === 'a') choose(document.activeElement.classList.contains('cell') ? document.activeElement : $('.cell'), false);
    else if (k === 'menu') choose(document.activeElement.classList.contains('cell') ? document.activeElement : $('.cell'), true);
    else if (k === 'b') { if (S.q) { S.q = ''; $('#q').value = ''; render(); focusFirst(); } else close(); }
    else if (k === 'x') openOsk();
    else if (k === 'y') setTone((S.tone + 1) % 6);
    else if (k === 'lb') stepTab(-1);
    else if (k === 'rb') stepTab(1);
  }
}
HearthGamepad.loop(pad);

// ---------------------------------------------------------------- start
renderCats(); hints();
invoke('init').then(r => {
  S.recent = r.recent || []; S.most = r.most || []; S.tone = r.tone || 0;
}).catch(() => {}).finally(() => { renderTone(); render(); $('#q').focus(); });

  return Promise.resolve(null);
}
