<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji</title>
<style>
/* Hearth's ember palette (hosts/linux/desktop/shell/Theme.qml), as in Disks and Terminal. */
:root {
  --bg:#0f0b09; --bg2:#17110e; --panel:#1c1512; --panel2:#261d18; --panel3:#33271f; --line:#3b2e26;
  --text:#f4ece3; --muted:#a69484; --faint:#6f6055; --ember:#ff8a3d; --flame:#ffd166; --danger:#ff5d5d;
  --ink:#2a1206; --r:14px; --ease:cubic-bezier(.2,.8,.2,1);
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); }
body { font:400 15px/1.35 system-ui, "Segoe UI", Cantarell, "Noto Sans", sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none;
  background:radial-gradient(900px 500px at 90% -20%, #2a170d 0%, transparent 60%), var(--bg); }
button, input { font:inherit; color:inherit; }
.app { display:grid; grid-template-rows:auto auto 1fr auto; height:100%; }
header { display:flex; gap:10px; align-items:center; padding:12px 14px 8px; }
.search { flex:1; display:flex; align-items:center; gap:8px; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:0 12px; height:42px; }
.search:focus-within { border-color:var(--ember); box-shadow:0 0 0 2px rgba(255,138,61,.25); }
.search svg { width:18px; height:18px; color:var(--muted); flex:none; }
.search input { flex:1; background:none; border:0; outline:none; font-size:16px; min-width:0; }
.tones { display:flex; gap:4px; }
.tone { width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; font-size:17px; line-height:1; background:var(--panel2); cursor:pointer; }
.tone.on { border-color:var(--ember); }
.x { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; }
nav { display:flex; gap:4px; padding:0 14px 8px; overflow-x:auto; scrollbar-width:none; }
nav button { flex:none; height:34px; min-width:38px; padding:0 9px; border-radius:10px; border:1px solid transparent; background:transparent; cursor:pointer; font-size:18px; display:flex; gap:6px; align-items:center; }
nav button span { font-size:12px; color:var(--muted); }
nav button.on { background:var(--panel2); border-color:var(--line); }
nav button.on span { color:var(--text); }
main { overflow:auto; padding:2px 14px 10px; scrollbar-width:thin; scrollbar-color:var(--panel3) transparent; }
h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:10px 2px 6px; font-weight:650; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(46px, 1fr)); gap:4px; }
.grid.wide { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
.cell { height:46px; border-radius:10px; border:0; background:transparent; font-size:27px; line-height:1; cursor:pointer; outline:none; padding:0;
  font-family:"Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", system-ui, sans-serif; transition:transform .1s var(--ease), background .1s; }
.grid.sym .cell { font-family:system-ui, "Noto Sans", "DejaVu Sans", sans-serif; font-size:22px; }
.grid.wide .cell { font-size:16px; font-family:system-ui, "Noto Sans CJK JP", "Noto Sans", sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; }
.cell:hover { background:var(--panel2); }
.cell:focus { background:var(--panel3); box-shadow:0 0 0 3px var(--ember), 0 0 18px rgba(255,138,61,.35); }
.cell:active { transform:scale(.92); }
.empty { color:var(--muted); padding:30px 4px; text-align:center; }
footer { display:flex; align-items:center; gap:16px; padding:8px 14px 11px; border-top:1px solid var(--line); background:rgba(0,0,0,.18); min-height:44px; }
.now { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
.now b { font-size:24px; font-family:"Noto Color Emoji", system-ui, sans-serif; font-weight:400; }
.now span { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hints { display:flex; gap:12px; color:var(--muted); font-size:12px; flex-wrap:wrap; justify-content:flex-end; }
.hints i { font-style:normal; display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:6px; background:var(--panel3); color:var(--text); margin-right:4px; font-size:11px; }
.osk { position:fixed; left:14px; right:14px; bottom:56px; background:var(--panel); border:1px solid #4a372b; border-radius:16px; padding:10px; display:grid; grid-template-columns:repeat(10, 1fr); gap:5px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
.osk button { height:40px; border-radius:9px; border:1px solid var(--line); background:var(--panel3); cursor:pointer; outline:none; }
.osk button:focus { box-shadow:0 0 0 3px var(--ember); }
.osk .wide { grid-column:span 2; }
.toast { position:fixed; left:50%; bottom:60px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:8px 14px; border-radius:10px; }
@media (max-width: 560px) { .hints { display:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search emoji and symbols" spellcheck="false" autocomplete="off" aria-label="Search"></label>
    <div class="tones" id="tones" title="Skin tone (Y)"></div>
    <button class="x" id="close" title="Close (Esc)" aria-label="Close">✕</button>
  </header>
  <nav id="cats"></nav>
  <main id="main"></main>
  <footer>
    <div class="now" id="now"></div>
    <div class="hints" id="hints"></div>
  </footer>
</div>
<script src="emoji-data.js"></script>
<script>
'use strict';
const T = window.__TAURI__;
const invoke = T ? T.core.invoke : demoInvoke;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA = window.EMOJI_DATA || [];
const TONES = ['', '\u{1F3FB}', '\u{1F3FC}', '\u{1F3FD}', '\u{1F3FE}', '\u{1F3FF}'];
const TONE_SHOW = ['✋', '✋🏻', '✋🏼', '✋🏽', '✋🏾', '✋🏿'];
// The tabs: emoji groups, then symbols and special characters, then kaomoji.
const CATS = [
  ['recent', '🕘', 'Recent'], ['smileys', '😀', 'Smileys'], ['people', '👋', 'People'], ['nature', '🐻', 'Animals & nature'],
  ['food', '🍔', 'Food'], ['travel', '🚗', 'Travel'], ['activities', '⚽', 'Activities'], ['objects', '💡', 'Objects'],
  ['symbols', '❤️', 'Symbols'], ['flags', '🏁', 'Flags'], ['chars', 'Ω', 'Special characters'], ['kaomoji', '(◕‿◕)', 'Kaomoji'],
];
const CHAR_GROUPS = [['punctuation', 'Punctuation'], ['currency', 'Currency'], ['maths', 'Maths'], ['arrows', 'Arrows'], ['letters', 'Letters'],
  ['numbers', 'Numbers and fractions'], ['marks', 'Marks and signs'], ['shapes', 'Shapes and lines']];
const EMOJI_GROUPS = new Set(['smileys', 'people', 'nature', 'food', 'travel', 'activities', 'objects', 'symbols', 'flags']);
const byChar = new Map(DATA.map(d => [d.e, d]));
const S = { cat: 'smileys', tone: 0, recent: [], q: '', pad: false, busy: false };

function withTone(d) {
  if (!d.s || !S.tone) return d.e;
  const cps = [...d.e]; let rest = cps.slice(1);
  if (rest[0] === '️') rest = rest.slice(1);
  return cps[0] + TONES[S.tone] + rest.join('');
}
function cellHtml(d, i) {
  const e = EMOJI_GROUPS.has(d.g) ? withTone(d) : d.e;
  return `<button class="cell" data-i="${i}" data-e="${esc(e)}" title="${esc(d.n)}" aria-label="${esc(d.n)}">${esc(e)}</button>`;
}
let shown = [];   // the entries on screen, in order (cells point into it)
function section(title, list, kind) {
  if (!list.length) return '';
  const start = shown.length; shown.push(...list);
  return (title ? `<h2>${esc(title)}</h2>` : '') + `<div class="grid ${kind || ''}">${list.map((d, j) => cellHtml(d, start + j)).join('')}</div>`;
}
function kindOf(g) { return g === 'kaomoji' ? 'wide' : EMOJI_GROUPS.has(g) ? '' : 'sym'; }

function search(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = [];
  for (const d of DATA) {
    const n = d.n, k = d.k || [];
    let score = 0, ok = true;
    for (const w of words) {
      if (n === w || k.includes(w)) score += 4;
      else if (n.startsWith(w) || n.includes(' ' + w)) score += 3;
      else if (k.some(x => x.startsWith(w))) score += 2;
      else if (n.includes(w) || d.e === w) score += 1;
      else { ok = false; break; }
    }
    if (ok) scored.push([score + (EMOJI_GROUPS.has(d.g) ? .5 : 0), d]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return scored.slice(0, 400).map(x => x[1]);
}

function render(keepFocus) {
  shown = [];
  let h = '';
  if (S.q.trim()) {
    const r = search(S.q.trim());
    const em = r.filter(d => EMOJI_GROUPS.has(d.g)), sy = r.filter(d => !EMOJI_GROUPS.has(d.g) && d.g !== 'kaomoji'), ka = r.filter(d => d.g === 'kaomoji');
    h = section(em.length ? 'Emoji' : '', em) + section('Symbols', sy, 'sym') + section('Kaomoji', ka, 'wide');
    if (!r.length) h = `<div class="empty">Nothing called "${esc(S.q)}". Try another word, like heart, arrow or euro.</div>`;
  } else if (S.cat === 'recent') {
    const list = S.recent.map(e => byChar.get(e) || byChar.get(stripTone(e)) || { e, n: e, g: 'chars' });
    h = list.length ? section('', list.filter(d => d.g !== 'kaomoji'), 'mixed') + section('', list.filter(d => d.g === 'kaomoji'), 'wide')
      : '<div class="empty">The ones you pick show up here.</div>';
  } else if (S.cat === 'chars') {
    for (const [g, title] of CHAR_GROUPS) h += section(title, DATA.filter(d => d.g === g), 'sym');
  } else {
    h = section('', DATA.filter(d => d.g === S.cat), kindOf(S.cat));
  }
  $('#main').innerHTML = h;
  $('#cats').querySelectorAll('button').forEach(b => b.classList.toggle('on', !S.q.trim() && b.dataset.cat === S.cat));
  if (!keepFocus) $('#main').scrollTop = 0;
  describe(document.activeElement);
}
function stripTone(e) { return TONES.slice(1).reduce((s, t) => s.split(t).join(''), e); }

function renderCats() {
  $('#cats').innerHTML = CATS.map(([id, icon, label]) => `<button data-cat="${id}" title="${esc(label)}">${esc(icon)}<span>${id === 'chars' || id === 'kaomoji' || id === 'recent' ? esc(label) : ''}</span></button>`).join('');
}
function renderTones() {
  $('#tones').innerHTML = TONE_SHOW.map((t, i) => `<button class="tone ${S.tone === i ? 'on' : ''}" data-tone="${i}" title="${i ? 'Skin tone ' + i : 'No skin tone'}">${t}</button>`).join('');
}
function setTone(t) { S.tone = t; renderTones(); const f = document.activeElement?.dataset?.i; render(true); if (f != null) $(`.cell[data-i="${f}"]`)?.focus({ preventScroll: true }); invoke('set_tone', { tone: t }).catch(() => {}); }
function setCat(id) { S.cat = id; S.q = ''; $('#q').value = ''; render(); const c = $('#cats [data-cat="' + id + '"]'); c?.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }
function stepCat(d) { const i = CATS.findIndex(c => c[0] === S.cat); setCat(CATS[(i + d + CATS.length) % CATS.length][0]); focusFirst(); }
function focusFirst() { $('.cell')?.focus(); }

function describe(el) {
  if (el && el.classList?.contains('cell')) {
    const d = shown[+el.dataset.i];
    $('#now').innerHTML = `<b>${esc(el.dataset.e.length > 6 ? '' : el.dataset.e)}</b><span>${esc(d ? d.n : '')}</span>`;
  } else $('#now').innerHTML = `<span>${DATA.length ? 'Pick one to type it where you were. It\'s copied too.' : 'The emoji list is missing.'}</span>`;
}
function hints() {
  $('#hints').innerHTML = S.pad
    ? '<span><i>A</i>Type</span><span><i>☰</i>Copy only</span><span><i>Y</i>Skin tone</span><span><i>X</i>Search</span><span><i>LB RB</i>Tabs</span><span><i>B</i>Close</span>'
    : '<span><i>Enter</i>Type</span><span><i>Shift+Enter</i>Copy only</span><span><i>Tab</i>Next tab</span><span><i>Esc</i>Close</span>';
}

let toastTimer = 0;
function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2400); }
async function choose(el, copyOnly) {
  if (!el || !el.dataset.e || S.busy) return;
  S.busy = true;
  try {
    const r = await invoke('pick', { text: el.dataset.e, copyOnly: !!copyOnly });
    if (!T) { toast((copyOnly ? 'Copied ' : 'Typed ') + el.dataset.e); S.recent = [el.dataset.e, ...S.recent.filter(x => x !== el.dataset.e)]; }
    else if (r && !r.typed) toast('Copied: paste it with Ctrl+V');
  } catch (e) { toast(String(e)); }
  S.busy = false;
}
function close() { invoke('close').catch(() => window.close()); }

// ---------------------------------------------------------------- moving around
function cells() { return [...document.querySelectorAll('.cell')]; }
function move(dir) {
  const el = document.activeElement;
  if (!el || !el.classList.contains('cell')) { if (dir === 'down' || dir === 'right') focusFirst(); return; }
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bestScore = Infinity;
  for (const c of cells()) {
    if (c === el) continue;
    const q = c.getBoundingClientRect(), qx = q.left + q.width / 2, qy = q.top + q.height / 2, dx = qx - cx, dy = qy - cy;
    if (dir === 'left' && (Math.abs(dy) > r.height / 2 || dx >= -2)) continue;
    if (dir === 'right' && (Math.abs(dy) > r.height / 2 || dx <= 2)) continue;
    if (dir === 'up' && dy >= -4) continue;
    if (dir === 'down' && dy <= 4) continue;
    const score = (dir === 'left' || dir === 'right') ? Math.abs(dx) : Math.abs(dy) * 3 + Math.abs(dx);
    if (score < bestScore) { bestScore = score; best = c; }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
  else if (dir === 'up') $('#q').focus();
  else if (dir === 'left' || dir === 'right') {   // the end of a row: on to the next one
    const all = cells(), i = all.indexOf(el), n = all[i + (dir === 'right' ? 1 : -1)];
    if (n) { n.focus(); n.scrollIntoView({ block: 'nearest' }); }
  }
}

document.addEventListener('keydown', e => {
  S.pad = false; hints();
  const inSearch = e.target === $('#q');
  const k = e.key;
  if (oskOpen()) { if (k === 'Escape') { e.preventDefault(); closeOsk(); } return; }
  if (k === 'Escape') { e.preventDefault(); if (S.q) { S.q = ''; $('#q').value = ''; render(); $('#q').focus(); } else close(); return; }
  if (k === 'Tab') { e.preventDefault(); stepCat(e.shiftKey ? -1 : 1); return; }
  if (inSearch) {
    if (k === 'ArrowDown' || (k === 'Enter' && !e.shiftKey && !e.ctrlKey)) { e.preventDefault(); if (k === 'Enter') return choose($('.cell'), false); focusFirst(); }
    if (k === 'Enter' && (e.shiftKey || e.ctrlKey)) { e.preventDefault(); choose($('.cell'), true); }
    return;
  }
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (dirs[k]) { e.preventDefault(); move(dirs[k]); return; }
  if (k === 'Enter' || k === ' ') { e.preventDefault(); choose(document.activeElement, e.shiftKey || e.ctrlKey); return; }
  if ((e.ctrlKey && k.toLowerCase() === 'c')) { e.preventDefault(); choose(document.activeElement, true); return; }
  // Typing a letter anywhere searches.
  if (k.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { $('#q').focus(); }
  if (k === 'Backspace') { $('#q').focus(); }
});
$('#q').addEventListener('input', () => { S.q = $('#q').value; render(); });
document.addEventListener('focusin', e => describe(e.target));
document.addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (c) return choose(c, e.shiftKey || e.ctrlKey);
  const cat = e.target.closest('[data-cat]'); if (cat) return setCat(cat.dataset.cat);
  const t = e.target.closest('[data-tone]'); if (t) return setTone(+t.dataset.tone);
  if (e.target.closest('#close')) return close();
  const o = e.target.closest('.osk button'); if (o) return oskPress(o.dataset.k);
});
// Right-click (or long press) copies without typing.
document.addEventListener('contextmenu', e => { const c = e.target.closest('.cell'); if (c) { e.preventDefault(); choose(c, true); } });
// Clicking another window closes the picker, as on other systems.
let blurTimer = 0;
window.addEventListener('blur', () => { if (!T) return; blurTimer = setTimeout(() => { if (!document.hasFocus()) close(); }, 300); });
window.addEventListener('focus', () => clearTimeout(blurTimer));

// ---------------------------------------------------------------- on-screen keyboard (controller search)
const OSK_KEYS = 'qwertyuiopasdfghjkl\'zxcvbnm-.!1234567890'.split('');
function oskOpen() { return !!$('.osk'); }
function openOsk() {
  if (oskOpen()) return;
  const d = document.createElement('div'); d.className = 'osk';
  d.innerHTML = OSK_KEYS.map(k => `<button data-k="${esc(k)}">${esc(k)}</button>`).join('') +
    '<button class="wide" data-k="space">Space</button><button class="wide" data-k="back">⌫</button><button class="wide" data-k="clear">Clear</button><button class="wide" data-k="done">Done</button>';
  document.body.appendChild(d); d.querySelector('button').focus();
}
function closeOsk() { $('.osk')?.remove(); if ($('.cell')) focusFirst(); else $('#q').focus(); }
function oskPress(k) {
  if (k === 'done') return closeOsk();
  let v = $('#q').value;
  v = k === 'space' ? v + ' ' : k === 'back' ? v.slice(0, -1) : k === 'clear' ? '' : v + k;
  $('#q').value = v; S.q = v; render(true);
}
function oskMove(dir) {
  const bs = [...document.querySelectorAll('.osk button')], i = bs.indexOf(document.activeElement);
  const cols = 10, span = b => b.classList.contains('wide') ? 2 : 1;
  // Position of each key in the 10-wide grid.
  let col = 0, row = 0; const pos = bs.map(b => { const p = [row, col]; col += span(b); if (col >= cols) { col = 0; row++; } return p; });
  const [r, c] = pos[Math.max(0, i)];
  const target = dir === 'left' ? [r, c - 1] : dir === 'right' ? [r, c + span(bs[i]) ] : dir === 'up' ? [r - 1, c] : [r + 1, c];
  let best = -1, bd = 1e9;
  pos.forEach(([pr, pc], j) => { if (pr !== target[0]) return; const d = Math.abs(pc - target[1]); if (d < bd) { bd = d; best = j; } });
  if (best >= 0 && (dir === 'up' || dir === 'down' || bd === 0)) bs[best].focus();
}

// ---------------------------------------------------------------- controller (standard mapping)
const held = {}; let lastMove = 0;
function pad() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const now = performance.now();
  const st = { up: 0, down: 0, left: 0, right: 0, a: 0, b: 0, x: 0, y: 0, lb: 0, rb: 0, menu: 0 };
  for (const g of pads) {
    const bt = i => g.buttons[i]?.pressed; const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    st.up ||= bt(12) || ay < -.6; st.down ||= bt(13) || ay > .6; st.left ||= bt(14) || ax < -.6; st.right ||= bt(15) || ax > .6;
    st.a ||= bt(0); st.b ||= bt(1); st.x ||= bt(2); st.y ||= bt(3); st.lb ||= bt(4); st.rb ||= bt(5); st.menu ||= bt(9);
  }
  for (const [k, on] of Object.entries(st)) {
    if (!on) { held[k] = 0; continue; }
    const first = !held[k], dir = ['up', 'down', 'left', 'right'].includes(k);
    const repeat = held[k] && now - held[k] > 360 && now - lastMove > 90;
    if (first) held[k] = now;
    if (!(first || (repeat && dir))) continue;
    if (!S.pad) { S.pad = true; hints(); }
    lastMove = now;
    if (oskOpen()) {
      if (dir) oskMove(k); else if (k === 'a') oskPress(document.activeElement?.dataset?.k); else if (k === 'b' || k === 'x') closeOsk(); else if (k === 'y') oskPress('back');
      continue;
    }
    if (dir) { if (document.activeElement === $('#q') && k !== 'down') continue; move(k); }
    else if (k === 'a') choose(document.activeElement.classList.contains('cell') ? document.activeElement : $('.cell'), false);
    else if (k === 'menu') choose(document.activeElement.classList.contains('cell') ? document.activeElement : $('.cell'), true);
    else if (k === 'b') { if (S.q) { S.q = ''; $('#q').value = ''; render(); focusFirst(); } else close(); }
    else if (k === 'x') openOsk();
    else if (k === 'y') setTone((S.tone + 1) % 6);
    else if (k === 'lb') stepCat(-1);
    else if (k === 'rb') stepCat(1);
  }
  requestAnimationFrame(pad);
}
requestAnimationFrame(pad);

// ---------------------------------------------------------------- start
renderCats(); hints();
invoke('init').then(r => {
  S.recent = r.recent || []; S.tone = r.tone || 0;
  if (S.recent.length) S.cat = 'recent';
}).catch(() => {}).finally(() => { renderTones(); render(); $('#q').focus(); });

// Without the app (the page opened in a browser, CI's screenshots): stand-ins.
function demoInvoke(cmd, args) {
  if (cmd === 'init') return Promise.resolve({ recent: ['😂', '❤️', '👍', '🔥', '¯\\_(ツ)_/¯', '→', '€'], tone: 0, platform: 'linux' });
  if (cmd === 'pick') return Promise.resolve({ copied: true, typed: !args.copyOnly });
  return Promise.resolve(null);
}
</script>
</body>
</html>
