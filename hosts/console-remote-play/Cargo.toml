# Hearth Console Remote Play (docs/CONSOLE-REMOTE-PLAY.md; approved mockups docs/mockups/console-remote-play, checklist
# docs/mockups/checklists/console-remote-play.md): a Hearth Store app that streams your own Xbox from home, the way
# Greenlight does (MIT). Pure Rust on hearth-ui (iced); the stream through GStreamer's webrtcbin with the graphics
# card decoding (VA-API). Its own workspace, so GStreamer's libraries are needed only here (the OS image's hearth-ui
# build is untouched). Built and tested only in GitHub Actions (console-remote-play.yml). No version line: the owner
# picks every version number.
[package]
name = "hearth-console-remote-play"
edition = "2021"
description = "Hearth Console Remote Play: play your own Xbox from anywhere"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "crp"
path = "src/lib.rs"

[[bin]]
name = "hearth-console-remote-play"
path = "src/main.rs"

[features]
default = ["stream"]
# The picture and sound (GStreamer). Without it every page still works and Stream says the player isn't there.
stream = ["dep:gstreamer", "dep:gstreamer-webrtc", "dep:gstreamer-sdp", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
hearth-ui = { path = "../hearth-ui" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "canvas", "crisp", "smol", "image"] }
serde_json = "1"
futures = "0.3"
libc = "0.2"
# Xbox Live's signed requests (ECDSA P-256 over SHA-256, RFC 6979) and PKCE.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# HTTPS to Microsoft (rustls): tokens go in headers, never on a command line.
ureq = "2"
# Screenshots (PNG) and the stand-in's still picture (the same image crate iced uses).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gstreamer = { version = "0.24", optional = true }
gstreamer-webrtc = { version = "0.24", optional = true }
gstreamer-sdp = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }
gstreamer-video = { version = "0.24", optional = true }

[dev-dependencies]
tempfile = "3"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

# The same softbuffer hearth-ui uses (hosts/hearth-ui/vendor/README.md).
[patch.crates-io]
softbuffer = { path = "../hearth-ui/vendor/softbuffer" }
