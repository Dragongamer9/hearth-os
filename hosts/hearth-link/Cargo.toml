[package]
# No version here on purpose: the owner picks Hearth's version numbers (MILESTONES.md). Cargo treats a missing version as
# 0.0.0 and never publishes the crate.
name = "hearth-link"
edition = "2021"
description = "Hearth Link: your Hearth devices, paired once: Hearth data kept in sync between them and games copied from one to another, fast, on the same network or over the internet"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "hearth_link"
path = "src/lib.rs"

[[bin]]
name = "hearth-link"
path = "src/main.rs"

[dependencies]
# QUIC (TLS 1.3, every device's key is its identity), hole punching through NATs, relays when that fails.
iroh = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content addressing and verifying every chunk as it's written.
blake3 = "1"
# Fast compression, only for chunks it helps (decided per chunk from a sample).
zstd = "0.13"
# Pairing: a password-authenticated key exchange, so the short code can't be guessed offline.
spake2 = "0.4"
# Pairing from somewhere else with a short code: the signed pkarr record it's found by (iroh's own types for it).
iroh-dns = "1"
url = "2"
getrandom = "0.2"
libc = "0.2"
if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }
# Hearth's own knowledge of the stores (Steam libraries, Epic, GOG, Beacon) and its data folder.
hearth-core = { path = "../hearth-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
