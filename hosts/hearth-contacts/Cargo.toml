[package]
name = "hearth-contacts"
version = "0.1.0"
edition = "2021"
description = "Hearth Contacts: Hearth OS's own address book (vCard files, optional CardDAV sync)"
license = "GPL-3.0-or-later"

# The address book itself (vCard, the folders of .vcf files, CardDAV) is a library, so the tests drive it without
# a window: vCard round trips, and sync against a real CardDAV server (tests/carddav.rs, Radicale in CI).
[lib]
name = "hearth_contacts"
path = "src/lib.rs"

[[bin]]
name = "hearth-contacts"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
ureq = "2"
url = "2"
quick-xml = "0.36"

# Passwords for CardDAV accounts: the Secret Service on Linux (GNOME Keyring in Hearth's session).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
