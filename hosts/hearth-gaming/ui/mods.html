<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mods</title>
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="osk/hearth-osk.css">
<style>
.split { grid-template-columns:minmax(16em, 26em) 1fr; }
.detail { display:grid; grid-template-rows:auto 1fr; gap:.8em; min-height:0; }
.mod { display:grid; grid-template-columns:auto auto 1fr auto; gap:.1em .8em; align-items:center; width:100%; padding:.65em .9em; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); min-height:3.4em; }
.mod.off { opacity:.62; }
.mod .num { grid-row:span 2; color:var(--faint); font-variant-numeric:tabular-nums; font-weight:700; min-width:1.4em; text-align:right; }
.mod .n { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mod .m { grid-column:3; color:var(--muted); font-size:.8em; display:flex; gap:.5em; flex-wrap:wrap; }
.mod .sw, .sw { grid-row:span 2; width:2.6em; height:1.5em; border-radius:99px; background:var(--panel3); position:relative; flex:none; }
.sw::after { content:""; position:absolute; top:.17em; left:.18em; width:1.16em; height:1.16em; border-radius:50%; background:var(--muted); transition:left .15s var(--ease); }
.sw.on { background:var(--ember); } .sw.on::after { left:1.25em; background:var(--ink); }
.mod .end { grid-row:span 2; color:var(--muted); font-size:.85em; text-align:right; }
.beacon { display:grid; place-items:center; text-align:center; gap:.8em; padding:2.4em 1em; }
.tops { display:flex; flex-wrap:wrap; gap:.35em; margin:.3em 0; }
.tops span { font-family:ui-monospace, monospace; font-size:.78em; background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:.15em .5em; }
.one { display:grid; grid-template-rows:auto 1fr; gap:.8em; min-height:0; grid-column:1/-1; }
.dl { display:grid; grid-template-columns:1fr auto; gap:.15em .8em; align-items:center; width:100%; padding:.65em .9em; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); text-align:left; }
.dl .n { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dl .m { grid-column:1/-1; color:var(--muted); font-size:.8em; display:flex; gap:.6em; flex-wrap:wrap; }
.dl .prog { grid-column:1/-1; margin:.3em 0 0; }
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(15em, 1fr)); gap:.8em; }
.card { display:grid; grid-template-rows:auto auto 1fr; text-align:left; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); overflow:hidden; padding:0; }
.card .art { aspect-ratio:16/9; background:var(--panel3) center/cover no-repeat; }
.card .t { padding:.55em .8em 0; font-weight:650; }
.card .m { padding:.15em .8em .7em; color:var(--muted); font-size:.8em; display:flex; gap:.5em; flex-wrap:wrap; align-content:start; }
.card.down { opacity:.5; }
.job { padding:.8em 1em; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); display:grid; gap:.35em; }
.job .acts { display:flex; gap:.5em; flex-wrap:wrap; }
.status { font-family:ui-monospace, monospace; font-size:.75em; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.need { display:grid; grid-template-columns:1fr auto; gap:.1em .6em; align-items:center; padding:.4em 0; border-top:1px solid var(--line); }
.need .m { grid-column:1; color:var(--muted); font-size:.78em; }
input.inp.mono { font-family:ui-monospace, monospace; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>Mods</h1>
    <span class="sub" id="sub"></span>
    <div class="tabs" id="tabs"><span class="lbrb">LB</span><button class="tab f" data-tab="games">Games</button><button class="tab f" data-tab="downloads">Downloads</button><button class="tab f" data-tab="modlists">Modlists</button><button class="tab f" data-tab="accounts">Accounts</button><span class="lbrb">RB</span></div>
  </header>
  <main id="main" class="split"></main>
  <footer id="foot"></footer>
</div>
<script src="osk/hearth-osk.js"></script>
<script src="kit.js"></script>
<script>
'use strict';
const { $, esc, human, when } = KIT;
// Every call but the window's own (the file chooser) goes through `call`: answered by this window when it's Hearth
// Mods' worker, or by the worker that's running (Game Mode's), so both see the same queue and installs.
{ const direct = KIT.invoke, own = ['info', 'pick_path']; KIT.invoke = (cmd, args = {}) => KIT.live && !own.includes(cmd) ? direct('call', { name: cmd, args }) : direct(cmd, args); }
const S = { games: [], sel: null, sum: null, loading: true, info: {}, tab: 'games', acct: undefined, dls: { items: [], active: 0, quota: {} }, engine: null, gallery: null, galleryErr: '', jobs: [], filter: 'all', nsfw: false, accts: [] };
const TABS = ['games', 'downloads', 'modlists', 'accounts'];
const SRC = { steam: 'Steam', epic: 'Epic', gog: 'GOG', manual: 'Your game', beacon: 'Beacon', 'heroic-epic': 'Heroic (Epic)', 'heroic-gog': 'Heroic (GOG)' };
const game = id => S.games.find(g => g.id === id);

async function load() {
  S.loading = true; render();
  try { S.games = await KIT.invoke('list'); } catch (e) { S.games = []; KIT.toast(KIT.err(e)); }
  S.loading = false;
  if (!S.sel || !game(S.sel)) S.sel = (S.info.game && game(S.info.game)) ? S.info.game : S.games[0]?.id || null;
  await loadMods();
}
async function loadMods() {
  S.sum = null;
  if (S.sel && !game(S.sel)?.beacon) { try { S.sum = await KIT.invoke('mods_of', { id: S.sel }); } catch (e) { KIT.toast(KIT.err(e)); } }
  render();
}
function applyResult(r) {
  S.sum = r.summary;
  const g = game(S.sel); if (g) { g.mods = r.summary.mods.length; g.modsOn = r.summary.mods.filter(m => m.enabled).length; }
  const rep = r.report || {};
  render();
  if (rep.problems?.length) KIT.alert('Done, with problems', rep.problems.map(esc).join('<br>'), false);
  else if (rep.keptChanged?.length) KIT.alert('Done', `The game had changed ${rep.keptChanged.length} of the mod's files while it was on; those copies are kept in the mod folder (changed/).`);
}

// ---------------------------------------------------------------- drawing
function render() {
  const focusKey = document.activeElement?.dataset?.key;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  if (S.tab !== 'games') {
    $('#sub').textContent = S.tab === 'downloads' ? (S.dls.active ? `${S.dls.active} downloading` : '') : S.tab === 'accounts' ? `${(S.acct ? 1 : 0) + S.accts.filter(a => a.signedIn).length} signed in` : '';
    $('#main').className = '';
    $('#main').innerHTML = S.tab === 'downloads' ? downloadsView() : S.tab === 'modlists' ? modlistsView() : accountsView();
    footer();
    const back = focusKey && document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
    if (back) back.focus({ preventScroll: true });
    return;
  }
  $('#main').className = 'split';
  $('#sub').textContent = S.loading ? '' : `${S.games.length} games`;
  if (S.loading) { $('#main').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="prog spin" style="max-width:20em;margin:0 auto 1em"><i></i></div>Reading your library…</div>`; footer(); return; }
  const rows = S.games.map(g => `<button class="item f ${g.id === S.sel ? 'sel' : ''}" data-key="g:${esc(g.id)}" data-game="${esc(g.id)}">
      <span class="ico">${esc((g.title || '?')[0].toUpperCase())}</span><span class="n">${esc(g.title)}</span>
      <span class="end">${g.modsOn ? `<span class="badge">${g.modsOn} on</span>` : ''}</span>
      <span class="m">${g.beacon ? '<span class="badge sky">Managed by Beacon</span>' : g.mods ? `${g.mods} mod${g.mods > 1 ? 's' : ''}` : 'No mods'} · ${esc(SRC[g.source] || g.source)}</span></button>`).join('');
  $('#main').innerHTML = `<div class="scroll"><div class="list">${rows || '<div class="empty">No installed games found.</div>'}</div></div><section class="detail">${detail()}</section>`;
  footer();
  const back = focusKey && document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
  if (back) back.focus({ preventScroll: true }); else if (!KIT.dialogOpen() && (!document.activeElement || document.activeElement === document.body)) KIT.focusFirst('.item.sel') || KIT.focusFirst();
}
function footer() {
  const onMod = document.activeElement?.dataset?.mod;
  const h = S.tab === 'games' ? [['A', 'Choose'], ['B', 'Back'], ['X', onMod ? 'On / off' : ''], ['Y', 'Add a mod'], ['LB RB', 'Tabs']]
    : S.tab === 'downloads' ? [['A', 'Choose'], ['X', 'Pause / resume'], ['Y', 'Add a Nexus link'], ['LB RB', 'Tabs']]
    : [['A', 'Choose'], ['B', 'Back'], ['LB RB', 'Tabs']];
  $('#foot').innerHTML = h.map(x => `<span><b>${x[0]}</b>${x[1]}</span>`).join('');
}
function detail() {
  const g = game(S.sel);
  if (!g) return '<div class="empty">Choose a game.</div>';
  if (g.beacon) return `<div class="panel beacon"><h2>${esc(g.title)}</h2><p class="msg">Beacon manages this game and its mods (Battle for Middle-earth, Age of the Ring and the others).</p><button class="btn primary f" data-key="beacon" data-act="beacon" data-autofocus>Open Beacon</button></div>`;
  const s = S.sum;
  if (!s) return '<div class="empty">Reading its mods…</div>';
  const mods = s.mods.map(m => `<button class="mod f ${m.enabled ? '' : 'off'}" data-key="m:${esc(m.id)}" data-mod="${esc(m.id)}">
      <span class="num">${m.order + 1}</span><span class="sw ${m.enabled ? 'on' : ''}"></span><span class="n">${esc(m.name)}</span><span class="end">${esc(human(m.size))}</span>
      <span class="m"><span>${m.files} file${m.files === 1 ? '' : 's'}</span><span>${esc(m.targetLabel)}${m.sub ? ` › ${esc(m.sub)}` : ''}</span>${m.enabled && m.overriddenBy.length ? `<span class="warn">${m.winning ? 'Some files' : 'All its files'} replaced by ${esc(m.overriddenBy.join(', '))}</span>` : ''}</span></button>`).join('');
  return `<div class="panel">
      <h2>${esc(g.title)}</h2>
      <div class="path">${esc(g.install || '')}</div>
      <div class="acts" style="margin-top:.7em"><button class="btn primary f" data-key="add" data-act="add">Add a mod…</button><button class="btn f" data-key="nx" data-act="nexusGet">From Nexus Mods…</button><button class="btn f" data-key="og" data-act="openGame">Open game folder</button>${s.mods.length ? '<button class="btn f" data-key="om" data-act="openStore">Open mod files</button>' : ''}<button class="btn f" data-key="dm" data-act="deployMode">${esc(deployLabel(s))} ›</button></div>
      ${s.overlay ? `<p class="msg small" style="margin:.5em 0 0"><span class="badge sky">Overlay ${s.overlay.mounted ? 'on' : 'off'}</span> The game folder isn't changed; what the game writes there is kept apart (${esc(human(s.overlay.changed))}).</p>` : ''}
      <p class="msg small" style="margin:.6em 0 0">${s.mods.length > 1 ? 'Mods lower in the list win when two have the same file. ' : ''}Turning a mod off puts the game's own files back. Download mods from the mod's page (Nexus Mods' "Manual download", ModDB, GitHub…), then add the file here.</p>
    </div>
    <div class="scroll"><div class="list">${mods || '<div class="empty">No mods yet. Add one from a .zip, .7z or .rar file, or a folder.</div>'}</div></div>`;
}

// ---------------------------------------------------------------- choosing things
document.addEventListener('focusin', footer);
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || b.closest('#kit-layer') || KIT.dialogOpen()) return;
  if (b.dataset.game) { S.sel = b.dataset.game; loadMods().then(() => { if (KIT.usingPad()) KIT.focusFirst('.mod') || KIT.focusFirst('[data-key="add"]') || KIT.focusFirst('[data-key="beacon"]'); }); return; }
  if (b.dataset.mod) return modActions(b.dataset.mod);
  const a = b.dataset.act;
  if (a === 'beacon') return KIT.invoke('open_beacon').then(() => KIT.toast('Opening Beacon…')).catch(e => KIT.alert('Beacon', esc(KIT.err(e)), false));
  if (a === 'add') return addMod();
  if (a === 'openGame') return KIT.invoke('open_folder', { path: game(S.sel).install }).catch(e => KIT.toast(KIT.err(e)));
  if (S.tab !== 'games') return;
  if (a === 'nexusGet') return nexusGet();
  if (a === 'deployMode') return deployMode();
  if (a === 'openStore') return KIT.invoke('open_folder', { path: S.sum.folder + '/files' }).catch(e => KIT.toast(KIT.err(e)));
});
KIT.onBack = () => { if (S.tab !== 'games') return KIT.focusFirst(`.tab[data-tab="${S.tab}"]`); if (!document.activeElement?.dataset?.game) KIT.focusFirst('.item.sel'); };
KIT.onX = () => {
  if (KIT.dialogOpen() && document.querySelector('[data-g="file"]')) return document.querySelector('[data-g="file"]').click();
  if (S.tab === 'downloads') { const id = document.activeElement?.dataset?.dl; const d = id && S.dls.items.find(x => x.id === id); if (d) act(['downloading', 'queued'].includes(d.state) ? 'dlPause' : 'dlResume', document.activeElement); return; }
  if (S.tab !== 'games') return;
  const id = document.activeElement?.dataset?.mod; if (id) { const m = S.sum.mods.find(x => x.id === id); toggle(m, !m.enabled); } };
KIT.onY = () => { if (KIT.dialogOpen() && document.querySelector('[data-g="skip"]')) return document.querySelector('[data-g="skip"]').click(); if (S.tab === 'downloads') return pasteLink(); if (S.tab === 'games' && game(S.sel) && !game(S.sel).beacon) addMod(); };
KIT.onTab = d => setTab(TABS[(TABS.indexOf(S.tab) + d + TABS.length) % TABS.length]);
function setTab(t) {
  S.tab = t; render(); KIT.focusFirst(`.tab[data-tab="${t}"]`);
  if (t === 'downloads') refreshDownloads();
  if (t === 'accounts') { if (S.acct === undefined) loadAccount(); loadAccounts(); }
  if (t === 'modlists') loadModlists();
}

async function toggle(m, on) {
  try { applyResult(await KIT.invoke('toggle', { id: S.sel, m: m.id, on })); KIT.toast(`${m.name}: ${on ? 'on' : 'off'}`); } catch (e) { KIT.alert('That didn\'t work', esc(KIT.err(e)), false); }
}
async function modActions(id) {
  const m = S.sum.mods.find(x => x.id === id); if (!m) return;
  const items = [{ id: 'toggle', label: m.enabled ? 'Turn off' : 'Turn on', sub: m.enabled ? 'Takes its files out and puts the game\'s own back' : 'Puts its files in the game' }];
  if (m.order > 0) items.push({ id: 'up', label: 'Move up', sub: 'Loses to the mods below it' });
  if (m.order < S.sum.mods.length - 1) items.push({ id: 'down', label: 'Move down', sub: 'Wins over the mods above it' });
  items.push({ id: 'open', label: 'Open its files' }, { id: 'where', label: 'Open where it goes' }, { id: 'remove', label: 'Remove…', sub: 'Turns it off and deletes Hearth\'s copy of it' });
  const a = await KIT.choose(m.name, items, `${m.files} files · ${human(m.size)} · added ${when(m.added)}${m.source ? `<br><span class="path">${esc(m.source)}</span>` : ''}`);
  try {
    if (a === 'toggle') return toggle(m, !m.enabled);
    if (a === 'up' || a === 'down') { applyResult(await KIT.invoke('move_mod', { id: S.sel, m: id, by: a === 'up' ? -1 : 1 })); KIT.focusFirst(`[data-key="m:${CSS.escape(id)}"]`); return; }
    if (a === 'open') return KIT.invoke('open_folder', { path: `${S.sum.folder}/files/${id}` });
    if (a === 'where') return m.root ? KIT.invoke('open_folder', { path: m.root }) : KIT.toast('That folder isn\'t there yet.');
    if (a === 'remove') {
      if (!await KIT.confirm({ title: `Remove ${m.name}?`, text: '<p>Its files come out of the game (the game\'s own files go back), and Hearth\'s copy of the mod is deleted. The file you installed it from isn\'t touched.</p>', ok: 'Remove', danger: true })) return;
      applyResult(await KIT.invoke('remove_mod', { id: S.sel, m: id }));
      KIT.toast(`${m.name} removed`);
    }
  } catch (e) { KIT.alert('That didn\'t work', esc(KIT.err(e)), false); }
}

// ---------------------------------------------------------------- adding a mod
async function addMod() {
  const g = game(S.sel); if (!g || g.beacon) return;
  const start = (await KIT.invoke('places').catch(() => [])).find(p => p.label === 'Downloads')?.path;
  let src;
  if (KIT.live) {
    const how = await KIT.choose('Add a mod', [{ id: 'file', label: 'From a file', sub: 'A .zip, .7z or .rar file' }, { id: 'folder', label: 'From a folder', sub: 'A folder with the mod in it' }]);
    if (!how) return;
    src = await pick({ folder: how === 'folder', title: how === 'folder' ? 'Choose the mod\'s folder' : 'Choose a mod', start, filters: ['zip', '7z', 'rar', 'tar', 'gz', 'xz', 'zst', 'tgz'] });
  } else src = await KIT.pickPath({ title: 'Choose a mod', note: 'A .zip, .7z or .rar file, or a folder with the mod in it.', files: true, archives: true, folder: true, start });
  if (!src) return;
  KIT.progress('Unpacking the mod');
  let st;
  try { st = await KIT.invoke('stage', { id: g.id, path: src }); } catch (e) { KIT.close(); return KIT.alert('That didn\'t work', esc(KIT.err(e)), false); }
  KIT.close();
  setTimeout(() => installDialog(st), 0);
}
/** The "Install a mod" dialog for an unpacked mod (from a file, a folder or a Nexus download), for the chosen game. */
function installDialog(st) {
  const g = game(S.sel); if (!g) return;
  const pick = { name: st.name, target: st.suggestTarget || 'game', sub: st.suggestSub || '', enable: true };
  const targets = S.sum?.targets || [{ id: 'game', label: 'Game folder', path: g.install }];
  const draw = () => {
    const root = (targets.find(t => t.id === pick.target) || {}).path || '';
    KIT.dialog(`<h2>Install a mod for ${esc(g.title)}</h2>
      <div class="field"><label for="mname">Name</label><input class="inp f" id="mname" data-osk maxlength="120" value="${esc(pick.name)}" spellcheck="false" autocomplete="off"></div>
      <p class="msg small">${st.files} file${st.files === 1 ? '' : 's'}, ${esc(human(st.size))}${st.unwrapped ? ` · the folder “${esc(st.unwrapped)}” around them is left out` : ''}. At its top:</p>
      <div class="tops">${st.top.slice(0, 14).map(t => `<span>${esc(t)}</span>`).join('')}${st.top.length > 14 ? `<span>+${st.top.length - 14} more</span>` : ''}</div>
      <div class="field"><label>Where it goes</label><div class="chips">${targets.map(t => `<button class="chip f ${t.id === pick.target ? 'on' : ''}" data-tgt="${esc(t.id)}">${esc(t.label)}</button>`).join('')}</div></div>
      <div class="field"><label>Folder inside it</label><button class="btn f" data-dl="sub">${pick.sub ? esc(pick.sub) : '(its top)'} ›</button> ${pick.sub ? '<button class="btn f" data-dl="nosub">Use its top</button>' : ''}<div class="path" style="margin-top:.35em">${esc(root)}${pick.sub ? '/' + esc(pick.sub) : ''}</div></div>
      <div class="field"><button class="chip f ${pick.enable ? 'on' : ''}" data-dl="enable"><span class="sw ${pick.enable ? 'on' : ''}" style="display:inline-block;vertical-align:middle;margin-right:.5em"></span>Turn it on now</button></div>
      <div class="row"><button class="btn f" data-dl="cancel">Cancel</button><button class="btn primary f" data-dl="go" data-autofocus>Install</button></div>`,
      { wide: true, onBack: cancel });
    $('#kit-layer').onclick = async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.tgt) { pick.target = b.dataset.tgt; pick.sub = ''; return draw(); }
      const d = b.dataset.dl;
      if (d === 'cancel') return cancel();
      if (d === 'enable') { pick.enable = !pick.enable; return draw(); }
      if (d === 'nosub') { pick.sub = ''; return draw(); }
      if (d === 'sub') {
        $('#kit-layer').onclick = null;
        const p = await KIT.pickPath({ title: 'Which folder inside it?', start: root + (pick.sub ? '/' + pick.sub : ''), note: root });
        if (p && (p === root || p.startsWith(root + '/'))) pick.sub = p.slice(root.length + 1); else if (p) KIT.toast('Choose a folder inside ' + root);
        return draw();
      }
      if (d === 'go') {
        $('#kit-layer').onclick = null;
        KIT.progress(`Installing ${pick.name}`);
        try { const r = await KIT.invoke('install', { id: g.id, token: st.token, name: pick.name, target: pick.target, sub: pick.sub, enable: pick.enable }); KIT.close(); applyResult(r); KIT.toast(`${pick.name} installed${pick.enable ? ' and on' : ''}`); }
        catch (err) { KIT.close(); KIT.alert('That didn\'t work', esc(KIT.err(err)), false); }
      }
    };
    $('#mname').addEventListener('input', e => { pick.name = e.target.value; });
  };
  const cancel = () => { $('#kit-layer').onclick = null; KIT.invoke('cancel_stage', { token: st.token }).catch(() => {}); KIT.close(); };
  draw();
}

// ---------------------------------------------------------------- choosing files: the standard file chooser (Hearth Files), Hearth's own browser as a fallback
async function pick({ folder = false, title = '', start, filters, fallback = {} }) {
  if (KIT.live) { try { return await KIT.invoke('pick_path', { folder, title, start: start || null, filters: filters || null }); } catch (e) { console.warn(e); } }
  return KIT.pickPath(Object.assign({ title, start, folder, files: !folder }, fallback));
}

// ---------------------------------------------------------------- how mods go in
function deployLabel(s) { return ({ hardlink: 'Links', copy: 'Copies', overlay: 'Overlay' })[s.deploy] || 'Links'; }
async function deployMode() {
  const s = S.sum; if (!s) return;
  const sub = { hardlink: 'No extra space and instant. Across drives, copies.', copy: 'Real copies in the game folder: takes the mods\' space twice.', overlay: 'Beta Experimental. The game folder itself is never changed: the mods are laid over it while you play.' };
  const modes = s.modes || [{ id: 'hardlink', label: 'Links' }, { id: 'copy', label: 'Copies' }, { id: 'overlay', label: 'Overlay (Beta Experimental)' }];
  const m = await KIT.choose('How mods are put in place', modes.map(x => ({ id: x.id, label: x.label, sub: sub[x.id], end: x.id === s.deploy ? 'Now' : '' })),
    'Every mod comes out the old way and goes back in the new way. Close the game first.');
  if (!m || m === s.deploy) return;
  KIT.progress('Switching', 'Taking the mods out and putting them back');

// The guided flow: one file at a time in Hearth Browser. Hearth opens the file's page, you press Download there, the
// app checks what lands in Downloads against the list and opens the next page by itself. A (Open again), X (I have it:
// choose the file), Y (Skip for now), B (Stop).
async function guideFlow(jobId) {
  let shown = null, alive = true, gen = 0;
  const stop = () => { alive = false; $('#kit-layer').onclick = null; KIT.close(); refreshJobs(); };
  const draw = (j, g) => {
    const m = g.item;
    KIT.dialog(`<h2 id="gl">${esc(g.label)}</h2><div class="prog"><i id="gp" style="width:${(g.done / g.total * 100).toFixed(1)}%"></i></div>
      <p class="msg" style="margin:.7em 0 .2em"><b>${esc(m.modName || m.fileName)}</b></p>
      <p class="msg small" style="margin:0">${esc(m.fileName)} · ${esc(human(m.size))}${m.site ? ` · ${esc(m.site)}` : ''}</p>
      <p class="msg small">The page is open in Hearth Browser: press <b>Download</b> for this file (sign in there first if the site asks). Hearth checks it and opens the next one by itself.</p>
      <p class="warn small" id="gw">${esc(m.problem || '')}</p>
      <div class="row"><button class="btn f" data-g="stop">Stop</button><button class="btn f" data-g="skip">Skip for now</button><button class="btn f" data-g="file">I have it: choose the file…</button><button class="btn primary f" data-g="open" data-autofocus>Open the page again</button></div>`,
      { wide: true, onBack: stop });
    $('#kit-layer').onclick = async e => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      const k = b.dataset.g;
      if (k === 'stop') return stop();
      if (k === 'open') return KIT.invoke('open_page', { url: m.url }).catch(err => KIT.toast(KIT.err(err)));
      if (k === 'skip') { await KIT.invoke('wj_guide_skip', { id: jobId, file: m.fileName }); shown = null; return poll(true, ++gen); }
      if (k === 'file') {
        gen++;
        const p = await pick({ title: `Choose ${m.fileName}` });
        if (p) { try { await KIT.invoke('wj_manual_file', { id: jobId, file: m.fileName, path: p }); } catch (err) { KIT.toast(KIT.err(err)); } }
        shown = null; return poll(true, ++gen);
      }
    };
  };
  const poll = async (now, my) => {
    if (!alive || my !== gen) return;
    try { S.jobs = await KIT.invoke('wj_jobs'); } catch (e) {}
    const j = S.jobs.find(x => x.id === jobId), g = j && j.guide;
    if (!g || !g.item) { alive = false; $('#kit-layer').onclick = null; KIT.close(); KIT.toast(g ? 'All the files are here. The install carries on by itself.' : 'Nothing left to fetch.'); return refreshJobs(); }
    if (shown !== g.item.fileName) {
      if (shown !== null && !now) KIT.toast('Got it. Opening the next one');
      shown = g.item.fileName;
      draw(j, g);
      KIT.invoke('open_page', { url: g.item.url }).catch(err => KIT.toast(KIT.err(err)));
    } else {
      const gl = $('#gl'), gp = $('#gp'), gw = $('#gw');
      if (gl) gl.textContent = g.label;
      if (gp) gp.style.width = `${(g.done / g.total * 100).toFixed(1)}%`;
      if (gw) gw.textContent = g.item.problem || '';
    }
    setTimeout(() => poll(false, my), 1500);
  };
  poll(true, gen);
}

async function downloadActions(id) {
  const x = S.dls.items.find(i => i.id === id); if (!x) return;
  const items = [];
  if (x.state === 'done' && !x.job) items.push({ id: 'install', label: 'Install into a game…', sub: 'Unpacks it and asks where it goes' });
  if (['downloading', 'queued'].includes(x.state)) items.push({ id: 'pause', label: 'Pause' });

  if (x.state === 'needs-link' || x.state === 'failed') items.push({ id: 'site', label: 'Open on Nexus Mods', sub: 'Press "Mod Manager Download" there' });

  const e = S.engine;

    <div class="acts">${e?.path ? `<button class="btn f" data-key="wf" data-act="wjFile">Install from a .wabbajack file…</button><button class="btn f" data-key="wr" data-act="wjRefresh">Refresh the list</button><div class="chips">${['all', 'SkyrimSpecialEdition', 'Fallout4', 'FalloutNewVegas'].map(f => `<button class="chip f ${S.filter === f ? 'on' : ''}" data-key="ff:${f}" data-act="wjFilter" data-f="${f}">${({ all: 'All games', SkyrimSpecialEdition: 'Skyrim SE', Fallout4: 'Fallout 4', FalloutNewVegas: 'New Vegas' })[f]}</button>`).join('')}<button class="chip f ${S.nsfw ? 'on' : ''}" data-key="fn" data-act="wjNsfw">Adult lists</button></div>` : `<button class="btn primary f" data-key="we" data-act="wjEngine" data-autofocus>Get the Wabbajack engine</button>`}</div>
    ${e?.path ? '' : '<p class="msg small">Hearth OS normally comes with it. The engine is jackify-engine (GPL-3.0), downloaded from its GitHub releases.</p>'}</div>`;
  const jobs = S.jobs.length ? `<div class="list">${S.jobs.map(jobView).join('')}</div>` : '';
  let gal = '';
  if (e?.path) {
    if (S.gallery == null) gal = `<div class="empty"><div class="prog spin" style="max-width:20em;margin:0 auto 1em"><i></i></div>Getting the list of modlists…</div>`;
    else if (S.galleryErr) gal = `<div class="empty">${esc(S.galleryErr)}</div>`;
    else {
      const list = S.gallery.filter(m => (S.nsfw || !m.nsfw) && (S.filter === 'all' || m.game === S.filter));
      gal = `<div class="cards">${list.map((m, i) => `<button class="card f ${m.down ? 'down' : ''}" data-key="ml:${esc(m.id)}" data-ml="${esc(m.id)}"><span class="art" style="${m.image ? `background-image:url('${esc(m.image)}')` : ''}"></span><span class="t">${esc(m.title)}</span>
        <span class="m"><span>${esc(m.gameName || m.game)}</span><span>${esc(human(m.download))} download</span><span>${esc(human(m.install))} installed</span>${m.down ? '<span class="warn">Down for now</span>' : ''}${m.nsfw ? '<span class="badge">Adult</span>' : ''}</span></button>`).join('') || '<div class="empty">No modlists for that.</div>'}</div>`;
    }
  }
  return `<section class="one" style="grid-template-rows:auto 1fr"><div style="display:grid;gap:.8em">${head}${jobs}</div><div class="scroll">${gal}</div></section>`;
}
async function wjInstall(m) {
  const d = await KIT.invoke('wj_defaults', { title: m.title, game: m.game });
  const pick = { install: d.installDir, downloads: d.downloadsDir, gameDir: d.gameDir || '' };
  const draw = () => {
    KIT.dialog(`<h2>Install ${esc(m.title)}</h2>
      <p class="msg small">${esc(m.author ? 'By ' + m.author + ' · ' : '')}${esc(m.gameName || m.game)} · ${esc(human(m.download))} to download, ${esc(human(m.install))} installed${m.archives ? ` · ${m.archives} files` : ''}${d.free != null ? ` · ${esc(human(d.free))} free there` : ''}</p>
      ${m.description ? `<p class="msg small">${esc(m.description).slice(0, 400)}</p>` : ''}
      ${!d.known ? '<p class="warn small">Hearth doesn\'t know this game yet: the list installs, but its Proton folder may need setting up by hand.</p>' : ''}
      ${S.acct ? (S.acct.premium ? '' : '<p class="msg small"><b>Free Nexus account:</b> after the list is read, you\'ll press “Mod Manager Download” once for each Nexus file. Premium does it all by itself.</p>') : '<p class="warn small">Sign in to Nexus Mods first (Accounts tab): nearly every list downloads from it.</p>'}
      <div class="field"><label>The game</label><button class="btn f" data-k="game">${pick.gameDir ? esc(pick.gameDir) : 'Choose its folder…'}</button>${d.gameTitle ? `<div class="msg small">${esc(d.gameTitle)} from your library</div>` : ''}</div>
      <div class="field"><label>The modlist goes in</label><button class="btn f" data-k="inst">${esc(pick.install)} ›</button></div>
      <div class="field"><label>Its downloads go in</label><button class="btn f" data-k="dls">${esc(pick.downloads)} ›</button></div>
      <div class="row">${m.readme ? '<button class="btn f" data-k="readme">Read me</button>' : ''}<button class="btn f" data-k="no">Cancel</button><button class="btn primary f" data-k="go" ${pick.gameDir ? '' : 'disabled'} data-autofocus>Install</button></div>`, { wide: true });
    $('#kit-layer').onclick = async e => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      const k = b.dataset.k;
      if (k === 'no') { $('#kit-layer').onclick = null; return KIT.close(); }
      if (k === 'readme') return openUrl(m.readme);
      if (['game', 'inst', 'dls'].includes(k)) {
        $('#kit-layer').onclick = null;
        const cur = k === 'game' ? pick.gameDir : k === 'inst' ? pick.install : pick.downloads;
        const p = await pick({ folder: true, title: k === 'game' ? 'The game\'s folder' : k === 'inst' ? 'Where the modlist goes (an empty folder)' : 'Where its downloads go', start: cur ? cur.replace(/\/[^/]*$/, '') : undefined });
        if (p) { if (k === 'game') pick.gameDir = p; else if (k === 'inst') pick.install = p + '/' + (m.title || 'Modlist').replace(/[\/:*?"<>|]/g, ' ').trim(); else pick.downloads = p; }
        return draw();
      }
      if (k === 'go') {
        $('#kit-layer').onclick = null; KIT.close();
        try { await KIT.invoke('wj_start', { title: m.title, list: m.id, game: m.game, gameDir: pick.gameDir, installDir: pick.install, downloadsDir: pick.downloads }); KIT.toast(`Installing ${m.title}`); refreshJobs(); }
        catch (err) { KIT.alert('Couldn\'t start', esc(KIT.err(err)), false); }
      }
    };
  };
  draw();
}

async function act(a, b) {
  const job = b?.dataset?.job;
  try {
    if (a === 'pasteLink') return pasteLink();
    if (a === 'dlClear') { await KIT.invoke('downloads_clear'); return refreshDownloads(); }
    if (a === 'dlPause') { await KIT.invoke('download_pause', { id: b.dataset.dl }); return refreshDownloads(); }
    if (a === 'dlResume') { await KIT.invoke('download_resume', { id: b.dataset.dl }); return refreshDownloads(); }
    if (a === 'keyPage') { const p = await KIT.invoke('nexus_pages'); return openUrl(p.keys); }
    if (a === 'keyIn') {
      const k = await ask('Your Nexus Mods API key', 'Paste the whole key.', '', true); if (!k) return;
      KIT.progress('Checking the key');
      try { S.acct = await KIT.invoke('nexus_sign_in', { key: k }); KIT.close(); render(); KIT.toast(`Signed in as ${S.acct.name}`); } catch (e) { KIT.close(); KIT.alert('Couldn\'t sign in', esc(KIT.err(e)), false); }
      return;
    }
    if (a === 'nexusRefresh') { S.acct = await KIT.invoke('nexus_refresh'); render(); return KIT.toast('Checked'); }
    if (a === 'nexusSite') return openUrl('https://www.nexusmods.com/');
    if (a === 'nexusOut') { if (!await KIT.confirm({ title: 'Sign out of Nexus Mods?', text: '<p>Hearth forgets the key. Downloads waiting in the queue stop until you sign in again.</p>', ok: 'Sign out', danger: true })) return; await KIT.invoke('nexus_sign_out'); S.acct = null; return render(); }
    if (a === 'wjEngine') { KIT.progress('Getting the Wabbajack engine', 'Downloading jackify-engine'); try { S.engine = await KIT.invoke('wj_fetch_engine'); KIT.close(); } catch (e) { KIT.close(); return KIT.alert('Couldn\'t get it', esc(KIT.err(e)), false); } return loadModlists(true); }
    if (a === 'wjRefresh') { S.gallery = null; return loadModlists(true); }
    if (a === 'wjFilter') { S.filter = b.dataset.f; return render(); }
    if (a === 'wjNsfw') { S.nsfw = !S.nsfw; return render(); }
    if (a === 'wjFile') {
      const f = await pick({ title: 'Choose a .wabbajack file', filters: ['wabbajack'] }); if (!f) return;
      if (!f.endsWith('.wabbajack')) return KIT.alert('That isn\'t a .wabbajack file', '', false);
      const name = f.replace(/^.*\//, '').replace(/\.wabbajack$/, '');
      const game = await KIT.choose('Which game is it for?', [['SkyrimSpecialEdition', 'Skyrim Special Edition'], ['Fallout4', 'Fallout 4'], ['FalloutNewVegas', 'Fallout: New Vegas'], ['Fallout3', 'Fallout 3'], ['Oblivion', 'Oblivion'], ['Starfield', 'Starfield'], ['Cyberpunk2077', 'Cyberpunk 2077'], ['BaldursGate3', "Baldur's Gate 3"]].map(([id, label]) => ({ id, label })));
      if (!game) return;
      return wjInstall({ id: f, title: name, game, gameName: game });
    }
    if (a === 'needOpen') return openUrl(b.dataset.url);
    if (a === 'guideStart') return guideFlow(job);
    if (a === 'acctBegin') { const r = await KIT.invoke('account_begin', { id: b.dataset.p }); KIT.toast('Sign in in the browser window'); S.accts = S.accts.map(x => x.id === r.id ? r : x); render(); return loadAccounts(); }
    if (a === 'acctOut') { const p = S.accts.find(x => x.id === b.dataset.p); if (!await KIT.confirm({ title: `Sign out of ${p.name}?`, text: '<p>Hearth forgets the sign-in. Files from there are fetched in the browser again.</p>', ok: 'Sign out', danger: true })) return; await KIT.invoke('account_sign_out', { id: p.id }); return loadAccounts(); }
    if (a === 'megaIn') {
      const email = await ask('Your MEGA email address', '', '', true); if (!email) return;
      const pw = await askSecret('Your MEGA password', 'Hearth works out MEGA\'s login from it and forgets the password.'); if (!pw) return;
      KIT.progress('Signing in to MEGA');
      try { await KIT.invoke('mega_sign_in', { email: email.trim(), password: pw }); KIT.close(); KIT.toast('Signed in to MEGA'); } catch (e) { KIT.close(); KIT.alert('Couldn\'t sign in', esc(KIT.err(e)), false); }
      return loadAccounts();
    }
    if (a === 'jobCancel') { await KIT.invoke('wj_cancel', { id: job }); return refreshJobs(); }
    if (a === 'jobResume') { await KIT.invoke('wj_resume', { id: job }); return refreshJobs(); }
    if (a === 'jobFolder') { const j = S.jobs.find(x => x.id === job); return KIT.invoke('open_folder', { path: j.installDir }); }
    if (a === 'jobRepair') { KIT.progress('Setting up its Proton folder', 'Installing the Windows parts it needs'); const n = await KIT.invoke('wj_repair', { id: job }); KIT.close(); return KIT.alert('Done', n.length ? n.map(esc).join('<br>') : 'Its Proton folder is set up.'); }
    if (a === 'jobLog') { const t = await KIT.invoke('wj_log', { id: job }); return KIT.alert('Log', `<pre class="status" style="white-space:pre-wrap;max-height:55vh;overflow:auto">${esc(t || 'Nothing yet.')}</pre>`); }
    if (a === 'jobForget') {
      const c = await KIT.choose('Remove this modlist?', [{ id: 'keep', label: 'Take it out of Hearth only', sub: 'Its folder and downloads stay' }, { id: 'files', label: 'Delete the modlist\'s folder', sub: 'The downloads stay, for installing it again' }, { id: 'all', label: 'Delete its folder and its downloads' }]);
      if (!c) return;
      await KIT.invoke('wj_forget', { id: job, deleteFiles: c !== 'keep', deleteDownloads: c === 'all' });
      return refreshJobs();
    }
  } catch (e) { KIT.close(); KIT.alert('That didn\'t work', esc(KIT.err(e)), false); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || b.closest('#kit-layer') || KIT.dialogOpen()) return;
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.dl && S.tab === 'downloads' && !b.dataset.act) return downloadActions(b.dataset.dl);
  if (b.dataset.ml) { const m = S.gallery.find(x => x.id === b.dataset.ml); if (m) return m.down ? KIT.alert('This list is down for now', 'Its author or Wabbajack marked it as broken. Try again later.', false) : wjInstall(m); }
  if (S.tab !== 'games' && b.dataset.act) return act(b.dataset.act, b);
});
