<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwords &amp; Keys</title>
<link rel="stylesheet" href="common.css">
<style>
.top2 { display:flex; gap:.6em; align-items:center; margin-bottom:.6em; flex-wrap:wrap; }
.top2 .inp { flex:1; min-width:14em; }
.items { display:flex; flex-direction:column; gap:.4em; }
.it { display:grid; grid-template-columns:2.4em 1fr auto; gap:.2em .8em; align-items:center; padding:.6em .8em; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); }
.it .ico { grid-row:span 2; width:2.4em; height:2.4em; border-radius:10px; display:grid; place-items:center; background:var(--panel3); color:var(--ember); font-weight:700; }
.it .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .m { color:var(--muted); font-size:.82em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.it .acts { grid-row:span 2; display:flex; gap:.4em; flex-wrap:wrap; justify-content:flex-end; }
.it .reveal { grid-column:2 / -1; display:flex; gap:.5em; align-items:center; flex-wrap:wrap; }
.note { padding:.6em .9em; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:.85em; margin-bottom:.6em; }
</style>
</head>
<body>
<script src="common.js"></script>
<script>
'use strict';
const { $, $$, esc } = H;
const S = { tab: 'keyring', items: null, wifi: null, q: '', shown: new Map(), error: '' };
H.shell({ title: 'Passwords & Keys', sub: 'Saved on this device only', tabs: [{ id: 'keyring', label: 'Saved passwords' }, { id: 'wifi', label: 'Wi-Fi passwords' }],
  onTab: t => { S.tab = t; hideAll(); load(); }, hints: [['Y', 'Refresh']] });
H.S.refresh = () => load(true);
// Shown passwords hide again after a minute, and when the window is left.
let hideTimer = 0;
function hideAll() { S.shown.clear(); clearTimeout(hideTimer); }
window.addEventListener('blur', () => { if (S.shown.size) { hideAll(); render(); } });

async function load(force) {
  S.error = '';
  try {
    if (S.tab === 'keyring' && (force || !S.items)) { S.items = null; render(); S.items = (await H.job('keys.list')).items; }
    if (S.tab === 'wifi' && (force || !S.wifi)) { S.wifi = null; render(); S.wifi = (await H.call('keys.wifi')).networks; }
  } catch (e) { S.error = String(e); }
  render();
}

function initials(s) { return esc((s || '?').replace(/^https?:\/\//, '').trim().slice(0, 1).toUpperCase()); }
function render() {
  const list = S.tab === 'keyring' ? S.items : S.wifi;
  const q = S.q.toLowerCase();
  const match = it => !q || JSON.stringify(it).toLowerCase().includes(q);
  let rows = '';
  if (S.error) rows = `<div class="empty bad">${esc(S.error)}</div>`;
  else if (!list) rows = '<div class="empty"><span class="spinner"></span> Looking…</div>';
  else if (S.tab === 'keyring') {
    const items = list.filter(match);
    rows = items.length ? items.map(it => {
      const key = it.path, sec = S.shown.get(key);
      const attrs = (it.attributes || []).filter(([k]) => !/^(application)$/.test(k)).slice(0, 3).map(([k, v]) => `${k}: ${v}`).join(' · ');
      return `<div class="it" data-key="${esc(key)}"><span class="ico">${initials(it.label)}</span><span class="n">${esc(it.label || '(no name)')}${it.locked ? ' <span class="badge warn">locked</span>' : ''}</span>
        <span class="acts">${sec == null ? `<button class="btn small f" data-show="${esc(key)}">Show</button>` : `<button class="btn small f" data-copy="${esc(key)}">Copy</button><button class="btn small f" data-hide="${esc(key)}">Hide</button>`}<button class="btn small danger f" data-del="${esc(key)}">Delete</button></span>
        <span class="m">${esc([it.app, it.keyring && 'keyring: ' + it.keyring, attrs, it.modified && 'changed ' + H.ago(it.modified * 1000)].filter(Boolean).join(' · '))}</span>
        ${sec != null ? `<span class="reveal"><span class="secret">${esc(sec)}</span></span>` : ''}</div>`;
    }).join('') : `<div class="empty">${list.length ? 'Nothing matches.' : 'No saved passwords. Apps that keep passwords in the keyring (browsers, mail, Steam\'s helpers…) show up here.'}</div>`;
  } else {
    const nets = list.filter(match);
    rows = nets.length ? nets.map(n => {
      const sec = S.shown.get(n.uuid);
      return `<div class="it"><span class="ico">📶</span><span class="n">${esc(n.name)}</span>
        <span class="acts">${sec == null ? `<button class="btn small f" data-show="${esc(n.uuid)}">Show password</button>` : `<button class="btn small f" data-copy="${esc(n.uuid)}">Copy</button><button class="btn small f" data-hide="${esc(n.uuid)}">Hide</button>`}<button class="btn small danger f" data-del="${esc(n.uuid)}">Forget</button></span>
        <span class="m">${n.lastUsed ? 'last used ' + H.ago(n.lastUsed * 1000) : 'saved network'}</span>${sec != null ? `<span class="reveal"><span class="secret">${esc(sec.text)}</span>${sec.kind === 'enterprise' ? '<span class="muted">(your sign-in password for this network)</span>' : ''}</span>` : ''}</div>`;
    }).join('') : `<div class="empty">${list.length ? 'Nothing matches.' : 'No saved Wi-Fi networks.'}</div>`;
  }
  const keep = document.activeElement && document.activeElement.id === 'q';
  $('#main').innerHTML = `<div class="note">${S.tab === 'keyring' ? 'Passwords apps saved in your keyring (GNOME Keyring or KWallet).' : 'Wi-Fi networks this device remembers.'} Showing a password asks for your account password first. Nothing here leaves this device.</div>
    <div class="top2"><input class="inp f" id="q" data-osk="1" placeholder="Search" value="${esc(S.q)}"><span class="badge">${list ? list.length : ''}</span></div>
    <div class="scroll" style="flex:1"><div class="items">${rows}</div></div>`;
  const qi = $('#q'); qi.addEventListener('input', e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  if (keep) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  $$('[data-show]').forEach(b => b.onclick = () => reveal(b.dataset.show));
  $$('[data-hide]').forEach(b => b.onclick = () => { S.shown.delete(b.dataset.hide); render(); });
  $$('[data-copy]').forEach(b => b.onclick = () => { const s = S.shown.get(b.dataset.copy); H.copy(typeof s === 'string' ? s : s.text); });
  $$('[data-del]').forEach(b => b.onclick = () => remove(b.dataset.del));
}

async function reveal(key) {
  const pw = await H.askPassword(S.tab === 'keyring' ? 'To show this saved password, type your account password.' : 'To show this Wi-Fi password, type your account password.');
  if (!pw) return;
  try {
    if (S.tab === 'keyring') { const r = await H.job('keys.reveal', { item: key, password: pw }); S.shown.set(key, r.secret); }
    else {
      const r = await H.call('keys.wifiReveal', { uuid: key, password: pw });
      S.shown.set(key, { text: r.secret || (r.kind === 'open' ? '(an open network: no password)' : '(not saved on this device)'), kind: r.kind });
    }
    clearTimeout(hideTimer); hideTimer = setTimeout(() => { hideAll(); render(); }, 60000);
    render();
    $(`[data-copy="${CSS.escape(key)}"]`)?.focus();
  } catch (e) { H.fail(e); }
}
async function remove(key) {
  const name = S.tab === 'keyring' ? (S.items.find(i => i.path === key) || {}).label : (S.wifi.find(n => n.uuid === key) || {}).name;
  const ok = await H.confirm(S.tab === 'keyring' ? 'Delete this saved password?' : 'Forget this network?', `<p><b>${esc(name || '')}</b> ${S.tab === 'keyring' ? 'is deleted from your keyring. The app that saved it will ask for it again.' : 'is forgotten. You\'ll need its password to join again.'}</p>`, S.tab === 'keyring' ? 'Delete' : 'Forget', true);
  if (!ok) return;
  try {
    if (S.tab === 'keyring') { await H.call('keys.delete', { item: key }); S.items = S.items.filter(i => i.path !== key); }
    else { await H.call('keys.wifiForget', { uuid: key }); S.wifi = S.wifi.filter(n => n.uuid !== key); }
    S.shown.delete(key); render(); H.toast('Done');
  } catch (e) { H.fail(e); }
}

// ---------------------------------------------------------------- without the app: sample data (no real secrets)
H.demo.job = (n, a) => n === 'keys.list' ? { items: [
  { path: '/org/freedesktop/secrets/collection/login/1', label: 'Password for sam@example.com on accounts.example.com', app: 'org.gnome.Epiphany', keyring: 'Login', attributes: [['server', 'accounts.example.com'], ['username', 'sam']], modified: 1.76e9 },
  { path: '/org/freedesktop/secrets/collection/login/2', label: 'Chrome Safe Storage', app: 'chrome', keyring: 'Login', attributes: [], modified: 1.75e9 },
  { path: '/org/freedesktop/secrets/collection/login/3', label: 'Heroic: Epic Games', app: 'heroic', keyring: 'Login', attributes: [['account', 'sam']], modified: 1.74e9 }] } : { secret: 'example-only' };
H.demo.call = (m) => { if (m === 'keys.wifi') return { networks: [{ name: 'Home-5G', uuid: '0f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a5b', lastUsed: Date.now() / 1000 - 600 }, { name: 'Cafe', uuid: '1f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a5b', lastUsed: 1.74e9 }] }; throw 'This is a preview.'; };

render(); load();
</script>
</body>
</html>
