[package]
name = "hearth"
version = "0.6.54"
edition = "2021"
description = "Hearth: the controller-first game library and Game Mode for Hearth OS (Rust host)"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
hearth-core = { path = "../hearth-core" }
# The Open / Save dialogs go through the desktop portal (Hearth Files in Hearth OS: desktop/shell/hearth-portal), not GTK's own.
tauri-plugin-dialog = { version = "2.5", default-features = false, features = ["xdg-portal"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"   # a problem in one background job mustn't close Hearth

# Xbox Cloud Gaming needs WebKit's WebRTC, which is off unless asked for.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
