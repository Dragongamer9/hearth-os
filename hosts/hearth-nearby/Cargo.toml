[package]
name = "hearth-nearby"
version = "0.1.0"
edition = "2021"
description = "Nearby Share: Hearth OS's own way to send and receive files with devices on the same network, compatible with LocalSend"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_nearby"
path = "src/lib.rs"

[[bin]]
name = "hearth-nearby"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
# LocalSend's protocol v2: HTTPS with a self-signed certificate (rustls with ring), HTTP/1.1 only.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha2 = "0.10"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
