<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share</title>
<link rel="stylesheet" href="hearth.css">
<style>
main { display:grid; grid-template-columns:minmax(18em, 1.2fr) minmax(15em, 1fr); gap:var(--gut); }
.col { display:flex; flex-direction:column; gap:.8em; }
.hero h2 { font-size:1.25em; margin:0 0 .3em; }
.url { font-size:1.45em; font-weight:650; color:var(--flame); word-break:break-all; user-select:text; -webkit-user-select:text; }
.urls { color:var(--muted); font-size:.85em; margin-top:.3em; user-select:text; -webkit-user-select:text; }
.qr { background:#fff; border-radius:14px; padding:.6em; width:min(15em, 100%); aspect-ratio:1; display:grid; place-items:center; }
.qr svg { width:100%; height:100%; }
.live { display:flex; gap:.5em; align-items:center; }
.stat { display:flex; gap:1.4em; flex-wrap:wrap; color:var(--muted); font-size:.85em; margin-top:.5em; }
.stat b { color:var(--text); font-size:1.2em; }
.way { display:grid; grid-template-columns:2.4em 1fr; gap:.2em .9em; align-items:start; }
.way .ico { width:2.4em; height:2.4em; border-radius:10px; display:grid; place-items:center; background:var(--panel3); color:var(--ember); grid-row:span 2; }
.way .ico svg { width:1.4em; height:1.4em; }
.pin { display:flex; gap:.4em; margin:.4em 0; }
.pin span { width:2.2em; height:2.6em; border-radius:10px; background:var(--bg2); border:1px solid var(--line); display:grid; place-items:center; font-size:1.3em; font-weight:650; }
.pad { display:grid; grid-template-columns:repeat(5, 1fr); gap:.35em; max-width:18em; }
.pad button { padding:.5em 0; border-radius:10px; background:var(--panel3); border:1px solid var(--line); }
.devs { display:flex; flex-direction:column; gap:.4em; margin-top:.5em; }
.dev { display:flex; align-items:center; gap:.6em; justify-content:space-between; padding:.45em .7em; border-radius:10px; background:var(--panel2); }
ul.tips { margin:.3em 0 0; padding-left:1.2em; color:var(--muted); font-size:.85em; }
@media (max-width: 760px) { main { grid-template-columns:1fr; overflow:auto; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Share</h1>
    <div class="tabs" role="tablist">
      <button class="tab f" data-k="tab-web" data-act="tab" data-tab="web">Web browser</button>
      <button class="tab f" data-k="tab-moonlight" data-act="tab" data-tab="moonlight">Moonlight</button>
    </div>
    <span class="spacer"></span>
    <span class="sub" id="pill"></span>
  </header>
  <main id="main"></main>
  <footer><span><b>A</b>Choose</span><span><b>Y</b>Start / Stop sharing</span><span><b>LB</b><b>RB</b>Web browser / Moonlight</span></footer>
</div>
<div id="layer"></div>
<div id="toast"></div>
<script src="nav.js"></script>
<script>
'use strict';
const T = window.__TAURI__;
const invoke = T ? T.core.invoke : demoInvoke;
const $ = (s, el = document) => el.querySelector(s);
const { esc, toast, clock } = Nav;
const I = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};
const prefs = (() => { try { return JSON.parse(localStorage.getItem('hearth-share') || '{}'); } catch (e) { return {}; } })();
const S = { tab: prefs.tab === 'moonlight' ? 'moonlight' : 'web', opts: Object.assign({ height: 720, fps: 20, sound: true }, prefs.opts || {}), st: null, remote: null, busy: '', pin: '', drawn: '' };
function savePrefs() { try { localStorage.setItem('hearth-share', JSON.stringify({ tab: S.tab, opts: S.opts })); } catch (e) {} }
const sharing = () => S.st && S.st.sharing;
const chip = (k, label, on, act, extra = '') => `<button class="chip f ${on ? 'on' : ''}" data-k="${k}" data-act="${act}" ${extra}>${label}</button>`;

function webLeft() {
  const sh = sharing();
  if (sh) {
    return `<div class="col scroll"><section class="panel hero">
      <div class="live"><span class="dot rec"></span><b>Sharing this screen</b><span class="muted small" id="since">${clock(Date.now() - sh.started)}</span></div>
      <p class="muted" style="margin:.7em 0 .3em">On the TV, phone or computer, open this in its web browser:</p>
      <div class="url">${esc(sh.urls[0])}</div>
      ${sh.urls.length > 1 ? `<div class="urls">Or: ${sh.urls.slice(1).map(esc).join(' · ')}</div>` : ''}
      <div class="stat"><span><b>${sh.viewers}</b> watching</span>${sh.hasSound ? `<span><b>${sh.listeners}</b> listening</span>` : '<span>No sound</span>'}<span>${sh.options.height}p, ${sh.options.fps} pictures a second</span></div>
      ${sh.alive ? '' : '<div class="warn" style="color:var(--danger);margin-top:.6em">The screen capture stopped. Stop sharing and start again.</div>'}
      <div class="row" style="margin-top:1em"><button class="btn rec f" data-k="stop" data-act="stop" ${S.busy ? 'disabled' : ''}>Stop sharing</button></div>
      <ul class="tips"><li>Only devices on your own network can open it, and only with this link (it changes every time).</li><li>On the other device, use Full screen. Sound plays after you tap Sound on.</li></ul>
    </section></div>`;
  }
  const o = S.opts;
  return `<div class="col scroll"><section class="panel hero">
      <div class="way"><span class="ico">${I.globe}</span><h2>Show this screen in a web browser</h2>
      <div class="muted small">A TV's own browser, a phone, a tablet or another computer on the same Wi-Fi: nothing to install. Good for showing photos, videos and the desktop; for playing games on the TV, Moonlight is smoother.</div></div>
      <div class="field"><label>Picture</label><div class="chips">${[480, 720, 1080].map(h => chip('h-' + h, h + 'p' + (h === 480 ? '<small>Weak Wi-Fi</small>' : h === 720 ? '<small>Best for most</small>' : '<small>Sharp, needs good Wi-Fi</small>'), o.height === h, 'opt', `data-o="height" data-v="${h}"`)).join('')}</div></div>
      <div class="field"><label>Smoothness</label><div class="chips">${[10, 20, 30].map(f => chip('fps-' + f, f + ' a second', o.fps === f, 'opt', `data-o="fps" data-v="${f}"`)).join('')}</div></div>
      <div class="field"><label>Sound</label><div class="chips">${chip('snd', 'Send what\'s playing', o.sound, 'sound')}</div></div>
      <div class="row" style="margin-top:1em"><button class="btn primary f" data-k="start" data-act="web-start" ${S.busy ? 'disabled' : ''}>${S.busy === 'start' ? 'Starting…' : 'Start sharing'}</button></div>
    </section></div>`;
}
function webRight() {
  const sh = sharing();
  if (sh) return `<div class="col">${sh.qr ? `<section class="panel"><h3>Scan with a phone</h3><div class="qr">${sh.qr}</div></section>` : ''}</div>`;
  return `<div class="col scroll"><section class="panel"><h3>Other ways</h3>
    <div class="way" style="margin-top:.4em"><span class="ico">${I.moon}</span><b>Moonlight</b><div class="muted small">Low delay, with sound and the controller: the way to play on a TV. Android TV, Google TV, Fire TV, Apple TV, phones, PCs.</div></div>
    <div class="way" style="margin-top:.8em"><span class="ico">${I.tv}</span><b>Miracast and Chromecast</b><div class="muted small">Not yet. A Chromecast with Google TV can run Moonlight, which works better for games anyway.</div></div>
    <div class="row" style="margin-top:.8em"><button class="btn f" data-k="go-ml" data-act="tab" data-tab="moonlight">Set up Moonlight</button></div></section></div>`;
}

function moonLeft() {
  const r = S.remote;
  if (!r) return `<div class="col"><section class="panel">Looking at Remote play…</section></div>`;
  if (!r.installed) return `<div class="col scroll"><section class="panel hero"><div class="way"><span class="ico">${I.moon}</span><h2>Moonlight</h2><div class="muted small">Moonlight sharing uses Sunshine, which comes with Hearth OS. It isn't on this system.</div></div></section></div>`;
  const pinBoxes = [0, 1, 2, 3].map(i => `<span>${esc(S.pin[i] || '')}</span>`).join('');
  return `<div class="col scroll"><section class="panel hero">
    <div class="way"><span class="ico">${I.moon}</span><h2>Moonlight</h2>
    <div class="muted small">Hearth's Remote play (the same as Settings › Remote play). Moonlight shows this screen with its sound, smooth enough for games, and the other side can play.</div></div>
    <div class="row" style="margin-top:.9em"><span class="live"><span class="dot ${r.on ? 'good' : ''}"></span>${r.on ? 'On: Moonlight can find this PC' : 'Off'}</span>
      <button class="btn ${r.on ? '' : 'primary'} f" data-k="ml-on" data-act="ml-on" ${S.busy ? 'disabled' : ''}>${S.busy === 'ml-on' ? 'One moment…' : r.on ? 'Turn off' : 'Turn on'}</button></div>
    ${r.on ? `<div class="muted small" style="margin-top:.5em">Address: ${esc((r.addresses || []).join(', ') || '—')}</div>` : ''}
    ${r.needsLogin ? '<div class="warn">Sunshine wants its own username and password: sign in to it once in Hearth\'s Settings › Remote play.</div>' : ''}
  </section>
  ${r.on && !r.needsLogin ? `<section class="panel"><h3>Pair a device</h3><div class="muted small">In Moonlight, choose this PC: it shows 4 numbers. Type them here.</div>
    <div class="pin">${pinBoxes}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(d => `<button class="f" data-k="d-${d}" data-act="digit" data-v="${d}">${d}</button>`).join('')}</div>
    <div class="row" style="margin-top:.6em"><button class="btn f" data-k="pin-del" data-act="digit" data-v="del">Delete</button><button class="btn primary f" data-k="pair" data-act="pair" ${S.pin.length === 4 && !S.busy ? '' : 'disabled'}>Pair</button></div></section>` : ''}
  </div>`;
}
function moonRight() {
  const r = S.remote;
  const devs = r && r.clients || [];
  return `<div class="col scroll"><section class="panel"><h3>Paired devices</h3>${devs.length ? `<div class="devs">${devs.map((d, i) => `<div class="dev"><span>${esc(d.name || 'Device')}</span><button class="btn sm danger f" data-k="un-${i}" data-act="unpair" data-u="${esc(d.uuid)}" data-n="${esc(d.name)}">Remove</button></div>`).join('')}</div>` : '<div class="muted small">None yet.</div>'}</section>
    <section class="panel"><h3>Get Moonlight</h3><ul class="tips"><li>Android TV, Google TV, Fire TV, phones: Moonlight Game Streaming in the app store</li><li>Apple TV, iPhone, iPad: the App Store</li><li>LG and Samsung TVs: Moonlight TV (webOS / Tizen)</li><li>PCs and Macs: moonlight-stream.org</li></ul></section></div>`;
}

function render(force) {
  const html = S.tab === 'web' ? webLeft() + webRight() : moonLeft() + moonRight();
  const key = html.replace(/id="since">[^<]*/, '');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  $('#pill').innerHTML = sharing() ? '<span class="live"><span class="dot rec"></span>Sharing</span>' : esc(S.st ? S.st.sessionLabel : '');
  if (!force && key === S.drawn) { const s = $('#since'); if (s && sharing()) s.textContent = clock(Date.now() - sharing().started); return; }
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  $('#main').innerHTML = html; S.drawn = key;
  const again = focused && document.querySelector(`[data-k="${CSS.escape(focused)}"]`);
  if (again && !again.disabled) again.focus({ preventScroll: true });
  else if (focused && !$('#layer').firstChild) ($('#main .btn.primary:not([disabled]), #main .btn.rec:not([disabled])') || $('#main .f:not([disabled])') || $('.tab.on')).focus({ preventScroll: true });
}

async function refresh() { try { S.st = await invoke('status'); } catch (e) {} render(); }
async function loadRemote() { try { S.remote = await invoke('remote_status'); } catch (e) { S.remote = { installed: false }; } render(); }

async function act(el) {
  const a = el.dataset.act;
  if (a === 'tab') { S.tab = el.dataset.tab; savePrefs(); if (S.tab === 'moonlight') loadRemote(); render(true); return; }
  if (a === 'opt') { S.opts[el.dataset.o] = +el.dataset.v; savePrefs(); render(); return; }
  if (a === 'sound') { S.opts.sound = !S.opts.sound; savePrefs(); render(); return; }
  if (a === 'digit') { if (el.dataset.v === 'del') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += el.dataset.v; render(); return; }
  if (a === 'unpair') {
    if (!await Nav.ask('Remove this device?', `${el.dataset.n || 'It'} can't stream from this PC until it's paired again.`, 'Remove', true)) return;
    try { await invoke('remote_unpair', { uuid: el.dataset.u }); toast('Removed'); } catch (e) { toast(String(e), true); }
    return loadRemote();
  }
  if (S.busy) return;
  S.busy = a === 'web-start' ? 'start' : a; render();
  try {
    if (a === 'web-start') { S.st = await invoke('start', { options: S.opts }); }
    else if (a === 'stop') { S.st = await invoke('stop'); toast('Stopped sharing'); }
    else if (a === 'ml-on') { S.remote = await invoke('remote_on', { on: !(S.remote && S.remote.on) }); }
    else if (a === 'pair') { await invoke('remote_pair', { pin: S.pin, name: 'Moonlight' }); S.pin = ''; toast('Paired: it can stream from this PC now'); await loadRemote(); }
  } catch (e) { toast(String(e), true); }
  S.busy = ''; render(true);
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled && !e.target.closest('#layer')) act(el); });
document.addEventListener('keydown', e => { if (S.tab === 'moonlight' && /^[0-9]$/.test(e.key)) act({ dataset: { act: 'digit', v: e.key } }); });
Nav.init({
  y: () => { if (S.tab === 'web') act({ dataset: { act: sharing() ? 'stop' : 'web-start' } }); else act({ dataset: { act: 'ml-on' } }); },
  lb: () => act({ dataset: { act: 'tab', tab: 'web' } }), rb: () => act({ dataset: { act: 'tab', tab: 'moonlight' } }),
  back: () => { if (S.tab === 'moonlight' && S.pin) { S.pin = S.pin.slice(0, -1); render(); } },
});

(async () => {
  await refresh();
  if (S.tab === 'moonlight') loadRemote();
  render(true);
  ($('#main .btn.primary:not([disabled])') || $('.tab.on')).focus();
  setInterval(() => { if (document.visibilityState === 'visible' || sharing()) refresh(); }, 1500);
  setInterval(() => { if (S.tab === 'moonlight' && !S.busy) loadRemote(); }, 8000);
})();

// ---------------------------------------------------------------- opened in a browser (no app): a preview with samples
function demoInvoke(cmd, args) {
  const D = demoInvoke.d || (demoInvoke.d = { sharing: null, remote: { installed: true, on: false, clients: [{ name: 'Living room TV', uuid: 'a' }], needsLogin: false, addresses: ['192.168.1.20'] } });
  const st = () => ({ sharing: D.sharing, session: 'wayland', sessionLabel: 'Desktop Mode' });
  switch (cmd) {
    case 'status': return Promise.resolve(st());
    case 'start': D.sharing = { urls: ['http://192.168.1.20:47800/3fa9c2e1b04d/', 'http://10.0.0.7:47800/3fa9c2e1b04d/'], qr: '<svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg"><path d="M1 1h7v7H1zM13 1h7v7h-7zM1 13h7v7H1zM10 10h2v2h-2zM14 14h3v3h-3z"/></svg>', started: Date.now(), viewers: 1, listeners: 0, backend: 'wf-recorder', options: args.options, hasSound: true, alive: true }; return Promise.resolve(st());
    case 'stop': D.sharing = null; return Promise.resolve(st());
    case 'remote_status': return Promise.resolve(D.remote);
    case 'remote_on': D.remote.on = args.on; return Promise.resolve(D.remote);
    case 'remote_pair': return Promise.resolve(true);
    default: return Promise.reject('This is a preview: open Share to do that.');
  }
}
</script>
</body>
</html>
