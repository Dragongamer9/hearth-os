[package]
name = "hearth-theater"
version = "0.1.0"
edition = "2021"
description = "Hearth Theater: your own wall of video sites. Paste a link, get a tile; open it full screen and use it with a controller"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_theater"
path = "src/lib.rs"

[[bin]]
name = "hearth-theater"
path = "src/main.rs"

# Theater's windows are Chromium's (Hearth's Electron build runs electron/main.js); this is their core.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The viewer's controller pointer as real input: uinput (libc), or XTest on an X display (x11rb, no C library).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
