<!doctype html>
<!-- The viewer's hint bar (#bar) and messages (#toast), drawn in small views over the site (electron/main.js). -->
<html><head><meta charset="utf-8"><title>Hearth Theater</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 500 15px/1.3 system-ui, "Segoe UI", Cantarell, "Noto Sans", sans-serif; }
  .bar, .toast { position: fixed; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .25s; color: #f4ece3; border: 1px solid #4a372b; }
  .bar { bottom: 22px; display: flex; gap: 18px; flex-wrap: nowrap; justify-content: center; max-width: 96vw; padding: 12px 20px; border-radius: 16px;
    background: rgba(23,17,14,.94); box-shadow: 0 10px 30px rgba(0,0,0,.5); white-space: nowrap; }
  .bar span { color: #a69484; }
  .bar b { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-right: 6px; border-radius: 99px; background: #33271f; color: #f4ece3; font-size: 12px; }
  .bar .t { color: #ff8a3d; font-weight: 650; }
  .toast { top: 20px; padding: 9px 16px; border-radius: 12px; background: rgba(38,29,24,.96); }
  .on { opacity: 1; }
</style></head>
<body>
<div class="bar" id="bar"><span class="t">Hearth Theater</span><span><b>L</b>Pointer</span><span><b>A</b>Click</span><span><b>B</b>Back</span><span><b>R</b>Scroll</span>
  <span><b>X</b>Play/pause</span><span><b>Y</b>Full screen</span><span><b>◀▶</b>−/+ 10 s</span><span><b>RT</b>Keyboard</span><span><b>View</b>Theater</span></div>
<div class="toast" id="toast"></div>
<script>
  'use strict';
  const which = location.hash.slice(1) === 'toast' ? 'toast' : 'bar';
  const el = document.getElementById(which);
  let t = 0;
  window.show = text => {
    if (which === 'toast') el.textContent = text || '';
    el.classList.add('on');
    clearTimeout(t); t = setTimeout(() => el.classList.remove('on'), which === 'toast' ? 1700 : 5800);
  };
</script>
</body></html>
