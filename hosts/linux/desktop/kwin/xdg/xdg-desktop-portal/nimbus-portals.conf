# Portals for Mantel on KWin (1.14): screen sharing, screenshots and remote desktop through KDE's portal
# (xdg-desktop-portal-kde: wlroots' doesn't work under KWin); every Open / Save dialog is still Hearth Files. Read
# before /usr/share/xdg-desktop-portal/nimbus-portals.conf (labwc's: wlr) because nimbus-session puts this folder in
# XDG_CONFIG_DIRS only under KWin.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.FileChooser=hearth
