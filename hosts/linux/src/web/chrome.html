<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Hearth Browser</title>
<!--
  Hearth Browser's top bar: the tabs, back / forward / reload, the address bar (with suggestions), the
  bookmark star, downloads and the menu. When a menu is open the bar's page grows over the web page
  (it's see-through around the menus) and shrinks back when it closes.
-->
<style>
:root{--bg:#0f0b09;--bg2:#17110e;--panel:#1c1512;--panel2:#261d18;--panel3:#33271f;--line:#3b2e26;--text:#f4ece3;--muted:#a69484;--ember:#ff8a3d;--flame:#ffd166;--accent:#ff8a3d;--ink:#2a1206;--danger:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;color:var(--text);font:13px/1.3 system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{height:86px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
/* tabs */
.tabs{height:40px;display:flex;align-items:flex-end;gap:4px;padding:0 8px;background:var(--bg2);overflow:hidden}
.tab{height:34px;min-width:60px;max-width:220px;flex:1 1 220px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-radius:10px 10px 0 0;color:var(--muted);position:relative}
.tab:hover{background:var(--panel2);color:var(--text)}
.tab.on{background:var(--panel);color:var(--text)}
.tab .fav{width:16px;height:16px;flex:none;border-radius:3px}
.tab .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;opacity:.7}
.tab .x:hover{background:var(--panel3);opacity:1}
.tab .x svg{width:14px;height:14px}
.tab .snd svg{width:14px;height:14px;color:var(--flame)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--panel3);border-top-color:var(--accent);animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.newtab{width:32px;height:32px;margin-bottom:2px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--muted)}
.newtab:hover{background:var(--panel2);color:var(--text)}
/* toolbar */
.bar{flex:1;display:flex;align-items:center;gap:4px;padding:0 8px}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--panel2)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib.lit{color:var(--accent)}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:4px;background:var(--accent)}
.addr{flex:1;min-width:0;height:36px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;position:relative}
.addr.focus{border-color:var(--accent)}
.addr input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.addr input::placeholder{color:var(--muted)}
.addr .lock{color:var(--muted)}
.addr .lock svg{width:15px;height:15px}
.addr .zoom{color:var(--muted);font-size:12px;padding:2px 8px;border-radius:8px;background:var(--panel2)}
/* menus over the page */
.pop{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;display:none;z-index:5}
.pop.show{display:block}
.mi{width:100%;height:38px;border-radius:9px;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left}
.mi:hover,.mi.sel{background:var(--panel2)}
.mi small{margin-left:auto;color:var(--muted);font-size:12px}
.mi .fav{width:16px;height:16px;border-radius:3px}
.sep{height:1px;background:var(--line);margin:5px 4px}
.sug{left:0;right:0;top:40px}
.sug .mi .u{color:var(--muted);font-size:12px;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .mi .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.menu{right:8px;top:82px;width:280px}
.dls{right:52px;top:82px;width:360px;max-height:420px;overflow:auto}
.dl{padding:10px 12px;border-radius:9px}
.dl:hover{background:var(--panel2)}
.dl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dl small{color:var(--muted);font-size:12px}
.dl .pb{height:4px;border-radius:2px;background:var(--panel3);margin-top:6px}
.dl .pb i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ember),var(--flame))}
.dl .acts{display:flex;gap:6px;margin-top:6px}
.dl .acts button{color:var(--accent);font-size:12px}
.find{right:8px;top:82px;display:none;align-items:center;gap:6px;padding:6px 6px 6px 12px}
.find.show{display:flex}
.find input{width:220px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 8px;outline:0}
.find span{color:var(--muted);font-size:12px;min-width:46px;text-align:center}
.toast{position:absolute;left:50%;top:94px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:9px 16px;display:none;z-index:6}
.toast.show{display:block}
.cover{position:fixed;inset:86px 0 0 0;display:none}
.cover.show{display:block}
</style>
</head>
<body>
<div class="top">
  <div class="tabs"></div>
  <div class="bar">
    <button class="ib" data-act="back" title="Back (Alt+Left)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib" data-act="forward" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ib reload" data-act="reload" title="Reload (Ctrl+R)"></button>
    <button class="ib" data-act="home" title="Start page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
    <div class="addr"><span class="lock"></span><input spellcheck="false" placeholder="Search or type a web address"><span class="zoom" hidden></span>
      <button class="ib star" data-act="bookmark" title="Bookmark this page (Ctrl+D)" style="width:30px;height:30px"></button>
      <div class="pop sug"></div></div>
    <button class="ib dlb" data-act="downloads" title="Downloads (Ctrl+J)"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></button>
    <button class="ib" data-act="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</div>
<div class="cover"></div>
<div class="pop menu"></div>
<div class="pop dls"></div>
<div class="pop find"><input placeholder="Find on page"><span class="fc"></span>
  <button class="ib" data-act="findPrev" style="width:30px;height:30px"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
  <button class="ib" data-act="findNext" style="width:30px;height:30px"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="ib" data-act="findClose" style="width:30px;height:30px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="toast"></div>
<script>
'use strict';
// (Not named hb: the preload's window.hb can't be redeclared.)
const HB = window.hb || { act(){}, suggest: async()=>[], on(){} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SV = {
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  reload:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" style="fill:currentColor"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  vol:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>',
};
const S = {tabs:[], active:null, bookmarks:[], downloads:[], editing:false, sug:[], sel:-1, open:null, found:null};
const cur = () => S.tabs.find(t => t.id === S.active) || {};
const favicon = t => t.loading ? '<span class="spin"></span>' : t.favicon ? `<img class="fav" src="${esc(t.favicon)}" alt="" onerror="this.outerHTML='${SV.globe.replace(/"/g,'&quot;')}'">` : (t.url||'').startsWith('hearth:') ? '<img class="fav" src="hearth-logo.svg" alt="">' : SV.globe;

function renderTabs(){
  $('.tabs').innerHTML = S.tabs.map(t => `<div class="tab ${t.id===S.active?'on':''}" data-act="select" data-id="${t.id}" title="${esc(t.title)}" draggable="true">${favicon(t)}<span class="t">${esc(t.title)}</span>${t.audible||t.muted?`<button class="x snd" data-act="mute" data-id="${t.id}" title="${t.muted?'Unmute':'Mute'} this tab">${t.muted?SV.mute:SV.vol}</button>`:''}<button class="x" data-act="close" data-id="${t.id}" title="Close tab (Ctrl+W)">${SV.x}</button></div>`).join('')
    + `<button class="newtab" data-act="new" title="New tab (Ctrl+T)">${SV.plus}</button>`;
}
function renderBar(){
  const t = cur();
  document.querySelector('[data-act="back"]').disabled = !t.back;
  document.querySelector('[data-act="forward"]').disabled = !t.forward;
  $('.reload').innerHTML = t.loading ? SV.x : SV.reload;
  $('.reload').title = t.loading ? 'Stop' : 'Reload (Ctrl+R)';
  $('.star').innerHTML = t.bookmarked ? SV.starOn : SV.star;
  $('.star').classList.toggle('lit', !!t.bookmarked);
  $('.star').style.visibility = /^https?:/.test(t.url||'') ? '' : 'hidden';
  $('.lock').innerHTML = /^https:/.test(t.url||'') ? SV.lock : /^http:/.test(t.url||'') ? '<span style="color:var(--danger);font-size:11px">Not secure</span>' : SV.search;
  const z = $('.zoom'); z.hidden = !t.zoom || t.zoom === 100; z.textContent = (t.zoom||100) + '%';
  if(!S.editing) $('.addr input').value = (t.url||'').startsWith('hearth:') ? '' : (t.url || '');
  const busy = S.downloads.some(d => d.state === 'progressing');
  $('.dlb').innerHTML = $('.dlb').innerHTML.replace(/<span class="dot"><\/span>/, '') + (busy ? '<span class="dot"></span>' : '');
}

// ---------------------------------------------------------------- menus over the page
function openPop(name){
  closePops(false);
  S.open = name;
  HB.act({act:'expand', on:true});
  $('.cover').classList.add('show');
  if(name==='menu') renderMenu();
  if(name==='downloads') renderDownloads();
  document.querySelector('.' + (name==='downloads' ? 'dls' : name)).classList.add('show');
}
function closePops(shrink=true){
  document.querySelectorAll('.pop.show').forEach(p => { if(!p.classList.contains('find') || S.open!=='find-keep') p.classList.remove('show'); });
  $('.cover').classList.remove('show');
  S.open = null;
  if(shrink && !$('.find').classList.contains('show')) HB.act({act:'expand', on:false});
}
function renderMenu(){
  const t = cur();
  $('.menu').innerHTML = `
    <button class="mi" data-act="new">New tab<small>Ctrl+T</small></button>
    <button class="mi" data-act="newWindow">New window<small>Ctrl+N</small></button>
    <div class="sep"></div>
    <button class="mi" data-act="internal" data-page="bookmarks">Bookmarks</button>
    <button class="mi" data-act="internal" data-page="history">History<small>Ctrl+H</small></button>
    <button class="mi" data-act="downloads">Downloads<small>Ctrl+J</small></button>
    <div class="sep"></div>
    <div class="mi" style="cursor:default">Zoom<small style="display:flex;gap:4px;align-items:center"><button class="ib" data-act="zoom" data-v="-1" style="width:28px;height:28px">−</button>${t.zoom||100}%<button class="ib" data-act="zoom" data-v="1" style="width:28px;height:28px">+</button></small></div>
    <button class="mi" data-act="findOpen">Find on page<small>Ctrl+F</small></button>
    <button class="mi" data-act="print">Print…</button>
    <div class="sep"></div>
    ${S.bookmarks.slice(0,8).map(b=>`<button class="mi" data-act="open" data-url="${esc(b.url)}"><span class="t" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.title)}</span></button>`).join('')}
    ${S.bookmarks.length?'<div class="sep"></div>':''}
    <button class="mi" data-act="internal" data-page="settings">Settings</button>
    <button class="mi" data-act="quit">Quit</button>`;
}
const size = b => b > 1e9 ? (b/1e9).toFixed(1)+' GB' : b > 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(b/1e3))+' KB';
function renderDownloads(){
  $('.dls').innerHTML = S.downloads.length ? S.downloads.map(d => `<div class="dl"><b>${esc(d.name)}</b>
      <small>${d.state==='progressing'?`${size(d.got)}${d.total?' of '+size(d.total):''}`:d.state==='completed'?size(d.got):d.state==='cancelled'?'Cancelled':d.state==='interrupted'?'Stopped':d.state}</small>
      ${d.state==='progressing'&&d.total?`<div class="pb"><i style="width:${Math.round(d.got/d.total*100)}%"></i></div>`:''}
      <div class="acts">${d.state==='completed'?`<button data-act="downloadOpen" data-id="${d.id}">Open</button><button data-act="downloadShow" data-id="${d.id}">Show in folder</button>`:d.state==='progressing'?`<button data-act="downloadCancel" data-id="${d.id}">Cancel</button>`:''}</div></div>`).join('')
    : '<div class="dl"><small>Nothing downloaded yet. Downloads go to your Downloads folder.</small></div>';
}

// ---------------------------------------------------------------- the address bar
const input = $('.addr input');
input.addEventListener('focus', () => { S.editing = true; $('.addr').classList.add('focus'); input.select(); });
input.addEventListener('blur', () => { setTimeout(() => { S.editing = false; $('.addr').classList.remove('focus'); hideSug(); renderBar(); }, 120); });
input.addEventListener('input', async () => {
  const q = input.value; S.sel = -1;
  S.sug = q.trim() ? await HB.suggest(q) : [];
  if(input.value !== q) return;
  showSug();
});
input.addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); const s = S.sel>=0 ? S.sug[S.sel] : null; s ? HB.act({act:'open', url:s.url}) : HB.act({act:'go', text:input.value}); hideSug(); input.blur(); }
  else if(e.key==='Escape'){ e.preventDefault(); input.value = cur().url && !cur().url.startsWith('hearth:') ? cur().url : ''; hideSug(); HB.act({act:'focusPage'}); }
  else if(e.key==='ArrowDown' && S.sug.length){ e.preventDefault(); S.sel = Math.min(S.sug.length-1, S.sel+1); showSug(); }
  else if(e.key==='ArrowUp' && S.sug.length){ e.preventDefault(); S.sel = Math.max(-1, S.sel-1); showSug(); }
});
function showSug(){
  const p = $('.sug');
  if(!S.sug.length){ return hideSug(); }
  p.innerHTML = S.sug.map((s,i)=>`<button class="mi ${i===S.sel?'sel':''}" data-act="open" data-url="${esc(s.url)}">${s.bookmark?SV.starOn.replace('<svg','<svg style="color:var(--accent)"'):SV.globe}<span class="tt">${esc(s.title||s.url)}</span><span class="u">${esc(s.url.replace(/^https?:\/\/(www\.)?/,''))}</span></button>`).join('');
  p.classList.add('show'); HB.act({act:'expand', on:true});
}
function hideSug(){ const p=$('.sug'); if(p.classList.contains('show')){ p.classList.remove('show'); if(!S.open && !$('.find').classList.contains('show')) HB.act({act:'expand', on:false}); } }

// ---------------------------------------------------------------- find on page
const findIn = $('.find input');
function openFind(){ closePops(false); $('.find').classList.add('show'); HB.act({act:'expand', on:true}); findIn.focus(); findIn.select(); }
function closeFind(){ $('.find').classList.remove('show'); $('.fc').textContent=''; HB.act({act:'find', text:''}); HB.act({act:'expand', on:false}); HB.act({act:'focusPage'}); }
findIn.addEventListener('input', () => HB.act({act:'find', text:findIn.value}));
findIn.addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); HB.act({act:'find', text:findIn.value, next:true, forward:!e.shiftKey}); }
  if(e.key==='Escape'){ e.preventDefault(); closeFind(); }
});

// ---------------------------------------------------------------- clicks
document.addEventListener('mousedown', e => { if(e.button===1){ const t=e.target.closest('.tab'); if(t){ e.preventDefault(); HB.act({act:'close', id:+t.dataset.id}); } } });
document.addEventListener('click', e => {
  if(e.target.classList.contains('cover')) return closePops();
  const el = e.target.closest('[data-act]'); if(!el) return;
  const d = el.dataset;
  e.stopPropagation();
  switch(d.act){
    case 'select': return HB.act({act:'select', id:+d.id});
    case 'close': return HB.act({act:'close', id:+d.id});
    case 'mute': return HB.act({act:'select', id:+d.id}), HB.act({act:'mute'});
    case 'menu': return S.open==='menu' ? closePops() : openPop('menu');
    case 'downloads': return S.open==='downloads' ? closePops() : openPop('downloads');
    case 'findOpen': return openFind();
    case 'findNext': return HB.act({act:'find', text:findIn.value, next:true});
    case 'findPrev': return HB.act({act:'find', text:findIn.value, next:true, forward:false});
    case 'findClose': return closeFind();
    case 'zoom': HB.act({act:'zoom', v:+d.v}); return;
    case 'open': closePops(); hideSug(); return HB.act({act:'open', url:d.url});
    case 'internal': closePops(); return HB.act({act:'internal', page:d.page});
    case 'downloadOpen': case 'downloadShow': case 'downloadCancel': return HB.act({act:d.act, id:+d.id});
    default: if(!['zoom'].includes(d.act)) closePops(); return HB.act({act:d.act});
  }
});
// Drag a tab to move it.
let dragId = null;
document.addEventListener('dragstart', e => { const t=e.target.closest('.tab'); if(t){ dragId=+t.dataset.id; e.dataTransfer.effectAllowed='move'; } });
document.addEventListener('dragover', e => { if(dragId) e.preventDefault(); });
document.addEventListener('drop', e => { const t=e.target.closest('.tab'); if(dragId && t){ e.preventDefault(); const to=S.tabs.findIndex(x=>x.id===+t.dataset.id); HB.act({act:'move', id:dragId, to}); } dragId=null; });
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && S.open){ e.preventDefault(); closePops(); HB.act({act:'focusPage'}); }
});
let toastT;
function toast(text){ const t=$('.toast'); t.textContent=text; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 3500); }

// ---------------------------------------------------------------- from the browser
HB.on(({name, data}) => {
  if(name==='tabs'){ S.tabs=data.tabs; S.active=data.active; S.bookmarks=data.bookmarks||S.bookmarks; S.downloads=data.downloads||S.downloads; renderTabs(); renderBar(); }
  else if(name==='tab'){ const i=S.tabs.findIndex(t=>t.id===data.id); if(i>=0) S.tabs[i]=data; renderTabs(); if(data.id===S.active) renderBar(); }
  else if(name==='downloads'){ const was=S.downloads.length; S.downloads=data; renderBar(); if(S.open==='downloads') renderDownloads(); else if(data.length>was) toast('Downloading ' + data[0].name); }
  else if(name==='focusAddress'){ input.focus(); input.select(); }
  else if(name==='find') openFind();
  else if(name==='found') $('.fc').textContent = data.matches ? `${data.at}/${data.matches}` : 'No matches';
  else if(name==='openDownloads') openPop('downloads');
  else if(name==='error') toast(data.text);
});
renderTabs(); renderBar();
</script>
</body>
</html>
