<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hearth TV pointer</title>
<!-- The see-through layer over a website in Theater's viewer (ViewerActivity.kt): the remote's pointer, its hint and
     its menu (pointer.js). Sizes are in vh so it looks the same on any TV. Nothing moves while the pointer stands still. -->
<style>
  :root { --acc: #66c0f4; --panel: #1e2633; --text: #dce5ed; --font: Inter, 'Noto Sans', Roboto, sans-serif; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #hp-root { position: fixed; inset: 0; pointer-events: none; font-family: var(--font); color: var(--text); }
  #hp-ptr { position: absolute; left: 0; top: 0; width: 3.9vh; height: 3.9vh; will-change: transform;
    filter: drop-shadow(0 .25vh .45vh rgba(0,0,0,.6)) drop-shadow(0 0 .12vh rgba(0,0,0,.5)); }
  #hp-ptr svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #hp-ptr path { fill: var(--acc); stroke: #fff; stroke-width: 1.7; stroke-linejoin: round; }
  #hp-ring { position: absolute; width: 0; height: 0; opacity: 0; }
  #hp-ring.go { animation: hp-ring .38s ease-out 1; }
  #hp-ring.go::after { content: ''; position: absolute; left: -2.4vh; top: -2.4vh; width: 4.8vh; height: 4.8vh; border-radius: 50%;
    border: .4vh solid var(--acc); box-shadow: 0 0 0 .18vh rgba(255,255,255,.85); box-sizing: border-box; }
  @keyframes hp-ring { from { opacity: 1; transform: scale(.4); } to { opacity: 0; transform: scale(1.3); } }
  #hp-hint { position: absolute; left: 50%; bottom: 4.4vh; transform: translateX(-50%); display: flex; align-items: center; gap: 2.2vh;
    padding: 1.4vh 2.6vh; border-radius: 1.2vh; background: var(--panel); background: color-mix(in srgb, var(--panel) 92%, transparent);
    box-shadow: 0 .6vh 2.4vh rgba(0,0,0,.45); border: .1vh solid rgba(255,255,255,.08); font-size: 1.75vh; white-space: nowrap;
    opacity: 0; transition: opacity .35s; }
  #hp-hint.on { opacity: 1; }
  #hp-hint .t { font-size: 1.95vh; color: var(--acc); }
  #hp-hint .k { display: inline-flex; align-items: center; gap: .8vh; }
  #hp-hint .kb { min-width: 2.8vh; height: 2.8vh; padding: 0 .7vh; box-sizing: border-box; border-radius: 1.4vh; border: .18vh solid rgba(255,255,255,.55);
    display: inline-flex; align-items: center; justify-content: center; font-size: 1.2vh; font-weight: 700; }
  #hp-hint .soft { opacity: .72; }
  #hp-menu { position: absolute; display: none; flex-direction: column; gap: .6vh; width: 48vh; padding: 2vh; box-sizing: border-box;
    border-radius: 1.2vh; background: var(--panel); box-shadow: 0 1vh 4vh rgba(0,0,0,.55); border: .1vh solid rgba(255,255,255,.08); }
  #hp-menu.on { display: flex; }
  #hp-menu .mt { font-size: 1.5vh; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .7; padding: 0 1.4vh .6vh; }
  #hp-menu .mi { display: flex; flex-direction: column; gap: .4vh; padding: 1.3vh 1.4vh; border-radius: .8vh; }
  #hp-menu .mi b { font-size: 2.1vh; }
  #hp-menu .mi i { font-style: normal; font-size: 1.55vh; opacity: .72; }
  #hp-menu .mi.on { background: rgba(255,255,255,.1); background: color-mix(in srgb, var(--acc) 22%, transparent); box-shadow: inset 0 0 0 .3vh var(--acc); }
  #hp-menu .mf { font-size: 1.45vh; opacity: .6; padding: .8vh 1.4vh 0; }
</style>
</head>
<body>
<div id="hp-root">
  <div id="hp-ring"></div>
  <div id="hp-ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 2 L3 19.2 L7.6 15 L10.7 21.8 L13.6 20.5 L10.6 13.9 L16.8 13.9 Z"/></svg></div>
  <div id="hp-menu" role="menu" aria-label="At the pointer"></div>
  <div id="hp-hint" role="status"></div>
</div>
<script src="pointer.js"></script>
</body>
</html>
