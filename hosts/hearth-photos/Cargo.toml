[package]
name = "hearth-photos"
version = "0.1.0"
edition = "2021"
description = "Hearth Photos: Hearth OS's own picture viewer and editor, for Linux (Mantel; Windows/Ember later)"
license = "GPL-3.0-or-later"

# Everything that doesn't need a window (the folder's pictures, turning pictures without losing quality, thumbnails,
# camera details, saving edits) is a library, so the tests can check it without opening the app.
[lib]
name = "hearth_photos"
path = "src/lib.rs"

[[bin]]
name = "hearth-photos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The Open / Save dialogs go through the desktop portal (Hearth Files in Hearth OS: desktop/shell/hearth-portal), not GTK's own.
tauri-plugin-dialog = { version = "2.5", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
percent-encoding = "2"
kamadak-exif = "0.6"
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
