<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disks</title>
<link rel="stylesheet" href="osk/hearth-osk.css">
<style>
/* Hearth's dark blue look (Settings › Appearance's Steam-style dark); the look Hearth's apps get from
   ~/.config/hearth/theme.css (hearth-apptheme) replaces these. */
:root {
  --bg:#171d25; --bg2:#1b2838; --panel:#1c2b3c; --panel2:#213347; --panel3:#2a475e; --line:#2f4a63;
  --text:#e6eef5; --muted:#9fb2c3; --faint:#5d7488; --ember:#66c0f4; --flame:#66c0f4; --danger:#ff6b5e; --good:#7fe0a4;
  --ink:#06121c; --r:10px; --gut:clamp(14px,2.4vw,36px); --ease:cubic-bezier(.2,.8,.2,1);
  /* Disk Management's own: the darkest bars, the accent, and the stripes (the same in every look). */
  --deep:color-mix(in srgb, var(--bg) 62%, #000); --acc:var(--flame, #66c0f4); --warnbg:#3a3326; --gold:#f2c14e; --green:#7ccf8a; --blue:#5b9bd5; --none:#0b1016;
  --redbg:#3a2226; --redline:#6b3a40; --redtext:#ffb4a8;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); }
body { font:400 clamp(15px, .5vw + 9px, 24px)/1.35 var(--font, Inter, system-ui, "Segoe UI", Cantarell, "Noto Sans", sans-serif); overflow:hidden; user-select:none; -webkit-user-select:none; }
button, input { font:inherit; color:inherit; }
.app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
.scroll { overflow:auto; min-height:0; scrollbar-width:thin; scrollbar-color:var(--panel3) transparent; }

/* Focus: one clear ring, the same for mouse, keyboard, controller and touch. */
.f { outline:none; cursor:pointer; }
.f:focus-visible, .f.focus, body.pad .f:focus { box-shadow:0 0 0 2px var(--acc), 0 0 14px color-mix(in srgb, var(--acc) 40%, transparent); }
.f[aria-disabled="true"], .f:disabled { cursor:default; }

/* ---------------------------------------------------------------- the menu bar */
.mb { display:flex; align-items:center; gap:2px; padding:0 .6em; height:2.45em; background:var(--bg2); border-bottom:1px solid var(--line); }
.mb button { all:unset; display:flex; align-items:center; gap:.45em; padding:.38em .77em; border-radius:5px; cursor:pointer; white-space:nowrap; }
.mb button:hover, .mb button.open { background:color-mix(in srgb, var(--panel3) 70%, transparent); }
.mb button:focus-visible, body.pad .mb button:focus { box-shadow:0 0 0 2px var(--acc); }
.mb svg { width:1.08em; height:1.08em; }
.mb .sep { width:1px; height:1.4em; background:var(--line); margin:0 .6em; }
.mb .sp { flex:1; }
.mb .note { font-size:.92em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mb [hidden] { display:none; }

/* ---------------------------------------------------------------- the volume list */
main.dm { display:grid; grid-template-rows:minmax(8em, 35%) 1fr; min-height:0; }
main.dm[hidden] { display:none; }
.vl { display:flex; flex-direction:column; min-height:0; border-bottom:4px solid var(--deep); }
.cols, .vrow.cols { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr); gap:.6em; align-items:center; }
.vh { padding:.54em 1.08em; font-size:.92em; color:var(--muted); background:var(--bg2); border-bottom:1px solid var(--line); }
.vh span:nth-child(n+6), .vrow > span:nth-child(n+6) { text-align:right; }
.vrow { all:unset; box-sizing:border-box; display:grid; width:100%; padding:.46em 1.08em; cursor:pointer; }
.vrow > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vrow .dim { color:var(--muted); }
.vrow:hover { background:color-mix(in srgb, var(--panel3) 35%, transparent); }
.vrow.sel { background:var(--panel3); }
.vrow .nm { display:flex; align-items:center; gap:.6em; }
.vrow .low { color:var(--gold); font-weight:600; }
.fullbar { display:flex; gap:.7em; align-items:flex-start; margin:.5em 1.08em; padding:.65em .9em; border-radius:8px; background:var(--warnbg); color:var(--gold); line-height:1.4; }
.fullbar b { color:color-mix(in srgb, var(--gold) 85%, #fff); }
.fullbar[hidden] { display:none; }
.sw { width:.92em; height:.92em; border-radius:3px; flex:none; display:inline-block; }
.s-gold { background:var(--gold); } .s-green { background:var(--green); } .s-blue { background:var(--blue); } .s-none { background:var(--none); border:1px solid var(--faint); } .s-grey { background:var(--faint); }

/* ---------------------------------------------------------------- the disk map */
.map { display:flex; flex-direction:column; min-height:0; }
.disks { flex:1; padding:.92em 1.08em; display:flex; flex-direction:column; gap:.77em; }
.drow { display:flex; min-height:7.4em; gap:4px; flex:none; }
.dlab { all:unset; box-sizing:border-box; width:14.6em; flex:none; padding:.77em .92em; border-radius:8px; background:var(--panel2); border:1px solid var(--line); display:flex; flex-direction:column; gap:.23em; cursor:pointer; }
.dlab.sel { border-color:var(--acc); background:repeating-linear-gradient(135deg, var(--panel3) 0 6px, color-mix(in srgb, var(--panel3) 85%, var(--bg)) 6px 12px); }
.dlab .t { display:flex; align-items:center; gap:.6em; font-weight:600; }
.dlab .t svg { width:1.23em; height:1.23em; color:var(--acc); flex:none; }
.dlab .k { font-size:.92em; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dlab .z { font-size:.92em; }
.dlab .h { display:flex; align-items:center; gap:.45em; font-size:.92em; }
.hd { width:.55em; height:.55em; border-radius:50%; flex:none; background:currentColor; }
.h-good { color:var(--good); } .h-warn { color:var(--gold); } .h-bad { color:var(--danger); } .h-unknown { color:var(--muted); }
.parts { flex:1; display:flex; gap:4px; min-width:0; }
.blk { all:unset; box-sizing:border-box; min-width:6.5em; display:flex; flex-direction:column; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--panel); cursor:pointer; }
.blk.free { background:color-mix(in srgb, var(--bg) 80%, #000); }
.blk.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); background:repeating-linear-gradient(135deg, var(--panel3) 0 6px, color-mix(in srgb, var(--panel3) 85%, var(--bg)) 6px 12px); }
.blk .st { height:.77em; flex:none; }
.blk .bd { flex:1; padding:.54em .77em; display:flex; flex-direction:column; gap:.15em; min-width:0; }
.blk b { font-weight:600; }
.blk b, .blk .l2, .blk .l3 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.blk .l2 { font-size:.92em; } .blk .l3 { font-size:.92em; color:var(--muted); }
.blk:hover:not(.sel) { border-color:color-mix(in srgb, var(--acc) 45%, var(--line)); }
.legend { display:flex; align-items:center; gap:1.38em; padding:.4em 1.08em .7em; font-size:.92em; color:var(--muted); flex-wrap:wrap; }
.legend span { display:flex; align-items:center; gap:.45em; }
.legend .sp { flex:1; }
.empty { color:var(--muted); padding:2em 1em; text-align:center; }

/* ---------------------------------------------------------------- the status bar */
.sb { display:flex; align-items:center; gap:1.2em; height:2.15em; padding:0 1.08em; font-size:.92em; color:var(--muted); background:var(--bg2); border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; }
.sb .sp { flex:1; }
.sb > span { overflow:hidden; text-overflow:ellipsis; }

/* ---------------------------------------------------------------- menus (right-click, X, the menu bar) */
#menu:empty { display:none; }
.menu { position:fixed; z-index:20; min-width:16em; max-width:24em; padding:6px; border-radius:10px; background:color-mix(in srgb, var(--panel2) 85%, var(--bg)); border:1px solid color-mix(in srgb, var(--line) 70%, var(--acc)); box-shadow:0 14px 40px rgba(0,0,0,.55); display:flex; flex-direction:column; gap:1px; }
.menu .note { display:flex; gap:.6em; padding:.6em .77em; margin-bottom:4px; border-radius:6px; background:var(--warnbg); color:var(--gold); font-size:.92em; line-height:1.4; }
.menu .note svg { flex:none; width:1.08em; height:1.08em; margin-top:.1em; }
.menu .msep { height:1px; margin:5px 8px; background:var(--line); }
.mi { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:.77em; padding:.54em .77em; border-radius:6px; cursor:pointer; }
.mi svg { width:1.15em; height:1.15em; flex:none; }
.mi .lb { flex:1; }
.mi .ky { font-size:.85em; color:var(--muted); }
.mi:hover:not(.off), .mi:focus { background:var(--panel3); }
.mi:focus-visible, body.pad .mi:focus { box-shadow:inset 0 0 0 2px var(--acc); }
.mi.off { color:var(--faint); cursor:default; }
.mi.red { color:#ff9c8f; }

/* ---------------------------------------------------------------- windows (dialogs) */
.veil { position:fixed; inset:0; background:rgba(5,8,12,.66); display:grid; place-items:center; padding:var(--gut); z-index:10; }
.dlg { width:min(44em, 100%); max-height:100%; overflow:auto; background:var(--bg); border:1px solid var(--deep); border-radius:10px; padding:1.1em 1.3em; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.dlg h2 { margin:0 0 .6em; font-size:1.2em; }
.dlg.win { padding:0; display:flex; flex-direction:column; overflow:hidden; }
.dlg.win.w-s { width:min(40em, 100%); } .dlg.win.w-m { width:min(43em, 100%); } .dlg.win.w-l { width:min(49em, 100%); }
.wt { height:2.9em; flex:none; display:flex; align-items:center; padding-left:1.23em; background:var(--deep); }
.wt span { flex:1; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wt button { all:unset; align-self:stretch; width:3.5em; display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; }
.wt button svg { width:.77em; height:.77em; }
.wt button:hover { background:#c42b1c; color:#fff; }
.wh { padding:1.23em 1.7em; background:var(--bg2); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:.77em; }
.wh .big { font-size:1.23em; font-weight:600; margin:0; }
.wh .sub { color:var(--muted); margin-top:.15em; }
.wb { flex:1; min-height:0; overflow:auto; padding:1.38em 1.54em; display:flex; flex-direction:column; gap:1.08em; }
.wf { display:flex; justify-content:flex-end; gap:.6em; padding:.92em 1.23em; background:var(--bg2); border-top:1px solid var(--line); flex-wrap:wrap; }
.wf.split { justify-content:space-between; }
.b { all:unset; box-sizing:border-box; padding:.6em 1.38em; border-radius:6px; border:1px solid var(--line); cursor:pointer; text-align:center; white-space:nowrap; }
.b.pri { background:var(--acc); color:var(--ink); border-color:transparent; font-weight:600; }
.b.red { background:#c4473c; color:#fff; border-color:transparent; font-weight:600; }
.b[aria-disabled="true"] { background:var(--redbg); color:#9c7a76; border-color:transparent; cursor:default; }
.b.pri[aria-disabled="true"] { background:color-mix(in srgb, var(--acc) 30%, var(--bg)); color:color-mix(in srgb, var(--ink) 50%, var(--muted)); }
.b:focus-visible, body.pad .b:focus { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
.grid { display:grid; grid-template-columns:11.5em minmax(0,1fr); align-items:center; gap:.92em 1.23em; }
.grid > .lab { color:var(--muted); }
.grid .hint { font-size:.92em; color:var(--muted); line-height:1.5; }
.inp { all:unset; box-sizing:border-box; padding:.6em .92em; border-radius:6px; background:var(--deep); border:1px solid var(--line); width:100%; user-select:text; -webkit-user-select:text; }
.inp:focus { border-color:var(--acc); }
.inp.num { text-align:right; font-variant-numeric:tabular-nums; }
.pick { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:.77em; padding:.6em .92em; border-radius:6px; background:var(--deep); border:1px solid var(--line); cursor:pointer; }
.pick .v { flex:1; } .pick .v small { color:var(--muted); font-size:1em; }
.pick .ar { color:var(--muted); font-size:.85em; letter-spacing:.2em; }
.pick:focus-visible, body.pad .pick:focus { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
.pick[aria-disabled="true"] { color:var(--muted); cursor:default; }
.cb { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:.77em; cursor:pointer; padding:.15em 0; border-radius:4px; }
.cb .bx { width:1.38em; height:1.38em; border-radius:4px; border:1px solid var(--faint); flex:none; display:flex; align-items:center; justify-content:center; }
.cb[aria-checked="true"] .bx { background:var(--acc); border-color:var(--acc); }
.cb .bx svg { width:.92em; height:.92em; display:none; }
.cb[aria-checked="true"] .bx svg { display:block; }
.cb .dim { color:var(--muted); }
.cb[aria-disabled="true"] { color:var(--faint); cursor:default; }
.cb:focus-visible, body.pad .cb:focus { box-shadow:0 0 0 2px var(--acc); }
.info { display:flex; gap:.6em; align-items:flex-start; padding:.77em .92em; border-radius:8px; background:color-mix(in srgb, var(--bg2) 75%, var(--panel3)); border:1px solid var(--line); line-height:1.5; }
.info svg { flex:none; width:1.23em; height:1.23em; color:var(--acc); margin-top:.1em; }
.info.warn { background:var(--warnbg); border-color:color-mix(in srgb, var(--gold) 30%, var(--warnbg)); color:color-mix(in srgb, var(--gold) 80%, var(--text)); }
.info.warn svg { color:var(--gold); }
.danger { display:flex; flex-direction:column; gap:.6em; padding:.92em 1.08em; border-radius:8px; background:var(--redbg); border:1px solid var(--redline); }
.danger .hd2 { display:flex; align-items:center; gap:.6em; color:var(--redtext); font-weight:600; }
.danger .hd2 svg { width:1.23em; height:1.23em; flex:none; }
.danger .tx { line-height:1.5; color:#f1d4cf; }
.danger ul { margin:0; padding-left:1.2em; color:#f1d4cf; line-height:1.5; }
.small { font-size:.92em; color:var(--muted); line-height:1.5; }
.steps2 { display:flex; align-items:center; gap:.6em; font-size:.92em; flex-wrap:wrap; }
.steps2 span.s { padding:.23em .77em; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
.steps2 span.s.done { background:color-mix(in srgb, var(--acc) 18%, var(--bg)); border-color:transparent; color:color-mix(in srgb, var(--acc) 70%, #fff); }
.steps2 span.s.on { background:var(--acc); color:var(--ink); font-weight:600; border-color:transparent; }
.steps2 .gt { color:var(--faint); }
.rows { display:grid; grid-template-columns:minmax(0,1fr) 11.5em; align-items:center; gap:.77em 1.08em; }
.rows .r { text-align:right; font-variant-numeric:tabular-nums; }
.rows .lab { color:var(--muted); }
.rows .strong { color:var(--text); font-weight:500; }
.slider { display:flex; flex-direction:column; gap:.45em; }
.slider input[type=range] { width:100%; accent-color:var(--acc); margin:0; height:1.6em; }
.slider .ticks { display:flex; justify-content:space-between; font-size:.92em; color:var(--muted); }
.mini { display:flex; height:4.15em; gap:3px; }
.mini > div { border-radius:6px; overflow:hidden; border:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-width:4.5em; }
.mini > div.new { border:1px dashed var(--acc); background:repeating-linear-gradient(135deg, var(--deep) 0 6px, color-mix(in srgb, var(--deep) 70%, var(--panel)) 6px 12px); }
.mini > div > i { height:.6em; flex:none; }
.mini > div > span { padding:.45em .77em; display:flex; flex-direction:column; min-width:0; }
.mini b { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .mini small { font-size:.92em; color:var(--muted); white-space:nowrap; }
.ptabs { display:flex; gap:4px; padding:.77em 1.23em 0; background:var(--bg2); border-bottom:1px solid var(--line); }
.ptab { all:unset; padding:.6em 1.08em; color:var(--muted); cursor:pointer; border-radius:6px 6px 0 0; border:1px solid transparent; margin-bottom:-1px; }
.ptab.on { background:var(--bg); border-color:var(--line); border-bottom-color:var(--bg); color:var(--text); font-weight:600; }
.ptab:focus-visible, body.pad .ptab:focus { box-shadow:inset 0 0 0 2px var(--acc); }
.hstat { display:flex; align-items:center; gap:1.23em; }
.hstat .ring { width:4.9em; height:4.9em; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
.hstat .ring svg { width:2.3em; height:2.3em; }
.hstat b { font-size:1.38em; font-weight:600; }
.ring.h-good { background:#1f4a32; } .ring.h-warn { background:var(--warnbg); } .ring.h-bad { background:var(--redbg); } .ring.h-unknown { background:var(--panel2); }
.tiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.77em; }
.tile { padding:.92em; border-radius:8px; background:var(--panel2); border:1px solid var(--line); display:flex; flex-direction:column; gap:.3em; }
.tile .k { font-size:.92em; color:var(--muted); } .tile b { font-size:1.54em; font-weight:600; } .tile .s { font-size:.92em; }
.cap { font-size:.85em; font-weight:600; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
.srow { display:grid; grid-template-columns:minmax(0,1fr) 9.2em 6.9em; align-items:center; padding:.54em .77em; border-radius:6px; }
.srow:nth-child(odd) { background:var(--panel); }
.srow .v { color:var(--muted); }
.srow .ok { display:flex; align-items:center; gap:.45em; }
.kv { display:grid; grid-template-columns:11em minmax(0,1fr); gap:.5em 1em; }
.kv dt { color:var(--muted); } .kv dd { margin:0; overflow-wrap:anywhere; user-select:text; -webkit-user-select:text; }
.btnrow { display:flex; gap:.6em; flex-wrap:wrap; }
.prog { height:.6em; border-radius:9px; background:var(--panel3); overflow:hidden; margin:.8em 0 .3em; }
.prog i { display:block; height:100%; width:30%; background:var(--acc); border-radius:9px; }
.prog.spin i { animation:slide 1.3s var(--ease) infinite; }
@keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(340%); } }
.msg { color:var(--muted); }
.ok { color:var(--good); } .bad { color:var(--danger); }
.osk { display:grid; grid-template-columns:repeat(10, 1fr); gap:.3em; margin-top:.5em; }
.osk button { padding:.45em 0; border-radius:6px; background:var(--panel3); border:1px solid var(--line); }
.osk .wide { grid-column:span 2; }
@media (max-width: 900px) { .cols > :nth-child(2), .cols > :nth-child(3) { display:none; } .cols, .vrow.cols { grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr); } .dlab { width:10em; } .mb .note { display:none; } }

/* ---------------------------------------------------------------- Make a bootable USB (its own screen) */
.btn { padding:.55em 1em; border-radius:min(8px, var(--corner, 8px)); background:var(--panel2); border:1px solid var(--line); min-height:2.6em; }
.btn.danger { color:color-mix(in srgb, var(--text) 56%, var(--danger)); border-color:color-mix(in srgb, var(--bg2) 71%, var(--danger)); background:color-mix(in srgb, var(--danger) 11%, var(--bg)); }
.btn.primary { background:var(--ember); color:var(--ink); border-color:transparent; font-weight:650; }
.btn.primary.danger { background:var(--danger); color:color-mix(in srgb, var(--danger) 14%, var(--bg)); }
.btn[disabled] { opacity:.45; pointer-events:none; }
.f.btn:focus, .f.card:focus, .f.tab:focus, .f.chip:focus, .f.toggle:focus, .f.dcard:focus, .f.hold:focus, .usb .inp:focus { box-shadow:0 0 0 3px var(--ember), 0 0 22px color-mix(in srgb, var(--ember) 35%, transparent); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:.8em 1em; }
.panel h3 { margin:0 0 .4em; font-size:1em; }
.acts { display:flex; flex-wrap:wrap; gap:.5em; }
.row { display:flex; gap:.6em; justify-content:flex-end; margin-top:1em; flex-wrap:wrap; }
.field { margin:.8em 0; }
.field > label { display:block; color:var(--muted); font-size:.85em; margin-bottom:.35em; }
.chips { display:flex; flex-wrap:wrap; gap:.5em; }
.chip { padding:.5em .9em; border-radius:min(8px, var(--corner, 8px)); background:var(--panel2); border:1px solid var(--line); text-align:left; max-width:100%; }
.chip small { display:block; color:var(--muted); font-size:.75em; }
.chip.on { border-color:var(--ember); background:color-mix(in srgb, var(--bg2) 85%, var(--ember)); }
.usb .inp { all:revert; font:inherit; color:inherit; width:100%; padding:.6em .8em; border-radius:8px; border:1px solid var(--line); background:var(--bg2); box-sizing:border-box; outline:none; }
.lose { margin:.7em 0; padding:.7em .9em; border-radius:8px; background:var(--redbg); border:1px solid var(--redline); }
.lose b { color:var(--redtext); }
.lose ul { margin:.35em 0 0; padding-left:1.2em; }
.refuse { padding:.8em 1em; border-radius:8px; background:var(--panel2); border:1px solid var(--line); }
.dlg .warn { margin:.4em 0; color:var(--gold); font-size:.9em; }
.range { width:100%; accent-color:var(--ember); }
/* ---------------------------------------------------------------- Make a bootable USB */
.usb { display:flex; flex-direction:column; gap:.7em; padding:.8em var(--gut) .6em; min-height:0; }
.usb > :last-child { flex:1; min-height:0; }
.usb .scroll { padding:4px; }

// ---------------------------------------------------------------- choosing things

const btn = (label, attrs, cls = '') => `<button class="b f ${cls}" ${attrs}>${esc(label)}</button>`;

async function openAction(action, target) {
  lastFocus = document.activeElement?.dataset?.key || lastFocus;
  if (action === 'open') { runAction(action, target, {}); return; }
  win('One moment', '<div class="prog spin"><i></i></div>', '', { locked: true, size: 'w-s' });
  let plan;
  try { plan = await invoke('plan', { action, id: target }); }
  catch (e) { return showResult(false, e); }
  const f = find(target);
  current = { action, target, plan, f, fs: plan.fsChoices?.[0]?.id || '', label: plan.labelDefault || '', size: plan.maxSize || 0, typed: '', quick: true, letter: '', open: false, games: false };
  if (plan.refuse) return refuseWin(plan);
  if (action === 'format') return drawFormat();
  if (action === 'delete') return drawDelete();
  if (action === 'extend' || action === 'shrink') return drawResize();
  if (action === 'letter') return drawLetter();
  if (action === 'create' || (action === 'games' && f && f.p && f.p.kind === 'free')) return openWizard(action);
  drawPlan();

// The plain confirmation (mount, unmount, safely remove, rename, check, repair, a whole drive for games, format a
// whole drive, the full check).
function drawPlan() {
  const { plan } = current;
  picks = {};
  const fs = plan.fsChoices?.length ? (picks.fs = { opts: plan.fsChoices.map(c => ({ id: c.id, label: c.label, note: c.note })), val: current.fs, on: v => current.fs = v },

// Extend and Shrink: Windows' numbers, a slider, and the disk after the change.

function canPickDrive() {

// ---------------------------------------------------------------- Several ISOs (Ventoy)

// one is downloaded and checked like a single write (or, your own, checked against a checksum beside it or trusted
// by you) before the drive is touched. Windows comes from Microsoft's page, so it's added as your own ISO.
async function loadVentoy() { if (!U.vtInfo) { try { U.vtInfo = await invoke('usb_ventoy'); } catch (e) { U.vtInfo = null; } if (U.tab === 'ventoy') renderUsb(true); } }

      if (f.mismatch) showResult(false, `${f.file} doesn't match ${f.against}: it's damaged or isn't the file it should be. It wasn't added.`);

}

// Holding A (or Enter, or the button with a finger or the mouse) for 1.5 s starts the job: one press can't erase a drive.
const HOLD_MS = 1500;
let hold = null;
function holdStart(src) {
  if (hold || S.view !== 'usb' || U.step !== 'confirm' || !$('#holdGo')) return;
  hold = { src, start: performance.now() };
  (function tick() {
    if (!hold) return;
    const p = Math.min(1, (performance.now() - hold.start) / HOLD_MS);
    const bar = $('#holdGo i'); if (bar) bar.style.width = `${p * 100}%`;
    if (p >= 1) { hold = null; startJob(); return; }
    requestAnimationFrame(tick);
  })();
}
function holdEnd(src) {
  if (!hold || (src && hold.src !== src)) return;
  hold = null;
  const bar = $('#holdGo i'); if (bar) bar.style.width = '0';
}
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#holdGo')) { e.preventDefault(); holdStart('ptr'); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => holdEnd('ptr'), true));

async function startJob() {
  if (!U.drive) return;
  const job = U.ventoy ? {
    ventoy: true, items: U.vt.map(x => ({ source: x.source, id: x.id || '', path: x.path || '', acceptUnverified: !!x.acceptUnverified })),
    drive: U.drive.id, expect: U.drive.fingerprint, showAll: U.showAll, typed: U.typed || '', scheme: U.scheme, keep: U.keep,
  } : {
    source: U.entry && !U.entry.windows ? 'catalog' : 'file', id: U.entry && !U.entry.windows ? U.entry.id : '', path: U.file ? U.file.path : '',
    drive: U.drive.id, expect: U.drive.fingerprint, showAll: U.showAll, typed: U.typed || '', scheme: U.scheme,
    tweaks: win11() ? { skipChecks: U.tweaks.skipChecks, skipOnline: U.tweaks.skipOnline, localAccount: (U.tweaks.localAccount || '').trim() } : {},
    keep: U.keep, acceptUnverified: !!U.accept,
  };
  U.step = 'run'; U.progress = { stage: 'find', text: 'Starting' }; U.result = null; U.error = ''; U.startedAt = performance.now();
  renderUsb(); focusFirstUsb('[data-u="cancel"]');
  try { await invoke('usb_start', { job }); }
  catch (e) { U.step = 'done'; U.result = { ok: false, error: String(e) }; renderUsb(); focusFirstUsb(); }
}
listen('usb://progress', ev => {

});
listen('usb://done', ev => {

});

const STAGES = [['download', 'Download', ['find', 'download']], ['check', 'Check', ['verify', 'inspect']], ['write', 'Write', ['prepare', 'write', 'copy', 'split']], ['verify', 'Verify', ['readback', 'finish']]];

function progressHtml() {
  const p = U.progress || {};

  const pct = p.pct != null ? Math.max(0, Math.min(1, p.pct)) : null;
  const nums = [p.done != null ? `${human(p.done)}${p.total ? ` of ${human(p.total)}` : ''}` : '', p.speed ? `${human(p.speed)}/s` : '', p.eta ? `about ${fmtTime(p.eta)} left` : '', pct != null ? `${Math.round(pct * 100)}%` : ''].filter(Boolean);
  return `<div class="stages">${show.map(s => { const i = STAGES.indexOf(s); return `<span class="${i < at ? 'done' : i === at ? 'on' : ''}">${i < at ? '✓ ' : ''}${s[1]}</span>`; }).join('')}</div>

}
