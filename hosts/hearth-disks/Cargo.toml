[package]
name = "hearth-disks"
version = "0.3.1"
edition = "2021"
description = "Hearth Disks: Hearth OS's own disk manager (drives, partitions, USB drives and SD cards) and bootable USB maker, for Linux and Windows"
license = "GPL-3.0-or-later"

[lib]
name = "hearth_disks"
path = "src/lib.rs"

[[bin]]
name = "hearth-disks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux: every change goes through udisks2 on the system bus (polkit asks for the password), and "Use for games"
# reuses Hearth's own Steam library code (hearth-core).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"
libc = "0.2"
hearth-core = { path = "../hearth-core" }
# Make a bootable USB: SHA-256 of downloads, the catalog's patterns, and Hearth's file picker (the desktop portal:
# Hearth Files in Hearth OS) for "Use an ISO I already have".
sha2 = "0.10"
regex = "1"
tauri-plugin-dialog = { version = "2.5", default-features = false, features = ["xdg-portal"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
