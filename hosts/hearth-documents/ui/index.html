<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents</title>
<link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="home">
  <header id="top">
    <button class="ib" data-f data-act="sidebar" id="sideBtn" title="Pages and contents (O)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <div class="title"><b id="name">Documents</b><span id="sub"></span></div>
    <span class="sp"></span>
    <div class="tools" id="tools">
      <button class="ib" data-f data-act="find" data-for="pdf epub" title="Find (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
      <button class="ib pagebox" data-f data-act="goto" data-for="pdf cbz epub" title="Go to page (Ctrl+G)" id="pageLabel">–</button>
      <i class="gap"></i>
      <button class="ib" data-f data-act="zoomOut" data-for="pdf cbz" title="Zoom out (−)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
      <button class="ib zoomtxt" data-f data-act="zoomCycle" data-for="pdf cbz" title="Fit width, fit page, 100% (0)" id="zoomLabel">Width</button>
      <button class="ib" data-f data-act="zoomIn" data-for="pdf cbz" title="Zoom in (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
      <button class="ib" data-f data-act="smaller" data-for="epub" title="Smaller text (−)"><svg viewBox="0 0 24 24"><path d="M4 18 8.5 7 13 18M5.6 14h5.8M16 13h5"/></svg></button>
      <button class="ib" data-f data-act="bigger" data-for="epub" title="Bigger text (+)"><svg viewBox="0 0 24 24"><path d="M3 19 8.5 5 14 19M5 14.5h7M17 12h5M19.5 9.5v5"/></svg></button>
      <button class="ib" data-f data-act="theme" data-for="epub" title="Light, sepia or dark (L, S, D)" id="themeBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
      <i class="gap"></i>
      <button class="ib" data-f data-act="rotate" data-for="pdf" title="Turn pages (R)"><svg viewBox="0 0 24 24"><path d="M20 4v5h-5"/><path d="M19.4 9A8 8 0 1 0 18 17.7"/></svg></button>
      <button class="ib" data-f data-act="dark" data-for="pdf cbz" title="Dark pages (D)" id="darkBtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="ib" data-f data-act="fullscreen" title="Full screen (F11)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" data-f data-act="more" title="More (Y)" id="moreBtn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
  </header>

  <div id="findbar" hidden>
    <input id="findIn" class="inp" placeholder="Find in the document" autocomplete="off" spellcheck="false">
    <span id="findCount"></span>
    <button class="ib" data-f data-act="findPrev" title="Previous (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="ib" data-f data-act="findNext" title="Next (Enter)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="ib" data-f data-act="findClose" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <aside id="side">
    <div class="stabs"><button class="stab" data-f data-stab="pages">Pages</button><button class="stab" data-f data-stab="outline">Contents</button><button class="stab" data-f data-stab="results" hidden>Found</button></div>
    <div id="sidePages" class="scroll sidebody"></div>
    <div id="sideOutline" class="scroll sidebody" hidden></div>
    <div id="sideResults" class="scroll sidebody" hidden></div>
  </aside>

  <main id="main">
    <div id="viewerContainer" tabindex="0"><div id="viewer" class="pdfViewer"></div></div>
    <div id="epubWrap" hidden><div id="epubArea"></div>
      <button class="turn prev" data-act="prevPage" tabindex="-1" title="Previous page (←)"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="turn next" data-act="nextPage" tabindex="-1" title="Next page (→)"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div id="cbzWrap" class="scroll" tabindex="0" hidden><div id="cbzPages"></div></div>
    <div id="loading" hidden><div class="spin"></div><span id="loadingText">Opening…</span></div>
    <div id="msg" hidden></div>
  </main>

  <section id="home" class="scroll">
    <div class="hwrap">
      <div class="hhead">
        <svg viewBox="0 0 24 24" class="big"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <div><h1>Documents</h1><p>PDFs, e-books (EPUB) and comic books (CBZ)</p></div>
        <span class="sp"></span>
        <button class="btn primary" data-f data-act="open">Open a document…</button>
      </div>
      <h2 id="recentTitle">Recent</h2>
      <div id="recent"></div>
    </div>
  </section>

  <footer id="hints">
    <span><b>◀ ▶</b>Pages</span><span><b>LT RT</b>Zoom</span><span><b>A</b>Tools</span><span><b>X</b>Sidebar</span><span><b>Y</b>More</span><span><b>B</b>Back</span>
    <span class="sp"></span><span id="progress"></span>
  </footer>
</div>
<div id="menu" hidden></div>
<div id="layer"></div>
<div id="toast" hidden></div>
<div id="print"></div>

<script src="vendor/epub/jszip.min.js"></script>
<script src="vendor/epub/epub.min.js"></script>
<script src="app.js"></script>
</body>
</html>
