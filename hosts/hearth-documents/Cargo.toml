[package]
name = "hearth-documents"
version = "0.1.0"
edition = "2021"
description = "Hearth Documents: Hearth OS's own reader for PDFs, e-books (EPUB) and comic books (CBZ), for Linux (Mantel; Windows/Ember later)"
license = "GPL-3.0-or-later"

# What doesn't need a window (recent documents and where you were, comic book pages) is a library, so the tests
# can check it without opening the app.
[lib]
name = "hearth_documents"
path = "src/lib.rs"

[[bin]]
name = "hearth-documents"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
