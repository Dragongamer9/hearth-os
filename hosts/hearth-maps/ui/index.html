<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map"></div>
<div id="cross" hidden></div>
<aside id="panel">
  <form id="searchrow" autocomplete="off">
    <input class="inp f" id="q" type="search" placeholder="Search places and addresses" data-osk="1" spellcheck="false" aria-label="Search">
    <button class="btn primary f" id="go" type="submit" title="Search (Enter)">Search</button>
  </form>
  <div id="pbody"></div>
</aside>
<div id="tools">
  <button class="tool f" data-act="locate" title="Where am I (L)" aria-label="Where am I"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="tool f" data-act="route" title="Directions (Ctrl+D)" aria-label="Directions"><svg viewBox="0 0 24 24"><path d="M6 20V9a3 3 0 0 1 3-3h9M14 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="tool f" data-act="saved" title="Saved places (S)" aria-label="Saved places"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="tool f" data-act="layers" title="Map style and offline copies (M)" aria-label="Map style"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <button class="tool f" data-act="zoomin" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2"/></svg></button>
  <button class="tool f" data-act="zoomout" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2"/></svg></button>
</div>
<div id="banner" hidden></div>
<div id="hints" hidden><span><b>L</b> move</span><span><b>LT RT</b> zoom</span><span><b>A</b> what's here</span><span><b>Y</b> search</span><span><b>X</b> directions</span><span><b>LB</b> map / panel</span><span><b>B</b> back</span></div>
<div id="layer"></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
