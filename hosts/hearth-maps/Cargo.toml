[package]
name = "hearth-maps"
version = "0.1.0"
edition = "2021"
description = "Hearth Maps: Hearth OS's own maps (OpenStreetMap: OpenFreeMap tiles, Nominatim search, FOSSGIS OSRM directions)"
license = "GPL-3.0-or-later"

# Everything that talks to the map services (the tile cache, search, directions, the services' on/off switch) and
# geo: links is a library, so it's tested without a window.
[lib]
name = "hearth_maps"
path = "src/lib.rs"

[[bin]]
name = "hearth-maps"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
url = "2"

# "Where am I": GeoClue, the system's location service, over D-Bus (only when that button is pressed).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
