# Hearth's own Wayland compositor (docs/COMPOSITOR.md): Mantel's window manager for 2.0, on Smithay.
# Started from Smithay's example compositor Anvil (MIT, LICENSE-SMITHAY-ANVIL.txt), pinned to the same Smithay release.
# No version line: the owner picks every version number (Cargo reads a missing one as 0.0.0).
[package]
name = "hearth-compositor"
edition = "2021"
description = "Hearth's own Wayland compositor (preview): Mantel's window manager, on Smithay"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-compositor"
path = "src/main.rs"

[dependencies]
bitflags = "2.2.1"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xcursor = { version = "0.3.3", optional = true }
xkbcommon = "0.8.0"
image = { version = "0.25.1", default-features = false, optional = true, features = ["png"] }
smithay-drm-extras = { version = "=0.1.0", optional = true }
profiling = { version = "1.0" }
# Hearth's parts: the settings it reads (never writes), the titlebars' text, a clean end on SIGTERM.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
fontdue = "0.9"
signal-hook = "0.3"

[dependencies.smithay]
version = "=0.7.0"
default-features = false
features = ["desktop", "wayland_frontend"]

[dependencies.x11rb]
default-features = false
features = ["composite"]
optional = true
version = "0.13.0"

[features]
default = ["egl", "winit", "udev", "xwayland"]
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
udev = [
  "smithay-drm-extras",
  "smithay/backend_libinput",
  "smithay/backend_udev",
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_vulkan",
  "smithay/backend_egl",
  "smithay/backend_session_libseat",
  "image",
  "smithay/renderer_gl",
  "smithay/renderer_pixman",
  "smithay/renderer_multi",
  "xcursor",
]
winit = ["smithay/backend_winit", "smithay/backend_drm"]
xwayland = ["smithay/xwayland", "x11rb", "smithay/x11rb_event_source", "xcursor"]
renderer_sync = []

[profile.release]
debug = 1
