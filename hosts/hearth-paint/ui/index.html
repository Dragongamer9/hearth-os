<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint</title>
<style>
/* Hearth's ember palette (hosts/linux/desktop/shell/Theme.qml), as in Disks and Terminal. */
:root {
  --bg:#0f0b09; --bg2:#17110e; --panel:#1c1512; --panel2:#261d18; --panel3:#33271f; --line:#3b2e26;
  --text:#f4ece3; --muted:#a69484; --faint:#6f6055; --ember:#ff8a3d; --flame:#ffd166; --danger:#ff5d5d;
  --ink:#2a1206; --r:12px; --ease:cubic-bezier(.2,.8,.2,1);
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); }
body { font:400 14px/1.3 system-ui, "Segoe UI", Cantarell, "Noto Sans", sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; }
button, input, select, textarea { font:inherit; color:inherit; }
.app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
.f { outline:none; cursor:pointer; }
.f:focus-visible, .f.focus { box-shadow:0 0 0 3px var(--ember), 0 0 18px rgba(255,138,61,.35); }
.bar { display:flex; align-items:center; gap:4px; padding:7px 10px; background:var(--bg2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar .grp { display:flex; gap:3px; padding-right:8px; margin-right:4px; border-right:1px solid var(--line); }
.bar .grp:last-child { border-right:0; }
.tb { height:34px; min-width:34px; padding:0 10px; border-radius:9px; border:1px solid transparent; background:transparent; display:inline-flex; align-items:center; gap:6px; }
.tb:hover { background:var(--panel2); }
.tb[disabled] { opacity:.4; pointer-events:none; }
.tb svg { width:18px; height:18px; flex:none; }
.tb.on { background:#3a2416; border-color:var(--ember); }
.spacer { flex:1; }
.zoomv { min-width:56px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
.work { display:grid; grid-template-columns:auto 1fr auto; min-height:0; }
.tools { display:grid; grid-auto-rows:44px; grid-template-columns:44px 44px; gap:4px; padding:10px 8px; background:var(--bg2); border-right:1px solid var(--line); align-content:start; overflow:auto; }
.tool { width:44px; height:44px; border-radius:11px; border:1px solid transparent; background:transparent; display:grid; place-items:center; }
.tool svg { width:22px; height:22px; }
.tool:hover { background:var(--panel2); }
.tool.on { background:var(--ember); color:var(--ink); }
.stage { position:relative; overflow:auto; background:#0b0807 radial-gradient(circle at 1px 1px, #1f1713 1px, transparent 1px) 0 0/22px 22px; touch-action:none; scrollbar-width:thin; scrollbar-color:var(--panel3) transparent; }
.paper { position:relative; margin:40px; box-shadow:0 10px 40px rgba(0,0,0,.55); background:repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/16px 16px; }
.paper canvas { position:absolute; left:0; top:0; width:100%; height:100%; }
.paper.pixel canvas { image-rendering:pixelated; }
#over { pointer-events:none; }
.textbox { position:absolute; z-index:3; min-width:40px; min-height:1.2em; background:rgba(255,255,255,.04); border:1px dashed var(--ember); outline:none; resize:none; overflow:hidden; white-space:pre; padding:0; line-height:1.2; }
#padCursor { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px; pointer-events:none; z-index:4; display:none; }
#padCursor::before, #padCursor::after { content:""; position:absolute; background:#fff; box-shadow:0 0 0 1px #000; }
#padCursor::before { left:13px; top:0; width:2px; height:28px; }
#padCursor::after { top:13px; left:0; height:2px; width:28px; }
.props { width:232px; padding:12px; background:var(--bg2); border-left:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; gap:14px; }
.props h3 { margin:0 0 6px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.colors { display:flex; align-items:center; gap:12px; }
.pair { position:relative; width:64px; height:56px; flex:none; }
.pair button { position:absolute; width:38px; height:38px; border-radius:10px; border:2px solid var(--bg2); box-shadow:0 0 0 1px var(--line); }
.pair .c1 { left:0; top:0; z-index:2; } .pair .c2 { left:22px; top:16px; }
.swatches { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px; }
.sw { aspect-ratio:1; border-radius:7px; border:1px solid rgba(255,255,255,.12); padding:0; }
.sw.on { box-shadow:0 0 0 2px var(--ember); }
.slider { display:flex; align-items:center; gap:10px; }
.slider input { flex:1; accent-color:var(--ember); }
.slider span { min-width:30px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
.seg { display:flex; gap:4px; flex-wrap:wrap; }
.seg button { flex:1; min-height:32px; border-radius:9px; border:1px solid var(--line); background:var(--panel2); font-size:12px; padding:0 6px; }
.seg button.on { border-color:var(--ember); background:#3a2416; }
.hex { width:100%; padding:7px 9px; border-radius:9px; border:1px solid var(--line); background:var(--bg); }
.small { color:var(--muted); font-size:12px; line-height:1.4; }
footer { display:flex; gap:16px; align-items:center; padding:6px 12px; background:var(--bg2); border-top:1px solid var(--line); color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; }
footer .hint { flex:1; overflow:hidden; text-overflow:ellipsis; }
footer b { display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 4px; border-radius:5px; background:var(--panel3); color:var(--text); margin-right:4px; font-size:10px; }
.veil { position:fixed; inset:0; background:rgba(8,5,4,.72); display:grid; place-items:center; padding:20px; z-index:10; }
.dlg { width:min(38em, 100%); max-height:100%; overflow:auto; background:var(--panel); border:1px solid #4a372b; border-radius:18px; padding:18px 20px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.dlg h2 { margin:0 0 6px; font-size:18px; }
.dlg .sub { color:var(--muted); font-size:13px; margin-bottom:10px; overflow-wrap:anywhere; }
.btn { padding:8px 14px; border-radius:11px; background:var(--panel2); border:1px solid var(--line); min-height:38px; }
.btn.primary { background:var(--ember); color:var(--ink); border-color:transparent; font-weight:650; }
.btn.danger { color:#ffb3a1; border-color:#5c2a22; background:#2a1512; }
.row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
.files { display:flex; flex-direction:column; gap:3px; max-height:46vh; overflow:auto; padding:3px; }
.file { text-align:left; padding:8px 11px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.inp { width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--bg2); outline:none; }
.inp:focus { border-color:var(--ember); }
.toast { position:fixed; left:50%; bottom:44px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:9px 16px; border-radius:12px; z-index:20; }
.osk { display:grid; grid-template-columns:repeat(10, 1fr); gap:5px; margin-top:10px; }
.osk button { padding:8px 0; border-radius:9px; background:var(--panel3); border:1px solid var(--line); }
.osk .wide { grid-column:span 2; }
@media (max-width: 900px) { .props { width:190px; } .bar .lbl { display:none; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar" id="bar">
    <div class="grp">
      <button class="tb f" data-act="new" title="New (Ctrl+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">New</span></button>
      <button class="tb f" data-act="open" title="Open (Ctrl+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Open</span></button>
      <button class="tb f" data-act="save" title="Save (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span class="lbl">Save</span></button>
      <button class="tb f" data-act="saveas" title="Save as (Ctrl+Shift+S)"><span class="lbl">Save as…</span></button>
    </div>
    <div class="grp">
      <button class="tb f" data-act="undo" id="undoB" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb f" data-act="redo" id="redoB" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb f" data-act="paste" title="Paste a picture (Ctrl+V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2"/></svg><span class="lbl">Paste</span></button>
      <button class="tb f" data-act="shot" title="Take a screenshot to mark up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lbl">Screenshot</span></button>
      <button class="tb f" data-act="crop" id="cropB" title="Crop to the selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2v16h16M2 6h16v16"/></svg><span class="lbl">Crop</span></button>
      <button class="tb f" data-act="rotate" title="Turn right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-3-6.3"/><path d="M20 3v5h-5"/></svg></button>
      <button class="tb f" data-act="flip" title="Flip left to right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3v18"/><path d="M9 7 3 17h6zM15 7l6 10h-6z"/></svg></button>
      <button class="tb f" data-act="resize" title="Picture size"><span class="lbl">Size…</span></button>
    </div>
    <span class="spacer"></span>
    <div class="grp">
      <button class="tb f" data-act="zoomout" title="Zoom out (-)">−</button>
      <span class="zoomv" id="zoomv">100%</span>
      <button class="tb f" data-act="zoomin" title="Zoom in (+)">+</button>
      <button class="tb f" data-act="fit" title="Fit (Ctrl+0)"><span class="lbl">Fit</span></button>
    </div>
  </div>
  <div class="work">
    <div class="tools" id="tools"></div>
    <div class="stage" id="stage"><div class="paper" id="paper"><canvas id="doc"></canvas><canvas id="over"></canvas></div><div id="padCursor"></div></div>
    <div class="props" id="props"></div>
  </div>
  <footer><span class="hint" id="hint"></span><span id="pos"></span><span id="dims"></span><span id="padhints"></span></footer>
</div>
<div id="layer"></div>
<script>
'use strict';
const T = window.__TAURI__;
const invoke = T ? T.core.invoke : demoInvoke;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const doc = $('#doc'), over = $('#over'), stage = $('#stage'), paper = $('#paper');
const dctx = doc.getContext('2d', { willReadFrequently: true }), octx = over.getContext('2d');
const I = (p, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
const TOOLS = [
  ['select', 'S', 'Select', 'Drag a box to select. Drag inside it to move it; Delete clears it; Crop keeps only it.', I('<path d="M4 4h4M12 4h4M20 4v4M20 12v4M20 20h-4M12 20H8M4 20v-4M4 12V8"/>')],
  ['pencil', 'P', 'Pencil', 'Hard pixels, for small details.', I('<path d="m4 20 2-6L16 4l4 4-10 10z"/><path d="m13 7 4 4"/>')],
  ['brush', 'B', 'Brush', 'Soft round strokes. With a pen, pressing harder draws thicker.', I('<path d="M7 21c3 0 5-2 5-5a3 3 0 0 0-6 0c0 2-2 3-3 3 1 1 2 2 4 2z"/><path d="m11 13 9-9"/>')],
  ['marker', 'H', 'Highlighter', 'See-through strokes to mark up text and screenshots.', I('<path d="m9 15 9-9 3 3-9 9z"/><path d="M9 15l-4 4h5l2-1"/>')],
  ['eraser', 'E', 'Eraser', 'Paints with the second colour (white unless you change it).', I('<path d="m3 17 9-9 7 7-5 5H7z"/><path d="M14 20h7"/>')],
  ['fill', 'F', 'Fill', 'Fills an area of one colour.', I('<path d="m5 11 7-7 7 7-7 7z"/><path d="M20 15c0 2 1 3 1 4a1.5 1.5 0 0 1-3 0c0-1 1-2 2-4z"/>')],
  ['picker', 'I', 'Colour picker', 'Takes a colour from the picture (right-click for the second colour).', I('<path d="m14 4 6 6-9 9H5v-6z"/><path d="m12 6 6 6"/>')],
  ['text', 'T', 'Text', 'Click where the text goes and type. Ctrl+Enter or a click elsewhere puts it down.', I('<path d="M5 6V4h14v2M12 4v16M9 20h6"/>')],
  ['line', 'L', 'Line', 'Hold Shift for straight angles.', I('<path d="M5 19 19 5"/>')],
  ['arrow', 'A', 'Arrow', 'For pointing things out.', I('<path d="M5 19 19 5M10 5h9v9"/>')],
  ['rect', 'R', 'Rectangle', 'Hold Shift for a square.', I('<rect x="4" y="6" width="16" height="12" rx="1"/>')],
  ['ellipse', 'O', 'Ellipse', 'Hold Shift for a circle.', I('<ellipse cx="12" cy="12" rx="8" ry="6"/>')],
];
const PALETTE = ['#000000', '#7f7f7f', '#ffffff', '#c3c3c3', '#880015', '#ed1c24', '#ff7f27', '#fff200', '#22b14c', '#00a2e8', '#3f48cc', '#a349a4', '#b97a57', '#ffaec9',
  '#ffc90e', '#efe4b0', '#b5e61d', '#99d9ea', '#7092be', '#c8bfe7', '#ff8a3d'];
const S = { tool: 'brush', c1: '#000000', c2: '#ffffff', size: 6, shapeFill: 'outline', zoom: 1, path: null, dirty: false, sel: null, float: null,
  drawing: null, text: null, pad: false, padCanvas: false, cur: { x: 300, y: 300 }, platform: 'linux', pictures: '', bold: false, opacity: 1 };
try { Object.assign(S, JSON.parse(localStorage.getItem('hearth.paint') || '{}'), { path: null, dirty: false, sel: null, float: null, drawing: null, text: null }); } catch (e) {}
function remember() { try { localStorage.setItem('hearth.paint', JSON.stringify({ tool: S.tool, c1: S.c1, c2: S.c2, size: S.size, shapeFill: S.shapeFill, bold: S.bold, opacity: S.opacity })); } catch (e) {} }

// ---------------------------------------------------------------- picture, history, view
const hist = { list: [], at: -1, max: 40 };
function snapshot() { return { w: doc.width, h: doc.height, data: dctx.getImageData(0, 0, doc.width, doc.height) }; }
function commit(dirty = true) {
  hist.list = hist.list.slice(0, hist.at + 1);
  hist.list.push(snapshot());
  if (hist.list.length > hist.max) hist.list.shift();
  hist.at = hist.list.length - 1;
  if (dirty) setDirty(true);
  updateButtons();
}
function restore(s) { if (doc.width !== s.w || doc.height !== s.h) setSize(s.w, s.h); dctx.putImageData(s.data, 0, 0); }
function undo() { if (S.text) return cancelText(); if (S.float) { dropFloat(); } if (hist.at <= 0) return; hist.at--; restore(hist.list[hist.at]); clearSel(); setDirty(true); updateButtons(); }
function redo() { if (hist.at >= hist.list.length - 1) return; hist.at++; restore(hist.list[hist.at]); clearSel(); setDirty(true); updateButtons(); }
function updateButtons() {
  $('#undoB').disabled = hist.at <= 0; $('#redoB').disabled = hist.at >= hist.list.length - 1;
  $('#cropB').disabled = !S.sel && !S.float;
  $('#dims').textContent = `${doc.width} × ${doc.height}`;
}
function setSize(w, h) { doc.width = over.width = w; doc.height = over.height = h; applyZoom(); }
function blank(w, h, color = '#ffffff') { setSize(w, h); dctx.fillStyle = color; dctx.fillRect(0, 0, w, h); }
function setDirty(d) { S.dirty = d; title(); }
function baseName(p) { return p ? p.split(/[\\/]/).pop() : 'Untitled'; }
function title() {
  const t = `${S.dirty ? '• ' : ''}${baseName(S.path)} – Paint`;
  document.title = t;
  if (T && T.window) T.window.getCurrentWindow().setTitle(t).catch(() => {});
}
function applyZoom(keepCenter) {
  const z = S.zoom;
  const cx = stage.scrollLeft + stage.clientWidth / 2, cy = stage.scrollTop + stage.clientHeight / 2;
  const old = paper.offsetWidth || 1;
  paper.style.width = Math.round(doc.width * z) + 'px'; paper.style.height = Math.round(doc.height * z) + 'px';
  paper.classList.toggle('pixel', z >= 2);
  $('#zoomv').textContent = Math.round(z * 100) + '%';
  if (keepCenter) { const k = paper.offsetWidth / old; stage.scrollLeft = cx * k - stage.clientWidth / 2; stage.scrollTop = cy * k - stage.clientHeight / 2; }
  if (S.text) placeTextBox();
  drawOverlay();
}
const ZOOMS = [.1, .25, .33, .5, .67, .75, 1, 1.5, 2, 3, 4, 6, 8, 12, 16];
function zoomStep(d) { const i = ZOOMS.findIndex(z => z >= S.zoom - 1e-6); S.zoom = ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, (i < 0 ? 6 : i) + d))]; applyZoom(true); }
function fit() { const w = stage.clientWidth - 80, h = stage.clientHeight - 80; S.zoom = Math.max(.05, Math.min(1, w / doc.width, h / doc.height)); applyZoom(); }

// ---------------------------------------------------------------- the side panels
function renderTools() {
  $('#tools').innerHTML = TOOLS.map(([id, key, name, , icon]) => `<button class="tool f ${S.tool === id ? 'on' : ''}" data-tool="${id}" title="${name} (${key})" aria-label="${name}">${icon}</button>`).join('');
}
function renderProps() {
  const t = TOOLS.find(x => x[0] === S.tool);
  const shapes = ['rect', 'ellipse'].includes(S.tool), sized = !['fill', 'picker', 'select'].includes(S.tool);
  $('#props').innerHTML = `
    <div><h3>Colours</h3><div class="colors"><div class="pair"><button class="c1 f" data-act="edit1" title="First colour (left button)" style="background:${S.c1}"></button><button class="c2 f" data-act="edit2" title="Second colour (right button)" style="background:${S.c2}"></button></div>
      <div class="small">Left button draws with the first, right with the second. <b>X</b> swaps them.</div></div></div>
    <div class="swatches">${PALETTE.map(c => `<button class="sw f ${c === S.c1 ? 'on' : ''}" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div>
    <input class="hex f" id="hex" value="${S.c1}" spellcheck="false" title="First colour as #rrggbb">
    <input type="color" id="colorIn" value="${S.c1}" style="width:100%;height:34px;border:0;background:none;padding:0">
    ${sized ? `<div><h3>${S.tool === 'text' ? 'Text size' : 'Size'}</h3><div class="slider"><input class="f" type="range" id="size" min="1" max="${S.tool === 'text' ? 40 : 100}" value="${S.size}"><span>${S.tool === 'text' ? Math.max(8, S.size * 3) : S.size}</span></div></div>` : ''}
    ${shapes ? `<div><h3>Shape</h3><div class="seg">${[['outline', 'Outline'], ['fill', 'Filled'], ['both', 'Both']].map(([k, l]) => `<button class="f ${S.shapeFill === k ? 'on' : ''}" data-fill="${k}">${l}</button>`).join('')}</div><div class="small" style="margin-top:6px">Filled uses the second colour inside.</div></div>` : ''}
    ${S.tool === 'text' ? `<div><h3>Style</h3><div class="seg"><button class="f ${S.bold ? 'on' : ''}" data-act="bold"><b>Bold</b></button></div></div>` : ''}
    ${['brush', 'pencil', 'line', 'arrow', 'rect', 'ellipse', 'text'].includes(S.tool) ? `<div><h3>Opacity</h3><div class="slider"><input class="f" type="range" id="opacity" min="10" max="100" value="${Math.round(S.opacity * 100)}"><span>${Math.round(S.opacity * 100)}%</span></div></div>` : ''}
    <div class="small"><b>${t[2]}</b>: ${t[3]}</div>`;
}
function setTool(id) {
  if (S.text) commitText();
  if (id !== 'select' && S.float) dropFloat();
  if (id !== 'select') clearSel();
  S.tool = id; remember(); renderTools(); renderProps(); hint(); drawOverlay();
}
function setColor(which, c) { if (!/^#[0-9a-f]{6}$/i.test(c)) return; S[which] = c.toLowerCase(); remember(); renderProps(); if (S.text) styleTextBox(); }
function hint(t) {
  const tool = TOOLS.find(x => x[0] === S.tool);
  $('#hint').textContent = t || `${tool[2]}: ${tool[3]}`;
  $('#padhints').innerHTML = S.pad ? (S.padCanvas ? '<b>A</b>Draw <b>LB RB</b>Tool <b>↑↓</b>Size <b>←→</b>Colour <b>LT RT</b>Zoom <b>B</b>Undo <b>Y</b>Menu <b>View</b>Toolbar'
    : '<b>A</b>Choose <b>B</b>Back to the picture <b>View</b>Picture') : '';
}
let toastT = 0;
function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200); }

// ---------------------------------------------------------------- drawing
function pt(e) { const r = doc.getBoundingClientRect(); return { x: (e.clientX - r.left) / S.zoom, y: (e.clientY - r.top) / S.zoom }; }
function strokeStyle(ctx, color, w) { ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function pressureOf(e) { return e.pointerType === 'pen' && e.pressure > 0 ? .25 + e.pressure * 1.5 : 1; }

// On-screen keyboard (controller) for the file name and sizes.

// ---------------------------------------------------------------- buttons and keys
const ACTS = {

// ---------------------------------------------------------------- controller
// Two ways: on the picture (a cursor the left stick moves, A draws) and on the buttons (the D-pad moves between them).
// View switches. LB/RB tools, D-pad up/down size and left/right colour on the picture, LT/RT zoom, B undo, Y the menu.
function focusables() { return [...document.querySelectorAll(dialogOpen() ? '#layer .f' : '.bar .f, .tools .f, .props .f')].filter(el => el.offsetParent !== null && !el.disabled); }

  let lx = 0, ly = 0, rx = 0, ry = 0;

    st.a ||= bt(0); st.b ||= bt(1); st.x ||= bt(2); st.y ||= bt(3); st.lb ||= bt(4); st.rb ||= bt(5); st.lt ||= bt(6); st.rt ||= bt(7); st.view ||= bt(8); st.menu ||= bt(9);

      else if (k === 'view' && !dialogOpen()) toCanvasMode(true);

function menuSheet() {
