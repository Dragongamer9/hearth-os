# Task Manager: what's running, performance, start-up apps, services (pure Rust, hearth-ui; docs/APPS-ANATASE.md). No version line: the owner picks every version number.
[package]
name = "hearth-task-manager"
edition = "2021"
description = "Task Manager: what's running, performance, start-up apps, services"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-task-manager"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
# The apps' icons in the Name column (mockup tm-1's checklist): iced's image widget without its many codecs, and
# the image crate's PNG reader only; SVG icons through iced's svg widget.
iced = { workspace = true, features = ["image-without-codecs", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
