# Hearth Bottles (pure Rust, hearth-ui; docs/mockups/checklists/open-source-08-bottles.md, the approved board
# docs/mockups/open-source-apps/08-bottles.png): Windows apps, each in its own bottle. Built on Bottles (GPL-3): its
# bottle.yml files and its command, bottles-cli. Made of blocks.
# No version line: the owner picks every version number.
[package]
name = "hearth-bottles"
edition = "2021"
description = "Hearth Bottles: Windows apps, each in its own bottle (built on Bottles)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-bottles"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit-a = { path = "../oss-kit-a" }
iced = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
