# Hearth Beat Maker (pure Rust, hearth-ui; docs/mockups/checklists/open-source-18-beat-maker.md, the approved board
# docs/mockups/open-source-apps/18-beat-maker.png): a song from patterns, the piano roll and instruments, for Hearth's
# trailer music, built on LMMS (GPL-2): its project files (.mmp) and its command line to render, and Hearth's own synth
# for playing as you go (played through PipeWire's pw-play). No version line: the owner picks every version number.
[package]
name = "hearth-beat-maker"
edition = "2021"
description = "Hearth Beat Maker: songs from patterns, a piano roll and instruments, built on LMMS"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-beat-maker-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
iced = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
