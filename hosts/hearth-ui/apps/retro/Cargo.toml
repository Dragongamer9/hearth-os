# Hearth Retro (pure Rust, hearth-ui; docs/mockups/checklists/open-source-04-retro.md, the approved board
# docs/mockups/open-source-apps/04-retro.png): emulator games as shelves in Game Mode, built on RetroDECK and EmuDeck
# (GPL-3): their ROM folders, emulators and BIOS folders; every emulator set up in one go, the BIOS check, the
# controllers. Its library (lib.rs) is shared with Retro to Steam. No version line: the owner picks every version number.
[package]
name = "hearth-retro"
edition = "2021"
description = "Hearth Retro: your emulator games as shelves, every emulator set up in one go (RetroDECK and EmuDeck)"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hearth-retro-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
iced = { workspace = true, features = ["image"] }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
