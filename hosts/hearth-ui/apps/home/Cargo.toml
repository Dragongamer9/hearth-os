# Hearth Home (pure Rust, hearth-ui; docs/mockups/checklists/open-source-14-home.md, the approved board
# docs/mockups/open-source-apps/14-home.png): a big, TV-friendly smart-home dashboard on Home Assistant (Apache-2.0)
# through its own REST API. No version line: the owner picks every version number.
[package]
name = "hearth-home"
edition = "2021"
description = "Hearth Home: your home on the big screen (built on Home Assistant)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-home-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit = { path = "../oss-kit" }
iced = { workspace = true, features = ["canvas", "image"] }
serde_json = { workspace = true }
futures = { workspace = true }
