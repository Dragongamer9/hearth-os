# Hearth Passwords (pure Rust, hearth-ui; docs/mockups/checklists/open-source-16-passwords.md, the approved board
# docs/mockups/open-source-apps/16-passwords.png): your vault on your own server, Vaultwarden (AGPL-3) on the Nvidia PC
# through the Bitwarden protocol, and KeePass files through KeePassXC's own command (GPL-3). The crypto is RustCrypto's
# well-known crates (pbkdf2, argon2, hkdf, aes + cbc, hmac, sha1/sha2, rsa), zeroize wipes keys from memory.
# No version line: the owner picks every version number.
[package]
name = "hearth-passwords"
edition = "2021"
description = "Hearth Passwords: your vault on your own server (built on Vaultwarden and KeePassXC)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-passwords-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit = { path = "../oss-kit" }
iced = { workspace = true, features = ["canvas"] }
serde_json = { workspace = true }
futures = { workspace = true }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
argon2 = "0.5"
rsa = "0.9"
getrandom = "0.2"
zeroize = "1"
roxmltree = "0.20"
