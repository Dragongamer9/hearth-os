# Hearth 3D (pure Rust, hearth-ui; docs/mockups/checklists/open-source-17-3d.md, the approved board
# docs/mockups/open-source-apps/17-3d.png): modelling, with the viewport, scene tree, properties and timeline drawn in
# Rust and Blender (GPL-2+) as the engine in the background. Made of blocks.
# No version line: the owner picks every version number.
[package]
name = "hearth-3d"
edition = "2021"
description = "Hearth 3D: modelling with Blender as the engine"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-3d"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit = { path = "../oss-kit" }
iced = { workspace = true, features = ["image"] }
serde_json = { workspace = true }
