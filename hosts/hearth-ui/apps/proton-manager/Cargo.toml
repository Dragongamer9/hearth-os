# Proton Manager (pure Rust, hearth-ui; docs/mockups/checklists/open-source-02-proton-manager.md, the approved board
# docs/mockups/open-source-apps/02-proton-manager.png): Settings › Gaming › Proton and Wine. Built on ProtonUp-Qt
# (GPL-3): the same sources and folders, Steam's and Lutris' own files for each game's pick. Made of blocks.
# No version line: the owner picks every version number.
[package]
name = "hearth-proton-manager"
edition = "2021"
description = "Proton Manager: the Proton and Wine versions your Windows games run with (built on ProtonUp-Qt)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-proton-manager"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit = { path = "../oss-kit" }
iced = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
