# Hearth Studio (pure Rust, hearth-ui; docs/mockups/checklists/open-source-12-studio.md, the approved board
# docs/mockups/open-source-apps/12-studio.png): going live and recording, built on OBS Studio (GPL-2) and driven
# through OBS's own remote control, obs-websocket (a small WebSocket client of its own, ws.rs). No version line: the
# owner picks every version number.
[package]
name = "hearth-studio"
edition = "2021"
description = "Hearth Studio: scenes, going live, recording and the sound mixer, built on OBS Studio"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-studio-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
hearth-oss-kit = { path = "../oss-kit" }
iced = { workspace = true, features = ["image"] }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
# Twitch and YouTube at once (relay.rs): Hearth Studio's own RTMP relay, so the stream keys stay in its memory (never
# on another program's command line), sent over RTMPS with rustls (ring, the web's certificate authorities).
rml_rtmp = "0.8"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
