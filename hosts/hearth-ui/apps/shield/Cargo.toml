# Hearth Shield (pure Rust, hearth-ui; board docs/mockups/open-source-apps/15-shield.png, checklist
# docs/mockups/checklists/open-source-15-shield.md): ads and trackers blocked for every device at home, built on
# AdGuard Home (GPL-3, Hearth's own through hearth-server-dns) or a Pi-hole (EUPL-1.2). No version line: the owner
# picks every version number.
[package]
name = "hearth-shield"
edition = "2021"
description = "Hearth Shield: ads and trackers blocked for every device at home (built on Pi-hole and AdGuard Home)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-shield-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
iced = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
