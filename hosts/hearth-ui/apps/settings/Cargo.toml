# Hearth Settings: its own pure-Rust app (hearth-ui), not tied to Mantel or Game Mode. No version line: the owner picks
# every version number.
[package]
name = "hearth-settings-app"
edition = "2021"
description = "Hearth Settings, a standalone pure-Rust app"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-settings-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
# Desktop layouts (hosts/hearth-layout): the layout files, their check and the blocks, read here; changes go through its
# command (hearth-layout apply-json) so they're put in place exactly as Mantel's own Settings does it.
hearth-layout = { path = "../../../hearth-layout" }
# Settings › Home server's board (cats/hs_board.rs): the Server side's parts, their tiles and their Store states.
hearth-server-parts = { path = "../server-parts" }
# image: the scanners' test picture and the pages of Scan to PDF (Bluetooth & devices); qr_code: Tailscale's sign-in
# link as a big QR code to photograph with a phone (Network & internet).
# "advanced": the window's outer widget (nav.rs Gate) and finding the focused row on the screen to scroll it into view.
iced = { workspace = true, features = ["image", "qr_code", "advanced"] }
# The wallpapers', account pictures' and login screen's pictures (pics.rs): decoded here off the window's thread and
# shrunk, as Hearth Files does.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The boot splashes' and startup animations' preview sheets (bootpics.rs), decoded at a half or less of their size for
# the cards' posters (JPEG's own scaled decoding), so a whole sheet is never held for one small picture.
jpeg-decoder = { version = "0.3", default-features = false }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
# Display › Identify outside KDE Plasma (identify.rs: `--identify`, each screen's number for 3 s): layer-shell
# overlays, as hearth-pad-host draws its own (the same versions; no default features, so nothing talks to D-Bus).
iced_layershell = { version = "0.19", default-features = false }
wayland-client = "0.31"
# As in hearth-pad-host: iced_layershell 0.19 builds with this winit-core beta only.
winit-core = "=0.31.0-beta.2"
