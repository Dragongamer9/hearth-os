# Hearth Settings: its own pure-Rust app (hearth-ui), not tied to Mantel or Game Mode. No version line: the owner picks
# every version number.
[package]
name = "hearth-settings-app"
edition = "2021"
description = "Hearth Settings, a standalone pure-Rust app"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "hearth-settings-app"
path = "src/main.rs"

[dependencies]
hearth-ui = { path = "../.." }
# image: the scanners' test picture, the pages of Scan to PDF and Tailscale's sign-in QR code (Bluetooth & devices,
# Network & internet).
iced = { workspace = true, features = ["image"] }
serde_json = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
