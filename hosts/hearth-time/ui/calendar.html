<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link rel="stylesheet" href="hearth.css">
<style>
header h1 { min-width:9em; }
main { display:grid; grid-template-columns:1fr minmax(15em, 21em); gap:var(--gut); }
main.full { grid-template-columns:1fr; }
.side { display:flex; flex-direction:column; gap:.6em; min-height:0; }
.side h2 { margin:.1em 0 .2em; font-size:1.1em; }
.side .list { display:flex; flex-direction:column; gap:.45em; overflow:auto; min-height:0; padding:3px; }
.ev { display:grid; grid-template-columns:.35em 1fr; gap:.15em .7em; padding:.55em .8em; border-radius:12px; background:var(--panel); border:1px solid var(--line); text-align:left; width:100%; }
.ev .bar { grid-row:span 3; border-radius:4px; background:var(--c, var(--ember)); }
.ev .tt { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; gap:.4em; align-items:center; }
.ev .tt svg { width:.9em; height:.9em; color:var(--muted); flex:none; }
.ev .wh, .ev .lo { color:var(--muted); font-size:.8em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Month */
.month { display:grid; grid-template-rows:auto 1fr; height:100%; min-height:0; }
.dow { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; color:var(--muted); font-size:.8em; padding:0 4px .3em; text-align:center; }
.cells { display:grid; grid-template-columns:repeat(7, 1fr); grid-template-rows:repeat(6, 1fr); gap:4px; min-height:0; padding:4px; }
.cell { border-radius:12px; background:var(--panel); border:1px solid var(--line); padding:.3em .4em; text-align:left; overflow:hidden; display:flex; flex-direction:column; gap:2px; min-height:0; }
.cell.out { background:var(--bg2); opacity:.6; }
.cell.sel { border-color:#7a5236; background:var(--panel2); }
.cell .dn { font-size:.85em; font-weight:600; display:inline-grid; place-items:center; min-width:1.8em; height:1.8em; border-radius:50%; }
.cell.today .dn { background:var(--ember); color:var(--ink); }
.pill { font-size:.7em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:.05em .4em; border-radius:6px; background:color-mix(in srgb, var(--c, var(--ember)) 22%, transparent); color:var(--text); }
.pill.all { background:var(--c, var(--ember)); color:var(--ink); font-weight:600; }
.pill.more { background:none; color:var(--muted); }

/* Week / day */
.tg { display:grid; grid-template-rows:auto auto 1fr; height:100%; min-height:0; }
.tg .heads, .tg .alld { display:grid; grid-template-columns:3.6em repeat(var(--n), 1fr); gap:4px; }
.tg .head { text-align:center; padding:.3em; border-radius:10px; }
.tg .head .d { font-size:1.4em; font-weight:600; }
.tg .head.today .d { color:var(--ember); }
.tg .head.sel { background:var(--panel2); }
.tg .alld { padding:.2em 0; border-bottom:1px solid var(--line); min-height:1.8em; }
.tg .alld .col { display:flex; flex-direction:column; gap:2px; }
.tg .body { overflow:auto; min-height:0; position:relative; scrollbar-width:thin; scrollbar-color:var(--panel3) transparent; }
.tg .grid { display:grid; grid-template-columns:3.6em repeat(var(--n), 1fr); gap:0 4px; position:relative; height:calc(24 * var(--hh)); }
.tg .hours { position:relative; }
.tg .hours span { position:absolute; right:.4em; transform:translateY(-50%); font-size:.72em; color:var(--faint); }
.tg .day { position:relative; border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hh) - 1px), rgba(255,255,255,.05) calc(var(--hh) - 1px), rgba(255,255,255,.05) var(--hh)); }
.tg .blk { position:absolute; border-radius:8px; padding:.2em .4em; font-size:.75em; overflow:hidden; text-align:left;
  background:color-mix(in srgb, var(--c, var(--ember)) 30%, var(--panel)); border-left:3px solid var(--c, var(--ember)); }
.tg .blk b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tg .blk span { color:var(--muted); }
.tg .nowline { position:absolute; left:0; right:0; height:2px; background:var(--danger); z-index:2; }
.tg .nowline::before { content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--danger); }

/* Agenda */
.agenda { overflow:auto; height:100%; padding:3px; }
.agenda h3 { margin:1em 0 .4em; font-size:.95em; color:var(--muted); font-weight:600; }
.agenda h3.today { color:var(--ember); }
.agenda .evs { display:flex; flex-direction:column; gap:.45em; }

.form-grid { display:grid; grid-template-columns:auto 1fr; gap:.5em 1em; align-items:center; }
.form-grid > label { color:var(--muted); font-size:.85em; }
.det dt { color:var(--muted); font-size:.82em; margin-top:.6em; }
.det dd { margin:0; white-space:pre-wrap; user-select:text; -webkit-user-select:text; }
.subs { display:flex; flex-direction:column; gap:.5em; margin:.6em 0; }
.sub { display:grid; grid-template-columns:.9em 1fr auto; gap:.2em .8em; align-items:center; }
.sub .dot { width:.9em; height:.9em; border-radius:50%; background:var(--c); grid-row:span 2; }
.sub .e { color:var(--danger); font-size:.8em; grid-column:2 / 4; }
.files { display:flex; flex-direction:column; gap:.4em; max-height:40vh; overflow:auto; padding:3px; }
@media (max-width: 820px) { main { grid-template-columns:1fr; } .side { display:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Calendar</h1>
    <button class="btn round f" data-act="prev" aria-label="Previous"></button>
    <button class="btn f" data-act="today">Today</button>
    <button class="btn round f" data-act="next" aria-label="Next"></button>
    <span class="spacer"></span>
    <div class="tabs" id="views">
      <button class="tab f" data-view="month">Month</button><button class="tab f" data-view="week">Week</button><button class="tab f" data-view="day">Day</button><button class="tab f" data-view="agenda">Agenda</button>
    </div>
    <button class="btn primary f" data-act="new" id="newbtn"></button>
    <button class="btn round f" data-act="menu" aria-label="More" id="menubtn"></button>
  </header>
  <main id="main">
    <section id="view" style="min-height:0"></section>
    <aside class="side" id="side"></aside>
  </main>
  <footer><span><b>A</b>Open</span><span><b>B</b>Back</span><span><b>X</b>New event</span><span><b>Y</b>Today</span><span><b>LB</b><b>RB</b>Previous / next</span><span><b>Start</b>Import, export, subscribe</span></footer>
</div>
<div id="layer"></div>
<script src="hearth.js"></script>
<script>
'use strict';
const { $, $$, esc, icon, invoke, pad2, ymd, parseYmd } = H;
const S = { view: 'month', cur: new Date(), occ: [], subs: [], settings: { weekStart: 1, defaultReminder: 10 }, loading: 0 };
S.cur.setHours(0, 0, 0, 0);
try { const v = localStorage.getItem('cal.view'); if (v) S.view = v; } catch { }
$('[data-act="prev"]').innerHTML = icon('back'); $('[data-act="next"]').innerHTML = icon('fwd');
$('#newbtn').innerHTML = `${icon('plus')}New event`; $('#menubtn').innerHTML = icon('menu');

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => ymd(a) === ymd(b);
const weekStartOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() - (S.settings.weekStart ?? 1) + 7) % 7)); return x; };
function range() {
  if (S.view === 'month') { const f = new Date(S.cur.getFullYear(), S.cur.getMonth(), 1); const s = weekStartOf(f); return [s, addDays(s, 42)]; }
  if (S.view === 'week') { const s = weekStartOf(S.cur); return [s, addDays(s, 7)]; }
  if (S.view === 'day') return [new Date(S.cur), addDays(S.cur, 1)];
  return [new Date(S.cur), addDays(S.cur, 60)];
}
const onDay = (d) => { const k = ymd(d); return S.occ.filter(o => o.date <= k && o.lastDate >= k); };
const colorOf = o => o.color || 'var(--ember)';
const timeText = o => o.allDay ? 'All day' : `${H.fmtTime(o.start)} – ${H.fmtTime(o.end)}`;

async function load() {
  const [a, b] = range();
  const n = ++S.loading;
  try {
    const occ = await invoke('cal_range', { from: a.getTime(), to: b.getTime() });
    if (n !== S.loading) return;
    S.occ = occ || [];
  } catch (e) { H.toast(String(e)); S.occ = []; }
  render();
}
async function loadMeta() {
  try { const r = await invoke('cal_get'); S.subs = r.subs || []; Object.assign(S.settings, r.settings || {}); } catch { }
}

// ------------------------------------------------------------------------------------------------ drawing
function setView(v, focus = true) {
  S.view = v; try { localStorage.setItem('cal.view', v); } catch { }
  load().then(() => { if (focus) focusCursor(); });
}
function focusCursor() {
  const k = ymd(S.cur);
  ($(`#view [data-date="${k}"]`) || $('#view .f') || $(`[data-view="${S.view}"]`))?.focus({ preventScroll: S.view !== 'agenda' });
}
function render() {
  $$('#views .tab').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  const c = S.cur;
  $('#title').textContent = S.view === 'month' ? `${H.MONTHS[c.getMonth()]} ${c.getFullYear()}`
    : S.view === 'week' ? (() => { const s = weekStartOf(c), e = addDays(s, 6); return s.getMonth() === e.getMonth() ? `${H.MONTHS[s.getMonth()]} ${s.getFullYear()}` : `${H.MONTHS[s.getMonth()].slice(0, 3)} – ${H.MONTHS[e.getMonth()].slice(0, 3)} ${e.getFullYear()}`; })()
    : S.view === 'day' ? H.fmtDate(c, { year: true }) : 'Coming up';
  const keep = document.activeElement?.dataset?.date || document.activeElement?.dataset?.key;
  $('#main').classList.toggle('full', S.view !== 'month');
  ({ month: drawMonth, week: () => drawTime(7), day: () => drawTime(1), agenda: drawAgenda })[S.view]();
  drawSide();
  if (keep && $('#view').contains(document.activeElement) === false && document.activeElement === document.body) {
    $(`#view [data-date="${CSS.escape(keep)}"], #view [data-key="${CSS.escape(keep)}"]`)?.focus({ preventScroll: true });
  }
}
function evCard(o) {
  return `<button class="ev f" style="--c:${esc(colorOf(o))}" data-ev="${esc(o.id)}" data-occ="${esc(o.occ)}" data-key="ev:${esc(o.id)}:${esc(o.occ)}">
    <span class="bar"></span><span class="tt">${esc(o.title)}${o.recurring ? icon('repeat') : ''}${o.reminders?.length ? icon('bell') : ''}</span>
    <span class="wh">${esc(timeText(o))}</span>${o.location ? `<span class="lo">${esc(o.location)}</span>` : ''}</button>`;
}
function drawMonth() {
  const [a] = range(); const today = new Date();
  const ws = S.settings.weekStart ?? 1;
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(a, i), list = onDay(d);
    const shown = list.slice(0, 3);
    cells += `<div class="cell f ${d.getMonth() !== S.cur.getMonth() ? 'out' : ''} ${sameDay(d, today) ? 'today' : ''} ${sameDay(d, S.cur) ? 'sel' : ''}" tabindex="0" data-date="${ymd(d)}" role="gridcell" aria-label="${esc(H.fmtDate(d, { year: true }))}">
      <span class="dn">${d.getDate()}</span>${shown.map(o => `<span class="pill ${o.allDay ? 'all' : ''}" style="--c:${esc(colorOf(o))}">${o.allDay ? '' : esc(H.fmtTime(o.start, { noAp: true })) + ' '}${esc(o.title)}</span>`).join('')}${list.length > 3 ? `<span class="pill more">+${list.length - 3} more</span>` : ''}</div>`;
  }
  $('#view').innerHTML = `<div class="month"><div class="dow">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span>${H.DAYS[(ws + i) % 7].slice(0, 3)}</span>`).join('')}</div><div class="cells">${cells}</div></div>`;
}
function drawSide() {
  if (S.view !== 'month') { $('#side').innerHTML = ''; return; }
  const list = onDay(S.cur);
  $('#side').innerHTML = `<h2>${esc(H.fmtDate(S.cur))}</h2>
    <div class="list">${list.length ? list.map(evCard).join('') : '<div class="empty" style="padding:1.2em .5em">Nothing planned</div>'}</div>
    <button class="btn f" data-act="new-on">${icon('plus')}Add an event on this day</button>`;
}
function layoutDay(list, day) {
  // Columns for events that overlap: each goes in the first column free at its start.
  const dayStart = day.getTime(), dayEnd = addDays(day, 1).getTime();
  const items = list.filter(o => !o.allDay).map(o => ({ o, s: Math.max(o.start, dayStart), e: Math.min(Math.max(o.end, o.start + 15 * 60000), dayEnd) })).sort((x, y) => x.s - y.s || y.e - x.e);
  const out = []; let cluster = [], colsEnd = [], clusterEnd = -1;
  const flush = () => { const n = colsEnd.length; cluster.forEach(c => c.n = n); out.push(...cluster); cluster = []; colsEnd = []; };
  for (const it of items) {
    if (it.s >= clusterEnd && cluster.length) flush();
    let col = colsEnd.findIndex(e => e <= it.s);
    if (col < 0) { col = colsEnd.length; colsEnd.push(it.e); } else colsEnd[col] = it.e;
    it.col = col; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  }
  flush();
  return out.map(it => ({ ...it, top: (it.s - dayStart) / 3600000, h: (it.e - it.s) / 3600000 }));
}
function drawTime(n) {
  const start = n === 7 ? weekStartOf(S.cur) : new Date(S.cur);
  const days = [...Array(n)].map((_, i) => addDays(start, i));
  const today = new Date();
  const hh = 'clamp(2.6em, 6vh, 3.6em)';
  const heads = days.map(d => `<button class="head f ${sameDay(d, today) ? 'today' : ''} ${sameDay(d, S.cur) ? 'sel' : ''}" data-date="${ymd(d)}" data-act="pick-day"><div class="muted" style="font-size:.75em">${H.DAYS[d.getDay()].slice(0, 3)}</div><div class="d">${d.getDate()}</div></button>`).join('');
  const alld = days.map(d => `<div class="col">${onDay(d).filter(o => o.allDay).map(o => `<button class="pill all f" style="--c:${esc(colorOf(o))};text-align:left" data-ev="${esc(o.id)}" data-occ="${esc(o.occ)}" data-key="ev:${esc(o.id)}:${esc(o.occ)}:${ymd(d)}">${esc(o.title)}</button>`).join('')}</div>`).join('');
  const cols = days.map(d => {
    const blocks = layoutDay(onDay(d), d).map(it => `<button class="blk f" style="--c:${esc(colorOf(it.o))};top:calc(${it.top} * var(--hh));height:calc(${Math.max(it.h, .4)} * var(--hh) - 2px);left:calc(${it.col / it.n * 100}% + 2px);width:calc(${100 / it.n}% - 4px)" data-ev="${esc(it.o.id)}" data-occ="${esc(it.o.occ)}" data-key="ev:${esc(it.o.id)}:${esc(it.o.occ)}"><b>${esc(it.o.title)}</b><span>${esc(H.fmtTime(it.o.start))}${it.o.location ? ' · ' + esc(it.o.location) : ''}</span></button>`).join('');
    const nl = sameDay(d, today) ? `<div class="nowline" style="top:calc(${(today.getHours() + today.getMinutes() / 60)} * var(--hh))"></div>` : '';
    return `<div class="day" data-day="${ymd(d)}">${blocks}${nl}</div>`;
  }).join('');
  const hours = [...Array(24)].map((_, h) => h ? `<span style="top:calc(${h} * var(--hh))">${H.clock24 ? pad2(h) + ':00' : (h % 12 || 12) + (h < 12 ? ' AM' : ' PM')}</span>` : '').join('');
  $('#view').innerHTML = `<div class="tg" style="--n:${n};--hh:${hh}"><div class="heads"><span></span>${heads}</div><div class="alld"><span class="muted" style="font-size:.7em;align-self:center">all day</span>${alld}</div>
    <div class="body" id="tgbody"><div class="grid"><div class="hours">${hours}</div>${cols}</div></div></div>`;
  const body = $('#tgbody');
  const first = S.occ.filter(o => !o.allDay && days.some(d => o.date === ymd(d))).map(o => new Date(o.start).getHours()).sort((a, b) => a - b)[0];
  const hpx = body.querySelector('.grid').offsetHeight / 24;
  body.scrollTop = Math.max(0, (Math.min(first ?? 8, 8) - .5) * hpx);
  body.addEventListener('dblclick', e => {
    const col = e.target.closest('.day'); if (!col || e.target.closest('.blk')) return;
    const r = col.getBoundingClientRect(); const hour = Math.floor((e.clientY - r.top) / (r.height / 24));
    const d = parseYmd(col.dataset.day); d.setHours(hour, 0, 0, 0); editEvent(null, d);
  });
}
function drawAgenda() {
  const byDay = new Map();
  for (const o of S.occ) { const k = o.date < ymd(S.cur) ? ymd(S.cur) : o.date; if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(o); }
  const keys = [...byDay.keys()].sort();
  const today = ymd(new Date());
  $('#view').innerHTML = `<div class="agenda">${keys.length ? keys.map(k => `<h3 class="${k === today ? 'today' : ''}">${k === today ? 'Today · ' : ''}${esc(H.fmtDate(parseYmd(k)))}</h3><div class="evs">${byDay.get(k).map(evCard).join('')}</div>`).join('')
    : `<div class="empty"><span class="big">${icon('cal')}</span>Nothing in the next 60 days.<br><br><button class="btn primary f" data-act="new">${icon('plus')}New event</button></div>`}</div>`;
}

// ------------------------------------------------------------------------------------------------ the event form
const REPEATS = [['', 'Never'], ['FREQ=DAILY', 'Every day'], ['FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', 'Weekdays'], ['FREQ=WEEKLY', 'Every week'], ['FREQ=WEEKLY;INTERVAL=2', 'Every 2 weeks'], ['FREQ=MONTHLY', 'Every month'], ['FREQ=YEARLY', 'Every year']];
const REMINDERS = [[0, 'At the start'], [5, '5 min'], [10, '10 min'], [15, '15 min'], [30, '30 min'], [60, '1 hour'], [120, '2 hours'], [1440, '1 day'], [10080, '1 week']];
function splitRule(r) {
  if (!r) return { base: '', end: 'never', until: null, count: 10 };
  const parts = r.split(';').filter(p => p);
  const get = k => parts.find(p => p.startsWith(k + '='))?.slice(k.length + 1);
  const base = parts.filter(p => !/^(UNTIL|COUNT)=/.test(p)).join(';');
  const u = get('UNTIL'), c = get('COUNT');
  return { base, end: u ? 'until' : c ? 'count' : 'never', until: u ? new Date(+u.slice(0, 4), +u.slice(4, 6) - 1, +u.slice(6, 8)) : null, count: c ? +c : 10 };
}
H.spinNames.mon = Object.fromEntries(H.MONTHS.map((m, i) => [i + 1, m.slice(0, 3)]));
const dateSpins = (p, d) => `${H.spin(p + 'd', d.getDate(), 1, 31, { cap: 'Day' })}${H.spin('mon', d.getMonth() + 1, 1, 12, { cap: 'Month', names: H.spinNames.mon, pad: 0 }).replace('data-spin="mon"', `data-spin="mon" data-p="${p}"`)}${H.spin(p + 'y', d.getFullYear(), 1970, 2200, { cap: 'Year', wrap: false, pad: 0 })}`;
const timeSpins = (p, d) => `${H.spin(p + 'h', d.getHours(), 0, 23, { cap: 'Hour' })}<span class="sep">:</span>${H.spin(p + 'm', d.getMinutes(), 0, 59, { cap: 'Min', step: 5 })}`;
function readSpins(dlg, p, withTime) {
  const v = n => +$(`[data-spin="${n}"]`, dlg)?.dataset.v;
  const mon = +$(`[data-spin="mon"][data-p="${p}"]`, dlg).dataset.v;
  const y = v(p + 'y'), d = Math.min(v(p + 'd'), new Date(y, mon, 0).getDate());
  return new Date(y, mon - 1, d, withTime ? v(p + 'h') : 0, withTime ? v(p + 'm') : 0);
}
const iso = (d, allDay) => allDay ? ymd(d) : `${ymd(d)}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`;
const fromIso = s => { if (!s) return new Date(); const [a, b] = s.split('T'); const d = parseYmd(a); if (b) { const [h, m] = b.split(':').map(Number); d.setHours(h || 0, m || 0); } return d; };

async function openEvent(id, occ) {
  const o = S.occ.find(x => x.id === id && x.occ === occ) || S.occ.find(x => x.id === id);
  let e = null;
  try { e = await invoke('cal_event', { id }); } catch { }
  if (!e) { H.toast('That event is gone'); load(); return; }
  if (o?.readOnly || e.calendar !== 'local') { showDetails(e, o); return; }
  editEvent(e, null, o);
}
function showDetails(e, o) {
  const sub = S.subs.find(s => s.id === e.calendar);
  const d = H.dialog(`<h2>${esc(e.title || '(No title)')}</h2><dl class="det">
    <dt>When</dt><dd>${esc(o ? (o.allDay ? H.fmtDate(new Date(o.start)) + ' · All day' : H.fmtDate(new Date(o.start)) + ' · ' + timeText(o)) : e.start)}</dd>
    ${e.rrule ? `<dt>Repeats</dt><dd>${esc(REPEATS.find(r => r[0] === splitRule(e.rrule).base)?.[1] || e.rrule)}</dd>` : ''}
    ${e.location ? `<dt>Where</dt><dd>${esc(e.location)}</dd>` : ''}${e.notes ? `<dt>Notes</dt><dd>${esc(e.notes)}</dd>` : ''}
    <dt>Calendar</dt><dd>${esc(sub?.name || 'Subscribed calendar')} (read-only: it comes from the web)</dd></dl>
    <div class="row end"><button class="btn primary f" data-a="close" data-autofocus>Close</button></div>`);
  d.addEventListener('click', ev => { if (ev.target.closest('[data-a="close"]')) H.closeDialog(); });
}
function editEvent(e, at, o) {
  const isNew = !e;
  if (isNew) {
    const s = at ? new Date(at) : (() => { const x = new Date(S.cur); const n = new Date(); x.setHours(sameDay(x, n) ? Math.min(23, n.getHours() + 1) : 9, 0, 0, 0); return x; })();
    e = { id: '', title: '', allDay: false, start: iso(s), end: iso(new Date(s.getTime() + 3600000)), rrule: null, reminders: S.settings.defaultReminder >= 0 ? [S.settings.defaultReminder ?? 10] : [], location: '', notes: '', tz: null, exdates: [] };
  }
  const s = fromIso(e.start), en = fromIso(e.end || e.start);
  const rule = splitRule(e.rrule);
  const known = REPEATS.some(r => r[0] === rule.base);
  const d = H.dialog(`<h2>${isNew ? 'New event' : 'Edit event'}${e.rrule && !isNew ? ' <span class="badge">repeats: changes apply to every time</span>' : ''}</h2>
    <div class="field"><input class="inp f" id="ttl" maxlength="200" placeholder="Title" value="${esc(e.title)}" autocomplete="off"></div>
    <div class="row" style="justify-content:space-between"><span class="label" style="margin:0">All day</span><button class="switch f ${e.allDay ? 'on' : ''}" id="allday" aria-label="All day"></button></div>
    <div class="field"><label>Starts</label><div class="spins">${dateSpins('s', s)}<span class="tpart spins" ${e.allDay ? 'hidden' : ''}>${timeSpins('s', s)}</span></div></div>
    <div class="field"><label>Ends</label><div class="spins">${dateSpins('e', e.allDay ? addDays(en, -1) : en)}<span class="tpart spins" ${e.allDay ? 'hidden' : ''}>${timeSpins('e', en)}</span></div></div>
    <div class="field"><label>Repeats</label><div class="chips" id="rep">${REPEATS.map(([v, l]) => `<button class="chip f ${rule.base === v ? 'on' : ''}" data-rep="${esc(v)}">${l}</button>`).join('')}${known ? '' : `<button class="chip f on" data-rep="${esc(rule.base)}">Custom (from an import)</button>`}</div>
      <div class="chips" id="repend" style="margin-top:.45em" ${rule.base ? '' : 'hidden'}><button class="chip f ${rule.end === 'never' ? 'on' : ''}" data-end="never">Forever</button><button class="chip f ${rule.end === 'count' ? 'on' : ''}" data-end="count">A number of times</button><button class="chip f ${rule.end === 'until' ? 'on' : ''}" data-end="until">Until a date</button></div>
      <div class="spins" id="endcount" style="margin-top:.45em" ${rule.end === 'count' ? '' : 'hidden'}>${H.spin('cnt', rule.count, 2, 999, { cap: 'Times', wrap: false, pad: 0 })}</div>
      <div class="spins" id="enduntil" style="margin-top:.45em" ${rule.end === 'until' ? '' : 'hidden'}>${dateSpins('u', rule.until || addDays(s, 30))}</div></div>
    <div class="field"><label>Remind me</label><div class="chips" id="rem">${REMINDERS.map(([m, l]) => `<button class="chip f ${e.reminders.includes(m) ? 'on' : ''}" data-rem="${m}">${l}${m ? ' before' : ''}</button>`).join('')}</div></div>
    <div class="field"><label for="loc">Where</label><input class="inp f" id="loc" maxlength="200" value="${esc(e.location)}" autocomplete="off"></div>
    <div class="field"><label for="nts">Notes</label><textarea class="inp f" id="nts" rows="3">${esc(e.notes)}</textarea></div>
    <div class="row end">${isNew ? '' : `<button class="btn danger f" data-a="del">${icon('trash')}Delete</button><span class="spacer"></span>`}<button class="btn f" data-a="cancel">Cancel</button><button class="btn primary f" data-a="save">Save</button></div>`, { wide: true });
  if (isNew) $('#ttl', d).focus();
  // Moving the start moves the end with it (same length).
  let len = en.getTime() - s.getTime();
  d.addEventListener('spin', ev => {
    const all = $('#allday', d).classList.contains('on');
    const nm = ev.detail.name, p = nm === 'mon' ? ev.target.dataset.p : nm[0];
    if (p === 's') {
      const ns = readSpins(d, 's', !all), ne = new Date(ns.getTime() + (all ? Math.max(0, len) : len));
      for (const [k, v] of [['ed', ne.getDate()], ['ey', ne.getFullYear()], ['eh', ne.getHours()], ['em', ne.getMinutes()]]) { const el = $(`[data-spin="${k}"]`, d); if (el && +el.dataset.v !== v) { el.dataset.v = v; $('.v', el).textContent = k === 'ey' ? v : pad2(v); } }
      const m = $('[data-spin="mon"][data-p="e"]', d); m.dataset.v = ne.getMonth() + 1; $('.v', m).textContent = H.spinNames.mon[ne.getMonth() + 1];
    } else if (p === 'e') len = readSpins(d, 'e', !all).getTime() - readSpins(d, 's', !all).getTime();
  });
  d.addEventListener('click', async ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'allday') { b.classList.toggle('on'); $$('.tpart', d).forEach(t => t.hidden = b.classList.contains('on')); return; }
    if ('rep' in b.dataset) { $$('#rep .chip', d).forEach(c => c.classList.toggle('on', c === b)); $('#repend', d).hidden = !b.dataset.rep; if (!b.dataset.rep) { $('#endcount', d).hidden = $('#enduntil', d).hidden = true; } return; }
    if (b.dataset.end) { $$('#repend .chip', d).forEach(c => c.classList.toggle('on', c === b)); $('#endcount', d).hidden = b.dataset.end !== 'count'; $('#enduntil', d).hidden = b.dataset.end !== 'until'; return; }
    if ('rem' in b.dataset) { b.classList.toggle('on'); return; }
    if (b.dataset.a === 'cancel') { H.closeDialog(); return; }
    if (b.dataset.a === 'del') { H.closeDialog(); deleteEvent(e, o); return; }
    if (b.dataset.a === 'save') {
      const all = $('#allday', d).classList.contains('on');
      let st = readSpins(d, 's', !all), et = readSpins(d, 'e', !all);
      if (all) et = addDays(et, 1);
      if (et < st) { H.toast('The end is before the start'); return; }
      const base = $('#rep .chip.on', d)?.dataset.rep || '';
      let rrule = base || null;
      if (base) {
        const endKind = $('#repend .chip.on', d)?.dataset.end || 'never';
        if (endKind === 'count') rrule += `;COUNT=${$('[data-spin="cnt"]', d).dataset.v}`;
        if (endKind === 'until') { const u = readSpins(d, 'u', false); rrule += `;UNTIL=${u.getFullYear()}${pad2(u.getMonth() + 1)}${pad2(u.getDate())}T235959`; }
      }
      const ev2 = { ...e, title: $('#ttl', d).value.trim(), allDay: all, start: iso(st, all), end: iso(et, all), rrule, reminders: $$('#rem .chip.on', d).map(c => +c.dataset.rem), location: $('#loc', d).value.trim(), notes: $('#nts', d).value };
      try {
        await invoke('cal_put', { event: ev2 });
        H.closeDialog(); S.cur = new Date(st); S.cur.setHours(0, 0, 0, 0); await load(); focusCursor();
        H.toast(isNew ? 'Event added' : 'Saved');
      } catch (x) { H.toast(String(x)); }
    }
  });
}
async function deleteEvent(e, o) {
  if (e.rrule && o) {
    const d = H.dialog(`<h2>Delete "${esc(e.title || '(No title)')}"</h2><p class="muted">It repeats. Delete just this one, or every time?</p>
      <div class="row end"><button class="btn f" data-a="cancel" data-autofocus>Cancel</button><button class="btn danger f" data-a="one">Only ${esc(H.fmtDate(new Date(o.start), { short: true }))}</button><button class="btn danger f" data-a="all">Every time</button></div>`);
    d.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-a]'); if (!b) return;
      H.closeDialog();
      if (b.dataset.a === 'cancel') return;
      await invoke('cal_delete', { id: e.id, occ: b.dataset.a === 'one' ? o.occ : null }).catch(x => H.toast(String(x)));
      load();
    });
    return;
  }
  if (await H.ask(`Delete "${e.title || '(No title)'}"?`, '', 'Delete', true)) { await invoke('cal_delete', { id: e.id, occ: null }).catch(x => H.toast(String(x))); load(); }
}

// ------------------------------------------------------------------------------------------------ import, export, subscribe
function menu() {
  const d = H.dialog(`<h2>Calendars</h2><div class="chips" style="flex-direction:column">
    <button class="chip f" data-m="import">${icon('import')} Import an .ics file<small>Add the events in a calendar file to yours</small></button>
    <button class="chip f" data-m="export">${icon('export')} Export to an .ics file<small>Your events, for another calendar app or a backup</small></button>
    <button class="chip f" data-m="subscribe">${icon('link')} Subscribe to a calendar<small>An online .ics address (holidays, a team, a sports schedule); kept up to date</small></button>
    <button class="chip f" data-m="subs">${icon('cal')} Subscribed calendars<small>${S.subs.length ? S.subs.length + ' subscribed' : 'None yet'}</small></button>
    <button class="chip f" data-m="week">${icon('cal')} Weeks start on ${S.settings.weekStart === 0 ? 'Sunday' : 'Monday'}<small>Choose to switch to ${S.settings.weekStart === 0 ? 'Monday' : 'Sunday'}</small></button>
  </div><div class="row end"><button class="btn f" data-m="close">Close</button></div>`);
  d.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const m = b.dataset.m;
    if (m === 'close') return H.closeDialog();
    if (m === 'import') return importDialog();
    if (m === 'subscribe') return subscribeDialog();
    if (m === 'subs') return subsDialog();
    if (m === 'week') { S.settings.weekStart = S.settings.weekStart === 0 ? 1 : 0; await invoke('cal_settings', { settings: { weekStart: S.settings.weekStart } }).catch(() => { }); H.closeDialog(); load(); return; }
    if (m === 'export') { H.closeDialog(); try { const p = await invoke('cal_export'); H.toast(`Saved to ${p}`, 6000); } catch (x) { H.toast(String(x)); } }
  });
}
async function importDialog() {
  let files = [];
  try { files = await invoke('cal_ics_files'); } catch { }
  const d = H.dialog(`<h2>Import an .ics file</h2>
    ${files.length ? `<p class="muted">Calendar files in your Downloads, Documents and Desktop:</p><div class="files">${files.map(f => `<button class="card f" data-path="${esc(f.path)}"><b>${esc(f.name)}</b> <span class="muted">· ${esc(f.folder || '')} · ${esc(H.ago(f.modified))}</span></button>`).join('')}</div>`
    : '<p class="muted">No .ics files in your Downloads, Documents or Desktop folders.</p>'}
    <div class="row end"><label class="btn f" tabindex="0" id="pick">${icon('folder')}Choose a file…<input type="file" accept=".ics,text/calendar" hidden id="file"></label><button class="btn f" data-a="close" data-autofocus>Close</button></div>`);
  const done = r => { H.closeDialog(); H.toast(`Imported: ${r.added} new${r.updated ? `, ${r.updated} updated` : ''}`); load(); };
  d.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') return H.closeDialog();
    if (b.dataset.path) { try { done(await invoke('cal_import_file', { path: b.dataset.path })); } catch (x) { H.toast(String(x)); } }
  });
  $('#pick', d).addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file', d).click(); } });
  $('#file', d).addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try { done(await invoke('cal_import_text', { text: await f.text() })); } catch (x) { H.toast(String(x)); }
  });
}
function subscribeDialog() {
  const d = H.dialog(`<h2>Subscribe to a calendar</h2><p class="muted">Paste the calendar's address (it ends in .ics, or starts with webcal://). Calendar downloads it now and every few hours; its events show read-only.</p>
    <div class="field"><label for="url">Address</label><input class="inp f" id="url" placeholder="https://example.com/calendar.ics" spellcheck="false" autocomplete="off"></div>
    <div class="field"><label for="nm">Name</label><input class="inp f" id="nm" placeholder="Holidays" maxlength="60" autocomplete="off"></div>
    <div class="row end"><button class="btn f" data-a="close">Cancel</button><button class="btn primary f" data-a="go">Subscribe</button></div>`);
  d.addEventListener('click', async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'close') return H.closeDialog();
    b.disabled = true; b.textContent = 'Downloading…';
    try { await invoke('cal_subscribe', { url: $('#url', d).value, name: $('#nm', d).value }); H.closeDialog(); H.toast('Subscribed'); await loadMeta(); load(); }
    catch (x) { H.toast(String(x), 5000); b.disabled = false; b.textContent = 'Subscribe'; }
  });
}
function subsDialog() {
  const d = H.dialog(`<h2>Subscribed calendars</h2><div class="subs">${S.subs.length ? S.subs.map(s => `<div class="card sub" style="--c:${esc(s.color)}"><span class="dot"></span><div><b>${esc(s.name)}</b><div class="muted" style="font-size:.78em;word-break:break-all">${esc(s.url.replace(/^(https?:\/\/[^/]+).*/, '$1/…'))} · ${s.updated ? 'updated ' + esc(H.ago(s.updated)) : 'not downloaded yet'}</div></div>
      <div class="row"><button class="btn f" data-hide="${esc(s.id)}">${s.hidden ? 'Show' : 'Hide'}</button><button class="btn danger f" data-del="${esc(s.id)}">${icon('trash')}</button></div>${s.error ? `<div class="e">${esc(s.error)}</div>` : ''}</div>`).join('') : '<div class="empty">No subscriptions yet</div>'}</div>
    <div class="row end"><button class="btn f" data-a="refresh">${icon('refresh')}Refresh now</button><button class="btn primary f" data-a="close" data-autofocus>Done</button></div>`, { wide: true });
  d.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') { H.closeDialog(); return; }
    if (b.dataset.a === 'refresh') { b.disabled = true; try { S.subs = await invoke('cal_refresh'); } catch (x) { H.toast(String(x)); } H.closeDialog(); subsDialog(); load(); return; }
    if (b.dataset.hide) { const s = S.subs.find(x => x.id === b.dataset.hide); await invoke('cal_sub_set', { id: s.id, hidden: !s.hidden }).catch(() => { }); }
    if (b.dataset.del && await H.ask('Unsubscribe?', 'Its events leave your calendar.', 'Unsubscribe', true)) await invoke('cal_unsubscribe', { id: b.dataset.del }).catch(() => { });
    await loadMeta(); load(); if (b.dataset.hide || b.dataset.del) { H.closeDialog(); subsDialog(); }
  });
}

// ------------------------------------------------------------------------------------------------ moving around
function shift(n) {
  if (S.view === 'month') S.cur = new Date(S.cur.getFullYear(), S.cur.getMonth() + n, Math.min(S.cur.getDate(), 28));
  else S.cur = addDays(S.cur, n * (S.view === 'week' ? 7 : S.view === 'day' ? 1 : 30));
  load().then(focusCursor);
}
function goToday() { S.cur = new Date(); S.cur.setHours(0, 0, 0, 0); load().then(focusCursor); }
function selectDay(k, redraw = true) {
  const d = parseYmd(k);
  const monthChanged = d.getMonth() !== S.cur.getMonth() || d.getFullYear() !== S.cur.getFullYear();
  S.cur = d;
  if (S.view === 'month' && monthChanged) { load().then(focusCursor); return; }
  if (redraw) { $$('.cell.sel, .head.sel').forEach(c => c.classList.remove('sel')); $$(`[data-date="${k}"]`).forEach(c => c.classList.add('sel')); drawSide(); }
}
H.onMove = (dir, cur) => {
  if (S.view !== 'month' || !cur?.classList.contains('cell')) return false;
  const d = parseYmd(cur.dataset.date);
  const i = $$('.cell').indexOf(cur), col = i % 7, row = Math.floor(i / 7);
  if (dir === 'up' && row === 0) return false;
  if (dir === 'right' && col === 6) return false;
  const nd = addDays(d, { left: -1, right: 1, up: -7, down: 7 }[dir]);
  const k = ymd(nd), el = $(`.cell[data-date="${k}"]`);
  if (el && !el.classList.contains('out')) { el.focus(); selectDay(k); }
  else selectDay(k);
  return true;
};
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.classList?.contains('cell') && el.dataset.date !== ymd(S.cur)) selectDay(el.dataset.date);
});
document.addEventListener('click', e => {
  if (H.dialogOpen() && e.target.closest('#layer')) return;
  const v = e.target.closest('[data-view]'); if (v) { setView(v.dataset.view); return; }
  const ev = e.target.closest('[data-ev]'); if (ev) { openEvent(ev.dataset.ev, ev.dataset.occ); return; }
  const cell = e.target.closest('.cell');
  if (cell) { selectDay(cell.dataset.date); cell.focus({ preventScroll: true }); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'prev': shift(-1); break;
    case 'next': shift(1); break;
    case 'today': goToday(); break;
    case 'new': editEvent(null); break;
    case 'new-on': editEvent(null); break;
    case 'menu': menu(); break;
    case 'pick-day': selectDay(b.dataset.date); if (S.view === 'week') { /* stays */ } break;
  }
});
document.addEventListener('dblclick', e => { const cell = e.target.closest('.cell'); if (cell) { selectDay(cell.dataset.date, false); const d = parseYmd(cell.dataset.date); d.setHours(9); editEvent(null, d); } });
document.addEventListener('keydown', e => {
  // Enter on a day: its day view.
  if (e.key === 'Enter' && document.activeElement?.classList.contains('cell') && !H.dialogOpen()) { e.preventDefault(); e.stopImmediatePropagation(); selectDay(document.activeElement.dataset.date, false); setView('day'); }
}, true);
H.buttons.x = () => { if (!H.dialogOpen()) editEvent(null); };
H.buttons.y = () => { if (!H.dialogOpen()) goToday(); };
H.buttons.lb = () => { if (!H.dialogOpen()) shift(-1); };
H.buttons.rb = () => { if (!H.dialogOpen()) shift(1); };
H.buttons.start = () => { if (!H.dialogOpen()) menu(); };
H.buttons.select = () => { if (!H.dialogOpen()) { const v = ['month', 'week', 'day', 'agenda']; setView(v[(v.indexOf(S.view) + 1) % 4]); } };
H.onBack = () => { if (S.view === 'day' || S.view === 'week') setView('month'); else if (!sameDay(S.cur, new Date())) goToday(); else invoke('quit'); };
H.onKey = e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return false;
  const k = e.key.toLowerCase();
  const views = { m: 'month', w: 'week', d: 'day', a: 'agenda' };
  if (views[k]) { setView(views[k]); return true; }
  if (k === 't') { goToday(); return true; }
  if (k === 'n' || k === '+') { editEvent(null); return true; }
  if (k === 'pageup') { shift(-1); return true; }
  if (k === 'pagedown') { shift(1); return true; }
  return false;
};
window.addEventListener('focus', () => { if (!H.dialogOpen()) load(); });
setInterval(() => { if (!H.dialogOpen() && document.visibilityState === 'visible' && S.view !== 'agenda') { const n = $('.nowline'); if (n) { const t = new Date(); n.style.top = `calc(${t.getHours() + t.getMinutes() / 60} * var(--hh))`; } } }, 60000);

// ------------------------------------------------------------------------------------------------ start
loadMeta().then(() => setView(S.view));

// ------------------------------------------------------------------------------------------------ sample data (no app)
window.DEMO = (() => {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const at = (dd, h, m = 0) => { const x = addDays(t, dd); x.setHours(h, m, 0, 0); return x; };
  const ev = [];
  const add = (id, title, s, e, more = {}) => ev.push({ id, calendar: 'local', title, start: s, end: e, allDay: false, reminders: [10], location: '', notes: '', rrule: null, exdates: [], ...more });
  add('e1', 'Standup', iso(at(0, 9, 30)), iso(at(0, 9, 45)), { rrule: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR' });
  add('e2', 'Dentist', iso(at(0, 15)), iso(at(0, 16)), { location: 'Smile Clinic', reminders: [60] });
  add('e3', 'Raid night', iso(at(2, 20)), iso(at(2, 23)), { notes: 'Bring potions' });
  add('e4', 'Lunch with Sam', iso(at(1, 12, 30)), iso(at(1, 13, 30)));
  add('e5', 'Mum\'s birthday', ymd(addDays(t, 5)), ymd(addDays(t, 6)), { allDay: true, rrule: 'FREQ=YEARLY' });
  add('e6', 'Code review', iso(at(0, 15, 30)), iso(at(0, 16, 30)));
  add('e7', 'Holiday', ymd(addDays(t, 12)), ymd(addDays(t, 15)), { allDay: true, calendar: 'sub1', color: '#9bd36a' });
  const expand = (from, to) => {
    const out = [];
    for (const e of ev) {
      const s0 = fromIso(e.start), e0 = fromIso(e.end), len = e0 - s0;
      const starts = [];
      if (!e.rrule) starts.push(s0);
      else for (let i = -400; i < 400; i++) {
        const s = new Date(s0);
        if (e.rrule.startsWith('FREQ=YEARLY')) s.setFullYear(s0.getFullYear() + Math.floor(i / 100)); else s.setDate(s0.getDate() + i);
        if (e.rrule.includes('BYDAY=MO,TU,WE,TH,FR') && (s.getDay() === 0 || s.getDay() === 6)) continue;
        if (e.rrule.startsWith('FREQ=YEARLY') && i % 100) continue;
        starts.push(s);
      }
      for (const s of starts) {
        const a = s.getTime(), b = a + len;
        if (a < to && b > from) out.push({ id: e.id, calendar: e.calendar, title: e.title, location: e.location, notes: e.notes, allDay: e.allDay, start: a, end: b, date: ymd(s), lastDate: ymd(new Date(b - (e.allDay ? 86400000 : 1))), occ: iso(s, e.allDay), recurring: !!e.rrule, readOnly: e.calendar !== 'local', color: e.color || '', reminders: e.reminders });
      }
    }
    return out.sort((x, y) => x.start - y.start);
  };
  return (cmd, a) => {
    switch (cmd) {
      case 'cal_get': return { settings: { weekStart: 1, defaultReminder: 10 }, subs: [{ id: 'sub1', name: 'Holidays', url: 'https://example.com/holidays.ics', color: '#9bd36a', updated: Date.now() - 3600000, error: '' }], mtime: 1 };
      case 'cal_range': return expand(a.from, a.to);
      case 'cal_event': return ev.find(e => e.id === a.id) || null;
      case 'cal_put': { const e = { ...a.event, id: a.event.id || 'n' + Date.now() }; const i = ev.findIndex(x => x.id === e.id); if (i >= 0) ev[i] = e; else ev.push(e); return e; }
      case 'cal_delete': { const i = ev.findIndex(x => x.id === a.id); if (i >= 0) ev.splice(i, 1); return true; }
      case 'cal_ics_files': return [{ path: '/home/you/Downloads/school-term.ics', name: 'school-term.ics', folder: 'Downloads', modified: Date.now() - 7200000 }];
      case 'cal_import_file': case 'cal_import_text': return { added: 12, updated: 0 };
      case 'cal_export': return '/home/you/Documents/Hearth Calendar.ics';
      case 'cal_settings': case 'cal_sub_set': case 'cal_unsubscribe': case 'quit': return null;
      case 'cal_refresh': return [];
      case 'cal_subscribe': throw 'This is a preview: open Calendar to subscribe.';
    }
    throw new Error('unknown ' + cmd);
  };
})();
