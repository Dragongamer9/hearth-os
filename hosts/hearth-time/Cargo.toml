[package]
name = "hearth-time"
version = "0.1.0"
edition = "2021"
description = "Hearth Clock, Calendar, Notes and Weather: four everyday apps for Hearth OS in one program"
license = "GPL-3.0-or-later"

# One program, four apps: `hearth-time --app clock|calendar|notes|weather` (or started as hearth-clock,
# hearth-calendar, hearth-notes, hearth-weather: links to it). `--service` is the small background part that rings
# alarms and timers, shows calendar reminders and keeps the weather summary fresh while the apps are closed.
# Everything that doesn't need a window is the library, so the tests drive it directly.
[lib]
name = "hearth_time"
path = "src/lib.rs"

[[bin]]
name = "hearth-time"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
dirs = "5"
base64 = "0.22"

# Linux: notifications go to the desktop's notification service over D-Bus (Hearth's taskbar shows them, and
# keeps them quiet in Do not disturb).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
