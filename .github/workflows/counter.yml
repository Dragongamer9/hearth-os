# Deploys the player counter (counter/) to Cloudflare Workers. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets. Creates the D1 database the first time.
name: Player counter

on:
  workflow_dispatch:
  push:
    branches: [main, linux-host]
    paths: ['counter/**', '.github/workflows/counter.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        working-directory: counter
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first"; exit 1; }
          npm install --no-save --no-audit --no-fund wrangler@4.20.0 >/dev/null
          W="npx wrangler"
          id=$($W d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='hearth-counter'), ''))")
          if [ -z "$id" ]; then
            $W d1 create hearth-counter
            id=$($W d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='hearth-counter'), ''))")
          fi
          sed -i "s/FILLED_IN_BY_CI/$id/" wrangler.toml
          $W d1 execute hearth-counter --remote --file schema.sql
          $W deploy 2>&1 | tee /tmp/deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "::notice::Counter is at $url (stats: $url/v1/stats)"
          [ -n "$url" ] && curl -fsS "$url/v1/stats" && echo
