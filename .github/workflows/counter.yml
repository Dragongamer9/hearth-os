# Deploys the player counter (counter/) to Cloudflare Workers. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets. Creates the D1 database the first time.
name: Player counter

on:
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset the player counts (type "reset" to clear every device seen; logs and votes stay)'
        required: false
        default: ''
  push:
    branches: [main, linux-host]
    paths: ['counter/**', '.github/workflows/counter.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy
        working-directory: counter
        run: |
          set -uo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first"; exit 1; }
          # Tidy up pasted secrets (stray spaces, new lines, a "Bearer " prefix) and check their shape without printing them.
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]"' | sed 's/^Bearer//I'); export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]"'); export CLOUDFLARE_ACCOUNT_ID
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          tl=${#CLOUDFLARE_API_TOKEN}; al=${#CLOUDFLARE_ACCOUNT_ID}
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || echo "::error title=Account ID::CLOUDFLARE_ACCOUNT_ID doesn't look like an account ID (expected 32 letters/numbers, got $al characters)"
          [[ "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]{30,}$ ]] || echo "::error title=API token::CLOUDFLARE_API_TOKEN doesn't look like an API token ($tl characters, should be about 40 letters/numbers)"
          [ "$CLOUDFLARE_API_TOKEN" = "$CLOUDFLARE_ACCOUNT_ID" ] && echo "::error title=Secrets::Both secrets hold the same value"
          # Every step's output goes into an annotation if it fails, so the error is visible on the run page.
          step() { local name="$1"; shift; if ! "$@" > /tmp/out.log 2>&1; then echo "::error title=$name::$(tail -c 1500 /tmp/out.log | tr '\n' ' ')"; cat /tmp/out.log; exit 1; fi; cat /tmp/out.log; }
          step "npm install" npm install --no-save --no-audit --no-fund wrangler@4.20.0
          W="npx wrangler"
          findid() { $W d1 list --json 2>/dev/null | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='hearth-counter'), ''))" 2>/dev/null; }
          step "Check token" $W whoami
          id=$(findid)
          if [ -z "$id" ]; then step "Create database" $W d1 create hearth-counter; id=$(findid); fi
          [ -n "$id" ] || { echo "::error::Could not find or create the hearth-counter database"; exit 1; }
          sed -i "s/FILLED_IN_BY_CI/$id/" wrangler.toml
          step "Create table" $W d1 execute hearth-counter --remote --yes --file schema.sql
          step "Deploy worker" $W deploy
          if [ "${{ inputs.reset }}" = reset ]; then
            step "Reset player counts" $W d1 execute hearth-counter --remote --yes --command "DELETE FROM pings"
            echo "::notice title=Reset::Player counts cleared (devices count again from their next check-in, about every 10 minutes)"
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/out.log | head -1)
          echo "::notice::Counter is at $url (stats: $url/v1/stats)"
          if [ -n "$url" ]; then sleep 5; echo "::notice::Stats: $(curl -fsS "$url/v1/stats" || echo unavailable)"; fi
