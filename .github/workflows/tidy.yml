# Quick tidiness checks (tools/tidy-check.py, 1.13): Settings' search index up to date, no roadmap item listed twice,
# no test that only passes on one machine (a fixed home folder), and every commit not yet on main is the owner's
# (tools/attribution-check.py: no AI author or committer, no attribution lines). Seconds, no build; every push.
name: Tidy

on:
  push:
    branches: [bughunt, main, 'feature/**']
  workflow_dispatch:

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history but no old file contents (a full clone of this repository takes more than 5 minutes).
          fetch-depth: 0
          filter: blob:none
      - name: Tidy checks
        run: python3 tools/tidy-check.py
      - name: Every commit is the owner's (not yet on main)
        run: |
          git fetch --no-tags --filter=blob:none origin main:refs/remotes/origin/main 2>/dev/null || true
          python3 tools/attribution-check.py origin/main HEAD
