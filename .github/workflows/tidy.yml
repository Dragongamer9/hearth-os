# Quick tidiness checks (tools/tidy-check.py, 1.13): Settings' search index up to date, no roadmap item listed twice,
# no test that only passes on one machine (a fixed home folder). Seconds, no build.
name: Tidy

on:
  push:
    branches: [bughunt, main, 'feature/**']
    paths: ['docs/ROADMAP.md', 'hosts/linux/desktop/shell/**', 'hosts/linux/test/**', 'tools/**', '.github/workflows/tidy.yml']
  workflow_dispatch:

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tidy checks
        run: python3 tools/tidy-check.py
