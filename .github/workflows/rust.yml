# Hearth's Rust host (moving off Electron): tests hearth-core, builds the Tauri app, and runs it once in a
# virtual screen to check Hearth's screens come up. Screenshots go to the ci/rust-shots branch.
name: Rust host

on:
  push:
    branches: [linux-host]
    paths: ['hosts/hearth-core/**', 'hosts/hearth-rs/**', 'ui/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  # Game Mode › Store: the stores' real public endpoints, asked once each (warn-only: a store changing or
  # rate-limiting an endpoint is a warning, not a failed build). Their answers are kept as a download on the run.
  store-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Ask the stores' public endpoints
        run: python3 tools/store-live-check.py store-live
      # The same stores through Hearth's own code (hosts/hearth-core/src/storefront): what each store page would show.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-core
      - name: Hearth's store pages, from the real stores
        working-directory: hosts/hearth-core
        run: XDG_DATA_HOME="$RUNNER_TEMP/xdg" cargo test --lib storefront::live -- --ignored --nocapture 2>&1 | grep -E '^::(notice|warning)' || echo "::warning title=Store live::the live check didn't run"
      # Also on the ci/store-live branch, to refresh the test samples from (hosts/hearth-core/src/storefront/fixtures).
      - name: Keep the answers (ci/store-live)
        if: always()
        run: |
          git config user.name "Hearth CI"; git config user.email "ci@users.noreply.github.com"
          cp -r store-live /tmp/store-live
          git checkout -q --orphan ci/store-live
          git rm -rfq --cached . >/dev/null
          rm -rf store-live && cp -r /tmp/store-live store-live
          git add -f store-live
          git commit -qm "Store endpoints' answers ($GITHUB_RUN_ID)" && git push -f -q origin HEAD:refs/heads/ci/store-live || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-live
          path: store-live
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hosts/hearth-core
            hosts/hearth-rs
      - name: Test hearth-core
        working-directory: hosts/hearth-core
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test.log; then
            echo "::error title=hearth-core::$( (grep -E -A8 '^(error|---- |thread .* panicked)' test.log | head -60; echo ===; tail -25 test.log) | tr '\n' '|' | cut -c1-3900)"
            exit 1
          fi
          echo "::notice title=hearth-core tests::$(grep -E '^test result' test.log | tr '\n' ' ')"
      - name: WebKit and GTK for the app
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xvfb imagemagick x11-apps x11-utils dbus-x11 xdotool >/dev/null
      - name: Build the app
        working-directory: hosts/hearth-rs
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log || { echo "::error title=Build failed::$(grep -E '^(error|warning: unused)' -A6 build.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          ls -l target/release/hearth
          echo "::notice title=App size::$(du -h target/release/hearth | cut -f1) (the Electron app is about 250 MB)"
      - name: Test the app, and its windowless core for the Chromium window (docs/RENDERERS.md)
        working-directory: hosts/hearth-rs
        run: |
          set -o pipefail
          cargo test --release 2>&1 | tee test.log || { echo "::error title=hearth-rs tests::$(grep -E '^(error|---- |thread .* panicked)' -A8 test.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          # The channel end to end: a page's call in, its reply out (winhost.rs), as the Electron window app does it.
          out=$( (printf '%s\n' '{"t":"page","win":"main","msg":{"type":"call","id":1,"method":"host.info","args":{}}}'; sleep 5) | timeout 25 target/release/hearth --core-stdio 2>/dev/null | head -c 200000 || true)
          echo "$out" | grep -q '"t":"msg"' || { echo "::error title=core-stdio::no reply on the channel: $(echo "$out" | head -c 1500 | tr '\n' '|')"; exit 1; }
          echo "$out" | grep -q '"renderer":"chromium"' || { echo "::error title=core-stdio::host.info didn't say Chromium draws: $(echo "$out" | head -c 1500 | tr '\n' '|')"; exit 1; }
          echo "::notice title=core-stdio::the windowless core answered host.info over the channel"
          # A folder picker left open: the core keeps answering other calls, then answers the first with the choice.
          python3 ../../tools/picker-e2e.py target/release/hearth
      - name: Run it once and take screenshots
        working-directory: hosts/hearth-rs
        run: |
          mkdir -p shots
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # A pretend Steam library, so the screens have games in them.
          s="$HOME/.local/share/Steam"; mkdir -p "$s/steamapps" "$s/config"
          printf '"libraryfolders" { "0" { "path" "%s" } }' "$s" > "$s/steamapps/libraryfolders.vdf"
          for g in "620 Portal 2" "400 Portal" "570 Dota 2"; do set -- $g; id=$1; shift
            printf '"AppState" { "appid" "%s" "name" "%s" "installdir" "%s" "StateFlags" "4" "SizeOnDisk" "1000000000" }' "$id" "$*" "$*" > "$s/steamapps/appmanifest_$id.acf"; done
          # And a big library for the speed test: 400 more games (no pictures, like a fresh library).
          for i in $(seq 100001 100400); do
            printf '"AppState" { "appid" "%s" "name" "Test Game %s" "installdir" "T%s" "StateFlags" "4" "SizeOnDisk" "1000" }' "$i" "$i" "$i" > "$s/steamapps/appmanifest_$i.acf"; done
          # A virtual screen has no graphics card: WebKit draws in software.
          export LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 NO_AT_BRIDGE=1
          HEARTH_PERF_LOG=1 dbus-run-session -- ./target/release/hearth --windowed > run.log 2>&1 &
          for t in 5 12 20; do sleep $((t - ${last:-0})); last=$t; import -window root shots/at-${t}s.png || true; done
          # A few screens: Quick Access (Q), the menu (M), and Settings from it.
          w=$(xdotool search --name '^Hearth$' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true
          xdotool key q; sleep 3; import -window root shots/quick-access.png || true
          xdotool key Escape; sleep 1; xdotool key m; sleep 2; import -window root shots/menu.png || true
          # From the menu: Library (1 down), Downloads (2), Settings (3)
          # (the menu opens on the page you're on: go to its top first)
          for p in "1 library" "2 downloads" "3 friends" "4 settings"; do set -- $p
            xdotool key Escape; sleep 1; xdotool key m; sleep 1.5
            for i in $(seq 8); do xdotool key Up; sleep 0.1; done
            for i in $(seq $1); do xdotool key Down; sleep 0.3; done
            xdotool key Return; sleep 3; import -window root shots/$2.png || true
          done
          xdotool key Escape; sleep 1
          # Speed test: the library with 403 games, moving through it.
          xdotool key Escape; sleep 1; xdotool key m; sleep 1.5
          for i in $(seq 8); do xdotool key Up; sleep 0.1; done
          xdotool key Down; sleep 0.3; xdotool key Return; sleep 4
          xdotool key Down; sleep 0.5   # from the tabs into the games
          for i in $(seq 20); do xdotool key Right; sleep 0.15; done
          for i in $(seq 10); do xdotool key Down; sleep 0.15; done
          sleep 1; import -window root shots/library-big.png || true
          log="$HOME/.local/share/nimbus/bridge.log"
          if [ -f "$log" ]; then
            grep 'perf: ' "$log" | sed 's/.*perf: //' > shots/perf.txt || true
            summary=$(python3 - <<'PY'
          import re,statistics
          rows=[l for l in open('shots/perf.txt') if '(library' in l]
          def stat(kind):
              v=[float(re.search(r' ([\d.]+) ms',l).group(1)) for l in rows if l.startswith(kind)]
              return f"{kind}: {len(v)}x, median {statistics.median(v):.1f} ms, worst {max(v):.1f} ms" if v else f"{kind}: none"
          print(' | '.join([stat('render'), stat('move')]))
          PY
          )
            echo "::notice title=Library speed (403 games)::$summary"
          fi
          xwininfo -root -tree | grep -i hearth | head -5 | sed 's/^/::notice title=Windows::/' || true
          pkill -f target/release/hearth || true
          echo "::notice title=App output::$(tail -c 1500 run.log | tr '\n' '|')"
      - name: Publish the screenshots (ci/rust-shots)
        run: |
          git config user.name "Hearth CI"; git config user.email "ci@users.noreply.github.com"
          cp -r hosts/hearth-rs/shots /tmp/shots
          git checkout --orphan ci/rust-shots
          git rm -rfq --cached . >/dev/null
          rm -rf shots && cp -r /tmp/shots shots
          git add -f shots
          git commit -qm "Rust host screenshots ($GITHUB_RUN_ID)" && git push -f -q origin HEAD:refs/heads/ci/rust-shots || true
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-rust-linux
          path: hosts/hearth-rs/target/release/hearth
