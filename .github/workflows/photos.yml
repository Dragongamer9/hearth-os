# Hearth Photos (hosts/hearth-photos), the picture viewer and editor: tests its library (turning JPEGs without loss,
# thumbnails, saving edits, the Trash), builds it, and runs it under Xvfb against a folder of sample pictures in every
# format: it reports which ones WebKitGTK shows by itself and which are converted (the "formats" notice), and takes
# screenshots of the viewer, the info panel, the strip, slideshow and the editor (in the hearth-photos-linux artifact).
# Linux only for now (Ember/Windows comes later). Release builds are made by base-anatase.yml / base-peppermint.yml.
name: Hearth Photos

on:
  push:
    branches: [main, linux-host, hearth-photos-docs]
    paths: ['hosts/hearth-photos/**', 'hosts/hearth-core/**', '.github/workflows/photos.yml']
  pull_request:
    paths: ['hosts/hearth-photos/**', 'hosts/hearth-core/**', '.github/workflows/photos.yml']
  workflow_dispatch:
    inputs:
      shots:
        description: Put small copies of the screenshots on the run as notices
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hosts/hearth-photos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-photos
      - name: The page's scripts
        run: |
          node --check ui/app.js
          node --check ui/edit.js
          node --check ui/library.js
      - name: WebKit and GTK, and tools for the sample pictures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xvfb imagemagick x11-utils dbus-x11 xdotool ffmpeg libimage-exiftool-perl libheif-examples libheif-plugin-x265 libheif-plugin-libde265 >/dev/null || \
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xvfb imagemagick x11-utils dbus-x11 xdotool libheif-examples >/dev/null
          echo "::notice title=WebKitGTK::$(dpkg-query -W -f '${Version}' libwebkit2gtk-4.1-0 2>/dev/null)"
      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log || { echo "::error title=tests::$(grep -E '^(error|---- |thread .* panicked)' -A10 test.log | head -80 | tr '\n' '|' | cut -c1-3900)"; exit 1; }
          echo "::notice title=tests::$(grep -E '^test result' test.log | tr '\n' ' ')"
      - name: Build
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log || { echo "::error title=build::$(grep -E '^error' -A8 build.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          echo "::notice title=size::$(du -h target/release/hearth-photos | cut -f1)"
          ./target/release/hearth-photos --help
      - name: Sample pictures in every format
        run: |
          d="$RUNNER_TEMP/pics"; mkdir -p "$d"; cd "$d"
          convert -size 1600x1000 gradient:'#ff8a3d-#2a1206' -fill '#ffd166' -draw 'circle 1150,300 1150,420' -fill '#1c1512' -draw 'polygon 0,800 500,420 900,720 1200,500 1600,820 1600,1000 0,1000' \
            -fill white -pointsize 72 -annotate +60+940 'Hearth' base.png
          convert base.png -quality 88 01-photo.jpg
          # A sideways photo: stored wide, EXIF says "turn right" (what phones do).
          convert base.png -rotate -90 -quality 88 02-sideways.jpg && exiftool -q -Orientation=6 -n 02-sideways.jpg 2>/dev/null || python3 - <<'PY' || true
          import struct
          p = '02-sideways.jpg'; b = open(p, 'rb').read()
          app1 = b'\xff\xe1' + struct.pack('>H', 34) + b'Exif\0\0MM\0*\0\0\0\x08\0\x01\x01\x12\0\x03\0\0\0\x01\0\x06\0\0\0\0\0\0'
          open(p, 'wb').write(b[:2] + app1 + b[2:])
          PY
          convert base.png -alpha set -channel A -fx 'i/w' 03-see-through.png
          convert base.png 04-picture.webp
          convert base.png -resize 50% 05-picture.bmp
          convert base.png -compress lzw 06-scan.tif
          convert -delay 40 -size 320x200 xc:'#ff8a3d' xc:'#ffd166' xc:'#6fd08c' -loop 0 07-moving.gif
          cat > 08-drawing.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><rect width="800" height="500" fill="#261d18"/><circle cx="400" cy="250" r="160" fill="#ff8a3d"/><text x="400" y="265" font-size="48" text-anchor="middle" fill="#2a1206" font-family="sans-serif">SVG</text></svg>
          SVG
          (heif-enc -q 80 -o 09-phone.heic 01-photo.jpg >/dev/null 2>&1 || convert base.png 09-phone.heic) || true
          (heif-enc -A -q 70 -o 10-picture.avif 01-photo.jpg >/dev/null 2>&1 || convert base.png 10-picture.avif) || true
          convert base.png -resize 64x64 11-icon.ico
          rm base.png
          ls -la
      - name: Formats (which ones WebKitGTK shows itself, which are converted) and thumbnails
        run: |
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 HEARTH_PHOTOS_CACHE="$RUNNER_TEMP/cache"
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          for f in "$RUNNER_TEMP"/pics/*; do
            if ./target/release/hearth-photos --thumb "$f" "$RUNNER_TEMP/t.png" 2>/dev/null; then echo "thumbnail ok: $(basename "$f")"; else echo "thumbnail FAILED: $(basename "$f")"; fi
          done | tee thumbs.log
          ./target/release/hearth-photos --info "$RUNNER_TEMP/pics/02-sideways.jpg" | tee info.json
          grep -q '"orientation": 6' info.json || echo "::warning title=orientation::the sideways sample's EXIF orientation wasn't read"
          HEARTH_PHOTOS_SELFTEST=1 timeout 120 dbus-run-session -- ./target/release/hearth-photos "$RUNNER_TEMP/pics/01-photo.jpg" > selftest.log 2>&1 || true
          cat selftest.log | tail -40
          grep -q 'SELFTEST done' selftest.log || { echo "::error title=selftest::the page didn't finish: $(tail -c 1500 selftest.log | tr '\n' '|')"; exit 1; }
          echo "::notice title=formats (WebKitGTK $(dpkg-query -W -f '${Version}' libwebkit2gtk-4.1-0))::$(grep '^SELFTEST' selftest.log | sed 's/^SELFTEST //' | tr '\n' '|')"
          echo "::notice title=thumbnails::$(tr '\n' '|' < thumbs.log)"
          ! grep -q 'NOT SHOWN: .*\(jpg\|png\|webp\|gif\|bmp\|tif\|svg\)' selftest.log || { echo "::error title=formats::a common format wasn't shown"; exit 1; }
      - name: Run it (screenshots)
        run: |
          mkdir -p shots
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 HEARTH_PHOTOS_CACHE="$RUNNER_TEMP/cache"
          pgrep Xvfb >/dev/null || { Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 & sleep 2; }
          dbus-run-session -- ./target/release/hearth-photos "$RUNNER_TEMP/pics/01-photo.jpg" > run.log 2>&1 &
          sleep 8
          w=$(xdotool search --name 'Photos' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true
          xdotool windowsize "$w" 1280 800 2>/dev/null || true; sleep 1
          shot() { import -window root "shots/$1.png" || true; }
          shot viewer
          xdotool key Right; sleep 2; shot sideways
          shot info
          xdotool key Right Right Right Right Right Right; sleep 2; shot moving-gif
          xdotool key Right; sleep 2; shot svg
          xdotool key Right; sleep 3; shot heic
          xdotool key Home; sleep 2
          xdotool key plus plus plus; sleep 1; shot zoom
          xdotool key 0 r; sleep 1; shot turned
          xdotool key Escape; xdotool key 0
          xdotool click 1 2>/dev/null; xdotool mousemove 1240 30 click 1; sleep 1; shot menu
          xdotool key Escape; sleep 1
          xdotool key e; sleep 4; shot edit-crop
          xdotool key ctrl+s; sleep 2; shot edit-save
          xdotool key Escape; sleep 1; xdotool key Escape; sleep 1; shot edit-leave
          pkill -f 'target/release/hearth-photos' || true

      # 1.14: faces and what's in a photo (ai/hearth_photos_ai.py): the one-time setup (OpenCV and the small models)
      # and a look at sample pictures, with a face drawn by OpenCV's own test picture when it can be fetched.
      - name: Faces and Found in it (the helper)
        continue-on-error: true
        run: |
          export HEARTH_PHOTOS_AI="$RUNNER_TEMP/ai"; echo "HEARTH_PHOTOS_AI=$HEARTH_PHOTOS_AI" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq python3-venv >/dev/null || true
          python3 ai/hearth_photos_ai.py status
          timeout 900 python3 ai/hearth_photos_ai.py setup | tail -1
          d="$RUNNER_TEMP/aipics"; mkdir -p "$d"
          for u in https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg; do curl -sSfL "$u" -o "$d/$(basename $u)" || true; done
          cp "$RUNNER_TEMP/pics/01-photo.jpg" "$d/"
          [ -f "$d/lena.jpg" ] && cp "$d/lena.jpg" "$d/lena2.jpg"
          python3 -c "import json,os,sys; d=sys.argv[1]; print(json.dumps([{'path': os.path.join(d,f), 'mtime': 1} for f in sorted(os.listdir(d))]))" "$d" > "$RUNNER_TEMP/todo.json"
          timeout 600 python3 ai/hearth_photos_ai.py run "$RUNNER_TEMP/todo.json" > "$RUNNER_TEMP/ai-run.log" 2>&1 || echo "::warning title=faces run::$(tail -c 900 "$RUNNER_TEMP/ai-run.log" | tr '\n' '|')"
          python3 - <<'PY'
          import json, os
          r = json.load(open(os.path.join(os.environ['HEARTH_PHOTOS_AI'], 'results.json')))
          short = {os.path.basename(k): {'tags': v['tags'], 'faces': len(v['faces'])} for k, v in r['photos'].items()}
          short['errors'] = {os.path.basename(k): v for k, v in r.get('errors', {}).items()}
          print('::notice title=found in it::%s groups=%d' % (json.dumps(short), len(r['groups'])))
          PY
          true
        # The helper's own errors, when it didn't get that far.
      - name: Faces helper log
        if: always()
        working-directory: hosts/hearth-photos
        run: |
          d="$RUNNER_TEMP/ai"; [ -d "$d" ] || exit 0
          [ -f "$d/results.json" ] || echo "::warning title=faces helper::no results: $(python3 ai/hearth_photos_ai.py status 2>&1 | tail -c 600)"
          python3 - <<'PY' || true
          print('ok')
          PY

      # 1.14: the library (docs/mockups/next-update/photos-1-library.png) over sample folders: a phone's photos by day,
      # Steam and Game Mode captures, a screenshot and a video; then a photo from it (photos-2).
      - name: The library (screenshots)
        run: |
          set -o pipefail
          L="$RUNNER_TEMP/lib"; P="$RUNNER_TEMP/pics"
          mkdir -p "$L/iPhone/2026/11" "$L/Screenshots/Hearth" "$L/Screenshots" "$L/Steam/userdata/1/760/remote/1245620/screenshots" "$L/Videos" shots
          d0=$(date +%Y%m%d); d1=$(date -d yesterday +%Y%m%d); d3=$(date -d '3 days ago' +%Y%m%d); d40=$(date -d '40 days ago' +%Y%m%d); y1=$(date -d '1 year ago' +%Y%m%d)
          n=0; for f in "$P"/01-photo.jpg "$P"/04-picture.webp "$P"/05-picture.bmp "$P"/02-sideways.jpg "$P"/03-see-through.png; do
            for d in $d0 $d1 $d3 $d40 $y1; do n=$((n+1)); e="${f##*.}"; convert "$f" -modulate 100,100,$((40 + n * 9 % 160)) "$L/iPhone/2026/11/IMG_${d}_1${n}1010.$e"; done
          done
          # Places: some phone photos at a lake near Austin, some in New York.
          for f in "$L"/iPhone/2026/11/IMG_${d1}_*.jpg; do exiftool -q -overwrite_original -GPSLatitude=30.4126 -GPSLatitudeRef=N -GPSLongitude=97.9019 -GPSLongitudeRef=W "$f" || true; done
          for f in "$L"/iPhone/2026/11/IMG_${d40}_*.jpg; do exiftool -q -overwrite_original -GPSLatitude=40.7812 -GPSLatitudeRef=N -GPSLongitude=73.9665 -GPSLongitudeRef=W "$f" || true; done
          cp "$P/01-photo.jpg" "$L/Screenshots/Hearth/Screenshot ${d1:0:4}-${d1:4:2}-${d1:6:2} 20-11-00.png" 2>/dev/null || true
          convert "$P/01-photo.jpg" -modulate 100,60,250 "$L/Steam/userdata/1/760/remote/1245620/screenshots/${d1}193000_1.jpg"
          convert "$P/04-picture.webp" "$L/Screenshots/Screenshot ${d1:0:4}-${d1:4:2}-${d1:6:2} 12-00-00.png"
          (ffmpeg -v error -f lavfi -i testsrc=duration=42:size=640x360:rate=10 -pix_fmt yuv420p "$L/Videos/${d0}_120000.mp4" || true)
          export HEARTH_PHOTOS_ROOTS="$L" HEARTH_PHOTOS_STORE="$RUNNER_TEMP/photos.json" HEARTH_PHOTOS_CACHE="$RUNNER_TEMP/cache2"
          ./target/release/hearth-photos --scan | tee scan.json
          python3 - <<'PY'
          import json
          s = json.load(open('scan.json'))
          k = s['kinds']
          print('::notice title=library scan::%s' % json.dumps({'summary': s['summary'], 'kinds': k}))
          assert s['summary']['count'] >= 25, s
          assert k.get('capture', 0) >= 2 and k.get('screenshot', 0) >= 1, k
          PY
          # A favorite and an album, the way the page saves them (library_change), so the lists show counts.
          echo '{"favorites": [], "albums": []}' > "$HEARTH_PHOTOS_STORE"
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1
          pgrep Xvfb >/dev/null || { Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 & sleep 2; }
          dbus-run-session -- ./target/release/hearth-photos > lib.log 2>&1 &
          sleep 10
          w=$(xdotool search --name 'Photos' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true
          xdotool windowsize "$w" 1280 800 2>/dev/null || true; sleep 2
          shot() { import -window root "shots/$1.png" || true; }
          shot library
          xdotool key Down Return; sleep 3; shot photo
          xdotool key f; sleep 1; shot photo-favorite
          xdotool key Escape; sleep 2; shot library-back
          xdotool mousemove 120 260 click 1; sleep 2; shot library-favorites
          pkill -f 'target/release/hearth-photos' || true; sleep 1
          for v in collections pad; do
            dbus-run-session -- ./target/release/hearth-photos --view $v >> lib.log 2>&1 &
            sleep 9; w=$(xdotool search --name 'Photos' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true; xdotool windowsize "$w" 1280 800 2>/dev/null || true; sleep 4
            shot $v
            if [ $v = collections ]; then xdotool mousemove 800 500 click --repeat 12 --delay 60 5; sleep 3; shot collections-low; fi
            pkill -f 'target/release/hearth-photos' || true; sleep 1
          done
          g=$(ls "$L"/iPhone/2026/11/IMG_${d1}_*.jpg | head -1)
          dbus-run-session -- ./target/release/hearth-photos "$g" >> lib.log 2>&1 &
          sleep 9; w=$(xdotool search --name 'Photos' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true; xdotool windowsize "$w" 1280 800 2>/dev/null || true; sleep 5
          shot photo-place
          xdotool key e; sleep 9; shot edit; pkill -f 'target/release/hearth-photos' || true
          grep -q '"favorites"' "$HEARTH_PHOTOS_STORE" && echo "::notice title=store::$(tr '\n' ' ' < "$HEARTH_PHOTOS_STORE" | cut -c1-600)"
          grep -h JSERROR lib.log run.log | sort -u | head -5 | while read -r l; do echo "::warning title=page error::$l"; done || true
      # The screenshots as notices (artifacts can't be read from here): small copies, one step each (a job keeps 50).
      - name: Screenshot library
        if: always()
        working-directory: hosts/hearth-photos
        run: f=shots/library.png; [ -f "$f" ] && convert "$f" -resize 600x -quality 38 jpg:- | base64 -w0 | fold -w 3800 | nl -ba -w2 -s' ' | head -10 | while read -r i part; do echo "::notice title=SHOT library $i::$part"; done || true
      - name: Screenshot edit
        if: always()
        working-directory: hosts/hearth-photos
        run: f=shots/edit.png; [ -f "$f" ] && convert "$f" -resize 600x -quality 38 jpg:- | base64 -w0 | fold -w 3800 | nl -ba -w2 -s' ' | head -10 | while read -r i part; do echo "::notice title=SHOT edit $i::$part"; done || true
      - name: Screenshot collections
        if: always()
        working-directory: hosts/hearth-photos
        run: f=shots/collections.png; [ -f "$f" ] && convert "$f" -resize 600x -quality 38 jpg:- | base64 -w0 | fold -w 3800 | nl -ba -w2 -s' ' | head -10 | while read -r i part; do echo "::notice title=SHOT collections $i::$part"; done || true
      - name: Screenshot pad
        if: always()
        working-directory: hosts/hearth-photos
        run: f=shots/pad.png; [ -f "$f" ] && convert "$f" -resize 600x -quality 38 jpg:- | base64 -w0 | fold -w 3800 | nl -ba -w2 -s' ' | head -10 | while read -r i part; do echo "::notice title=SHOT pad $i::$part"; done || true
      - name: Screenshot collections-low
        if: always()
        working-directory: hosts/hearth-photos
        run: f=shots/collections-low.png; [ -f "$f" ] && convert "$f" -resize 600x -quality 38 jpg:- | base64 -w0 | fold -w 3800 | nl -ba -w2 -s' ' | head -10 | while read -r i part; do echo "::notice title=SHOT collections-low $i::$part"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-photos-linux
          path: |
            hosts/hearth-photos/target/release/hearth-photos
            hosts/hearth-photos/shots
            hosts/hearth-photos/*.log
