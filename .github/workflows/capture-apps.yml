# Hearth Recorder, Hearth Camera and Hearth Share (hosts/hearth-recorder, hosts/hearth-camera, hosts/hearth-share,
# and what they share: hosts/hearth-media), Hearth OS's own screen recorder, camera and screen sharing. Linux only
# for now (Ember catches up later).
#  - build: unit tests, release builds, the pages checked in a browser, and screenshots of the real windows
#  - e2e: the apps for real in the two editions' own systems, with a screen, PipeWire, a tone and a fake microphone:
#      Fedora (Anatase's base) with labwc headless, as Mantel: wf-recorder, ffmpeg-free's encoders
#      Debian 13 (Peppermint's base) with an X11 screen: ffmpeg's x11grab and libx264
#    Each recording is checked with ffprobe (length, streams, size, not silent).
# Release builds for the images are made by base-anatase.yml and base-peppermint.yml.
name: Hearth Recorder, Camera and Share

on:
  push:
    branches: [apps-capture, main, linux-host]
    paths: ['hosts/hearth-media/**', 'hosts/hearth-recorder/**', 'hosts/hearth-camera/**', 'hosts/hearth-share/**', 'hosts/hearth-core/**', 'tools/capture-apps-check.js', '.github/workflows/capture-apps.yml']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: capture-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hosts/hearth-recorder -> ../../target-capture
      - name: WebKit and GTK
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xvfb imagemagick xdotool ffmpeg >/dev/null
      - name: Unit tests
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-capture"
          for c in hearth-media hearth-recorder hearth-camera hearth-share; do
            [ -f hosts/$c/Cargo.toml ] || continue
            echo "=== $c"
            (cd hosts/$c && cargo test --lib 2>&1 | tee "/tmp/test-$c.log") || { echo "::error title=$c unit tests::$(grep -E '^(error|---- |thread .* panicked|  left|  right)' -A6 /tmp/test-$c.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
            echo "::notice title=$c unit tests::$(grep -E '^test result' /tmp/test-$c.log | tr '\n' ' ')"
          done
      - name: Build
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-capture"
          mkdir -p bin
          for c in hearth-recorder hearth-camera hearth-share; do
            [ -f hosts/$c/Cargo.toml ] || continue
            (cd hosts/$c && cargo build --release 2>&1 | tee "/tmp/build-$c.log") || { echo "::error title=$c build::$(grep -E '^error' -A12 /tmp/build-$c.log | head -80 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
            cp "$CARGO_TARGET_DIR/release/$c" bin/
            echo "::notice title=$c::$(du -h bin/$c | cut -f1)"
          done
          ls -l bin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The pages in a browser
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd .. && node tools/capture-apps-check.js
      - name: Screenshots of the windows
        run: |
          mkdir -p shots
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 HEARTH_CAMERA_TEST=1
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          for c in hearth-recorder hearth-camera hearth-share; do
            [ -x bin/$c ] || continue
            ./bin/$c > "shots/$c.log" 2>&1 &
            sleep 9
            import -window root "shots/window-$c.png" || true
            pkill -f "bin/$c" || true
            sleep 1
            echo "::notice title=$c window output::$(tail -c 800 shots/$c.log | tr '\n' '|')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-apps-linux
          path: |
            bin
            shots

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-wayland
            image: registry.fedoraproject.org/fedora:latest
            kind: wayland
          - name: debian13-x11
            image: docker.io/library/debian:trixie
            kind: x11
    name: e2e (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - name: The edition's own packages
        timeout-minutes: 15
        run: |
          if command -v dnf >/dev/null; then
            # As on Anatase: Cisco's openh264 (Fedora's ffmpeg-free and GStreamer encode H.264 with it).
            dnf -y -q install --skip-unavailable --setopt=fedora-cisco-openh264.enabled=1 openh264 >/dev/null || true
            dnf -y -q install --skip-unavailable --setopt=fedora-cisco-openh264.enabled=1 git python3 webkit2gtk4.1 gtk3 dbus-daemon ffmpeg-free wf-recorder labwc xorg-x11-server-Xwayland foot wlr-randr dejavu-sans-mono-fonts \
              pipewire pipewire-pulseaudio wireplumber pulseaudio-utils pipewire-utils gstreamer1-plugins-good gstreamer1-plugins-bad-free \
              gstreamer1-plugin-openh264 slurp procps-ng libnotify v4l-utils qrencode curl >/dev/null
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates python3 libwebkit2gtk-4.1-0 libgtk-3-0t64 \
              dbus dbus-bin ffmpeg wf-recorder xvfb xterm procps pipewire pipewire-pulse pipewire-bin wireplumber pulseaudio-utils \
              gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-pipewire slurp libnotify-bin v4l-utils qrencode curl >/dev/null
          fi
          useradd -m tester
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: capture-apps-linux
      - name: Recorder, Camera and Share for real
        run: |
          chmod +x bin/* hosts/hearth-media/ci/session.sh
          mkdir -p /tmp/out && chmod 777 /tmp/out
          ldd bin/hearth-recorder | grep 'not found' && echo "::warning::missing libraries above"
          set +e
          status=0
          for t in hosts/hearth-recorder/tests/e2e.sh hosts/hearth-camera/tests/e2e.sh hosts/hearth-share/tests/e2e.sh; do
            [ -f "$t" ] || continue
            runuser -u tester -- env KIND=${{ matrix.kind }} OUT=/tmp/out LOGS=/tmp/out/logs-$(basename $(dirname $(dirname $t))) \
              RECORDER=$PWD/bin/hearth-recorder CAMERA=$PWD/bin/hearth-camera SHARE=$PWD/bin/hearth-share \
              timeout 900 dbus-run-session -- bash hosts/hearth-media/ci/session.sh bash "$t" > /tmp/out/e2e-$(basename $(dirname $(dirname $t))).log 2>&1
            rc=$?
            cat /tmp/out/e2e-$(basename $(dirname $(dirname $t))).log
            echo "::notice title=$(basename $(dirname $(dirname $t))) (${{ matrix.kind }})::finished with exit code $rc"
            [ $rc = 0 ] || status=1
          done
          exit $status
      - name: What the session's programs said (when something failed)
        if: failure()
        run: |
          for f in /tmp/out/logs-*/*.log; do
            [ -s "$f" ] && echo "::notice title=$(basename $(dirname $f))/$(basename $f)::$(tail -c 1200 "$f" | tr '\n' '|')"
          done
          true
      - name: gpu-screen-recorder (Fedora's COPR) is found and set up the way Recorder expects
        if: matrix.kind == 'wayland'
        continue-on-error: true
        run: |
          dnf -y -q install dnf5-plugins >/dev/null 2>&1 || true
          dnf -y copr enable brycensranch/gpu-screen-recorder-git && dnf -y -q install gpu-screen-recorder || { echo "::warning::gpu-screen-recorder couldn't be installed from COPR"; exit 0; }
          gpu-screen-recorder --version 2>&1 | head -2
          gpu-screen-recorder --help 2>&1 | grep -E -- '-w |region|-r |replay' | head -12
          runuser -u tester -- env WAYLAND_DISPLAY=x bin/hearth-recorder --probe | python3 -c 'import json,sys; d=json.load(sys.stdin); print({k: d[k] for k in ("session","gsr","gsrRegion")})'
          getcap /usr/bin/gsr-kms-server 2>/dev/null || echo "gsr-kms-server has no capability set (the images set it)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.name }}
          path: /tmp/out
