# A quick update for one of Hearth's own apps or Mantel (docs/HEARTH-STORE.md, "Quick updates"): built from the
# branch it's run on, put in its own GitHub release (part-<app>-<version>, never marked "latest", so Hearth OS's own
# releases are untouched), and added to the Store's live list on the `store` branch with its SHA-256. Nothing reaches
# a device until "Publish the Hearth Store list" is run (the owner's okay), and then only on the Hearth OS it's for.
# Run by hand only, with the owner's version number (red flag 1).
#
# 1.18 (the owner, Nov 23: "Every thing in Hearth OS that we made Needs to be in the hearth Store"; red flag 13: every
# Hearth app updates both its main and its test version from the Store): every Hearth part is here, each with a main
# and a test channel, built in the image's own base (Debian trixie for Hearth OS on Debian), and the helpers that run
# as root are system parts (hearth-system-part: installed root-owned with the admin password, never into a home
# folder). The boot menu, Safe start and Recovery are never parts: system updates only. From the owner, Nov 26 ("Yep add
# it. That will allow us to push updates to it"): gamescope, the session start and Hearth's own login screen are parts,
# each started on trial with the built-in copy to fall back to (docs/STORE-SYSTEM-PARTS.md "Starting up"); they work
# from the Hearth OS that has those hooks (publish them with that version in "os").
# The Decky plugins' main versions keep their own release (decky-plugins-release.yml, picked up by hearth-decky); their
# test versions come from here, as system parts (root-owned, put in Decky's folder by hearth-decky on trial).
name: Quick update for an app

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which one'
        required: true
        type: choice
        options: [mantel, hearth-files-app, hearth-settings-app, hearth-task-manager, hearth-capture-app, hearth-notes-app,
                  hearth-g15-app, hearth-family-app, hearth-server-app, hearth-resmon-app, hearth-system-restore,
                  hearth-reliability-history, hearth-file-chooser, hearth-pad-host, hearth-store-app, mantel-rust, hearth-ideas-app, hearth-retro-app, hearth-retro-to-steam-app, hearth-studio-app, hearth-beat-maker-app, hearth-game-fixer, hearth-proton-manager, hearth-overlay, hearth-bottles, hearth-3d, hearth-lights-app, hearth-remap-app, hearth-mouse-app, hearth-shield-app, hearth-listen-app, hearth-imagine-app, hearth-passwords-app, hearth-cloud-app, hearth-home-app, hearth-link,
                  hearth-layout, hearth-game-mode, hearth-home-server-helper, hearth-storage-helper, hearth-ai-share-helper,
                  hearth-controller-lab, hearth-saves, hearth-mods, hearth-gamestore, hearth-gamma, hearth-steam,
                  decky-hearth-sync, decky-hearth-link, decky-hearth-music, gamescope, hearth-session, hearth-greeter]
      version:
        description: "Its version (the owner's number, like 1.17.1)"
        required: true
      os:
        description: 'The Hearth OS it is for (like 1.17: fits 1.17 and 1.17.x)'
        required: true
      channel:
        description: 'main (everyone with the app) or test (only with Get test versions on, got by hand)'
        required: false
        type: choice
        options: [main, test]
        default: main
      notes:
        description: "What's new, one line each, separated by |"
        required: false
        default: ''
      missing:
        description: "A test version's Not in it yet, one line each, separated by | (the Store shows it on its page)"
        required: false
        default: ''

permissions:
  contents: write     # the part's release and the store branch

concurrency:
  group: quick-update
  cancel-in-progress: false

jobs:
  part:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP: ${{ inputs.app }}
      VER: ${{ inputs.version }}
      OS: ${{ inputs.os }}
      NOTES: ${{ inputs.notes }}
      MISSING: ${{ inputs.missing }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version and Hearth OS
        run: |
          echo "$VER" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "::error title=Quick update::'$VER' isn't a version like 1.17.1"; exit 1; }
          echo "$OS" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "::error title=Quick update::'$OS' isn't a Hearth OS version like 1.17"; exit 1; }
          case "$APP" in decky-hearth-*)
            [ "$CHANNEL" = test ] || { echo "::error title=Quick update::a Decky plugin's main version comes from Decky plugins release; here only its test version (Channel: test)"; exit 1; } ;;
          esac
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/part-$APP-$VER" >/dev/null 2>&1; then
            echo "::error title=Quick update::$APP $VER is already out; pick another number"; exit 1
          fi
      - uses: actions/setup-dotnet@v4
        if: inputs.app == 'hearth-steam'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        if: startsWith(inputs.app, 'decky-hearth-')
        with:
          node-version: '22'
      - name: Build it
        run: |
          mkdir -p /tmp/part /tmp/out
          if [ "$APP" = mantel ]; then
            test -f hosts/linux/desktop/shell/shell.qml
            cp -a hosts/linux/desktop/shell /tmp/part/shell
            # Mantel reads its looks and sounds next to its own folder (Theme.qml: shellDir/../theme/palettes.json;
            # Sounds.qml: shellDir/../sounds), so they come along; without them every look showed as Hearth's
            # (Mantel 1.17.1 on the owner's dad's PC, Nov 21).
            for d in theme sounds; do cp -a "hosts/linux/desktop/$d" "/tmp/part/$d"; done
            rm -rf /tmp/part/theme/__pycache__
            test -f /tmp/part/theme/palettes.json
            # Build anything needs a newer hearth-layout than the Hearth OS it goes on may have (describe-screen,
            # the blocks your AI makes): Mantel's own copy goes next to it (ScreenLayout.qml uses bin/ first).
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-ui-build.sh 2>&1 | tail -20
            mkdir -p /tmp/part/bin && tar -C /tmp/part/bin -xf /tmp/out/hearth-ui.tar ./hearth-layout && test -x /tmp/part/bin/hearth-layout
            echo "INNER=shell" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-game-mode ]; then
            # Hearth's Game Mode host (hosts/hearth-rs, with the UI built in): /usr/bin/nimbus starts the Store's copy
            # through hearth-part (never as root; one that closes right after starting goes back to the built-in one).
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-rs-part-build.sh 2>&1 | tail -40
            mkdir -p /tmp/part && install -m755 /tmp/out/nimbus /tmp/part/nimbus
            echo "INNER=nimbus" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-home-server-helper ] || [ "$APP" = hearth-storage-helper ] || [ "$APP" = hearth-ai-share-helper ]; then
            # A system part (docs/STORE-SYSTEM-PARTS.md): the helper itself, checked; hearth-system-part installs it
            # root-owned and uses it only when every check passes, else the built-in one.
            src="os/system_files/usr/libexec/nimbus/$APP"
            python3 -m py_compile "$src"
            python3 -c 'import json,sys; assert sys.argv[1] in json.load(open("os/system_files/usr/share/hearth/store/system-parts.json"))["parts"]' "$APP"
            mkdir -p /tmp/part && install -m755 "$src" "/tmp/part/$APP"
            echo "INNER=$APP" >> "$GITHUB_ENV"
          elif [ "$APP" = gamescope ]; then
            # Game Mode's screen (docs/STORE-SYSTEM-PARTS.md "Starting up"): Debian's own gamescope source, the version
            # line the image ships (trixie-backports) or newer, rebuilt with Debian's own options in the image's base,
            # every library it needs checked with ldd. nimbus-session starts it through hearth-part's trial: one that
            # doesn't bring Game Mode up is stopped and the built-in gamescope starts at once, and from then on.
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/gamescope-part-build.sh 2>&1 | tail -40
            mkdir -p /tmp/part && cp -a /tmp/out/gamescope /tmp/part/gamescope && test -x /tmp/part/gamescope/gamescope
            echo "INNER=gamescope/gamescope" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-session ]; then
            # The session start (what opens Game Mode or Desktop Mode after you sign in): nimbus-session itself. The
            # built-in one starts it through hearth-part's trial, and starts itself instead when it doesn't come up.
            src=hosts/linux/session/nimbus-session
            sh -n "$src" && bash -n "$src"
            grep -q '^# >>> session part' "$src" && grep -q '^# >>> gamescope part' "$src"
            mkdir -p /tmp/part && install -m755 "$src" /tmp/part/nimbus-session
            echo "INNER=nimbus-session" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-greeter ]; then
            # Hearth's own login screen (its screens: the greeter's QML and greeter-info), a system part: installed
            # root-owned with the admin password; hearth-login-screen uses it only when hearth-system-part allows it,
            # and one that doesn't show or sign anyone in is left out (SDDM for that start, the built-in greeter next).
            g=os/system_files/usr/share/hearth/greeter
            mkdir -p /tmp/part/greeter/osk
            cp -a "$g/." /tmp/part/greeter/
            # the on-screen keyboard Mantel lends it (as build.sh copies it in)
            cp hosts/linux/desktop/shell/OskBoard.qml hosts/linux/desktop/shell/OskKey.qml /tmp/part/greeter/
            cp hosts/linux/desktop/shell/osk/hearth-osk.js /tmp/part/greeter/osk/
            python3 -m py_compile "$g/greeter-info"
            chmod 755 /tmp/part/greeter/greeter-info
            for f in shell.qml Login.qml Theme.qml greeter-info OskBoard.qml OskKey.qml osk/hearth-osk.js; do test -s "/tmp/part/greeter/$f"; done
            python3 -c 'import json,sys; a=json.load(open("os/system_files/usr/share/hearth/store/system-parts.json"))["parts"]["hearth-greeter"]; [open("/tmp/part/greeter/"+n) for n in a["needs"]]'
            find /tmp/part -name __pycache__ -prune -exec rm -rf {} +
            echo "INNER=greeter" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-controller-lab ] || [ "$APP" = hearth-saves ] || [ "$APP" = hearth-mods ] || [ "$APP" = hearth-gamestore ]; then
            # Hearth's gaming apps (hosts/hearth-gaming): /usr/bin/<app> starts the Store's copy through hearth-part.
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/cargo-part-build.sh hearth-gaming "$APP" webkit 2>&1 | tail -40
            mkdir -p /tmp/part && install -m755 "/tmp/out/$APP" "/tmp/part/$APP"
            echo "INNER=$APP" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-gamma ]; then
            # Desktop Mode's colour filter (hosts/hearth-gamma): /usr/bin/hearth-gamma starts the Store's copy.
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/cargo-part-build.sh hearth-gamma hearth-gamma 2>&1 | tail -40
            mkdir -p /tmp/part && install -m755 /tmp/out/hearth-gamma /tmp/part/hearth-gamma
            echo "INNER=hearth-gamma" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-steam ]; then
            # The lightweight Steam engine (hosts/hearth-steam, self-contained, built as base-peppermint.yml builds it):
            # its user service starts the Store's copy through hearth-part.
            bash hosts/hearth-steam/publish.sh /tmp/part/hearth-steam
            test -x /tmp/part/hearth-steam/hearth-steam
            echo "INNER=hearth-steam/hearth-steam" >> "$GITHUB_ENV"
          elif [ "${APP#decky-hearth-}" != "$APP" ]; then
            # A Decky plugin's test version (a system part): built as decky-plugins-release.yml builds it, with this
            # version in its package.json (its load mark carries it, so hearth-decky's trial knows it loaded).
            test -f "hosts/$APP/package.sh"
            npm install -g pnpm@9 >/dev/null
            ( cd "hosts/$APP"
              sed -i "s/\"version\": \".*\"/\"version\": \"$VER\"/" package.json
              pnpm install --no-frozen-lockfile >/dev/null 2>&1
              pnpm build > /tmp/build.log 2>&1 || { echo "::error title=$APP build::$(tail -30 /tmp/build.log | tr '\n' '|' | cut -c1-3500)"; exit 1; }
              ./package.sh /tmp/pkg )
            for f in plugin.json main.py package.json dist/index.js; do test -s "/tmp/pkg/$APP/$f"; done
            mkdir -p /tmp/part && cp -a "/tmp/pkg/$APP" "/tmp/part/$APP"
            echo "INNER=$APP" >> "$GITHUB_ENV"
          elif [ "$APP" = hearth-link ]; then
            # Hearth Link (1.18: every Hearth part from the Store): its one program; /usr/bin/hearth-link starts the
            # Store's copy through hearth-part, so its user service stays as it is.
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-link-build.sh 2>&1 | tail -40
            mkdir -p /tmp/part && install -m755 /tmp/out/hearth-link /tmp/part/hearth-link
            echo "INNER=hearth-link" >> "$GITHUB_ENV"
          elif [ "$APP" = mantel-rust ]; then
            # Mantel in Rust (test, docs/MANTEL-RUST.md): the one program, built in the image's own base; the
            # autostart runs <its folder>/hearth-mantel when it's installed.
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/mantel-rust-build.sh 2>&1 | tail -40
            mkdir -p /tmp/part/mantel-rust && install -m755 /tmp/out/hearth-mantel /tmp/part/mantel-rust/hearth-mantel
            # its own hearth-layout next to it (your AI's blocks run as `hearth-layout run-block`)
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-ui-build.sh 2>&1 | tail -20
            tar -C /tmp/part/mantel-rust -xf /tmp/out/hearth-ui.tar ./hearth-layout && test -x /tmp/part/mantel-rust/hearth-layout
            echo "INNER=mantel-rust" >> "$GITHUB_ENV"
          else
            base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/peppermint/Containerfile | head -1)
            docker pull -q "$base"
            docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-ui-build.sh 2>&1 | tail -40
            tar -C /tmp/part -xf /tmp/out/hearth-ui.tar "./$APP"
            test -x "/tmp/part/$APP"
            echo "INNER=$APP" >> "$GITHUB_ENV"
          fi
          f="$APP-$VER.tar.gz"
          tar -C /tmp/part -czf "/tmp/$f" --owner=0 --group=0 .
          echo "FILE=/tmp/$f" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum "/tmp/$f" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "/tmp/$f")" >> "$GITHUB_ENV"
      - name: Its release (never "latest")
        run: |
          printf '%s\n' "$NOTES" | tr '|' '\n' | sed '/^ *$/d; s/^ */- /' > /tmp/notes.md
          printf '\nA quick update through the Hearth Store, for Hearth OS %s. SHA-256: %s\n' "$OS" "$SHA" >> /tmp/notes.md
          gh release create "part-$APP-$VER" "$FILE" --target "$GITHUB_SHA" --latest=false \
            --title "$APP $VER (quick update for Hearth OS $OS)" --notes-file /tmp/notes.md
          echo "URL=https://github.com/$GITHUB_REPOSITORY/releases/download/part-$APP-$VER/$(basename "$FILE")" >> "$GITHUB_ENV"
      - name: Add it to the Store's live list (the store branch)
        run: |
          git fetch --depth=1 origin store
          git worktree add /tmp/store FETCH_HEAD
          cd /tmp/store
          python3 - <<'PY'
          import json, os
          p = "catalog.json"
          d = json.load(open(p, encoding="utf-8"))
          app, names = os.environ["APP"], {
              "mantel": "Mantel (Hearth Classic)", "hearth-files-app": "Hearth Files", "hearth-settings-app": "Hearth Settings",
              "hearth-task-manager": "Task Manager", "hearth-capture-app": "Capture", "hearth-notes-app": "Notes",
              "hearth-g15-app": "Logitech G15", "hearth-family-app": "Family and friends", "hearth-server-app": "Server mode",
              "hearth-resmon-app": "Resource monitor", "hearth-system-restore": "System Restore",
              "hearth-reliability-history": "Reliability history", "hearth-file-chooser": "File chooser",
              "hearth-pad-host": "Controller", "hearth-store-app": "Hearth Store", "hearth-link": "Hearth Link", "hearth-ideas-app": "Hearth Ideas", "hearth-retro-app": "Hearth Retro", "hearth-retro-to-steam-app": "Retro to Steam", "hearth-studio-app": "Hearth Studio", "hearth-beat-maker-app": "Hearth Beat Maker", "hearth-3d": "Hearth 3D", "hearth-bottles": "Hearth Bottles", "hearth-overlay": "Hearth Overlay", "hearth-proton-manager": "Proton Manager", "hearth-game-fixer": "Hearth Game Fixer", "hearth-lights-app": "Hearth Lights", "hearth-remap-app": "Hearth Remap", "hearth-mouse-app": "Hearth Mouse", "hearth-shield-app": "Hearth Shield", "hearth-listen-app": "Hearth Listen", "hearth-imagine-app": "Hearth Imagine", "hearth-passwords-app": "Hearth Passwords", "hearth-cloud-app": "Hearth Cloud", "hearth-home-app": "Hearth Home", "mantel-rust": "Mantel in Rust",
              "hearth-layout": "Desktop layouts", "hearth-game-mode": "Game Mode host", "hearth-home-server-helper": "Home server helper",
              "hearth-storage-helper": "Hearth Storage helper", "hearth-ai-share-helper": "AI sharing helper",
              "hearth-controller-lab": "Controller Lab", "hearth-saves": "Saves", "hearth-mods": "Mods", "hearth-gamestore": "Hearth Games",
              "hearth-gamma": "Colour filter", "hearth-steam": "Lightweight Steam engine",
              "decky-hearth-sync": "Hearth Sync (Decky)", "decky-hearth-link": "Hearth Link (Decky)", "decky-hearth-music": "Hearth Music (Decky)",
              "gamescope": "gamescope", "hearth-session": "Session start", "hearth-greeter": "Login screen"}
          system_parts = ("hearth-home-server-helper", "hearth-storage-helper", "hearth-ai-share-helper", "decky-hearth-sync", "decky-hearth-link", "decky-hearth-music", "hearth-greeter")
          groups = {"mantel": "desktop", "mantel-rust": "desktop", "hearth-layout": "desktop", "hearth-game-mode": "gamemode", "hearth-link": "services",
                    "hearth-gamma": "desktop", "hearth-steam": "gamemode", "decky-hearth-sync": "gamemode", "decky-hearth-link": "gamemode", "decky-hearth-music": "gamemode",
                    "gamescope": "gamemode", "hearth-session": "gamemode", "hearth-greeter": "services"}
          part = {"id": app, "version": os.environ["VER"], "os": os.environ["OS"], "path": os.environ["INNER"],
                  "url": os.environ["URL"], "sha256": os.environ["SHA"], "size": int(os.environ["SIZE"]),
                  "notes": [l.strip() for l in os.environ.get("NOTES", "").split("|") if l.strip()]}
          if app in system_parts:
              part["system"] = True
          # When an update to it takes effect (the owner, Nov 26: "if somthing needs a PC restart it will tell the
          # user"): the Store says so on its page and before installing, then asks Restart now / Later (never by
          # itself, never while a game runs); the one you have keeps working until then. Any part can be listed.
          restarts = {"gamescope": "signout", "hearth-session": "signout", "hearth-greeter": "pc"}
          if app in restarts:
              part["restart"] = restarts[app]
          missing = [l.strip() for l in os.environ.get("MISSING", "").split("|") if l.strip()]
          if missing:
              part["missing"] = missing
          # The app's own entry when the list has one (its part, or the program it opens), else a new one.
          # Test versions (Mantel in Rust) go in their own list, "tests": Stores before 1.17.1 only read "apps", so they
          # can never offer a test version to everyone.
          # Red flag 13 (the owner, Nov 22): any app can have a test version (Channel: test).
          # 1.18 (the owner, Nov 23: "have the Rust Version marked with rust so its not a test version any more"):
          # Mantel in Rust is an ordinary app with a main and a test version like the others, marked "rust"; its old
          # test-only entry leaves the tests list once a main version is published.
          test = os.environ.get("CHANNEL") == "test"
          if app == "mantel-rust" and not test:
              d["tests"] = [x for x in d.get("tests", []) if not (x.get("id") == "part-mantel-rust" or (x.get("part") or {}).get("id") == "mantel-rust" and x.get("id") != "test-mantel-rust")]
          if test:
              d.setdefault("tests", [])
          for e in d["tests"] if test else d["apps"]:
              if (e.get("part") or {}).get("id") == app or e.get("partId") == app or (app not in ("mantel", "mantel-rust", "hearth-link", "gamescope", "hearth-session") + system_parts and e.get("open") == app):
                  e["part"] = part
                  break
          else:
              e = {"id": ("test-" if test else "part-") + app, "name": names.get(app, app) + (" (test)" if test else ""), "kind": "builtin", "part": part,
                   "group": groups.get(app, "services" if app in system_parts else "apps")}
              if app not in ("mantel", "mantel-rust", "hearth-link", "hearth-layout", "hearth-game-mode", "hearth-gamma", "hearth-steam", "gamescope", "hearth-session") + system_parts:
                  e["open"] = app
              (d["tests"] if test else d["apps"]).append(e)
          # A test version: shown only with "Get test versions" on, got and removed by hand.
          if test:
              e["test"] = True
          if app == "mantel-rust":
              e["tag"] = "rust"
              e["short"] = "Mantel in Rust"
              e["card"] = "Mantel drawn in Rust: lighter and quicker. Pick it in Settings › System › Your desktop."
              e.setdefault("icon", "Rs")
              e.setdefault("from", "#ff8a3d")
              e.setdefault("to", "#b7410e")
          d["serial"] = int(d.get("serial", 0)) + 1
          tmp = p + ".tmp"
          with open(tmp, "w", encoding="utf-8") as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write("\n")
          os.replace(tmp, p)
          print(f"::notice title=Quick update::{app} {part['version']} for Hearth OS {part['os']} is in the store branch's list (serial {d['serial']}). Run Publish the Hearth Store list to send it.")
          PY
          python3 "$GITHUB_WORKSPACE/tools/store-check.py" catalog.json
          git -c user.name=Dragongamer9 -c user.email=Dragongamer9@users.noreply.github.com commit -qam "$APP $VER for Hearth OS $OS"
          git push origin HEAD:store
