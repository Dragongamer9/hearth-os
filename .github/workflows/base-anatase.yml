# Builds Hearth OS on Anatase: 1.15's test edition beside Debian (the owner, Nov 17: "Bring Anatase back and up to speed
# on 1.15 so i can test it"), from os-bases/anatase (Fedora bootc; docs/BASE-ANATASE.md). The same Hearth apps as the
# Debian edition (the app jobs are base-peppermint.yml's), stock KDE Plasma as Desktop Mode.
# Publishing (red flag 5): ONLY by hand, and ONLY to a test tag of ghcr.io/dragongamer9/hearth-os that only devices
# the owner switches follow: test-1.15 (and a dated test-1.15-<date> copy). Two ways: "publish" from main, or
# "test_tag" (test-<version> only, e.g. test-1.15) from any branch: the owner's approval of Nov 17, 11:15 PM ("when
# the Anatase test build passes all its checks, it may publish that same image straight to a test-only tag"). Either
# way the image is pushed by this same job only after every required check passed, and the pushed digest is checked.
# Never :latest or :testing (the old pre-archive build), never hearth-peppermint (Debian devices follow it), never a
# release or the website. Failures show up as annotations on the run.
name: Hearth OS (Anatase base, test)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to ghcr.io/dragongamer9/hearth-os:test-1.15 (main only; the owner says when). Off: build and check only'
        type: boolean
        default: false
      test_tag:
        description: 'Owner-approved test tag to publish to from this branch once every check passes (test-<version> only, e.g. test-1.15). Empty: none'
        type: string
        default: ''
      reuse_run:
        description: 'Reuse the app jobs of an earlier run of this workflow (its run id): skips them; refused if anything under hosts/ or ui/ (or the app build scripts) changed since that run. Empty: build them'
        type: string
        default: ''
      smoothness:
        description: 'Measure Desktop Mode at rest beside Debian (about 20 minutes)'
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/dragongamer9/hearth-os
  TEST_TAG: test-1.15

concurrency:
  group: hearth-anatase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust app (hosts/hearth-rs), built inside Debian trixie itself rather than on the Ubuntu runner: then it
  # links exactly the WebKitGTK/GTK/libsoup the image has, and never needs a newer glibc than trixie's 2.41
  # (ubuntu-latest moves to newer Ubuntu releases, whose glibc trixie doesn't have).
  app:
    name: Build the Hearth app (Rust, on Debian trixie)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    container: docker.io/library/debian:trixie
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app (tools)::$msg"' ERR
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential pkg-config file zstd \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev >/dev/null
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
          key: debian-trixie
      - name: Build
        working-directory: hosts/hearth-rs
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app::$msg"' ERR
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release
          mkdir -p /tmp/app && cp target/release/hearth /tmp/app/hearth
          # ---- hearthfetch (hosts/hearthfetch): /usr/bin/hearthfetch, Hearth OS's system summary for the terminal.
          (cd ../hearthfetch && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release && cp target/release/hearthfetch /tmp/app/hearthfetch)
          # ---- end hearthfetch
          # Hearth Terminal (hosts/hearth-terminal), built the same way and carried along in hearth-app.tar; build.sh
          # installs it as /usr/bin/hearth-terminal. If it doesn't build, the image keeps its other terminals.
          if (cd ../hearth-terminal && cargo build --release); then cp ../hearth-terminal/target/release/hearth-terminal /tmp/app/hearth-terminal
          else echo "::warning title=Hearth Terminal::didn't build; this image goes without it"; fi
          echo "--- libraries the app links (all come from Debian trixie)"
          objdump -p target/release/hearth | grep NEEDED
          echo "--- newest glibc symbol it needs (trixie has 2.41)"
          objdump -T target/release/hearth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # Hearth Disks (hosts/hearth-disks), the disk manager: built the same way, and put beside the app in
      # hearth-app.tar (build.sh installs it as /usr/bin/hearth-disks). Not fatal: without it the image is still made.
      - name: Build Hearth Disks
        continue-on-error: true
        working-directory: hosts/hearth-disks
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Disks::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app && cp "$CARGO_TARGET_DIR/release/hearth-disks" /tmp/app/hearth-disks
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== Hearth Recorder, Camera and Share (hosts/hearth-recorder, hosts/hearth-camera, hosts/hearth-share; tested by
      # capture-apps.yml): built here in Debian trixie like the app and put beside it in hearth-app.tar (build.sh
      # installs them in /usr/bin). Not fatal: without one the image is still made, without that app.
      - name: Build Hearth Recorder, Camera and Share
        continue-on-error: true
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for c in hearth-recorder hearth-camera hearth-share; do
            if (cd hosts/$c && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$c" /tmp/app/$c
            else echo "::warning title=$c::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # gpu-screen-recorder, Recorder's best way to capture (graphics card capture and encoding, Game Mode, instant
      # replay): Debian 13 doesn't package it yet, so it's built from its release here, in trixie, and carried in
      # hearth-app.tar as gsr/ (build.sh installs it and gives gsr-kms-server its capability). Without it Recorder
      # uses wf-recorder and GStreamer.
      - name: Build gpu-screen-recorder for Hearth Recorder
        continue-on-error: true
        env:
          GSR_VERSION: '5.13.8'
        run: |
          set -o pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends meson ninja-build pkgconf libwayland-bin \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavfilter-dev libx11-dev libxcomposite-dev libxrandr-dev \
            libxfixes-dev libxdamage-dev libpulse-dev libva-dev libdrm-dev libwayland-dev libcap-dev libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libvulkan-dev libgl-dev libegl-dev libglvnd-dev >/dev/null
          mkdir -p /tmp/gsr-src && cd /tmp/gsr-src
          curl -fsSL --retry 3 -o gsr.tar.gz "https://dec05eba.com/snapshot/gpu-screen-recorder.git.${GSR_VERSION}.tar.gz"
          tar -xzf gsr.tar.gz
          src=$(dirname "$(find . -maxdepth 3 -name meson.build | sort | head -1)")
          cd "$src"
          meson setup build --buildtype=release >/tmp/gsr-meson.log 2>&1 || { tail -30 /tmp/gsr-meson.log; echo "::warning title=gpu-screen-recorder::meson setup failed"; exit 1; }
          ninja -C build >/tmp/gsr-build.log 2>&1 || { tail -30 /tmp/gsr-build.log; echo "::warning title=gpu-screen-recorder::didn't build"; exit 1; }
          mkdir -p /tmp/app/gsr
          for b in gpu-screen-recorder gsr-kms-server; do
            f=$(find build -type f -name "$b" -perm -u+x | head -1)
            [ -n "$f" ] && cp "$f" /tmp/app/gsr/ && strip /tmp/app/gsr/$b || true
          done
          ls -l /tmp/app/gsr
          /tmp/app/gsr/gpu-screen-recorder --version 2>&1 | head -1 || true
          echo "::notice title=gpu-screen-recorder::built ${GSR_VERSION} (trixie; the Anatase image keeps it only if its libraries are there, else the COPR package)"
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== end of Hearth Recorder, Camera and Share
      # ---- Hearth Player and Hearth Calculator (hosts/hearth-player, hosts/hearth-calculator): built the same way and
      # put beside the app in hearth-app.tar (build.sh installs them in /usr/bin). Not fatal: without them the image is still made.
      - name: Build Hearth Player and Hearth Calculator
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          ok=0
          for app in hearth-player hearth-calculator; do
            (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release) \
              && cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app" \
              || { echo "::warning title=$app::it didn't build, so this image is made without it"; ok=1; }
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
          exit $ok
      # ---- end of Hearth Player and Hearth Calculator
      # ---- Hearth Time (hosts/hearth-time): Clock, Calendar, Notes and Weather, one program. Built the same way and
      # carried in hearth-app.tar as hearth-time/; build.sh installs it (the icons come with Hearth's icon set). Not
      # fatal: without it the image is still made.
      - name: Build Hearth Time (Clock, Calendar, Notes, Weather)
        continue-on-error: true
        working-directory: hosts/hearth-time
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Time::it didn't build, so this image is made without Clock, Calendar, Notes and Weather"; exit 1; }
          mkdir -p /tmp/app/hearth-time
          cp "$CARGO_TARGET_DIR/release/hearth-time" /tmp/app/hearth-time/hearth-time
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Time
      # ---- Hearth Contacts and Hearth Maps (hosts/hearth-contacts, hosts/hearth-maps): built the same way and put
      # beside the app in hearth-app.tar (their icons are in Hearth's icon set); build.sh installs them as
      # /usr/bin/hearth-contacts and /usr/bin/hearth-maps. Not fatal: an app that doesn't build is left out.
      - name: Build Hearth Contacts and Hearth Maps
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          # Contacts keeps CardDAV passwords in the Secret Service through libdbus.
          apt-get install -y -qq libdbus-1-dev >/dev/null
          mkdir -p /tmp/app
          for app in hearth-contacts hearth-maps; do
            sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" "hosts/$app/Cargo.toml"
            if (cd "hosts/$app" && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else echo "::warning title=$app::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Contacts and Hearth Maps
      # ---- Hearth Friends (Matrix) is archived since 1.6 (archive/hosts/hearth-friends, docs/ARCHIVED.md): Discord
      # replaced it, so its service isn't built or shipped any more (docs/DISCORD.md).
      # ---- Hearth Text (hosts/hearth-text), the text editor: built the same way and put beside the app in
      # hearth-app.tar (build.sh installs it as /usr/bin/hearth-text and makes it the default for text
      # files). Not fatal: without it the image is still made.
      - name: Build Hearth Text
        continue-on-error: true
        working-directory: hosts/hearth-text
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          test -s ui/vendor/VERSIONS || { echo "::warning title=Hearth Text::ui/vendor is missing (run the Hearth Text workflow with 'vendor'), so this image is made without it"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Text::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app && cp "$CARGO_TARGET_DIR/release/hearth-text" /tmp/app/hearth-text
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Text
      # ---- Hearth Photos and Hearth Documents (hosts/hearth-photos, hosts/hearth-documents): the picture viewer and
      # the PDF / e-book / comic reader, built the same way and put beside the app in hearth-app.tar (build.sh installs
      # them, with their menu entries and file types; their icons come with the Hearth icon set). Not fatal.
      - name: Build Hearth Photos and Hearth Documents
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for app in hearth-photos hearth-documents; do
            if (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else echo "::warning title=$app::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Photos and Hearth Documents
      # ---- Hearth's gaming apps (hosts/hearth-gaming): Controller Lab, Saves and Mods, built the same way and put beside
      # the app in hearth-app.tar (build.sh installs them in /usr/bin; their icons are in Hearth's icon set). Not fatal:
      # without them the image is still made.
      - name: Build Hearth's gaming apps (Controller Lab, Saves, Mods, Hearth Games)
        continue-on-error: true
        working-directory: hosts/hearth-gaming
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth's gaming apps::they didn't build, so this image is made without them"; exit 1; }
          mkdir -p /tmp/app
          for a in hearth-controller-lab hearth-saves hearth-mods hearth-gamestore; do cp "$CARGO_TARGET_DIR/release/$a" /tmp/app/; done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth's gaming apps
      # ---- Hearth Tools (hosts/hearth-tools): Disk Usage, System Info, Logs, Network Tools, Passwords & Keys, Printers &
      # Scanner and Welcome & Tips in one program, put beside the app in hearth-app.tar (hearth-tools/) with its menu
      # entries; build.sh installs them (their icons come with Hearth's icon set, branding/icons). Not fatal: without it the image is still made.
      - name: Build Hearth Tools
        continue-on-error: true
        working-directory: hosts/hearth-tools
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          command -v python3 >/dev/null || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 >/dev/null; } || true
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Tools::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app/hearth-tools
          cp "$CARGO_TARGET_DIR/release/hearth-tools" /tmp/app/hearth-tools/hearth-tools
          cp desktop/hearth-*.desktop /tmp/app/hearth-tools/
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end Hearth Tools
      # ---- Hearth Office (hosts/hearth-office): Write, Sheets and Slides (one program). Built the same way and carried
      # in hearth-app.tar as office/ with its install script (build.sh runs office/install.sh). Not fatal:
      # without it the image is still made.
      - name: Build Hearth Office
        continue-on-error: true
        working-directory: hosts/hearth-office
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          for f in xlsx.full.min.js hyperformula.full.min.js docx.iife.js pptxgen.bundle.js; do test -s "ui/vendor/$f" || { echo "::warning title=Hearth Office::ui/vendor/$f is missing (run office.yml with vendor ticked), so this image is made without it"; exit 1; }; done
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Office::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app/office
          cp "$CARGO_TARGET_DIR/release/hearth-office" linux/install.sh /tmp/app/office/
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Office
      # ==== Hearth Paint, the emoji picker, Hearth Fonts and hearth-gamma (hosts/hearth-paint, hearth-emoji, hearth-fonts,
      # hearth-gamma; apps-create.yml tests them): built the same way and put beside the app in hearth-app.tar (build.sh
      # installs them; their icons come with the Hearth icon set). Not fatal: an app that doesn't build is left out of this image.
      - name: Build Hearth Paint, Emoji, Fonts and hearth-gamma
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          for c in hearth-paint hearth-emoji hearth-fonts hearth-gamma hearth-theater; do
            sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" hosts/$c/Cargo.toml
            if (cd hosts/$c && cargo build --release); then cp "$CARGO_TARGET_DIR/release/$c" /tmp/app/$c
            else echo "::warning title=$c::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== end Hearth Paint, Emoji, Fonts and hearth-gamma
      # ---- Nearby Share and Hearth Connect (hosts/hearth-nearby, hosts/hearth-connect): built the same way and put
      # beside the app in hearth-app.tar (build.sh installs them). Not fatal: without them the image
      # is still made.
      - name: Build Nearby Share and Hearth Connect
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for app in hearth-nearby hearth-connect; do
            if (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else
              echo "::warning title=$app::it didn't build, so this image is made without it"
            fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Nearby Share and Hearth Connect
      # ---- Hearth Link (hosts/hearth-link; tested by hearth-link.yml): built the same way, beside the app in
      # hearth-app.tar (build.sh installs it and its user service). Not fatal. Its Cargo.toml has no version (the
      # owner picks version numbers), so it isn't stamped.
      - name: Build Hearth Link
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          if (cd hosts/hearth-link && cargo build --release); then cp "$CARGO_TARGET_DIR/release/hearth-link" /tmp/app/hearth-link
          else echo "::warning title=hearth-link::it didn't build, so this image is made without it"; fi
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Link
      # ---- Hearth's Qt renderer (hosts/hearth-qml, Experimental; docs/RENDERERS.md): built here in trixie, so it links the
      # image's Qt, and self-tested offscreen (hearth-qml.yml does the same with pictures). Beside the app in
      # hearth-app.tar as qml/ (build.sh installs it in /usr/lib/hearth-qml). Not fatal: without it there's no Qt choice.
      - name: Build Hearth's Qt renderer (Experimental)
        continue-on-error: true
        run: |
          set +e
          SRC="$GITHUB_WORKSPACE" OUT=/tmp/qout HEARTH_VERSION="${{ steps.ver.outputs.version }}" bash .github/scripts/hearth-qml-build.sh build 2>&1 | tail -80
          rc=${PIPESTATUS[0]}
          if [ -x /tmp/qout/hearth-qml/hearth-qml ]; then mkdir -p /tmp/app/qml && cp -a /tmp/qout/hearth-qml/. /tmp/app/qml/ && tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
          else echo "::warning title=hearth-qml::it didn't build, so this image is made without the Qt renderer"; exit 1; fi
          [ "$rc" = 0 ] || { echo "::warning title=hearth-qml::built, but its self-test failed (see hearth-qml.yml for pictures)"; exit 1; }
      # ---- end of Hearth's Qt renderer
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-app-anatase
          path: hearth-app.tar

  # Hearth Browser is still an Electron app (hosts/linux/src/web): Electron brings its own libraries and asks
  # little of glibc, so it's built on the runner as in os.yml.
  browser:
    name: Build Hearth Browser (Electron)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hearth's Chromium window (Electron, hosts/electron; used on Nvidia, docs/RENDERERS.md)
        working-directory: hosts/electron
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=electron window::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm test
          npm run dist:dir
          test -x dist/linux-unpacked/hearth-electron
          mkdir -p /tmp/electron && cp -a dist/linux-unpacked/. /tmp/electron/
      # ---- Hearth Sync (hosts/decky-hearth-sync, docs/HEARTH-SYNC.md): the Decky plugin the image ships, built and packed
      # into hearth-decky-sync.tar; build.sh puts it in /usr/share/hearth/decky-hearth-sync, where Settings › System › Steam
      # Game Mode's Decky install takes it from. The older Hearth plugin (archive/hosts/decky-hearth) isn't shipped for now.
      # Never fails the image: without it, Steam Game Mode works without Hearth's games in Steam's library.
      - name: Build Hearth Sync (Decky plugin)
        continue-on-error: true
        run: |
          set -e
          cd hosts/decky-hearth-sync
          npm install -g pnpm@9 >/dev/null
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ needs.app.outputs.version }}\"/" package.json
          pnpm install --no-frozen-lockfile >/dev/null
          pnpm build
          ./package.sh /tmp/decky-out
          tar -C /tmp/decky-out/decky-hearth-sync -cf "$GITHUB_WORKSPACE/hearth-decky-sync.tar" .
      # Hearth Music (hosts/decky-hearth-music, docs/HEARTH-MUSIC.md): shipped next to Hearth Sync the same way, into
      # /usr/share/hearth/decky-hearth-music. Never fails the image.
      - name: Build Hearth Music (Decky plugin)
        continue-on-error: true
        run: |
          set -e
          cd hosts/decky-hearth-music
          npm install -g pnpm@9 >/dev/null
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ needs.app.outputs.version }}\"/" package.json
          pnpm install --no-frozen-lockfile >/dev/null
          pnpm build
          ./package.sh /tmp/decky-out
          tar -C /tmp/decky-out/decky-hearth-music -cf "$GITHUB_WORKSPACE/hearth-decky-music.tar" .
      # ---- Hearth Link (hosts/decky-hearth-link, docs/HEARTH-LINK-PLUGIN.md): another Decky plugin, built the same way
      # into hearth-decky-link.tar for /usr/share/hearth/decky-hearth-link. Never fails the image.
      - name: Build Hearth Link (Decky plugin)
        continue-on-error: true
        run: |
          set -e
          cd hosts/decky-hearth-link
          command -v pnpm >/dev/null || npm install -g pnpm@9 >/dev/null
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ needs.app.outputs.version }}\"/" package.json
          pnpm install --no-frozen-lockfile >/dev/null
          pnpm build
          ./package.sh /tmp/decky-out
          tar -C /tmp/decky-out/decky-hearth-link -cf "$GITHUB_WORKSPACE/hearth-decky-link.tar" .
      - name: Build Hearth Browser
        working-directory: hosts/linux
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=browser::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist:dir
          test -x dist/linux-unpacked/nimbus
          mkdir -p /tmp/browser && cp -a dist/linux-unpacked/. /tmp/browser/
          tar -C /tmp/browser -cf ../../hearth-browser.tar .
          tar -C /tmp/electron -cf ../../hearth-electron.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-browser-anatase
          path: |
            hearth-browser.tar
            hearth-electron.tar
            hearth-decky-sync.tar
            hearth-decky-music.tar
            hearth-decky-link.tar

  # ---- hearth-steam (hosts/hearth-steam): the lightweight Steam engine (experimental, off by default; Hearth starts it
  # only when Settings › Library › Steam engine is Lightweight). This job never fails the image: if hearth-steam doesn't
  # build, the image is made without it and Hearth always uses the normal Steam client.
  hearth-steam:
    name: Build hearth-steam (lightweight Steam engine)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: '10.0.x'
      - name: Build
        continue-on-error: true
        run: |
          if bash hosts/hearth-steam/publish.sh /tmp/hearth-steam; then tar -C /tmp/hearth-steam -cf hearth-steam.tar .
          else echo "::warning title=hearth-steam::it didn't build, so this image is made without the lightweight Steam engine"; fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('hearth-steam.tar') != ''
        continue-on-error: true
        with:
          name: hearth-steam-anatase
          path: hearth-steam.tar
  # ---- end hearth-steam
  # ---- Hearth's KDE apps (hosts/hearth-kde, docs/KDE-APPS.md; tested by kde-apps.yml): Hearth Files (Dolphin + Hearth's
  # patches) and kio-hearth (hearth:/ in every KDE app), built and tested inside Debian trixie (Peppermint) by
  # .github/scripts/hearth-kde-build.sh. Never stops the image: what didn't build or pass its tests is left out of the tar,
  # and without the tar the image keeps the old Hearth Files (the KDE apps from the base's packages are still renamed).
  kde:
    name: Build Hearth's KDE apps (inside Anatase)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/anatase/Containerfile | head -1)
          docker pull -q "$base" || { echo "::error title=Anatase base::couldn't pull $base (the base image is gone or the registry didn't answer)"; exit 1; }
          echo "::notice title=Anatase base::$base: $(docker inspect -f '{{.Created}} {{index .Config.Labels "org.opencontainers.image.version"}}' "$base" 2>/dev/null) · $(docker run --rm "$base" sh -c '. /usr/lib/os-release; echo "$PRETTY_NAME (Fedora $(rpm -E %fedora))"')"
          docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-kde-build.sh anatase 2>&1 | tail -60
          rc=${PIPESTATUS[0]}
          [ "$rc" = 0 ] || { echo "::warning title=Hearth's KDE apps::not everything built or passed its tests; the image goes without that part"; exit 1; }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hearth-kde-anatase
          path: /tmp/out/hearth-kde.tar
          if-no-files-found: ignore
  # ---- end of Hearth's KDE apps

  image:
    name: Build the OS image (hearth-os on Anatase, test)
    needs: [app, browser, hearth-steam, kde]
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.reuse_run != '') || (needs.app.result == 'success' && needs.browser.result == 'success' && needs.hearth-steam.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      actions: read     # reuse_run: the earlier run's artifacts
    env:
      # Only main, only by hand, only with publish ticked (red flag 5)...
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
      # ...or an owner-approved test tag given by hand (checked against test-<version> in the step).
      TAG_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_tag || '' }}
      REUSE: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run || '' }}
      # The run whose app artifacts are used: this one, or the checked earlier one.
      ART_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run || github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # reuse_run: only a run of this same workflow in this repository, whose app jobs all passed, and only when
      # nothing the app jobs build from changed since its commit (hosts/, ui/, their build scripts). Else: refused.
      - name: The version, and the earlier run's app jobs (reuse_run)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [ -n "$REUSE" ] || exit 0
          echo "$REUSE" | grep -Eqx '[0-9]{6,20}' || { echo "::error title=reuse_run::'$REUSE' isn't a run id"; exit 1; }
          info=$(gh api "repos/${{ github.repository }}/actions/runs/$REUSE" --jq '[.path, .repository.full_name, .head_sha] | @tsv') \
            || { echo "::error title=reuse_run::run $REUSE isn't in ${{ github.repository }}"; exit 1; }
          IFS=$'\t' read -r path repo sha <<<"$info"
          [ "$repo" = "${{ github.repository }}" ] && [ "$path" = .github/workflows/base-anatase.yml ] \
            || { echo "::error title=reuse_run::run $REUSE is $path in $repo, not this workflow"; exit 1; }
          bad=$(gh api "repos/${{ github.repository }}/actions/runs/$REUSE/jobs?per_page=50" --jq '.jobs[] | select((.name | startswith("Build the Hearth app") or startswith("Build Hearth Browser") or startswith("Build hearth-steam") or startswith("Build Hearth'"'"'s KDE apps")) and .conclusion != "success") | .name')
          [ -z "$bad" ] || { echo "::error title=reuse_run::in run $REUSE these app jobs didn't pass: $bad"; exit 1; }
          git fetch -q --depth=1 origin "$sha" || { echo "::error title=reuse_run::couldn't fetch run $REUSE's commit $sha"; exit 1; }
          # (hosts/linux/test, hosts/linux/session and hosts/linux/desktop/firehold-plasma aren't built by the app jobs: the image takes them from this checkout.)
          changed=$(git diff --name-only "$sha" HEAD -- hosts ui .github/scripts/hearth-kde-build.sh .github/scripts/hearth-qml-build.sh tools/app-bundle.py ':(exclude)hosts/linux/test' ':(exclude)hosts/linux/session' ':(exclude)hosts/linux/desktop/firehold-plasma')
          if [ -n "$changed" ]; then
            echo "::error title=reuse_run::refused: the app jobs' sources changed since run $REUSE ($sha): $(echo "$changed" | head -20 | tr '\n' ' ')"; exit 1
          fi
          echo "::notice title=reuse_run::using run $REUSE's app artifacts (commit $sha; nothing under hosts/ or ui/ changed since)"

      - name: Make room (the image is several GB)
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/download-artifact@v4
        with:
          name: hearth-app-anatase
          run-id: ${{ env.ART_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: ${{ env.REUSE == '' }}
        with:
          name: hearth-steam-anatase
          run-id: ${{ env.ART_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hearth-browser-anatase
          run-id: ${{ env.ART_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: ${{ env.REUSE == '' }}
        with:
          name: hearth-kde-anatase
          run-id: ${{ env.ART_RUN }}
          github-token: ${{ github.token }}
      - name: Every app artifact is here (reuse_run)
        if: ${{ env.REUSE != '' }}
        run: |
          for f in hearth-app.tar hearth-browser.tar hearth-steam.tar hearth-kde.tar; do
            [ -s "$f" ] || { echo "::error title=reuse_run::run $REUSE's $f is missing or expired: run without reuse_run"; exit 1; }
          done

      - name: Python tests for what this image changes (Switch edition, the clean install, unlock)
        run: |
          python3 -m unittest discover -s hosts/linux/test -p 'test_hearth_clean_install.py' 2>&1 | tail -5 | tee /tmp/t1.log
          python3 -m unittest discover -s hosts/linux/test -p 'test_anatase_*.py' 2>&1 | tail -5 | tee /tmp/t2.log
          grep -q '^OK' /tmp/t1.log && grep -q '^OK' /tmp/t2.log || { echo "::error title=python tests::$(cat /tmp/t1.log /tmp/t2.log | tr '\n' ' ' | cut -c1-600)"; exit 1; }

      - name: Unpack Hearth into the build context
        run: |
          mkdir -p os/nimbus-app/browser
          tar -C os/nimbus-app -xf hearth-app.tar
          tar -C os/nimbus-app/browser -xf hearth-browser.tar
          if [ -f hearth-electron.tar ]; then mkdir -p os/nimbus-app/electron && tar -C os/nimbus-app/electron -xf hearth-electron.tar; fi
          if [ -f hearth-steam.tar ]; then mkdir -p os/nimbus-app/hearth-steam && tar -C os/nimbus-app/hearth-steam -xf hearth-steam.tar || rm -rf os/nimbus-app/hearth-steam; fi
          test -x os/nimbus-app/hearth
          if [ -f hearth-kde.tar ]; then cp hearth-kde.tar os/nimbus-app/hearth-kde.tar; fi
          mkdir -p os/system_files/usr/share/nimbus
          python3 tools/app-bundle.py abi > os/system_files/usr/share/nimbus/app-abi
          python3 tools/hearth_version.py date "${{ steps.ver.outputs.version }}" > os/system_files/usr/share/nimbus/version-date
          for pl in sync music link; do
            if [ -f hearth-decky-$pl.tar ]; then mkdir -p os/nimbus-app/decky-hearth-$pl && tar -C os/nimbus-app/decky-hearth-$pl -xf hearth-decky-$pl.tar || rm -rf os/nimbus-app/decky-hearth-$pl; fi
          done
          ls -la os/nimbus-app

      - name: Build
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" -e "Copying config" -e "Writing manifest" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=image::$msg"' ERR
          sudo podman build --pull=newer -f os-bases/anatase/Containerfile --build-arg NIMBUS_VERSION="${{ steps.ver.outputs.version }}" -t hearth-os:anatase .
          sflat=$(grep -o "warning: couldn't install Steam from RPM Fusion.*" /tmp/step.log | tail -1 || true)
          if [ -n "$sflat" ]; then echo "::warning title=Steam::$sflat"; fi
          for w in $(grep -o "warning: [a-zA-Z0-9_. -]*\(isn't in this build\|didn't install\|wasn't built\|couldn't install\)[^\"]*" /tmp/step.log | cut -c1-160 | sort -u | head -15 | tr ' ' '_'); do echo "::warning title=build::$(echo "$w" | tr '_' ' ')"; done

      # REQUIRED: a failure here stops the image from being published.
      - name: Check the image
        run: |
          set -o pipefail
          sudo podman run --rm -v "$PWD:/src:ro" hearth-os:anatase bash /src/.github/scripts/anatase-image-check.sh 2>&1 | tee /tmp/check.log

      # Warn-only: screenshots of Hearth's looks as Plasma Global Themes (Hearth in full: desktop, app menu, Dolphin,
      # System Settings; then one per look picked as Hearth's Settings picks it). Posted to the ci/anatase-looks branch
      # by the looks job below (artifacts can't be opened from the owner's sessions).
      - name: Screenshots of Hearth's looks in Plasma
        continue-on-error: true
        timeout-minutes: 30
        run: bash .github/scripts/anatase-look-shots.sh localhost/hearth-os:anatase /tmp/anatase-looks
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: anatase-looks
          path: /tmp/anatase-looks
          if-no-files-found: ignore
          retention-days: 14

      # REQUIRED: "Unlock the file system" for real (overlay mounts, dnf, starts, an update and a rollback played out).
      - name: Unlock the file system (hearth-unlock, dnf)
        timeout-minutes: 40
        run: bash .github/scripts/anatase-unlock-check.sh localhost/hearth-os:anatase

      # REQUIRED (red flag 2; the owner's laptop dropped to "grub>" after a switch on Nov 17): Debian (the published one)
      # installed in a virtual PC, switched to this image with this branch's hearth-admin, restarted through the
      # firmware with nothing pressed (it must start Anatase by itself), switched back, restarted (the same Debian).
      - name: Switch edition Debian ⇄ Anatase in a virtual PC (restarts through the firmware)
        timeout-minutes: 120
        run: |
          # The Debian the owner's devices are on (1.13): its newest dated tag, else :testing.
          t=$(skopeo list-tags docker://ghcr.io/dragongamer9/hearth-peppermint 2>/dev/null | python3 -c 'import json, sys; t = sorted(x for x in json.load(sys.stdin)["Tags"] if x.startswith("testing-1.13-")); print(t[-1] if t else "")' || true)
          export DEBIAN_IMAGE=ghcr.io/dragongamer9/hearth-peppermint:${t:-testing}
          bash .github/scripts/edition-switch-vm.sh localhost/hearth-os:anatase "$PWD/edition-switch"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: edition-switch-vm
          path: edition-switch
          if-no-files-found: ignore

      - name: Quick Access over games is Hearth's (Handheld Daemon's overlay app)
        timeout-minutes: 15
        run: |
          sudo podman run --rm hearth-os:anatase bash -c 'test "$(readlink -f /usr/bin/hhd-ui)" = /usr/share/nimbus/desktop/shell/hearth-overlay && /usr/bin/hhd-ui --version | grep -q "^Hearth Quick Access"' \
            || { echo "::error title=Quick Access::hhd-ui isn't Hearth's overlay app"; exit 1; }
          sudo podman run --rm -v "$PWD/.github/scripts/overlay-text-check.sh:/ovtext.sh:ro" hearth-os:anatase bash /ovtext.sh

      # Bazaar (the Flathub store) and Flatpak's repair, warn-only as on Debian.
      - name: Flatpak repair and Bazaar (warn-only)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo podman run --rm --privileged -v "$PWD/.github/scripts/hearth-box-check.sh:/box.sh:ro" \
            -v "$PWD/hosts/linux/test/make_test_deb.py:/make_test_deb.py:ro" hearth-os:anatase bash /box.sh flatpak || echo "::warning title=box check::the flatpak check didn't finish"

      # Smoothness (warn-only): Desktop Mode at rest here (Plasma) and in the published Debian image (Mantel on labwc).
      - name: Smoothness beside Debian (Desktop Mode at rest, 10 minutes each)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoothness }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          IDLE_SECS=600 bash .github/scripts/desktop-idle-compare.sh localhost/hearth-os:anatase plasma | tee /tmp/idle.txt
          sudo podman pull -q ghcr.io/dragongamer9/hearth-peppermint:testing >/dev/null && \
            IDLE_SECS=600 bash .github/scripts/desktop-idle-compare.sh ghcr.io/dragongamer9/hearth-peppermint:testing mantel | tee -a /tmp/idle.txt
          { echo '### Desktop Mode at rest (virtual screen, software drawing)'; echo; echo '```'; grep '^RESULT' /tmp/idle.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Only to a test tag, only by hand (red flag 5), only after every required check above passed (a failed step stops
      # the job before this). Never :latest, :testing or hearth-peppermint. The pushed digest is checked.
      - name: Publish to the test tag
        if: ${{ success() && (env.PUBLISH == 'true' || env.TAG_IN != '') }}
        run: |
          set -o pipefail
          tag="${TAG_IN:-$TEST_TAG}"
          echo "$tag" | grep -Eqx 'test-[0-9]+(\.[0-9]+)*' || { echo "::error title=publish::refusing tag '$tag': only test-<version> tags (e.g. test-1.15)"; exit 1; }
          [ "$IMAGE" = ghcr.io/dragongamer9/hearth-os ] || { echo "::error title=publish::refusing image $IMAGE"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          dated="$tag-$(date -u +%Y%m%d)"
          # Forget where layers were seen before (the switch test pulled Debian's image from ghcr): otherwise the
          # push tries to borrow them from that other package and ghcr answers 403 (run 44270616388).
          sudo rm -f /var/lib/containers/cache/blob-info-cache-v1.sqlite /var/lib/containers/cache/blob-info-cache-v1.boltdb
          # Every layer compressed afresh, so no layer is ever "reused" from another package (still 403 with the cache gone, run 44278111249).
          sudo podman push --force-compression --compression-format gzip --digestfile /tmp/digest hearth-os:anatase "$IMAGE:$tag"
          d=$(cat /tmp/digest)
          sudo skopeo copy -q --authfile /run/containers/0/auth.json "docker://$IMAGE@$d" "docker://$IMAGE:$dated"
          for t in "$tag" "$dated"; do
            got=$(sudo skopeo inspect --authfile /run/containers/0/auth.json --format '{{.Digest}}' "docker://$IMAGE:$t")
            [ "$got" = "$d" ] || { echo "::error title=publish::$IMAGE:$t is $got, not the image this run built ($d)"; exit 1; }
          done
          echo "::notice title=published::$IMAGE:$tag and :$dated = $d (built and checked by run ${{ github.run_id }}, commit ${{ github.sha }})"

  # The screenshots on a branch of their own (ci/anatase-looks, replaced each run: one copy), so they can be opened
  # without downloading artifacts. Only pictures and logs; nothing else is pushed.
  looks:
    name: Post the look screenshots (ci/anatase-looks)
    needs: [image]
    if: ${{ !cancelled() && needs.image.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: anatase-looks
          path: looks
      - name: Push to ci/anatase-looks
        run: |
          set -e
          n=$(ls looks/*.png 2>/dev/null | wc -l)
          [ "$n" -gt 0 ] || { echo "::warning title=looks::no screenshots to post"; exit 0; }
          mkdir -p site && cd site
          git init -q -b ci/anatase-looks
          mkdir "run-${{ github.run_id }}"
          cp ../looks/*.png "run-${{ github.run_id }}/"
          for f in sync.log plasmashell.log kdeglobals.txt plasma-look.json; do [ -f "../looks/$f" ] && cp "../looks/$f" "run-${{ github.run_id }}/" || true; done
          printf 'Screenshots of Hearth OS on Anatase (Plasma, virtual screen, software drawing) from run %s, commit %s.\n' \
            "${{ github.run_id }}" "${{ github.sha }}" > README.md
          git add -A
          git -c user.name=Dragongamer9 -c user.email=Dragongamer9@users.noreply.github.com commit -q -m "Look screenshots, run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/anatase-looks
          echo "::notice title=looks::$n screenshots on ci/anatase-looks/run-${{ github.run_id }}"
