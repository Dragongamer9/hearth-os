# Hearth Input end to end: the real daemon (hosts/linux/desktop/shell/hearth-input) with real evdev and uinput.
# Fake controllers (Xbox 360 pad, Bluetooth Xbox controller, DualSense) are made with /dev/uinput; the test talks
# to the daemon's socket the way Hearth does and reads its virtual keyboard and mouse (tools/e2e-hearth-input.py).
# Also the keyboard over a game (Guide + X, docs/OSK.md), whose typing goes through Hearth Input: HHD's overlay app's
# protocol (hosts/linux/test/overlay-protocol.test.js: the game keeps gamescope's keyboard focus) and, when run by
# hand, the page itself (tools/ui-check.js: it stays open and types).
name: Hearth Input e2e

on:
  push:
    branches: [main, linux-host, input-e2e]   # input-e2e: where this test was built (dispatch needs it on main first)
    paths:
      - 'hosts/linux/desktop/shell/hearth-input*'
      - 'hosts/linux/desktop/shell/input-layouts.json'
      - 'hosts/linux/desktop/shell/osk-keymap.json'
      - 'hosts/linux/test/fixtures/input-layout-cases.json'
      - 'hosts/linux/test/test_hearth_input.py'
      - 'tools/e2e-hearth-input.py'
      - 'hosts/linux/src/overlay/**'
      - 'hosts/linux/test/overlay-protocol.test.js'
      - '.github/workflows/hearth-input-e2e.yml'
  workflow_dispatch:
    inputs:
      page:
        description: Also check Hearth's page (tools/ui-check.js, every screen, with the keyboard over a game)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: uinput and python3-evdev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-evdev >/dev/null
          sudo modprobe uinput
          ls -l /dev/uinput
          /usr/bin/python3 -c "import evdev; print('python3-evdev', getattr(evdev, '__version__', '?'))"

      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s hosts/linux/test -q

      - name: HHD's overlay app (the keyboard over a game keeps the game's keyboard focus)
        run: |
          set -o pipefail
          node --test hosts/linux/test/overlay-protocol.test.js 2>&1 | tee proto.log || { echo "::error title=overlay protocol::$(grep -E -B2 -A12 '^not ok|AssertionError' proto.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }

      - name: End-to-end test
        # As root: the fake controllers' /dev/input nodes are root:input, and the daemon must open them.
        run: |
          set -o pipefail
          sudo E2E_SHOW_LOG=1 /usr/bin/python3 tools/e2e-hearth-input.py 2>&1 | tee e2e.log

      - name: Report as annotations
        # The report (and the daemon's log) on the run's page too, readable without downloading the job log.
        if: always()
        run: |
          [ -f e2e.log ] || exit 0
          python3 - <<'PY'
          text = open('e2e.log', encoding='utf-8', errors='replace').read()
          chunks = [text[i:i + 3800] for i in range(0, len(text), 3800)][:10]
          for n, c in enumerate(chunks, 1):
              c = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::notice title=e2e report %d/%d::%s' % (n, len(chunks), c))
          PY

  # Hearth's page (by hand, page ticked): every screen without a script error, and the keyboard over a game stays open
  # after Quick Access, types through osk.type / osk.key, and B closes it.
  page:
    if: github.event_name == 'workflow_dispatch' && inputs.page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Hearth's page
        run: |
          set -o pipefail
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node ui-check.js 2>&1 | tee ui.log || { echo "::error title=ui-check::$(grep -iE 'keyboard over a game|error|fail' ui.log | head -40 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
