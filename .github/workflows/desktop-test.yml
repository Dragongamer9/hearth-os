          [ "$(snap | sha256sum)" = "$wt_before" ] || { echo "::error title=Win tools::opening Device Manager, Run or the Super+X menu changed a settings file"; touch shots/FAILED; }
          grep -E "(WinTools|DeviceManagerView|RunView)\.qml|WinTools|Device Manager: its page|Run: its page" "$LOG" > $W/shell-log.txt 2>/dev/null || true
          if grep -qE "(WinTools|DeviceManagerView|RunView)\.qml.*(TypeError|ReferenceError|Cannot assign|non-existent|is not a type|is not defined|Unable to assign|Cannot read)" "$LOG" 2>/dev/null \
             || grep -qE "couldn't load|its page \((DeviceManagerView|RunView)\.qml\)" $W/shell-log.txt 2>/dev/null; then
            echo "::error title=Win tools::$(sort -u $W/shell-log.txt | head -8 | cut -c1-230 | tr '\n' '|')"; touch shots/FAILED
          else
