          printf '#!/bin/sh\necho hello\n' > "$HOME/Documents/run-me.sh"
          printf '[Desktop Entry]\nType=Application\nName=Steam\nComment=Games\nExec=steam -silent %%U\n' > "$HOME/Documents/Steam.desktop"
          printf 'volume = 3\n' > "$HOME/Documents/game.conf"; printf 'plain words\n' > "$HOME/Documents/NOTES"
          printf '#!/bin/sh\necho "$@" > "$HOME/hearth-text-args"\n' > /tmp/fakebin/hearth-text && chmod +x /tmp/fakebin/hearth-text
          ipc files open "$HOME/Documents"; ipc filemanager view details
          ipc filemanager activate run-me.sh; grim "shots/files-10-open-script.png" || true; ipc filemanager close
          ipc filemanager select run-me.sh; ipc filemanager menu; grim "shots/files-11-script-menu.png" || true; ipc filemanager close
          ipc filemanager activate Steam.desktop; grim "shots/files-12-open-desktop-file.png" || true; ipc filemanager close
          ipc filemanager activate NOTES; sleep 2
          { echo "hearth-text was given: $(cat "$HOME/hearth-text-args" 2>&1)"; python3 hosts/linux/desktop/shell/hearth-files open-plan "$HOME/Documents/run-me.sh"; python3 hosts/linux/desktop/shell/hearth-files open-plan "$HOME/Documents/game.conf"; } > shots/files-open-plans.txt 2>&1
          grep -q "NOTES" "$HOME/hearth-text-args" 2>/dev/null || { echo "::error title=Hearth Files::a text file with no app didn't open in Hearth Text: $(tr '\n' '|' < shots/files-open-plans.txt)"; touch shots/FAILED; }
          ipc files close
          # Desktop icons: one picked and its menu (Open with, Cut, Copy...).
          ipc desktop itemMenu notes.txt; grim "shots/$n-desktop-item-menu.png" || true; ipc desktop close; n=$((n+1))
          # A notification pops up (with action buttons), then shows in the clock's panel with a count on the bell.
          (timeout 20 notify-send -a "Test App" -A default=Open -A later="Remind me" "Hello from a test" "Notifications pop up in the corner" || echo "notify-send failed") &
          sleep 3; grim "shots/$n-notification.png" || true; n=$((n+1))
          notify-send -a "Other App" "Second one" "For the count on the bell" || true; sleep 8
          grim "shots/$n-taskbar-bell.png" || true; n=$((n+1))
          ipc calendar open; grim "shots/$n-notification-list.png" || true; ipc calendar close; n=$((n+1))
          # Print Screen's screenshot: a file in Pictures/Screenshots, on the clipboard, and a notification.
          sh "$NIMBUS_SHARE/desktop/open.sh" screenshot; sleep 3
          grim "shots/$n-screenshot-notification.png" || true; n=$((n+1))
          ls -la "$HOME/Pictures/Screenshots" > shots/screenshots-folder.txt 2>&1 || echo "no screenshot folder" > shots/screenshots-folder.txt
          (wl-paste --list-types 2>&1 || true) > shots/clipboard-types.txt
          # Shortcuts typed on a virtual keyboard (wtype): Super+I opens Settings, Super+A Quick Access.
          if command -v wtype >/dev/null; then
            wtype -M logo -k i -m logo; sleep 3; grim "shots/$n-super-i-settings.png" || true; n=$((n+1)); ipc settings close
            wtype -M logo -k a -m logo; sleep 3; grim "shots/$n-super-a-quick.png" || true; n=$((n+1)); ipc quick toggle
          fi
          # ---- Hearth's on-screen keyboard (Keyboard.qml: the shared keyboard in ui/osk, docs/OSK.md) typing into a real
          # Linux app: foot running `cat` into a file. Controller presses go in over IPC (as hearth-pad would send them; there
          # is no uinput here), taps as from touch; the keyboard types through wtype. Pictures: osk-*.png.
          if command -v foot >/dev/null && command -v wtype >/dev/null; then
            kb() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard "$@" 2>&1 | tail -n1; }
            rm -f "$HOME/osk-typed.txt"
            foot --app-id osk-test --title "Typing test" sh -c "stty -echo; cat > $HOME/osk-typed.txt" >/dev/null 2>&1 &
            OSKFOOT=$!; sleep 4
            kb open; sleep 2
            kb tap h; kb tap e; kb tap l; sleep 1
            kb state > shots/osk-state-1.json
            grim shots/osk-1-suggestions.png || true
            # "hel" → the suggestion "hello" (up into the strip, A picks; it brings its own space), X deletes the space,
            # Y types one back.
            kb press up; kb press up; kb press up; kb press left; kb press a; sleep 0.5; kb press x; kb press y
            # Accents: "e" picked, A held, then the second accent (è).
            kb select e; sleep 0.3
            kb state > shots/osk-state-2.json
            kb hold a 750; sleep 1.2
            grim shots/osk-2-accents.png || true
            kb press right; kb press a; sleep 0.5
            # The emoji (L3), its third one, back to letters; the Ember Wheel (left stick up, Y: "a"); ☰ is Enter.
            kb press l3; sleep 0.5; grim shots/osk-3-emoji.png || true; kb press a; kb press l3
            kb stick 0 -1; sleep 0.5; grim shots/osk-4-ember-wheel.png || true; kb press y; kb stick 0 0
            kb press menu; sleep 2
            kb state > shots/osk-state-3.json
            kb setting theme daylight; kb setting shape split; sleep 1; grim shots/osk-5-split-daylight.png || true
            kb setting theme hearth; kb setting shape full
            kb press b; sleep 1
            kill "$OSKFOOT" 2>/dev/null || true; sleep 1
            got=$(cat "$HOME/osk-typed.txt" 2>/dev/null || true)
            printf '%s' "$got" > shots/osk-typed.txt
            want="hello è😄a"
            if [ "$got" != "$want" ]; then
              echo "::error title=on-screen keyboard::typing into foot gave '$got' (wanted '$want'); state: $(tr -d '\n' < shots/osk-state-3.json | cut -c1-400)"
              touch shots/FAILED
            else
              echo "on-screen keyboard: typed '$got' into foot"
            fi
            grep -q '"open":false' <<< "$(kb state)" || { echo "::error title=on-screen keyboard::B didn't hide it"; touch shots/FAILED; }
          else
            echo "::warning title=on-screen keyboard::foot or wtype is missing here: the typing test didn't run"
          fi
          # ---- end of the on-screen keyboard
          # ---- The on-screen keyboard's looks (OskThemes.qml, Settings › Keyboard › Look): each one, dark and light for the
          # ones that follow Settings › Appearance (deskTheme in osk.json, mode in desktop.json; both files are watched).
          # Pictures: osk-look-<look>-<mode>.png, and Settings › Keyboard's look picker.
          oskset() {  # file key value ("" removes it)
            python3 - "$@" <<'PY'
          import json, os, sys
          p, k, v = sys.argv[1:4]
          try: d = json.load(open(p))
          except Exception: d = {}
          if v: d[k] = v
          else: d.pop(k, None)
          os.makedirs(os.path.dirname(p), exist_ok=True)
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
          }
          OSKJ="$HOME/.config/nimbus/osk.json"; DESKJ="$HOME/.local/share/nimbus/desktop.json"
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard open; sleep 2
          for mode in dark light; do
            oskset "$DESKJ" mode "$mode"; sleep 2
            for look in steam warm contrast frost pocket hearth ember slate daylight; do
              if [ "$mode" = light ]; then case "$look" in hearth|ember|slate|daylight) continue ;; esac; fi
              oskset "$OSKJ" deskTheme "$look"; sleep 1.5
              grim "shots/osk-look-$look-$mode.png" || true
            done
          done
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard close; sleep 1
          oskset "$DESKJ" mode dark; oskset "$OSKJ" deskTheme pocket; sleep 2
          ipc settings page keyboard
          if command -v wtype >/dev/null; then
            wtype -k Right; sleep 0.5
            # (tabbing down the page: pictures at a few depths, the look tiles are in one of them)
            t=0; for want in 22 28 34 40 46; do while [ "$t" -lt "$want" ]; do wtype -k Tab; t=$((t+1)); done; sleep 1; grim "shots/osk-look-settings-$want.png" || true; done
          fi
          ipc settings close
          oskset "$OSKJ" deskTheme ""
          # ---- Settings › Handheld (SetHandheld.qml: Hearth's own Handheld Daemon app). First without HHD (what a desktop
          # shows), then with a stand-in HHD (.github/scripts/fake-hhd.py: the preview's ROG Ally on 127.0.0.1:5335) and
          # its token file (Quick Access then offers Handheld settings). Pictures: hhd-*.png, hhd-page.json.
          ipc settings page handheld; sleep 2; grim shots/hhd-0-not-running.png || true; ipc settings close
          python3 .github/scripts/fake-hhd.py ui/index.html &
          FAKEHHD=$!; sleep 2
          mkdir -p /tmp/hhd && echo fake-token > /tmp/hhd/token
          python3 hosts/linux/desktop/shell/hearth-hhd page > shots/hhd-page.json 2>&1 || true
          grep -q '"running": true' shots/hhd-page.json || { echo "::error title=Handheld::hearth-hhd page didn't read the stand-in HHD: $(head -c 300 shots/hhd-page.json)"; touch shots/FAILED; }
          python3 hosts/linux/desktop/shell/hearth-hhd apply controllers.rog_ally.imu false > /dev/null 2>shots/hhd-apply.txt \
            && python3 hosts/linux/desktop/shell/hearth-hhd get controllers.rog_ally.imu >> shots/hhd-apply.txt 2>&1 || true
          grep -q '"controllers.rog_ally.imu": false' shots/hhd-apply.txt || { echo "::error title=Handheld::a change didn't reach HHD: $(head -c 300 shots/hhd-apply.txt)"; touch shots/FAILED; }
          ipc settings page handheld; sleep 3; grim shots/hhd-1-page.png || true
          if command -v wtype >/dev/null; then
            wtype -k Right; sleep 0.5; wtype -k Return; sleep 3; grim shots/hhd-2-advanced.png || true   # Show advanced settings
            for i in $(seq 1 12); do wtype -k Down; done; sleep 1; grim shots/hhd-3-controller.png || true
            for i in $(seq 1 12); do wtype -k Down; done; sleep 1; grim shots/hhd-4-more.png || true
            for i in $(seq 1 14); do wtype -k Down; done; sleep 1; grim shots/hhd-5-settings.png || true
          fi
          ipc settings close
          ipc quick toggle; sleep 1; grim shots/hhd-6-quick-access.png || true; ipc quick toggle
          python3 hosts/linux/desktop/shell/hearth-hhd apply tdp.unified.tdp.mode '"custom"' > /dev/null 2>&1 || true
          ipc settings page handheld; sleep 3; grim shots/hhd-7-custom-power.png || true; ipc settings close
          oskset "$DESKJ" mode light; sleep 2
          ipc settings page handheld; sleep 3; grim shots/hhd-8-light.png || true; ipc settings close
          oskset "$DESKJ" mode dark; sleep 2
          kill "$FAKEHHD" 2>/dev/null || true; rm -f /tmp/hhd/token
          # ---- Controller apps own the controller (docs/CONTROLLER-FOCUS.md): hearth-pad with a simulated controller
          # (HEARTH_PAD_SIM: there's no uinput here), a stand-in controller app (foot with Mods' app id, typing into a
          # file), then a notification, the volume OSD, Quick Access and the Hearth menu over it. The app keeps the
          # keyboard focus (what's typed keeps landing in it), the helper sends nothing while it's in front, Guide + R3
          # gives the pointer back, and another window gets the desktop controls again. Pictures: pad-*.png, pad.log.
          if command -v foot >/dev/null && command -v wtype >/dev/null; then
            SIM=/tmp/padsim; rm -rf "$SIM"; mkdir -p "$SIM"; : > "$SIM/in"
            pq() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call pad "$@" 2>&1 | tail -n1; }
            pin() { for l in "$@"; do printf '%s\n' "$l" >> "$SIM/in"; sleep 0.25; done; }
            tap() { pin "{\"b\":\"$1\",\"down\":true}" "{\"b\":\"$1\",\"down\":false}"; }
            sent() { if [ -f "$SIM/out.log" ]; then wc -l < "$SIM/out.log"; else echo 0; fi; }
            perr() { echo "::error title=controller focus::$*"; touch shots/FAILED; }
            pq sim "$SIM"; sleep 4
            pq state > shots/pad-state-0.json
            rm -f "$HOME/pad-typed.txt"
            foot --app-id hearth-mods --title "Mods (stand-in)" sh -c "cat > $HOME/pad-typed.txt" >/dev/null 2>&1 &
            PADAPP=$!; sleep 4
            pq state > shots/pad-state-1.json
            grep -q '"owner":"hearth-mods"' shots/pad-state-1.json || perr "Mods in front didn't get the controller: $(cat shots/pad-state-1.json)"
            grim shots/pad-1-app-has-controller.png || true
            n0=$(sent)
            tap a; tap b; tap y; tap lb; tap rb; tap down; pin '{"axes":[0,0,1,0.5]}'; sleep 0.6; pin '{"axes":[0,0,0,0]}'
            n1=$(sent)
            [ "$n1" = "$n0" ] || perr "the helper still sent $((n1-n0)) things while Mods had the controller: $(tail -n $((n1-n0)) "$SIM/out.log" | tr '\n' '|')"
            # Things popping up over it: the app keeps the keyboard (what's typed goes on landing in it; one line each,
            # the terminal hands cat whole lines).
            say() { wtype "$1"; wtype -k Return; sleep 0.5; }
            say one
            (timeout 15 notify-send -a "Test App" "Download finished" "A notification over a controller app" || true) &
            for i in 1 2 3 4 5 6; do grim "shots/pad-frame-$i.png" || true; sleep 0.4; done
            say two
            ipc brightness up; grim shots/pad-2-osd.png || true
            say three
            ipc quick toggle; grim shots/pad-3-quick-access.png || true; ipc quick toggle
            sleep 1; say four; sleep 0.5
            pq state > shots/pad-state-2.json
            grep -q '"front":"hearth-mods"' shots/pad-state-2.json || perr "Mods isn't in front any more: $(cat shots/pad-state-2.json)"
            grim shots/pad-4-after-quick-access.png || true
            # Guide: the Hearth menu over it (B closes it); Guide + R3: the pointer in the app (A clicks), then back.
            pin '{"b":"guide","down":true}'; sleep 0.6; grim shots/pad-5-hearth-menu.png || true; pin '{"b":"guide","down":false}'; tap b
            pin '{"b":"guide","down":true}' '{"b":"r3","down":true}' '{"b":"r3","down":false}' '{"b":"guide","down":false}'
            sleep 0.3; grim shots/pad-6-pointer-in-app.png || true
            pq state > shots/pad-state-3.json
            grep -q '"ownerMouse":true' shots/pad-state-3.json || perr "Guide + R3 didn't give the pointer back: $(cat shots/pad-state-3.json)"
            n2=$(sent); tap a; n3=$(sent)
            [ "$n3" -gt "$n2" ] || perr "A didn't click with Guide + R3's pointer on"
            pin '{"b":"guide","down":true}' '{"b":"r3","down":true}' '{"b":"r3","down":false}' '{"b":"guide","down":false}'
            # Another window: the desktop controls are back.
            foot --app-id plain-window --title "Not a controller app" sh -c 'sleep 60' >/dev/null 2>&1 &
            PLAIN=$!; sleep 4
            pq state > shots/pad-state-4.json
            grep -q '"owner":""' shots/pad-state-4.json || perr "another window kept the controller app's mode: $(cat shots/pad-state-4.json)"
            n4=$(sent); tap a; n5=$(sent)
            [ "$n5" -gt "$n4" ] || perr "A didn't click in a window that isn't a controller app"
            grim shots/pad-7-desktop-controls-back.png || true
            kill "$PADAPP" "$PLAIN" 2>/dev/null || true; sleep 1
            got=$(tr '\n' ' ' < "$HOME/pad-typed.txt" 2>/dev/null | sed 's/ $//' || true); printf '%s' "$got" > shots/pad-typed.txt
            [ "$got" = "one two three four" ] || perr "typing into the controller app while things popped up over it gave '$got' (wanted 'one two three four'): it lost the keyboard"
            cp "$SIM/out.log" shots/pad-sim-out.log 2>/dev/null || true
            cp "$HOME/.local/share/nimbus/pad.log" shots/pad.log 2>/dev/null || true
            grep -q "'hearth-mods' in front reads the controller itself" shots/pad.log || perr "pad.log doesn't say Mods got the controller"
            grep -q "in front: desktop controls on" shots/pad.log || perr "pad.log doesn't say the desktop controls came back"
            echo "controller focus: $(grep -c 'controller:' shots/pad.log) mode lines in pad.log; typed '$got'"
            pq sim ""; sleep 1
          else
            echo "::warning title=controller focus::foot or wtype is missing here: the check didn't run"
          fi
          # ---- end of controller apps
          # App icons: every kind of app above resolves (Icon= names through hicolor and Flatpak's exports, a pixmap,
          # an absolute path, windows by app id and StartupWMClass), and they show in the launcher, on the taskbar
          # and on a notification.
          icons_ok=1
          check() {  # what, ipc function, args...
            what="$1"; shift
            out=$(quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call icons "$@" 2>&1 | tail -n1)
            echo "$what: $out" >> shots/icons.txt
            if [ -z "$out" ] || printf '%s' "$out" | grep -qiE "error|not found|no such"; then echo "::error title=icons::$what didn't resolve ($out)"; icons_ok=0; fi
          }
          : > shots/icons.txt
          check "Flatpak (yours), by Icon=" resolve org.hearth.IconTest ""
          check "Flatpak (system), by Icon=" resolve org.hearth.SystemTest ""
          check "Flatpak window, by app id only" resolve "" org.hearth.IconTest
          check "Flatpak window, by StartupWMClass" entry icontest-window
          check "Flatpak window, entry by app id" entry org.hearth.IconTest
          check "AppImage (~/.local/share/icons)" resolve appimagekit_icontest ""
          check "Pixmaps only (Icon=name.png)" resolve icontest-pixmap.png ""
          check "Absolute path" resolve /opt/icontest/abs-icon.png ""
          for n in hearth hearth-settings hearth-files hearth-terminal hearth-disks hearth-browser hearth-tasks hearth-apps hearth-installer hearth-text hearth-photos hearth-generic-app; do
            check "Hearth icon set: $n" resolve "$n" ""
          done
          ipc launcher section apps; grim shots/icons-1-launcher.png || true; ipc launcher close
          if command -v foot >/dev/null; then
            foot --app-id org.hearth.IconTest --title "Flatpak window" sh -c 'sleep 60' >/dev/null 2>&1 &
            foot --app-id icontest-window --title "StartupWMClass window" sh -c 'sleep 60' >/dev/null 2>&1 &
            foot --app-id hearth-terminal --title "Hearth Terminal" sh -c 'sleep 60' >/dev/null 2>&1 &
            sleep 5; grim shots/icons-2-taskbar.png || true
            grim -g "0,1010 1920x70" shots/icons-3-taskbar-closeup.png 2>/dev/null || true
          fi
          (timeout 15 notify-send -a "Flatpak test" -h string:desktop-entry:org.hearth.IconTest "From a Flatpak app" "Its icon comes from its desktop entry" || true) &
          sleep 3; grim shots/icons-4-notification.png || true
          [ "$icons_ok" = 1 ] || touch shots/FAILED
          # Autostart: the test app ran, Steam's entry didn't.
          { python3 hosts/linux/desktop/shell/hearth-tasks autostart-plan; echo; ls "$HOME"; } > shots/autostart.txt 2>&1
          if [ ! -e "$HOME/autostarted" ]; then echo "::error title=autostart::The autostart app didn't start"; touch shots/FAILED; fi
          if [ -e "$HOME/steam-started" ]; then echo "::error title=autostart::Steam's autostart entry was started"; touch shots/FAILED; fi
          # ---- Hearth Files as every app's file chooser (xdg-desktop-portal → hearth-portal → picker.qml) and as the file
          # manager "Show in folder" opens (org.freedesktop.FileManager1): hosts/linux/test/portal_e2e.py calls them like
          # apps do, drives the picker over quickshell ipc and checks what the app gets back.
          export XDG_CURRENT_DESKTOP=Nimbus
          # The portal session's environment (nimbus-session's own lines for GTK and Qt apps, too).
          eval "$(sed -n '/^# >>> portal dialogs/,/^# <<< portal dialogs/p' hosts/linux/session/nimbus-session)"
          echo "GTK_USE_PORTAL=$GTK_USE_PORTAL GDK_DEBUG=$GDK_DEBUG QT_QPA_PLATFORMTHEME=${QT_QPA_PLATFORMTHEME:-}"
          [ "$GTK_USE_PORTAL" = 1 ] && [ "$GDK_DEBUG" = portals ] || { echo "::error title=file chooser::nimbus-session doesn't ask GTK apps to use the portal"; touch shots/FAILED; }
          unset QT_QPA_PLATFORMTHEME
          dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR HOME PATH QT_QUICK_BACKEND NIMBUS_SHARE XDG_DATA_DIRS || echo "dbus-update-activation-environment failed"
          XDP=""; for x in /usr/libexec/xdg-desktop-portal /usr/lib/xdg-desktop-portal; do [ -x "$x" ] && { XDP="$x"; break; }; done
          if [ -n "$XDP" ] && python3 -c 'import gi' 2>/dev/null; then
            "$XDP" -r -v > shots/xdg-desktop-portal.log 2>&1 &
            python3 hosts/linux/desktop/shell/hearth-portal filemanager1 --replace > shots/filemanager1.log 2>&1 &
            sleep 4
            mkdir -p "$HOME/Documents/Reports"; printf 'a,b\n1,2\n' > "$HOME/Documents/data.csv"; head -c 3000 /dev/urandom > "$HOME/Documents/backup.bin"
            timeout 600 python3 hosts/linux/test/portal_e2e.py "$HOME/Documents" shots > shots/file-chooser.txt 2>&1 || touch shots/FAILED
            cat shots/file-chooser.txt
            grep '^::error' shots/file-chooser.txt || true
            cp "$HOME/.local/share/nimbus/picker.log" shots/picker.log 2>/dev/null || true
            pbad=$(grep -E "TypeError|ReferenceError|is not a type|Cannot assign|non-existent|is not defined|Failed to load" shots/picker.log 2>/dev/null | head -8 | cut -c1-200 | tr '\n' '|' || true)
            [ -z "$pbad" ] || { echo "::error title=picker::$pbad"; touch shots/FAILED; }
          else
            echo "::error title=file chooser::xdg-desktop-portal or python3-gobject is missing here"; touch shots/FAILED
          fi
          # ---- end of the file chooser
          cp "$LOG" shots/nimbus-shell.log 2>/dev/null || true
          ls "$XDG_RUNTIME_DIR" > shots/runtime-dir.txt
          pgrep -af "quickshell|/qs( |$)" > shots/quickshell-running.txt || echo "not running" > shots/quickshell-running.txt
          set +x
          # Report: problems in the shell log (not the expected "no uinput/evdev here") fail the test.
          # Expected here and not on a real device: no D-Bus, PipeWire, NetworkManager, controllers or saved files.
          bad=$(grep -iE "ERROR|WARN|TypeError|ReferenceError|Cannot assign|non-existent|is not a type|Failed to load" "$LOG" 2>/dev/null \
            | grep -viE "uinput|evdev|DBus|pipewire|locale|Process failed to start|Read of .* failed|from dropped operation|Cannot open: file://|hearth-pad|upower|statusnotifier|sni\\.|bluez" | head -25 || true)
          if [ -n "$bad" ] || grep -q "not running" shots/quickshell-running.txt; then
            msg=$( { cat shots/quickshell-running.txt; echo "$bad"; tail -15 "$LOG" 2>/dev/null; } | cut -c1-250 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g")
            echo "::error title=shell::$msg"
            touch shots/FAILED
          fi

      # Mantel's looks (Settings › Appearance): Desktop Mode started again with the Steam-style look, every surface,
      # every wallpaper, the customization page and accent / light-mode variants, in shots/looks/.
      - name: Looks (Steam-style, accents, light mode, wallpapers)
        if: always()
        shell: bash
        run: |
          mkdir -p shots/looks
          exec > >(tee shots/looks/step.log) 2>&1
          set -x
          pkill -x labwc || true; pkill -f quickshell || true; sleep 2
          export XDG_RUNTIME_DIR=/tmp/xdg HOME=/tmp/home PATH="/tmp/fakebin:$PATH"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          export QT_QUICK_BACKEND=software NIMBUS_SHARE="$PWD/hosts/linux"
          [ -S "$XDG_RUNTIME_DIR/bus" ] && export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          unset XDG_DATA_DIRS; eval "$(sed -n '/^# >>> data dirs/,/^# <<< data dirs/p' hosts/linux/session/nimbus-session)"
          D="$HOME/.local/share/nimbus/desktop.json"; mkdir -p "$(dirname "$D")"
          set_look() {  # look mode accent wallpaper
            python3 - "$D" "$@" <<'PY'
          import json, sys
          p, look, mode, accent, wall = sys.argv[1:6]
          try: d = json.load(open(p))
          except Exception: d = {}
          d.update(look=look, mode=mode, accent=accent, wallpaper=wall, reduceMotion=False)
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
            sleep 3
          }
          set_look steam dark "" ""
          # As nimbus-session does: the look's files first, then Desktop Mode's labwc folder with them, then labwc.
          sh hosts/linux/desktop/theme/apply.sh
          ls -la "$HOME/.config/nimbus/theme" > shots/looks/theme-files.txt 2>&1 || true
          python3 hosts/linux/desktop/theme/hearth-theme --show > shots/looks/theme.json 2>&1 || true
          CONF=$(python3 hosts/linux/desktop/shell/hearth-system labwc-config)
          labwc -C "$CONF" > shots/looks/labwc.log 2>&1 &
          for i in $(seq 1 30); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? 2>/dev/null | head -1)")
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true
          sleep 15
          LOG="$XDG_RUNTIME_DIR/nimbus-shell.log"
          ipc() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call "$@" || echo "ipc $* failed"; sleep 3; }
          o=shots/looks
          # ---- Steam-style, dark: every surface
          grim $o/steam-01-desktop.png || true
          ipc launcher toggle; grim $o/steam-02-launcher.png || true
          ipc launcher section games; grim $o/steam-03-launcher-games.png || true; ipc launcher close
          ipc quick toggle; grim $o/steam-04-quick-access.png || true; ipc quick toggle
          ipc menu open; grim $o/steam-05-hearth-menu.png || true; ipc menu close
          (timeout 15 notify-send -a "Hearth" "Download finished" "Celeste is ready to play" || true) &
          sleep 3; grim $o/steam-06-notification.png || true
          grim -g "0,1010 1920x70" $o/steam-07-taskbar-closeup.png 2>/dev/null || true
          ipc calendar open; grim $o/steam-08-clock-panel.png || true; ipc calendar close
          ipc power menu; grim $o/steam-09-power-menu.png || true; ipc power close
          ipc settings page appearance; grim $o/steam-10-settings-appearance.png || true
          ipc settings page wifi; grim $o/steam-11-settings-wifi.png || true
          ipc settings page sound; grim $o/steam-12-settings-sound.png || true
          ipc settings page boot; grim $o/steam-12b-settings-boot.png || true; ipc settings close
          mkdir -p "$HOME/Documents/Reports"; echo hi > "$HOME/Documents/notes.txt"
          ipc files open "$HOME/Documents"; grim $o/steam-13-files.png || true
          ipc fileprops open "$HOME/Documents/notes.txt"; grim $o/steam-14-file-properties.png || true; ipc fileprops close 2>/dev/null; ipc filemanager close
          ipc tasks open; grim $o/steam-15-task-manager.png || true; ipc tasks close
          ipc clipboard open 2>/dev/null; grim $o/steam-16-clipboard.png || true; ipc clipboard close 2>/dev/null
          # Window frames (labwc) and apps following the look: a terminal, a KDE app (Qt via qt6ct), a GTK 4 app.
          export QT_QPA_PLATFORMTHEME=qt6ct
          command -v foot >/dev/null && { foot --title "Hearth Terminal" sh -c 'sleep 600' >/dev/null 2>&1 & }
          command -v kcalc >/dev/null && { kcalc >/dev/null 2>&1 & }
          sleep 8; grim $o/steam-17-windows.png || true
          command -v qt6ct >/dev/null && { qt6ct >/dev/null 2>&1 & sleep 5; grim $o/steam-18-qt-palette.png || true; pkill -x qt6ct || true; }
          pkill -x foot || true; sleep 2
          grim $o/steam-19-kde-app.png || true
          pkill -x kcalc || true; unset QT_QPA_PLATFORMTHEME; sleep 2
          # ---- every Slate wallpaper (moving ones as a still: software rendering here holds them still)
          for w in anim:tide anim:ridges anim:motes builtin:slate-dusk builtin:slate-contours builtin:slate-horizon builtin:slate-facets builtin:slate-nebula builtin:slate-ridges; do
            set_look steam dark "" "$w"; sleep 2; grim "$o/wall-${w#*:}.png" || true
          done
          # ---- variants: accents, light mode, Hearth's look
          variant() {  # name look mode accent
            set_look "$2" "$3" "$4" ""; sleep 3
            ipc quick toggle; grim "$o/variant-$1-quick-access.png" || true; ipc quick toggle
            ipc settings page appearance; grim "$o/variant-$1-appearance.png" || true; ipc settings close
            ipc launcher toggle; grim "$o/variant-$1-launcher.png" || true; ipc launcher close
          }
          variant steam-violet steam dark "#9b7bff"
          variant steam-moss steam dark "#5ba32b"
          variant steam-light steam light ""
          # A KDE app (KCalc) in the light look: kdeglobals' [UiSettings] ColorScheme=Hearth (theme/hearth-theme).
          sh hosts/linux/desktop/theme/apply.sh; cp "$HOME/.config/kdeglobals" $o/kdeglobals-light.txt 2>/dev/null || true
          command -v kcalc >/dev/null && { QT_QPA_PLATFORMTHEME=qt6ct kcalc >/dev/null 2>&1 & sleep 8; grim $o/variant-steam-light-kde-app.png || true; pkill -x kcalc || true; sleep 1; }
          variant hearth-light hearth light ""
          variant hearth-steamblue hearth dark "#1a9fff"
          variant hearth-default hearth dark ""
          # ---- Mantel 2026: every look (Settings › Appearance › Look), each with the desktop, Quick settings, the
          # launcher, the notification centre + dashboard and Settings › Appearance, in shots/looks/mantel/.
          # The Cabin and Console looks use the image's own wallpapers (/usr/share/backgrounds/hearth).
          mkdir -p /usr/share/backgrounds/hearth $o/mantel
          cp os/branding/wallpapers/hearth-*.jpg /usr/share/backgrounds/hearth/ 2>/dev/null || true
          m=$o/mantel
          look_shots() {  # look mode
            set_look "$1" "$2" "" ""; sleep 3
            grim "$m/$1-$2-1-desktop.png" || true
            ipc quick toggle; grim "$m/$1-$2-2-quick-settings.png" || true; ipc quick toggle
            ipc launcher toggle; grim "$m/$1-$2-3-launcher.png" || true
            ipc launcher close
            ipc calendar open; grim "$m/$1-$2-4-notifications-dashboard.png" || true; ipc calendar close
            ipc settings page appearance; sleep 2; grim "$m/$1-$2-5-settings-appearance.png" || true; ipc settings close
          }
          (timeout 15 notify-send -a "Friends" "Mira" "Ready for co-op tonight?" || true) &
          sleep 2
          for look in hearth steam gaming zen glass synthwave cabin console; do look_shots "$look" dark; done
          look_shots hearth light
          look_shots glass light
          # The launcher's search finding a Settings page and a game; a notification in the pill.
          set_look hearth dark "" ""; sleep 2
          ipc launcher toggle; wtype "wi" 2>/dev/null || true; sleep 2; grim "$m/search-settings-page.png" || true; ipc launcher close
          ipc launcher toggle; wtype "cel" 2>/dev/null || true; sleep 2; grim "$m/search-game.png" || true; ipc launcher close
          (timeout 15 notify-send -a "Hearth" "Download finished" "Celeste is ready to play" || true) &
          sleep 2; grim "$m/hearth-notification-pill.png" || true
          # Handheld (1280×800): the essentials in the bar, bigger dock icons.
          wlr-randr --output HEADLESS-1 --custom-mode 1280x800 || true; sleep 4
          grim "$m/handheld-hearth-1-desktop.png" || true
          ipc quick toggle; grim "$m/handheld-hearth-2-quick-settings.png" || true; ipc quick toggle
          set_look console dark "" ""; sleep 3; grim "$m/handheld-console-1-desktop.png" || true
          set_look gaming dark "" ""; sleep 3; grim "$m/handheld-gaming-1-desktop.png" || true
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true; sleep 3
          # Bar and dock options on top of a look: Hearth with a full-width bar and an auto-hiding dock.
          python3 - "$D" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p)); d.update(look='hearth', barStyle='bar', dockMode='autohide', deskClock='on'); open(p, 'w').write(json.dumps(d))
          PY
          sleep 3; grim "$m/hearth-bar-autohide.png" || true
          python3 - "$D" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          for k in ('barStyle', 'dockMode', 'deskClock'): d.pop(k, None)
          open(p, 'w').write(json.dumps(d))
          PY
          sleep 2
          # Nothing the looks did may have written a new option by itself (Mantel 2026's keys stay out of the file
          # until someone changes them; the ones this test set were taken out again above).
          cp "$D" $m/desktop.json 2>/dev/null || true
          python3 - "$D" <<'PY' || { echo "::error title=Mantel 2026::a setting was written that nobody changed: $(tr -d '\n' < "$D" | cut -c1-400)"; touch shots/FAILED; }
          import json, sys
          d = json.load(open(sys.argv[1]))
          new = {'barStyle', 'dockMode', 'deskClock', 'panelGlass', 'sunset', 'sunsetLight', 'sunsetDark', 'accentFrom', 'wallSwatches'}
          sys.exit(1 if new & set(d) else 0)
          PY
          if grep -q "using the classic taskbar" "$LOG" 2>/dev/null; then
            echo "::error title=Mantel 2026::the islands or the dock didn't load: $(grep -B3 'using the classic taskbar' "$LOG" | head -8 | cut -c1-200 | tr '\n' '|')"
            touch shots/FAILED
          else
            echo "::notice title=Mantel 2026::every look rendered with the islands and the dock ($(ls $m | wc -l) pictures in looks/mantel)"
          fi
          cp "$HOME/.config/nimbus/theme/themerc-override" $o/themerc-override.txt 2>/dev/null || true
          cp "$LOG" $o/nimbus-shell.log 2>/dev/null || true
          set +x
          bad=$(grep -E "TypeError|ReferenceError|Cannot assign|non-existent|is not a type|Failed to load|is not defined" "$LOG" 2>/dev/null \
            | grep -viE "uinput|evdev|DBus|pipewire|hearth-pad|upower|statusnotifier|sni\\.|bluez" | head -15 || true)
          if [ -n "$bad" ]; then
            echo "::error title=looks::$(printf '%s' "$bad" | cut -c1-250 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            touch shots/FAILED
          fi

      # The screenshots and logs also go to the ci/desktop-shots branch, so they can be looked at without
      # downloading the artifact.
      # A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.
      - name: Publish screenshots to a branch
        # (A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          to=ci/desktop-shots
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ] && [ "$GITHUB_REF_NAME" != linux-host ]; then
            to="ci/desktop-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          cd shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Desktop Mode test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"

      - name: Fail if the shell had problems
        if: always()
        run: test ! -e shots/FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: shots
          retention-days: 14
