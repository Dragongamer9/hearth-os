# Starts Hearth Desktop Mode for real on a virtual screen (labwc headless + Quickshell on Fedora, as on
# Hearth) and fails if the shell reports errors. Takes screenshots of the desktop, Quick Access, the Hearth
# menu and the help card, kept as a download on the run.
name: Desktop Mode test

on:
  push:
    branches: [main, linux-host]
    paths: ['hosts/linux/desktop/**', 'hosts/linux/session/**', 'branding/icons/**', '.github/workflows/desktop-test.yml', 'os/system_files/usr/libexec/nimbus/hearth-boot-look']
  pull_request:
    paths: ['hosts/linux/desktop/**', 'hosts/linux/session/**', 'branding/icons/**']
  workflow_dispatch:

permissions:
  contents: write    # the screenshots branch

jobs:
  desktop:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install labwc, Quickshell and friends
        run: |
          dnf -y install dnf5-plugins git labwc xorg-x11-server-Xwayland qt6-qtsvg procps-ng grim wlr-randr python3 python3-evdev qt6ct \
            google-noto-sans-fonts adwaita-icon-theme NetworkManager bluez pciutils breeze-icon-theme wlsunset >/dev/null
          # A session bus (notifications, the tray, media keys), notify-send, the clipboard and typing keys (wtype).
          dnf -y install dbus-daemon libnotify wl-clipboard wtype slurp >/dev/null || true
          # A Wayland app whose app id can be set (a stand-in Flatpak window for the taskbar's icon check).
          dnf -y install foot hicolor-icon-theme >/dev/null || true
          # Mantel's Steam-style look: its font (Inter, openly licensed) and a KDE app to see apps follow it.
          dnf -y install rsms-inter-fonts kcalc >/dev/null || true
          # Hearth Files as the file chooser: xdg-desktop-portal, GLib's D-Bus for Python (hearth-portal), a GTK 3 app.
          dnf -y install xdg-desktop-portal python3-gobject gtk3 dbus-tools shared-mime-info >/dev/null || true
          dnf -y copr enable errornointernet/quickshell >/dev/null
          dnf -y install quickshell >/dev/null
          quickshell --version || true

      - uses: actions/checkout@v4

      # The looks (Settings › Appearance) for labwc, Qt/KDE, GTK and Hearth's own apps (theme.css / theme.json).
      - name: Looks and apps theme tests
        run: |
          python3 -m unittest discover -s hosts/linux/test -p 'test_*theme.py' -v
          # Mantel 2026: the eight looks, settings that never change by themselves, Sunset off, Game Mode in every look.
          python3 -m unittest discover -s hosts/linux/test -p 'test_mantel_2026.py' -v

      - name: Start Desktop Mode
        shell: bash
        run: |
          mkdir -p shots
          exec > >(tee shots/step.log) 2>&1
          set -x
          export XDG_RUNTIME_DIR=/tmp/xdg HOME=/tmp/home
          mkdir -p "$XDG_RUNTIME_DIR" "$HOME" && chmod 700 "$XDG_RUNTIME_DIR"
          # The launcher's Games section: what Hearth listed last time (no Hearth app here to ask).
          mkdir -p "$HOME/.cache/hearth"
          printf '%s' '[{"id":"steam:570","title":"Dota 2","source":"steam","cover":"","wide":"","icon":""},{"id":"manual:1","title":"Celeste","source":"manual","cover":"","wide":"","icon":""},{"id":"beacon:bfme2","title":"The Battle for Middle-earth II","source":"beacon","cover":"","wide":"","icon":""}]' > "$HOME/.cache/hearth/desktop-games.json"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          export QT_QUICK_BACKEND=software NIMBUS_SHARE="$PWD/hosts/linux"
          chmod +x hosts/linux/desktop/labwc/autostart hosts/linux/desktop/theme/apply.sh
          # ---- Hearth Files as every app's file chooser: the portal backend and FileChooser=hearth for Nimbus, the way
          # the images install them (os/system_files, base-*.yml), with the backend run from this checkout.
          mkdir -p /usr/share/xdg-desktop-portal/portals /usr/share/dbus-1/services
          cp os/system_files/usr/share/xdg-desktop-portal/portals/hearth.portal /usr/share/xdg-desktop-portal/portals/
          printf '[preferred]\ndefault=none\norg.freedesktop.impl.portal.FileChooser=hearth\n' > /usr/share/xdg-desktop-portal/nimbus-portals.conf
          sed "s#/usr/share/nimbus/desktop/shell#$PWD/hosts/linux/desktop/shell#" os/system_files/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.hearth.service \
            > /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.hearth.service
          # ---- end of the file chooser's setup
          # A session bus, so the shell's notification server, tray and media keys start as on a real desktop.
          if command -v dbus-daemon >/dev/null; then
            dbus-daemon --session --fork --address="unix:path=$XDG_RUNTIME_DIR/bus" && export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          fi
          # An app that opens when you sign in (it should start), and Steam's own entry (it shouldn't: Hearth starts
          # Steam). A stand-in "steam" that leaves a mark if it's run.
          mkdir -p "$HOME/.config/autostart" /tmp/fakebin
          printf '#!/bin/sh\ntouch "$HOME/steam-started"\n' > /tmp/fakebin/steam && chmod +x /tmp/fakebin/steam
          # ---- Hearth Time stand-in (hosts/hearth-time): an event for the clock panel, a weather line for Quick Access.
          printf '%s\n' '#!/bin/sh' 'case "$1" in' \
            '  --events) d=$(date +%F); printf "{\"events\":[{\"title\":\"Dentist\",\"date\":\"%s\",\"lastDate\":\"%s\",\"allDay\":false,\"start\":%s000,\"end\":%s000,\"location\":\"Smile Clinic\",\"color\":\"\"}]}\n" "$d" "$d" "$(date -d "+2 hours" +%s)" "$(date -d "+3 hours" +%s)" ;;' \
            '  --weather-summary) echo "{\"place\":\"Lisbon\",\"line\":\"18° Partly cloudy\",\"day\":true}" ;;' 'esac' > /tmp/fakebin/hearth-time
          chmod +x /tmp/fakebin/hearth-time
          # ---- end of Hearth Time stand-in
          # Hearth Friends (Friends.qml): a stand-in for the service with a signed-in account, a friend playing, a chat.
          cat > /tmp/fakebin/hearth-friends <<'FAKE'
          #!/bin/sh
          # Signed out (with /tmp/friends-out): matrix.org's own sign-in page, by phone (a QR code) or in the browser.
          if [ -f /tmp/friends-out ]; then
            case "$1:$2" in
              watch:*) echo '{"id":1,"ok":true,"value":{"signedIn":false}}'; sleep 3600 ;;
              call:status) echo '{"signedIn":false,"settings":{"homeserver":"matrix.org"}}' ;;
              call:authMethods) echo '{"homeserver":"matrix.org","oauth":true,"qr":true,"browser":true,"create":true,"password":true,"register":"oauth"}' ;;
              call:authStart) echo '{"mode":"qr","homeserver":"matrix.org","create":false,"url":"https://account.matrix.org/link?code=WDJB-MJHT","shortUrl":"account.matrix.org/link","userCode":"WDJB-MJHT","expiresIn":600,"qrRows":["1111111011010110101111111", "1000001011110110001000001", "1011101001010111101011101", "1011101001001011101011101", "1011101001101100101011101", "1000001000001011001000001", "1111111011100001001111111", "0000000000100101000000000", "0001101111101110110000111", "0011111011110000001000011", "1011111111111001111100111", "1110110010100001110001100", "0000101111100100011111000", "1001000011010011001110010", "0010110000100111101110110", "0100001111011001000101100", "0001000010100001000111111", "0000000000010010010110011", "1111111001110101110010001", "1000001011011100110001101", "1011101010001010110011011", "1011101011111010111110011", "1011101001011010001000111", "1000001011011100011111110", "1111111000101111101011111"]}' ;;
              *) echo 'null' ;;
            esac
            exit 0
          fi
          case "$1:$2" in
            watch:*) echo '{"id":1,"ok":true,"value":{"signedIn":true}}'; sleep 3600 ;;
            call:status) echo '{"signedIn":true,"userId":"@dragon:matrix.org","homeserver":"matrix.org","lives":"matrix.org (run by the Matrix.org Foundation)","synced":true}' ;;
            call:friends) echo '[{"userId":"@sarah:matrix.org","name":"Sarah","roomId":"!s:m","state":"friend","presence":"online","game":"Dota 2","joinable":true,"unread":2},{"userId":"@mike:matrix.org","name":"Mike","roomId":"!m:m","state":"friend","presence":"unavailable","game":null,"unread":0}]' ;;
            call:chats) echo '[{"roomId":"!s:m","name":"Sarah","direct":true,"members":2,"unread":2,"muted":false,"encrypted":true,"last":{"body":"Want to play?","mine":false}}]' ;;
            call:requests) echo '{"requests":[{"roomId":"!r:m","from":"@new:example.org","name":"New person","direct":true}],"invites":[]}' ;;
            call:messages) echo '{"roomId":"!s:m","messages":[{"id":"$1","sender":"@sarah:matrix.org","senderName":"Sarah","mine":false,"at":1790000000000,"kind":"text","body":"Hey! On tonight?"},{"id":"$2","sender":"@dragon:matrix.org","mine":true,"at":1790000060000,"kind":"text","body":"Yes, after dinner"},{"id":"$3","sender":"@sarah:matrix.org","senderName":"Sarah","mine":false,"at":1790000120000,"kind":"game","body":"Lets play","game":{"title":"Dota 2","store":"steam","id":"steam:570"}}],"atStart":true}' ;;
            *) echo 'null' ;;
          esac
          FAKE
          sed -i 's/^          //' /tmp/fakebin/hearth-friends; chmod +x /tmp/fakebin/hearth-friends
          # The Hearth app (nimbus) stand-in for Mantel's Settings pages moved from the old Game Mode (docs/SETTINGS-MOVE.md):
          # `--settings-call <method>` answers like hearth-core settings_cli.rs; `--windowed --page <page>` notes the page.
          cat > /tmp/fakebin/nimbus <<'FAKE'
          #!/bin/sh
          [ "$1" = --windowed ] && { echo "$*" >> "$HOME/nimbus-pages"; exit 0; }
          [ "$1" = --send-logs ] && { echo "Sent. Your code: ABCD-EFGH-JK"; exit 0; }
          [ "$1" = --settings-call ] || exit 2
          case "$2" in
            remote.status) echo '{"ok":true,"value":{"installed":true,"on":true,"clients":[{"name":"Living room TV","uuid":"a1"},{"name":"Pixel 8","uuid":"b2"}],"needsLogin":false,"addresses":["192.168.1.20"],"moonlight":false}}' ;;
            steamMode.status) echo '{"ok":true,"value":{"available":true,"steam":"native","gamescope":true,"inSession":false,"decky":{"installed":true,"via":"hearth","plugin":true,"shipped":true},"lastFailure":"Steam ended right away (code 1)"}}' ;;
            diskspace.status) echo '{"ok":true,"value":{"drives":[{"name":"This device","mount":"/","size":512000000000,"used":301000000000,"free":211000000000,"games":true,"readOnly":false},{"name":"SD card","mount":"/run/media/deck/SD","size":256000000000,"used":214000000000,"free":42000000000,"games":true,"readOnly":false}],"games":[{"title":"Baldur'"'"'s Gate 3","store":"GOG","drive":"/run/media/deck/SD","size":122000000000},{"title":"Cyberpunk 2077","store":"Steam","drive":"/","size":71000000000},{"title":"Hades II","store":"Steam","drive":"/","size":9800000000},{"title":"Celeste","store":"Added","drive":"/","size":1200000000}],"warn":{"on":true,"gb":15},"low":[],"job":null}}' ;;
            diskspace.cleanList) echo '{"ok":true,"value":{"items":[{"key":"shader:1","title":"Shader cache: Cyberpunk 2077","where":"~/.steam/steam/steamapps/shadercache/1091500","bytes":3400000000,"saves":[],"selectable":true,"on":true,"confirm":false},{"key":"prefix:2","title":"Proton prefix: a game that is gone","where":"~/Games/Prefixes/old","bytes":1900000000,"saves":["Saves"],"cloud":true,"selectable":true,"on":false,"confirm":true}]}}' ;;
            diskspace.setWarn) echo '{"ok":true,"value":{"on":true,"gb":15}}' ;;
            backup.status) echo '{"ok":true,"value":{"destinations":[{"path":"/run/media/deck/HEARTH","label":"HEARTH (USB drive)","removable":true},{"path":"/tmp/home/Backups","label":"Backups folder (on this device)","removable":false}],"backups":[{"file":"/tmp/home/Backups/hearth-backup-2026-11-01.tar.zst","at":1793000000000,"bytes":42000000}]}}' ;;
            *) echo '{"ok":false,"error":"not in this test"}'; exit 1 ;;
          esac
          FAKE
          sed -i 's/^          //' /tmp/fakebin/nimbus; chmod +x /tmp/fakebin/nimbus
          # The image's own "Hearth" menu entry (os-bases/peppermint/build.sh), to check Mantel's launcher leaves it out.
          mkdir -p "$HOME/.local/share/applications"
          sed -n '/^cat > \/usr\/share\/applications\/nimbus.desktop <<DESKTOP$/,/^DESKTOP$/p' os-bases/peppermint/build.sh | sed '1d;$d' > "$HOME/.local/share/applications/nimbus.desktop"
          grep -q '^Name=Hearth$' "$HOME/.local/share/applications/nimbus.desktop" || { echo "::error title=settings move::couldn't take nimbus.desktop from build.sh"; touch shots/FAILED; }
          export PATH="/tmp/fakebin:$PATH"
          printf '[Desktop Entry]\nType=Application\nName=Autostart test\nExec=touch %s/autostarted\n' "$HOME" > "$HOME/.config/autostart/test.desktop"
          printf '[Desktop Entry]\nType=Application\nName=Steam\nExec=steam -silent %%U\n' > "$HOME/.config/autostart/steam.desktop"
          # App icons: apps the way Flatpak (yours and the system's), AppImage/Distrobox exports and old-style
          # packages leave them, and Hearth's own icon set as the images install it. XDG_DATA_DIRS comes from
          # nimbus-session's own lines (the login screen gives the session none here).
          ICONS="$HOME/.local/share/icons/hicolor"
          for d in branding/icons/png/*x*; do mkdir -p "$ICONS/$(basename "$d")/apps" && cp "$d"/*.png "$ICONS/$(basename "$d")/apps/"; done
          mkdir -p "$ICONS/scalable/apps" && cp branding/icons/apps/*.svg "$ICONS/scalable/apps/"
          testicon() { printf '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="%s"/><circle cx="32" cy="32" r="14" fill="#fff"/></svg>' "$1"; }
          entry() { printf '[Desktop Entry]\nType=Application\nName=%s\nExec=%s\nIcon=%s\n%b' "$1" "$2" "$3" "$4"; }
          UF="$HOME/.local/share/flatpak/exports/share"; SF=/var/lib/flatpak/exports/share
          mkdir -p "$UF/applications" "$UF/icons/hicolor/scalable/apps" "$SF/applications" "$SF/icons/hicolor/scalable/apps" \
            "$HOME/.local/share/applications" "$ICONS/48x48/apps" /usr/share/pixmaps /opt/icontest
          entry "Aa Flatpak (yours)" "/usr/bin/flatpak run --branch=stable --arch=x86_64 org.hearth.IconTest" org.hearth.IconTest "StartupWMClass=icontest-window\n" > "$UF/applications/org.hearth.IconTest.desktop"
          testicon '#2f9e44' > "$UF/icons/hicolor/scalable/apps/org.hearth.IconTest.svg"
          entry "Aa Flatpak (system)" "/usr/bin/flatpak run org.hearth.SystemTest" org.hearth.SystemTest "" > "$SF/applications/org.hearth.SystemTest.desktop"
          testicon '#1971c2' > "$SF/icons/hicolor/scalable/apps/org.hearth.SystemTest.svg"
          entry "Aa AppImage" "/opt/icontest/app.AppImage" appimagekit_icontest "" > "$HOME/.local/share/applications/appimagekit_icontest.desktop"
          cp branding/icons/png/48x48/hearth-paint.png "$ICONS/48x48/apps/appimagekit_icontest.png"
          entry "Aa Pixmaps only" "/opt/icontest/pix" icontest-pixmap.png "" > "$HOME/.local/share/applications/icontest-pixmap.desktop"
          cp branding/icons/png/64x64/hearth-maps.png /usr/share/pixmaps/icontest-pixmap.png
          entry "Aa Absolute path" "/opt/icontest/abs" /opt/icontest/abs-icon.png "" > "$HOME/.local/share/applications/icontest-abs.desktop"
          cp branding/icons/png/128x128/hearth-emoji.png /opt/icontest/abs-icon.png
          entry "Aa No icon" "/opt/icontest/none" icontest-missing "" > "$HOME/.local/share/applications/icontest-none.desktop"
          unset XDG_DATA_DIRS
          eval "$(sed -n '/^# >>> data dirs/,/^# <<< data dirs/p' hosts/linux/session/nimbus-session)"
          echo "XDG_DATA_DIRS=$XDG_DATA_DIRS"
          case ":$XDG_DATA_DIRS:" in *":$UF:"*) ;; *) echo "::error title=icons::nimbus-session doesn't put your Flatpak apps in XDG_DATA_DIRS"; touch shots/FAILED ;; esac
          case ":$XDG_DATA_DIRS:" in *":$SF:"*) ;; *) echo "::error title=icons::nimbus-session doesn't put the system's Flatpak apps in XDG_DATA_DIRS"; touch shots/FAILED ;; esac
          # Desktop Mode's settings file there from the start (the shell watches it once it exists: the keyboard looks'
          # light-mode pictures below change it while the shell runs).
          mkdir -p "$HOME/.local/share/nimbus"; [ -s "$HOME/.local/share/nimbus/desktop.json" ] || echo '{}' > "$HOME/.local/share/nimbus/desktop.json"
          labwc -C hosts/linux/desktop/labwc >shots/labwc.log 2>&1 &
          for i in $(seq 1 30); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? 2>/dev/null | head -1)")
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true
          sleep 15
          LOG="$XDG_RUNTIME_DIR/nimbus-shell.log"
          ipc() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call "$@" || echo "ipc $* failed"; sleep 3; }
          grim shots/1-desktop.png || true
          ipc quick toggle; grim shots/2-quick-access.png || true; ipc quick toggle
          ipc menu open; grim shots/3-hearth-menu.png || true; ipc menu close
          ipc launcher toggle; grim shots/4-launcher.png || true; ipc launcher toggle
          ipc launcher section games; grim shots/4b-launcher-games.png || true; ipc launcher close
          ipc help toggle; grim shots/5-controls.png || true; ipc help toggle
          # Hearth Settings, every page
          n=6
          for p in wifi bluetooth sound notifications display appearance power controller keyboard mouse defaults signin browser claude updates about install apps remote games storage steam; do
            ipc settings page "$p"; grim "shots/$n-settings-$p.png" || true; n=$((n+1))
          done
          ipc settings close
          # ---- Moved from the old Game Mode (docs/SETTINGS-MOVE.md): each new or changed page, with the controller.
          mkdir -p shots/settings-move
          # (Closed first: a fresh window puts the controller on the page list, so Right goes into the page.)
          sm() { ipc settings close; ipc settings page "$1"; sleep 2; grim "shots/settings-move/$2.png" || true; }
          sm remote 01-remote-play
          sm games 02-games-and-stores
          wtype -k Right; sleep 1; for i in 1 2 3 4 5 6 7 8 9; do wtype -k Down; done; sleep 1; grim shots/settings-move/03-games-and-stores-apps.png || true
          sm storage 04-storage
          wtype -k Right; sleep 1; for i in $(seq 1 12); do wtype -k Down; done; sleep 1; wtype -k Return; sleep 3; grim shots/settings-move/05-storage-clean-up.png || true
          for i in 1 2 3 4; do wtype -k Down; done; sleep 1; grim shots/settings-move/06-storage-low-space.png || true
          sm steam 07-steam-game-mode
          sm about 08-about-help-backup
          wtype -k Right; sleep 1; for i in $(seq 1 11); do wtype -k Down; done; sleep 1; grim shots/settings-move/08b-about-privacy.png || true
          wtype -k Right; sleep 1; for i in $(seq 1 16); do wtype -k Down; done; sleep 1; grim shots/settings-move/09-about-backup.png || true
          sm link 10-hearth-link
          sm accessibility 11-accessibility
          sm power 12-power
          # Updates with the version before kept (a stand-in hearth-admin through a stand-in pkexec, for this shot only).
          mkdir -p /usr/libexec/nimbus
          printf '%s\n' '#!/bin/sh' 'case "$1" in update-status) echo "{\"booted\":{\"version\":\"1.0.0\",\"image\":\"ghcr.io/dragongamer9/hearth-peppermint:testing\"},\"staged\":null,\"available\":null,\"rollback\":{\"version\":\"0.6.63\"},\"rollbackQueued\":false}" ;; esac' > /usr/libexec/nimbus/hearth-admin
          printf '#!/bin/sh\nexec "$@"\n' > /tmp/fakebin/pkexec; chmod +x /usr/libexec/nimbus/hearth-admin /tmp/fakebin/pkexec
          sm updates 13-updates-go-back
          wtype -k Right; sleep 1; for i in 1 2 3 4; do wtype -k Down; done; wtype -k Return; sleep 2; grim shots/settings-move/14-updates-go-back-ask.png || true
          rm -f /usr/libexec/nimbus/hearth-admin /tmp/fakebin/pkexec
          ipc settings close
          # The launcher: no "Hearth" (the old Game Mode in a window), even with its menu entry installed.
          ipc launcher toggle; grim shots/settings-move/15-launcher-no-hearth.png || true; ipc launcher close
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call launcher listed > shots/settings-move/launcher-apps.txt 2>&1 || true
          if grep -qx 'nimbus' shots/settings-move/launcher-apps.txt; then echo "::error title=settings move::Mantel's launcher lists the Hearth app (the old Game Mode)"; touch shots/FAILED; fi
          grep -q '^hearth' shots/settings-move/launcher-apps.txt || echo "::warning title=settings move::the launcher listed nothing to compare: $(head -c 300 shots/settings-move/launcher-apps.txt)"
          cat "$HOME/nimbus-pages" > shots/settings-move/pages-opened.txt 2>/dev/null || true
          # ---- Settings › Default apps: what hearth-system lists, and a choice made, read back and reset.
          { python3 hosts/linux/desktop/shell/hearth-system defaults; python3 hosts/linux/desktop/shell/hearth-system default-set terminal foot.desktop;
            python3 hosts/linux/desktop/shell/hearth-system defaults | python3 -c 'import json, sys; k = {x["kind"]: x for x in json.load(sys.stdin)["kinds"]}; print("terminal now:", k["terminal"]["current"], k["terminal"]["yours"])';
            python3 hosts/linux/desktop/shell/hearth-system default-reset terminal; cat "$HOME/.config/mimeapps.list"; } > shots/default-apps.txt 2>&1 || true
          grep -q "terminal now: foot.desktop True" shots/default-apps.txt || { command -v foot >/dev/null && { echo "::error title=Default apps::picking foot as the terminal didn't stick: $(tr '\n' '|' < shots/default-apps.txt | cut -c1-600)"; touch shots/FAILED; }; }
          # ---- Settings › Accessibility (hearth-access), and labwc's magnifier on Super+= (zoomed in, then out again)
          ipc settings page accessibility; grim "shots/$n-settings-accessibility.png" || true; n=$((n+1))
          # ---- Settings › Boot & startup (1.1): its helper, the splash presets and the startup animations as the image has them
          mkdir -p /usr/libexec/nimbus /usr/share/hearth /usr/share/plymouth/themes
          cp os/system_files/usr/libexec/nimbus/hearth-boot-look /usr/libexec/nimbus/ && chmod 755 /usr/libexec/nimbus/hearth-boot-look
          cp -r os/system_files/usr/share/hearth/startup-movies /usr/share/hearth/ && cp -r os/system_files/usr/share/plymouth/themes/hearth* /usr/share/plymouth/themes/
          printf '#!/bin/sh\necho hearth-bls-grub stand-in\n' > /usr/libexec/nimbus/hearth-bls-grub
          ipc settings page boot; grim "shots/$n-settings-boot.png" || true; n=$((n+1))
          python3 /usr/libexec/nimbus/hearth-boot-look status > shots/boot-look-status.json 2>&1 || { echo "::error title=Boot & startup::hearth-boot-look status failed"; touch shots/FAILED; }
          python3 hosts/linux/desktop/shell/hearth-access status > shots/accessibility-status.json 2>&1 || true
          ipc settings close
          if command -v wtype >/dev/null; then
            wtype -M logo -k equal -m logo; sleep 1; wtype -M logo -k equal -m logo; sleep 2
            grim "shots/$n-magnifier.png" || true; n=$((n+1))
            wtype -M logo -k minus -m logo; sleep 1; wtype -M logo -k minus -m logo; sleep 1
          fi
          labwc --version > shots/labwc-version.txt 2>&1 || true
          # ---- end Settings › Accessibility
          ipc power menu; grim "shots/$n-power-menu.png" || true; ipc power close
          # Taskbar & desktop: a folder and a file on the desktop, its right-click menu, the clock's panel
          mkdir -p "$HOME/Desktop/Projects" && echo hi > "$HOME/Desktop/notes.txt"; sleep 4
          ipc desktop menu; grim "shots/$((n+1))-desktop-menu.png" || true; ipc desktop close
          ipc calendar open; grim "shots/$((n+2))-calendar.png" || true; ipc calendar close
          # Hearth Files: icons, details, compact, the actions menu, a search, and Properties (General, Permissions,
          # Checksums; a folder; several things)
          mkdir -p "$HOME/Documents/Reports" "$HOME/Templates" && printf 'a,b\n1,2\n' > "$HOME/Documents/data.csv"
          head -c 300000 /dev/urandom > "$HOME/Documents/backup.bin"; echo letter > "$HOME/Templates/Letter.txt"
