# Starts Hearth Desktop Mode for real on a virtual screen (labwc headless + Quickshell on Fedora, as on
# Hearth) and fails if the shell reports errors. Takes screenshots of the desktop, Quick Access, the Hearth
# menu and the help card, kept as a download on the run.
name: Desktop Mode test

on:
  push:
    branches: [main, linux-host]
    paths: ['hosts/linux/desktop/**', '.github/workflows/desktop-test.yml']
  pull_request:
    paths: ['hosts/linux/desktop/**']
  workflow_dispatch:

permissions:
  contents: write    # the screenshots branch

jobs:
  desktop:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install labwc, Quickshell and friends
        run: |
          dnf -y install dnf5-plugins git labwc xorg-x11-server-Xwayland qt6-qtsvg procps-ng grim wlr-randr python3 python3-evdev qt6ct \
            google-noto-sans-fonts adwaita-icon-theme NetworkManager bluez pciutils breeze-icon-theme wlsunset >/dev/null
          # A session bus (notifications, the tray, media keys), notify-send, the clipboard and typing keys (wtype).
          dnf -y install dbus-daemon libnotify wl-clipboard wtype slurp >/dev/null || true
          dnf -y copr enable errornointernet/quickshell >/dev/null
          dnf -y install quickshell >/dev/null
          quickshell --version || true

      - uses: actions/checkout@v4

      - name: Start Desktop Mode
        shell: bash
        run: |
          mkdir -p shots
          exec > >(tee shots/step.log) 2>&1
          set -x
          export XDG_RUNTIME_DIR=/tmp/xdg HOME=/tmp/home
          mkdir -p "$XDG_RUNTIME_DIR" "$HOME" && chmod 700 "$XDG_RUNTIME_DIR"
          # The launcher's Games section: what Hearth listed last time (no Hearth app here to ask).
          mkdir -p "$HOME/.cache/hearth"
          printf '%s' '[{"id":"steam:570","title":"Dota 2","source":"steam","cover":"","wide":"","icon":""},{"id":"manual:1","title":"Celeste","source":"manual","cover":"","wide":"","icon":""},{"id":"beacon:bfme2","title":"The Battle for Middle-earth II","source":"beacon","cover":"","wide":"","icon":""}]' > "$HOME/.cache/hearth/desktop-games.json"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          export QT_QUICK_BACKEND=software NIMBUS_SHARE="$PWD/hosts/linux"
          chmod +x hosts/linux/desktop/labwc/autostart hosts/linux/desktop/theme/apply.sh
          # A session bus, so the shell's notification server, tray and media keys start as on a real desktop.
          if command -v dbus-daemon >/dev/null; then
            dbus-daemon --session --fork --address="unix:path=$XDG_RUNTIME_DIR/bus" && export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          fi
          # An app that opens when you sign in (it should start), and Steam's own entry (it shouldn't: Hearth starts
          # Steam). A stand-in "steam" that leaves a mark if it's run.
          mkdir -p "$HOME/.config/autostart" /tmp/fakebin
          printf '#!/bin/sh\ntouch "$HOME/steam-started"\n' > /tmp/fakebin/steam && chmod +x /tmp/fakebin/steam
          export PATH="/tmp/fakebin:$PATH"
          printf '[Desktop Entry]\nType=Application\nName=Autostart test\nExec=touch %s/autostarted\n' "$HOME" > "$HOME/.config/autostart/test.desktop"
          printf '[Desktop Entry]\nType=Application\nName=Steam\nExec=steam -silent %%U\n' > "$HOME/.config/autostart/steam.desktop"
          labwc -C hosts/linux/desktop/labwc >shots/labwc.log 2>&1 &
          for i in $(seq 1 30); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? 2>/dev/null | head -1)")
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true
          sleep 15
          LOG="$XDG_RUNTIME_DIR/nimbus-shell.log"
          ipc() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call "$@" || echo "ipc $* failed"; sleep 3; }
          grim shots/1-desktop.png || true
          ipc quick toggle; grim shots/2-quick-access.png || true; ipc quick toggle
          ipc menu open; grim shots/3-hearth-menu.png || true; ipc menu close
          ipc launcher toggle; grim shots/4-launcher.png || true; ipc launcher toggle
          ipc launcher section games; grim shots/4b-launcher-games.png || true; ipc launcher close
          ipc help toggle; grim shots/5-controls.png || true; ipc help toggle
          # Hearth Settings, every page
          n=6
          for p in wifi bluetooth sound notifications display appearance power controller keyboard mouse signin browser claude updates about install; do
            ipc settings page "$p"; grim "shots/$n-settings-$p.png" || true; n=$((n+1))
          done
          ipc settings close
          # ---- Settings › Accessibility (hearth-access), and labwc's magnifier on Super+= (zoomed in, then out again)
          ipc settings page accessibility; grim "shots/$n-settings-accessibility.png" || true; n=$((n+1))
          python3 hosts/linux/desktop/shell/hearth-access status > shots/accessibility-status.json 2>&1 || true
          ipc settings close
          if command -v wtype >/dev/null; then
            wtype -M logo -k equal -m logo; sleep 1; wtype -M logo -k equal -m logo; sleep 2
            grim "shots/$n-magnifier.png" || true; n=$((n+1))
            wtype -M logo -k minus -m logo; sleep 1; wtype -M logo -k minus -m logo; sleep 1
          fi
          labwc --version > shots/labwc-version.txt 2>&1 || true
          # ---- end Settings › Accessibility
          ipc power menu; grim "shots/$n-power-menu.png" || true; ipc power close
          # Taskbar & desktop: a folder and a file on the desktop, its right-click menu, the clock's panel
          mkdir -p "$HOME/Desktop/Projects" && echo hi > "$HOME/Desktop/notes.txt"; sleep 4
          ipc desktop menu; grim "shots/$((n+1))-desktop-menu.png" || true; ipc desktop close
          ipc calendar open; grim "shots/$((n+2))-calendar.png" || true; ipc calendar close
          # Hearth Files: icons, details, compact, the actions menu, a search, and Properties (General, Permissions,
          # Checksums; a folder; several things)
          mkdir -p "$HOME/Documents/Reports" "$HOME/Templates" && printf 'a,b\n1,2\n' > "$HOME/Documents/data.csv"
          head -c 300000 /dev/urandom > "$HOME/Documents/backup.bin"; echo letter > "$HOME/Templates/Letter.txt"
          ipc files open "$HOME/Documents"; grim shots/files-1-icons.png || true
          ipc filemanager view details; ipc filemanager select data.csv; grim shots/files-2-details.png || true
          ipc filemanager menu; grim shots/files-3-menu.png || true; ipc filemanager close
          ipc filemanager view compact; grim shots/files-4-compact.png || true
          ipc filemanager search data; grim shots/files-5-search.png || true
          ipc filemanager view grid
          ipc fileprops open "$HOME/Desktop/notes.txt"; grim shots/files-6-properties.png || true
          ipc fileprops tab permissions; grim shots/files-7-permissions.png || true
          ipc fileprops tab checksums; grim shots/files-8-checksums.png || true
          ipc fileprops open "$HOME/Documents"; grim shots/files-9-folder-properties.png || true
          ipc fileprops close; ipc files close
          n=$((n+3))
          # Desktop icons: one picked and its menu (Open with, Cut, Copy...).
          ipc desktop itemMenu notes.txt; grim "shots/$n-desktop-item-menu.png" || true; ipc desktop close; n=$((n+1))
          # A notification pops up (with action buttons), then shows in the clock's panel with a count on the bell.
          (timeout 20 notify-send -a "Test App" -A default=Open -A later="Remind me" "Hello from a test" "Notifications pop up in the corner" || echo "notify-send failed") &
          sleep 3; grim "shots/$n-notification.png" || true; n=$((n+1))
          notify-send -a "Other App" "Second one" "For the count on the bell" || true; sleep 8
          grim "shots/$n-taskbar-bell.png" || true; n=$((n+1))
          ipc calendar open; grim "shots/$n-notification-list.png" || true; ipc calendar close; n=$((n+1))
          # Print Screen's screenshot: a file in Pictures/Screenshots, on the clipboard, and a notification.
          sh "$NIMBUS_SHARE/desktop/open.sh" screenshot; sleep 3
          grim "shots/$n-screenshot-notification.png" || true; n=$((n+1))
          ls -la "$HOME/Pictures/Screenshots" > shots/screenshots-folder.txt 2>&1 || echo "no screenshot folder" > shots/screenshots-folder.txt
          (wl-paste --list-types 2>&1 || true) > shots/clipboard-types.txt
          # Shortcuts typed on a virtual keyboard (wtype): Super+I opens Settings, Super+A Quick Access.
          if command -v wtype >/dev/null; then
            wtype -M logo -k i -m logo; sleep 3; grim "shots/$n-super-i-settings.png" || true; n=$((n+1)); ipc settings close
            wtype -M logo -k a -m logo; sleep 3; grim "shots/$n-super-a-quick.png" || true; n=$((n+1)); ipc quick toggle
          fi
          # Autostart: the test app ran, Steam's entry didn't.
          { python3 hosts/linux/desktop/shell/hearth-tasks autostart-plan; echo; ls "$HOME"; } > shots/autostart.txt 2>&1
          if [ ! -e "$HOME/autostarted" ]; then echo "::error title=autostart::The autostart app didn't start"; touch shots/FAILED; fi
          if [ -e "$HOME/steam-started" ]; then echo "::error title=autostart::Steam's autostart entry was started"; touch shots/FAILED; fi
          cp "$LOG" shots/nimbus-shell.log 2>/dev/null || true
          ls "$XDG_RUNTIME_DIR" > shots/runtime-dir.txt
          pgrep -af "quickshell|/qs( |$)" > shots/quickshell-running.txt || echo "not running" > shots/quickshell-running.txt
          set +x
          # Report: problems in the shell log (not the expected "no uinput/evdev here") fail the test.
          # Expected here and not on a real device: no D-Bus, PipeWire, NetworkManager, controllers or saved files.
          bad=$(grep -iE "ERROR|WARN|TypeError|ReferenceError|Cannot assign|non-existent|is not a type|Failed to load" "$LOG" 2>/dev/null \
            | grep -viE "uinput|evdev|DBus|pipewire|locale|Process failed to start|Read of .* failed|Cannot open: file://|hearth-pad|upower|statusnotifier|sni\\.|bluez" | head -25 || true)
          if [ -n "$bad" ] || grep -q "not running" shots/quickshell-running.txt; then
            msg=$( { cat shots/quickshell-running.txt; echo "$bad"; tail -15 "$LOG" 2>/dev/null; } | cut -c1-250 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g")
            echo "::error title=shell::$msg"
            touch shots/FAILED
          fi

      # The screenshots and logs also go to the ci/desktop-shots branch, so they can be looked at without
      # downloading the artifact.
      # A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.
      - name: Publish screenshots to a branch
        # (A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          to=ci/desktop-shots
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ] && [ "$GITHUB_REF_NAME" != linux-host ]; then
            to="ci/desktop-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          cd shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Desktop Mode test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"

      - name: Fail if the shell had problems
        if: always()
        run: test ! -e shots/FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: shots
          retention-days: 14
