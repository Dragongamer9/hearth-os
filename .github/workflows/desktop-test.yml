          fi
          # ---- Right-click menu looks (Settings › Personalization › Bar and dock › Right-click menu, MenuStyles.qml), in
          # shots/menu-styles/: a file's menu and the desktop's menu on the desktop, and Hearth Files' menu, in each look
          # (Today first: the "before"), Windows 11 style's submenu flyout, the controller hint row, light mode and the
          # Hearth look, and the picker. Nothing set = Today; the key is taken out again and opening Settings writes nothing.
          ms=shots/menu-styles; mkdir -p $ms; DJ="$HOME/.local/share/nimbus/desktop.json"
          cp "$DJ" $ms/desktop-before.json
          mkeys() {  # JSON of keys to set in desktop.json ("null" takes one out)
            python3 - "$DJ" "$1" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          for k, v in json.loads(sys.argv[2]).items():
              if v is None: d.pop(k, None)
              else: d[k] = v
          open(p, 'w').write(json.dumps(d, indent=2) + "\n")
          PY
            sleep 4
          }
          python3 -c 'import json,sys; sys.exit(1 if "menuStyle" in json.load(open(sys.argv[1])) else 0)' "$DJ" \
            || { echo "::error title=Right-click menu::menuStyle was in desktop.json before anyone picked one"; touch shots/FAILED; }
          for st in today windows compact tiles; do
            mkeys "{\"menuStyle\": \"$st\"}"
            ipc desktop itemMenu notes.txt; sleep 1; grim "$ms/$st-1-file-on-desktop.png" || true; ipc desktop close
            ipc desktop menu; sleep 1; grim "$ms/$st-2-desktop.png" || true; ipc desktop close
            ipc files open "$HOME/Documents"; ipc filemanager select data.csv; ipc filemanager menu; sleep 1
            grim "$ms/$st-3-files.png" || true; ipc filemanager close; ipc files close
          done
          # Windows 11 style: Open with as a flyout (Down to Cut in the quick row, Down to Open, Down to Open with, Right).
          mkeys '{"menuStyle": "windows"}'
          ipc desktop itemMenu notes.txt; sleep 3; wtype -k Down -k Down -k Down 2>/dev/null || true; sleep 1
          grim "$ms/windows-4-keyboard-in-list.png" || true
          wtype -k Right 2>/dev/null || true; sleep 2; grim "$ms/windows-5-open-with-flyout.png" || true; ipc desktop close
          # Tiles: Left / Right in the tiles (Down to the first tile, Right to the second).
          mkeys '{"menuStyle": "tiles"}'
          ipc desktop itemMenu notes.txt; sleep 1; wtype -k Down -k Right 2>/dev/null || true; sleep 1
          grim "$ms/tiles-4-keyboard-in-tiles.png" || true; ipc desktop close
          # The controller in use: A Choose · B Back under the menu (each look).
          for st in today windows compact tiles; do
            mkeys "{\"menuStyle\": \"$st\"}"
            ipc desktop padseen; ipc desktop itemMenu notes.txt; sleep 1; grim "$ms/$st-6-controller-hints.png" || true; ipc desktop close
          done
          # Light mode and the Hearth look (the menus follow the look and accent).
          for st in windows compact tiles; do
            mkeys "{\"menuStyle\": \"$st\", \"mode\": \"light\"}"
            ipc desktop itemMenu notes.txt; sleep 1; grim "$ms/$st-7-light.png" || true; ipc desktop close
            mkeys "{\"look\": \"hearth\", \"mode\": \"dark\"}"
            ipc desktop itemMenu notes.txt; sleep 1; grim "$ms/$st-8-hearth-look.png" || true; ipc desktop close
            mkeys "{\"look\": \"$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("look", "steam"))' $ms/desktop-before.json)\"}"
          done
          # Back to how it was: Today in the running shell, the look and mode as before, then the file exactly as before.
          python3 - "$DJ" $ms/desktop-before.json <<'PY'
          import json, sys
          o = json.load(open(sys.argv[2]))
          d = dict(o, menuStyle="today", look=o.get("look", "steam"), mode=o.get("mode", "dark"))
          open(sys.argv[1], "w").write(json.dumps(d, indent=2) + "\n")
          PY
          sleep 4; cp $ms/desktop-before.json "$DJ"; sleep 4
          # The picker; opening Settings there writes nothing (menuStyle stays out of the file).
          before=$(sha256sum "$DJ" | cut -c1-64)
          ipc settings close; ipc settings page bar-dock; sleep 3; grim "$ms/picker-0-page-top.png" || true
          ipc settings close; ipc settings page bar-dock:rightclick; sleep 3; grim "$ms/picker.png" || true; ipc settings close; sleep 2
          after=$(sha256sum "$DJ" | cut -c1-64)
          if [ "$before" != "$after" ] || python3 -c 'import json,sys; sys.exit(0 if "menuStyle" in json.load(open(sys.argv[1])) else 1)' "$DJ"; then
            echo "::error title=Right-click menu::opening Settings › Bar and dock changed desktop.json: $(tr -d '\n' < "$DJ" | cut -c1-300)"; touch shots/FAILED
          else
            echo "::notice title=Right-click menu::no settings file changed by opening the picker; menuStyle not written (Today by default)"
          fi
          if grep -qE "(MenuStyles|MenuStylePicker|PopMenu)\.qml.*(TypeError|ReferenceError|is not defined|Cannot|non-existent|is not a type|Unable to assign)" "$LOG" 2>/dev/null; then
            echo "::error title=Right-click menu::$(grep -E '(MenuStyles|MenuStylePicker|PopMenu)\.qml' "$LOG" | sort -u | head -6 | cut -c1-240 | tr '\n' '|')"; touch shots/FAILED
          elif grep -q "right-click menu's look (MenuStyles.qml) couldn't load" "$LOG" 2>/dev/null; then
            echo "::error title=Right-click menu::$(grep "couldn't load; using today's menu" "$LOG" | head -2 | tr '\n' '|')"; touch shots/FAILED
          else
            echo "::notice title=Right-click menu::$(ls $ms | grep -c png) pictures in menu-styles"
          fi
          grep -E "MenuStyles|MenuStylePicker|PopMenu" "$LOG" > $ms/shell-log.txt 2>/dev/null || true
          # Install Package: a small .deb (made without dpkg) opened in the installer window, and in Files' menu.
          mkdir -p "$HOME/Downloads" && python3 hosts/linux/test/make_test_deb.py "$HOME/Downloads/hearth-hello.deb" >/dev/null || true
          ipc debs open "$HOME/Downloads/hearth-hello.deb"; sleep 2; grim shots/deb-1-installer.png || true; ipc debs close
          # Discord: the first press asks which Discord (three cards); A picks the app (the stand-in is "installed"),
          # which opens as the small window by the bar; pressing again hides it without quitting; "full" maximizes it.
          ipc discord toggle; sleep 2; grim shots/discord-1-chooser.png || true
          wtype -k Right -k Right 2>/dev/null || true; sleep 1; grim shots/discord-2-chooser-dorion.png || true
          wtype -k Left -k Left -k Return 2>/dev/null || true; sleep 8; grim shots/discord-3-quick-window.png || true
          echo "::notice title=discord window::$(DISPLAY=${DISPLAY:-:0} xdotool search --onlyvisible --class '^discord$' getwindowgeometry %@ 2>&1 | tr '\n' ' ' | head -c 400)" 
          ipc discord toggle; sleep 2; grim shots/discord-4-hidden.png || true
          if pgrep -f fake-discord-stand-in >/dev/null || pgrep -f /tmp/fakebin/discord >/dev/null; then echo "::notice title=discord::hidden, still running (notifications keep working)"; else echo "::error title=discord::hiding the quick window ended Discord"; fi
          ipc discord toggle; sleep 2; grim shots/discord-5-shown-again.png || true
          ipc discord full; sleep 2; grim shots/discord-6-full.png || true
          pkill -f /tmp/fakebin/discord || true
          ipc friends open; sleep 4; grim shots/discord-7-old-friends-link.png || true; pkill -f /tmp/fakebin/discord || true; ipc discord close
          ipc files open "$HOME/Downloads"; ipc filemanager select hearth-hello.deb; ipc filemanager menu; grim shots/deb-2-files-menu.png || true
          ipc filemanager close; ipc files close
          n=$((n+3))
          # Hearth Files opening Linux files: a script asks (Run in Terminal / Run / Open in Hearth Text), a .desktop file
          # shows what it runs first, a settings file with no app opens in Hearth Text (a stand-in that notes its arguments).
          printf '#!/bin/sh\necho hello\n' > "$HOME/Documents/run-me.sh"
          printf '[Desktop Entry]\nType=Application\nName=Steam\nComment=Games\nExec=steam -silent %%U\n' > "$HOME/Documents/Steam.desktop"
          printf 'volume = 3\n' > "$HOME/Documents/game.conf"; printf 'plain words\n' > "$HOME/Documents/NOTES"
          printf '#!/bin/sh\necho "$@" > "$HOME/hearth-text-args"\n' > /tmp/fakebin/hearth-text && chmod +x /tmp/fakebin/hearth-text
          ipc files open "$HOME/Documents"; ipc filemanager view details
          ipc filemanager activate run-me.sh; grim "shots/files-10-open-script.png" || true; ipc filemanager close
          ipc filemanager select run-me.sh; ipc filemanager menu; grim "shots/files-11-script-menu.png" || true; ipc filemanager close
          ipc filemanager activate Steam.desktop; grim "shots/files-12-open-desktop-file.png" || true; ipc filemanager close
          ipc filemanager activate NOTES; sleep 2
          { echo "hearth-text was given: $(cat "$HOME/hearth-text-args" 2>&1)"; python3 hosts/linux/desktop/shell/hearth-files open-plan "$HOME/Documents/run-me.sh"; python3 hosts/linux/desktop/shell/hearth-files open-plan "$HOME/Documents/game.conf"; } > shots/files-open-plans.txt 2>&1
          grep -q "NOTES" "$HOME/hearth-text-args" 2>/dev/null || { echo "::error title=Hearth Files::a text file with no app didn't open in Hearth Text: $(tr '\n' '|' < shots/files-open-plans.txt)"; touch shots/FAILED; }
          ipc files close
          # Desktop icons: one picked and its menu (Open with, Cut, Copy...).
          ipc desktop itemMenu notes.txt; grim "shots/$n-desktop-item-menu.png" || true; ipc desktop close; n=$((n+1))
          # A notification pops up (with action buttons), then shows in the clock's panel with a count on the bell.
          (timeout 20 notify-send -a "Test App" -A default=Open -A later="Remind me" "Hello from a test" "Notifications pop up in the corner" || echo "notify-send failed") &
          sleep 3; grim "shots/$n-notification.png" || true; n=$((n+1))
          notify-send -a "Other App" "Second one" "For the count on the bell" || true; sleep 8
          grim "shots/$n-taskbar-bell.png" || true; n=$((n+1))
          ipc calendar open; grim "shots/$n-notification-list.png" || true; ipc calendar close; n=$((n+1))
          # Print Screen's screenshot: a file in Pictures/Screenshots, on the clipboard, and a notification.
          sh "$NIMBUS_SHARE/desktop/open.sh" screenshot; sleep 3
          grim "shots/$n-screenshot-notification.png" || true; n=$((n+1))
          ls -la "$HOME/Pictures/Screenshots" > shots/screenshots-folder.txt 2>&1 || echo "no screenshot folder" > shots/screenshots-folder.txt
          (wl-paste --list-types 2>&1 || true) > shots/clipboard-types.txt
          # Shortcuts typed on a virtual keyboard (wtype): Super+I opens Settings, Super+A Quick Access.
          if command -v wtype >/dev/null; then
            wtype -M logo -k i -m logo; sleep 3; grim "shots/$n-super-i-settings.png" || true; n=$((n+1)); ipc settings close
            wtype -M logo -k a -m logo; sleep 3; grim "shots/$n-super-a-quick.png" || true; n=$((n+1)); ipc quick toggle
          fi
          # ---- Hearth's on-screen keyboard (Keyboard.qml: the shared keyboard in ui/osk, docs/OSK.md) typing into a real
          # Linux app: foot running `cat` into a file. Controller presses go in over IPC (as hearth-pad would send them; there
          # is no uinput here), taps as from touch; the keyboard types through wtype. Pictures: osk-*.png.
          if command -v foot >/dev/null && command -v wtype >/dev/null; then
            kb() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard "$@" 2>&1 | tail -n1; }
            rm -f "$HOME/osk-typed.txt"
            foot --app-id osk-test --title "Typing test" sh -c "stty -echo; cat > $HOME/osk-typed.txt" >/dev/null 2>&1 &
            OSKFOOT=$!; sleep 4
            kb open; sleep 2
            kb tap h; kb tap e; kb tap l; sleep 1
            kb state > shots/osk-state-1.json
            grim shots/osk-1-suggestions.png || true
            # "hel" → the suggestion "hello" (up into the strip, A picks; it brings its own space), X deletes the space,
            # Y types one back.
            kb press up; kb press up; kb press up; kb press left; kb press a; sleep 0.5; kb press x; kb press y
            # Accents: "e" picked, A held, then the second accent (è).
            kb select e; sleep 0.3
            kb state > shots/osk-state-2.json
            kb hold a 750; sleep 1.2
            grim shots/osk-2-accents.png || true
            kb press right; kb press a; sleep 0.5
            # The emoji (L3), its third one, back to letters; the Ember Wheel (left stick up, Y: "a"); ☰ is Enter.
            kb press l3; sleep 0.5; grim shots/osk-3-emoji.png || true; kb press a; kb press l3
            kb stick 0 -1; sleep 0.5; grim shots/osk-4-ember-wheel.png || true; kb press y; kb stick 0 0
            kb press menu; sleep 2
            kb state > shots/osk-state-3.json
            kb setting theme daylight; kb setting shape split; sleep 1; grim shots/osk-5-split-daylight.png || true
            kb setting theme hearth; kb setting shape full
            kb press b; sleep 1
            kill "$OSKFOOT" 2>/dev/null || true; sleep 1
            got=$(cat "$HOME/osk-typed.txt" 2>/dev/null || true)
            printf '%s' "$got" > shots/osk-typed.txt
            want="hello è😄a"
            if [ "$got" != "$want" ]; then
              echo "::error title=on-screen keyboard::typing into foot gave '$got' (wanted '$want'); state: $(tr -d '\n' < shots/osk-state-3.json | cut -c1-400)"
              touch shots/FAILED
            else
              echo "on-screen keyboard: typed '$got' into foot"
            fi
            grep -q '"open":false' <<< "$(kb state)" || { echo "::error title=on-screen keyboard::B didn't hide it"; touch shots/FAILED; }
          else
            echo "::warning title=on-screen keyboard::foot or wtype is missing here: the typing test didn't run"
          fi
          # ---- end of the on-screen keyboard
          # ---- The on-screen keyboard's looks (OskThemes.qml, Settings › Keyboard › Look): each one, dark and light for the
          # ones that follow Settings › Appearance (deskTheme in osk.json, mode in desktop.json; both files are watched).
          # Pictures: osk-look-<look>-<mode>.png, and Settings › Keyboard's look picker.
          oskset() {  # file key value ("" removes it)
            python3 - "$@" <<'PY'
          import json, os, sys
          p, k, v = sys.argv[1:4]
          try: d = json.load(open(p))
          except Exception: d = {}
          if v: d[k] = v
          else: d.pop(k, None)
          os.makedirs(os.path.dirname(p), exist_ok=True)
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
          }
          OSKJ="$HOME/.config/nimbus/osk.json"; DESKJ="$HOME/.local/share/nimbus/desktop.json"
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard open; sleep 2
          for mode in dark light; do
            oskset "$DESKJ" mode "$mode"; sleep 2
            for look in steam warm contrast frost pocket hearth ember slate daylight; do
              if [ "$mode" = light ]; then case "$look" in hearth|ember|slate|daylight) continue ;; esac; fi
              oskset "$OSKJ" deskTheme "$look"; sleep 1.5
              grim "shots/osk-look-$look-$mode.png" || true
            done
          done
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call keyboard close; sleep 1
          oskset "$DESKJ" mode dark; oskset "$OSKJ" deskTheme pocket; sleep 2
          ipc settings page keyboard
          if command -v wtype >/dev/null; then
            wtype -k Right; sleep 0.5
            # (tabbing down the page: pictures at a few depths, the look tiles are in one of them)
            t=0; for want in 22 28 34 40 46; do while [ "$t" -lt "$want" ]; do wtype -k Tab; t=$((t+1)); done; sleep 1; grim "shots/osk-look-settings-$want.png" || true; done
          fi
          ipc settings close
          oskset "$OSKJ" deskTheme ""
          # ---- Settings › Handheld (SetHandheld.qml: Hearth's own Handheld Daemon app). First without HHD (what a desktop
          # shows), then with a stand-in HHD (.github/scripts/fake-hhd.py: the preview's ROG Ally on 127.0.0.1:5335) and
          # its token file (Quick Access then offers Handheld settings). Pictures: hhd-*.png, hhd-page.json.
          ipc settings page handheld; sleep 2; grim shots/hhd-0-not-running.png || true; ipc settings close
          python3 .github/scripts/fake-hhd.py ui/index.html &
          FAKEHHD=$!; sleep 2
          mkdir -p /tmp/hhd && echo fake-token > /tmp/hhd/token
          python3 hosts/linux/desktop/shell/hearth-hhd page > shots/hhd-page.json 2>&1 || true
          grep -q '"running": true' shots/hhd-page.json || { echo "::error title=Handheld::hearth-hhd page didn't read the stand-in HHD: $(head -c 300 shots/hhd-page.json)"; touch shots/FAILED; }
          python3 hosts/linux/desktop/shell/hearth-hhd apply controllers.rog_ally.imu false > /dev/null 2>shots/hhd-apply.txt \
            && python3 hosts/linux/desktop/shell/hearth-hhd get controllers.rog_ally.imu >> shots/hhd-apply.txt 2>&1 || true
          grep -q '"controllers.rog_ally.imu": false' shots/hhd-apply.txt || { echo "::error title=Handheld::a change didn't reach HHD: $(head -c 300 shots/hhd-apply.txt)"; touch shots/FAILED; }
          ipc settings page handheld; sleep 3; grim shots/hhd-1-page.png || true
          if command -v wtype >/dev/null; then
            wtype -k Right; sleep 0.5; wtype -k Return; sleep 3; grim shots/hhd-2-advanced.png || true   # Show advanced settings
            for i in $(seq 1 12); do wtype -k Down; done; sleep 1; grim shots/hhd-3-controller.png || true
            for i in $(seq 1 12); do wtype -k Down; done; sleep 1; grim shots/hhd-4-more.png || true
            for i in $(seq 1 14); do wtype -k Down; done; sleep 1; grim shots/hhd-5-settings.png || true
          fi
          ipc settings close
          ipc quick toggle; sleep 1; grim shots/hhd-6-quick-access.png || true; ipc quick toggle
          python3 hosts/linux/desktop/shell/hearth-hhd apply tdp.unified.tdp.mode '"custom"' > /dev/null 2>&1 || true
          ipc settings page handheld; sleep 3; grim shots/hhd-7-custom-power.png || true; ipc settings close
          oskset "$DESKJ" mode light; sleep 2
          ipc settings page handheld; sleep 3; grim shots/hhd-8-light.png || true; ipc settings close
          oskset "$DESKJ" mode dark; sleep 2
          kill "$FAKEHHD" 2>/dev/null || true; rm -f /tmp/hhd/token
          # ---- Controller apps own the controller (docs/CONTROLLER-FOCUS.md): hearth-pad with a simulated controller
          # (HEARTH_PAD_SIM: there's no uinput here), a stand-in controller app (foot with Mods' app id, typing into a
          # file), then a notification, the volume OSD, Quick Access and the Hearth menu over it. The app keeps the
          # keyboard focus (what's typed keeps landing in it), the helper sends nothing while it's in front, Guide + R3
          # gives the pointer back, and another window gets the desktop controls again. Pictures: pad-*.png, pad.log.
          if command -v foot >/dev/null && command -v wtype >/dev/null; then
            SIM=/tmp/padsim; rm -rf "$SIM"; mkdir -p "$SIM"; : > "$SIM/in"
            pq() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call pad "$@" 2>&1 | tail -n1; }
            pin() { for l in "$@"; do printf '%s\n' "$l" >> "$SIM/in"; sleep 0.25; done; }
            tap() { pin "{\"b\":\"$1\",\"down\":true}" "{\"b\":\"$1\",\"down\":false}"; }
            sent() { if [ -f "$SIM/out.log" ]; then wc -l < "$SIM/out.log"; else echo 0; fi; }
            perr() { echo "::error title=controller focus::$*"; touch shots/FAILED; }
            pq sim "$SIM"; sleep 4
            pq state > shots/pad-state-0.json
            rm -f "$HOME/pad-typed.txt"
            foot --app-id hearth-mods --title "Mods (stand-in)" sh -c "cat > $HOME/pad-typed.txt" >/dev/null 2>&1 &
            PADAPP=$!; sleep 4
            pq state > shots/pad-state-1.json
            grep -q '"owner":"hearth-mods"' shots/pad-state-1.json || perr "Mods in front didn't get the controller: $(cat shots/pad-state-1.json)"
            grim shots/pad-1-app-has-controller.png || true
            n0=$(sent)
            tap a; tap b; tap y; tap lb; tap rb; tap down; pin '{"axes":[0,0,1,0.5]}'; sleep 0.6; pin '{"axes":[0,0,0,0]}'
            n1=$(sent)
            [ "$n1" = "$n0" ] || perr "the helper still sent $((n1-n0)) things while Mods had the controller: $(tail -n $((n1-n0)) "$SIM/out.log" | tr '\n' '|')"
            # Things popping up over it: the app keeps the keyboard (what's typed goes on landing in it; one line each,
            # the terminal hands cat whole lines).
            say() { wtype "$1"; wtype -k Return; sleep 0.5; }
            say one
            (timeout 15 notify-send -a "Test App" "Download finished" "A notification over a controller app" || true) &
            for i in 1 2 3 4 5 6; do grim "shots/pad-frame-$i.png" || true; sleep 0.4; done
            say two
            ipc brightness up; grim shots/pad-2-osd.png || true
            say three
            ipc quick toggle; grim shots/pad-3-quick-access.png || true; ipc quick toggle
            sleep 1; say four; sleep 0.5
            pq state > shots/pad-state-2.json
            grep -q '"front":"hearth-mods"' shots/pad-state-2.json || perr "Mods isn't in front any more: $(cat shots/pad-state-2.json)"
            grim shots/pad-4-after-quick-access.png || true
            # Guide: the Hearth menu over it (B closes it); Guide + R3: the pointer in the app (A clicks), then back.
            pin '{"b":"guide","down":true}'; sleep 0.6; grim shots/pad-5-hearth-menu.png || true; pin '{"b":"guide","down":false}'; tap b
            pin '{"b":"guide","down":true}' '{"b":"r3","down":true}' '{"b":"r3","down":false}' '{"b":"guide","down":false}'
            sleep 0.3; grim shots/pad-6-pointer-in-app.png || true
            pq state > shots/pad-state-3.json
            grep -q '"ownerMouse":true' shots/pad-state-3.json || perr "Guide + R3 didn't give the pointer back: $(cat shots/pad-state-3.json)"
            n2=$(sent); tap a; n3=$(sent)
            [ "$n3" -gt "$n2" ] || perr "A didn't click with Guide + R3's pointer on"
            pin '{"b":"guide","down":true}' '{"b":"r3","down":true}' '{"b":"r3","down":false}' '{"b":"guide","down":false}'
            # Another window: the desktop controls are back.
            foot --app-id plain-window --title "Not a controller app" sh -c 'sleep 60' >/dev/null 2>&1 &
            PLAIN=$!; sleep 4
            pq state > shots/pad-state-4.json
            grep -q '"owner":""' shots/pad-state-4.json || perr "another window kept the controller app's mode: $(cat shots/pad-state-4.json)"
            n4=$(sent); tap a; n5=$(sent)
            [ "$n5" -gt "$n4" ] || perr "A didn't click in a window that isn't a controller app"
            grim shots/pad-7-desktop-controls-back.png || true
            kill "$PADAPP" "$PLAIN" 2>/dev/null || true; sleep 1
            got=$(tr '\n' ' ' < "$HOME/pad-typed.txt" 2>/dev/null | sed 's/ $//' || true); printf '%s' "$got" > shots/pad-typed.txt
            [ "$got" = "one two three four" ] || perr "typing into the controller app while things popped up over it gave '$got' (wanted 'one two three four'): it lost the keyboard"
            cp "$SIM/out.log" shots/pad-sim-out.log 2>/dev/null || true
            cp "$HOME/.local/share/nimbus/pad.log" shots/pad.log 2>/dev/null || true
            grep -q "'hearth-mods' in front reads the controller itself" shots/pad.log || perr "pad.log doesn't say Mods got the controller"
            grep -q "in front: desktop controls on" shots/pad.log || perr "pad.log doesn't say the desktop controls came back"
            echo "controller focus: $(grep -c 'controller:' shots/pad.log) mode lines in pad.log; typed '$got'"
            pq sim ""; sleep 1
          else
            echo "::warning title=controller focus::foot or wtype is missing here: the check didn't run"
          fi
          # ---- end of controller apps
          # App icons: every kind of app above resolves (Icon= names through hicolor and Flatpak's exports, a pixmap,
          # an absolute path, windows by app id and StartupWMClass), and they show in the launcher, on the taskbar
          # and on a notification.
          icons_ok=1
          check() {  # what, ipc function, args...
            what="$1"; shift
            out=$(quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call icons "$@" 2>&1 | tail -n1)
            echo "$what: $out" >> shots/icons.txt
            if [ -z "$out" ] || printf '%s' "$out" | grep -qiE "error|not found|no such"; then echo "::error title=icons::$what didn't resolve ($out)"; icons_ok=0; fi
          }
          : > shots/icons.txt
          check "Flatpak (yours), by Icon=" resolve org.hearth.IconTest ""
          check "Flatpak (system), by Icon=" resolve org.hearth.SystemTest ""
          check "Flatpak window, by app id only" resolve "" org.hearth.IconTest
          check "Flatpak window, by StartupWMClass" entry icontest-window
          check "Flatpak window, entry by app id" entry org.hearth.IconTest
          check "AppImage (~/.local/share/icons)" resolve appimagekit_icontest ""
          check "Pixmaps only (Icon=name.png)" resolve icontest-pixmap.png ""
          check "Absolute path" resolve /opt/icontest/abs-icon.png ""
          for n in hearth hearth-settings hearth-files hearth-terminal hearth-disks hearth-browser hearth-tasks hearth-apps hearth-installer hearth-text hearth-photos hearth-generic-app; do
            check "Hearth icon set: $n" resolve "$n" ""
          done
          ipc launcher section apps; grim shots/icons-1-launcher.png || true; ipc launcher close
          if command -v foot >/dev/null; then
            foot --app-id org.hearth.IconTest --title "Flatpak window" sh -c 'sleep 60' >/dev/null 2>&1 &
            foot --app-id icontest-window --title "StartupWMClass window" sh -c 'sleep 60' >/dev/null 2>&1 &
            foot --app-id hearth-terminal --title "Hearth Terminal" sh -c 'sleep 60' >/dev/null 2>&1 &
            sleep 5; grim shots/icons-2-taskbar.png || true
            grim -g "0,1010 1920x70" shots/icons-3-taskbar-closeup.png 2>/dev/null || true
          fi
          (timeout 15 notify-send -a "Flatpak test" -h string:desktop-entry:org.hearth.IconTest "From a Flatpak app" "Its icon comes from its desktop entry" || true) &
          sleep 3; grim shots/icons-4-notification.png || true
          [ "$icons_ok" = 1 ] || touch shots/FAILED
          # Autostart: the test app ran, Steam's entry didn't.
          { python3 hosts/linux/desktop/shell/hearth-tasks autostart-plan; echo; ls "$HOME"; } > shots/autostart.txt 2>&1
          if [ ! -e "$HOME/autostarted" ]; then echo "::error title=autostart::The autostart app didn't start"; touch shots/FAILED; fi
          if [ -e "$HOME/steam-started" ]; then echo "::error title=autostart::Steam's autostart entry was started"; touch shots/FAILED; fi
          # ---- Hearth's own apps next to the bar (hosts/hearth-apptheme/desktop.css): Saves, Mods, Disks and Contacts in
          # WebKitGTK at 1920x1080, their text measured against the bar's, as Game Mode sizes them and as a desktop
          # window does; screenshots in shots/app-size/.
          if python3 -c 'import gi; gi.require_version("WebKit2", "4.1")' 2>/dev/null; then
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=wayland \
              timeout 400 python3 hosts/linux/test/app_size_probe.py shots/app-size > shots/app-size.txt 2>&1 || touch shots/FAILED
            grep -E '^::(notice|error)' shots/app-size.txt || tail -20 shots/app-size.txt
          else
            echo "::error title=App size::WebKitGTK (webkit2gtk4.1) isn't installed here: the apps' size wasn't checked"; touch shots/FAILED
          fi
          # ---- end of the apps' size
          # ---- Hearth Files as every app's file chooser (xdg-desktop-portal → hearth-portal → picker.qml) and as the file
          # manager "Show in folder" opens (org.freedesktop.FileManager1): hosts/linux/test/portal_e2e.py calls them like
          # apps do, drives the picker over quickshell ipc and checks what the app gets back.
          export XDG_CURRENT_DESKTOP=Nimbus
          # The portal session's environment (nimbus-session's own lines for GTK and Qt apps, too).
          eval "$(sed -n '/^# >>> portal dialogs/,/^# <<< portal dialogs/p' hosts/linux/session/nimbus-session)"
          echo "GTK_USE_PORTAL=$GTK_USE_PORTAL GDK_DEBUG=$GDK_DEBUG QT_QPA_PLATFORMTHEME=${QT_QPA_PLATFORMTHEME:-}"
          [ "$GTK_USE_PORTAL" = 1 ] && [ "$GDK_DEBUG" = portals ] || { echo "::error title=file chooser::nimbus-session doesn't ask GTK apps to use the portal"; touch shots/FAILED; }
          unset QT_QPA_PLATFORMTHEME
          dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR HOME PATH QT_QUICK_BACKEND NIMBUS_SHARE XDG_DATA_DIRS || echo "dbus-update-activation-environment failed"
          XDP=""; for x in /usr/libexec/xdg-desktop-portal /usr/lib/xdg-desktop-portal; do [ -x "$x" ] && { XDP="$x"; break; }; done
          if [ -n "$XDP" ] && python3 -c 'import gi' 2>/dev/null; then
            "$XDP" -r -v > shots/xdg-desktop-portal.log 2>&1 &
            python3 hosts/linux/desktop/shell/hearth-portal filemanager1 --replace > shots/filemanager1.log 2>&1 &
            sleep 4
            mkdir -p "$HOME/Documents/Reports"; printf 'a,b\n1,2\n' > "$HOME/Documents/data.csv"; head -c 3000 /dev/urandom > "$HOME/Documents/backup.bin"
            timeout 600 python3 hosts/linux/test/portal_e2e.py "$HOME/Documents" shots > shots/file-chooser.txt 2>&1 || touch shots/FAILED
            cat shots/file-chooser.txt
            grep '^::error' shots/file-chooser.txt || true
            cp "$HOME/.local/share/nimbus/picker.log" shots/picker.log 2>/dev/null || true
            pbad=$(grep -E "TypeError|ReferenceError|is not a type|Cannot assign|non-existent|is not defined|Failed to load" shots/picker.log 2>/dev/null | head -8 | cut -c1-200 | tr '\n' '|' || true)
            [ -z "$pbad" ] || { echo "::error title=picker::$pbad"; touch shots/FAILED; }
          else
            echo "::error title=file chooser::xdg-desktop-portal or python3-gobject is missing here"; touch shots/FAILED
          fi
          # ---- end of the file chooser
          cp "$LOG" shots/nimbus-shell.log 2>/dev/null || true
          ls "$XDG_RUNTIME_DIR" > shots/runtime-dir.txt
          pgrep -af "quickshell|/qs( |$)" > shots/quickshell-running.txt || echo "not running" > shots/quickshell-running.txt
          set +x
          # Report: problems in the shell log (not the expected "no uinput/evdev here") fail the test.
          # Expected here and not on a real device: no D-Bus, PipeWire, NetworkManager, controllers or saved files.
          bad=$(grep -iE "ERROR|WARN|TypeError|ReferenceError|Cannot assign|non-existent|is not a type|Failed to load" "$LOG" 2>/dev/null \
            | grep -viE "uinput|evdev|DBus|pipewire|locale|Process failed to start|Read of .* failed|from dropped operation|Cannot open: file://|hearth-pad|upower|statusnotifier|sni\\.|bluez" | head -25 || true)
          if [ -n "$bad" ] || grep -q "not running" shots/quickshell-running.txt; then
            msg=$( { cat shots/quickshell-running.txt; echo "$bad"; tail -15 "$LOG" 2>/dev/null; } | cut -c1-250 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g")
            echo "::error title=shell::$msg"
            touch shots/FAILED
          fi

      # Mantel's looks (Settings › Appearance): Desktop Mode started again with the Steam-style look, every surface,
      # every wallpaper, the customization page and accent / light-mode variants, in shots/looks/.
      - name: Looks (Steam-style, accents, light mode, wallpapers)
        if: always()
        shell: bash
        run: |
          mkdir -p shots/looks
          exec > >(tee shots/looks/step.log) 2>&1
          set -x
          pkill -x labwc || true; pkill -f quickshell || true; sleep 2
          export XDG_RUNTIME_DIR=/tmp/xdg HOME=/tmp/home PATH="/tmp/fakebin:$PATH"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          export QT_QUICK_BACKEND=software NIMBUS_SHARE="$PWD/hosts/linux"
          [ -S "$XDG_RUNTIME_DIR/bus" ] && export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          unset XDG_DATA_DIRS; eval "$(sed -n '/^# >>> data dirs/,/^# <<< data dirs/p' hosts/linux/session/nimbus-session)"
          # Settings › Hearth Link › Your devices with stand-in devices (hearth-device-status devices prints this file):
          # a handheld on battery, a gaming PC in Game Mode, a laptop that's offline.
          export HEARTH_DEVICES_SAMPLE=/tmp/devices-sample.json
          python3 hosts/linux/test/devices_sample.py > "$HEARTH_DEVICES_SAMPLE"
          D="$HOME/.local/share/nimbus/desktop.json"; mkdir -p "$(dirname "$D")"
          set_look() {  # look mode accent wallpaper
            python3 - "$D" "$@" <<'PY'
          import json, sys
          p, look, mode, accent, wall = sys.argv[1:6]
          try: d = json.load(open(p))
          except Exception: d = {}
          d.update(look=look, mode=mode, accent=accent, wallpaper=wall, reduceMotion=False)
          open(p, "w").write(json.dumps(d, indent=2) + "\n")
          PY
            sleep 3
          }
          set_look steam dark "" ""
          # As nimbus-session does: the look's files first, then Desktop Mode's labwc folder with them, then labwc.
          sh hosts/linux/desktop/theme/apply.sh
          ls -la "$HOME/.config/nimbus/theme" > shots/looks/theme-files.txt 2>&1 || true
          python3 hosts/linux/desktop/theme/hearth-theme --show > shots/looks/theme.json 2>&1 || true
          CONF=$(python3 hosts/linux/desktop/shell/hearth-system labwc-config)
          labwc -C "$CONF" > shots/looks/labwc.log 2>&1 &
          for i in $(seq 1 30); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? 2>/dev/null | head -1)")
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true
          sleep 15
          LOG="$XDG_RUNTIME_DIR/nimbus-shell.log"
          ipc() { quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call "$@" || echo "ipc $* failed"; sleep 3; }
          o=shots/looks
          # ---- Steam-style, dark: every surface
          grim $o/steam-01-desktop.png || true
          ipc launcher toggle; grim $o/steam-02-launcher.png || true
          ipc launcher section games; grim $o/steam-03-launcher-games.png || true; ipc launcher close
          ipc quick toggle; grim $o/steam-04-quick-access.png || true; ipc quick toggle
          ipc menu open; grim $o/steam-05-hearth-menu.png || true; ipc menu close
          (timeout 15 notify-send -a "Hearth" "Download finished" "Celeste is ready to play" || true) &
          sleep 3; grim $o/steam-06-notification.png || true
          grim -g "0,1010 1920x70" $o/steam-07-taskbar-closeup.png 2>/dev/null || true
          ipc calendar open; grim $o/steam-08-clock-panel.png || true; ipc calendar close
          ipc power menu; grim $o/steam-09-power-menu.png || true; ipc power close
          ipc settings page appearance; grim $o/steam-10-settings-appearance.png || true
          ipc settings page wifi; grim $o/steam-11-settings-wifi.png || true
          ipc settings page devices; sleep 3; grim $o/steam-11c-settings-your-devices.png || true
          wtype -k Down 2>/dev/null; sleep 0.5; wtype -k Return 2>/dev/null; sleep 1; wtype -k space 2>/dev/null; sleep 2; grim $o/steam-11d-settings-device-details.png || true
          for i in 1 2 3 4 5; do wtype -k Down 2>/dev/null; done; sleep 1; grim $o/steam-11e-settings-device-server.png || true
          # Hearth Files with your devices' shared folders in the sidebar (stand-in devices, found "just now" so it
          # doesn't look again: hearth_netshares.py's state file).
          mkdir -p "$HOME/.local/state/nimbus"
          python3 hosts/linux/test/devices_sample.py files > "$HOME/.local/state/nimbus/files-devices.json"
          ipc settings close; ipc files open "$HOME"; sleep 3; grim $o/steam-13b-files-your-devices.png || true; ipc files close
          # ---- Hearth Files' Win 11-style window, dark then light (shots/files-redesign): the Home page (Quick access and
          # recent files), a folder with three picked and the details pane, a drag in progress (staged over IPC: CI has
          # no mouse), Your devices in the navigation pane, Large icons, Tiles and the View menu.
          F=shots/files-redesign; mkdir -p $F
          python3 hosts/linux/test/files_redesign_sample.py "$HOME"
          python3 hosts/linux/desktop/shell/hearth-files bookmark-add "$HOME/Documents/Reports" >/dev/null 2>&1 || true
          files_redesign() {  # dark | light
            ipc files open "$HOME/Documents"; ipc filemanager home; sleep 3; grim $F/$1-01-home.png || true
            ipc filemanager tab "$HOME/Documents"; ipc filemanager view details; ipc filemanager details on
            ipc filemanager marks "notes.txt/budget.ods/photo-1.png"; ipc filemanager select photo-1.png; sleep 3
            grim $F/$1-02-folder-multi-select-details-pane.png || true
            ipc filemanager rename budget.ods; sleep 1; grim $F/$1-02b-rename-in-place.png || true; ipc filemanager rename ""
            ipc filemanager dragdemo Reports; sleep 2; grim $F/$1-03-drag-in-progress.png || true; ipc filemanager dragdemo ""
            ipc filemanager section devices; sleep 2; grim $F/$1-04-your-devices.png || true
            ipc filemanager marks ""; ipc filemanager view large; sleep 3; grim $F/$1-05-large-icons.png || true
            ipc filemanager view tiles; sleep 3; grim $F/$1-06-tiles.png || true
            ipc filemanager menu; sleep 1; grim $F/$1-07-actions-menu.png || true; ipc filemanager close
            ipc filemanager view details; ipc filemanager details off; ipc files close
          }
          files_redesign dark
          set_look steam light "" ""; files_redesign light; set_look steam dark "" ""
          python3 -c "import json,os;print(json.dumps(json.load(open(os.path.expanduser('~/.config/nimbus/files.json'))), indent=1))" > $F/files-prefs.json 2>&1 || true
          ls $F/*.png >/dev/null 2>&1 || { echo "::error title=Files redesign::no screenshots were taken"; touch shots/FAILED; }
          grep -E "FileManager.qml" "$LOG" | head -40 > $F/qml-warnings.txt 2>/dev/null || true
          [ -s $F/qml-warnings.txt ] && echo "::warning title=Files redesign QML::$(head -c 600 $F/qml-warnings.txt | tr '\n' ' ')"
          # ---- This PC in Hearth Files (shots/files-this-pc, docs/HEARTH-FILES.md "This PC"): This PC with a lettered games
          # drive, a second drive and a network location (one of Your devices' shares set to connect by itself), inside the
          # drive (the address bar in letters, the details pane with the Linux path), Installed apps and its "···" menu.
          # Opening them changes no settings: the only file allowed to appear or change is the drive letters' state
          # (~/.config/hearth/drive-letters.json, written when a drive is first seen), never files.json or anything else.
          P=shots/files-this-pc; mkdir -p $P
          MB=/run/media/$(id -un)
          mkdir -p "$MB/Games/SteamLibrary/steamapps/common" "$MB/Games/SteamLibrary/Windows apps" "$MB/Games/SteamLibrary/Hearth Games" \
            "$MB/Games/SteamLibrary/Recomps" "$MB/Games/SteamLibrary/Mods" "$MB/Backup/Photos"
          printf '"libraryfolders"\n{\n}\n' > "$MB/Games/SteamLibrary/libraryfolder.vdf"
          head -c 3000000 /dev/zero > "$MB/Games/SteamLibrary/Cyberpunk 2077 backup.zip"
          python3 hosts/linux/desktop/shell/hearth-files net-auto "{\"device\":\"$(printf 'a1%.0s' $(seq 16))\",\"name\":\"chris-hearth\",\"share\":\"Media\",\"home\":\"chris-hearth.local\"}" on > $P/net-auto.txt 2>&1 || true
          # A Windows app and two of Hearth's own apps for Installed apps (Storage's games come from the nimbus stand-in).
          mkdir -p "$HOME/Games/Windows apps/Notepad++/prefix"
          printf '{"name":"Notepad++","id":"notepad-plus-plus","exe":"","source":""}' > "$HOME/Games/Windows apps/Notepad++/hearth-app.json"
          head -c 18000000 /dev/zero > "$HOME/Games/Windows apps/Notepad++/prefix/notepad.bin"
          printf '[Desktop Entry]\nType=Application\nName=Hearth Paint\nExec=true\nIcon=hearth-paint\n' > "$HOME/.local/share/applications/hearth-paint.desktop"
          printf '[Desktop Entry]\nType=Application\nName=Hearth Maps\nExec=true\nIcon=hearth-maps\n' > "$HOME/.local/share/applications/hearth-maps.desktop"
          snap_cfg() { find "$HOME/.config" "$HOME/.local/share/nimbus" -type f 2>/dev/null | grep -v -E '/\.[^/]*\.lock$' | grep -v -E '/\.local/share/nimbus/.*\.(log|txt)$' | sort | xargs -r -d '\n' sha256sum || true; }
          snap_cfg > $P/files-before.txt
          # (Views and the details pane are left as they are inside the check: changing them is a choice that's saved.)
          this_pc_shots() {  # dark | light
            ipc filemanager thispc; sleep 5; grim $P/$1-01-this-pc.png || true
            wtype -k End 2>/dev/null; sleep 2; grim $P/$1-01b-network-locations.png || true
            ipc filemanager section pc; sleep 2; grim $P/$1-01c-navigation-pane-this-pc.png || true
            ipc files open "$MB/Games/SteamLibrary"; ipc filemanager select steamapps; sleep 3; grim $P/$1-02-inside-games-drive.png || true
            ipc filemanager installed; sleep 8; grim $P/$1-03-installed-apps.png || true
            ipc filemanager select "Notepad++"; ipc filemanager menu; sleep 1; grim $P/$1-04-app-menu.png || true; ipc filemanager close
            ipc files close
          }
          more_shots() {  # dark | light: the details pane (with the Linux path) and This PC's Details view
            ipc files open "$MB/Games/SteamLibrary"; ipc filemanager details on; ipc filemanager select steamapps; sleep 3
            grim $P/$1-05-inside-drive-details-pane.png || true; ipc filemanager details off
            ipc filemanager thispc; ipc filemanager view details; sleep 3; grim $P/$1-06-this-pc-details-view.png || true
            ipc filemanager view grid; ipc files close
          }
          this_pc_shots dark
          snap_cfg > $P/files-after.txt
          changed=$(diff $P/files-before.txt $P/files-after.txt | grep '^[<>]' | awk '{print $NF}' | sort -u | grep -v -E '/\.config/hearth/drive-letters\.json(\.bak)?$' | tr '\n' ' ' || true)
          if [ -n "$changed" ]; then
            echo "::error title=This PC::opening This PC, a drive and Installed apps changed: $changed"; touch shots/FAILED
          else
            echo "::notice title=This PC::no settings file changed ($(wc -l < $P/files-before.txt) files checked); drive letters: $(tr -d '\n' < "$HOME/.config/hearth/drive-letters.json" 2>/dev/null | head -c 600)"
          fi
          grep -q '"Games"' "$HOME/.config/hearth/drive-letters.json" 2>/dev/null || { echo "::error title=This PC::the games drive got no letter ($(cat "$HOME/.config/hearth/drive-letters.json" 2>&1 | head -c 400))"; touch shots/FAILED; }
          cp "$HOME/.config/hearth/drive-letters.json" $P/drive-letters.json 2>/dev/null || true
          python3 hosts/linux/desktop/shell/hearth-files this-pc > $P/this-pc.json 2>&1 || true
          python3 hosts/linux/desktop/shell/hearth-files installed-apps > $P/installed-apps.json 2>&1 || true
          more_shots dark
          set_look steam light "" ""; this_pc_shots light; more_shots light; set_look steam dark "" ""
          grep -E "(FilesThisPc|FilesApps|WinGlyph)\.qml|drive-paths\.js" "$LOG" | head -40 > $P/qml-warnings.txt 2>/dev/null || true
          if grep -q -E "TypeError|ReferenceError|is not a type|non-existent|Cannot assign|is not defined" $P/qml-warnings.txt; then
            echo "::error title=This PC QML::$(head -c 900 $P/qml-warnings.txt | tr '\n' ' ')"; touch shots/FAILED
          fi
          grep -q "couldn't load (Files" "$LOG" && { echo "::error title=This PC::$(grep "couldn't load (Files" "$LOG" | head -3 | tr '\n' ' ')"; touch shots/FAILED; }
          ls $P/*.png >/dev/null 2>&1 || { echo "::error title=This PC::no screenshots were taken"; touch shots/FAILED; }
          # ---- The Briefcase (shots/briefcase, docs/HEARTH-FILES.md › Briefcase): two Briefcases customized differently,
          # files added, one changed on each side and one changed in both, Update All's list of actions, after it ran,
          # and the Customize dialog. hearth-briefcase does the work; Files shows it.
          B=shots/briefcase; mkdir -p $B
          HB=hosts/linux/desktop/shell/hearth-briefcase
          export HEARTH_BRIEFCASE_NO_SERVICE=1 HEARTH_BRIEFCASE_NO_NOTIFY=1
          mkdir -p "$HOME/Documents/School"
          printf 'Essay, first draft\n' > "$HOME/Documents/School/essay.txt"; printf 'Class notes\n' > "$HOME/Documents/School/notes.md"
          printf 'Trip plan\n' > "$HOME/Documents/plan.txt"
          touch -d '-2 hours' "$HOME/Documents/School/essay.txt" "$HOME/Documents/School/notes.md" "$HOME/Documents/plan.txt"
          { python3 $HB new "$HOME" Briefcase --ensure; python3 $HB new "$HOME" School
            python3 $HB add "$HOME/Briefcase" "$HOME/Documents/School" "$HOME/Documents/plan.txt"
            python3 $HB customize "$HOME/Briefcase" '{"color":"gold","note":"Carried between the desk and the laptop","autosync":{"mode":"off"}}'
            python3 $HB customize "$HOME/School" '{"color":"green","icon":"backpack","badge":"A+","note":"Homework and class notes"}'
          } > $B/setup.json 2>&1
          sleep 2
          printf 'Essay, edited in the Briefcase\n' > "$HOME/Briefcase/School/essay.txt"
          printf 'Trip plan, edited at home\n' > "$HOME/Documents/plan.txt"
          printf 'Notes, Briefcase side\n' > "$HOME/Briefcase/School/notes.md"; printf 'Notes, home side\n' > "$HOME/Documents/School/notes.md"
          python3 $HB status "$HOME/Briefcase" > $B/status-before.json 2>&1
          ipc files open "$HOME"; ipc filemanager view large; sleep 3; grim $B/01-two-briefcases.png || true
          ipc files open "$HOME/Briefcase"; ipc filemanager view details; ipc filemanager details on; sleep 5; grim $B/02-briefcase-statuses.png || true
          ipc filemanager bcUpdate; sleep 3; grim $B/03-update-all-dialog.png || true
          quickshell ipc -p "$NIMBUS_SHARE/desktop/shell" call filemanager bcState > $B/state.json 2>&1 || true
          ipc filemanager bcApply; sleep 8; grim $B/04-after-update.png || true
          python3 $HB status "$HOME/Briefcase" > $B/status-after.json 2>&1
          grep -q 'edited in the Briefcase' "$HOME/Documents/School/essay.txt" || { echo "::error title=Briefcase::Update All didn't replace the original essay ($(cat $B/state.json | head -c 300))"; touch shots/FAILED; }
          grep -q 'edited at home' "$HOME/Briefcase/plan.txt" || { echo "::error title=Briefcase::Update All didn't bring the newer plan into the Briefcase"; touch shots/FAILED; }
          ls "$HOME/Briefcase/School/" | grep -q 'notes (from ' || { echo "::error title=Briefcase::the file changed in both places wasn't kept both ways: $(ls "$HOME/Briefcase/School/" | tr '\n' ' ')"; touch shots/FAILED; }
          grep -q 'Class notes\|home side' "$HOME/Documents/School/notes.md" || { echo "::error title=Briefcase::the original of a file changed in both places was overwritten"; touch shots/FAILED; }
          ipc files open "$HOME/School"; ipc filemanager bcCustomize; sleep 3; grim $B/05-customize-dialog.png || true; ipc filemanager close
          ipc files open "$HOME"; ipc filemanager section briefcases; sleep 2; grim $B/06-navigation-pane.png || true
          ipc filemanager view details; ipc filemanager details off; ipc files close
          ls $B/*.png >/dev/null 2>&1 || { echo "::error title=Briefcase::no screenshots were taken"; touch shots/FAILED; }
          grep -E "Briefcase(Dialog)?\.qml" "$LOG" | head -40 > $B/qml-warnings.txt 2>/dev/null || true
          [ -s $B/qml-warnings.txt ] && { echo "::error title=Briefcase QML::$(head -c 800 $B/qml-warnings.txt | tr '\n' ' ')"; touch shots/FAILED; }
          ipc settings page sound; grim $o/steam-12-settings-sound.png || true
          ipc settings page boot; grim $o/steam-12b-settings-boot.png || true; ipc settings close
          mkdir -p "$HOME/Documents/Reports"; echo hi > "$HOME/Documents/notes.txt"
          ipc files open "$HOME/Documents"; grim $o/steam-13-files.png || true
          ipc fileprops open "$HOME/Documents/notes.txt"; grim $o/steam-14-file-properties.png || true; ipc fileprops close 2>/dev/null; ipc filemanager close
          ipc tasks open; grim $o/steam-15-task-manager.png || true; ipc tasks close
          ipc clipboard open 2>/dev/null; grim $o/steam-16-clipboard.png || true; ipc clipboard close 2>/dev/null
          # Window frames (labwc) and apps following the look: a terminal, a KDE app (Qt via qt6ct), a GTK 4 app.
          export QT_QPA_PLATFORMTHEME=qt6ct
          command -v foot >/dev/null && { foot --title "Hearth Terminal" sh -c 'sleep 600' >/dev/null 2>&1 & }
          command -v kcalc >/dev/null && { kcalc >/dev/null 2>&1 & }
          sleep 8; grim $o/steam-17-windows.png || true
          command -v qt6ct >/dev/null && { qt6ct >/dev/null 2>&1 & sleep 5; grim $o/steam-18-qt-palette.png || true; pkill -x qt6ct || true; }
          pkill -x foot || true; sleep 2
          grim $o/steam-19-kde-app.png || true
          pkill -x kcalc || true; unset QT_QPA_PLATFORMTHEME; sleep 2
          # ---- every Slate wallpaper (moving ones as a still: software rendering here holds them still)
          for w in anim:tide anim:ridges anim:motes builtin:slate-dusk builtin:slate-contours builtin:slate-horizon builtin:slate-facets builtin:slate-nebula builtin:slate-ridges; do
            set_look steam dark "" "$w"; sleep 2; grim "$o/wall-${w#*:}.png" || true
          done
          # ---- variants: accents, light mode, Hearth's look
          variant() {  # name look mode accent
            set_look "$2" "$3" "$4" ""; sleep 3
            ipc quick toggle; grim "$o/variant-$1-quick-access.png" || true; ipc quick toggle
            ipc settings page appearance; grim "$o/variant-$1-appearance.png" || true; ipc settings close
            ipc launcher toggle; grim "$o/variant-$1-launcher.png" || true; ipc launcher close
          }
          variant steam-violet steam dark "#9b7bff"
          variant steam-moss steam dark "#5ba32b"
          variant steam-light steam light ""
          # A KDE app (KCalc) in the light look: kdeglobals' [UiSettings] ColorScheme=Hearth (theme/hearth-theme).
          sh hosts/linux/desktop/theme/apply.sh; cp "$HOME/.config/kdeglobals" $o/kdeglobals-light.txt 2>/dev/null || true
          command -v kcalc >/dev/null && { QT_QPA_PLATFORMTHEME=qt6ct kcalc >/dev/null 2>&1 & sleep 8; grim $o/variant-steam-light-kde-app.png || true; pkill -x kcalc || true; sleep 1; }
          variant hearth-light hearth light ""
          variant hearth-steamblue hearth dark "#1a9fff"
          variant hearth-default hearth dark ""
          # ---- Mantel 2026: every look (Settings › Appearance › Look), each with the desktop, Quick settings, the
          # launcher, the notification centre + dashboard and Settings › Appearance, in shots/looks/mantel/.
          # The Cabin and Console looks use the image's own wallpapers (/usr/share/backgrounds/hearth).
          mkdir -p /usr/share/backgrounds/hearth $o/mantel
          cp os/branding/wallpapers/hearth-*.jpg /usr/share/backgrounds/hearth/ 2>/dev/null || true
          m=$o/mantel
          look_shots() {  # look mode
            set_look "$1" "$2" "" ""; sleep 3
            grim "$m/$1-$2-1-desktop.png" || true
            ipc quick toggle; grim "$m/$1-$2-2-quick-settings.png" || true; ipc quick toggle
            ipc launcher toggle; grim "$m/$1-$2-3-launcher.png" || true
            ipc launcher close
            ipc calendar open; grim "$m/$1-$2-4-notifications-dashboard.png" || true; ipc calendar close
            ipc settings page appearance; sleep 2; grim "$m/$1-$2-5-settings-appearance.png" || true; ipc settings close
            ipc settings page home; sleep 2; grim "$m/$1-$2-6-settings-home.png" || true; ipc settings close
          }
          (timeout 15 notify-send -a "Friends" "Mira" "Ready for co-op tonight?" || true) &
          sleep 2
          for look in hearth steam gaming zen glass synthwave cabin console; do look_shots "$look" dark; done
          look_shots hearth light
          look_shots glass light
          # The launcher's search finding a Settings page and a game; a notification in the pill.
          set_look hearth dark "" ""; sleep 2
          ipc launcher section apps; wtype "wi" 2>/dev/null || true; sleep 2; grim "$m/search-settings-page.png" || true; ipc launcher close
          ipc launcher section apps; wtype "cel" 2>/dev/null || true; sleep 2; grim "$m/search-game.png" || true; ipc launcher close
          (timeout 15 notify-send -a "Hearth" "Download finished" "Celeste is ready to play" || true) &
          sleep 2; grim "$m/hearth-notification-pill.png" || true
          # Handheld (1280×800): the essentials in the bar, bigger dock icons.
          wlr-randr --output HEADLESS-1 --custom-mode 1280x800 || true; sleep 4
          grim "$m/handheld-hearth-1-desktop.png" || true
          ipc quick toggle; grim "$m/handheld-hearth-2-quick-settings.png" || true; ipc quick toggle
          set_look console dark "" ""; sleep 3; grim "$m/handheld-console-1-desktop.png" || true
          set_look gaming dark "" ""; sleep 3; grim "$m/handheld-gaming-1-desktop.png" || true
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true; sleep 3
          # Bar and dock options on top of a look: Hearth with a full-width bar and an auto-hiding dock.
          python3 - "$D" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p)); d.update(look='hearth', barStyle='bar', dockMode='autohide', deskClock='on'); open(p, 'w').write(json.dumps(d))
          PY
          sleep 3; grim "$m/hearth-bar-autohide.png" || true
          python3 - "$D" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          for k in ('barStyle', 'dockMode', 'deskClock'): d.pop(k, None)
          open(p, 'w').write(json.dumps(d))
          PY
          sleep 2
          # ---- Bar layouts and app menus (Settings › Appearance › Bar and dock), in shots/looks/mantel/bars/:
          # the one main bar on each edge (with your apps in it: the floating app menu off), the dock off with the top
          # bar, auto-hide, each app menu open, search in one, the picker, and another look. The keys are taken out
          # again afterwards, and the check below makes sure nothing wrote one by itself.
          b=$m/bars; mkdir -p $b
          keys() {  # JSON of keys to set ("null" takes one out)
            python3 - "$D" "$1" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          for k, v in json.loads(sys.argv[2]).items():
              if v is None: d.pop(k, None)
              else: d[k] = v
          open(p, 'w').write(json.dumps(d, indent=2) + "\n")
          PY
            sleep 4
          }
          # (A key taken out of desktop.json keeps its last value in the running shell, which only reads the keys that are
          # there, so these shots set every value they rely on, and take them all out of the file at the end.)
          set_look hearth dark "" ""; keys '{"dockMode": "shown", "barStyle": "", "deskClock": "off", "appMenu": "hearth"}'
          for e in bottom top left right; do
            keys "{\"barLayout\": \"one\", \"barEdge\": \"$e\", \"dockFloat\": \"off\"}"
            grim "$b/bar-$e-1-desktop.png" || true
            ipc quick toggle; grim "$b/bar-$e-2-quick-settings.png" || true; ipc quick toggle
            ipc calendar open; grim "$b/bar-$e-3-dashboard.png" || true; ipc calendar close
          done
          keys '{"barLayout": "one", "barEdge": "bottom", "dockFloat": "on"}'; grim "$b/bar-bottom-dock-on.png" || true
          keys '{"barLayout": "split", "barEdge": "bottom", "dockFloat": "off"}'; grim "$b/dock-off-top-bar.png" || true
          keys '{"barLayout": "one", "barEdge": "left", "dockFloat": "off", "dockMode": "autohide"}'; grim "$b/bar-left-autohide-hidden.png" || true
          ipc dock show; sleep 2; grim "$b/bar-left-autohide-shown.png" || true; ipc dock hide
          keys '{"dockMode": "shown"}'
          menu_shot() {  # menu name
            keys "{\"appMenu\": \"$1\"}"
            ipc launcher toggle; sleep 2; grim "$b/menu-$1-$2.png" || true; ipc launcher close
          }
          keys '{"barLayout": "split", "barEdge": "bottom", "dockFloat": "on"}'
          menu_shot hearth default-bar
          menu_shot centred default-bar
          ipc launcher toggle; sleep 2; wtype "st" 2>/dev/null || true; sleep 3; grim "$b/menu-search-centred.png" || true; ipc launcher close
          keys '{"barLayout": "one", "barEdge": "bottom", "dockFloat": "off"}'
          menu_shot tiles bottom-bar
          ipc launcher toggle; sleep 2; wtype -k Right 2>/dev/null || true; sleep 1; grim "$b/menu-tiles-focus-on-tiles.png" || true; ipc launcher close
          menu_shot classic bottom-bar
          ipc launcher toggle; sleep 2; wtype -k Right 2>/dev/null || true; sleep 1; grim "$b/menu-classic-jump-or-places.png" || true; ipc launcher close
          menu_shot start bottom-bar
          ipc launcher toggle; sleep 2; wtype "se" 2>/dev/null || true; sleep 3; grim "$b/menu-search-start.png" || true; ipc launcher close
          # The picker (Settings › Appearance › Bar and dock › App menu)
          ipc settings close; ipc settings page appearance:bar; sleep 3; grim "$b/menu-picker.png" || true; ipc settings close
          # Another look: Glass with the bar on the left and the Classic menu; Steam-style with Tiles on the bottom bar.
          set_look glass dark "" ""; keys '{"barLayout": "one", "barEdge": "left", "dockFloat": "off", "appMenu": "classic"}'
          grim "$b/glass-bar-left.png" || true
          ipc launcher toggle; sleep 2; grim "$b/glass-menu-classic.png" || true; ipc launcher close
          set_look steam dark "" ""; keys '{"barLayout": "one", "barEdge": "bottom", "appMenu": "tiles"}'
          ipc launcher toggle; sleep 2; grim "$b/steam-menu-tiles.png" || true; ipc launcher close
          # Handheld (1280×800): the Start screen and Centred.
          wlr-randr --output HEADLESS-1 --custom-mode 1280x800 || true; set_look hearth dark "" ""; keys '{"appMenu": "start", "barEdge": "bottom", "dockFloat": "off"}'
          ipc launcher toggle; sleep 2; grim "$b/handheld-menu-start.png" || true; ipc launcher close
          keys '{"appMenu": "centred", "barLayout": "split", "dockFloat": "on"}'
          ipc launcher toggle; sleep 2; grim "$b/handheld-menu-centred.png" || true; ipc launcher close
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true; sleep 2
          keys '{"barLayout": "split", "barEdge": "bottom", "dockFloat": "on", "appMenu": "hearth"}'
          keys '{"barLayout": null, "barEdge": null, "dockFloat": null, "appMenu": null, "menuTiles": null, "dockMode": null, "barStyle": null, "deskClock": null}'
          grep -E "Islands.qml|TaskStrip.qml|Launcher.qml|Menu[A-Za-z]*\.qml|BarLayoutPicker|AppMenuPicker" "$LOG" > $b/shell-log.txt 2>/dev/null || true
          if grep -qE "(Islands|TaskStrip|Launcher|Menu[A-Za-z]*|BarLayoutPicker|AppMenuPicker)\.qml.*(TypeError|ReferenceError|is not defined|Cannot|non-existent|is not a type)" "$LOG" 2>/dev/null; then
            echo "::error title=bars and menus::$(grep -E '(Islands|TaskStrip|Launcher|Menu[A-Za-z]*|BarLayoutPicker|AppMenuPicker)\.qml' "$LOG" | head -6 | cut -c1-240 | tr '\n' '|')"; touch shots/FAILED
          elif grep -q "app menu couldn't load" "$LOG" 2>/dev/null; then
            echo "::error title=bars and menus::$(grep "app menu couldn't load" "$LOG" | head -3 | tr '\n' '|')"; touch shots/FAILED
          else
            echo "::notice title=bars and menus::$(ls $b | wc -l) pictures in looks/mantel/bars"
          fi
          # Nothing the looks did may have written a new option by itself (Mantel 2026's keys stay out of the file
          # until someone changes them; the ones this test set were taken out again above).
          cp "$D" $m/desktop.json 2>/dev/null || true
          python3 - "$D" <<'PY' || { echo "::error title=Mantel 2026::a setting was written that nobody changed: $(tr -d '\n' < "$D" | cut -c1-400)"; touch shots/FAILED; }
          import json, sys
          d = json.load(open(sys.argv[1]))
          new = {'barStyle', 'dockMode', 'deskClock', 'panelGlass', 'sunset', 'sunsetLight', 'sunsetDark', 'accentFrom', 'wallSwatches'}
          new |= {'barLayout', 'barEdge', 'dockFloat', 'appMenu', 'menuTiles'}
          new |= {'menuStyle'}
          sys.exit(1 if new & set(d) else 0)
          PY
          if grep -q "using the classic taskbar" "$LOG" 2>/dev/null; then
            echo "::error title=Mantel 2026::the islands or the dock didn't load: $(grep -B3 'using the classic taskbar' "$LOG" | head -8 | cut -c1-200 | tr '\n' '|')"
            touch shots/FAILED
          else
            echo "::notice title=Mantel 2026::every look rendered with the islands and the dock ($(ls $m | wc -l) pictures in looks/mantel)"
          fi
          cp "$HOME/.config/nimbus/theme/themerc-override" $o/themerc-override.txt 2>/dev/null || true
          cp "$LOG" $o/nimbus-shell.log 2>/dev/null || true
          set +x
          bad=$(grep -E "TypeError|ReferenceError|Cannot assign|non-existent|is not a type|Failed to load|is not defined" "$LOG" 2>/dev/null \
            | grep -viE "uinput|evdev|DBus|pipewire|hearth-pad|upower|statusnotifier|sni\\.|bluez" | head -15 || true)
          if [ -n "$bad" ]; then
            echo "::error title=looks::$(printf '%s' "$bad" | cut -c1-250 | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            touch shots/FAILED
          fi

      # Server mode (docs/SERVER-MODE.md): its own labwc folder and dashboard started for real on a virtual screen, with the
      # dashboard's data from a fixture (the mockup's numbers); the AI tile opened, the 5-second switch countdown, a web
      # page's 10-second countdown, "Back in Server mode", the menu, the idle screen, Settings › Home server › Server mode
      # and System › Startup (Start in and the schedule) inside Server mode, and the web page at phone and laptop sizes.
      - name: Server mode
        if: always()
        shell: bash
        run: |
          mkdir -p shots/server-mode
          exec > >(tee shots/server-mode/step.log) 2>&1
          set -x
          # Desktop Mode's shell watchers from the steps before would start Mantel again on Server mode's labwc (on a real
          # PC the session's settle() ends them between modes).
          pkill -f 'labwc/autostart' || true; pkill -x labwc || true; pkill -f quickshell || true; sleep 2; pkill -f quickshell || true
          export XDG_RUNTIME_DIR=/tmp/xdg HOME=/tmp/home QT_QUICK_BACKEND=software NIMBUS_SHARE="$PWD/hosts/linux"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          export HEARTH_SERVER_DASH_FIXTURE="$PWD/hosts/linux/test/fixtures/server-dash.json" HEARTH_SERVER_NO_PAD=1 HEARTH_NIMBUS_MODE=/bin/true
          QML="$PWD/hosts/linux/desktop/shell/server-mode.qml"
          H=hosts/linux/desktop/shell/hearth-server-mode
          rm -f "$XDG_RUNTIME_DIR"/wayland-* "$XDG_RUNTIME_DIR/hearth-server-dash-up"
          mkdir -p "$HOME/.config/nimbus"
          printf '%s\n' '{"on": true, "web": {"on": true}, "schedule": {"on": true}}' > "$HOME/.config/nimbus/server-mode.json"
          printf '%s' 482916 | HEARTH_INPUT=482916 python3 $H pin-set
          python3 $H start-in server
          # The helper on this runner for real (no fixture): it must answer, whatever is installed here.
          HEARTH_SERVER_DASH_FIXTURE= python3 $H dash > shots/server-mode/dash-real.json 2> shots/server-mode/dash-real.err \
            && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("::notice title=Server mode::dash on the runner: %d tiles, %s" % (len(d["tiles"]), d["status"]["title"]))' shots/server-mode/dash-real.json \
            || { echo "::error title=Server mode::hearth-server-mode dash failed: $(head -c 300 shots/server-mode/dash-real.err | tr '\n' ' ')"; touch shots/FAILED; }
          HEARTH_SERVER_MODE=1 HEARTH_SERVER_QML="$QML" labwc -C hosts/linux/desktop/server/labwc > shots/server-mode/labwc.log 2>&1 &
          for i in $(seq 1 30); do ls "$XDG_RUNTIME_DIR"/wayland-? >/dev/null 2>&1 && break; sleep 1; done
          export WAYLAND_DISPLAY=$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-? 2>/dev/null | head -1)")
          wlr-randr --output HEADLESS-1 --custom-mode 1920x1080 || true
          for i in $(seq 1 40); do [ -e "$XDG_RUNTIME_DIR/hearth-server-dash-up" ] && break; sleep 1; done
          if [ -e "$XDG_RUNTIME_DIR/hearth-server-dash-up" ]; then echo "::notice title=Server mode::the dashboard said it's up after ${i}s (the session waits for this)"
          else echo "::error title=Server mode::the dashboard never said it's up: $(tail -c 600 "$XDG_RUNTIME_DIR/hearth-server-dash.log" 2>/dev/null | tr '\n' '|')"; touch shots/FAILED; fi
          sleep 6
          ipc() { quickshell ipc -p "$QML" call "$@" || echo "ipc $* failed"; sleep 2; }
          grim shots/server-mode/01-dashboard.png || true
          ipc server detail 1; grim shots/server-mode/02-ai-expanded.png || true
          ipc server detail 2; grim shots/server-mode/02b-pictures-expanded.png || true
          ipc server close
          quickshell ipc -p "$QML" call server play; sleep 1; grim shots/server-mode/03-switch-to-game-mode.png || true
          ipc server close
          mkdir -p "$XDG_RUNTIME_DIR/hearth-server"
          python3 -c 'import json,time,sys; json.dump({"action": {"kind": "mode", "to": "game"}, "to": "game", "what": "mode", "deadline": time.time() + 9, "total": 10, "from": "web", "by": "Work laptop"}, open(sys.argv[1], "w"))' "$XDG_RUNTIME_DIR/hearth-server/countdown.json"
          sleep 3; grim shots/server-mode/03b-web-switch-countdown.png || true
          ipc server cancel; sleep 2
          ipc server back; grim shots/server-mode/04-back-in-server-mode.png || true
          ipc server close
          ipc server menu; grim shots/server-mode/05-menu.png || true
          ipc server close
          ipc server idle dim; grim shots/server-mode/09-screen-idle.png || true
          ipc server idle on
          echo "state: $(quickshell ipc -p "$QML" call server state)"
          ipc settings page hs-server; sleep 3; grim shots/server-mode/06-settings-server-mode.png || true
          wtype -k Right; sleep 1; for i in $(seq 1 12); do wtype -k Down; done; sleep 1; grim shots/server-mode/06b-settings-what-pauses.png || true
          for i in $(seq 1 8); do wtype -k Down; done; sleep 1; grim shots/server-mode/06c-settings-web-page.png || true
          ipc settings close; ipc settings page startup; sleep 3; grim shots/server-mode/07-settings-startup.png || true
          wtype -k Right; sleep 1; for i in $(seq 1 6); do wtype -k Down; done; sleep 1; grim shots/server-mode/07b-settings-schedule.png || true
          ipc settings close; ipc settings page gaming; sleep 3; grim shots/server-mode/08-gaming-start-in.png || true
          ipc settings close
          cp "$XDG_RUNTIME_DIR/hearth-server-dash.log" shots/server-mode/dashboard.log 2>/dev/null || true
          sbad=$(grep -E "TypeError|ReferenceError|is not a type|Cannot assign|non-existent|is not defined|Failed to load|Unable to assign" shots/server-mode/dashboard.log 2>/dev/null | grep -viE "uinput|evdev|DBus|hearth-pad" | head -10 | cut -c1-220 | tr '\n' '|' || true)
          [ -z "$sbad" ] || { echo "::error title=Server mode dashboard::$sbad"; touch shots/FAILED; }
          pkill -x labwc || true; pkill -f quickshell || true
          # The web page: the sign-in page from the real server on 127.0.0.1:8460, and the dashboard with the fixture embedded.
          dnf -y install chromium >/dev/null 2>&1 || dnf -y install chromium-headless >/dev/null 2>&1 || true
          CH=$(command -v chromium-browser || command -v chromium || command -v headless_shell || true)
          if [ -n "$CH" ]; then
            HEARTH_SERVER_DASH_FIXTURE="$PWD/hosts/linux/test/fixtures/server-dash.json" timeout 120 python3 $H serve > shots/server-mode/serve.log 2>&1 &
            SRV=$!
            sleep 3
            python3 - "$H" > /tmp/web-data.json <<'PY'
          import importlib.machinery, importlib.util, json, sys
          l = importlib.machinery.SourceFileLoader('h', sys.argv[1]); s = importlib.util.spec_from_loader('h', l); m = importlib.util.module_from_spec(s); l.exec_module(m)
          d = m.summary(); d.update({'perms': {'services': True, 'modes': True, 'power': True, 'devices': True}, 'modeNow': 'server', 'gameRunning': False})
          print(json.dumps(d))
          PY
            python3 $H web-html /tmp/web-data.json > /tmp/web-page.html
            shot() { timeout 60 "$CH" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=${3:-1} --window-size=$2 --screenshot="$PWD/shots/server-mode/$1" "$4" >/dev/null 2>&1 || echo "::warning title=Server mode::couldn't take $1"; }
            shot 10a-web-phone.png 390,844 2 "file:///tmp/web-page.html"
            shot 10b-web-laptop.png 1440,900 1 "file:///tmp/web-page.html"
            shot 10c-web-sign-in-phone.png 390,844 2 "http://127.0.0.1:8460/"
            python3 -c 'import urllib.request,urllib.error
          try: urllib.request.urlopen("http://127.0.0.1:8460/api/status", timeout=5); print(200)
          except urllib.error.HTTPError as e: print(e.code)' | grep -qx 401 && echo "::notice title=Server mode web page::/api/status without the PIN: 401" \
              || { echo "::error title=Server mode web page::/api/status answered without the PIN"; touch shots/FAILED; }
            kill $SRV 2>/dev/null || true
          else
            echo "::warning title=Server mode::no Chromium here: no web page shots"
          fi
          ls -la shots/server-mode

      # The screenshots and logs also go to the ci/desktop-shots branch, so they can be looked at without
      # downloading the artifact.
      # A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.
      - name: Publish screenshots to a branch
        # (A run started by hand on another branch publishes to ci/desktop-shots-<branch> instead.)
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          to=ci/desktop-shots
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ] && [ "$GITHUB_REF_NAME" != linux-host ]; then
            to="ci/desktop-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          cd shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Desktop Mode test ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"

      - name: Fail if the shell had problems
        if: always()
        run: test ! -e shots/FAILED

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: shots
          retention-days: 14
