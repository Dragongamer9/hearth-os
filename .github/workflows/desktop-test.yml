          wtype -k Return 2>/dev/null || true; sleep 3; grim shots/friends-4-signin-qr.png || true; ipc friends close; rm -f /tmp/friends-out
          ipc files open "$HOME/Downloads"; ipc filemanager select hearth-hello.deb; ipc filemanager menu; grim shots/deb-2-files-menu.png || true
          ipc filemanager close; ipc files close
          n=$((n+3))
