# Builds Hearth on CachyOS (Beta Experimental): CachyOS made into a bootc image with the Hearth session, from
# os-bases/cachyos (see docs/BASE-CACHYOS.md). Published as ghcr.io/dragongamer9/hearth-cachyos:testing (never
# :latest: this isn't the main Hearth).
# Failures show up as annotations on the run (the end of the failing step's output), so the full log isn't needed.
name: Hearth OS (CachyOS base)

on:
  workflow_dispatch:
  push:
    branches: [linux-host, main]
    paths: ['os-bases/cachyos/**', 'os/system_files/**', 'hosts/hearth-core/**', 'hosts/hearth-rs/**', 'hosts/hearth-disks/**', 'hosts/linux/**', 'hosts/hearth-browser/**', 'hosts/electron/**', 'ui/**', '.github/workflows/base-cachyos.yml']

env:
  IMAGE: ghcr.io/dragongamer9/hearth-cachyos
  BASE_IMAGE: docker.io/cachyos/cachyos-v3:latest

concurrency:
  group: hearth-cachyos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust app (hosts/hearth-rs), built inside CachyOS's own container rather than on the Ubuntu runner: then it
  # links exactly the WebKitGTK/GTK/libsoup the image has, under the same names, and never asks for a glibc the
  # image doesn't have.
  app:
    name: Build the Hearth app (Rust, on CachyOS)
    runs-on: ubuntu-latest
    container: docker.io/cachyos/cachyos-v3:latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "^ *downloading" -e "^ *installing" -e "^ *checking" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app (tools)::$msg"' ERR
          sed -i '/DownloadUser/d' /etc/pacman.conf
          pacman -Sy --noconfirm archlinux-keyring cachyos-keyring
          pacman -Syu --noconfirm --needed git base-devel curl pkgconf zstd \
            webkit2gtk-4.1 gtk3 librsvg libsoup3 openssl xdotool
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | sed -n 1p)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
          key: cachyos
      - name: Build
        working-directory: hosts/hearth-rs
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app::$msg"' ERR
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release
          mkdir -p /tmp/app && cp target/release/hearth /tmp/app/hearth
          echo "--- libraries the app links (all come from CachyOS)"
          objdump -p target/release/hearth | grep NEEDED
          if ldd target/release/hearth | grep 'not found'; then echo "missing libraries (above)"; false; fi
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # Hearth Disks (hosts/hearth-disks), the disk manager: built the same way, and put beside the app in
      # hearth-app.tar (build.sh installs it as /usr/bin/hearth-disks). Not fatal: without it the image is still made.
      - name: Build Hearth Disks
        continue-on-error: true
        working-directory: hosts/hearth-disks
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Disks::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app && cp "$CARGO_TARGET_DIR/release/hearth-disks" /tmp/app/hearth-disks
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-app-cachyos
          path: hearth-app.tar

  # Hearth Browser is still an Electron app (hosts/linux/src/web): Electron brings its own libraries and asks
  # little of glibc, so it's built on the runner as in os.yml.
  browser:
    name: Build Hearth Browser (Electron)
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hearth's Chromium window (Electron, hosts/electron; used on Nvidia, docs/RENDERERS.md)
        working-directory: hosts/electron
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=electron window::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm test
          npm run dist:dir
          test -x dist/linux-unpacked/hearth-electron
          mkdir -p /tmp/electron && cp -a dist/linux-unpacked/. /tmp/electron/
      - name: Build Hearth Browser
        working-directory: hosts/linux
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=browser::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist:dir
          test -x dist/linux-unpacked/nimbus
          mkdir -p /tmp/browser && cp -a dist/linux-unpacked/. /tmp/browser/
          tar -C /tmp/browser -cf ../../hearth-browser.tar .
          tar -C /tmp/electron -cf ../../hearth-electron.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-browser-cachyos
          path: |
            hearth-browser.tar
            hearth-electron.tar

  image:
    name: Build the OS image (hearth-cachyos)
    needs: [app, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/linux-host' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is several GB)
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/download-artifact@v4
        with:
          name: hearth-app-cachyos

      - uses: actions/download-artifact@v4
        with:
          name: hearth-browser-cachyos

      - name: Unpack Hearth into the build context
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -20 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=unpack::$msg"' ERR
          mkdir -p os/nimbus-app/browser
          tar -C os/nimbus-app -xf hearth-app.tar
          tar -C os/nimbus-app/browser -xf hearth-browser.tar
          if [ -f hearth-electron.tar ]; then mkdir -p os/nimbus-app/electron && tar -C os/nimbus-app/electron -xf hearth-electron.tar; fi
          ls -la os/nimbus-app
          test -x os/nimbus-app/hearth

      - name: Build
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" -e "Copying config" -e "Writing manifest" -e "^ *downloading" -e "^ *installing" -e "^ *upgrading" -e "^ *checking" -e "^ *loading" -e "^ *resolving" -e "^ *Compiling " /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=image::$msg"' ERR
          v="${{ needs.app.outputs.version }}"
          sudo podman build --pull=newer -f os-bases/cachyos/Containerfile --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg NIMBUS_VERSION="$v" -t hearth-cachyos:latest .
          # What build.sh couldn't find in the repositories (optional packages): a warning, not a failure.
          missing=$(grep -o 'Not installed (not in the repositories): .*' /tmp/step.log | tail -1 || true)
          if [ -n "$missing" ]; then echo "::warning title=optional packages::$missing"; fi
          # Whether Handheld Daemon came from CachyOS's repositories or was built from its tag.
          if grep -q 'hhd-dev/hhd /tmp/hhd-src' /tmp/step.log; then
            echo "::notice title=hhd::Handheld Daemon isn't in CachyOS's repositories: built from its tag (build.sh HHD_REF)"
          fi

      # Smaller updates: content-based layers (chunkah, what bootcrew uses for its Arch images; rpm-ostree's
      # rechunker needs an rpm database). Not required: on failure the image is published as built.
      - name: Rechunk for smaller updates
        run: |
          set -o pipefail
          export CHUNKAH_CONFIG_STR="$(sudo podman inspect hearth-cachyos:latest)"
          if sudo -E podman run --rm --pull=newer --mount=type=image,src=localhost/hearth-cachyos:latest,target=/chunkah \
              -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah build -t localhost/hearth-cachyos:chunked \
              --label ostree.bootable=1 --label containers.bootc=1 --compressed --max-layers 128 \
              | sudo podman load; then
            sudo podman tag localhost/hearth-cachyos:chunked hearth-cachyos:latest
            sudo podman image inspect hearth-cachyos:latest --format '{{len .RootFS.Layers}} layers'
          else
            echo "::warning title=rechunk::Rechunking failed; publishing the image as built (updates download more)"
          fi

      # REQUIRED: a failure here stops the image from being published. Each failed check is its own annotation.
      - name: Check the image
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "^ok: " -e "^::" /tmp/step.log | tail -20 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); [ -n "$msg" ] && echo "::error title=check (output)::$msg"' ERR
          cat > /tmp/check.sh <<'EOF'
          fail=0
          check() { if sh -c "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "::error title=check::$1"; fail=1; fi; }
          warn() { if sh -c "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "::warning title=check::$1"; fi; }
          GS=$(command -v gamescope || echo /nonexistent)
          echo "--- update path (same as os.yml)"
          check "bootc is installed and runs" "bootc --version"
          check "pkexec is installed" "command -v pkexec"
          check "hearth-admin is installed" "test -x /usr/libexec/nimbus/hearth-admin"
          check "hearth-import is installed" "test -x /usr/libexec/nimbus/hearth-import && command -v rsync"
          check "hearth-takeover and its tools are installed" "test -x /usr/libexec/nimbus/hearth-takeover && command -v sfdisk && command -v partx && command -v efibootmgr && command -v btrfs"
          check "the polkit rule for hearth-admin is installed" "test -f /usr/share/polkit-1/rules.d/49-hearth-admin.rules"
          check "hearth-admin's Python is valid" "python3 -m py_compile /usr/libexec/nimbus/hearth-admin"
          check "the wheel group exists (installer, sudo and polkit rules use it)" "getent group wheel && test -f /etc/sudoers.d/hearth-wheel"
          check "background updates are scheduled (bootc timer, stage only)" "test -L /etc/systemd/system/timers.target.wants/bootc-fetch-apply-updates.timer && grep -q 'bootc upgrade --quiet' /usr/lib/systemd/system/bootc-fetch-apply-updates.service.d/10-hearth-no-reboot.conf"
          echo "--- update path (required, the app's own check)"
          /usr/lib/nimbus/nimbus --check-update-path || fail=1
          echo "--- the Hearth app runs on CachyOS"
          check "every library the Hearth app links is installed" "! ldd /usr/lib/nimbus/nimbus | grep -q 'not found'"
          check "Hearth Browser is installed" "test -x /usr/lib/hearth-browser/nimbus"
          warn "every library Hearth Browser links is installed" "! ldd /usr/lib/hearth-browser/nimbus | grep -q 'not found'"
          echo "--- bootable"
          check "one kernel with its initramfs in /usr/lib/modules" "test \$(ls /usr/lib/modules/*/vmlinuz | wc -l) = 1 && ls /usr/lib/modules/*/initramfs.img"
          check "the CachyOS kernel" "pacman -Q linux-cachyos-deckify || pacman -Q linux-cachyos"
          check "the initramfs mounts ostree deployments (ostree-prepare-root)" "lsinitrd \$(ls /usr/lib/modules/*/initramfs.img) > /tmp/i.txt && grep -q ostree-prepare-root /tmp/i.txt"
          check "ostree's and bootc's dracut modules are installed" "ls -d /usr/lib/dracut/modules.d/*ostree && ls -d /usr/lib/dracut/modules.d/*bootc"
          check "bootupd is installed and runs" "bootupctl --version"
          check "the boot loader for Hearth's installer (GRUB in EFI/cachyos, bootupd's metadata)" "test -f /usr/lib/bootupd/updates/EFI.json && ls /usr/lib/efi/shim/*/EFI/cachyos/shimx64.efi && ls /usr/lib/efi/grub2/*/EFI/cachyos/grubx64.efi && ls /usr/lib/efi/shim/*/EFI/BOOT/BOOTX64.EFI"
          check "GRUB's boot menu comes from ostree's entries (hearth-bls-grub)" "test -x /usr/libexec/nimbus/hearth-bls-grub && grep -q hearth-bls.cfg /usr/lib/bootupd/grub2-static/configs.d/10_blscfg.cfg && test -f /usr/lib/bootupd/grub2-static/grub-static-efi.cfg && test -L /etc/systemd/system/multi-user.target.wants/hearth-bls-grub.service"
          check "Nvidia's open kernel module" "find /usr/lib/modules -name 'nvidia.ko*' | grep -q ."
          check "Nvidia's 32-bit libraries" "pacman -Q lib32-nvidia-utils"
          check "pacman's database is in the image (/usr/lib/sysimage)" "test -d /usr/lib/sysimage/lib/pacman/local && pacman -Q systemd"
          check "system accounts are recreated by sysusers (sddm, ...)" "cat /usr/lib/sysusers.d/*.conf | grep '^u!* *sddm ' >/dev/null && test -s /usr/lib/sysusers.d/hearth-image.conf && test -f /usr/lib/systemd/system/systemd-sysusers.service.d/hearth.conf"
          check "the bootc layout (/ostree, /var/home, empty /var)" "test -L /ostree && test \"\$(readlink /home)\" = var/home && test -z \"\$(ls -A /var)\""
          check "it's called Hearth (CachyOS edition)" "grep -q '^NAME=\"Hearth\"' /usr/lib/os-release && grep -q CachyOS /usr/lib/os-release && grep -q '\"base\": \"cachyos\"' /usr/share/nimbus/image-info.json"
          echo "--- Game Mode and Desktop Mode"
          check "gamescope is installed" "command -v gamescope"
          check "gamescope is Valve's (Hearth's Game Mode atoms are in it)" "grep -aq GAMESCOPECTRL_BASELAYER_APPID $GS && grep -aq GAMESCOPECTRL_BASELAYER_WINDOW $GS && grep -aq GAMESCOPE_FPS_LIMIT $GS && grep -aq GAMESCOPECTRL_REQUEST_SCREENSHOT $GS && grep -aq mangoapp $GS"
          check "mangoapp is installed (performance overlay)" "command -v mangoapp"
          check "labwc is installed" "command -v labwc && ! ldd \$(command -v labwc) | grep -q 'not found'"
          check "quickshell is installed and finds its libraries" "command -v quickshell && ! ldd \$(command -v quickshell) | grep -q 'not found'"
          check "Steam is installed (with Steam's 32-bit graphics)" "command -v steam && pacman -Q steam lib32-mesa lib32-vulkan-radeon"
          check "the Hearth session is installed" "test -f /usr/share/wayland-sessions/nimbus.desktop && test -x /usr/bin/nimbus-session && test -x /usr/bin/nimbus-mode && test -d /usr/share/nimbus/desktop/shell && grep -q /usr/bin/nimbus-session /usr/share/wayland-sessions/nimbus.desktop"
          check "the login screen boots into Hearth (sddm + nimbus-autologin)" "test -L /etc/systemd/system/display-manager.service && readlink /etc/systemd/system/display-manager.service | grep -q sddm && test -L /etc/systemd/system/multi-user.target.wants/nimbus-autologin.service && test -x /usr/libexec/nimbus/nimbus-autologin"
          check "the tools the session uses" "command -v grim && command -v brightnessctl && command -v wlr-randr && command -v wlsunset && command -v xdotool && command -v gnome-keyring-daemon && python3 -c 'import evdev, yaml'"
          check "WebKitGTK 4.1, PipeWire, Bluetooth, NetworkManager, Flatpak" "ls /usr/lib/libwebkit2gtk-4.1.so.0 && command -v pipewire && command -v bluetoothctl && command -v nmcli && command -v flatpak"
          check "the boot splash is Hearth's" "plymouth-set-default-theme | grep -qx hearth"
          echo "--- Handheld Daemon"
          check "Handheld Daemon is installed and its Python modules load" "command -v hhd && test -f /usr/lib/systemd/system/hhd.service && python3 -c 'import hhd, adjustor, evdev, yaml, rich, Xlib, serial, pyroute2, gi, dbus'"
          check "Handheld Daemon starts at boot" "test -L /etc/systemd/system/multi-user.target.wants/hhd.service"
          check "Hearth's Quick Access is Handheld Daemon's overlay app (hhd-ui and HHD_OVERLAY are hearth-overlay)" "test -x /usr/share/nimbus/desktop/shell/hearth-overlay && test \"\$(readlink -f /usr/bin/hhd-ui)\" = /usr/share/nimbus/desktop/shell/hearth-overlay && grep -qx 'Environment=HHD_OVERLAY=/usr/share/nimbus/desktop/shell/hearth-overlay' /usr/lib/systemd/system/hhd.service.d/zz-hearth-overlay.conf && /usr/bin/hhd-ui --version | grep -q '^Hearth Quick Access'"
          check "the overlay app's Electron, page and code are installed (Hearth Browser's Electron)" "test -x /usr/lib/hearth-browser/nimbus && test -f /usr/lib/hearth-browser/resources/ui/index.html && { test -f /usr/lib/hearth-browser/resources/app/src/overlay/main.js || grep -aq HEARTH_HHD_OVERLAY /usr/lib/hearth-browser/resources/app.asar; }"
          check "Handheld Daemon's udev rules are installed" "ls /usr/lib/udev/rules.d/*hhd*.rules"
          check "power-profiles-daemon is installed and only runs when HHD is off" "pacman -Q power-profiles-daemon && grep -q 'ConditionPathExists=/etc/hearth/no-hhd' /usr/lib/systemd/system/power-profiles-daemon.service.d/10-hearth-hhd.conf"
          check "InputPlumber and SteamOS Manager don't run next to HHD" "test \"\$(readlink /etc/systemd/system/inputplumber.service)\" = /dev/null && test \"\$(readlink /etc/systemd/system/steamos-manager.service)\" = /dev/null"
          warn "Handheld Daemon is 4.x or newer (its /run/hhd/api socket, which Hearth uses)" "test \$(vercmp \$(pacman -Q hhd | cut -d' ' -f2) 4) -ge 0"
          echo "--- nice to have"
          warn "acpi_call (Legion Go power limits through HHD)" "find /usr/lib/modules -name 'acpi_call.ko*' | grep -q ."
          warn "CachyOS's sched_ext schedulers are installed" "command -v scx_lavd"
          warn "CachyOS's settings are installed" "pacman -Q cachyos-settings"
          warn "RyzenAdj is installed" "command -v ryzenadj"
          warn "Steam Deck fan control (Deck only)" "pacman -Q jupiter-fan-control"
          warn "Beacon is installed (BFME and friends; its release may not exist yet)" "beacon --version"
          exit $fail
          EOF
          sudo podman run --rm -v /tmp/check.sh:/check.sh:ro hearth-cachyos:latest sh /check.sh
          echo "--- bootc container lint"
          sudo podman run --rm hearth-cachyos:latest bootc container lint 2>&1 | tee /tmp/lint.log || {
            msg=$(tail -20 /tmp/lint.log | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=bootc container lint::$msg"; exit 1; }

      - name: Publish to GitHub Container Registry
        if: env.PUBLISH == 'true'
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -20 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=publish::$msg"' ERR
          v="${{ needs.app.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in testing "testing-$v-$(date -u +%Y%m%d)"; do
            sudo podman push hearth-cachyos:latest "$IMAGE:$tag"
          done
          echo "::notice title=published::$IMAGE:testing"
