# Claude on Hearth OS (desktop/shell/hearth-claude): its tests, then the real thing from Anthropic in throwaway home
# folders, the way Hearth Settings › Claude does it on a device:
#   - Ubuntu (dpkg-deb unpacks): Claude Desktop installs, answers --version, keeps running in a virtual screen with its
#     user-namespace sandbox (no setuid helper, no --no-sandbox), registers claude://, and Claude Code installs
#   - Fedora and Arch containers (no dpkg: hearth-claude reads the .deb itself, as on Anatase and CachyOS): installs
#     and answers --version
name: Claude app

on:
  push:
    branches-ignore: [main]
    paths: ['hosts/linux/desktop/shell/hearth-claude', 'hosts/linux/test/test_hearth_claude.py', '.github/workflows/claude-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (fake repository signed with a throwaway key)
        run: cd hosts/linux && python3 -m unittest discover -s test -p 'test_hearth_claude.py' -v

  ubuntu:
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Desktop and Claude Code in a throwaway home folder
        run: |
          set -eu
          note() { printf '::notice title=%s::%s\n' "$1" "$(head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          # Hearth OS allows user namespaces (Ubuntu's AppArmor restriction is lifted in its image by
          # 61-hearth-ubuntu-userns.conf); the runner's Ubuntu restricts them, and Chromium needs them for its sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export HOME=$RUNNER_TEMP/home; mkdir -p "$HOME"; unset XDG_DATA_HOME XDG_CONFIG_HOME
          H=hosts/linux/desktop/shell/hearth-claude
          python3 $H install | tee install.log | tail -3
          python3 $H status | tail -1 | grep -q '"sandbox": true'
          st=$(python3 $H status | tail -1); echo "$st"
          v=$("$HOME/.local/bin/claude-desktop" --version | tail -1)
          echo "$st" | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['ours'] and s['version']=='$v' and s['latest']=='$v' and not s['updateAvailable'], s"
          test ! -e "$HOME/.local/opt/claude-desktop/chrome-sandbox"
          grep -q "^Exec=$HOME/.local/bin/claude-desktop %U" "$HOME/.local/share/applications/com.anthropic.Claude.desktop"
          grep -q '^Hidden=true' "$HOME/.local/share/applications/hearth-get-claude.desktop"
          handler=$(xdg-mime query default x-scheme-handler/claude 2>/dev/null || grep -h 'x-scheme-handler/claude=' "$HOME/.config/mimeapps.list")
          echo "$handler" | grep -q com.anthropic.Claude.desktop
          python3 $H update | tail -1 >/dev/null      # nothing newer: a no-op
          python3 $H auto-update | tail -1 >/dev/null
          { echo "version $v"; echo "handler: $handler"; ls "$HOME/.local/bin"; du -sh "$HOME/.local/opt/claude-desktop"; } | note "Claude Desktop (Ubuntu, dpkg-deb)"
      - name: It runs with its user-namespace sandbox, as on Hearth OS
        run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          export HOME=$RUNNER_TEMP/home
          sudo apt-get install -y -qq xvfb dbus-x11 >/dev/null
          ( timeout 30 dbus-run-session -- xvfb-run -a "$HOME/.local/bin/claude-desktop" > run.log 2>&1; echo "exit=$?" >> run.log ) || true
          tail -3 run.log
          if grep -qiE 'No usable sandbox|SUID sandbox helper|FATAL' run.log; then grep -iE 'sandbox|FATAL' run.log | head -5 | note "sandbox problem"; exit 1; fi
          # timeout ends it after 30 s: exit 124 means it was still running.
          grep -q 'exit=124' run.log || { tail -20 run.log | note "Claude Desktop stopped early"; exit 1; }
          echo "ran 30 s under Xvfb with the namespace sandbox; no sandbox errors" | note "Claude Desktop runs"
      - name: Claude Code with Anthropic's installer
        run: |
          note() { printf '::notice title=%s::%s\n' "$1" "$(head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          export HOME=$RUNNER_TEMP/home
          H=hosts/linux/desktop/shell/hearth-claude
          python3 $H install-code | tail -4
          cv=$("$HOME/.local/bin/claude" --version)
          python3 $H status | tail -1 | python3 -c "import json,sys; s=json.load(sys.stdin)['code']; assert s['installed'] and s['version'], s"
          # ~/.local/bin on PATH in a login shell, as /etc/profile.d/hearth-local-bin.sh does on Hearth OS.
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '. os/system_files/etc/profile.d/hearth-local-bin.sh; command -v claude' | grep -q "$HOME/.local/bin/claude"
          python3 $H remove-code | tail -1 >/dev/null; test ! -e "$HOME/.local/bin/claude"
          python3 $H remove | tail -1 >/dev/null; test ! -e "$HOME/.local/opt/claude-desktop"
          echo "Claude Code $cv installed and removed; Claude Desktop removed" | note "Claude Code"

  no-dpkg:
    runs-on: ubuntu-24.04
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora (as Anatase)
            image: registry.fedoraproject.org/fedora:43
            deps: dnf -y -q install python3 gnupg2 curl which util-linux gtk3 nss libdrm mesa-libgbm libXtst alsa-lib at-spi2-core cups-libs libxkbcommon pipewire-libs libsecret libnotify xdg-utils
          - name: Arch (as CachyOS)
            image: docker.io/library/archlinux:latest
            deps: pacman -Syu --noconfirm --needed python gnupg curl which util-linux gtk3 nss libdrm mesa libxtst alsa-lib at-spi2-core libcups libxkbcommon pipewire libsecret libnotify xdg-utils
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Desktop without dpkg
        run: |
          cat > /tmp/run.sh <<'EOF'
          set -eu
          ${DEPS} >/dev/null
          ! command -v dpkg-deb
          useradd -m player
          cp /src/hosts/linux/desktop/shell/hearth-claude /tmp/hearth-claude
          su player -c 'python3 /tmp/hearth-claude install | tail -2 && python3 /tmp/hearth-claude status | tail -1 && ~/.local/bin/claude-desktop --version'
          EOF
          # As on Hearth OS: user namespaces allowed (the runner's Ubuntu restricts them; Docker's seccomp too).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          out=$(docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined -e DEPS="${{ matrix.deps }}" -v "$PWD:/src:ro" -v /tmp/run.sh:/run.sh:ro ${{ matrix.image }} sh /run.sh 2>&1) || { echo "$out" | tail -20; echo "::error title=${{ matrix.name }}::$(echo "$out" | tail -5 | tr '\n' ' ' | cut -c1-800)"; exit 1; }
          echo "$out" | tail -5
          echo "::notice title=${{ matrix.name }}::$(echo "$out" | grep -v '^{' | tail -2 | tr '\n' ' ' | cut -c1-500)"
