# Claude on Hearth OS (desktop/shell/hearth-claude): runs its tests, and on a fresh Ubuntu runner installs Claude
# Desktop from Anthropic's apt repository into a throwaway home folder the way Hearth does on a device.
name: Claude app

on:
  push:
    branches-ignore: [main]
    paths: ['hosts/linux/desktop/shell/hearth-claude', 'hosts/linux/test/test_hearth_claude.py', '.github/workflows/claude-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the package
        run: |
          B=https://downloads.claude.ai/claude-desktop/apt/stable
          curl -fsS $B/dists/stable/main/binary-amd64/Packages -o Packages
          f=$(awk '/^Filename:/{print $2}' Packages | tail -1)
          curl -fsS "$B/$f" -o c.deb; mkdir x ctl && dpkg-deb -x c.deb x && dpkg-deb -e c.deb ctl
          tar -C x -cf x.tar . 
      - uses: actions/upload-artifact@v4
        with: { name: claude-x, path: x.tar, retention-days: 1, compression-level: 0 }
      - name: Look inside
        run: |
          note() { t="$1"; printf '::notice title=%s::%s\n' "$t" "$(head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          { ls -la x/usr/bin; file x/usr/bin/claude-desktop; head -c 3000 x/usr/bin/claude-desktop | strings | head -60; } 2>&1 | note usr-bin
          { cat x/usr/lib/claude-desktop/version; echo; ls x/usr/lib/claude-desktop/resources | head -40; } | note version-file
          sed -n '30,140p' ctl/postinst | note postinst-1
          sed -n '140,344p' ctl/postinst | grep -v '^\s*#' | head -c 3800 | note postinst-2
          { sysctl kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces 2>&1; cat /proc/sys/kernel/unprivileged_userns_clone 2>&1; } | note sysctl
      - name: Run it from a home folder
        run: |
          note() { t="$1"; printf '::notice title=%s::%s\n' "$t" "$(head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          export HOME=$RUNNER_TEMP/h; mkdir -p $HOME/.local/opt; cp -a x/usr/lib/claude-desktop $HOME/.local/opt/claude-desktop; rm $HOME/.local/opt/claude-desktop/chrome-sandbox
          exe=$HOME/.local/opt/claude-desktop/claude-desktop
          { timeout 20 $exe --version; echo "rc=$?"; } 2>&1 | tail -8 | note version-run
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          ( timeout 25 xvfb-run -a $exe --enable-logging=stderr > run.log 2>&1; echo "rc=$?" >> run.log ) || true
          { grep -i -E 'sandbox|fatal|error' run.log | head -20; tail -15 run.log; } | note run-userns
          ps aux | grep -c claude-desktop || true
      - name: Libraries on other systems
        run: |
          note() { t="$1"; printf '::notice title=%s::%s\n' "$t" "$(head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          for img in fedora:43 archlinux:latest debian:trixie; do
            docker run --rm -v $PWD/x:/x:ro $img sh -c 'for f in /x/usr/lib/claude-desktop/claude-desktop /x/usr/lib/claude-desktop/resources/app.asar.unpacked/node_modules/@ant/claude-native/claude-native-binding.node; do ldd $f 2>&1 | grep "not found"; done | sort -u | tr "\n" " "' | note "missing-$img"
          done
