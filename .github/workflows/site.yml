# The Hearth OS website (site/, hearthos.fun).
# Every run builds the site and checks it (tools/site-check.js: broken links, missing images, script errors,
# pages wider than a phone, unnamed buttons and links, images without alt text, low-contrast text) and takes
# screenshots at phone and desktop widths, next to the same pages on main ("before"). The screenshots go to the
# branch ci/site-shots-<branch>, so they can be looked at without downloading anything.
# Only main publishes to GitHub Pages; running it by hand on another branch builds and checks without publishing.
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build-docs.py', 'tools/site-check.js', 'docs/ROADMAP.md', 'hosts/windows/Nimbus.Host/Nimbus.Host.csproj', '.github/workflows/site.yml']

permissions:
  contents: write     # the screenshots branch
  pages: write
  id-token: write

# Per branch: a check on another branch never cancels main's publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The docs (site/docs): release notes from docs/ROADMAP.md and the current version, so they follow each release.
      - name: Build the docs
        run: python3 tools/build-docs.py site/docs
      # The display face (Anybody, SIL Open Font License) is served from the site itself, never from a font CDN.
      # It's committed in site/fonts; if it's ever missing it's fetched here so the page still gets it.
      - name: Self-hosted fonts
        run: |
          if [ ! -s site/fonts/anybody.woff2 ]; then
            mkdir -p site/fonts /tmp/font && cd /tmp/font
            npm pack --silent @fontsource-variable/anybody@5 >/dev/null && tar xzf ./*.tgz
            ls package/files | head -40
            f=$(ls package/files/*-latin-wdth-normal.woff2 2>/dev/null | head -1)
            [ -n "$f" ] || f=$(ls package/files/*-latin-*normal.woff2 | grep -v italic | head -1)
            cp "$f" "$GITHUB_WORKSPACE/site/fonts/anybody.woff2"
            cp package/LICENSE "$GITHUB_WORKSPACE/site/fonts/OFL.txt" 2>/dev/null || true
            echo "::notice title=Fonts::site/fonts/anybody.woff2 was missing; fetched $(basename "$f") ($(stat -c %s "$f") bytes)"
          fi
      - name: The site as it is on main (for the before/after screenshots)
        run: |
          mkdir -p /tmp/before
          if git rev-parse -q --verify origin/main >/dev/null; then git archive origin/main site | tar -x -C /tmp/before; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the site
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          set +e; node site-check.js ../site /tmp/before/site ../site-shots | tee ../site-check.log; rc=${PIPESTATUS[0]}
          exit $rc
      - name: Publish screenshots to a branch
        if: always()
        run: |
          [ -d site-shots ] || exit 0
          to="ci/site-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          cp -r site/fonts site-shots/ 2>/dev/null || true
          cd site-shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Site screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"
          base="https://raw.githubusercontent.com/${{ github.repository }}/$to"
          for f in before-desktop-top.png after-desktop-top.png before-phone-top.png after-phone-top.png after-desktop-light-top.png \
                   before-desktop.jpg after-desktop.jpg before-phone.jpg after-phone.jpg; do
            [ -f "$f" ] && echo "::notice title=Screenshot ${f%.*}::$base/$f"
          done
          echo "::notice title=Screenshots::branch $to (every page at phone, tablet and desktop width)"
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
