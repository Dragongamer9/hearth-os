# Publishes the Hearth OS website (site/) to GitHub Pages whenever it changes on main.
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build-docs.py', 'docs/ROADMAP.md', 'hosts/windows/Nimbus.Host/Nimbus.Host.csproj', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The docs (site/docs): release notes from docs/ROADMAP.md and the current version, so they follow each release.
      - name: Build the docs
        run: python3 tools/build-docs.py site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
