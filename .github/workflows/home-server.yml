# Settings › Home server (docs/HOME-SERVER.md): its Python tests, quick and on their own (no Rust, no image). Also runs
# the settings-persistence check, Hearth Storage's helper tests and the Settings wiring tests it touches. Each failing
# test's lines go on the run as annotations (CI logs can't be downloaded from where the owner's sessions run).
name: Home server

on:
  push:
    branches: [main, bughunt, 'feature/**']
    paths: ['hosts/linux/desktop/shell/hearth-home-server', 'hosts/linux/desktop/shell/hearth-home-server-web', 'hosts/linux/desktop/shell/SetHome*.qml', 'hosts/linux/desktop/shell/SettingsApp.qml',
            'os/system_files/usr/libexec/nimbus/hearth-home-server-helper', 'os/system_files/usr/libexec/nimbus/hearth-storage-helper',
            'os/system_files/usr/lib/systemd/**', 'os-bases/peppermint/build.sh', 'hosts/linux/test/test_hearth_home_server*.py',
            'hosts/decky-hearth-link/**', '.github/workflows/home-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in hosts/linux/desktop/shell/hearth-home-server hosts/linux/desktop/shell/hearth-home-server-web os/system_files/usr/libexec/nimbus/hearth-home-server-helper os/system_files/usr/libexec/nimbus/hearth-storage-helper; do
            python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || { echo "::error file=$f::not valid Python"; exit 1; }
          done
          bash -n os-bases/peppermint/build.sh
      - name: Tests
        run: |
          fail=0
          for t in test_hearth_home_server.py test_hearth_home_server_2.py test_hearth_home_server_3.py test_hearth_home_ai.py test_settings_persistence.py test_hearth_storage_helper.py test_hearth_storage.py test_hearth_settings_move.py; do
            if python3 -m unittest discover -s hosts/linux/test -p "$t" -v > "/tmp/$t.log" 2>&1; then
              echo "::notice title=$t::$(tail -3 "/tmp/$t.log" | tr '\n' ' ')"
            else
              fail=1
              grep -A16 -E '^(FAIL|ERROR):' "/tmp/$t.log" | grep -v '^$' | head -60 | while IFS= read -r l; do echo "::error title=$t::$l"; done
              tail -5 "/tmp/$t.log"
            fi
          done
          exit $fail

  # AI voices (Kokoro-FastAPI) run only by the image digest Hearth pins (hearth-home-server KOKORO_DIGEST): it must still
  # be on ghcr.io, and a release tag that moved to another digest is said. Read only; nothing is pulled.
  kokoro-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kokoro's pinned image
        run: |
          eval "$(python3 - <<'PY'
          import re
          s = open('hosts/linux/desktop/shell/hearth-home-server').read()
          for k in ('KOKORO_IMAGE', 'KOKORO_TAG', 'KOKORO_DIGEST'):
              print('%s=%s' % (k, re.search(r"^%s = '([^']*)'" % k, s, re.M).group(1)))
          PY
          )"
          img="docker://$KOKORO_IMAGE"
          tags=$(skopeo list-tags "$img" 2>/tmp/err | python3 -c 'import json,re,sys; t=json.load(sys.stdin)["Tags"]; v=sorted([x for x in t if re.fullmatch(r"v?\d+\.\d+\.\d+",x)], key=lambda x: [int(n) for n in re.findall(r"\d+",x)]); print(" ".join(v[-6:]+[x for x in t if x=="latest"]))' || true)
          echo "::notice title=Kokoro image tags::${tags:-none: $(head -c 300 /tmp/err)}"
          for t in $(echo "$tags" | tr ' ' '\n' | tail -3) $KOKORO_TAG; do
            d=$(skopeo inspect --raw "$img:$t" 2>/dev/null | sha256sum | cut -d' ' -f1)
            echo "::notice title=Kokoro $t::sha256:$d"
            [ "$t" = "$KOKORO_TAG" ] && tagd="sha256:$d"
          done
          if [ -z "$KOKORO_DIGEST" ]; then echo "::warning title=Kokoro::no digest pinned yet"; exit 0; fi
          if ! skopeo inspect --raw "$img@$KOKORO_DIGEST" > /tmp/m.json 2>/tmp/err; then
            echo "::error title=Kokoro::the pinned image $KOKORO_DIGEST isn't on ghcr.io: $(head -c 300 /tmp/err)"; exit 1
          fi
          echo "::notice title=Kokoro pinned::$(python3 -c 'import json; m=json.load(open("/tmp/m.json")); print(m.get("mediaType",""), [p.get("platform") for p in m.get("manifests",[])][:4])')"
          [ -z "${tagd:-}" ] || [ "$tagd" = "$KOKORO_DIGEST" ] || echo "::warning title=Kokoro::$KOKORO_TAG now points to $tagd; Hearth pins $KOKORO_DIGEST (still there)"

  # Game Mode's Quick Access tile lives in the Hearth Link Decky plugin (hosts/decky-hearth-link): its backend's tests,
  # its pure parts' tests, the build (types checked) and pictures of the real panel over stand-ins. No Rust here.
  quick-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Backend tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s hosts/decky-hearth-link/tests -p 'test_*.py' -v 2>&1 | tee /tmp/py.log | tail -20 || true
          grep -q '^OK' /tmp/py.log || { echo "::error title=Hearth Link backend tests::$(grep -E -A6 '^(FAIL|ERROR):' /tmp/py.log | head -40 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (src/model.ts)
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-reporter=tap hosts/decky-hearth-link/tests/model.test.mjs 2>&1 | tee /tmp/unit.log | tail -15 || true
          grep -qE '^# fail 0' /tmp/unit.log || { echo "::error title=Hearth Link unit tests::$(grep -E -B2 -A12 '^not ok|Error' /tmp/unit.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
      - name: Build (pnpm build)
        working-directory: hosts/decky-hearth-link
        run: |
          npm install -g pnpm@9 >/dev/null
          pnpm install --no-frozen-lockfile 2>&1 | tail -3
          if ! pnpm build > /tmp/build.log 2>&1; then
            echo "::error title=Hearth Link build::$(grep -v '^\s*$' /tmp/build.log | tail -40 | tr '\n' '|' | cut -c1-3800)"; exit 1
          fi
          if grep -qE 'TS[0-9]{4}' /tmp/build.log; then echo "::warning title=Hearth Link types::$(grep -E 'TS[0-9]{4}' /tmp/build.log | head -10 | tr '\n' '|' | cut -c1-3000)"; fi
          test -s dist/index.js
      - name: The Quick Access panel (pictures)
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 esbuild@0.24.0 react@18.3.1 react-dom@18.3.1 react-icons@5.3.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null && cd ..
          cp hosts/decky-hearth-link/tests/render-panel.mjs tools/render-panel.mjs
          HEARTH_ROOT="$PWD" node tools/render-panel.mjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-server-quick-access
          path: ${{ runner.temp }}/shots
