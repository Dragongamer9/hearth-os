name: Hearth Mint in-place upgrade package (test)
on:
  workflow_dispatch:
  push:
    branches: [test/mint-hearth-upgrade-foundation, test/admin-v2-2-major-diagnostics, test/admin-v2-3-desktop-integration]
    paths:
      - 'scripts/build-hearth-mint-deb.sh'
      - 'scripts/hearth-admin-center.py'
      - 'scripts/hearth-admin-report.py'
      - 'scripts/hearth-admin-branding.sh'
      - 'scripts/hearth-admin-desktop.sh'
      - 'branding/hearth-admin-wallpaper.svg'
      - '.github/workflows/mint-hearth-upgrade-deb-test.yml'
      - 'hosts/hearth-rs/**'
      - 'hosts/hearth-core/**'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Hearth build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
      - name: Compile Hearth
        working-directory: hosts/hearth-rs
        run: cargo build --release
      - name: Build upgrade deb
        run: bash scripts/build-hearth-mint-deb.sh
      - name: Verify package
        run: |
          set -euo pipefail
          pkg=$(find dist -maxdepth 1 -name 'hearth-os-app_*_amd64.deb' -print -quit)
          test -s "$pkg"
          dpkg-deb --field "$pkg" Package | grep -Fx hearth-os-app
          dpkg-deb --contents "$pkg" > /tmp/hearth-package-contents.txt
          grep -q './usr/bin/hearth' /tmp/hearth-package-contents.txt
          grep -q './usr/share/applications/hearth.desktop' /tmp/hearth-package-contents.txt
          grep -q './usr/bin/hearth-upgrade' /tmp/hearth-package-contents.txt
          bash -n scripts/build-hearth-mint-deb.sh scripts/hearth-upgrade.sh
          python3 -m py_compile scripts/hearth-admin-center.py scripts/hearth-admin-report.py
          bash -n scripts/hearth-admin-branding.sh scripts/hearth-admin-desktop.sh
          python3 scripts/hearth-admin-report.py --section recovery > /tmp/hearth-recovery-report.txt
          python3 scripts/hearth-admin-report.py --section hardware --json > /tmp/hearth-hardware-report.json
          bash scripts/hearth-upgrade.sh status
          unpack_dir=$(mktemp -d)
          dpkg-deb --extract "$pkg" "$unpack_dir"
          test -x "$unpack_dir/usr/bin/hearth"
          test -x "$unpack_dir/usr/bin/hearth-upgrade"
          test -x "$unpack_dir/usr/bin/hearth-admin-center"
          test -x "$unpack_dir/usr/bin/hearth-admin-report"
          test -x "$unpack_dir/usr/bin/hearth-admin-branding"
          test -x "$unpack_dir/usr/bin/hearth-admin-desktop"
          test -s "$unpack_dir/usr/share/backgrounds/hearth-admin-edition.svg"
          grep -F "Hearth OS Admin Edition" "$unpack_dir/etc/hearth-admin-release"
          grep -Fx 'Exec=/usr/bin/hearth-admin-center' "$unpack_dir/usr/share/applications/hearth-admin-center.desktop"
          grep -Fx 'Exec=/usr/bin/hearth --windowed' "$unpack_dir/usr/share/applications/hearth.desktop"
          sha256sum "$pkg" > dist/SHA256SUMS
      - name: Install package on Ubuntu 24.04 Mint-compatible base
        run: |
          set -euo pipefail
          pkg=$(find dist -maxdepth 1 -name 'hearth-os-app_*_amd64.deb' -print -quit)
          # Emulate original V1 binary and desktop shortcut.
          sudo install -Dm755 hosts/hearth-rs/target/release/hearth /usr/local/bin/hearth
          sudo mkdir -p /usr/share/applications
          printf '[Desktop Entry]\nType=Application\nName=Hearth OS\nExec=/usr/local/bin/hearth --windowed\n' | sudo tee /usr/share/applications/hearth.desktop
          sudo apt-get install -y "./$pkg"
          test -x /usr/local/bin/hearth
          test -x /usr/bin/hearth
          test -x /usr/bin/hearth-upgrade
          test -x /usr/bin/hearth-admin-center
          test -x /usr/bin/hearth-admin-report
          test -x /usr/bin/hearth-admin-desktop
          test -f /etc/hearth-admin-release
          dpkg-query -W -f='${Status}\n' hearth-os-app | grep -Fx 'install ok installed'
          grep -Fx 'Exec=/usr/bin/hearth --windowed' /usr/share/applications/hearth.desktop
          hearth-upgrade status
          hearth-admin-report --section recovery > /tmp/hearth-installed-recovery.txt
          # GUI boot and launch still need physical/VM validation.
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-mint-upgrade-deb-test
          path: |
            dist/*.deb
            dist/SHA256SUMS
          retention-days: 14
