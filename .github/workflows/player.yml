# Hearth Player (hosts/hearth-player): unit tests, the edits for real with ffmpeg (tests/ffmpeg.rs), the page in
# Chromium on sample data (tests/ui_test.py), and the app itself on Linux: it opens a clip made with ffmpeg,
# plays it through WebKitGTK/GStreamer, and is driven over MPRIS (play/pause, seek) the way Mantel's media keys do,
# with screenshots in the run's hearth-player-linux artifact. Release builds come from base-*.yml (the Linux images).
# Ember (Windows) isn't built yet: the Linux editions come first.
name: Hearth Player

on:
  push:
    branches: [main, linux-host, hearth-media]
    paths: ['hosts/hearth-player/**', '.github/workflows/player.yml']
  workflow_dispatch:
    inputs:
      shots:
        description: Put small copies of the screenshots on the run as notices
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: never

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hosts/hearth-player
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-player
      - name: The page's script
        run: node --check ui/app.js
      - name: WebKit, GStreamer (what WebKitGTK plays with), ffmpeg and a desktop to run in
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-pulseaudio \
            ffmpeg pulseaudio xvfb imagemagick x11-utils dbus-x11 xdotool >/dev/null
          ffmpeg -hide_banner -version | head -1
      - name: Unit tests and the edits with ffmpeg
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee test.log || { echo "::error title=tests::$(grep -E '^(error|---- |thread .* panicked)' -A12 test.log | head -80 | tr '\n' '|' | cut -c1-3900)"; exit 1; }
          echo "::notice title=Tests::$(grep -E '^test result' test.log | tr '\n' ' ')"
      - name: Build
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log || { echo "::error title=build::$(grep -E '^error' -A8 build.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          echo "::notice title=Size::$(du -h target/release/hearth-player | cut -f1)"
          ./target/release/hearth-player --help
      - name: Sample media (made with ffmpeg)
        run: |
          m="$RUNNER_TEMP/media"; mkdir -p "$m/Music/Hearth Band - Kiln"
          printf ';FFMETADATA1\ntitle=Test clip\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=0\nEND=10000\ntitle=Opening\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=10000\nEND=30000\ntitle=The rest\n' > "$m/meta.txt"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30:duration=30 -f lavfi -i sine=f=440:duration=30 -i "$m/meta.txt" \
            -map 0:v -map 1:a -map_metadata 2 -map_chapters 2 -c:v libx264 -pix_fmt yuv420p -g 30 -c:a aac -shortest "$m/Test clip.mp4"
          printf '1\n00:00:00,500 --> 00:00:29,000\nHearth Player subtitles <i>work</i>\n' > "$m/Test clip.en.srt"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=25:duration=20 -f lavfi -i sine=f=300:duration=20 -c:v libx265 -c:a libopus "$m/HEVC clip.mkv" || true
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=25:duration=20 -f lavfi -i sine=f=300:duration=20 -c:v libvpx-vp9 -deadline realtime -c:a libopus "$m/VP9 clip.webm"
          for i in 1 2 3; do ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=f=$((200 + i * 110)):duration=40" -c:a libmp3lame -metadata title="Ember song $i" -metadata artist="Hearth Band" -metadata album=Kiln -metadata track=$i "$m/Music/Hearth Band - Kiln/0$i Ember song $i.mp3"; done
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=f=500:duration=40" -c:a flac "$m/Music/Hearth Band - Kiln/04 Flac song.flac"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "gradients=size=600x600:c0=0xff8a3d:c1=0x2a1206" -frames:v 1 "$m/Music/Hearth Band - Kiln/folder.jpg" || ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=orange:size=600x600" -frames:v 1 "$m/Music/Hearth Band - Kiln/folder.jpg"
          ls -la "$m" "$m/Music/Hearth Band - Kiln"
      - name: Play it (WebKitGTK and GStreamer) and drive it over MPRIS
        run: |
          set -u
          m="$RUNNER_TEMP/media"; mkdir -p shots
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 HEARTH_PLAYER_CONFIG="$RUNNER_TEMP/cfg"
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          cat > "$RUNNER_TEMP/drive.sh" <<'EOS'
          #!/bin/bash
          # Inside the D-Bus session: a sound server (a null output), the player, then MPRIS calls.
          m="$1"; shots="$2"
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes 2>/dev/null || true
          shot() { import -window root "$shots/$1.png" 2>/dev/null || true; }
          ./target/release/hearth-player "$m/Test clip.mp4" > run.log 2>&1 &
          pid=$!
          name=""
          for i in $(seq 40); do name=$(busctl --user list --no-legend 2>/dev/null | awk '{print $1}' | grep -m1 '^org.mpris.MediaPlayer2.HearthPlayer'); [ -n "$name" ] && break; sleep 1; done
          [ -n "$name" ] || { echo "MPRIS: no player on the bus"; tail -40 run.log; exit 1; }
          echo "MPRIS name: $name"
          prop() { busctl --user get-property "$name" /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player "$1" 2>/dev/null; }
          call() { busctl --user call "$name" /org/mpris/MediaPlayer2 org.mpris.MediaPlayer2.Player "$@"; }
          status=""; pos=0
          for i in $(seq 40); do status=$(prop PlaybackStatus); pos=$(prop Position | awk '{print $2}'); [ "${pos:-0}" -gt 1500000 ] 2>/dev/null && break; sleep 1; done
          echo "status=$status position=$pos"
          prop Metadata
          systemd-inhibit --list --no-pager 2>/dev/null | grep -i hearth && echo "inhibitor: held" || echo "inhibitor: none seen (no logind seat for the runner)"
          sleep 2; shot video
          [ "${pos:-0}" -gt 1500000 ] 2>/dev/null || { echo "FAIL: the clip didn't play (status $status, position $pos)"; tail -60 run.log; exit 1; }
          call PlayPause; sleep 1
          s2=$(prop PlaybackStatus); echo "after PlayPause: $s2"
          echo "$s2" | grep -q Paused || { echo "FAIL: PlayPause didn't pause"; exit 1; }
          call Seek x 10000000; sleep 1
          p2=$(prop Position | awk '{print $2}'); echo "after Seek +10 s: $p2"
          [ "${p2:-0}" -gt 10000000 ] 2>/dev/null || { echo "FAIL: Seek didn't move ($p2)"; exit 1; }
          call PlayPause; sleep 3
          w=$(xdotool search --name 'Hearth Player' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true
          xdotool key v; sleep 2; shot subtitles
          xdotool key e; sleep 2; shot edit
          xdotool key Escape; sleep 1
          xdotool key ctrl+o; sleep 2; shot open
          kill $pid 2>/dev/null; sleep 1
          # Other formats: H.265 in MKV, VP9 in WebM, and a song folder (the music view).
          for f in "HEVC clip.mkv" "VP9 clip.webm" "Music/Hearth Band - Kiln/01 Ember song 1.mp3" "Music/Hearth Band - Kiln/04 Flac song.flac"; do
            [ -f "$m/$f" ] || { echo "$f: not made on this runner"; continue; }
            ./target/release/hearth-player "$m/$f" > run2.log 2>&1 &
            pid=$!; name=""
            for i in $(seq 30); do name=$(busctl --user list --no-legend 2>/dev/null | awk '{print $1}' | grep -m1 '^org.mpris.MediaPlayer2.HearthPlayer'); [ -n "$name" ] && break; sleep 1; done
            pos=0; for i in $(seq 30); do pos=$(prop Position | awk '{print $2}'); [ "${pos:-0}" -gt 1500000 ] 2>/dev/null && break; sleep 1; done
            echo "RESULT $f: position $pos"
            shot "$(basename "$f" | tr ' .' '__')"
            kill $pid 2>/dev/null; sleep 1
          done
          exit 0
          EOS
          chmod +x "$RUNNER_TEMP/drive.sh"
          dbus-run-session -- "$RUNNER_TEMP/drive.sh" "$m" "$PWD/shots" 2>&1 | tee drive.log
          rc=${PIPESTATUS[0]}
          for r in $(grep '^RESULT' drive.log | tr ' ' '_'); do echo "::notice title=Plays::$(echo "$r" | tr '_' ' ')"; done
          echo "::notice title=MPRIS::$(grep -E 'status=|after ' drive.log | tr '\n' ' ')"
          echo "::notice title=Keep awake::$(grep inhibitor drive.log | head -1)"
          [ "$rc" = 0 ] || { echo "::error title=playback::$(tail -c 3000 drive.log | tr '\n' '|')"; exit 1; }
      - name: The page in Chromium (sample data)
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/pw"; . "$RUNNER_TEMP/pw/bin/activate"
          pip install -q playwright==1.48.2
          python -m playwright install --with-deps chromium >/dev/null
          m="$RUNNER_TEMP/uimedia"; mkdir -p "$m"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25:duration=12 -f lavfi -i sine=f=440:duration=12 -c:v libvpx-vp9 -b:v 300k -deadline realtime -c:a libopus -shortest "$m/Sample clip.webm"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=f=330:duration=30 -c:a libvorbis "$m/Song one.ogg"; cp "$m/Song one.ogg" "$m/Song two.ogg"
          python3 tests/ui_test.py shots/page "$m" 2>&1 | tee ui.log || { echo "::error title=page::$(tail -c 3000 ui.log | tr '\n' '|')"; exit 1; }
          echo "::notice title=Page::$(grep -c '^ok' ui.log) checks passed"
      # GitHub keeps 10 notices per step: two small screenshots each.
      - name: Screenshots as notices (1)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          for n in subtitles edit; do
            f=shots/$n.png; [ -f "$f" ] || continue
            convert "$f" -resize 560x -quality 40 jpg:- | base64 -w0 | fold -w 3900 | nl -ba -w2 -s' ' | head -5 | while read -r i part; do echo "::notice title=SHOT $n $i::$part"; done
          done
      # GitHub keeps 10 notices per step: two small screenshots each.
      - name: Screenshots as notices (2)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          for n in open 01_Ember_song_1_mp3; do
            f=shots/$n.png; [ -f "$f" ] || continue
            convert "$f" -resize 560x -quality 40 jpg:- | base64 -w0 | fold -w 3900 | nl -ba -w2 -s' ' | head -5 | while read -r i part; do echo "::notice title=SHOT $n $i::$part"; done
          done
      # GitHub keeps 10 notices per step: two small screenshots each.
      - name: Screenshots as notices (3)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          for n in HEVC_clip_mkv video; do
            f=shots/$n.png; [ -f "$f" ] || continue
            convert "$f" -resize 560x -quality 40 jpg:- | base64 -w0 | fold -w 3900 | nl -ba -w2 -s' ' | head -5 | while read -r i part; do echo "::notice title=SHOT $n $i::$part"; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-player-linux
          path: |
            hosts/hearth-player/target/release/hearth-player
            hosts/hearth-player/shots
            hosts/hearth-player/*.log
