# Hearth's small installer USB (os/installer): boots into the Hearth app's install screens and downloads Hearth OS
# while installing, so the ISO is about 2 GB. The universal installer, one ISO for every PC: its screens offer
# Hearth OS on Anatase (recommended, ghcr.io/dragongamer9/hearth-os:latest) or the Beta Experimental editions on
# Ubuntu, CachyOS and Peppermint (:testing). Builds the ISO, boots it in a virtual machine and saves screenshots
# to the ci/installer-shots branch. Uploads to the download site (Cloudflare R2, as hearth-os-installer.iso) only
# when run by hand with Upload ticked.
name: Hearth installer ISO

on:
  # The small online installer isn't offered any more (the offline USB, edition: peppermint, and the Recovery USB
  # are): no automatic builds on push; run by hand only.
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the ISO to the download site (Cloudflare R2, as hearth-os-installer.iso)'
        type: boolean
        default: false
      edition:
        description: 'installer: the small online installer (every edition). An edition: its offline installer (the installer plus that edition, no internet needed)'
        type: choice
        options: [installer, ubuntu, cachyos, peppermint]
        default: peppermint
      e2e:
        description: 'End-to-end test before uploading: go through every installer screen in a virtual PC (screenshots), install, then start the installed system'
        type: boolean
        default: true
      app:
        description: 'Which Hearth app the USB carries'
        type: choice
        options: [rust, electron]
        default: rust

permissions:
  contents: write
  packages: read

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HAVE_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
      APP: ${{ inputs.app || 'rust' }}
      ED: ${{ inputs.edition || 'installer' }}
      SHOTS: ${{ inputs.app == 'electron' && 'ci/installer-shots-electron' || 'ci/installer-shots' }}${{ inputs.edition && inputs.edition != 'installer' && format('-{0}', inputs.edition) || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/setup-node@v4
        if: env.APP == 'electron'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        if: env.APP == 'rust'
      - name: Build the Hearth app (this commit, Rust)
        if: env.APP == 'rust'
        working-directory: hosts/hearth-rs
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' ../windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
          sed -i "s/^version = \".*\"/version = \"$v\"/" Cargo.toml
          cargo build --release
          mkdir -p ../../os/nimbus-app && cp target/release/hearth ../../os/nimbus-app/hearth
          echo "$v" > ../../os/nimbus-app/hearth-version
      - name: Build the Hearth app (this commit)
        if: env.APP == 'electron'
        working-directory: hosts/linux
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' ../windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          npm install --no-audit --no-fund
          npm version "$v" --no-git-tag-version --allow-same-version
          npm run dist:dir
          test -x dist/linux-unpacked/nimbus
          mkdir -p ../../os/nimbus-app && cp -a dist/linux-unpacked/. ../../os/nimbus-app/
          echo "$v" > ../../os/nimbus-app/hearth-version

      - name: Build the installer system
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=installer system::$msg"' ERR
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          ref=""
          if [ "$ED" != installer ]; then
            # The edition's image, as the installer's table names it (hearth-install EDITIONS), pinned by digest.
            img=$(grep -oP "^    '$ED': \{'image': '\K[^']+" os/live/src/hearth-install)
            [ -n "$img" ] || { echo "::error title=Offline installer::no image for $ED in hearth-install"; exit 1; }
            digest=$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://$img")
            ref="${img%:*}@$digest"
            echo "::notice title=Offline installer::$ED carries $img ($ref)"
          fi
          sudo podman build --pull=newer --cap-add sys_admin --security-opt label=disable \
            --build-arg EDITION="$ED" --build-arg IMAGE_REF="$ref" \
            -t localhost/hearth-installer:latest -f os/installer/Containerfile .

      - name: Make the ISO (Titanoboa)
        id: iso
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=iso::$msg"' ERR
          git clone -q https://github.com/ublue-os/titanoboa.git /tmp/titanoboa
          git -C /tmp/titanoboa checkout -q 5c457c3d0518bd17e754be0fd98a60d29d26abb4
          out=/mnt/installer-out
          sudo mkdir -p "$out"
          iso=$(cd /tmp/titanoboa && sudo TITANOBOA_OUTPUT_DIR="$out" ./main.sh localhost/hearth-installer:latest)
          sudo chown -R "$(id -u):$(id -g)" "$out"
          v=$(sudo podman run --rm localhost/hearth-installer:latest cat /usr/share/nimbus/version 2>/dev/null || echo latest)
          if [ "$ED" = installer ]; then f="hearth-os-$v-installer.iso"; else f="hearth-os-$v-$ED-offline.iso"; fi
          mv "$iso" "$out/$f"
          (cd "$out" && sha256sum "$f" | tee "$f.sha256")
          ls -lh "$out"
          echo "::notice title=Installer ISO::$f is $(du -h "$out/$f" | cut -f1)"
          echo "dir=$out" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=$out/$f" >> "$GITHUB_OUTPUT"

      - name: Keep the ISO as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: hearth-os-${{ steps.iso.outputs.version }}-${{ env.ED == 'installer' && 'installer' || format('{0}-offline', env.ED) }}
          path: ${{ steps.iso.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # End-to-end, as a person does it (tools/e2e-ui.sh): every installer screen in a virtual PC with screenshots, the
      # drive erased by holding Enter, the install, Restart, and the installed system started from the disk alone.
      # Nothing is uploaded unless this passes (the owner's rule: every ISO fully install-tested before release).
      - name: End-to-end install test through the installer's screens
        id: e2e
        if: inputs.e2e != false
        timeout-minutes: 200
        env:
          ISO: ${{ steps.iso.outputs.file }}
        run: |
          label=$(xorriso -indev "$ISO" -pvd_info 2>/dev/null | sed -n 's/^Volume Id *: *//p' | head -1)
          bash tools/e2e-ui.sh "$ISO" "${label:-Hearth-Install}" e2e
      - name: Publish the end-to-end test's screenshots and serial logs (ci/e2e-ui-${{ env.ED }})
        if: always() && steps.e2e.outcome != 'skipped' && steps.e2e.outcome != ''
        run: |
          [ -d e2e ] || exit 0
          mkdir -p /tmp/e2e-pub && cp -r e2e/. /tmp/e2e-pub/ && cd /tmp/e2e-pub && git init -q && git checkout -q -b e2e
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "E2E install test ($GITHUB_RUN_ID)" || exit 0
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/e2e-ui-${{ env.ED }} || true

      - name: Upload to the download site (Cloudflare R2)
        if: env.HAVE_R2 == 'true' && inputs.upload && steps.e2e.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          V: ${{ steps.iso.outputs.version }}
        run: |
          if [ "$ED" = installer ]; then name=hearth-os-installer.iso; else name="hearth-os-$ED.iso"; fi
          tools/r2-upload.sh "${{ steps.iso.outputs.file }}" "$name" "$V"
