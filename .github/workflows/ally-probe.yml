# Temporary (branch ally-black-screen-probe only): what changed in the published Peppermint image between the one the
# ROG Ally last booted fine (before 2026-10-24 21:50 UTC) and :testing now. Package versions, the files that start
# Game Mode, and Game Mode itself started in each image (gamescope headless, software drawing).
name: ally probe

on:
  push:
    branches: [ally-black-screen-probe]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost; df -h /
      - name: Image versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/users/Dragongamer9/packages/container/hearth-peppermint/versions?per_page=80" --jq '.[] | "\(.name) \(.created_at) \(.metadata.container.tags|join(","))"' | tee /tmp/versions.txt || true
          old=$(awk '$2 < "2026-10-24T21:50:00Z" {print $1; exit}' /tmp/versions.txt)
          echo "OLD=$old" >> "$GITHUB_ENV"
          echo "::notice title=old image::$(grep "$old" /tmp/versions.txt)"
          echo "::notice title=versions::$(head -25 /tmp/versions.txt | tr '\n' '|')"
      - name: Pull both
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull -q ghcr.io/dragongamer9/hearth-peppermint:testing
          sudo podman pull -q "ghcr.io/dragongamer9/hearth-peppermint@$OLD"
          sudo podman tag ghcr.io/dragongamer9/hearth-peppermint:testing pnew
          sudo podman tag "ghcr.io/dragongamer9/hearth-peppermint@$OLD" pold
          df -h /
      - name: Packages and files
        run: |
          cat > /tmp/inv.sh <<'SH'
          dpkg-query -W -f '${Package}:${Architecture} ${Version}\n' | sort > /out/pkgs.txt
          cat /usr/share/hearth/image-info.json /usr/share/nimbus/image-info.json 2>/dev/null > /out/info.txt
          ls /usr/lib/modules > /out/kernels.txt
          find /etc /usr/lib/systemd /usr/share/nimbus /usr/libexec/nimbus /usr/share/wayland-sessions /usr/share/xsessions /usr/lib/sddm /usr/share/sddm /usr/lib/udev/rules.d /usr/share/polkit-1 /usr/bin/nimbus* /usr/lib/hearth-electron/resources -xdev \( -type f -o -type l \) 2>/dev/null \
            | grep -v -e '/etc/ssl/' -e '/ld.so.cache' | sort | while read -r f; do if [ -L "$f" ]; then echo "$f -> $(readlink "$f")"; else echo "$f $(md5sum < "$f" | cut -c1-12)"; fi; done > /out/files.txt
          SH
          for i in old new; do mkdir -p /tmp/$i; sudo podman run --rm -v /tmp/inv.sh:/inv.sh:ro -v /tmp/$i:/out p$i bash /inv.sh; done
          echo "::notice title=kernels::old $(cat /tmp/old/kernels.txt | tr '\n' ' ') new $(cat /tmp/new/kernels.txt | tr '\n' ' ')"
          echo "::notice title=info::old $(cat /tmp/old/info.txt | tr '\n' ' ' | cut -c1-600) NEW $(cat /tmp/new/info.txt | tr '\n' ' ' | cut -c1-600)"
          diff /tmp/old/pkgs.txt /tmp/new/pkgs.txt > /tmp/pkgdiff.txt; echo "package lines changed: $(wc -l < /tmp/pkgdiff.txt)"
          cat /tmp/pkgdiff.txt
          split -l 60 /tmp/pkgdiff.txt /tmp/pd.; for p in /tmp/pd.*; do echo "::notice title=pkgdiff $(basename $p)::$(tr '\n' '|' < $p | cut -c1-3900)"; done
          diff /tmp/old/files.txt /tmp/new/files.txt | grep '^[<>]' > /tmp/filediff.txt; echo "file lines changed: $(wc -l < /tmp/filediff.txt)"
          cat /tmp/filediff.txt
          grep -v -e '/usr/share/nimbus/ui/' -e 'hearth-electron/resources' -e '/osk/' -e '/usr/share/doc' /tmp/filediff.txt > /tmp/fd2.txt
          split -l 50 /tmp/fd2.txt /tmp/fd.; for p in /tmp/fd.*; do echo "::notice title=filediff $(basename $p)::$(tr '\n' '|' < $p | cut -c1-3900)"; done
      - name: Game Mode in each image (gamescope headless, software drawing)
        run: |
          cat > /tmp/gm.sh <<'SH'
          useradd -m t 2>/dev/null
          mkdir -p /tmp/r && chown t /tmp/r && chmod 700 /tmp/r
          echo "== gamescope: $(gamescope --version 2>&1 | head -1)"
          runuser -u t -- env XDG_RUNTIME_DIR=/tmp/r HOME=/home/t LIBGL_ALWAYS_SOFTWARE=1 NIMBUS_SESSION=1 \
            dbus-run-session -- timeout 60 gamescope --backend headless -W 1280 -H 800 -- sh -c 'timeout 45 /usr/bin/nimbus; echo "nimbus exit: $?"' > /tmp/gm.log 2>&1
          echo "== gamescope exit: $?"
          grep -v '^$' /tmp/gm.log | tail -n 60
          echo "== bridge.log"
          tail -n 60 /home/t/.local/share/nimbus/bridge.log 2>/dev/null
          SH
          for i in old new; do echo "######## $i"; sudo podman run --rm --privileged -v /tmp/gm.sh:/gm.sh:ro p$i bash /gm.sh 2>&1 | tee /tmp/gm-$i.txt | tail -n 130
            echo "::notice title=gamemode $i::$(grep -E 'nimbus exit|gamescope exit|renderer|page|ready|panic|error|Error' /tmp/gm-$i.txt | head -40 | tr '\n' '|' | cut -c1-3900)"; done
