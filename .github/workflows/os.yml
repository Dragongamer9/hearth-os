# Builds Hearth, the Linux OS: Bazzite (deck edition) with the Hearth session (the Nimbus UI) installed and booted into.
# - Pushes to main that touch the OS, the Linux host or the UI, a weekly rebuild (to pick up Bazzite's
#   updates), or a manual run: build the images and publish them as ghcr.io/dragongamer9/hearth (AMD and
#   Intel graphics) and ghcr.io/dragongamer9/hearth-nvidia (Nvidia graphics).
# - Manual run with "Build the installer ISO" ticked: also build the installer and keep it as a download
#   on the run (GitHub releases can't hold files over 2 GB).
# The image is signed when the SIGNING_SECRET repository secret holds a Cosign private key.
name: Hearth OS

on:
  push:
    branches: [main]
    paths: ['os/**', 'hosts/linux/**', 'hosts/hearth-core/**', 'hosts/hearth-rs/**', 'hosts/hearth-browser/**', 'ui/**', '.github/workflows/os.yml']
  pull_request:
    paths: ['os/**', '.github/workflows/os.yml']
  schedule:
    - cron: '20 9 * * 1'   # Mondays: rebuild on Bazzite's latest
  workflow_dispatch:
    inputs:
      iso:
        description: Build the installer ISO
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/dragongamer9/hearth

concurrency:
  group: hearth-os-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  app:
    name: Build the Hearth app (Rust)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The Rust app (hosts/hearth-rs): one file, drawn by the system's WebKit (os/build_files/build.sh installs it).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
      - name: Build
        working-directory: hosts/hearth-rs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release
          mkdir -p /tmp/app && cp target/release/hearth /tmp/app/hearth
      # Hearth Browser is still an Electron app (hosts/linux/src/web): it goes in as its own folder.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hearth Browser
        working-directory: hosts/linux
        run: |
          npm install --no-audit --no-fund
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist:dir
          test -x dist/linux-unpacked/nimbus
          mkdir -p /tmp/app/browser && cp -a dist/linux-unpacked/. /tmp/app/browser/
          tar -C /tmp/app -cf ../../nimbus-app.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-app
          path: nimbus-app.tar

  # Hearth Browser on Chromium (CEF, hosts/hearth-browser). Until it has been tried on devices the Electron
  # version stays installed too; /usr/bin/hearth-browser prefers this one. A failure here doesn't stop the image.
  browser:
    name: Build Hearth Browser (Chromium)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download CEF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libgtk-3-dev libnss3-dev libx11-xcb-dev libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev libasound2-dev libcups2-dev libxkbcommon-dev >/dev/null
          f=$(curl -fsSL https://cef-builds.spotifycdn.com/index.json | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["linux64"]["versions"]
          v=next(x for x in d if x.get("channel")=="stable")
          print(next(f["name"] for f in v["files"] if f["type"]=="minimal"))')
          echo "CEF: $f"
          curl -fsSL "https://cef-builds.spotifycdn.com/$f" -o /tmp/cef.tar.bz2
          mkdir -p /tmp/cef && tar -C /tmp/cef --strip-components=1 -xjf /tmp/cef.tar.bz2
      - name: Build
        run: |
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          cp -a hosts/hearth-browser /tmp/cef/hearth
          echo 'add_subdirectory(hearth)' >> /tmp/cef/CMakeLists.txt
          cmake -S /tmp/cef -B /tmp/cef/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHEARTH_VERSION="$v"
          ninja -C /tmp/cef/build hearth-browser
          out=/tmp/cef/build/hearth/Release
          test -x $out/hearth-browser
          mkdir -p /tmp/hb && cp -a $out/. /tmp/hb/
          # Hearth's own pages (the top bar, start page, history...), shared with the Electron version.
          mkdir -p /tmp/hb/hearth && cp hosts/linux/src/web/chrome.html hosts/linux/src/web/pages.html hosts/linux/src/web/hearth-logo.svg /tmp/hb/hearth/
          # Ad and tracker servers (Steven Black's unified hosts list).
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts | grep -E '^0\.0\.0\.0 ' > /tmp/hb/hearth/adblock-hosts.txt || true
          wc -l /tmp/hb/hearth/adblock-hosts.txt
          strip /tmp/hb/hearth-browser || true
          tar -C /tmp/hb -cf hearth-browser-cef.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-browser-cef
          path: hearth-browser-cef.tar

  # REQUIRED: Hearth's page must load and draw every screen without a script error (one error can leave the
  # app blank), or nothing is published.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Hearth's page
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node ui-check.js

  image:
    name: Build the OS image (${{ matrix.name }})
    needs: [app, ui, browser]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hearth
            base: bazzite-deck
          - name: hearth-nvidia
            base: bazzite-deck-nvidia
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/dragongamer9/${{ matrix.name }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      HAS_KEY: ${{ secrets.SIGNING_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is several GB)
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/download-artifact@v4
        with:
          name: nimbus-app

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hearth-browser-cef

      - name: Unpack Nimbus into the build context
        run: |
          mkdir -p os/nimbus-app
          tar -C os/nimbus-app -xf nimbus-app.tar
          if [ -f hearth-browser-cef.tar ]; then mkdir -p os/nimbus-app/browser-cef && tar -C os/nimbus-app/browser-cef -xf hearth-browser-cef.tar; fi

      - name: Build
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" -e "Copying config" -e "Writing manifest" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=image::$msg"' ERR
          v="${{ needs.app.outputs.version }}"
          sudo podman build --pull=newer -f os/Containerfile --build-arg NIMBUS_VERSION="$v" --build-arg BASE="${{ matrix.base }}" -t hearth:latest .

      # Smaller updates: split the image into up to 127 pieces grouped by package, which stay the same
      # between builds when their files do, so an update only downloads what really changed (Universal
      # Blue's image template does the same). Without it, everything Hearth adds is one piece that changes
      # with every build.
      - name: Rechunk for smaller updates
        run: |
          sudo podman run --rm --pull=newer --privileged -v /var/lib/containers:/var/lib/containers \
            --entrypoint /usr/bin/rpm-ostree quay.io/fedora/fedora-bootc:latest \
            compose build-chunked-oci --bootc --format-version=2 --max-layers 127 \
            --from localhost/hearth:latest --output containers-storage:localhost/hearth:latest
          v="${{ needs.app.outputs.version }}"
          sudo podman tag hearth:latest "hearth:$v" "hearth:$v-$(date -u +%Y%m%d)"
          sudo podman image inspect hearth:latest --format '{{len .RootFS.Layers}} layers'

      # Every Hearth must be able to update itself, or people get stuck on it: check before publishing.
      # REQUIRED: a failure here stops the image from being published.
      - name: Check the image can update itself
        run: |
          cat > /tmp/check.sh <<'EOF'
          fail=0
          check() { if sh -c "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "::error title=update path::$1"; fail=1; fi; }
          check "bootc is installed" "command -v bootc"
          check "pkexec is installed" "command -v pkexec"
          check "hearth-admin is installed" "test -x /usr/libexec/nimbus/hearth-admin"
          check "hearth-import is installed" "test -x /usr/libexec/nimbus/hearth-import && command -v rsync"
          check "hearth-takeover and its tools are installed" "test -x /usr/libexec/nimbus/hearth-takeover && command -v sfdisk && command -v partx && command -v efibootmgr && command -v btrfs"
          check "the polkit rule for hearth-admin is installed" "test -f /usr/share/polkit-1/rules.d/49-hearth-admin.rules"
          check "the Hearth app has the Update now button" "grep -aqs system.update.install /usr/lib/nimbus/nimbus || grep -rqs sysUpdInstall /usr/lib/nimbus/resources"
          check "hearth-admin's Python is valid" "python3 -m py_compile /usr/libexec/nimbus/hearth-admin"
          # REQUIRED: Hearth updates itself from Game Mode and Desktop Mode (the app checks everything it relies on).
          echo "--- update path (required) ---"
          /usr/lib/nimbus/nimbus --check-update-path || fail=1
          check "Hearth Browser is installed" "test -x /usr/lib/hearth-browser/nimbus"
          check "background updates are scheduled" "ls /usr/lib/systemd/system/*.timer /etc/systemd/system/timers.target.wants/ /usr/lib/systemd/system/timers.target.wants/ 2>/dev/null | grep -qE 'uupd|rpm-ostreed-automatic|bootc-fetch-apply-updates'"
          exit $fail
          EOF
          sudo podman run --rm -v /tmp/check.sh:/check.sh:ro hearth:latest sh /check.sh

      - name: Publish to GitHub Container Registry
        if: env.PUBLISH == 'true'
        id: push
        run: |
          v="${{ needs.app.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "$v" "$v-$(date -u +%Y%m%d)"; do
            sudo podman push --digestfile /tmp/digest "hearth:$tag" "$IMAGE:$tag"
          done
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: env.PUBLISH == 'true' && env.HAS_KEY == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Sign the image
        if: env.PUBLISH == 'true' && env.HAS_KEY == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Not signed
        if: env.PUBLISH == 'true' && env.HAS_KEY != 'true'
        run: echo "::warning::Hearth was published unsigned. Add a Cosign private key as the SIGNING_SECRET repository secret to sign it."

  iso:
    name: Build the installer ISO
    needs: [app, image]
    if: github.event_name == 'workflow_dispatch' && inputs.iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      # bootc-image-builder run directly (not through its action) so a failure's output can be read back as
      # annotations on the run.
      - name: Build the ISO
        id: build
        run: |
          set -o pipefail
          # Any failure: post the end of this step's output as annotations (readable without the full log).
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" -e "Copying config" -e "Writing manifest" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=iso::$msg"' ERR
          out=/mnt/hearth-iso
          sudo mkdir -p "$out"
          df -h / /mnt
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE:latest"
          # The ISO builder reads the image's package repos with its own copy of Fedora's signing keys, so
          # repos signed with keys only the image has (Bazzite's Terra, negativo17, ...) stop it. Build the
          # ISO from a copy with those switched off: the installed PC moves to the real image straight away
          # (see iso.toml), so it never keeps this copy.
          cat > /tmp/Containerfile.iso <<EOF
          FROM $IMAGE:latest
          RUN for f in /etc/yum.repos.d/*.repo; do \\
                if ! grep -q RPM-GPG-KEY-fedora "\$f" && grep -q '^enabled=1' "\$f"; then echo "off: \$f"; sed -i 's/^enabled=1/enabled=0/' "\$f"; fi; \\
              done
          EOF
          sed -i 's/^          //' /tmp/Containerfile.iso
          cat /tmp/Containerfile.iso
          sudo podman build -t localhost/hearth-iso:latest -f /tmp/Containerfile.iso /tmp
          if ! sudo podman run --rm --privileged --pull=newer \
              --security-opt label=type:unconfined_t \
              -v "$PWD/os/disk_config/iso.toml:/config.toml:ro" \
              -v "$out:/output" \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              quay.io/centos-bootc/bootc-image-builder:latest \
              --type anaconda-iso --use-librepo=True --rootfs btrfs \
              localhost/hearth-iso:latest; then
            df -h / /mnt
            false
          fi
          sudo chown -R "$(id -u):$(id -g)" "$out"
          ls -lR "$out"
          echo "output-directory=$out" >> "$GITHUB_OUTPUT"

      - name: Keep the ISO as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: hearth-${{ needs.app.outputs.version || 'latest' }}-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
