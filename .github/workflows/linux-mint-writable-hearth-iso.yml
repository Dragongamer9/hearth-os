name: Linux Mint writable Hearth test ISO
on:
  workflow_dispatch:
  push:
    branches: [test/linux-mint-writable-hearth-iso]
    paths: ['.github/workflows/linux-mint-writable-hearth-iso.yml']
permissions:
  contents: read
env:
  ISO_WORK: ${{ github.workspace }}/.iso-work
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools and disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet || true
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools rsync curl libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
      - name: Build Hearth application
        working-directory: hosts/hearth-rs
        run: cargo build --release
      - name: Reclaim build space before unpacking Mint
        run: |
          set -euxo pipefail
          mkdir -p "$ISO_WORK"
          install -Dm755 hosts/hearth-rs/target/release/hearth "$ISO_WORK/hearth-built"
          rm -rf hosts/hearth-rs/target
          rm -rf "$HOME/.rustup/toolchains" "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
          sudo apt-get clean
          df -h / /tmp "$ISO_WORK"
          df -i / /tmp "$ISO_WORK"
      - name: Download and verify original Mint ISO
        env:
          ISO_URL: https://pub.linuxmint.io/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso
          SUMS_URL: https://pub.linuxmint.io/stable/22.3/sha256sum.txt
        run: |
          set -euxo pipefail
          [[ "$ISO_URL" == https://* ]]
          curl --fail --location --retry 4 "$SUMS_URL" -o $ISO_WORK/sha256sum.txt
          ISO_SHA=$(awk '$2 == "*linuxmint-22.3-cinnamon-64bit.iso" || $2 == "linuxmint-22.3-cinnamon-64bit.iso" {print $1}' $ISO_WORK/sha256sum.txt)
          [[ "$ISO_SHA" =~ ^[0-9a-fA-F]{64}$ ]]
          curl --fail --location --retry 4 "$ISO_URL" -o $ISO_WORK/mint.iso
          printf '%s  %s\n' "$ISO_SHA" $ISO_WORK/mint.iso | sha256sum -c -
          xorriso -indev $ISO_WORK/mint.iso -pvd_info
      - name: Remaster Mint live filesystem without OSTree or bootc
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p $ISO_WORK/mint-iso $ISO_WORK/mint-root
          xorriso -osirrox on -indev $ISO_WORK/mint.iso -extract / $ISO_WORK/mint-iso
          sudo chmod -R u+w $ISO_WORK/mint-iso
          squash=$(find $ISO_WORK/mint-iso/casper -maxdepth 1 -name 'filesystem.squashfs' -print -quit)
          test -n "$squash"
          sudo unsquashfs -d $ISO_WORK/mint-root "$squash"
          # Install Hearth's compiled executable and a normal desktop launcher.
          sudo install -Dm755 $ISO_WORK/hearth-built $ISO_WORK/mint-root/usr/local/bin/hearth
          sudo install -d $ISO_WORK/mint-root/usr/share/applications
          cat > $ISO_WORK/hearth.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=Hearth OS
          Comment=Hearth gaming interface on Linux Mint
          Exec=/usr/local/bin/hearth --windowed
          Terminal=false
          Type=Application
          Categories=Game;
          DESKTOP
          sudo install -Dm644 $ISO_WORK/hearth.desktop $ISO_WORK/mint-root/usr/share/applications/hearth.desktop
          printf '%s\n' 'Linux Mint writable Hearth test build' | sudo tee $ISO_WORK/mint-root/etc/hearth-mint-test
          # This is the original Mint package-managed filesystem, not an OSTree deployment.
          test -x $ISO_WORK/mint-root/usr/bin/apt
          test -x $ISO_WORK/mint-root/usr/bin/dpkg
          test ! -e $ISO_WORK/mint-root/ostree
          sudo rm -f "$squash"
          sudo mksquashfs $ISO_WORK/mint-root "$squash" -comp xz -noappend
          if [ -f $ISO_WORK/mint-iso/casper/filesystem.size ]; then
            sudo du -sx --block-size=1 $ISO_WORK/mint-root | awk '{print $1}' | sudo tee $ISO_WORK/mint-iso/casper/filesystem.size
          fi
      - name: Repack using original Mint boot configuration
        shell: bash
        run: |
          set -euxo pipefail
          # Preserve the original Mint ISO tree, including its embedded El Torito
          # boot image and isohybrid EFI/BIOS boot metadata. Mapping a fresh '/'
          # discards hidden boot-image references and breaks -boot_image replay.
          xorriso -indev "$ISO_WORK/mint.iso" -outdev "$GITHUB_WORKSPACE/hearth-linux-mint-writable-test-amd64.iso" \
            -map "$ISO_WORK/mint-iso/casper/filesystem.squashfs" /casper/filesystem.squashfs \
            -map "$ISO_WORK/mint-iso/casper/filesystem.size" /casper/filesystem.size \
            -boot_image any replay -commit -end
          test -s hearth-linux-mint-writable-test-amd64.iso
          sha256sum hearth-linux-mint-writable-test-amd64.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-linux-mint-writable-test-iso
          path: |
            hearth-linux-mint-writable-test-amd64.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 14
