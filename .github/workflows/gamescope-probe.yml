# Starts gamescope off-screen (headless backend, software Vulkan) inside the published Hearth OS image and shows its
# output on the run page: what the offline USB's boot test needs to run Game Mode in a virtual PC with no 3D.
name: gamescope probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
      - name: gamescope --backend headless in the image
        run: |
          cat > /tmp/p.sh <<'SH'
          useradd -m t 2>/dev/null
          mkdir -p /tmp/r && chown t /tmp/r && chmod 700 /tmp/r
          echo "== caps: $(getcap /usr/sbin/gamescope /usr/bin/gamescope 2>&1 | tr '\n' ' ')"
          echo "== gamescope"; gamescope --version 2>&1 | head -3
          for args in "--backend headless -W 1280 -H 800" "--backend headless -W 1280 -H 800 --prefer-vk-device 10005:0"; do
            echo "== gamescope $args"
            runuser -u t -- env XDG_RUNTIME_DIR=/tmp/r timeout 25 gamescope $args -- sh -c 'echo DISPLAY=$DISPLAY; sleep 8; echo inner-done' 2>&1 | grep -v '^$' | tail -n 18
            echo "exit: $?"
          done
          SH
          sudo podman pull -q ghcr.io/dragongamer9/hearth-os:latest >/dev/null
          sudo podman run --rm --privileged -v /tmp/p.sh:/p.sh:ro ghcr.io/dragongamer9/hearth-os:latest bash /p.sh 2>&1 | grep -v "^Copying\|signatures\|Trying to pull" | tee out.txt
          echo "::notice title=probe::$(tail -n 50 out.txt | cut -c1-160 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
