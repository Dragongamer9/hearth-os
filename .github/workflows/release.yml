# Builds Nimbus on Windows.
# - Every push and pull request: build (catches compile errors).
# - Push to main with a new <Version> in Nimbus.Host.csproj: also publish GitHub Release vX.Y.Z
#   (the tag is created here). Pushing a tag vX.Y.Z by hand does the same.
#   Nimbus checks the latest release and offers it in Settings › Updates.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = ([xml](Get-Content host/Nimbus.Host/Nimbus.Host.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          if (-not $v) { throw "No <Version> in Nimbus.Host.csproj" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version: $v" 

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish host/Nimbus.Host/Nimbus.Host.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -p:Version=${{ steps.ver.outputs.version }}
          -o out -nologo

      - name: Check the package
        shell: pwsh
        run: |
          foreach ($f in 'out/Nimbus.exe', 'out/wwwroot/index.html') {
            if (-not (Test-Path $f)) { throw "Missing $f in the published output" }
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Nimbus-win-x64.zip
          (Get-FileHash Nimbus-win-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii -NoNewline Nimbus-win-x64.zip.sha256

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Nimbus-win-x64-${{ steps.ver.outputs.version }}
          path: Nimbus-win-x64.zip

      - name: Publish the release (new versions only)
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists; nothing to publish."; exit 0 }
          $notes = git log -1 --pretty=%B
          gh release create $tag Nimbus-win-x64.zip Nimbus-win-x64.zip.sha256 `
            --target "${{ github.sha }}" --title "Nimbus ${{ steps.ver.outputs.version }}" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
