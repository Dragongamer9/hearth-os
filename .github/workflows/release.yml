# Builds Nimbus for Windows and Linux.
# - Every push and pull request: build both (catches compile errors) and run the Linux host's tests.
# - Push to main with a new <Version> in Nimbus.Host.csproj: also publish GitHub Release vX.Y.Z (versions are 0.0.N)
#   (the tag is created here) with both builds. Pushing a tag vX.Y.Z by hand does the same.
#   Nimbus checks the latest release and offers it in Settings › Updates.
# - Push to linux-host (the Linux work in progress): also publish a pre-release vX.Y.Z-linux.N with the
#   AppImage. Pre-releases are never offered as updates (Nimbus only looks at the latest full release).
# The version lives in one place, hosts/windows/Nimbus.Host/Nimbus.Host.csproj; the Linux build takes it from there.
name: Build and release

on:
  push:
    branches: [main, linux-host]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"
          else v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1); fi
          [ -n "$v" ] || { echo "No <Version> in Nimbus.Host.csproj"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish hosts/windows/Nimbus.Host/Nimbus.Host.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -p:Version=${{ needs.version.outputs.version }}
          -o out -nologo

      - name: Check the package
        shell: pwsh
        run: |
          foreach ($f in 'out/Nimbus.exe', 'out/wwwroot/index.html') {
            if (-not (Test-Path $f)) { throw "Missing $f in the published output" }
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Nimbus-win-x64.zip
          (Get-FileHash Nimbus-win-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii -NoNewline Nimbus-win-x64.zip.sha256

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Nimbus-win-x64.zip
            Nimbus-win-x64.zip.sha256

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Check the session scripts and Desktop Mode files
        run: |
          shellcheck -S warning session/nimbus-session session/nimbus-mode session/nimbus-watchdog session/install-session.sh desktop/labwc/autostart desktop/open.sh
          python3 -c "import xml.dom.minidom as m; [m.parse(f) for f in ['desktop/labwc/rc.xml', 'desktop/labwc/menu.xml']]"
          sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          for f in desktop/shell/*.qml; do /usr/lib/qt6/bin/qmlformat "$f" >/dev/null || { echo "QML syntax error in $f"; exit 1; }; done

      - name: Build the AppImage
        run: |
          # Builds from linux-host are previews: 0.4.0-linux.<run>, the same number as their pre-release tag,
          # so the updater can tell them apart.
          v="${{ needs.version.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/linux-host" ] && [ "${{ github.event_name }}" = "push" ]; then v="$v-linux.${{ github.run_number }}"; fi
          npm version "$v" --no-git-tag-version --allow-same-version
          npm run dist
          cd dist
          f=Nimbus-linux-x86_64.AppImage
          test -f "$f" || { echo "Missing $f"; ls; exit 1; }
          sha256sum "$f" | cut -d' ' -f1 | tr -d '\n' > "$f.sha256"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            hosts/linux/dist/Nimbus-linux-x86_64.AppImage
            hosts/linux/dist/Nimbus-linux-x86_64.AppImage.sha256

  release:
    needs: [version, windows, linux]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Publish the release (new versions only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; nothing to publish."; exit 0; fi
          notes="$(git log -1 --pretty=%B)"
          # --latest=false: GitHub's "latest" stays on the v0.5.1 bridge (below) so copies from before the
          # renumbering, which only look at "latest", can still update. Current copies look at every release.
          gh release create "$tag" builds/* --target "${{ github.sha }}" --latest=false \
            --title "Nimbus $v (Ember for Windows, Hearth for Linux)" --notes "$notes"

          # One time, at the switch to 0.0.x numbering: bridge releases with old-style tags that old copies see as
          # newer than what they have. They carry this build; after it, the new updaters ignore v0.3-v0.5 tags.
          bridge_notes="Carries Nimbus $v to copies from before the switch to 0.0.x version numbers. Download Nimbus $v instead."
          if ! gh release view v0.5.1 >/dev/null 2>&1; then
            gh release create v0.5.1 builds/Nimbus-win-x64.zip builds/Nimbus-win-x64.zip.sha256 --target "${{ github.sha }}" \
              --latest --title "Nimbus $v (update bridge for Windows 0.5.0 and earlier)" --notes "$bridge_notes"
          fi
          if ! gh release view v0.4.0-linux.100 >/dev/null 2>&1; then
            gh release create v0.4.0-linux.100 builds/Nimbus-linux-x86_64.AppImage builds/Nimbus-linux-x86_64.AppImage.sha256 \
              --target "${{ github.sha }}" --prerelease \
              --title "Nimbus $v for Linux (update bridge for 0.4.0 previews)" --notes "$bridge_notes"
          fi

  linux-preview:
    needs: [version, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/linux-host'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: builds

      - name: Publish a Linux pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}-linux.${{ github.run_number }}"
          notes="Linux preview from the linux-host branch ($(git rev-parse --short HEAD)).

          $(git log -1 --pretty=%B)

          Download Nimbus-linux-x86_64.AppImage, make it executable (chmod +x), and run it with --windowed to try it on your desktop."
          gh release create "$tag" builds/* --prerelease --target "${{ github.sha }}" \
            --title "Hearth ${{ needs.version.outputs.version }} for Linux (preview ${{ github.run_number }})" --notes "$notes"
