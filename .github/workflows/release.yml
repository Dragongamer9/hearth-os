# Builds Hearth OS's apps for Windows (Ember) and Linux (Hearth).
# - Every push and pull request: build both (catches compile errors) and run the Linux host's tests.
# - Push to main with a new <Version> in Nimbus.Host.csproj: also publish GitHub Release vX.Y.Z (versions are 0.0.N)
#   (the tag is created here) with both builds. Pushing a tag vX.Y.Z by hand does the same.
#   The app checks the latest release and offers it in Settings › Updates. Older releases are then hidden
#   (turned into drafts, nothing deleted), so only the newest one shows on GitHub.
# - Push to linux-host (the Linux work in progress): also publish a pre-release vX.Y.Z-linux.N with the
#   AppImage. Pre-releases are never offered as updates (the app only looks at the latest full release).
# The version lives in one place, hosts/windows/Nimbus.Host/Nimbus.Host.csproj; the Linux build takes it from there.
name: Build and release

on:
  push:
    branches: [main, linux-host]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"
          else v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1); fi
          [ -n "$v" ] || { echo "No <Version> in Nimbus.Host.csproj"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  # REQUIRED: Hearth's page must load and draw every screen without a script error (one error can leave the
  # app blank), or nothing is published.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Hearth's page
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node ui-check.js
      # Mantel on Windows (Ember): the taskbar, launcher, menus, clock panel, clipboard history, desktop icons,
      # Hearth Settings and Apps pages, driven through a stand-in for Ember's host.
      - name: Check Mantel's pages
        run: cd tools && node mantel-check.js

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish hosts/windows/Nimbus.Host/Nimbus.Host.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -p:Version=${{ needs.version.outputs.version }}
          -o out -nologo

      # Hearth Disks (hosts/hearth-disks), the disk manager: in Ember's package as hearth-disks.exe (its Start menu
      # entry: install-nimbus.ps1 and DisksShortcut.cs). Not fatal: without it Ember is still released.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-disks
      - name: Build Hearth Disks
        continue-on-error: true
        shell: pwsh
        working-directory: hosts/hearth-disks
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"', 'version = "${{ needs.version.outputs.version }}"' | Set-Content Cargo.toml
          cargo build --release
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning title=Hearth Disks::it didn't build, so Ember is packaged without it"; exit 1 }
          Copy-Item target/release/hearth-disks.exe ../../out/hearth-disks.exe

      - name: Check the package
        shell: pwsh
        run: |
          foreach ($f in 'out/Nimbus.exe', 'out/wwwroot/index.html') {
            if (-not (Test-Path $f)) { throw "Missing $f in the published output" }
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Nimbus-win-x64.zip
          (Get-FileHash Nimbus-win-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii -NoNewline Nimbus-win-x64.zip.sha256

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Nimbus-win-x64.zip
            Nimbus-win-x64.zip.sha256

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: |
          npm test
          python3 -m unittest discover -s test -p 'test_*.py'

      - name: Check the session scripts and Desktop Mode files
        run: |
          shellcheck -S warning session/nimbus-session session/nimbus-mode session/nimbus-watchdog session/install-session.sh desktop/labwc/autostart desktop/open.sh
          python3 -c "import xml.dom.minidom as m; [m.parse(f) for f in ['desktop/labwc/rc.xml', 'desktop/labwc/menu.xml']]"
          sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          for f in desktop/shell/*.qml; do /usr/lib/qt6/bin/qmlformat "$f" >/dev/null || { echo "::error file=hosts/linux/$f::QML syntax error"; /usr/lib/qt6/bin/qmlformat "$f" 2>&1 >/dev/null | head -20; exit 1; }; done
          python3 -m py_compile desktop/shell/hearth-pad desktop/shell/hearth-buttons desktop/shell/hearth-controller desktop/shell/hearth-power desktop/shell/hearth-browser desktop/shell/hearth-tasks desktop/shell/hearth-files ../../os/system_files/usr/libexec/nimbus/hearth-coop ../../os/system_files/usr/libexec/nimbus/hearth-seats ../../os/system_files/usr/libexec/nimbus/hearth-admin

  # The Rust app (what Hearth OS runs since 0.0.24): Hearth-linux-x86_64, one file. It updates itself from this
  # release file when it isn't part of the system (on Hearth OS it updates with the system).
  rust:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hosts/hearth-core
            hosts/hearth-rs
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
          (cd hosts/hearth-core && cargo test)
          cd hosts/hearth-rs
          sed -i "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml
          cargo build --release
          cp target/release/hearth ../../Hearth-linux-x86_64
          cd ../..
          sha256sum Hearth-linux-x86_64 | cut -d' ' -f1 | tr -d '\n' > Hearth-linux-x86_64.sha256
      # The AppImage for other Linux systems, now the Rust app (it was the old Electron app). Same file name, so
      # the old app's updater moves those installs over; the new app then archives the old one.
      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          sudo apt-get install -y -qq file libfuse2t64 >/dev/null 2>&1 || sudo apt-get install -y -qq file >/dev/null
          npm i -g --no-audit --no-fund @tauri-apps/cli@2 >/dev/null
          cd hosts/hearth-rs
          tauri build --bundles appimage --config '{"bundle":{"active":true,"icon":["icons/icon.png"],"category":"Game","shortDescription":"Hearth: your game library with a controller"}}'
          f=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          test -f "$f" || { echo "::error::No AppImage was made"; ls -R target/release/bundle || true; exit 1; }
          cp "$f" ../../Nimbus-linux-x86_64.AppImage
          cd ../..
          chmod +x Nimbus-linux-x86_64.AppImage
          sha256sum Nimbus-linux-x86_64.AppImage | cut -d' ' -f1 | tr -d '\n' > Nimbus-linux-x86_64.AppImage.sha256
          ls -la Nimbus-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: rust
          path: |
            Hearth-linux-x86_64
            Hearth-linux-x86_64.sha256
            Nimbus-linux-x86_64.AppImage
            Nimbus-linux-x86_64.AppImage.sha256

  release:
    needs: [version, windows, linux, rust, ui]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Publish the release (new versions only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A hidden draft with this number on another commit is from earlier numbering (0.3.0 existed on
            # Oct 16 before the versions were reset): renamed out of the way (nothing deleted) and the tag moved here.
            draft=$(gh release view "$tag" --json isDraft -q .isDraft)
            tagsha=$(gh api "repos/${{ github.repository }}/git/refs/tags/$tag" -q .object.sha 2>/dev/null || true)
            if [ "$draft" = true ] && [ -n "$tagsha" ] && [ "$tagsha" != "${{ github.sha }}" ]; then
              old="$tag-old-$(gh release view "$tag" --json createdAt -q '.createdAt[0:10]')"
              echo "::notice title=old release::An old hidden draft had $tag; renamed to $old"
              gh release edit "$tag" --tag "$old" --title "(old numbering) $old"
              gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="${{ github.sha }}" -F force=true >/dev/null
            else
              echo "Release $tag already exists; nothing to publish."; exit 0
            fi
          fi
          notes="$(git log -1 --pretty=%B)"
          gh release create "$tag" builds/* --target "${{ github.sha }}" --latest \
            --title "Hearth OS $v (Hearth for Linux, Ember for Windows)" --notes "$notes"
          # Only the newest release stays public: older ones become drafts (hidden, nothing deleted; see
          # tidy-releases.yml). Current copies only look for newer releases, so they aren't affected.
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            -q ".[] | select(.draft == false and .tag_name != \"$tag\") | .id" |
            while read -r id; do gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=true >/dev/null; done
