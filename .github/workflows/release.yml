# Builds Nimbus for Windows and Linux.
# - Every push and pull request: build both (catches compile errors) and run the Linux host's tests.
# - Push to main with a new <Version> in Nimbus.Host.csproj: also publish GitHub Release vX.Y.Z
#   (the tag is created here) with both builds. Pushing a tag vX.Y.Z by hand does the same.
#   Nimbus checks the latest release and offers it in Settings › Updates.
# The version lives in one place, hosts/windows/Nimbus.Host/Nimbus.Host.csproj; the Linux build takes it from there.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${{ github.ref_name }}"; v="${v#v}"
          else v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1); fi
          [ -n "$v" ] || { echo "No <Version> in Nimbus.Host.csproj"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish hosts/windows/Nimbus.Host/Nimbus.Host.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -p:Version=${{ needs.version.outputs.version }}
          -o out -nologo

      - name: Check the package
        shell: pwsh
        run: |
          foreach ($f in 'out/Nimbus.exe', 'out/wwwroot/index.html') {
            if (-not (Test-Path $f)) { throw "Missing $f in the published output" }
          }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath Nimbus-win-x64.zip
          (Get-FileHash Nimbus-win-x64.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii -NoNewline Nimbus-win-x64.zip.sha256

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Nimbus-win-x64.zip
            Nimbus-win-x64.zip.sha256

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosts/linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build the AppImage
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist
          cd dist
          f=Nimbus-linux-x86_64.AppImage
          test -f "$f" || { echo "Missing $f"; ls; exit 1; }
          sha256sum "$f" | cut -d' ' -f1 | tr -d '\n' > "$f.sha256"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            hosts/linux/dist/Nimbus-linux-x86_64.AppImage
            hosts/linux/dist/Nimbus-linux-x86_64.AppImage.sha256

  release:
    needs: [version, windows, linux]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Publish the release (new versions only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; nothing to publish."; exit 0; fi
          notes="$(git log -1 --pretty=%B)"
          gh release create "$tag" builds/* --target "${{ github.sha }}" \
            --title "Nimbus ${{ needs.version.outputs.version }}" --notes "$notes"
