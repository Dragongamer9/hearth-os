# Builds the Hearth Recovery ISO (os/recovery): a USB stick that repairs an installed Hearth OS, made from Hearth OS
# on Debian (1.12). GRUB on it starts the recovery screen by itself after 3 seconds (no keyboard needed). Manual
# only (Actions › Hearth Recovery ISO › Run workflow). Before anything is uploaded the ISO is started in a virtual
# PC through its own boot menu with Secure Boot on, and the recovery screen has to come up (screenshots on the run). The ISO is kept as a download on the run for 14 days and, like the live and installer ISOs, uploaded
# to Hearth's Cloudflare R2 bucket under a fixed name (what the website's Recovery USB link points at):
#   https://pub-f59beb6fa21c421ca4435ee7f42b3de4.r2.dev/hearth-recovery.iso, with a .sha256, and latest.json.
#   Secrets (Settings › Secrets and variables › Actions): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
name: Hearth Recovery ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Which Hearth OS on Debian build it is made from (hearth-peppermint)'
        type: choice
        options: [testing]
        default: testing
      upload:
        description: 'Upload the ISO to the download site (Cloudflare R2, as hearth-recovery.iso; needs the R2_* secrets)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  recovery-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      IMAGE: ghcr.io/dragongamer9/hearth-peppermint
      TAG: ${{ inputs.tag || 'testing' }}
      HAVE_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Build the recovery system
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=recovery system::$msg"' ERR
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          digest=$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://$IMAGE:$TAG")
          echo "::notice title=Recovery USB::made from $IMAGE:$TAG ($digest)"
          # The build's log goes to a file and its end (with build.sh's own ::error lines) is printed when it fails:
          # through the step's tee above, the last lines were lost when the build stopped.
          trap - ERR
          if ! sudo podman build --pull=newer --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE="$IMAGE@$digest" -t localhost/hearth-recovery:latest -f os/recovery/Containerfile os > /tmp/build.log 2>&1; then
            grep -a '^::error' /tmp/build.log | tail -5 || true
            # The whole log on a branch (ci/recovery-build-log), where it can be read when a build fails.
            mkdir -p /tmp/bl && cp /tmp/build.log /tmp/bl/build.log && (cd /tmp/bl && git init -q && git checkout -q -b bl && \
              git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A && \
              git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Recovery build log ($GITHUB_RUN_ID)" && \
              git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/recovery-build-log) || true
            echo "::error title=recovery system (end of the build)::$(grep -av '^::' /tmp/build.log | tail -40 | cut -c1-200 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -5 /tmp/build.log
      - name: Make the ISO (Titanoboa)
        id: iso
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=iso::$msg"' ERR
          git clone -q https://github.com/ublue-os/titanoboa.git /tmp/titanoboa
          git -C /tmp/titanoboa checkout -q 5c457c3d0518bd17e754be0fd98a60d29d26abb4
          out=/mnt/recovery-out
          sudo mkdir -p "$out"
          iso=$(cd /tmp/titanoboa && sudo TITANOBOA_OUTPUT_DIR="$out" ./main.sh localhost/hearth-recovery:latest)
          sudo chown -R "$(id -u):$(id -g)" "$out"
          f="hearth-recovery.iso"
          mv "$iso" "$out/$f"
          (cd "$out" && sha256sum "$f" | tee "$f.sha256")
          echo "::notice title=Hearth Recovery ISO::$(ls -l "$out/$f" | awk '{print $5}') bytes, sha256 $(cut -d' ' -f1 "$out/$f.sha256")"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          v=$(sudo podman run --rm localhost/hearth-recovery:latest cat /usr/share/nimbus/version 2>/dev/null || echo latest)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Keep the ISO as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: hearth-recovery-iso
          path: ${{ steps.iso.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # The stick started as a PC starts it: firmware (UEFI, Secure Boot on with Microsoft's keys) → Debian's signed
      # shim and GRUB on the stick → its kernel and live boot → the recovery screen. A small disk labelled HEARTH-CI
      # turns on the serial-console report (os/recovery/src/build.sh), so the stick's own boot menu is what's tested.
      - name: Start the ISO in a virtual PC (Secure Boot on)
        id: boot
        timeout-minutes: 30
        env:
          ISO: ${{ steps.iso.outputs.dir }}/hearth-recovery.iso
        run: bash tools/recovery-boot-test.sh "$ISO" recovery-boot
      - name: Publish the boot test's screenshots and serial log (ci/recovery-boot)
        if: always() && steps.boot.outcome != 'skipped' && steps.boot.outcome != ''
        run: |
          [ -d recovery-boot ] || exit 0
          mkdir -p /tmp/rb-pub && cp -r recovery-boot/. /tmp/rb-pub/ && cd /tmp/rb-pub && git init -q && git checkout -q -b rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Recovery boot test ($GITHUB_RUN_ID)" || exit 0
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/recovery-boot || true

      - name: Upload to the download site (Cloudflare R2)
        if: env.HAVE_R2 == 'true' && inputs.upload && steps.boot.outcome == 'success'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          V: ${{ steps.iso.outputs.version }}
          DIR: ${{ steps.iso.outputs.dir }}
        run: tools/r2-upload.sh "$DIR/hearth-recovery.iso" hearth-recovery.iso "$V"
