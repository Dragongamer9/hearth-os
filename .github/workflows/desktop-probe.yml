# Temporary feasibility probe for Hearth COSMIC / Hearth Deepin (docs/COSMIC.md, docs/DEEPIN.md): which packages
# each base has, whether they install, and how much they add. Results are ::notice:: annotations. Removed again once
# the answer is in.
name: Desktop probe (COSMIC, Deepin)

on:
  workflow_dispatch:
  push:
    branches: ['feature/desktop-cosmic-deepin']
    paths: ['.github/workflows/desktop-probe.yml']

jobs:
  anatase:
    runs-on: ubuntu-latest
    steps:
      - name: Anatase (Fedora 45) packages
        shell: bash
        run: |
          cat >/tmp/p.sh <<'EOF'
          set +e
          rpm -qa --qf '%{NAME}\n' | sort >/tmp/before
          X="cosmic-files cosmic-files-applet cosmic-term cosmic-greeter cosmic-initial-setup cosmic-store cosmic-edit cosmic-player cosmic-wallpapers cosmic-osk cosmic-monitor"
          ex=""; for x in $X; do ex="$ex --exclude=$x"; done
          echo "## with excludes"
          dnf5 -y -q install --setopt=install_weak_deps=False $ex cosmic-session cosmic-comp cosmic-panel cosmic-settings \
            cosmic-settings-daemon cosmic-launcher cosmic-applets cosmic-bg cosmic-osd cosmic-notifications \
            cosmic-workspaces cosmic-app-library cosmic-randr cosmic-idle cosmic-icon-theme xdg-desktop-portal-cosmic >/tmp/i.log 2>&1
          echo "rc=$?"; grep -iE 'problem|nothing provides|requires|conflict' /tmp/i.log | head -12
          echo "## requires of cosmic-session"
          dnf5 -q repoquery --requires cosmic-session 2>/dev/null | tr '\n' ' '; echo
          echo "## who requires the excluded"
          for x in $X; do printf '%s <- %s\n' "$x" "$(dnf5 -q repoquery --whatrequires $x --qf '%{name}' 2>/dev/null | sort -u | tr '\n' ' ')"; done
          echo "## without excludes, new packages by size (MB)"
          dnf5 -y -q install --setopt=install_weak_deps=False cosmic-session cosmic-comp cosmic-panel cosmic-settings \
            cosmic-settings-daemon cosmic-launcher cosmic-applets cosmic-bg cosmic-osd cosmic-notifications \
            cosmic-workspaces cosmic-app-library cosmic-randr cosmic-idle cosmic-icon-theme xdg-desktop-portal-cosmic >/dev/null 2>&1
          rpm -qa --qf '%{NAME}\n' | sort >/tmp/after
          for n in $(comm -13 /tmp/before /tmp/after); do rpm -q --qf '%{SIZE} %{NAME}\n' $n; done | sort -rn | awk '{printf "%d %s\n", $1/1048576, $2}' | head -45
          ls /usr/lib/systemd/system | grep -iE 'cosmic|greet'
          ls /etc/xdg/autostart /usr/share/cosmic | tr '\n' ' '
          EOF
          img=i.anatase.org/anatase:stable
          docker pull -q "$img" >/dev/null 2>&1 || img=registry.fedoraproject.org/fedora:45
          echo "image $img"
          docker run --rm -v /tmp/p.sh:/p.sh:ro "$img" bash /p.sh 2>&1 | tee /tmp/out.txt
          split -l 25 /tmp/out.txt /tmp/chunk.
          for c in /tmp/chunk.*; do echo "::notice title=anatase $(basename $c)::$(sed 's/%/%25/g' $c | tr '\n' '|' )"; done

