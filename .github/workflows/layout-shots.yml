# Draws every experimental and keyboard & mouse layout (Home and Library) at three screen sizes with 0, 1, ~25
# and 500 games, and checks them (tools/layout-audit.js): script errors, controls off the screen, clipped or
# overlapping text, low contrast, D-pad reachability. Screenshots and the report go to the branch
# ci/layout-shots-<branch>, so they can be looked at without downloading anything.
name: Layout screenshots

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only layouts whose id contains this'
        required: false
        default: ''
  push:
    branches-ignore: ['ci/**']
    paths: ['ui/index.html', 'tools/layout-audit.js', '.github/workflows/layout-shots.yml']

permissions:
  contents: write    # the screenshots branch

# One run per branch at a time: an older, slower run finishing last put its screenshots over the newer ones.
concurrency:
  group: layout-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Draw and check the layouts
        id: audit
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          set +e; node layout-audit.js "${{ github.event.inputs.filter }}" | tee ../audit.log; rc=${PIPESTATUS[0]}
          echo "::notice title=Layout audit::$(head -1 ../audit.log) — $(sed -n 2p ../audit.log | cut -c1-900)"
          exit $rc
      - name: Publish screenshots to a branch
        if: always()
        run: |
          to="ci/layout-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          cd shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Layout screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"
          echo "::notice title=Screenshots::branch $to"
