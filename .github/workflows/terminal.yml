# Hearth Terminal (hosts/hearth-terminal): tests the shell's pseudo-terminal on Linux (a Unix pty) and Windows
# (ConPTY), builds the app for both, and runs it once on each: it opens, runs a command given with -e, and on
# Linux takes screenshots of the window (in the run's hearth-terminal-linux artifact).
# "vendor" (when started by hand) downloads the pinned xterm.js files and font (vendor.sh) and commits them.
name: Hearth Terminal

on:
  push:
    branches: [main, linux-host, apps-terminal]
    paths: ['hosts/hearth-terminal/**', '.github/workflows/terminal.yml']
  pull_request:
    paths: ['hosts/hearth-terminal/**', '.github/workflows/terminal.yml']
  workflow_dispatch:
    inputs:
      vendor:
        description: Download the pinned xterm.js files and font into ui/vendor and commit them
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  vendor:
    if: github.event_name == 'workflow_dispatch' && inputs.vendor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit
        run: |
          sh hosts/hearth-terminal/vendor.sh
          git config user.name "Dragongamer9"; git config user.email "Dragongamer9@users.noreply.github.com"
          git add hosts/hearth-terminal/ui/vendor
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git commit -qm "Hearth Terminal: vendored xterm.js and JetBrains Mono (vendor.sh)"
          git push -q origin "HEAD:refs/heads/${{ github.ref_name }}"

  linux:
    needs: vendor
    if: ${{ !cancelled() && (needs.vendor.result == 'success' || needs.vendor.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hosts/hearth-terminal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-terminal
      - name: The page's files are there
        run: |
          for f in xterm.js xterm.css addon-fit.js addon-web-links.js addon-unicode11.js addon-search.js addon-webgl.js addon-canvas.js jetbrains-mono-latin-400-normal.woff2; do
            test -s "ui/vendor/$f" || { echo "::error title=vendor::ui/vendor/$f is missing: run this workflow by hand with 'vendor' ticked"; exit 1; }
          done
          node --check ui/app.js
      - name: WebKit and GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            xvfb imagemagick x11-utils dbus-x11 xdotool >/dev/null
      - name: Test (a real shell through the pty)
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log || { echo "::error title=tests::$(grep -E '^(error|---- |thread .* panicked)' -A10 test.log | head -80 | tr '\n' '|' | cut -c1-3900)"; exit 1; }
          echo "::notice title=Linux tests::$(grep -E '^test result' test.log | tr '\n' ' ')"
      - name: Build
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log || { echo "::error title=build::$(grep -E '^error' -A8 build.log | head -60 | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          echo "::notice title=Size::$(du -h target/release/hearth-terminal | cut -f1)"
          ./target/release/hearth-terminal --help
      - name: Run it
        run: |
          mkdir -p shots
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 NO_AT_BRIDGE=1
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # -e: the page starts the command in its first tab (so this checks the page and the pty together).
          rm -f /tmp/ran.txt
          dbus-run-session -- ./target/release/hearth-terminal --cwd /tmp -e sh -c 'pwd > /tmp/ran.txt; sleep 30' > run-e.log 2>&1 &
          for i in $(seq 30); do [ -s /tmp/ran.txt ] && break; sleep 1; done
          test "$(cat /tmp/ran.txt 2>/dev/null)" = /tmp || { echo "::error title=-e::the command didn't run in /tmp: $(cat /tmp/ran.txt 2>&1) $(tail -c 1500 run-e.log | tr '\n' '|')"; exit 1; }
          echo "::notice title=-e::ran the command in /tmp"
          pkill -f 'target/release/hearth-terminal' || true; sleep 1
          # The window with a shell: type, open a tab, the menu, settings, quick keys, a split.
          SHELL=/bin/bash dbus-run-session -- ./target/release/hearth-terminal > run.log 2>&1 &
          sleep 8
          w=$(xdotool search --name 'Terminal' | tail -1); xdotool windowactivate --sync "$w" 2>/dev/null || true
          shot() { import -window root "shots/$1.png" || true; }
          shot start
          xdotool type --delay 40 'printf "\e[38;2;255;138;61mHearth\e[0m Terminal  \e[1;32mgreen\e[0m \e[34mblue\e[0m ✓\n"; ls --color=always /'; xdotool key Return; sleep 2; shot typed
          xdotool key ctrl+shift+t; sleep 3; xdotool type 'echo second tab'; xdotool key Return; sleep 1; shot second-tab
          xdotool key ctrl+shift+d; sleep 3; shot split
          xdotool key ctrl+shift+w; sleep 1; xdotool key ctrl+Tab; sleep 1
          xdotool mousemove 500 400 click 3; sleep 1; shot menu
          xdotool key Escape; sleep 1
          xdotool key ctrl+comma; sleep 2; shot settings
          xdotool key Escape; sleep 1
          xdotool key ctrl+shift+f; sleep 1; xdotool type 'tab'; xdotool key Return; sleep 1; shot find
          xdotool key Escape; sleep 1
          xdotool key ctrl+plus ctrl+plus; sleep 1; shot zoom
          xdotool key ctrl+0
          xwininfo -root -tree | grep -i terminal | head -3 | sed 's/^/::notice title=Window::/' || true
          pkill -f 'target/release/hearth-terminal' || true
          echo "::notice title=App output::$(tail -c 1200 run.log | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-terminal-linux
          path: |
            hosts/hearth-terminal/target/release/hearth-terminal
            hosts/hearth-terminal/shots

  windows:
    needs: vendor
    if: ${{ !cancelled() && (needs.vendor.result == 'success' || needs.vendor.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hosts/hearth-terminal
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-terminal
      - name: Test (a real shell through ConPTY)
        run: |
          cargo test 2>&1 | Tee-Object test.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path test.log -Pattern '^(error|---- |thread .* panicked)' -Context 0,10 | Select-Object -First 8 | Out-String) -replace "`r?`n", '|'
            Write-Output "::error title=tests::$($msg.Substring(0, [Math]::Min(3900, $msg.Length)))"
            exit 1
          }
          Write-Output "::notice title=Windows tests::$((Select-String -Path test.log -Pattern '^test result').Line -join ' ')"
      - name: Build
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "::notice title=Size::$([Math]::Round((Get-Item target/release/hearth-terminal.exe).Length / 1MB, 1)) MB"
      - name: Run it
        run: |
          # -e: the page starts the command (so this checks WebView2, the page and ConPTY together).
          $out = Join-Path $env:RUNNER_TEMP 'ran.txt'
          $bat = Join-Path $env:RUNNER_TEMP 'ran.cmd'
          Set-Content -Encoding ascii $bat "@cd > `"$out`"`r`n@ping -n 30 127.0.0.1 > nul"
          $p = Start-Process -PassThru target/release/hearth-terminal.exe -ArgumentList '--cwd', $env:RUNNER_TEMP, '-e', $bat
          for ($i = 0; $i -lt 40 -and -not (Test-Path $out); $i++) { Start-Sleep 1 }
          New-Item -ItemType Directory -Force shots | Out-Null
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($img).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save((Join-Path (Get-Location) 'shots/windows.png'))
          } catch { Write-Output "no screenshot: $_" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { Write-Output "::error title=-e::the command given with -e didn't run"; exit 1 }
          $where = (Get-Content $out -Raw).Trim()
          if ($where -ne $env:RUNNER_TEMP.TrimEnd('\')) { Write-Output "::error title=-e::ran in $where, not $env:RUNNER_TEMP"; exit 1 }
          Write-Output "::notice title=-e::ran the command in $where"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-terminal-windows
          path: |
            hosts/hearth-terminal/target/release/hearth-terminal.exe
            hosts/hearth-terminal/shots
