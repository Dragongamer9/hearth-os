# Builds Hearth on Peppermint OS (Beta Experimental): Debian 13 "trixie", Peppermint's base, made into a bootc
# image with the Hearth session, from os-bases/peppermint (see docs/BASE-PEPPERMINT.md). Published as
# ghcr.io/dragongamer9/hearth-peppermint:testing (never :latest: this isn't the main Hearth).
# Failures show up as annotations on the run (the end of the failing step's output), so the full log isn't needed.
name: Hearth OS (Peppermint base)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the image (off: build and check it only, e.g. to test a branch before merging)'
        type: boolean
        default: true
  push:
    branches: [linux-host, main]
    paths: ['.github/scripts/**', 'os-bases/peppermint/**', 'os/system_files/**', 'hosts/hearth-core/**', 'hosts/hearth-rs/**', 'hosts/hearthfetch/**', 'hosts/linux/**', 'hosts/hearth-browser/**', 'hosts/electron/**', 'ui/**', '.github/workflows/base-peppermint.yml', 'hosts/hearth-terminal/**', 'hosts/hearth-disks/**', 'branding/icons/**', 'hosts/hearth-tools/**', 'hosts/hearth-gaming/**', 'hosts/hearth-photos/**', 'hosts/hearth-documents/**', 'hosts/hearth-text/**', 'hosts/hearth-contacts/**', 'hosts/hearth-maps/**', 'hosts/hearth-time/**', 'hosts/hearth-player/**', 'hosts/hearth-calculator/**', 'hosts/hearth-office/**', 'hosts/hearth-paint/**', 'hosts/hearth-emoji/**', 'hosts/hearth-fonts/**', 'hosts/hearth-gamma/**', 'hosts/hearth-media/**', 'hosts/hearth-recorder/**', 'hosts/hearth-camera/**', 'hosts/hearth-share/**']

env:
  IMAGE: ghcr.io/dragongamer9/hearth-peppermint

concurrency:
  group: hearth-peppermint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust app (hosts/hearth-rs), built inside Debian trixie itself rather than on the Ubuntu runner: then it
  # links exactly the WebKitGTK/GTK/libsoup the image has, and never needs a newer glibc than trixie's 2.41
  # (ubuntu-latest moves to newer Ubuntu releases, whose glibc trixie doesn't have).
  app:
    name: Build the Hearth app (Rust, on Debian trixie)
    runs-on: ubuntu-latest
    container: docker.io/library/debian:trixie
    outputs:
      version: ${{ steps.ver.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build tools
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app (tools)::$msg"' ERR
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates build-essential pkg-config file zstd \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libxdo-dev >/dev/null
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(grep -oP '(?<=<Version>)[^<]+' hosts/windows/Nimbus.Host/Nimbus.Host.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-rs
          key: debian-trixie
      - name: Build
        working-directory: hosts/hearth-rs
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=app::$msg"' ERR
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release
          mkdir -p /tmp/app && cp target/release/hearth /tmp/app/hearth
          # ---- hearthfetch (hosts/hearthfetch): /usr/bin/hearthfetch, Hearth OS's system summary for the terminal.
          (cd ../hearthfetch && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release && cp target/release/hearthfetch /tmp/app/hearthfetch)
          # ---- end hearthfetch
          # Hearth Terminal (hosts/hearth-terminal), built the same way and carried along in hearth-app.tar; build.sh
          # installs it as /usr/bin/hearth-terminal. If it doesn't build, the image keeps its other terminals.
          if (cd ../hearth-terminal && cargo build --release); then cp ../hearth-terminal/target/release/hearth-terminal /tmp/app/hearth-terminal
          else echo "::warning title=Hearth Terminal::didn't build; this image goes without it"; fi
          echo "--- libraries the app links (all come from Debian trixie)"
          objdump -p target/release/hearth | grep NEEDED
          echo "--- newest glibc symbol it needs (trixie has 2.41)"
          objdump -T target/release/hearth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # Hearth Disks (hosts/hearth-disks), the disk manager: built the same way, and put beside the app in
      # hearth-app.tar (build.sh installs it as /usr/bin/hearth-disks). Not fatal: without it the image is still made.
      - name: Build Hearth Disks
        continue-on-error: true
        working-directory: hosts/hearth-disks
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Disks::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app && cp "$CARGO_TARGET_DIR/release/hearth-disks" /tmp/app/hearth-disks
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== Hearth Recorder, Camera and Share (hosts/hearth-recorder, hosts/hearth-camera, hosts/hearth-share; tested by
      # capture-apps.yml): built here in Debian trixie like the app and put beside it in hearth-app.tar (build.sh
      # installs them in /usr/bin). Not fatal: without one the image is still made, without that app.
      - name: Build Hearth Recorder, Camera and Share
        continue-on-error: true
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for c in hearth-recorder hearth-camera hearth-share; do
            if (cd hosts/$c && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$c" /tmp/app/$c
            else echo "::warning title=$c::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # gpu-screen-recorder, Recorder's best way to capture (graphics card capture and encoding, Game Mode, instant
      # replay): Debian 13 doesn't package it yet, so it's built from its release here, in trixie, and carried in
      # hearth-app.tar as gsr/ (build.sh installs it and gives gsr-kms-server its capability). Without it Recorder
      # uses wf-recorder and GStreamer.
      - name: Build gpu-screen-recorder for Hearth Recorder
        continue-on-error: true
        env:
          GSR_VERSION: '5.13.8'
        run: |
          set -o pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends meson ninja-build pkgconf libwayland-bin \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavfilter-dev libx11-dev libxcomposite-dev libxrandr-dev \
            libxfixes-dev libxdamage-dev libpulse-dev libva-dev libdrm-dev libwayland-dev libcap-dev libpipewire-0.3-dev libspa-0.2-dev \
            libdbus-1-dev libvulkan-dev libgl-dev libegl-dev libglvnd-dev >/dev/null
          mkdir -p /tmp/gsr-src && cd /tmp/gsr-src
          curl -fsSL --retry 3 -o gsr.tar.gz "https://dec05eba.com/snapshot/gpu-screen-recorder.git.${GSR_VERSION}.tar.gz"
          tar -xzf gsr.tar.gz
          src=$(dirname "$(find . -maxdepth 3 -name meson.build | sort | head -1)")
          cd "$src"
          meson setup build --buildtype=release >/tmp/gsr-meson.log 2>&1 || { tail -30 /tmp/gsr-meson.log; echo "::warning title=gpu-screen-recorder::meson setup failed"; exit 1; }
          ninja -C build >/tmp/gsr-build.log 2>&1 || { tail -30 /tmp/gsr-build.log; echo "::warning title=gpu-screen-recorder::didn't build"; exit 1; }
          mkdir -p /tmp/app/gsr
          for b in gpu-screen-recorder gsr-kms-server; do
            f=$(find build -type f -name "$b" -perm -u+x | head -1)
            [ -n "$f" ] && cp "$f" /tmp/app/gsr/ && strip /tmp/app/gsr/$b || true
          done
          ls -l /tmp/app/gsr
          /tmp/app/gsr/gpu-screen-recorder --version 2>&1 | head -1 || true
          echo "::notice title=gpu-screen-recorder::built ${GSR_VERSION} for the Peppermint image"
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== end of Hearth Recorder, Camera and Share
      # ---- Hearth Player and Hearth Calculator (hosts/hearth-player, hosts/hearth-calculator): built the same way and
      # put beside the app in hearth-app.tar (build.sh installs them in /usr/bin). Not fatal: without them the image is still made.
      - name: Build Hearth Player and Hearth Calculator
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          ok=0
          for app in hearth-player hearth-calculator; do
            (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release) \
              && cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app" \
              || { echo "::warning title=$app::it didn't build, so this image is made without it"; ok=1; }
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
          exit $ok
      # ---- end of Hearth Player and Hearth Calculator
      # ---- Hearth Time (hosts/hearth-time): Clock, Calendar, Notes and Weather, one program. Built the same way and
      # carried in hearth-app.tar as hearth-time/; build.sh installs it (the icons come with Hearth's icon set). Not
      # fatal: without it the image is still made.
      - name: Build Hearth Time (Clock, Calendar, Notes, Weather)
        continue-on-error: true
        working-directory: hosts/hearth-time
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Time::it didn't build, so this image is made without Clock, Calendar, Notes and Weather"; exit 1; }
          mkdir -p /tmp/app/hearth-time
          cp "$CARGO_TARGET_DIR/release/hearth-time" /tmp/app/hearth-time/hearth-time
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Time
      # ---- Hearth Contacts and Hearth Maps (hosts/hearth-contacts, hosts/hearth-maps): built the same way and put
      # beside the app in hearth-app.tar (their icons are in Hearth's icon set); build.sh installs them as
      # /usr/bin/hearth-contacts and /usr/bin/hearth-maps. Not fatal: an app that doesn't build is left out.
      - name: Build Hearth Contacts and Hearth Maps
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          # Contacts keeps CardDAV passwords in the Secret Service through libdbus.
          apt-get install -y -qq libdbus-1-dev >/dev/null
          mkdir -p /tmp/app
          for app in hearth-contacts hearth-maps; do
            sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" "hosts/$app/Cargo.toml"
            if (cd "hosts/$app" && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else echo "::warning title=$app::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Contacts and Hearth Maps
      # ---- Hearth Text (hosts/hearth-text), the text editor: built the same way and put beside the app in
      # hearth-app.tar (build.sh installs it as /usr/bin/hearth-text and makes it the default for text
      # files). Not fatal: without it the image is still made.
      - name: Build Hearth Text
        continue-on-error: true
        working-directory: hosts/hearth-text
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          test -s ui/vendor/VERSIONS || { echo "::warning title=Hearth Text::ui/vendor is missing (run the Hearth Text workflow with 'vendor'), so this image is made without it"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Text::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app && cp "$CARGO_TARGET_DIR/release/hearth-text" /tmp/app/hearth-text
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Text
      # ---- Hearth Photos and Hearth Documents (hosts/hearth-photos, hosts/hearth-documents): the picture viewer and
      # the PDF / e-book / comic reader, built the same way and put beside the app in hearth-app.tar (build.sh installs
      # them, with their menu entries and file types; their icons come with the Hearth icon set). Not fatal.
      - name: Build Hearth Photos and Hearth Documents
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for app in hearth-photos hearth-documents; do
            if (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else echo "::warning title=$app::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Photos and Hearth Documents
      # ---- Hearth's gaming apps (hosts/hearth-gaming): Controller Lab, Saves and Mods, built the same way and put beside
      # the app in hearth-app.tar (build.sh installs them in /usr/bin; their icons are in Hearth's icon set). Not fatal:
      # without them the image is still made.
      - name: Build Hearth's gaming apps (Controller Lab, Saves, Mods)
        continue-on-error: true
        working-directory: hosts/hearth-gaming
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth's gaming apps::they didn't build, so this image is made without them"; exit 1; }
          mkdir -p /tmp/app
          for a in hearth-controller-lab hearth-saves hearth-mods; do cp "$CARGO_TARGET_DIR/release/$a" /tmp/app/; done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth's gaming apps
      # ---- Hearth Tools (hosts/hearth-tools): Disk Usage, System Info, Logs, Network Tools, Passwords & Keys, Printers &
      # Scanner and Welcome & Tips in one program, put beside the app in hearth-app.tar (hearth-tools/) with its menu
      # entries; build.sh installs them (their icons come with Hearth's icon set, branding/icons). Not fatal: without it the image is still made.
      - name: Build Hearth Tools
        continue-on-error: true
        working-directory: hosts/hearth-tools
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          command -v python3 >/dev/null || { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 >/dev/null; } || true
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Tools::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app/hearth-tools
          cp "$CARGO_TARGET_DIR/release/hearth-tools" /tmp/app/hearth-tools/hearth-tools
          cp desktop/hearth-*.desktop /tmp/app/hearth-tools/
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end Hearth Tools
      # ---- Hearth Office (hosts/hearth-office): Write, Sheets and Slides (one program). Built the same way and carried
      # in hearth-app.tar as office/ with its install script (build.sh runs office/install.sh). Not fatal:
      # without it the image is still made.
      - name: Build Hearth Office
        continue-on-error: true
        working-directory: hosts/hearth-office
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          for f in xlsx.full.min.js hyperformula.full.min.js docx.iife.js pptxgen.bundle.js; do test -s "ui/vendor/$f" || { echo "::warning title=Hearth Office::ui/vendor/$f is missing (run office.yml with vendor ticked), so this image is made without it"; exit 1; }; done
          sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml
          cargo build --release || { echo "::warning title=Hearth Office::it didn't build, so this image is made without it"; exit 1; }
          mkdir -p /tmp/app/office
          cp "$CARGO_TARGET_DIR/release/hearth-office" linux/install.sh /tmp/app/office/
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Office
      # ==== Hearth Paint, the emoji picker, Hearth Fonts and hearth-gamma (hosts/hearth-paint, hearth-emoji, hearth-fonts,
      # hearth-gamma; apps-create.yml tests them): built the same way and put beside the app in hearth-app.tar (build.sh
      # installs them; their icons come with the Hearth icon set). Not fatal: an app that doesn't build is left out of this image.
      - name: Build Hearth Paint, Emoji, Fonts and hearth-gamma
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          for c in hearth-paint hearth-emoji hearth-fonts hearth-gamma; do
            sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" hosts/$c/Cargo.toml
            if (cd hosts/$c && cargo build --release); then cp "$CARGO_TARGET_DIR/release/$c" /tmp/app/$c
            else echo "::warning title=$c::it didn't build, so this image is made without it"; fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ==== end Hearth Paint, Emoji, Fonts and hearth-gamma
      # ---- Nearby Share and Hearth Connect (hosts/hearth-nearby, hosts/hearth-connect): built the same way and put
      # beside the app in hearth-app.tar (build.sh installs them). Not fatal: without them the image
      # is still made.
      - name: Build Nearby Share and Hearth Connect
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          for app in hearth-nearby hearth-connect; do
            if (cd "hosts/$app" && sed -i "s/^version = \".*\"/version = \"${{ steps.ver.outputs.version }}\"/" Cargo.toml && cargo build --release); then
              cp "$CARGO_TARGET_DIR/release/$app" "/tmp/app/$app"
            else
              echo "::warning title=$app::it didn't build, so this image is made without it"
            fi
          done
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Nearby Share and Hearth Connect
      # ---- Hearth Link (hosts/hearth-link; tested by hearth-link.yml): built the same way, beside the app in
      # hearth-app.tar (build.sh installs it and its user service). Not fatal. Its Cargo.toml has no version (the
      # owner picks version numbers), so it isn't stamped.
      - name: Build Hearth Link
        continue-on-error: true
        run: |
          set -o pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/hosts/hearth-rs/target"
          mkdir -p /tmp/app
          if (cd hosts/hearth-link && cargo build --release); then cp "$CARGO_TARGET_DIR/release/hearth-link" /tmp/app/hearth-link
          else echo "::warning title=hearth-link::it didn't build, so this image is made without it"; fi
          tar -C /tmp/app -cf "$GITHUB_WORKSPACE/hearth-app.tar" .
      # ---- end of Hearth Link
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-app-peppermint
          path: hearth-app.tar

  # Hearth Browser is still an Electron app (hosts/linux/src/web): Electron brings its own libraries and asks
  # little of glibc, so it's built on the runner as in os.yml.
  browser:
    name: Build Hearth Browser (Electron)
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Hearth's Chromium window (Electron, hosts/electron; used on Nvidia, docs/RENDERERS.md)
        working-directory: hosts/electron
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=electron window::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm test
          npm run dist:dir
          test -x dist/linux-unpacked/hearth-electron
          mkdir -p /tmp/electron && cp -a dist/linux-unpacked/. /tmp/electron/
      - name: Build Hearth Browser
        working-directory: hosts/linux
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=browser::$msg"' ERR
          npm install --no-audit --no-fund
          npm version "${{ needs.app.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist:dir
          test -x dist/linux-unpacked/nimbus
          mkdir -p /tmp/browser && cp -a dist/linux-unpacked/. /tmp/browser/
          tar -C /tmp/browser -cf ../../hearth-browser.tar .
          tar -C /tmp/electron -cf ../../hearth-electron.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-browser-peppermint
          path: |
            hearth-browser.tar
            hearth-electron.tar

  image:
    name: Build the OS image (hearth-peppermint)
    needs: [app, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/linux-host' || github.ref == 'refs/heads/main')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is several GB)
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/download-artifact@v4
        with:
          name: hearth-app-peppermint

      - uses: actions/download-artifact@v4
        with:
          name: hearth-browser-peppermint

      - name: Unpack Hearth into the build context
        run: |
          mkdir -p os/nimbus-app/browser
          tar -C os/nimbus-app -xf hearth-app.tar
          tar -C os/nimbus-app/browser -xf hearth-browser.tar
          if [ -f hearth-electron.tar ]; then mkdir -p os/nimbus-app/electron && tar -C os/nimbus-app/electron -xf hearth-electron.tar; fi
          ls -la os/nimbus-app
          test -x os/nimbus-app/hearth

      - name: Build
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" -e "Copying config" -e "Writing manifest" -e "^Get:" -e "^Unpacking " -e "^Setting up " -e "^Selecting previously" -e "^Preparing to unpack" -e "^(Reading database" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=image::$msg"' ERR
          v="${{ needs.app.outputs.version }}"
          sudo podman build --pull=newer -f os-bases/peppermint/Containerfile --build-arg NIMBUS_VERSION="$v" -t hearth-peppermint:latest .
          # What build.sh couldn't find in the repositories (optional packages): a warning, not a failure.
          missing=$(grep -o 'Not installed (not in the repositories): .*' /tmp/step.log | tail -1 || true)
          if [ -n "$missing" ]; then echo "::warning title=optional packages::$missing"; fi

      # Smaller updates: content-based layers (chunkah, what bootcrew uses for its non-Fedora images; rpm-ostree's
      # rechunker needs an rpm database). Not required: on failure the image is published as built.
      - name: Rechunk for smaller updates
        run: |
          set -o pipefail
          export CHUNKAH_CONFIG_STR="$(sudo podman inspect hearth-peppermint:latest)"
          if sudo -E podman run --rm --pull=newer --mount=type=image,src=localhost/hearth-peppermint:latest,target=/chunkah \
              -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah build -t localhost/hearth-peppermint:chunked \
              --label ostree.bootable=1 --label containers.bootc=1 --compressed --max-layers 128 \
              | sudo podman load; then
            sudo podman tag localhost/hearth-peppermint:chunked hearth-peppermint:latest
            sudo podman image inspect hearth-peppermint:latest --format '{{len .RootFS.Layers}} layers'
          else
            echo "::warning title=rechunk::Rechunking failed; publishing the image as built (updates download more)"
          fi

      # REQUIRED: a failure here stops the image from being published.
      - name: Check the image
        run: |
          # pipefail: without it `bootc container lint | tee` below always passed, even when lint failed.
          set -o pipefail
          cat > /tmp/check.sh <<'EOF'
          fail=0
          # dpkg's database is in /usr/lib/sysimage/dpkg; tmpfiles links /var/lib/dpkg to it at boot, which a plain
          # `podman run` doesn't do: link it here the same way.
          mkdir -p /var/lib && ln -sfn /usr/lib/sysimage/dpkg /var/lib/dpkg
          check() { if sh -c "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "::error title=check::$1"; fail=1; fi; }
          warn() { if sh -c "$2" >/dev/null 2>&1; then echo "ok: $1"; else echo "::warning title=check::$1"; fi; }
          echo "--- update path (same as os.yml)"
          check "bootc is installed" "command -v bootc"
          check "pkexec is installed" "command -v pkexec"
          check "hearth-admin is installed" "test -x /usr/libexec/nimbus/hearth-admin"
          check "hearth-import is installed" "test -x /usr/libexec/nimbus/hearth-import && command -v rsync"
          check "hearth-takeover and its tools are installed" "test -x /usr/libexec/nimbus/hearth-takeover && command -v sfdisk && command -v partx && command -v efibootmgr && command -v btrfs"
          check "the polkit rule for hearth-admin is installed" "test -f /usr/share/polkit-1/rules.d/49-hearth-admin.rules"
          check "saving a system file (hearth-admin write-file) always asks for a password" "grep -q write-file /usr/share/polkit-1/rules.d/49-hearth-admin.rules"
          check "joining Wi-Fi needs no password prompt for the person at the device (polkit rule, netdev group)" "test -f /usr/share/polkit-1/rules.d/49-hearth-network.rules && grep -q netdev /usr/libexec/nimbus/hearth-groups && getent group netdev"
          warn "Hearth Link is installed with every library it links" "test -x /usr/bin/hearth-link && ! ldd /usr/bin/hearth-link | grep -q 'not found'"
          check "Hearth Link's user service comes with it and starts with the session" "test ! -x /usr/bin/hearth-link || (grep -q 'hearth-link serve' /usr/lib/systemd/user/hearth-link.service && test -L /usr/lib/systemd/user/default.target.wants/hearth-link.service)"
          check "the firewall helper knows Hearth Link's ports" "grep -q '47740-47741' /usr/libexec/nimbus/hearth-link-firewall"
          warn "Hearth Text is installed with every library it links" "test -x /usr/bin/hearth-text && ! ldd /usr/bin/hearth-text | grep -q 'not found'"
          warn "text files open in Hearth Text in Desktop Mode" "grep -q '^text/plain=hearth-text.desktop' /etc/xdg/nimbus-mimeapps.list"
          echo "--- Hearth Files: every app's file chooser and the default file manager"
          check "the portal backend (hearth-portal) and its picker are installed" "test -x /usr/share/nimbus/desktop/shell/hearth-portal && test -f /usr/share/nimbus/desktop/shell/picker.qml && python3 -m py_compile /usr/share/nimbus/desktop/shell/hearth-portal"
          check "hearth.portal offers the FileChooser" "grep -q '^Interfaces=.*org.freedesktop.impl.portal.FileChooser' /usr/share/xdg-desktop-portal/portals/hearth.portal"
          check "nimbus-portals.conf gives the FileChooser to hearth" "grep -qx 'org.freedesktop.impl.portal.FileChooser=hearth' /usr/share/xdg-desktop-portal/nimbus-portals.conf"
          check "nimbus-portals.conf keeps screen sharing and screenshots on wlr" "grep -qx 'org.freedesktop.impl.portal.ScreenCast=wlr' /usr/share/xdg-desktop-portal/nimbus-portals.conf && grep -qx 'org.freedesktop.impl.portal.Screenshot=wlr' /usr/share/xdg-desktop-portal/nimbus-portals.conf"
          check "the FileChooser backend's D-Bus service file is installed" "grep -q 'hearth-portal filechooser' /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.hearth.service"
          check "the FileManager1 service file is installed" "grep -q '^Name=org.freedesktop.FileManager1' /usr/share/dbus-1/services/org.freedesktop.FileManager1.hearth.service"
          check "xdg-desktop-portal is installed" "test -x /usr/libexec/xdg-desktop-portal || test -x /usr/lib/xdg-desktop-portal"
          check "the backend can use D-Bus (python3 gi)" "python3 -c 'import gi; gi.require_version(\"Gio\", \"2.0\"); from gi.repository import Gio'"
          check "folders open in Hearth Files in Desktop Mode and Game Mode" "grep -q '^inode/directory=hearth-files.desktop' /etc/xdg/nimbus-mimeapps.list && grep -q '^x-directory/normal=hearth-files.desktop' /etc/xdg/nimbus-mimeapps.list"
          check "folders open in Hearth Files in the system's list" "grep -q '^inode/directory=hearth-files.desktop' /usr/share/applications/mimeapps.list"
          check "Hearth Files' menu entry handles folders" "grep -q '^MimeType=inode/directory;x-directory/normal;' /usr/share/applications/hearth-files.desktop"
          check "the session asks GTK apps for the portal and holds FileManager1" "grep -q 'GTK_USE_PORTAL=1' /usr/bin/nimbus-session && grep -q 'hearth-portal\" filemanager1' /usr/bin/nimbus-session"
          check "Hearth Browser's prefs use the portal's file picker" "grep -q 'widget.use-xdg-desktop-portal.file-picker\", 1' /usr/share/hearth-browser/firefox/defaults/pref/hearth-portal.js"
          warn "Qt apps can use the portal's dialogs (xdgdesktopportal platform theme)" "ls /usr/lib*/qt6/plugins/platformthemes/libqxdgdesktopportal.so /usr/lib/*/qt6/plugins/platformthemes/libqxdgdesktopportal.so 2>/dev/null | grep -q ."
          warn "the picker can open in Game Mode (Qt's X11 platform plugin)" "ls /usr/lib*/qt6/plugins/platforms/libqxcb.so /usr/lib/*/qt6/plugins/platforms/libqxcb.so 2>/dev/null | grep -q ."
          warn "xdotool and xprop are installed (the picker is pinned in front in Game Mode)" "command -v xdotool && command -v xprop"
          warn "Hearth Text's menu entry is installed" "test -f /usr/share/applications/hearth-text.desktop"
          check "hearth-admin's Python is valid" "python3 -m py_compile /usr/libexec/nimbus/hearth-admin"
          check "the wheel group exists (installer, sudo and polkit rules use it)" "getent group wheel"
          check "background updates are scheduled (bootc timer, stage only)" "test -L /etc/systemd/system/timers.target.wants/bootc-fetch-apply-updates.timer && grep -q 'bootc upgrade --quiet' /usr/lib/systemd/system/bootc-fetch-apply-updates.service.d/10-hearth-no-reboot.conf"
          echo "--- update path (required, the app's own check)"
          /usr/lib/nimbus/nimbus --check-update-path || fail=1
          echo "--- the Hearth app runs on Debian trixie"
          check "every library the Hearth app links is installed" "! ldd /usr/lib/nimbus/nimbus | grep -q 'not found'"
          check "the Electron build (Quick Access) is installed" "test -x /usr/lib/hearth-browser/nimbus"
          # Hearth Browser: Mozilla's Firefox with Hearth's parts (os/system_files/usr/share/hearth-browser).
          check "Hearth Browser is installed (Firefox with Hearth's parts)" "test -x /usr/bin/hearth-browser && test -x /usr/lib/hearth-browser/firefox/firefox && test -f /usr/lib/hearth-browser/firefox/hearth.cfg && test -f /usr/lib/hearth-browser/firefox/defaults/pref/autoconfig.js && test -f /usr/lib/hearth-browser/firefox/hearth/hearth.sys.mjs"
          check "Hearth Browser's policies are valid and leave updates to the image" "python3 -c 'import json, sys; p = json.load(open(\"/usr/lib/hearth-browser/firefox/distribution/policies.json\"))[\"policies\"]; sys.exit(0 if p.get(\"DisableAppUpdate\") is True and \"ExtensionSettings\" in p else 1)'"
          ffm=$(LD_LIBRARY_PATH=/usr/lib/hearth-browser/firefox ldd /usr/lib/hearth-browser/firefox/libxul.so 2>/dev/null | awk '/not found/{print $1}' | tr '\n' ' '); [ -z "$ffm" ] || echo "::error title=Firefox libraries missing::$ffm"
          check "every library Hearth Browser's Firefox links is installed" "! LD_LIBRARY_PATH=/usr/lib/hearth-browser/firefox ldd /usr/lib/hearth-browser/firefox/libxul.so | grep -q 'not found'"
          check "hearth-browser answers (--hearth-status)" "HOME=/tmp /usr/bin/hearth-browser --hearth-status | grep -q '\"installed\": true'"
          warn "Hearth Browser's Firefox runs (--version)" "HOME=/tmp /usr/lib/hearth-browser/firefox/firefox --version | grep -q 'Mozilla Firefox'"
          check "the old Chromium (CEF) Hearth Browser is gone" "test ! -e /usr/lib/hearth-browser-cef"
          warn "every library the Electron build (Quick Access) links is installed" "! ldd /usr/lib/hearth-browser/nimbus | grep -q 'not found'"
          check "hearthfetch is installed and runs" "test -x /usr/bin/hearthfetch && /usr/bin/hearthfetch --no-logo | grep -q Hearth"
          # ---- Hearth Time (Clock, Calendar, Notes, Weather): a warning only, as the build of it isn't required.
          warn "Hearth Time is installed with its four apps, icons and alarm service" "test -x /usr/bin/hearth-time && ! ldd /usr/bin/hearth-time | grep -q 'not found' && /usr/bin/hearth-time --version && for a in clock calendar notes weather; do test -L /usr/bin/hearth-\$a && test -f /usr/share/applications/hearth-\$a.desktop && test -f /usr/share/icons/hicolor/scalable/apps/hearth-\$a.svg || exit 1; done && test -f /usr/lib/systemd/user/hearth-time.service && test -L /etc/systemd/user/default.target.wants/hearth-time.service"
          # ---- end of Hearth Time
          # ---- Hearth Photos and Hearth Documents: installed, starting (--help needs every library), and the defaults
          warn "Hearth Photos is installed and starts" "test -x /usr/bin/hearth-photos && /usr/bin/hearth-photos --help | grep -q Photos"
          warn "Hearth Documents is installed and starts" "test -x /usr/bin/hearth-documents && /usr/bin/hearth-documents --help | grep -q Documents"
          warn "Photos opens JPEGs and Documents opens PDFs by default" "grep -q '^image/jpeg=hearth-photos.desktop' /usr/share/applications/mimeapps.list && grep -q '^application/pdf=hearth-documents.desktop' /usr/share/applications/mimeapps.list && test -f /usr/share/icons/hicolor/scalable/apps/hearth-photos.svg"
          warn "libheif's tools are installed (HEIC pictures in Photos)" "command -v heif-dec || command -v heif-convert"
          # ---- end of Hearth Photos and Hearth Documents
          # ---- Hearth Office (hosts/hearth-office)
          warn "Hearth Office is installed (hearth-write, hearth-sheets, hearth-slides) with every library it links" "test -x /usr/bin/hearth-office && test -L /usr/bin/hearth-write && test -f /usr/share/applications/hearth-sheets.desktop && grep -q hearth-slides.desktop /etc/xdg/nimbus-mimeapps.list && ! ldd /usr/bin/hearth-office | grep -q 'not found'"
          # ---- end of Hearth Office
          # ---- Hearth's gaming apps (hosts/hearth-gaming): warnings, not failures (the image is still fine without them).
          warn "Hearth's gaming apps are installed and find their libraries (Controller Lab, Saves, Mods)" "for a in hearth-controller-lab hearth-saves hearth-mods; do test -x /usr/bin/\$a && ! ldd /usr/bin/\$a | grep -q 'not found' || exit 1; done"
          warn "their menu entries and icons" "for a in hearth-controller-lab hearth-saves hearth-mods; do test -f /usr/share/applications/\$a.desktop && test -f /usr/share/icons/hicolor/scalable/apps/\$a.svg || exit 1; done"
          warn "Saves answers without a window (--backups)" "HOME=/tmp /usr/bin/hearth-saves --backups /tmp | grep -q '\\['"
          warn "Saves' hourly timer is on for everyone" "test -f /usr/lib/systemd/user/hearth-saves-auto.service && test -L /usr/lib/systemd/user/timers.target.wants/hearth-saves-auto.timer"
          # ---- end of Hearth's gaming apps
          # ---- Hearth Tools (hosts/hearth-tools)
          warn "Hearth Tools is installed with its menu entries and icons" "test -x /usr/bin/hearth-tools && test -f /usr/share/applications/hearth-disk-usage.desktop && test -f /usr/share/applications/hearth-welcome.desktop && test -f /usr/share/icons/hicolor/scalable/apps/hearth-logs.svg"
          warn "every library Hearth Tools links is installed" "! ldd /usr/bin/hearth-tools | grep -q 'not found'"
          warn "Hearth Tools answers without a window (--list-apps, --call sys.overview)" "/usr/bin/hearth-tools --list-apps | grep -q printers && HOME=/tmp /usr/bin/hearth-tools --call sys.overview | grep -q memory"
          warn "the scanner tools (scanimage, sane-airscan) and traceroute are installed" "command -v scanimage && ls /etc/sane.d/airscan.conf && command -v traceroute"
          # ---- end Hearth Tools
          # SVG through gdk-pixbuf: the classic loader in loaders.cache, or glycin's SVG loader (newer gdk-pixbuf).
          check "GTK can load SVG icons (gdk-pixbuf's SVG loader or glycin's)" "grep -qis svg /usr/lib*/gdk-pixbuf-2.0/2.10.0/loaders.cache /usr/lib/*/gdk-pixbuf-2.0/2.10.0/loaders.cache 2>/dev/null || ls /usr/share/glycin-loaders/*/conf.d/ 2>/dev/null | grep -qi svg || ls /usr/libexec/glycin-loaders/*/ /usr/lib/glycin-loaders/*/ 2>/dev/null | grep -qi svg"
          warn "an SVG icon really loads (gdk-pixbuf-thumbnailer)" "gdk-pixbuf-thumbnailer -s 32 /usr/share/icons/Adwaita/scalable/status/image-missing.svg /tmp/svg.png"
          echo "--- bootable"
          check "one kernel with its initramfs in /usr/lib/modules" "test \$(ls /usr/lib/modules/*/vmlinuz | wc -l) = 1 && ls /usr/lib/modules/*/initramfs.img"
          check "the kernel is trixie-backports' (newer than trixie's 6.12)" "ls /usr/lib/modules | grep -v '^6\\.12\\.'"
          check "the initramfs mounts ostree deployments (ostree-prepare-root)" "lsinitrd \$(ls /usr/lib/modules/*/initramfs.img) > /tmp/i.txt && grep -q ostree-prepare-root /tmp/i.txt"
          check "ostree is new enough for bootc (2025.3 or newer)" "ostree --version | grep -Eq \"Version: '?(2025\\.([3-9]|[1-9][0-9])|20(2[6-9]|[3-9][0-9])\\.)\""
          check "the boot loader for Hearth's installer (signed shim + GRUB for bootupd)" "test -f /usr/lib/bootupd/updates/EFI.json && ls /usr/lib/efi/shim/*/EFI/debian/shimx64.efi && ls /usr/lib/efi/grub2/*/EFI/debian/grubx64.efi"
          check "GRUB's boot menu comes from ostree's entries (hearth-bls-grub)" "test -x /usr/libexec/nimbus/hearth-bls-grub && grep -q hearth-bls.cfg /usr/lib/bootupd/grub2-static/configs.d/10_blscfg.cfg && test -L /etc/systemd/system/multi-user.target.wants/hearth-bls-grub.service"
          check "Nvidia's open kernel module" "find /usr/lib/modules -name 'nvidia.ko*' | grep -q ."
          warn "Nvidia's 32-bit libraries, the same release as the 64-bit ones (Steam and 32-bit games on Nvidia)" "dpkg -l 'nvidia-driver-libs:i386' | grep -q '^ii' && ls /usr/lib/i386-linux-gnu/libGLX_nvidia.so.0 && test \"\$(dpkg-query -W -f='\${Version}' nvidia-driver-libs:i386)\" = \"\$(dpkg-query -W -f='\${Version}' nvidia-driver-libs:amd64)\""
          check "dpkg's database is in the image (/usr/lib/sysimage)" "test -f /usr/lib/sysimage/dpkg/status && grep -q 'L+ /var/lib/dpkg' /usr/lib/tmpfiles.d/hearth-var.conf"
          check "system accounts are recreated by sysusers (sddm, ...)" "grep -q '^u sddm ' /usr/lib/sysusers.d/hearth-image.conf"
          check "the bootc layout (/ostree, /var/home)" "test -L /ostree && test \"\$(readlink /home)\" = var/home"
          check "it's called Hearth" "grep -q '^NAME=\"Hearth\"' /usr/lib/os-release && grep -q Peppermint /usr/lib/os-release"
          # ---- Hearth Paint, Emoji, Fonts and Settings › Accessibility (apps-create.yml)
          warn "Hearth Paint is installed and finds its libraries" "test -x /usr/bin/hearth-paint && ! ldd /usr/bin/hearth-paint | grep -q 'not found'"
          warn "the emoji picker is installed and finds its libraries" "test -x /usr/bin/hearth-emoji && ! ldd /usr/bin/hearth-emoji | grep -q 'not found'"
          warn "Hearth Fonts is installed and lists the fonts" "test -x /usr/bin/hearth-fonts && HOME=/tmp /usr/bin/hearth-fonts --list | grep -q '\"name\"'"
          warn "hearth-gamma (inverted colours in Desktop Mode) is installed" "test -x /usr/bin/hearth-gamma"
          warn "the emoji picker can type and copy (wtype, wl-copy)" "command -v wtype && command -v wl-copy"
          warn "Orca (the screen reader) is installed" "command -v orca"
          warn "labwc has the magnifier (0.7.3 or newer)" "labwc --version | grep -qE '0\.(7\.[3-9]|[89]\.|[1-9][0-9]\.)|[1-9]\.'"
          warn "Settings › Accessibility's helper runs" "HOME=/tmp python3 /usr/share/nimbus/desktop/shell/hearth-access status | grep -q settings"
          warn "the app icons are in the icon theme" "test -f /usr/share/icons/hicolor/scalable/apps/hearth-paint.svg"
          # ---- end Hearth Paint, Emoji, Fonts and Accessibility
          echo "--- Game Mode and Desktop Mode"
          check "gamescope is installed" "command -v gamescope"
          check "gamescope is Valve's (Hearth's Game Mode atoms are in it)" "grep -aq GAMESCOPECTRL_BASELAYER_APPID \$(command -v gamescope) && grep -aq GAMESCOPECTRL_BASELAYER_WINDOW \$(command -v gamescope) && grep -aq GAMESCOPE_FPS_LIMIT \$(command -v gamescope) && grep -aq GAMESCOPECTRL_REQUEST_SCREENSHOT \$(command -v gamescope) && grep -aq mangoapp \$(command -v gamescope)"
          check "mangoapp is installed (performance overlay)" "command -v mangoapp"
          check "labwc is installed" "command -v labwc"
          check "quickshell is installed and finds its libraries" "command -v quickshell && ! ldd \$(command -v quickshell) | grep -q 'not found'"
          check "Steam is installed" "command -v steam && dpkg -l steam-installer | grep -q '^ii'"
          check "Steam's 32-bit graphics (Mesa i386)" "dpkg -l 'libgl1-mesa-dri:i386' | grep -q '^ii'"
          check "the Hearth session is installed" "test -f /usr/share/wayland-sessions/nimbus.desktop && test -x /usr/bin/nimbus-session && test -x /usr/bin/nimbus-mode && test -d /usr/share/nimbus/desktop/shell && grep -q /usr/bin/nimbus-session /usr/share/wayland-sessions/nimbus.desktop"
          echo "--- sleep like SteamOS: the power button suspends, the Ally's controller doesn't wake it, AMD's deep sleep"
          check "the power button sleeps at the sign-in screen too (logind: HandlePowerKey=suspend wins over every other logind setting)" "if command -v systemd-analyze; then systemd-analyze cat-config systemd/logind.conf | grep -E '^[[:space:]]*HandlePowerKey=' | tail -1 | grep -qx 'HandlePowerKey=suspend'; else grep -qx 'HandlePowerKey=suspend' /usr/lib/systemd/logind.conf.d/50-hearth-power.conf && ! grep -rqsE '^[[:space:]]*HandlePowerKey=' /etc/systemd/logind.conf /etc/systemd/logind.conf.d; fi"
          check "the Hearth session takes the power button while it runs (logind's handle-power-key inhibitor: one handler)" "grep -q 'systemd-inhibit --what=handle-power-key' /usr/bin/nimbus-session"
          check "the ROG Ally X / Xbox Ally controller isn't a wake source (udev rule)" "grep -q 'ATTR{idProduct}==\"1b4c\".*ATTR{power/wakeup}=\"disabled\"' /usr/lib/udev/rules.d/50-hearth-handheld-wakeup.rules"
          warn "the handheld wakeup rule is valid (udevadm verify)" "! udevadm verify --help >/dev/null 2>&1 || udevadm verify --no-style /usr/lib/udev/rules.d/50-hearth-handheld-wakeup.rules"
          check "the kernel has AMD's sleep driver (amd_pmc: deep sleep, s0i3, on AMD handhelds and laptops)" "grep -qsE 'amd[-_]pmc' /usr/lib/modules/*/modules.dep /usr/lib/modules/*/modules.builtin"
          warn "the kernel knows the ROG Xbox Ally's sleep (Van Gogh in amd_pmc: Linux 6.18 or newer)" "python3 -c 'import os, sys; v = sorted(os.listdir(\"/usr/lib/modules\"))[-1]; n = tuple(int(x) for x in v.split(\"-\")[0].split(\"+\")[0].split(\".\")[:2]); print(v); sys.exit(0 if n >= (6, 18) else 1)'"
          check "the login screen boots into Hearth (sddm + nimbus-autologin)" "test -L /etc/systemd/system/display-manager.service && readlink /etc/systemd/system/display-manager.service | grep -q sddm && test -L /etc/systemd/system/multi-user.target.wants/nimbus-autologin.service"
          check "the tools the session uses" "command -v grim && command -v brightnessctl && command -v wlr-randr && command -v wlsunset && command -v xdotool && command -v gnome-keyring-daemon && python3 -c 'import evdev'"
          check "WebKitGTK 4.1, PipeWire, Bluetooth, NetworkManager, Flatpak" "ls /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 && command -v pipewire && command -v bluetoothctl && command -v nmcli && command -v flatpak"
          check "the boot splash is Hearth's" "plymouth-set-default-theme | grep -qx hearth"
          echo "--- Handheld Daemon"
          check "Handheld Daemon is installed and its Python modules load" "command -v hhd && test -f /usr/lib/systemd/system/hhd.service && /usr/lib/hhd/bin/python3 -c 'import hhd, adjustor, evdev, yaml, rich, Xlib, serial, pyroute2, gi, dbus'"
          check "Handheld Daemon starts at boot" "test -L /etc/systemd/system/multi-user.target.wants/hhd.service"
          check "Hearth's Quick Access is Handheld Daemon's overlay app (hhd-ui and HHD_OVERLAY are hearth-overlay)" "test -x /usr/share/nimbus/desktop/shell/hearth-overlay && test \"\$(readlink -f /usr/bin/hhd-ui)\" = /usr/share/nimbus/desktop/shell/hearth-overlay && grep -qx 'Environment=HHD_OVERLAY=/usr/share/nimbus/desktop/shell/hearth-overlay' /usr/lib/systemd/system/hhd.service.d/zz-hearth-overlay.conf && /usr/bin/hhd-ui --version | grep -q '^Hearth Quick Access'"
          check "the overlay app's Electron, page and code are installed (Hearth Browser's Electron)" "test -x /usr/lib/hearth-browser/nimbus && test -f /usr/lib/hearth-browser/resources/ui/index.html && { test -f /usr/lib/hearth-browser/resources/app/src/overlay/main.js || grep -aq HEARTH_HHD_OVERLAY /usr/lib/hearth-browser/resources/app.asar; }"
          check "Handheld Daemon's udev rules are installed" "ls /usr/lib/udev/rules.d/*hhd*.rules"
          check "power-profiles-daemon only runs when HHD is off" "grep -q 'ConditionPathExists=/etc/hearth/no-hhd' /usr/lib/systemd/system/power-profiles-daemon.service.d/10-hearth-hhd.conf"
          # bughunt: GLib programs (the desktop portal, WebKit, the accessibility bus) abort without compiled GSettings schemas.
          check "GSettings schemas are installed and compiled" "test -s /usr/share/glib-2.0/schemas/gschemas.compiled && ls /usr/share/glib-2.0/schemas/org.gnome.desktop.interface.gschema.xml"
          echo "--- Claude (Settings › Claude: installed for each user from Anthropic, not part of the image)"
          check "gpg is installed (checks Anthropic's signature on Claude Desktop)" "command -v gpg"
          check "hearth-claude is installed and its Python is valid" "test -x /usr/bin/hearth-claude && python3 -c 'import ast; ast.parse(open(\"/usr/share/nimbus/desktop/shell/hearth-claude\").read())'"
          check "Claude Desktop is checked for updates daily (a user timer, on for everyone)" "test -f /usr/lib/systemd/user/hearth-claude-update.service && test -L /usr/lib/systemd/user/timers.target.wants/hearth-claude-update.timer && test -f /usr/share/applications/hearth-get-claude.desktop"
          check "~/.local/bin is on PATH in login shells (Claude Code)" "env -i HOME=/tmp/u PATH=/usr/bin:/bin bash -lc 'echo \$PATH' | grep -q /tmp/u/.local/bin"
          # Anthropic's real package, installed the way Settings does it, for a throwaway user: shows whether this
          # image has every library it needs. A warning only (it needs downloads.claude.ai).
          mkdir -p /tmp/ch && chown 65534:65534 /tmp/ch
          if cout=$(setpriv --reuid=65534 --regid=65534 --clear-groups env HOME=/tmp/ch PATH=/usr/bin:/bin python3 /usr/share/nimbus/desktop/shell/hearth-claude install 2>&1) \
             && cver=$(setpriv --reuid=65534 --regid=65534 --clear-groups env HOME=/tmp/ch /tmp/ch/.local/bin/claude-desktop --version 2>/dev/null | tail -1) && [ -n "$cver" ]; then
            echo "ok: Claude Desktop $cver installs for a user and starts (--version)"; echo "::notice title=Claude Desktop::$cver installed in a throwaway home folder and answered --version"
            cmiss=$(ldd /tmp/ch/.local/opt/claude-desktop/claude-desktop | awk '/not found/{print $1}' | tr '\n' ' '); [ -z "$cmiss" ] || echo "::warning title=Claude Desktop libraries::$cmiss"
            for l in libsecret-1.so.0 libnotify.so.4; do ldconfig -p | grep -q "$l" || echo "::warning title=Claude Desktop::$l (opened at run time) isn't installed"; done
          else
            echo "::warning title=Claude Desktop install::$(printf '%s' "$cout" | grep -v '^progress' | tail -3 | tr '\n' ' ' | cut -c1-600)"
          fi
          echo "--- .deb files (Hearth's Debian box), AppImages, the app store"
          check "a polkit agent Desktop Mode starts (pkexec prompts: Apps' system installs, Hearth Text)" "for a in \$(sed -n '/^for agent in/,/; do/p' /usr/share/nimbus/desktop/labwc/autostart | tr -d '\\\\' | sed 's/for agent in//; s/; do//'); do command -v \"\$a\" && exit 0; done; exit 1"
          check "Distrobox, podman and newuidmap/newgidmap are installed (rootless containers)" "command -v distrobox && command -v podman && command -v newuidmap && command -v newgidmap"
          check "hearth-debbox is installed (also as /usr/bin/hearth-debbox) and its Python is valid" "test -x /usr/share/nimbus/desktop/shell/hearth-debbox && test -x /usr/bin/hearth-debbox && python3 -c 'import ast; ast.parse(open(\"/usr/share/nimbus/desktop/shell/hearth-debbox\").read())'"
          check ".deb files open in Install Package (desktop file and MIME default)" "test -x /usr/bin/hearth-install-package && grep -q 'application/vnd.debian.binary-package' /usr/share/applications/hearth-install-package.desktop && grep -q '^application/vnd.debian.binary-package=hearth-install-package.desktop' /etc/xdg/nimbus-mimeapps.list && test -f /usr/share/nimbus/desktop/shell/DebInstaller.qml"
          check "FUSE 2 for AppImages (libfuse.so.2 and fusermount)" "ldconfig -p | grep -q 'libfuse.so.2 ' && command -v fusermount"
          check "home folder repair is installed and runs every boot" "python3 -m py_compile /usr/libexec/nimbus/hearth-home-repair && test -L /etc/systemd/system/multi-user.target.wants/hearth-home-repair.service"
          check "/etc/hosts maps the device's name at boot and after a rename (hearth-hosts)" "python3 -m py_compile /usr/libexec/nimbus/hearth-hosts && test -L /etc/systemd/system/multi-user.target.wants/hearth-hosts.service && test -L /etc/systemd/system/multi-user.target.wants/hearth-hosts.path && printf '127.0.0.1 localhost\n127.0.1.1 old-name\n' > /tmp/hosts.t && /usr/libexec/nimbus/hearth-hosts --file /tmp/hosts.t --hostname chris-hearth && grep -q '^127.0.1.1.*chris-hearth' /tmp/hosts.t && ! grep -q old-name /tmp/hosts.t && grep -q '^127.0.0.1.*localhost' /tmp/hosts.t"
          warn "glibc's myhostname module answers for the device's name (nsswitch.conf)" "grep -Eq '^hosts:.*myhostname' /etc/nsswitch.conf"
          check "Flatpak's system installation set up / Bazaar installer runs every boot" "python3 -m py_compile /usr/libexec/nimbus/hearth-flatpak-setup && test -L /etc/systemd/system/multi-user.target.wants/hearth-flatpak-setup.service"
          check "nothing makes an empty /var/lib/flatpak/repo at boot (flatpak can't open one: openat(config))" "! grep -rqs 'var/lib/flatpak/repo' /usr/lib/tmpfiles.d /etc/tmpfiles.d"
          check "Bazaar: the image's package, or installed at boot (hearth-flatpak-setup)" "test -f /usr/share/applications/io.github.kolunmi.Bazaar.desktop || grep -q io.github.kolunmi.Bazaar /usr/libexec/nimbus/hearth-flatpak-setup"
          if [ -f /usr/share/applications/io.github.kolunmi.Bazaar.desktop ]; then echo "::notice title=Bazaar::the image has it as a package"; else echo "::notice title=Bazaar::installed from Flathub at the first online boot (hearth-flatpak-setup.service)"; fi
          check "a Flathub remote file for the system installation" "grep -qls dl.flathub.org /etc/flatpak/remotes.d/*.flatpakrepo /usr/share/flatpak/remotes.d/*.flatpakrepo"
          # A new account gets a container id range from hearth-home-repair (rootless podman needs one).
          mkdir -p /var/home && useradd -m -d /var/home/subtest subtest >/dev/null 2>&1; sed -i '/^subtest:/d' /etc/subuid /etc/subgid
          check "hearth-home-repair gives an account its subuid/subgid range" "/usr/libexec/nimbus/hearth-home-repair --user subtest && grep -q '^subtest:[0-9]*:65536' /etc/subuid && grep -q '^subtest:[0-9]*:65536' /etc/subgid"
          check "hearth-apps and hearth-files are valid" "python3 -c 'import ast; [ast.parse(open(\"/usr/share/nimbus/desktop/shell/\" + f).read()) for f in (\"hearth-apps\", \"hearth-files\")]'"
          check "Hearth's app store lists apps from a Flathub catalog (status, popular, a category, search, an app's page; offline)" "sh /store-check.sh"
          sh /store-check.sh || true   # its own lines, for the log
          echo "--- nice to have"
          warn "Peppermint's desktop (Xfce) is on the login screen" "grep -q 'Peppermint desktop' /usr/share/xsessions/xfce.desktop"
          warn "acpi_call (Legion Go power limits through HHD)" "find /usr/lib/modules -name 'acpi_call.ko*' | grep -q ."
          warn "RyzenAdj is installed" "command -v ryzenadj"
          warn "Beacon is installed (BFME and friends; its release may not exist yet)" "beacon --version"
          # ==== Hearth Recorder, Camera and Share (capture-apps.yml tests them for real): installed, with what they run.
          echo "--- Hearth Recorder, Camera and Share"
          for a in hearth-recorder hearth-camera hearth-share; do warn "$a is installed with its libraries and menu entry" "test -x /usr/bin/$a && ! ldd /usr/bin/$a | grep -q 'not found' && test -f /usr/share/applications/$a.desktop"; done
          warn "Recorder's tools: ffmpeg, wf-recorder, slurp, pactl, pw-dump" "command -v ffmpeg && command -v wf-recorder && command -v slurp && command -v pactl && command -v pw-dump"
          warn "GStreamer can read gamescope's PipeWire stream (Game Mode without gpu-screen-recorder, Share)" "gst-inspect-1.0 --exists pipewiresrc"
          warn "gpu-screen-recorder is installed, with the capability its KMS capture needs" "command -v gpu-screen-recorder && getcap \$(command -v gsr-kms-server) | grep -q cap_sys_admin"
          if [ -x /usr/bin/hearth-recorder ]; then
            echo "::notice title=Recorder here::$(HOME=/tmp/rp /usr/bin/hearth-recorder --probe 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ffmpeg encoders:", [e["id"] for e in d["encoders"]], "audio:", d["audioEncoders"], "gsr:", d["gsr"], "region:", d["gsrRegion"], "wf-recorder:", d["wf"], "slurp:", d["slurp"])' 2>&1 | cut -c1-600)"
          fi
          if command -v gpu-screen-recorder >/dev/null; then
            echo "::notice title=gpu-screen-recorder here::version: $(HOME=/tmp timeout 5 gpu-screen-recorder --version 2>&1 | tail -n 3 | tr '\n' '|' | cut -c1-240); help: $(HOME=/tmp timeout 5 gpu-screen-recorder --help 2>&1 | grep -m1 -E -- '-w ' | cut -c1-240) (exit $(HOME=/tmp timeout 5 gpu-screen-recorder --help >/dev/null 2>&1; echo $?))"
          fi
          # ==== end of Hearth Recorder, Camera and Share
          # ---- Hearth Contacts and Hearth Maps
          warn "Hearth Contacts is installed, finds its libraries and opens .vcf files" "test -x /usr/bin/hearth-contacts && ! ldd /usr/bin/hearth-contacts | grep -q 'not found' && grep -q text/vcard /usr/share/applications/hearth-contacts.desktop"
          warn "Hearth Contacts runs (--list)" "HOME=/tmp HEARTH_CONTACTS_DIR=/tmp/hc /usr/bin/hearth-contacts --list"
          warn "Hearth Maps is installed, finds its libraries and opens geo: links" "test -x /usr/bin/hearth-maps && ! ldd /usr/bin/hearth-maps | grep -q 'not found' && grep -q x-scheme-handler/geo /usr/share/applications/hearth-maps.desktop && /usr/bin/hearth-maps --version"
          warn "Hearth Maps may ask GeoClue for Where am I" "test -f /etc/geoclue/conf.d/90-hearth-maps.conf"
          warn "the Contacts and Maps icons are installed" "test -f /usr/share/icons/hicolor/scalable/apps/hearth-contacts.svg && test -f /usr/share/icons/hicolor/scalable/apps/hearth-maps.svg"
          # ---- end of Hearth Contacts and Hearth Maps
          echo "--- default apps (Hearth's apps open everything, Settings › Default apps changes it)"
          check "Hearth's default apps were written (hearth-system defaults-system)" "grep -q \"^# Hearth's default apps\" /etc/xdg/nimbus-mimeapps.list && grep -q \"^# Hearth's default apps\" /usr/share/applications/mimeapps.list"
          check "xdg-mime is installed" "command -v xdg-mime"
          # As a new account in Hearth's session (XDG_CURRENT_DESKTOP=Nimbus, nothing of its own yet): xdg-mime and
          # GLib's gio say Hearth's app for each kind, never the base's (Firefox, Loupe, Totem, Evince, LibreOffice...).
          mkdir -p /tmp/du && chown 65534:65534 /tmp/du
          asu() { setpriv --reuid=65534 --regid=65534 --clear-groups env -i HOME=/tmp/du PATH=/usr/bin:/bin XDG_CURRENT_DESKTOP=Nimbus XDG_DATA_DIRS=/usr/local/share:/usr/share XDG_CONFIG_DIRS=/etc/xdg "$@"; }
          dbad=""; dgio=""; dn=0
          for pair in text/plain=hearth-text text/x-python=hearth-text application/json=hearth-text text/markdown=hearth-text \
                      image/jpeg=hearth-photos image/png=hearth-photos video/mp4=hearth-player video/x-matroska=hearth-player \
                      audio/mpeg=hearth-player audio/flac=hearth-player application/pdf=hearth-documents application/epub+zip=hearth-documents \
                      x-scheme-handler/https=hearth-browser x-scheme-handler/http=hearth-browser text/html=hearth-browser \
                      inode/directory=hearth-files application/zip=hearth-files application/x-compressed-tar=hearth-files \
                      application/vnd.openxmlformats-officedocument.wordprocessingml.document=hearth-write application/vnd.oasis.opendocument.text=hearth-write \
                      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet=hearth-sheets text/csv=hearth-sheets \
                      application/vnd.openxmlformats-officedocument.presentationml.presentation=hearth-slides \
                      font/ttf=hearth-fonts text/vcard=hearth-contacts text/calendar=hearth-calendar x-scheme-handler/webcal=hearth-calendar \
                      x-scheme-handler/geo=hearth-maps x-scheme-handler/terminal=hearth-terminal; do
            m=${pair%%=*}; want=${pair#*=}.desktop
            [ -f "/usr/share/applications/$want" ] || { echo "skip: $want isn't in this image ($m)"; continue; }
            got=$(asu xdg-mime query default "$m" 2>/dev/null | tail -1); dn=$((dn+1))
            [ "$got" = "$want" ] || dbad="$dbad $m=${got:-nothing}(want $want)"
            if command -v gio >/dev/null; then g=$(asu gio mime "$m" 2>/dev/null | sed -n 's/^Default application for .*: *//p'); [ -z "$g" ] || [ "$g" = "$want" ] || dgio="$dgio $m=$g"; fi
          done
          if [ -z "$dbad" ]; then echo "ok: xdg-mime says Hearth's app for all $dn kinds of file and link"; else echo "::error title=default apps::xdg-mime as a new user:$dbad"; fail=1; fi
          [ -z "$dgio" ] || echo "::warning title=default apps (gio)::GLib picks another app for:$dgio"
          check "Settings › Default apps lists Hearth's apps as in use (hearth-system defaults, as a new user)" "setpriv --reuid=65534 --regid=65534 --clear-groups env -i HOME=/tmp/du PATH=/usr/bin:/bin XDG_CURRENT_DESKTOP=Nimbus python3 /usr/share/nimbus/desktop/shell/hearth-system defaults | python3 -c 'import json, sys; k = {x[\"kind\"]: x for x in json.load(sys.stdin)[\"kinds\"]}; sys.exit(0 if k[\"text\"][\"current\"] == \"hearth-text.desktop\" and k[\"browser\"][\"isHearth\"] and not any(x[\"yours\"] for x in k.values()) else 1)'"
          # Picking another app writes ~/.config/mimeapps.list and wins; Reset to Hearth's defaults brings Hearth's back.
          if [ -f /usr/share/applications/hearth-write.desktop ] && [ -f /usr/share/applications/hearth-text.desktop ]; then
            asu python3 /usr/share/nimbus/desktop/shell/hearth-system default-set text hearth-write.desktop >/dev/null 2>&1
            d1=$(asu xdg-mime query default text/plain 2>/dev/null)
            asu python3 /usr/share/nimbus/desktop/shell/hearth-system default-reset >/dev/null 2>&1
            d2=$(asu xdg-mime query default text/plain 2>/dev/null)
            if [ "$d1" = hearth-write.desktop ] && [ "$d2" = hearth-text.desktop ]; then echo "ok: a choice in Settings › Default apps wins, and Reset brings Hearth's back"
            else echo "::error title=default apps::picking Hearth Write for text gave '$d1', resetting gave '$d2'"; fail=1; fi
          fi
          echo "::notice title=Default app lists in the image::$(ls /etc/xdg/*mimeapps.list /usr/share/applications/*mimeapps.list 2>/dev/null | tr '\n' ' ')"
          exit $fail
          EOF
          sudo podman run --rm -v /tmp/check.sh:/check.sh:ro -v "$PWD/.github/scripts/hearth-store-check.sh:/store-check.sh:ro" hearth-peppermint:latest sh /check.sh
          echo "--- bootc container lint"
          sudo podman run --rm hearth-peppermint:latest bootc container lint 2>&1 | tee /tmp/lint.log || {
            msg=$(tail -20 /tmp/lint.log | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=bootc container lint::$msg"; exit 1; }

      # WARN-ONLY: rootless podman, Hearth's Debian box with a small .deb, AppImages through FUSE, Bazaar from Flathub,
      # for a throwaway account in a privileged container (.github/scripts/hearth-box-check.sh). Needs the network and
      # nested containers, which a runner may not give, so it never fails the build.
      - name: Debian box, a .deb through Distrobox (warn-only)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo podman run --rm --privileged -v "$PWD/.github/scripts/hearth-box-check.sh:/box.sh:ro" \
            -v "$PWD/hosts/linux/test/make_test_deb.py:/make_test_deb.py:ro" hearth-peppermint:latest bash /box.sh box || echo "::warning title=box check::the box check didn't finish"
      - name: AppImages through FUSE (warn-only)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo podman run --rm --privileged -v "$PWD/.github/scripts/hearth-box-check.sh:/box.sh:ro" \
            -v "$PWD/hosts/linux/test/make_test_deb.py:/make_test_deb.py:ro" hearth-peppermint:latest bash /box.sh appimage || echo "::warning title=box check::the appimage check didn't finish"
      - name: Flatpak repair, Bazaar and the app store (warn-only)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo podman run --rm --privileged -v "$PWD/.github/scripts/hearth-box-check.sh:/box.sh:ro" \
            -v "$PWD/hosts/linux/test/make_test_deb.py:/make_test_deb.py:ro" hearth-peppermint:latest bash /box.sh flatpak || echo "::warning title=box check::the flatpak check didn't finish"

      - name: Publish to GitHub Container Registry
        if: env.PUBLISH == 'true'
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -20 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=publish::$msg"' ERR
          v="${{ needs.app.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in testing "testing-$v-$(date -u +%Y%m%d)"; do
            sudo podman push hearth-peppermint:latest "$IMAGE:$tag"
          done
          echo "::notice title=published::$IMAGE:testing"
