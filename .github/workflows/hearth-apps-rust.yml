# Hearth's pure-Rust apps (hosts/hearth-ui: Task Manager, System Restore, Reliability history, Settings; docs/APPS-ANATASE.md).
# Built and tested only here, in Fedora 45 as Hearth OS, Fedora edition is:
#   build     the workspace: cargo build --release and the tests (errors as annotations)
#   run       each app on a headless Wayland screen (sway, software drawing) as an ordinary user: time to its first
#             frame, memory and CPU at rest (limits in .github/scripts/hearth-apps-rust-test.sh), and pictures
#   pictures  each picture as SHOT notices (one job each: GitHub keeps 50 notices a job)
name: Hearth apps (pure Rust)

on:
  push:
    branches: ['feature/hearth-apps-rust']
    paths: ['hosts/hearth-ui/**', 'hosts/hearth-core/src/settings_file.rs', 'hosts/linux/desktop/theme/palettes.json',
            '.github/workflows/hearth-apps-rust.yml', '.github/scripts/hearth-apps-rust-*', '.github/scripts/hearth-ui-build.sh']
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these apps'' pictures: their shots.d names, a comma list (like "family,notes"); empty: every app'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hearth-apps-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Rust and the libraries iced uses
        run: |
          dnf -y install git tar zstd gcc pkgconf-pkg-config rust cargo libxkbcommon-devel wayland-devel fontconfig-devel freetype-devel python3 >/dev/null
          echo "::notice title=toolchain::$(rustc --version) · $(cargo --version) · $(. /etc/os-release; echo $PRETTY_NAME)"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hosts/hearth-ui/target
          key: hearth-ui-f45-${{ hashFiles('hosts/hearth-ui/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: hearth-ui-f45-${{ hashFiles('hosts/hearth-ui/**/Cargo.toml') }}-
      - name: Build
        run: |
          set -o pipefail
          cd hosts/hearth-ui
          if ! cargo build --release --workspace 2>&1 | tee ../../build.log; then
            grep -E '^(error|warning: unused)' -A12 ../../build.log | grep -v '^--$' | head -400 > ../../errs.txt
            n=0
            awk '/^error/{if (b) print b; b=$0; next} {b=b "|" $0} END{print b}' ../../errs.txt | head -30 | while read -r l; do
              echo "::error title=cargo build::$(echo "$l" | cut -c1-3800)"
            done
            exit 1
          fi
          ls -la target/release/ | grep hearth-
          # Describe it in the apps asks hearth-layout (hosts/hearth-layout), built here into the same target folder
          cargo build --release --manifest-path ../hearth-layout/Cargo.toml --target-dir target 2>&1 | tail -3
          for b in hearth-task-manager hearth-system-restore hearth-reliability-history hearth-settings-app hearth-files-app hearth-file-chooser hearth-capture-app hearth-pad-host hearth-g15 hearth-g15-app hearth-store-app hearth-server-app hearth-resmon-app hearth-family-app hearth-notes-app hearth-game-fixer hearth-proton-manager hearth-overlay hearth-bottles hearth-3d hearth-ideas-app hearth-retro-app hearth-retro-to-steam-app hearth-studio-app hearth-beat-maker-app hearth-lights-app hearth-remap-app hearth-mouse-app hearth-shield-app hearth-listen-app hearth-imagine-app hearth-passwords-app hearth-cloud-app hearth-home-app; do
            echo "::notice title=size::$b $(du -h target/release/$b | cut -f1)"
          done
      - name: Tests
        run: |
          cd hosts/hearth-ui
          cargo test --release --workspace -- --test-threads=1 2>&1 | tee ../../test.log || { grep -E "panicked|FAILED|^error" ../../test.log | head -10 | while read -r l; do echo "::error title=cargo test::$l"; done; exit 1; }
          echo "::notice title=cargo test::$(grep -E '^test result' ../../test.log | tr '\n' ' ' | cut -c1-500)"
          # a failing test is named, with why (the pipe above is tee's, so the step itself goes on to the pictures)
          if grep -qE '^test result: FAILED' ../../test.log; then
            grep -E '^test .* FAILED$|panicked at|assertion' ../../test.log | head -20 | while read -r l; do echo "::error title=cargo test::$(echo "$l" | cut -c1-900)"; done
          fi
      - name: Gather
        run: |
          mkdir -p bin
          cp hosts/hearth-ui/target/release/hearth-task-manager hosts/hearth-ui/target/release/hearth-system-restore hosts/hearth-ui/target/release/hearth-reliability-history hosts/hearth-ui/target/release/hearth-settings-app hosts/hearth-ui/target/release/hearth-files-app hosts/hearth-ui/target/release/hearth-file-chooser hosts/hearth-ui/target/release/hearth-capture-app hosts/hearth-ui/target/release/hearth-pad-host hosts/hearth-ui/target/release/hearth-g15 hosts/hearth-ui/target/release/hearth-g15-app hosts/hearth-ui/target/release/hearth-store-app hosts/hearth-ui/target/release/hearth-server-app hosts/hearth-ui/target/release/hearth-resmon-app hosts/hearth-ui/target/release/hearth-family-app hosts/hearth-ui/target/release/hearth-notes-app hosts/hearth-ui/target/release/hearth-game-fixer hosts/hearth-ui/target/release/hearth-proton-manager hosts/hearth-ui/target/release/hearth-overlay hosts/hearth-ui/target/release/hearth-bottles hosts/hearth-ui/target/release/hearth-3d hosts/hearth-ui/target/release/hearth-ideas-app hosts/hearth-ui/target/release/hearth-retro-app hosts/hearth-ui/target/release/hearth-retro-to-steam-app hosts/hearth-ui/target/release/hearth-studio-app hosts/hearth-ui/target/release/hearth-beat-maker-app hosts/hearth-ui/target/release/hearth-layout hosts/hearth-ui/target/release/hearth-lights-app hosts/hearth-ui/target/release/hearth-remap-app hosts/hearth-ui/target/release/hearth-mouse-app hosts/hearth-ui/target/release/hearth-shield-app hosts/hearth-ui/target/release/hearth-listen-app hosts/hearth-ui/target/release/hearth-imagine-app hosts/hearth-ui/target/release/hearth-passwords-app hosts/hearth-ui/target/release/hearth-cloud-app hosts/hearth-ui/target/release/hearth-home-app bin/
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-apps-rust
          path: bin
          retention-days: 7

  # Hearth Cloud's FROM for every file (apps/cloud/nextcloud/hearthdevice, nc_app.rs) in the real Nextcloud image
  # hearth-oss-server runs: a "phone" uploads with its own app password, and the device is read back over WebDAV.
  nextcloud-device:
    if: inputs.only == '' || contains(inputs.only, 'cloud')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hosts/hearth-ui/apps/cloud/nextcloud
      - name: Nextcloud, as hearth-oss-server runs it
        run: |
          docker run -d --name hearth-nextcloud -p 8090:80 -e SQLITE_DATABASE=nextcloud -e NEXTCLOUD_ADMIN_USER=owner \
            -e NEXTCLOUD_ADMIN_PASSWORD=ci-pretend-pass-123 -e NEXTCLOUD_TRUSTED_DOMAINS=localhost docker.io/library/nextcloud:31-apache
          for i in $(seq 1 120); do
            curl -fs http://localhost:8090/status.php | grep -q '"installed":true' && break
            sleep 3
          done
          curl -fs http://localhost:8090/status.php || { docker logs hearth-nextcloud | tail -40; echo "::error title=nextcloud::it didn't start"; exit 1; }
      - name: Hearth's app in, turned on
        run: |
          docker cp hosts/hearth-ui/apps/cloud/nextcloud/hearthdevice hearth-nextcloud:/var/www/html/custom_apps/hearthdevice
          docker exec hearth-nextcloud chown -R www-data:www-data /var/www/html/custom_apps/hearthdevice
          docker exec -u www-data hearth-nextcloud php occ app:enable hearthdevice 2>&1 | tee /tmp/enable.log
          grep -qi 'enabled' /tmp/enable.log || { echo "::error title=hearthdevice::occ didn't turn it on: $(tr '\n' '|' < /tmp/enable.log)"; exit 1; }
      - name: A phone uploads, Hearth Cloud reads FROM
        run: |
          set -o pipefail
          U=owner; P=ci-pretend-pass-123; B=http://localhost:8090
          tok=$(curl -fs -u "$U:$P" -H 'OCS-APIRequest: true' -A 'Pixel 7 (Nextcloud Android)' "$B/ocs/v2.php/core/getapppassword?format=json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["ocs"]["data"]["apppassword"])')
          [ -n "$tok" ] || { echo "::error title=app password::none"; exit 1; }
          echo "story notes" > /tmp/story.txt
          curl -fs -u "$U:$tok" -A 'Mozilla/5.0 (Android) Nextcloud-android/3.29.0' -T /tmp/story.txt "$B/remote.php/dav/files/$U/story.txt"
          body='<?xml version="1.0"?><d:propfind xmlns:d="DAV:" xmlns:h="https://hearthos.fun/ns"><d:prop><h:device/><d:getlastmodified/></d:prop></d:propfind>'
          out=$(curl -fs -u "$U:$P" -X PROPFIND -H 'Depth: 0' -H 'Content-Type: application/xml' --data "$body" "$B/remote.php/dav/files/$U/story.txt")
          echo "$out" | head -c 1500; echo
          if echo "$out" | grep -q 'Pixel 7'; then echo "::notice title=FROM::the phone's upload is marked with its device: $(echo "$out" | grep -o '<[a-z0-9]*:device[^<]*' | head -1)"
          else echo "::error title=FROM::no device on the phone's upload: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"; docker exec hearth-nextcloud tail -5 /var/www/html/data/nextcloud.log | cut -c1-1500; exit 1; fi
          # a second write from the same phone keeps one value
          curl -fs -u "$U:$tok" -T /tmp/story.txt "$B/remote.php/dav/files/$U/story.txt"
          n=$(curl -fs -u "$U:$P" -X PROPFIND -H 'Depth: 0' --data "$body" "$B/remote.php/dav/files/$U/story.txt" | grep -o 'Pixel 7' | wc -l)
          [ "$n" -eq 1 ] && echo "::notice title=FROM::written again: still one device" || echo "::error title=FROM::$n values after a second write"

  # The same build as base-anatase.yml's "hearth-ui" job, inside the Fedora edition's own base image (what the image
  # links), so a problem there shows here first.
  inside-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build inside the Fedora edition's base
        run: |
          mkdir -p /tmp/out
          base=$(grep -oP '(?<=^ARG BASE_IMAGE=).*' os-bases/anatase/Containerfile | head -1)
          docker pull -q "$base"
          docker run --rm -v "$PWD:/src:ro" -v /tmp/out:/out "$base" bash /src/.github/scripts/hearth-ui-build.sh 2>&1 | tail -60
          test -s /tmp/out/hearth-ui.tar

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 80
    container: registry.fedoraproject.org/fedora:45
    outputs:
      shots: ${{ steps.list.outputs.shots }}
      shots2: ${{ steps.list.outputs.shots2 }}
      shots3: ${{ steps.list.outputs.shots3 }}
    steps:
      - name: A screen in memory (sway), grim, fonts, Python
        run: |
          dnf -y install --skip-unavailable git sway cage wlopm grim procps-ng python3 python3-pillow util-linux shadow-utils libxkbcommon libwayland-client libwayland-cursor \
            mesa-vulkan-drivers vulkan-loader mesa-dri-drivers mesa-libEGL mesa-libgbm libglvnd-egl \
            fontconfig rsms-inter-fonts google-noto-sans-fonts google-noto-sans-symbols-fonts dejavu-sans-fonts dejavu-sans-mono-fonts systemd kdialog qt6-qtwayland mangohud vulkan-tools >/dev/null
          for b in sway cage wlopm grim swaymsg runuser; do command -v $b >/dev/null || echo "::warning title=setup::$b isn't installed"; done
          fc-list | grep -qi inter && echo "::notice title=fonts::Inter is here" || echo "::warning title=fonts::no Inter (the mockups' font)"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hearth-apps-rust
          path: bin
      - name: Start each app, measure it, picture it
        timeout-minutes: 70
        run: |
          chmod +x bin/*
          printf '%s' "${{ inputs.only }}" > /tmp/shots-only
          HEARTH_REPORT_LATER=1 bash .github/scripts/hearth-apps-rust-test.sh
      - name: The measurements (first frame, memory, CPU at rest, scrolling) and their limits
        if: always()
        run: bash .github/scripts/hearth-apps-rust-test.sh --report
      # A step's notices stop at ten, and the apps' own fill the step above: Resource Monitor's measurements and the
      # Fedora menu's dialogs get their own (written by .github/scripts/hearth-apps-rust-shots.d/resmon.sh, fedora-menu.sh).
      - name: Resource Monitor at rest, and the Fedora menu's dialogs
        if: always()
        run: |
          [ -f shots/resmon-results.txt ] || { echo "::warning title=resmon::no measurements (resmon.sh didn't run)"; exit 0; }
          head -n 8 shots/resmon-results.txt | while read -r l; do echo "::notice title=resmon::$l"; done
          rm -f shots/resmon-results.txt
      - name: The pictures taken (each posted by its own job)
        id: list
        if: always()
        run: |
          # A matrix holds at most 256 jobs, so the pictures go out in three of them (250 each; any beyond 750 are said).
          ls shots/*.png 2>/dev/null | xargs -r -n1 basename | sed 's/\.png$//' > /tmp/shots.txt || true
          ONLY=$(printf '%s' "${{ inputs.only }}" | tr -d ' ' | tr ',' '|')
          if [ -n "$ONLY" ]; then grep -E "$ONLY" /tmp/shots.txt > /tmp/shots-only.txt || true; mv /tmp/shots-only.txt /tmp/shots.txt; fi
          echo "shots=$(python3 -c 'import json,sys; print(json.dumps([l.strip() for l in open(sys.argv[1]) if l.strip()][:250]))' /tmp/shots.txt)" >> "$GITHUB_OUTPUT"
          echo "shots2=$(python3 -c 'import json,sys; print(json.dumps([l.strip() for l in open(sys.argv[1]) if l.strip()][250:500]))' /tmp/shots.txt)" >> "$GITHUB_OUTPUT"
          echo "shots3=$(python3 -c 'import json,sys; print(json.dumps([l.strip() for l in open(sys.argv[1]) if l.strip()][500:750]))' /tmp/shots.txt)" >> "$GITHUB_OUTPUT"
          n=$(grep -c . /tmp/shots.txt || true); [ "${n:-0}" -le 750 ] || echo "::warning title=pictures::$n pictures taken; only the first 750 are posted"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-apps-rust-shots
          path: |
            shots
            results.txt
          retention-days: 14

  pictures:
    needs: run
    if: always() && needs.run.result != 'skipped' && needs.run.outputs.shots != '[]' && needs.run.outputs.shots != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.run.outputs.shots || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hearth-apps-rust-shots
          path: .
      - name: Picture ${{ matrix.shot }}
        run: |
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet pillow >/dev/null
          python3 .github/scripts/firehold-shot.py ${{ matrix.shot }}

  pictures-2:
    needs: run
    if: always() && needs.run.result != 'skipped' && needs.run.outputs.shots2 != '[]' && needs.run.outputs.shots2 != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.run.outputs.shots2 || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hearth-apps-rust-shots
          path: .
      - name: Picture ${{ matrix.shot }}
        run: |
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet pillow >/dev/null
          python3 .github/scripts/firehold-shot.py ${{ matrix.shot }}

  pictures-3:
    needs: run
    if: always() && needs.run.result != 'skipped' && needs.run.outputs.shots3 != '[]' && needs.run.outputs.shots3 != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.run.outputs.shots3 || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hearth-apps-rust-shots
          path: .
      - name: Picture ${{ matrix.shot }}
        run: |
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet pillow >/dev/null
          python3 .github/scripts/firehold-shot.py ${{ matrix.shot }}
