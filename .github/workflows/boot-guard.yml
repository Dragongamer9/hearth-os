# Automatic fallback and Hearth Recovery on the device: their tests, with GRUB's own tools checking the menu snippet
# and the environment block (an update must never stop a device from starting: MILESTONES.md). Also the Hearth
# Recovery USB's engine on fake drives (reinstall keeps every version, factory reset never erases another system),
# and Peppermint's writable system (hearth-unlock): its tests, then the real thing in a privileged Debian 13
# container (overlay over a read-only /usr, apt, an update with the reapply, rollback, lock/unlock, safe start).
name: Boot guard
on:
  workflow_dispatch:
  push:
    branches: [main, bughunt]
    paths:
      - 'os/system_files/usr/libexec/nimbus/hearth-boot-guard'
      - 'os/system_files/usr/libexec/nimbus/hearth-recovery'
      - 'os/system_files/usr/lib/systemd/system/hearth-boot-*'
      - 'os/system_files/usr/lib/systemd/system/hearth-recovery.service'
      - 'hosts/linux/test/test_hearth_boot_guard.py'
      - 'os/recovery/src/**'
      - 'os/live/src/hearth-install'
      - 'hosts/linux/test/test_hearth_recovery_usb.py'
      - 'os-bases/peppermint/system_files/usr/bin/hearth-unlock'
      - 'os-bases/peppermint/system_files/usr/lib/systemd/system/hearth-unlock*'
      - 'os-bases/peppermint/system_files/usr/lib/systemd/system/*.service.d/20-hearth-image-usr.conf'
      - 'os-bases/peppermint/system_files/usr/lib/systemd/system-generators/**'
      - 'os-bases/*/build.sh'
      - '.github/scripts/check-system-files.py'
      - '.gitignore'
      - 'os-bases/peppermint/system_files/usr/share/hearth/unlock/**'
      - 'hosts/linux/test/test_hearth_unlock.py'
      - '.github/scripts/hearth-unlock-check.sh'
      - '.github/workflows/boot-guard.yml'
      - 'tools/app-bundle.py'
      - 'hosts/linux/test/test_hearth_app_channel.py'
      - 'hosts/linux/session/nimbus-watchdog'
      - 'os-bases/peppermint/system_files/usr/libexec/nimbus/hearth-bls-grub'
      - 'os-bases/peppermint/system_files/usr/share/hearth/grub-theme/**'
      - 'os/system_files/usr/libexec/nimbus/hearth-boot-look'
      - 'os/system_files/usr/share/plymouth/**'
      - 'hosts/linux/test/test_hearth_bls_grub.py'
      - 'hosts/linux/test/test_plymouth_themes.py'
      - 'tools/plymouth_preview.py'
      - 'os/system_files/usr/share/hearth/boot-previews/**'
      - 'os/system_files/usr/share/hearth/startup-movies/**'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GRUB's tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq grub-common python3-pil && which grub-script-check grub-editenv
      - name: Tests
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_hearth_boot_guard.py' -v > /tmp/t.txt 2>&1; then
            grep -v -E '^$|\.\.\. ok$' /tmp/t.txt | grep -A12 -E '^(FAIL|ERROR):' | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          cat /tmp/t.txt
      # Hearth app updates (docs/APP-UPDATES.md): the bundle packing and the image's app ABI tag (the start-up choice
      # itself runs end to end with a built Hearth in rust.yml and release.yml).
      - name: Hearth app updates (packing, ABI)
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_hearth_app_channel.py' -v > /tmp/a.txt 2>&1; then
            grep -A12 -E '^(FAIL|ERROR):' /tmp/a.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          tail -n 3 /tmp/a.txt
          echo "::notice title=app ABI::$(python3 ../../tools/app-bundle.py abi)"
      - name: Recovery USB tests
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_hearth_recovery_usb.py' -v > /tmp/r.txt 2>&1; then
            grep -v -E '^$|\.\.\. ok$' /tmp/r.txt | grep -A12 -E '^(FAIL|ERROR):' | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          cat /tmp/r.txt
      # Hearth OS 1.1's boot look: hearth-bls-grub's names, the GRUB theme (copied whole, sourced after the entries,
      # switched on only when it's all there; GRUB's own grub-script-check reads the files), the splash presets and
      # Steam Game Mode's startup animations (hearth-boot-look).
      - name: GRUB menu names, theme and splash presets (hearth-bls-grub, hearth-boot-look)
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_hearth_bls_grub.py' -v > /tmp/b.txt 2>&1; then
            grep -v -E '^$|\.\.\. ok$' /tmp/b.txt | grep -A12 -E '^(FAIL|ERROR):' | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          grep -E 'skipped|^Ran|^OK' /tmp/b.txt | tail -n 5
          sh -n ../../os-bases/peppermint/system_files/usr/libexec/nimbus/hearth-bls-grub
      # Every boot splash theme parses and runs (a strict stand-in for Plymouth's script plugin, at several screen
      # sizes, with the password prompt), the newer ones use only what the first three use, every list of splash
      # names agrees, the default stays hearth, and Settings › Boot & startup has a preview for every choice.
      - name: Boot splash themes (tools/plymouth_preview.py) and the Boot & startup previews
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_plymouth_themes.py' -v > /tmp/p.txt 2>&1; then
            grep -v -E '^$|\.\.\. ok$' /tmp/p.txt | grep -A12 -E '^(FAIL|ERROR):' | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          grep -E 'skipped|^Ran|^OK' /tmp/p.txt | tail -n 5
          if grep -q 'skipped' /tmp/p.txt; then echo "::error::the splash themes weren't run (Pillow missing?)"; exit 1; fi
      - name: Writable system tests (hearth-unlock, hearth-admin unlock, the .deb installer going native)
        run: |
          cd hosts/linux
          if ! python3 -m unittest discover -s test -p 'test_hearth_unlock.py' -v > /tmp/u.txt 2>&1; then
            grep -v -E '^$|\.\.\. ok$' /tmp/u.txt | grep -A12 -E '^(FAIL|ERROR):' | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1
          fi
          tail -n 3 /tmp/u.txt
          python3 -m unittest discover -s test -p 'test_hearth_debbox.py' 2>&1 | tail -n 3
          node --test test/polkit-rules.test.js 2>&1 | tail -n 8
      - name: Scripts compile, units parse
        run: |
          python3 -m py_compile os-bases/peppermint/system_files/usr/bin/hearth-unlock os/system_files/usr/libexec/nimbus/hearth-admin os/system_files/usr/libexec/nimbus/hearth-boot-look
          bash -n .github/scripts/hearth-unlock-check.sh
          sh -n os-bases/peppermint/system_files/usr/lib/systemd/system-generators/hearth-etc-guard
          # every Hearth file the image builds use is in git (hearth-unlock was once hidden by .gitignore's bin/)
          python3 .github/scripts/check-system-files.py os-bases/peppermint os-bases/anatase
          for u in os-bases/peppermint/system_files/usr/lib/systemd/system/hearth-unlock*.service; do
            systemd-analyze verify --man=no "$u" 2>&1 | grep -v -E 'not found|Failed to|No such file|nimbus-autologin|display-manager|hhd|ostree-remount|hearth-recovery' || true
          done
          python3 -m py_compile os/system_files/usr/libexec/nimbus/hearth-boot-guard os/system_files/usr/libexec/nimbus/hearth-recovery \
            os/recovery/src/hearth-recovery os/recovery/src/recovery-pad
          bash -n os/recovery/src/build.sh
          for u in os/system_files/usr/lib/systemd/system/hearth-boot-*.service os/system_files/usr/lib/systemd/system/hearth-recovery.service; do
            systemd-analyze verify --man=no "$u" 2>&1 | grep -v -E 'not found|Failed to|No such file|nimbus-autologin|display-manager|hhd' || true
          done

  writable:
    name: Peppermint writable system (real overlay and apt, Debian 13 container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unlocked by default, apt survives, update + reapply, rollback, lock/unlock, safe start
        run: bash .github/scripts/hearth-unlock-check.sh docker.io/library/debian:trixie plain
