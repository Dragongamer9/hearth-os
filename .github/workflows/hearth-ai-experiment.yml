name: Hearth AI Experiment Tests

on:
  push:
    branches:
      - experiment/hearth-ai-test-os
    paths:
      - 'experiments/hearth-ai-test-os/**'
      - '.github/workflows/hearth-ai-experiment.yml'
  pull_request:
    paths:
      - 'experiments/hearth-ai-test-os/**'
      - '.github/workflows/hearth-ai-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Command Center tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: experiments/hearth-ai-test-os
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q server.py metrics.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
  js-syntax:
    name: Command Center JavaScript syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/hearth-ai-test-os
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse UI JavaScript
        run: node --check app.js
