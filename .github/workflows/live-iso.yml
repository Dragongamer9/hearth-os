# Builds the Hearth live ISO: boots from a USB stick into Hearth (Desktop Mode) so you can try it, with a
# welcome card and an "Install Hearth" installer. Same idea and tool as Bazzite's live ISO (Titanoboa).
# Manual only (Actions › Hearth live ISO › Run workflow). The ISO is kept as a download on the run for 14 days
# (GitHub releases can't hold files over 2 GB) and, when the SourceForge secrets are set, uploaded to
# https://sourceforge.net/projects/<SF_PROJECT>/files/<version>/ (what the website's Download button points at).
#   Secrets (Settings › Secrets and variables › Actions): SF_USER (your SourceForge user name),
#   SF_SSH_KEY (private key whose public half is in SourceForge › Account › SSH Settings),
#   SF_PROJECT (project's short name, e.g. hearth-os), optional SF_API_KEY (makes the new ISO the default download). Installing needs internet: it downloads the current Hearth
# image, so a fresh install is always up to date.
name: Hearth live ISO

on:
  workflow_dispatch:
    inputs:
      graphics:
        description: 'Which graphics the ISO is for'
        type: choice
        options: [amd-intel, nvidia]
        default: amd-intel
      upload:
        description: 'Upload the ISO to SourceForge (needs the SF_* secrets)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  live-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SF_USER: ${{ secrets.SF_USER }}
      SF_PROJECT: ${{ secrets.SF_PROJECT }}
      IMAGE_NAME: ${{ inputs.graphics == 'nvidia' && 'hearth-nvidia' || 'hearth' }}
      SUFFIX: ${{ inputs.graphics == 'nvidia' && '-nvidia' || '' }}
      HAVE_SF: ${{ secrets.SF_SSH_KEY != '' && secrets.SF_USER != '' && secrets.SF_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build the live system
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=live system::$msg"' ERR
          # Container storage on the big disk: the image, the live layer and the squashfs need ~40 GB.
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt
          sudo podman build --pull=newer --cap-add sys_admin --security-opt label=disable \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            -t localhost/hearth-live:latest -f os/live/Containerfile os/live

      - name: Make the ISO (Titanoboa)
        id: iso
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=iso::$msg"' ERR
          git clone -q https://github.com/ublue-os/titanoboa.git /tmp/titanoboa
          git -C /tmp/titanoboa checkout -q 5c457c3d0518bd17e754be0fd98a60d29d26abb4
          out=/mnt/live-out
          sudo mkdir -p "$out"
          iso=$(cd /tmp/titanoboa && sudo TITANOBOA_OUTPUT_DIR="$out" ./main.sh localhost/hearth-live:latest)
          sudo chown -R "$(id -u):$(id -g)" "$out"
          v=$(sudo podman run --rm localhost/hearth-live:latest cat /usr/share/nimbus/version 2>/dev/null || echo latest)
          f="hearth-os-$v-live$SUFFIX.iso"
          mv "$iso" "$out/$f"
          (cd "$out" && sha256sum "$f" | tee "$f.sha256")
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Keep the ISO as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: hearth-os-${{ steps.iso.outputs.version }}-live${{ env.SUFFIX }}
          path: ${{ steps.iso.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload to SourceForge
        if: env.HAVE_SF == 'true' && inputs.upload
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
          V: ${{ steps.iso.outputs.version }}
          DIR: ${{ steps.iso.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf && chmod 600 ~/.ssh/sf
          ssh-keyscan -t ed25519,rsa frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          dest="/home/frs/project/$SF_PROJECT/$V"
          ssh="ssh -i $HOME/.ssh/sf -o IdentitiesOnly=yes"
          # rsync makes the version folder; --partial lets a dropped 7 GB upload resume on a re-run.
          rsync -e "$ssh" --partial --progress -t "$DIR"/hearth-os-*.iso "$DIR"/hearth-os-*.iso.sha256 \
            "$SF_USER@frs.sourceforge.net:$dest/"
          echo "Uploaded to https://sourceforge.net/projects/$SF_PROJECT/files/$V/"
          if [ -n "${SF_API_KEY:-}" ] && [ -z "$SUFFIX" ]; then  # the AMD/Intel ISO is the default download
            curl -fsS -H 'Accept: application/json' -X PUT \
              -d default=windows -d default=mac -d default=linux -d default=bsd -d default=solaris -d default=others \
              -d "api_key=$SF_API_KEY" \
              "https://sourceforge.net/projects/$SF_PROJECT/files/$V/hearth-os-$V-live$SUFFIX.iso" >/dev/null \
              && echo "Set as the default download"
          fi
          rm -f ~/.ssh/sf
