# Builds the Hearth live ISO: boots from a USB stick into Hearth so you can try it, with a welcome card and an
# "Install Hearth OS" installer. Made from Hearth OS on Anatase (ghcr.io/dragongamer9/hearth-os, by digest): one ISO
# for every PC (AMD, Intel and Nvidia graphics), with Titanoboa (the tool Bazzite's and Anatase's live ISOs use).
# Manual only (Actions › Hearth live ISO › Run workflow). The ISO is kept as a download on the run for 14 days
# (GitHub releases can't hold files over 2 GB) and uploaded to Hearth's Cloudflare R2 bucket under a fixed name
# (what the website's Download buttons point at): https://pub-f59beb6fa21c421ca4435ee7f42b3de4.r2.dev/
#   hearth-os-live.iso, with a .sha256, and latest.json.
#   Secrets (Settings › Secrets and variables › Actions): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# Installing needs no internet: the ISO carries the Hearth OS image itself, and the installed system then takes
# its updates from ghcr.io/dragongamer9/hearth-os:latest.
name: Hearth live ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which Hearth OS the ISO is (one ISO for every graphics card)'
        type: choice
        options: [anatase]
        default: anatase
      tag:
        description: 'Which build of it (latest: the published one; testing: the newest, not promoted yet)'
        type: choice
        options: [latest, testing]
        default: latest
      upload:
        description: 'Upload the ISO to the download site (Cloudflare R2, as hearth-os-live.iso; needs the R2_* secrets)'
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  live-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EDITION: ${{ inputs.edition || 'anatase' }}
      IMAGE: ghcr.io/dragongamer9/hearth-os
      TAG: ${{ inputs.tag || 'latest' }}
      HAVE_R2: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build the live system
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" -e "Copying blob" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=live system::$msg"' ERR
          case "$EDITION" in anatase) ;; *) echo "::error title=edition::unknown edition $EDITION"; exit 1;; esac
          case "$TAG" in latest|testing) ;; *) echo "::error title=tag::unknown tag $TAG"; exit 1;; esac
          # Container storage on the big disk: the image, the live layer and the squashfs need ~40 GB.
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt
          # The exact image (by digest): the live system is made from it, and a copy of it goes on the ISO so
          # installing needs no download. The installed system's updates come from :latest (hearth-install).
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:$TAG")
          ref="$IMAGE@$digest"
          echo "::notice title=Image::$IMAGE:$TAG = $ref"
          sudo podman build --pull=newer --cap-add sys_admin --security-opt label=disable \
            --build-arg EDITION="$EDITION" --build-arg BASE="$ref" --build-arg IMAGE_REF="$ref" \
            -t localhost/hearth-live:latest -f os/live/Containerfile os/live
          df -h / /mnt

      - name: Make the ISO (Titanoboa)
        id: iso
        run: |
          set -o pipefail
          exec > >(tee /tmp/step.log) 2>&1
          trap 'sleep 1; msg=$(grep -v -e "^\s*$" /tmp/step.log | tail -30 | cut -c1-300 | sed -e "s/%/%25/g" | sed -e ":a;N;\$!ba;s/\n/%0A/g"); echo "::error title=iso::$msg"' ERR
          git clone -q https://github.com/ublue-os/titanoboa.git /tmp/titanoboa
          git -C /tmp/titanoboa checkout -q 5c457c3d0518bd17e754be0fd98a60d29d26abb4
          out=/mnt/live-out
          sudo mkdir -p "$out"
          iso=$(cd /tmp/titanoboa && sudo TITANOBOA_OUTPUT_DIR="$out" ./main.sh localhost/hearth-live:latest)
          sudo chown -R "$(id -u):$(id -g)" "$out"
          v=$(sudo podman run --rm localhost/hearth-live:latest cat /usr/share/nimbus/version 2>/dev/null || echo latest)
          f="hearth-os-$v-live.iso"
          mv "$iso" "$out/$f"
          (cd "$out" && sha256sum "$f" | tee "$f.sha256")
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # A virtual PC boots the new ISO (UEFI-less, kernel from the ISO, plain virtio graphics with no 3D: the
      # case where WebKit's GBM buffers fail, as on the 0.1.6 USB) and must reach Hearth's screen: Hearth started,
      # anything that failed recovered, and something drawn. Fails before the upload, so a USB that doesn't come up
      # never replaces the one on the download site. Screenshots and the serial log are kept on the run.
      - name: Boot test (Hearth's screen must come up)
        env:
          V: ${{ steps.iso.outputs.version }}
          DIR: ${{ steps.iso.outputs.dir }}
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 xorriso python3-pil >/dev/null
          iso="$DIR/hearth-os-$V-live.iso"
          mkdir -p /tmp/boot boot-test
          xorriso -osirrox on -indev "$iso" -extract /images/pxeboot/vmlinuz /tmp/boot/vmlinuz -extract /images/pxeboot/initrd.img /tmp/boot/initrd.img
          sudo chmod 644 /tmp/boot/*
          kvm=""; [ -e /dev/kvm ] && { sudo chmod 666 /dev/kvm; kvm="-enable-kvm -cpu host"; }
          label=$(xorriso -indev "$iso" -pvd_info 2>/dev/null | sed -n 's/^Volume Id *: *//p' | head -1)
          echo "::notice title=ISO label::$label"
          qemu-system-x86_64 -m 6144 -smp 4 $kvm -machine q35 -cdrom "$iso" -kernel /tmp/boot/vmlinuz -initrd /tmp/boot/initrd.img \
            -append "root=live:CDLABEL=${label:-Hearth-Live} rd.live.image enforcing=0 console=ttyS0,115200 hearth.ci" \
            -vga none -device virtio-vga -display none -serial file:boot-test/serial.log \
            -qmp unix:/tmp/qmp.sock,server,nowait -nic user,model=virtio-net-pci &
          qpid=$!
          shot() { python3 - "$1" <<'PY'
          import json, socket, sys
          s = socket.socket(socket.AF_UNIX); s.connect('/tmp/qmp.sock'); f = s.makefile('rw')
          f.readline()
          for c in ({"execute": "qmp_capabilities"}, {"execute": "screendump", "arguments": {"filename": sys.argv[1]}}):
              f.write(json.dumps(c) + "\n"); f.flush(); f.readline()
          PY
          }
          for i in $(seq 1 84); do
            sleep 5
            [ $((i % 12)) -eq 0 ] && shot "boot-test/screen-$((i * 5))s.ppm" || true
            grep -q HEARTH-CI-END boot-test/serial.log 2>/dev/null && break
          done
          shot boot-test/screen-final.ppm || true
          kill $qpid 2>/dev/null || true
          tr -d '\r' < boot-test/serial.log | grep -a -E '^(HEARTH-CI|session:|bridge:|pages:|failed:)' > boot-test/report.txt || true
          tail -n 60 boot-test/report.txt
          # On the run page too (logs and downloads can't be read from everywhere): the last report, and the
          # serial console's last lines when there was no report.
          last=$(awk '/^HEARTH-CI t=/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' boot-test/report.txt | tail -n 45 | cut -c1-200)
          [ -n "$last" ] || last=$(tr -d '\r' < boot-test/serial.log | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | grep -av '^\s*$' | tail -n 45 | cut -c1-200)
          echo "::notice title=Boot test report::$(printf '%s' "$last" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          python3 - <<'PY'
          import glob, sys
          from PIL import Image
          problems = []
          rep = open('boot-test/report.txt', errors='replace').read()
          last = rep.rsplit('HEARTH-CI t=', 1)[-1] if 'HEARTH-CI t=' in rep else ''
          if 'HEARTH-CI-END' not in open('boot-test/serial.log', errors='replace').read(): problems.append("the live system didn't finish booting (no report)")
          if 'graphics:' not in rep: problems.append("Hearth never started (no graphics: line)")
          if 'Failed to create GBM buffer' in last and 'compatible way' not in rep: problems.append("WebKit's GBM buffers failed and Hearth didn't switch to the compatible way")
          if 'too many crashes' in rep: problems.append('Hearth kept crashing')
          for p in sorted(glob.glob('boot-test/*.ppm')):
              im = Image.open(p).convert('RGB'); im.save(p[:-4] + '.png')
          final = Image.open('boot-test/screen-final.png').convert('RGB').resize((320, 200))
          colors = final.getcolors(320 * 200) or []
          top = max(c for c, _ in colors) / (320 * 200) if colors else 1
          print(f"final screen: {len(colors)} colours, the commonest covers {top:.0%}")
          if top > 0.97: problems.append(f'the screen is blank ({top:.0%} one colour)')
          for p in problems: print('::error title=Boot test::' + p)
          sys.exit(1 if problems else 0)
          PY

      - name: Publish the boot test's screenshots (ci/live-shots)
        if: always()
        run: |
          [ -d boot-test ] || exit 0
          mkdir -p /tmp/shots && cp boot-test/*.png boot-test/report.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b live-shots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Live ISO boot test ($GITHUB_RUN_ID)" || exit 0
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/live-shots || true

      - name: Keep the boot test's screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-boot-test
          path: boot-test
          if-no-files-found: ignore

      - name: Keep the ISO as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: hearth-os-${{ steps.iso.outputs.version }}-live
          path: ${{ steps.iso.outputs.dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload to the download site (Cloudflare R2)
        if: env.HAVE_R2 == 'true' && inputs.upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          V: ${{ steps.iso.outputs.version }}
          DIR: ${{ steps.iso.outputs.dir }}
        run: tools/r2-upload.sh "$DIR/hearth-os-$V-live.iso" hearth-os-live.iso "$V"
