# Hearth TV (hosts/android-tv, docs/HEARTH-TV.md): Hearth Link built for Android (arm64 and 32-bit arm, the two
# kinds of chip TVs use), unit tests, the APK (hearth-tv-<version>, version from hosts/android-tv/VERSION, picked by
# the owner), uploaded as the hearth-tv-<version> artifact. Signed with the repository's key when the
# ANDROID_KEYSTORE_* secrets exist (the same key as Hearth for Android), otherwise the build's debug key.
# On main the APK goes on the newest GitHub Release as hearth-tv-<version>.apk, where Hearth TV's own updates find it.
# Also: every screen of the page, as the APK serves it, in a 1920×1080 browser with a pretend TV (tools/tv-ui-check.js),
# pictures on the branch ci/tv-shots-<branch>, to check against the approved mockups (docs/mockups/hearth-tv).
name: Hearth TV

on:
  push:
    paths: ['hosts/android-tv/**', 'hosts/hearth-link/**', 'hosts/hearth-core/**', 'hosts/linux/desktop/theme/palettes.json', 'tools/tv-ui-check.js', '.github/workflows/android-tv.yml']
  workflow_dispatch:

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

env:
  GRADLE_VERSION: '8.14.3'

jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosts/hearth-link
          key: android
      - name: Hearth Link for Android
        working-directory: hosts/hearth-link
        run: |
          set -o pipefail
          cargo install cargo-ndk --locked >/dev/null 2>&1 || cargo install cargo-ndk
          # The runner's own NDK (ANDROID_NDK_ROOT).
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          if ! cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26 build --release --bin hearth-link 2>&1 | tee build.log; then
            echo "::error title=Hearth Link for Android::$( (grep -E -B2 -A12 '^error' build.log | head -80; echo ===; tail -20 build.log) | tr '\n' '|' | cut -c1-3900)"
            exit 1
          fi
          mkdir -p out/arm64-v8a out/armeabi-v7a
          cp target/aarch64-linux-android/release/hearth-link out/arm64-v8a/libhearthlink.so
          cp target/armv7-linux-androideabi/release/hearth-link out/armeabi-v7a/libhearthlink.so
          echo "::notice title=Hearth Link for Android::$(du -h out/*/libhearthlink.so | tr '\n' ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-link-android
          path: hosts/hearth-link/out/
          if-no-files-found: error

  tv:
    needs: link
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        working-directory: hosts/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Version
        id: v
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Hearth TV::version $v"
      - name: Hearth Link for Android (from the link job)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hearth-link-android
          path: hosts/android-tv/app/src/main/jniLibs
      - name: Hearth Link in the APK?
        run: |
          if ls app/src/main/jniLibs/*/libhearthlink.so >/dev/null 2>&1; then
            chmod +x app/src/main/jniLibs/*/libhearthlink.so
            echo "::notice title=Hearth Link::in the APK ($(ls app/src/main/jniLibs | tr '\n' ' '))"
          else
            echo "::warning title=Hearth Link::not built: this APK has no Hearth Link (Settings › Hearth Link says so)"
          fi
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf %s "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/hearth-release.jks"
            echo "HEARTH_KEYSTORE=$RUNNER_TEMP/hearth-release.jks" >> "$GITHUB_ENV"
            echo "::notice title=Signing::signed with the repository's key"
          else
            echo "::notice title=Signing::no ANDROID_KEYSTORE_* secrets: signed with the debug key"
          fi
      - name: Unit tests
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log; then
            echo "::error title=Hearth TV unit tests::$( (grep -E -A8 '^e: |FAILED|What went wrong|AssertionError|Exception' test.log | head -60; echo ===; tail -25 test.log) | tr '\n' '|' | cut -c1-3900)"
            exit 1
          fi
      - name: Build the APK
        env:
          HEARTH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEARTH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEARTH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; then
            echo "::error title=Hearth TV build failed::$( (grep -E -A8 '^e: |error:|FAILED|What went wrong' build.log | head -60; echo ===; tail -25 build.log) | tr '\n' '|' | cut -c1-3900)"
            exit 1
          fi
          v='${{ steps.v.outputs.version }}'
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/hearth-tv-$v.apk"
          for f in assets/tv/index.html assets/tv/tv.js assets/tv/theme/palettes.json assets/tv/cleanup.json; do
            unzip -l "out/hearth-tv-$v.apk" | grep -q "$f" || { echo "::error title=APK::$f isn't in the APK"; exit 1; }
          done
          echo "::notice title=APK::$(du -h "out/hearth-tv-$v.apk" | cut -f1), $(unzip -l "out/hearth-tv-$v.apk" | grep -c 'assets/tv/theme/wallpapers/') wallpapers, $(unzip -l "out/hearth-tv-$v.apk" | grep -c libhearthlink.so) Hearth Link builds"
      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hearth-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-tv-${{ steps.v.outputs.version }}
          path: hosts/android-tv/out/*.apk
          if-no-files-found: error
      - name: Add the APK to the newest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          [ -n "$tag" ] || { echo "::warning title=No release::the APK stays an artifact"; exit 0; }
          gh release upload "$tag" "out/hearth-tv-$V.apk" --clobber --repo "$GITHUB_REPOSITORY"
          echo "::notice title=Released::hearth-tv-$V.apk on $tag"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hearth-tv-reports
          path: |
            hosts/android-tv/*.log
            hosts/android-tv/app/build/reports/
          if-no-files-found: ignore

  # Every screen of the page next to its mockup: the APK's own files, a pretend TV answering what Bridge.kt answers
  # and a pretend Jellyfin, at 1920×1080. Pictures on the branch ci/tv-shots-<branch> (and as a download).
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the page as Hearth TV
        run: |
          cd tools && npm i --no-save --no-audit --no-fund playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node tv-ui-check.js
      # The pictures go to the branch ci/tv-shots-<branch>, so they can be looked at without downloading anything.
      - name: Pictures to ci/tv-shots
        if: always()
        run: |
          [ -d tools/tv-shots ] || exit 0
          to="ci/tv-shots-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          cd tools/tv-shots && git init -q -b "$to" && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Hearth TV page ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$to"
          echo "::notice title=Pictures::branch $to ($(ls | wc -l) files)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearth-tv-page-shots
          path: tools/tv-shots/
          if-no-files-found: ignore
