# Hearth on Ubuntu: a generic initramfs (boots any PC) with ostree's root setup, bootc's module and the boot
# splash. Nvidia's modules load later from the system (only on Nvidia cards); nouveau stays out.
hostonly="no"
reproducible="yes"
compress="zstd"
add_dracutmodules+=" ostree bootc plymouth "
omit_drivers+=" nouveau nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem "
# Ubuntu's dracut doesn't find these for bootc's module by itself (bootcrew sets the same on Debian).
systemdsystemconfdir=/etc/systemd/system
systemdsystemunitdir=/usr/lib/systemd/system
