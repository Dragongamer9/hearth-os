# Background updates: bootc's timer downloads and stages the new Hearth OS image; by default it would also
# restart the PC to apply it, which a console mustn't do in the middle of a game. Stage only: it applies at the
# next restart (the same as Hearth's "Update now"). Off: sudo touch /etc/hearth/no-auto-update
[Unit]
ConditionPathExists=!/etc/hearth/no-auto-update
ConditionPathExists=!/etc/hearth-live

[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
ExecStartPost=-/usr/bin/flatpak update --system -y --noninteractive
